# Цели синка — куда этот репозиторий отправляет свою работу. Механика — `scripts/`
# (`pnpm sync`, `pnpm sync:targets`).
#
# `include` — что именно уезжает. Пути перечисляются относительно корня; всё, что не названо, в
# цель не попадает вовсе. `ignore` вычитается из уже выбранного (полезно, когда внутри включённой
# папки есть то, чему в цели не место).
#
# На целевой стороне мы НИКОГДА не пишем в рабочую ветку: пуш идёт в свою (`branch`), а принимают
# её мержем у себя. Так правки людей в рабочем репозитории не затираются нашим синком.

work-webcore:
  url: https://git.pit.protei.ru/112/platform/frontend/web-core
  # Наша ветка на той стороне — её принимают мержем, а не пушем в основную.
  branch: main
  source: dev
  # Уезжает группа целиком, ВМЕСТЕ со своим корнем: воркспейс, манифест со скриптами графа
  # задач, конфиг графа. Структура репозитория одна и та же по обе стороны — это и есть
  # web-core, где бы он ни лежал.
  #
  # `web-core/.release` уезжает ВМЕСТЕ с пакетами, и это главное: сценарий выпуска один и тот же
  # в обоих репозиториях, различаются только переменные (адрес реестра, токен). Там же лежит
  # `FLOW.md` — порядок для девопса. Исключить её значило бы отправить пакеты без того, чем их
  # выпускают, и без инструкции.
  include: [web-core]
  # Префикс снимается при раскладке: содержимое `web-core/` ложится в КОРЕНЬ цели, а не
  # подпапкой. Там этот репозиторий И ЕСТЬ web-core — дублировать имя папкой незачем, и корневые
  # файлы группы (воркспейс, граф задач, манифест) должны оказаться именно в корне, иначе ими
  # нельзя пользоваться. Чистка цели перед раскладкой идёт по тому же снятому списку.
  strip: web-core
  # Единственное, что не уезжает: `CLAUDE.md` — файл нашего харнесса (роль, зона, имя сессии
  # агента). Он про то, как работаем МЫ, и в чужом репозитории не значит ничего. Остальная дока
  # едет целиком: если README пакета ссылается на приложение из нашего воркспейса — это дефект
  # зоны, и чинится он в зоне, а не фильтром синка.
  exclude: ["**/CLAUDE.md"]


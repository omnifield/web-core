# Дорожная карта statboard — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана, не задним числом.
#
# Зона переименована из `dashboard` и вынесена из каталога приложений 2026-09-23 (решение user):
# статборд — САМОСТОЯТЕЛЬНЫЙ репозиторий, а не приложение рабочего дерева. Кода на этот момент
# нет ни строки: всё со статусом Open — ТЗ, а не отчёт. README.md/FAQ.md владелец пишет ПО ФАКТУ
# кода (дока от кода, не наоборот).
#
# Предмет первого захода — ПОДГОТОВКА репозитория: чтобы коллега клонировал, поднял и работал.
# Что именно он собирает внутри (компоненты, модули) — договаривает user отдельно, после
# подготовки.

categories:
  - category: Что это и где живёт
    items:
      - id: statboard-is-a-repo-not-an-app
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Статборд — самостоятельный репозиторий рядом с деревом, а не приложение каталога"
        description: |
          Решение user 2026-09-23. Папка лежит в корне рабочего дерева (`statboard/`), рядом с
          базой, и ведёт себя как её ровня: свой корень репозитория, свои скрипты, своя дока, своя
          цель синка. Про соседей по дереву не знает ничего и знать не должен — у коллеги их не
          будет.

          Отсюда следствие, на котором проще всего споткнуться: правила каталога приложений на эту
          зону НЕ распространяются. Общие прогоны рабочего дерева её не трогают, имя пакета в
          скоупе базы ей не нужно, порт с соседями по каталогу она не делит.

      - id: package-name-without-scope
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Имя пакета — `statboard`, без скоупа базы"
        description: |
          Решение user 2026-09-23. `@web-core/*` — скоуп публикуемых пакетов базы; статборд базой
          не является и в реестр не едет (`private`, версии нет). Наружу имя не видно вовсе:
          репозиторий поднимается своими скриптами, где имя не участвует.

          Цена названа сразу: под фильтр общих прогонов рабочего дерева пакет не попадает.
          Проверки запускаются своими скриптами — рядом с деревом `pnpm --filter statboard lint`,
          в своём репозитории просто `pnpm lint`.

      - id: packages-by-version
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Пакеты базы берутся номером версии — роль записи выбирает окружение, а не манифест"
        description: |
          В манифесте стоит номер (`"@web-core/ui": "^0.4.0"`), а не протокол `workspace:*`. Одна и
          та же строка работает в обе стороны: рядом с рабочим деревом подставляется живая соседняя
          папка, у коллеги — реестр, потому что нашего воркспейса там нет.

          Держится это на двух вещах, и обе лежат ВНЕ статборда: строка `statboard` в воркспейсе
          рабочего дерева и настройка `linkWorkspacePackages: true` там же (у pnpm она выключена по
          умолчанию). Строку добавил architect при выносе зоны.

          `workspace:*` здесь запрещён: вне воркспейса он не разрешается вовсе, то есть
          клонированный репозиторий с ним не встанет.

      - id: registry-address-and-override
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адрес реестра — литералом в `.npmrc`, переопределение — переменной через флаг установки"
        description: |
          Просьба user была «адрес реестра задаётся переменной окружения». В лоб это больше не
          работает, и это проверено, а не вспомнено: pnpm с версий 10.34.2/11.5.3 НАМЕРЕННО не
          разворачивает `${...}` в настройках реестра, приходящих из файлов репозитория — ни в
          `.npmrc`, ни в `pnpm-workspace.yaml`. Причина — закрытая дыра: клонированный репозиторий
          подставлял свой адрес и уводил на него чужой токен.

          Проверено на pnpm 11.17.0 2026-09-23: строка с переменной игнорируется с предупреждением;
          формы `npm_config_@<скоуп>:registry` и `pnpm_config_…` тоже не срабатывают. Источник —
          блог pnpm «Why pnpm no longer expands environment variables in a repository's .npmrc»
          (2026-06-11) и страница настроек pnpm, сверка 2026-09-23.

          Что работает и чем пользуемся:
          - `.npmrc` репозитория держит адрес ЛИТЕРАЛОМ — это дефолт, при котором «клонировал и
            поставил» работает без единой настройки;
          - другой реестр (например рабочий, когда репозиторий туда заедет) задаётся переменной при
            установке: `pnpm --@web-core:registry="$WEBCORE_REGISTRY" install`. Переменную
            разворачивает shell, pnpm получает готовое значение флагом. Проверено тем же днём:
            команда отдала версию пакета кита из нашего реестра;
          - постоянное переопределение у себя — `pnpm config set "@web-core:registry" <адрес>`:
            пишется в пользовательский конфиг, репозиторий не трогает.

          Токен для чтения НЕ нужен: реестр отдаёт пакеты анонимно и сертификат валидный —
          проверено `curl` без послаблений 2026-09-23, ответ 200. Нужен только сетевой доступ к
          адресу.

  - category: Подготовка репозитория — чтобы коллега клонировал и работал
    items:
      - id: repo-root-files
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Корневые файлы репозитория — папка обязана быть самодостаточной"
        description: |
          Сегодня в папке лежит только дока. Нужен полный корень репозитория:

          - `package.json`: имя `statboard`, `"private": true`, `packageManager` и `engines` — как
            в корне базы, чтобы версия менеджера пакетов и Node не выяснялись опытным путём;
            скрипты `dev`/`build`/`preview`/`lint`/`typecheck`/`test` вызывают инструменты НАПРЯМУЮ
            (vite, vitest, tsc, eslint). Граф задач рабочего дерева сюда не тянуть: он обслуживает
            дерево, которого у коллеги не будет;
          - `pnpm-workspace.yaml`: нужен даже одиночному репозиторию — в нём `allowBuilds` для
            `esbuild`, без которого установка встаёт (постинсталл-скрипты pnpm по умолчанию не
            пускает);
          - `.npmrc` с адресом реестра литералом (см. `registry-address-and-override`);
          - `.gitignore` и `.env_example` — с переменной адреса реестра и нашим значением примером;
          - конфиги на оснастке базы: `vite.config.ts`, `vitest.config.ts`, `tsconfig.json`, конфиг
            линтера — по три строки, из `@web-core/build` и `@web-core/lint`, как у приложений
            рабочего дерева;
          - `index.html` и `src/` с монтированием через `mountApp()` (`@web-core/solid`).

          Самописной обвязки не заводить: всё перечисленное уже умеет оснастка базы.

      - id: readme-clone-and-run
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "README в жанре «клонировал — запустил», и ни строкой про наше дерево"
        description: |
          Читатель этого README — коллега, у которого нет ни нашего рабочего дерева, ни доступа к
          нашей внутренней кухне. Ему нужны три вещи: что это, как поднять, как сменить адрес
          реестра.

          Требования:
          - команды приводятся полностью и в порядке выполнения, от клонирования до открытого
            адреса в браузере;
          - названы условия, без которых не заработает: версия Node, версия pnpm, сетевой доступ к
            реестру. Сказать прямо, что токен не нужен;
          - переопределение реестра — одной строкой с флагом, как в
            `registry-address-and-override`;
          - про рабочее дерево, наши службы, трекер и роли агентов — ни слова: в том репозитории
            ничего этого нет, и упоминание сделает доку ложной с первого дня.

          `FAQ.md` заводится вместе с первым кодом — тройка доков обязательна и здесь.

      - id: own-port-named-in-readme
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Свой порт с `--strictPort`, названный в README"
        description: |
          Значение выбирает владелец. Требование одно и оно про поведение: при занятом порте сборщик
          обязан упасть, а не встать молча на соседний — иначе проверка идёт не на том приложении.
          Соседей по каталогу у статборда больше нет, но рядом с рабочим деревом он поднимается
          вместе с витриной, и пересечения с её портом стоит избежать.

      - id: standalone-install-check
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Приёмка — установка ВНЕ рабочего дерева, а не «у меня работает»"
        description: |
          Условие закрытия подготовки: папка, вынесенная из дерева, ставится и поднимается.

          Прогон руками, с записью результата в этот роадмап:
          1. скопировать папку туда, где рядом нет ни одного пакета базы;
          2. снести `node_modules` и локальный lockfile, если оказались в копии;
          3. `pnpm install` — пакеты приезжают из реестра;
          4. `pnpm dev` — приложение открывается по своему адресу;
          5. `pnpm build`, `pnpm lint`, `pnpm typecheck`, `pnpm test` — зелёные.

          Почему именно так, а не сборкой в дереве: рядом с деревом пакеты подставляются живыми
          папками, и поверхность поставки (`exports`, `files`, типы из `dist`, диапазоны
          зависимостей) не проверяется вовсе. Ровно этот класс ошибок вскрылся на первой публикации
          базы 2026-09-22 — изнутри дерева ни одна из них не видна.

      - id: sync-target-for-work-repo
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Цель синка в рабочий репозиторий — заводит architect, когда будет адрес"
        description: |
          Отправка идёт тем же механизмом, что у базы: цель в `sync-targets.yaml` рабочего дерева,
          `include: [statboard]` и `strip: statboard`, чтобы содержимое папки легло в КОРЕНЬ цели, а
          не подпапкой. Пуш — в свою ветку, принимают мержем: правки коллег в рабочем репозитории
          наш синк не затирает.

          Пункт открыт, пока user не назовёт адрес рабочего репозитория. Работа владельца от этого
          не зависит: готовность проверяется `standalone-install-check`, а не фактом отправки.

      - id: devcontainer-and-ci-open-question
        type: decision
        status: Open
        priority: Low
        milestone: null
        name: "Нужны ли коллеге девконтейнер и CI — вопрос к user, не догадка владельца"
        description: |
          У базы в рабочем репозитории есть свой файл сборочного конвейера, у рабочего дерева —
          девконтейнер. Нужно ли то же самое статборду, зависит от того, как работают коллеги и куда
          репозиторий заедет; владелец этого знать не может.

          Пока не решено: ни девконтейнера, ни описания конвейера в подготовку не входит. Если
          окажется, что «без гемора» для коллег означает готовый контейнер — это отдельный пункт, а
          не довесок к скелету.

  - category: Что показываем — договаривается после подготовки
    items:
      - id: kit-first-then-modules
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Содержание демки: сначала компоненты кита, модули следом"
        description: |
          Направление, названное user 2026-09-23: коллеги должны собрать на наших инструментах
          что-то своё, и в приоритете UI-компоненты, а модули — следующим шагом.

          Конкретика (какие компоненты, какие экраны, что считается достаточным) НЕ определена
          намеренно: user договаривается о ней отдельно, после того как репозиторий готов к
          запуску. Владельцу не додумывать — пункт открыт именно как место для этого разговора.

      - id: modules-from-files-legacy
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Наследие прежнего предмета: модуль из студии приезжает файлом"
        description: |
          Зона заводилась 2026-09-22 под другой предмет — показ одного свойства конвейера: человек
          собирает модуль в витрине, выгружает файлом, кладёт в исходники, дописывает строку, модуль
          рисуется одетым и с данными.

          Решения того захода, которые пережили переименование и пригодятся, когда дойдёт до
          модулей:
          - файл модуля — ровно конверт службы пресетов (`{ kind, label, name, description?, state }`),
            а не свой формат: «выгрузить на диск» и «залить обратно» должны остаться одним
            действием;
          - рисование модуля новой механики не требует: сборка дерева из спеки и его отрисовка уже
            есть в базе (`@web-core/assembly`), реестр компонентов берётся у кита;
          - отказ сборки (в спеке оказалось имя, которого в ките нет) обязан быть виден на экране, а
            не только в консоли;
          - вид приезжает файлами: источник оформления — это две функции (`names()` и `css(name)`),
            и собрать его на месте дешевле, чем тянуть в репозиторий сетевого клиента.

          Пункт держится открытым как справка, а не как задание: порядок работ определяет
          `kit-first-then-modules` и разговор user.

log:
  - id: renamed-and-moved-out-of-apps
    type: plan
    date: 2026-09-23
    summary: >
      Зона `dashboard` переименована в `statboard` и вынесена из каталога приложений в корень
      рабочего дерева по решению user: это не приложение-доказательство, а самостоятельный
      репозиторий, который коллеги клонируют и на котором собирают своё нашими инструментами.
      Роадмап переписан под новый предмет: первым заходом идёт подготовка репозитория (корневые
      файлы, README для чужого человека, свой порт, приёмка установкой вне дерева), содержание
      демки обсуждается после неё. Прежние пункты про перенос модуля файлом сведены в один
      справочный — предмет пересматривается, но принятые тогда решения не выброшены.

      Тем же днём выяснено и записано решением: адрес реестра переменной окружения из файлов
      репозитория pnpm больше не принимает (закрытая дыра с уводом токена), поэтому дефолт —
      литерал в `.npmrc`, а переопределение — флагом при установке. Токен для чтения не нужен,
      реестр отдаёт пакеты анонимно.

      Что сделал architect при выносе: переименовал зону в харнессе, добавил статборд строкой в
      воркспейс рабочего дерева (иначе пакеты базы перестали бы подставляться живыми папками),
      убрал зону из состава и доки каталога приложений, назвал репозиторий в корневом README.

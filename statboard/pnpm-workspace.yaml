# Настройки менеджера пакетов для этого репозитория. Файл нужен даже одиночному проекту:
# разрешения на постинсталл-скрипты живут только здесь.
#
# Постинсталл-скрипты по умолчанию не пускаются, а обоим инструментам без своего платформенного
# бинаря нечем работать: esbuild стоит под сборкой, граф задач без бинаря не запускается вовсе.
allowBuilds:
  esbuild: true
  nx: true
minimumReleaseAgeExclude:
  - '@web-core/assembly@0.4.0'
  - '@web-core/build@0.4.0'
  - '@web-core/form@0.4.0'
  - '@web-core/io@0.4.0'
  - '@web-core/lint@0.4.0'
  - '@web-core/neurobox@0.4.0'
  - '@web-core/query@0.4.0'
  - '@web-core/skin@0.4.0'
  - '@web-core/solid@0.4.0'
  - '@web-core/style@0.4.0'
  - '@web-core/trace@0.4.0'
  - '@web-core/ui@0.4.0'

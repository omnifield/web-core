# Дорожная карта @web-core/store — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/build и packages/ui/src/table (categories → items, log → журнал решений); без
# milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Плоское хранилище
    items:
      - id: flat-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createStore/createAtom/createReducerAtom + солид-хуки
        description: |
          Означает: единая точка резолва @xstate/store + @xstate/store-solid — createStore,
          createAtom, createAtomConfig, createReducerAtom, useSelector, useStore, useAtom,
          useAtomState. Приложение не импортирует @xstate/store*/@xstate/solid напрямую.

      - id: create-action-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createActionStore — доменный стор (state + actions + selectors)
        description: |
          Означает: createActionStore(initialValue, ({setState, get}) => actions, options?) —
          createAtom под капотом, actionsFactory собирается одним вызовом вместо ручной сборки
          {get, actions}. Возвращает ReadonlyAtom<T> & {actions, use(selector?)} — .set() не
          публичный, actions единственный путь записи не только по конвенции, но структурно.
          Читается useAtom(store, selector)/useSelector (как обычный атом) или store.use(selector)
          — тот же вызов без отдельного импорта. Не сделан вызываемым напрямую (store(selector),
          зустанд-хук-стиль) — @xstate/store-solid отличает атом от конфига по typeof value ===
          "object", функция этой проверке не проходит и рвёт useAtom(store, selector) извне;
          проверено прогоном, не домыслом, разбор в FAQ.md. Закрывает разрыв с
          domain-store-recipe: тот был документацией ручной композиции, этот — сам примитив,
          синтаксис один в один с тем, что просил user (@tanstack/store's createStore(initial,
          actionsFactory)). 6 тестов в test/action-store.test.tsx.

      - id: action-store-selectors
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createActionStore — третий аргумент selectorsFactory (Pinia-getters)"
        description: |
          Означает: createActionStore(initial, actionsFactory, selectorsFactory?, options?) —
          selectorsFactory: () => TSelectors возвращает чистые (state) => R функции, каждая
          оборачивается в useAtom(atom, fn) один раз при создании (внутри своего createRoot, тот
          же приём, что у createResourceAtom/createBoundAtom для модульных синглтонов) и
          становится store.selectors.x() — готовым реактивным аксессором. Различение
          selectorsFactory/options по typeof === "function", тот же приём, что у
          createResourceAtom (keyed/unkeyed). Обратная совместимость: старый вызов без селекторов
          не изменился. Закрывает конкретную находку user: variantsByTag в
          apps/skin/entities/component/model/store.ts жила отдельной экспортированной функцией,
          собиралась в ShowcasePage через componentStore.use(variantsByTag) — работало, но
          "выглядит как собрать стор в компоненте", по словам user, та же претензия, что раньше
          была к createSignal вне стора. 3 новых теста в test/action-store.test.tsx (в т.ч.
          реальный рендер), разбор — FAQ.md.

      - id: create-action-store-family
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createActionStoreFamily — стор-на-ключ (store family)
        description: |
          Означает: createActionStoreFamily(initialValue, actionsFactory, selectorsFactory?,
          options?) — та же сигнатура, что у createActionStore, но возвращает не стор, а
          (key: K) => ActionStore<T, TActions, TSelectors>. Ленивое создание + кэш Map<K,
          ActionStore> под капотом: actionsFactory/selectorsFactory вызываются один раз на
          первое обращение к ключу, дальше отдаётся тот же инстанс. Без политики вытеснения —
          рассчитан на конечный/известный набор ключей (каталог компонентов, вкладки), не на
          неограниченный поток; для последнего в пакете уже есть createResourceAtom (один атом,
          ключ подставляется, переключение смывает предыдущее значение через AbortController +
          runId-guard). Критерий выбора между ними — не размер N, а одновременная живость: один
          инстанс в моменте, ключей может быть много → createResourceAtom; несколько сущностей
          одновременно не должны видеть данные друг друга → createActionStoreFamily. Закрывает
          дыру, найденную на конкретном баге: apps/skin component-manager держал feedData
          (FeedPreset/FeedManual/DemoStand) в одном глобальном createActionStore без ключа —
          при переключении между компонентами (кнопка ↔ чекбокс) данные путались, баг
          проявлялся только на повторном заходе (contentQuery с staleTime: Infinity отдаёт
          данные без промежуточного pending, async-гэп первого захода сам смывал старое
          значение и маскировал архитектурную причину). Ключи-заплатки ("если component !==
          current — сбросить") лечили бы симптом, не причину — сама возможность коллизии
          оставалась бы. Применение (componentManagerStore → componentManagerStoreOf) — не эта
          зона, apps/skin/src вне paths owner-store. 4 теста в test/action-store.test.tsx,
          включая реальный рендер с переключением ключа между двумя render-проходами.

      - id: selectors-cache-singleton-root
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Кэш параметризованных селекторов копит реактивные корни и не гасит ни одного"
        description: |
          Означает: createActionStore на каждый уникальный набор аргументов заводил подписку в
          СВОЁМ createRoot и держал её вечно — корней столько, сколько разных наборов аргументов
          прошло через страницу, и каждый пересчитывал селектор на каждое изменение state, молча.
          В FAQ это называлось осознанным компромиссом; компромисс держался на дисциплине
          вызывающего. Стало: подписка живёт в createSingletonRoot из @web-core/solid/rootless
          (примитив взят по заявке этой зоны) — корень со счётчиком слушателей, гаснет по уходу
          последнего читающего владельца, с задержкой на микротаск (переключение между
          читателями в одном тике подписку не пересоздаёт). Владелец корня задан явным null:
          по умолчанию примитив цепляет корень к первому вызвавшему, а тот ничем не лучше
          остальных. Вызов селектора ВНЕ реактивного владельца (тест, роутер, обычная функция)
          подписки больше не заводит вовсе — отдаёт разовое значение из снапшота, как .get():
          считать там некого, а прежняя реализация именно на этом пути и оставляла бессмертный
          корень. Что НЕ изменилось: сама Map по-прежнему растёт по числу наборов аргументов —
          уходит живая подписка, не запись в кэше. 2 новые пробы в test/action-store.test.tsx
          (счётчик вызовов самой функции селектора; обе на прежней реализации падают — проверено
          прогоном на откаченном файле), всего 37 тестов, eslint и tsc зелёные.

      - id: action-store-family-reactive-key
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "createActionStoreFamily — адресация стора аксессором ключа, не только значением"
        description: |
          Означает: семья принимает вторым режимом Accessor<K> вместо K и отдаёт тот же
          ActionStore — подписка переезжает на стор нового ключа сама, actions и selectors
          адресуют стор текущего ключа, состояние прежнего остаётся в Map нетронутым.
          Различение режимов — по typeof, тем же приёмом, что уже трижды применён в пакете;
          цена формы названа заранее: ключ-функция в реактивном режиме станет неадресуемым.
          Повод — заявка владельца apps/studio: familyOf(key) синхронен, поэтому реактивный
          ключ сегодня лечится только ремаунтом поддерева (EXAMPLES.md §6), и переключение
          между одновременно живыми сущностями трактуется как смена жизненного цикла — это
          спорит с самим критерием, по которому семья и заведена. Вместе с механикой правится
          §6: ремаунт становится частным случаем (когда сбросить поддерево и есть цель), а не
          общим рецептом.

  - category: Стейт-машины
    items:
      - id: machine-layer
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Подпуть ./machine — полноценный xstate
        description: |
          Означает: createMachine/setup/assign/fromPromise/guards/акторы + useMachine/useActor/
          useActorRef/fromActorRef. xstate и @xstate/solid — опциональные peer, не подмешаны в
          корневой `.`.

  - category: Аддоны
    items:
      - id: addons-subpaths
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: ./persist, ./undo, ./reset, ./validate
        description: |
          Означает: реэкспорт @xstate/store/{persist,undo,reset,validate} отдельными подпутями —
          @xstate/store НАША зависимость, без реэкспорта её подпути недостижимы строгим pnpm.

      - id: persist-atom
        type: feature
        status: Done
        priority: High
        milestone: null
        name: persistAtom — persist для createAtom (localStorage/sessionStorage)
        description: |
          Означает: @web-core/store/persist экспортирует persistAtom(atom, {name, storage?,
          serialize?, deserialize?}) — гидратация из storage при вызове + подписка на .set() для
          записи. Закрывает дыру: upstream persist() из @xstate/store — StoreExtension, вешается
          через .with() на createStore, у createAtom .with нет вовсе. До этого пункта потребители
          (apps/skin/entities/openapi/model/endpoint/store.ts) вручную писали
          localStorage.getItem/setItem + JSON.parse/stringify на каждый персистентный атом.
          Local/session переключаются готовым createJSONStorage(() => sessionStorage) из того же
          подпути — новой опции под них не заводили. 5 тестов в test/persist.test.tsx.

      - id: mutate-addon
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "./mutate — Immer-рецепт для setState/atom.set (ВРЕМЕННОЕ место)"
        description: |
          Означает: @web-core/store/mutate экспортирует mutate(recipe), castDraft, castImmutable,
          тип Draft. mutate(recipe) — обёртка над immer's produce(recipe), возвращает (state) =>
          state, годится и в createAtom.set, и в createActionStore's setState (обе сигнатуры
          (prev) => next). immer — ОБЫЧНАЯ dependency пакета (как @xstate/store), НЕ peer —
          первая версия сделала peer по аналогии с ./machine, ошибочно (разбор в FAQ.md); apps/skin
          immer не ставит и не импортирует, весь набор через ./mutate. 5 тестов в
          test/mutate.test.tsx, включая castDraft на readonly-массиве внутри поля. ВАЖНО: user
          попросил прямым текстом вынести отдельной утилитой, потому что "потом перенесём" — не
          обосновано доменной границей (в отличие от io-owns-zod), разовая просьба под этот кейс.
          Не переносить самостоятельно без нового явного запроса — см. log.

      - id: persist-atom-indexeddb
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: persistAtom — асинхронный storage (IndexedDB)
        description: |
          Означает: persist-atom сегодня читает storage.getItem синхронно — если он вернёт
          Promise (async-адаптер вроде IndexedDB), гидратация молча не происходит (typeof raw
          === "string" не пропускает Promise). Когда IndexedDB понадобится реально — либо
          persistAtom научится await'ить getItem и гидрировать асинхронно (сигнатура персиста
          при этом меняется — вызывающий код должен знать, что атом не готов сразу), либо рядом
          появится отдельный helper по образцу rehydrateStore у @xstate/store/persist.

  - category: Ресурс — синхронно и асинхронно
    items:
      - id: create-async-atom-broken
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "createAsyncAtom из @xstate/store теряет зависимости после первого резолва"
        description: |
          Означает: подтверждено прогоном на голом @xstate/store@4.2.3 без Solid — атом,
          получивший значение хотя бы раз, больше не реагирует на смену входа, которым сам же
          был инициирован. Не реэкспортируется — локальный export function createAsyncAtom():
          never перекрывает звёздочный реэкспорт (именованный экспорт побеждает у ES-модулей при
          коллизии имён), вызов по апстримной сигнатуре падает на тайпчеке. Разбор — FAQ.md.

      - id: create-resource-atom
        type: feature
        status: Done
        priority: Critical
        milestone: null
        name: createResourceAtom — один флоу для sync и async
        description: |
          Означает: createResourceAtom(fetcher) без ключа и createResourceAtom(source, fetcher)
          с ключом (Solid-аксессор) отдают один и тот же {status,data,error}. Реактивность на
          Solid createEffect, не на автотрекинге @xstate/store. Race-guard (AbortController,
          runId) на смену ключа до резолва предыдущего запроса. 4 теста в
          test/resource.test.tsx.

      - id: create-bound-atom
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createBoundAtom — атом, ведомый внешним Solid-аксессором
        description: |
          Означает: createBoundAtom(source, options?) — писуемый createAtom, значение которого
          обновляется createEffect(() => atom.set(source())) при смене source. Закрывает дыру:
          потребитель (apps/skin/entities/component/model/store.ts, currentComponent/
          currentOutfit, синк с пропом страницы/skin.worn()) писал голый solid createSignal +
          setter, минуя атомы пакета — не было ручки под "атом, толкаемый снаружи". Форма
          подтверждена чужим прецедентом (atomEffect/useAtomEffect у Jotai), не изобретена с нуля
          — разбор в FAQ.md. 4 теста в test/bound.test.tsx.

  - category: Структура пакета
    items:
      - id: theme-per-subpath
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "src/ по темам вместо плоского списка файлов"
        description: |
          Означает: каждый экспортируемый подпуть — своя папка (по образцу packages/build).
          Промежуточный шаг — folder-per-subpath один в один с exports, включая `.` → src/flat/
          — заменён следующим пунктом.

      - id: engine-machine-addons-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "src/index.ts (поверхность) + engine/ + machine/ + addons/"
        description: |
          Означает: src/index.ts — один export * from "./engine/index.js", вся логика (реэкспорт
          @xstate/store-solid, createResourceAtom, заглушка createAsyncAtom) — в src/engine/.
          По образцу packages/assembly (index.ts как "поверхность пакета"), но без объединения с
          machine/ — машина остаётся независимым подпутём, не подмешивается в корень.

      - id: solid-via-facade
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Solid — через @web-core/solid, не вендором напрямую"
        description: |
          Означает: createRoot/createEffect/Accessor приезжают из @web-core/solid, render в
          тестах — из @web-core/solid/web; прямых импортов "solid-js"/"solid-js/web" в пакете
          больше нет (чужой @xstate/store-solid тянет вендора сам — это его дело, не наше).
          @web-core/solid — обычная dependency (workspace:*), solid-js остаётся peer: фасад
          объявляет свой peer сам, а JSX-трансформ в тестах резолвит вендора по условиям
          vitest.config.ts. Ребро разрешено архитектором вместе со взятием
          @solid-primitives/rootless: примитив приезжает подпутём фасада
          (@web-core/solid/rootless), тянуть его мимо фасада запрещено. 35 тестов, eslint и
          tsc зелёные. pnpm-lock.yaml от установки лежит ВНЕ зоны — коммитит architect.

  - category: Документация
    items:
      - id: readme-engine-template
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README по общему шаблону "движок" — первый пилот
        description: |
          Означает: Анатомия/Использование/Настройки/Состояния/IO/Сборки/Рецепт заполнены
          фактами без обоснований (обоснования — FAQ.md). IO разделён на явные Вход/Выход по
          запросу после первого прохода одним списком.

      - id: faq-roadmap
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: FAQ.md и ROADMAP.yaml — первое заполнение
        description: |
          Означает: FAQ.md сгруппирован по темам (движок ресурсов / структура пакета / аддоны /
          стейт-машины), каждый ответ со ссылкой на проверку. ROADMAP.yaml — по образцу
          packages/ui/src/table (не по составу полей, по ведению: Done-пункты сразу с описанием,
          log — датированный журнал решений).

      - id: domain-store-recipe
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Рецепт: доменный стор — первая версия, ручная композиция createAtom (заменена create-action-store)"
        description: |
          Означает: первая версия README-рецепта собирала {get, actions} вручную поверх
          createAtom — без структурного запрета на .set() наружу, actions только по конвенции.
          Заведено после предложения перейти на @tanstack/store под паттерн state+actions;
          разбор, почему смена вендора не нужна — в FAQ.md. В README текст рецепта заменён на
          create-action-store: тот же вывод (вендор не нужен), но настоящий примитив вместо
          ручной сборки — синтаксис ближе к тому, что просил user, и .set() закрыт структурно, не
          конвенцией. Пункт оставлен в истории ради лога решения, в README ручной версии больше
          нет.

  - category: Не сделано
    items:
      - id: addons-composition-untested
        type: feature
        status: Backlog
        priority: Low
        milestone: null
        name: Композиция аддонов (.with().with()) не проверена тестом
        description: |
          Означает: пример из README (persist+undoRedo+reset цепочкой) — документация, не проба.
          test/ сегодня проверяет createStore/createMachine/createResourceAtom по отдельности,
          не совмещённые через .with().

log:
  - id: solid-facade-and-rootless
    type: plan
    date: 2026-09-21
    summary: >
      Разбирая заявку владельца apps/studio (реактивный ключ у createActionStoreFamily),
      сверились с каталогом solid-primitives — под саму заявку там ничего не подошло
      (createMemoCache кэширует значение по ключу, а нужна переезжающая подписка), зато сверка
      ткнула в собственный дефект: кэш параметризованных селекторов заводит реактивный корень на
      каждый набор аргументов и не гасит ни одного. Заявка архитектору на два примитива:
      rootless (createSingletonRoot под этот кэш) и memo (createLazyMemo под eager-подписку
      0-арных селекторов). Решение архитектора: rootless взят подпутём @web-core/solid/rootless,
      memo отклонён (тянет scheduled ради функций, помеченных вендором устаревшими, а нужная к
      нему не обращается) — возражений нет, повод был слабый и подавался как необязательный.
      Смежное решение оттуда же, шире самой заявки: пакет переходит на @web-core/solid целиком,
      а не тянет один примитив в обход фасада. Сделано первым, отдельным шагом — без ребра
      @web-core/solid/rootless строгим pnpm не резолвится, то есть всё остальное на него
      опирается. Порядок дальше: singleton-root в кэш селекторов → реактивный ключ семьи и §6

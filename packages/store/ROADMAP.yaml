  - id: action-store-callable-rejected
    type: plan
    date: 2026-09-13
    summary: >
      user увидел createActionStore в деле (router.tsx → componentStore.actions.setComponent,
      showcase → useAtom(componentStore, selector)) и попросил "пушку" — стор сам как функция-
      селектор, зустанд-хук-стиль (const x = store(selector) вместо useAtom(store, selector)).
      Первая попытка (Object.assign(fn, {get, subscribe, actions})) сразу упала тестом:
      @xstate/store-solid's useAtom различает атом и AtomConfig проверкой isAtom = typeof value
      === "object" (dist/xstate-store-solid.js:9,76) — функция эту проверку не проходит, падает в
      definition.createAtom(...), которого нет, TypeError в реальном рендере. Проверено прогоном
      test/action-store.test.tsx, не домыслом. Технически невозможно совместить "вызываемый как
      функция" и "проходит isAtom чужого пакета" — взаимоисключающе на уровне typeof. Решение —
      store.use(selector): остаётся обычным объектом (useAtom(store, selector) извне продолжает
      работать), .use — тот же вызов без отдельного импорта. Ближайший безопасный аналог Zustand.


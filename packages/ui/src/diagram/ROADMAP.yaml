# Дорожная карта диаграмм — формат тот же, что у table/ROADMAP.yaml, спроектирован ПОД механику
# Windshift (см. table/ROADMAP.yaml, шапка — маппинг не повторяю здесь дословно, он идентичен).
# Этот файл — единственный источник правды: роадмап ведётся по коду, статус проставляется рядом
# с работой, в момент когда она сделана.
#
# Что куда превращается при синке — то же, что у table:
#   diagram (Epic) → category (Story) → item (Task/Bug) → status/priority/milestone/size/
#   depends_on/id (кастомные поля и связи Windshift) → log (страница "Решения", не задачи).

milestones:
  - id: data-model
    name: Модель данных
    target_date: "2026-12-31"
    description: >
      График строится из данных, а не из литералов в файле сборки. Первая волна по порядку:
      всё остальное (любой новый вид, легенда, подсказка) встаёт поверх неё, и чем позже её
      двигать, тем больше уже построенного придётся переделывать.

  - id: basis
    name: Основа
    target_date: "2026-12-31"
    description: >
      Голая система координат — ось, сетка. Ничего не рисует само по себе, но без этого ни одна
      серия не встанет на своё место.

  - id: cartesian-series
    name: Декартовы серии
    target_date: "2026-12-31"
    description: >
      Первый реально показываемый график. Каждая серия почти бесплатна, раз ось/шкала есть —
      line/area через d3-shape, bar/point — чистая арифметика по шкале, без генератора путей.

  - id: furniture
    name: Арматура
    target_date: "2026-12-31"
    description: >
      Без легенды/подсказки график — картинка, не инструмент. В той же волне, что первая серия —
      «график без tooltip» не то, что кто-то реально попросит.

  - id: cartesian-composition
    name: Композиция декартовых серий
    target_date: "2027-03-31"
    description: "Несколько серий на одном графике — группировка, стек, вторая ось."

  - id: cartesian-extra
    name: Декартовы серии, второй набор
    target_date: "2027-03-31"
    description: >
      Виды, которые живут в той же системе координат, но не выводятся из line/area/bar/point
      заменой одной части: пузырь, тепловая карта, ящик с усами, свечи, водопад.

  - id: radial
    name: Радиальные серии
    target_date: "2027-03-31"
    description: >
      Вторая система координат (полярная, не декартова) — тот же уровень важности, что декартовы
      серии, просто позже по волне: сперва одна механика встаёт твёрдо, потом вторая.

  - id: hierarchy-flow
    name: Иерархии и потоки
    target_date: "2027-06-30"
    description: >
      Третья семья — у неё нет осей вовсе: раскладку считает не шкала, а алгоритм укладки
      (плитка, кольца, потоки). Отдельная веха потому, что каждый вид тянет свой модуль d3 и
      свою форму данных (дерево/рёбра), а не строку таблицы.

  - id: interactivity
    name: Интерактивность
    target_date: "2027-06-30"
    description: "Zoom/pan/brush — своя, не связанная с осями/сериями подсистема поверх готового."

  - id: data-updates
    name: Живые данные
    target_date: "2027-06-30"
    description: "Обновление данных без пересборки графика с нуля — плавный переход между состояниями."

  - id: export
    name: Экспорт
    target_date: "2027-06-30"
    description: "Отдельная подсистема, ни от чего не зависит — сериализация готового SVG."

  - id: accessibility
    name: Доступность
    target_date: "2027-06-30"
    description: "Текстовое summary и клавиатурная навигация по точкам — та же категория, что у table."

  - id: performance-at-scale
    name: Производительность на масштабе
    target_date: "2027-09-30"
    description: >
      Самый низкий приоритет НАРОЧНО — та же логика, что виртуализация у table: canvas как
      альтернативный слой рендера меняет ВСЁ сразу, чем позже встраивать, тем меньше слоёв фич
      придётся сверять с ним задним числом.

categories:
  - category: Модель данных
    items:
      - id: series-as-data
        type: feature
        status: Done
        priority: Critical
        milestone: data-model
        size: L
        name: "Описание серий — данные, а не код: io-вход, bind на корень, стандартная структура"
        description: |
          Означает: график получает данные снаружи и рисует их, а не показывает семь цифр, которые
          автор сборки вписал в файл. Сегодня — ровно наоборот: `playground/assemblies/*` держат
          массив данных, обе шкалы и аксессоры-функции литералами, `entity/io.ts` у компонента нет
          вовсе, и `bind` не объявлен ни на одном узле.
          Образец устройства — `table` (`packages/ui/src/table`), разобран с architect 2026-09-21:
          её `columns` это ДАННЫЕ (`{accessorKey, header}` — JSON без функций и JSX), сборка
          `basic` состоит из одного узла `root · bind: data, columns, defaultSorting`, а корень без
          `children` растит шапку/строки/ячейки сам и отдаёт настоящую живую таблицу.
          Диаграмма повторяет это один в один: `data` — мешок строк (кит не знает и не проверяет
          полей), `series` — список описаний серий тем же способом, что `columns` у таблицы: вид
          (`line`/`area`/`bar`/`point`/…), имя поля по x, имя поля по y, подпись, цвет. Имена полей
          строками (`x: "day"`), не замыканиями: функция не переживает ни JSON, ни хранение в
          пресете, ни редактор — ровно тот же довод, по которому `columns` у таблицы не несёт
          `ColumnDef` с рендером.
          Реализация: своя — обход `series`, сопоставление вида серии с уже написанным компонентом
          части.
          Примечание: у уже сделанных `line`/`area`/`bar`/`point` (ниже, Done) меняется ВХОД —
          `data`+`xScale`+`yScale`+аксессоры-функции уходят из схемной сборки в рукописный путь
          (`render-prop-children`). Сам рендер и математика остаются как есть, переписывать их
          заново не нужно.
          Сделано (2026-09-21): `entity/io.ts` заведён (`data`/`series`/`axes`/`insets`), сборка —
          один узел `root` с `bind`, без детей, корень растит структуру сам
          (`components/default-body.tsx`, зеркало `DefaultTableBody`). Имена полей, подпись и цвет
          приезжают данными. Первая редакция клала в данные ещё и ВИД серии (`kind`) — поправлено
          тем же днём, см. `shape-is-a-prop-not-data` ниже.

      - id: shape-is-a-prop-not-data
        type: bug
        status: Done
        priority: Critical
        milestone: data-model
        size: M
        depends_on: [series-as-data]
        name: "Форма графика — проп сборки, а не поле данных: одни данные показываются любым видом"
        description: |
          Найдено architect'ом сразу после первой редакции модели данных (2026-09-21), дословно:
          «данные задают форму. отступы лейблов и цвета — ок, а вот форма из данных не ок. в идеале
          я хочу одни и те же данные отобразить в разных вариантах диаграмм».
          Означает: описание серии говорит только ЧТО показывать (поля, подпись, цвет), а чем это
          нарисовано — решает показ. Иначе «показать ту же выручку линией вместо столбцов» это
          правка датасета, а не выбор вида.
          Реализация: `shape` (`line`/`area`/`bar`/`point`) — обычный проп корня, дефолт `line`; по
          нему же выбирается вид x-шкалы (`bar` → категориальная). Прецедент — `enableRowSelection`
          у таблицы: фича включается обычным пропом, а не `settings` паспорта.
          Примечание: паспортной настройкой сделать нельзя — перечень имён настроек закрыт и лежит
          в `packages/skin` (чужая зона); осью варианта тоже нельзя — кит по канону не знает имён
          вариантов, а тут обязан понимать, что `bar` это столбцы.
          Сделано (2026-09-21): `kind` убран из io-схемы серии, `shape` добавлен в `DiagramRootProps`
          и в `DiagramFrame`; сборок снова четыре (`line`/`area`/`bar`/`point`) — дерево у всех
          одинаковое, отличаются одним пропом, поэтому переключатель сборки в витрине работает как
          переключатель вида графика.

      - id: combo-layers
        type: feature
        status: Backlog
        priority: Medium
        milestone: cartesian-composition
        size: L
        depends_on: [shape-is-a-prop-not-data]
        name: "Комбинированный график — слои разной формы над одними осями"
        description: |
          Означает: столбцы и линия поверх них на одном графике (объём столбцами, тренд линией) —
          то, что `shape` одним пропом на весь график выразить не может.
          Отложено architect'ом 2026-09-21 («комбо пока в бэклог») при выборе между простым `shape`
          и сразу слоями. Цена отсрочки названа заранее: когда комбо понадобится, описание вида
          станет списком слоёв (у каждого своя форма и свои поля), а `shape` останется короткой
          записью для случая «весь график одной формой».
          Реализация: своя — слой поверх уже сделанного (одна форма на слой, общие шкалы), плюс
          связка с `dual-axis`, если у слоёв разный масштаб.
          Важно: форма слоя живёт в описании ПОКАЗА, не в данных — то же правило, которое закрыл
          `shape-is-a-prop-not-data`, иначе комбо вернёт вид обратно в датасет.

      - id: color-from-data
        type: feature
        status: Done
        priority: Critical
        milestone: data-model
        size: M
        depends_on: [series-as-data]
        name: "Цвет приходит в данных — у компонента своего цвета нет вовсе"
        description: |
          Означает: чем красить серию или точку, говорят данные. Наш бэк отдаёт цвет сразу в
          нужном виде, чужие данные проходят через адаптер (не зона `packages/ui`) — компонент не
          назначает цвет ни по порядку серии, ни по какому-либо своему правилу.
          Сегодня цвет прибит в рецепте: `line`/`area`/`bar`/`point` красятся `var(--accent-11)`,
          компонент рисует `currentColor`. Следствие — две серии одного цвета, разноцветный пирог
          невозможен в принципе, «выше порога — красным» нечем сделать.
          Реализация: часть объявляет в паспорте CSS-переменную с `setBy: "kit"` (живой прецедент —
          `--active-color` у `tree-view`), кит кладёт в неё пришедшее из данных значение, рецепт
          красится по этой переменной. В данных лежит ГОТОВОЕ значение цвета
          (`"var(--type-number-9)"` или любое CSS-значение), не имя категории палитры: иначе
          компоненту пришлось бы самому дописывать ступень (`-9`/`-11`), то есть решать за автора
          палитры.
          Примечание: цвет — поле точки данных, а не только серии; «вся серия одного цвета» —
          вырожденный случай, когда у всех точек цвет один. Цвета в данных нет — красит рецепт, как
          сейчас; фолбэк живёт в форме, не в коде компонента. Серийные категории палитры заводит
          автор палитры в пресете (прецедент — `type-string`/`type-number`/… в `omnifield-palette`),
          в `packages/skin` для этого заводить нечего.
          Сделано (2026-09-21): `color` у всех четырёх серий, `colorOf` (цвет точки) у `bar`/`point`;
          значение из данных ставится инлайновым `color` на узел и поэтому бьёт правило рецепта по
          специфичности, а не по порядку. Переменной в паспорте для этого не понадобилось: инлайн
          уже сильнее, и лишняя запись в паспорте/срезе редактора была бы работой впустую. Цвета в
          данных нет — инлайна нет вовсе, красит рецепт.

      - id: scales-on-root
        type: feature
        status: Done
        priority: Critical
        milestone: data-model
        size: M
        depends_on: [series-as-data]
        name: "Шкалы считает корень и раздаёт детям — явная шкала остаётся рукописному пути"
        description: |
          Означает: корень берёт данные и свой размер, считает шкалы (вид шкалы — непрерывная,
          временная, категориальная, логарифмическая; границы — из данных, если не заданы) и
          раздаёт их частям сам. То же место, которое у `table` занимает инстанс движка: им владеет
          корень, дети получают готовое.
          Реализация: d3-scale (уже в зависимостях) — считает шкалу, раздача через контекст корня.
          Примечание: это РАЗВОРОТ уже записанного решения. README компонента сегодня утверждает
          «`scale` — ВСЕГДА явный проп, никогда не читается из контекста», взято дословно у visx.
          Для рукописного JSX это верно и остаётся: явная шкала доступна через рендер-проп
          (`render-prop-children`) и перекрывает посчитанное. Для хранимой сборки — нерабочее:
          шкала это объект-функция, её нельзя ни положить в пресет, ни отдать по сети, ни
          отредактировать в редакторе. Оба пути живы, ни один не костыль; README правится по факту
          правки кода, не раньше.
          Сделано (2026-09-21): корень считает обе шкалы (`linear`/`band`/`time`/`log`, границы из
          данных или из `axes[].domain`) и отдаёт их частям. Вид шкалы выводится по виду серии и по
          типу значений; `DiagramFrame` (геометрия, шкалы, оси) — то, что получает рукописный путь.

      - id: axes-derived-from-series
        type: feature
        status: Done
        priority: High
        milestone: data-model
        size: S
        depends_on: [scales-on-root]
        name: "Оси выводятся из серий, явное описание — уточнение, а не обязанность"
        description: |
          Означает: если все серии смотрят полем `day` по горизонтали, ось x одна и корень заводит
          её сам — простейший график не требует описывать оси отдельно. Явное описание оси (подпись,
          формат подписи, своя сторона, свои границы) разрешено и перекрывает выведенное.
          Реализация: своя — разбор `series` на набор нужных осей.
          Примечание: решение architect 2026-09-21. Довод — иначе минимальный график описывается
          вдвое длиннее, чем он есть по смыслу.
          Сделано (2026-09-21): оси выводятся из серий, `axes[]` уточняет подпись, число делений, вид
          шкалы, границы и `hidden`.

      - id: render-prop-children
        type: feature
        status: Done
        priority: High
        milestone: data-model
        size: S
        depends_on: [scales-on-root]
        name: "Рукописный путь — children-рендер-проп с живыми шкалами и размерами"
        description: |
          Означает: тому, кто пишет JSX руками и хочет полный контроль (своя форма точки, свой
          порядок слоёв, чужой компонент внутри графика), корень отдаёт живые шкалы и геометрию
          рендер-пропом — ровно как `TableRoot` отдаёт инстанс таблицы.
          Реализация: своя, повторяет `components/root.tsx` таблицы (`local.children ?
          local.children(table) : <DefaultTableBody .../>`).
          Примечание: превьюер дерева сборки передаёт `children` готовым поддеревом и функцию
          передать не может — поэтому пропуск `children` обязан рисовать СТАНДАРТНУЮ структуру
          (`series-as-data`), а не пустоту. Тот же урок, что уже записан у таблицы.
          Сделано (2026-09-21): `children` корня принимает и функцию (даёт `DiagramFrame`), и готовое
          поддерево. Найдено живьём при первом же прогоне: превьюер отдаёт `null` у узла без детей —
          проверка на `!== undefined` принимала это за «содержимое задано» и рисовала пустоту
          (`FAQ.md`).

      - id: plot-inset-default
        type: feature
        status: Done
        priority: Medium
        milestone: data-model
        size: S
        depends_on: [scales-on-root]
        name: "Поле под подписи осей — разумный дефолт, при нужде переопределяется в данных"
        description: |
          Означает: свободное место между краем `<svg>` и областью построения, куда встают подписи
          осей. Сегодня это константа `MARGIN` в каждом файле сборки, подобранная на глаз.
          Реализация: дефолт в компоненте, необязательное поле в данных поверх него.
          Примечание: решение architect 2026-09-21 — «зададим дефолт, а если надо отрегулировать,
          принесём в данных; может и вообще не понадобится». Рассматривались и отклонены как
          преждевременные: чтение числа из CSS-переменной рецепта и обмер реальных подписей
          (приём ECharts). Известный предел выбранного пути: дефолт в пикселях перестанет попадать,
          если форма заметно увеличит шрифт подписей — тогда и вернуться к обмеру, не заранее.
          Сделано (2026-09-21): дефолт `{ top: 12, right: 12, bottom: 28, left: 44 }` в корне,
          переопределение полем `insets` в данных.

      - id: size-from-recipe-not-assembly
        type: bug
        status: Done
        priority: High
        milestone: data-model
        size: S
        depends_on: [scales-on-root]
        name: "Размер графика задаёт рецепт — сборка не носит пиксели, корень меряет себя сам"
        description: |
          Найдено architect'ом живьём на витрине (2026-09-21): «график сильно сжат... и из сборок
          надо убрать хардкод размеров».
          Означает: `<svg>` держит две разные величины — размер элемента на странице и внутреннюю
          систему координат (`viewBox`). Сборки объявляли 360×240 пропами, рецепт при этом растягивал
          элемент на ширину карточки (`inlineSize: 100%`) — браузер вписывал рисунок в бокс по
          пропорциям, с полями и уменьшенным масштабом.
          Реализация: `ResizeObserver` на корне — система координат равна измеренному размеру, одна
          единица `viewBox` равна пикселю; `width`/`height` остаются необязательными пропами для
          рукописного случая с фиксированной системой координат.
          Примечание: `footprint` компонента тут ни при чём — он и был `wide`, максимум из трёх
          (`compact`/`regular`/`wide`, перечень закрыт и живёт в `packages/skin`). Высоту в витрине
          решает рецепт формы, она поднята до `24rem` в записи наряда, не в коде кита.
          Сделано (2026-09-21): корень меряет себя, пиксели убраны из всех четырёх сборок, размер
          остался за рецептом. Тест: без пропов размера корень не ставит `width`/`height` вовсе и
          держит запасную систему координат (среда без раскладки — не повод падать).

      - id: category-axis
        type: feature
        status: Done
        priority: High
        milestone: data-model
        size: S
        depends_on: [scales-on-root]
        name: "Подписанная категориальная ось — закрытие названного предела столбцов"
        description: |
          Означает: у столбчатой диаграммы появляются подписи категорий по горизонтали.
          Сегодня их нет: `axis`/`grid` зовут `scale.ticks()`, которого у категориальной шкалы нет
          вовсе (честный названный предел, см. `FAQ.md` и сборку `bar`).
          Реализация: d3-scale (`scaleBand`'s `domain()` вместо `ticks()`) — деления у категориальной
          шкалы берутся из самого домена, отдельной математики не нужно.
          Примечание: чинится именно сейчас, а не раньше, потому что с `scales-on-root` корень сам
          знает вид шкалы и может выбрать способ получения делений — до этого каждая часть решала
          за себя и знала только про непрерывную шкалу.
          Сделано (2026-09-21): `ticksOf` отдаёт деления любой шкалы — у категориальной это её домен,
          подпись встаёт по центру полосы; `axis`/`grid` больше не привязаны к `ScaleLinear`.
          Столбчатая диаграмма получила подписи категорий, названный предел закрыт.

  - category: Основа
    items:
      - id: root
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Голый корень
        description: "Означает: root — сам <svg>, размер задаётся width/height, ничего внутри не рисует."

      - id: axis
        type: feature
        status: Done
        priority: Critical
        milestone: basis
        size: S
        name: Ось
        description: |
          Означает: линия + тики + подписи вдоль шкалы, x (снизу) или y (слева) — та же форма,
          что была в референсе products/diagrams, портирована почти без изменений.
          Реализация: d3-scale считает тики/позиции, рисуем сами.
          Примечание: своей анатомии под ориентацию не заводит — x/y реальные per-node состояния
          на ОДНОЙ части axis (data-orientation), не settings и не две разные части: один root
          рутинно несёт обе оси разом, каждая со своим направлением.

      - id: grid-lines
        type: feature
        status: Done
        priority: High
        milestone: basis
        size: S
        depends_on: [axis]
        name: Сетка
        description: |
          Означает: фоновые направляющие линии, продолженные от тиков оси через всю область
          построения — не заводит новой математики, читает те же тики, что уже посчитала ось.
          Реализация: d3-scale (те же тики, что у axis) — обвязка своя.
          Примечание: отдельная часть анатомии (grid), не переиспользование axis — разные
          обязанности (подпись значения у края vs линия через всю область фоном). from/to —
          явные пропы (край диапазона ДРУГОЙ, перпендикулярной шкалы), не длина числом — тот же
          довод «scale/координаты всегда явный проп», что у axis.

  - category: Декартовы серии
    items:
      - id: line
        type: feature
        status: Done
        priority: Critical
        milestone: cartesian-series
        size: S
        depends_on: [axis]
        name: Линия
        description: |
          Означает: одна серия данных — ломаная/сглаженная линия по значениям.
          Реализация: d3-shape (line-генератор путей) — считает `d`-атрибут `<path>`, обвязка своя.
          Примечание: пропы — data + xScale/yScale + x/y-аксессоры (достают сырое значение из
          точки данных, компонент сам считает xScale(x(datum))) — тот же принцип «scale явный
          проп», что у axis/grid. Состояний не несёт — ховер/выделение приедут вместе с tooltip/
          legend-toggle, не заранее.
          Вход переезжает при `series-as-data`/`scales-on-root`: аксессоры-функции и явные шкалы
          остаются только в рукописном пути, схемная сборка называет поля строками.

      - id: area
        type: feature
        status: Done
        priority: Critical
        milestone: cartesian-series
        size: S
        depends_on: [axis]
        name: Область
        description: |
          Означает: та же линия, но с заливкой под кривой до базовой линии.
          Реализация: d3-shape (area-генератор) — тот же принцип, что line.
          Примечание: базовая линия — yScale.range()[0], не отдельный проп; стек нескольких area
          друг на друга — предмет stacked-series, не изобретается здесь заранее. line рисует
          fill="none"/stroke="currentColor", area — наоборот, та же анатомическая пара, что
          headerCell/headerSortTrigger у table (разные визуальные роли, общий источник данных).

      - id: bar
        type: feature
        status: Done
        priority: Critical
        milestone: cartesian-series
        size: S
        depends_on: [axis]
        name: Столбцы
        description: |
          Означает: вертикальные прямоугольники по значению (горизонтальные — не построены,
          не спрошены). Реализация: чистая арифметика по шкале (d3-scale's scaleBand для
          категориальной оси) — генератор путей не нужен, `<rect>` считается напрямую, один `<g
          data-part="bar">` на серию, много `<rect>` внутри (та же форма, что у axis/grid — один
          инстанс части на много визуальных элементов, не анатомия на каждый).
          Примечание: честный, названный пробел — axis/grid умеют только ScaleLinear (зовут
          scale.ticks(), которого у ScaleBand нет), подписанной категориальной оси кит пока не
          строит; сборка bar рисует только y-сетку/ось, x-подписей нет (см. FAQ.md). Закрывается
          пунктом `category-axis`.

      - id: point
        type: feature
        status: Done
        priority: High
        milestone: cartesian-series
        size: S
        depends_on: [axis]
        name: Точки / scatter
        description: |
          Означает: одна точка на пару значений (x, y), без соединяющей линии.
          Реализация: чистая арифметика по шкале — `<circle>` на пару координат, генератор не
          нужен, та же форма, что bar (один <g data-part="point"> на серию, много <circle> внутри).
          Примечание: radius — необязательный проп (по умолчанию 3), не CSS-свойство рецепта —
          геометрия, а не вид. Веха cartesian-series закрыта целиком (line/area/bar/point все Done).

      - id: curve-and-step
        type: feature
        priority: High
        milestone: cartesian-composition
        size: S
        depends_on: [line]
        name: "Сглаженная и ступенчатая линия — «волна» вместо ломаной"
        description: |
          Означает: та же линия и та же область, но соединяются не прямыми отрезками, а плавной
          кривой («волна») или ступенями — вид соединения приходит из описания серии, не из рецепта.
          Реализация: d3-shape даёт готовым (`curveCatmullRom`/`curveBasis`/`curveStep*` и прочие
          `curve*`), генератор пути уже используется у line/area — меняется одно поле.

      - id: horizontal-bars
        type: feature
        status: Done
        priority: High
        milestone: cartesian-composition
        size: S
        depends_on: [bar, category-axis]
        name: Горизонтальные полосы
        description: |
          Означает: те же столбцы, лежащие на боку — категории по вертикали, значение по
          горизонтали. Нужно всюду, где подписи категорий длинные и вертикально не помещаются.
          Реализация: чистая арифметика (обмен ролями шкал), генератор не нужен.
          Сделано (2026-09-21, по просьбе architect'а прямо в этой волне): пятая сборка
          `bar-horizontal` — тот же единственный узел `root`, отличие в одном пропе `shape`. Вход
          `DiagramBar` переписан с `xScale`/`yScale`+`x`/`y` на `categoryScale`/`valueScale`+
          `category`/`value`+`orientation`: у лежащих столбцов «x» это уже не категория, и старые
          имена врали бы про роль шкалы. Описание серии в данных не изменилось — `x` остаётся
          категорией, `y` значением, какая куда ляжет решает форма.
          Найдено при реализации: диапазон вертикальной оси перевёрнут ради значений, и
          категориальная шкала на ней ставила первую категорию вниз. Направление диапазона теперь
          выбирается по виду шкалы, а не по оси (`FAQ.md`).

      - id: grouped-bars
        type: feature
        priority: High
        milestone: cartesian-composition
        size: M
        depends_on: [bar]
        name: Группировка столбцов
        description: |
          Означает: несколько столбцов рядом на одну категорию (side-by-side), не поверх друг
          друга.
          Реализация: вложенная scaleBand внутри внешней — d3-scale даёт готовым, раскладка своя.

      - id: stacked-series
        type: feature
        priority: High
        milestone: cartesian-composition
        size: M
        depends_on: [bar, area]
        name: Стек серий
        description: |
          Означает: столбцы/области одной категории кладутся друг на друга, накопительно.
          Реализация: d3-shape (stack-хелпер) — раскладка турнкей, соединение со scale — наше.

      - id: stream-graph
        type: feature
        priority: Medium
        milestone: cartesian-composition
        size: M
        depends_on: [stacked-series]
        name: Стримграф (поток)
        description: |
          Означает: стек областей вокруг плавающей средней линии, с округлыми краями — «река»
          вместо стопки. Читается там, где важна форма изменения долей, а не точное значение.
          Реализация: d3-shape турнкей — `stackOffsetWiggle` вместе с `stackOrderInsideOut`
          (рекомендованная самим d3 пара для стримграфа), сверх уже сделанного стека — ничего.

      - id: dual-axis
        type: feature
        priority: Medium
        milestone: cartesian-composition
        size: M
        depends_on: [axis]
        name: Вторая ось Y
        description: |
          Означает: две серии разного масштаба на одном графике, каждая со своей осью.
          Реализация: второй экземпляр d3-scale — обвязка (два `axis` части одновременно, у одной
          `orientation="y"` инвертирован в сторону) наша, прецедент уже есть в референсе (root
          несёт двух детей `axis`, x и y, одновременно).

  - category: Декартовы серии, второй набор
    items:
      - id: bubble
        type: feature
        priority: Medium
        milestone: cartesian-extra
        size: S
        depends_on: [point, series-as-data]
        name: Пузыри
        description: |
          Означает: та же точка, но её размер несёт третье значение — третье измерение без третьей
          оси. Отдельный пункт, а не настройка точки: размер становится таким же каналом данных,
          как координата и цвет, и это первый случай, когда канал не координатный.
          Реализация: d3-scale (`scaleSqrt` — площадь, а не радиус, иначе картина врёт) — своя
          обвязка поверх уже написанной точки.

      - id: heatmap
        type: feature
        priority: Medium
        milestone: cartesian-extra
        size: M
        depends_on: [category-axis, color-from-data]
        name: Тепловая карта
        description: |
          Означает: сетка ячеек по двум категориальным осям, значение несёт цвет ячейки.
          Реализация: чистая арифметика (две `scaleBand`), генератор не нужен.
          Примечание: первый вид, где цвет выражает ЧИСЛО, а не принадлежность. Способ раздачи
          цвета при этом не меняется (`color-from-data`): непрерывную шкалу цвета считает тот, кто
          готовит данные, компонент по-прежнему кладёт пришедшее значение.

      - id: box-plot
        type: feature
        priority: Medium
        milestone: cartesian-extra
        size: M
        depends_on: [category-axis]
        name: Ящик с усами
        description: |
          Означает: распределение значений одной категории — медиана, квартили, усы, выбросы.
          Реализация: d3-array (`quantile`) считает статистику, отрисовка своя.

      - id: candlestick
        type: feature
        priority: Low
        milestone: cartesian-extra
        size: M
        depends_on: [category-axis]
        name: Свечи
        description: |
          Означает: биржевая свеча на интервал — открытие/закрытие телом, максимум/минимум тенью.
          Реализация: чистая арифметика по шкале, генератор не нужен.
          Примечание: форма данных — четыре значения на точку, первый такой случай; проверить на
          нём, что описание серии (`series-as-data`) выдерживает больше двух полей на точку, а не
          подпирается отдельным типом.

      - id: waterfall
        type: feature
        priority: Low
        milestone: cartesian-extra
        size: M
        depends_on: [stacked-series]
        name: Водопад
        description: |
          Означает: накопительные приращения — каждый столбец начинается там, где кончился
          предыдущий, видно вклад каждого шага в итог.
          Реализация: своя (накопительная сумма), поверх уже сделанного стека.

  - category: Радиальные серии
    items:
      - id: pie
        type: feature
        priority: High
        milestone: radial
        size: S
        depends_on: [color-from-data]
        name: Пирог / donut
        description: |
          Означает: круговая диаграмма долей, с необязательной дыркой в центре (donut).
          Реализация: d3-shape (arc + pie генераторы) — турнкей, раскладка углов и путь сектора
          считает библиотека, обвязка своя.
          Примечание: первый вид, который физически невозможен без `color-from-data` — у каждого
          сектора свой цвет, одного цвета на часть здесь не хватает принципиально.

      - id: gauge
        type: feature
        priority: Medium
        milestone: radial
        size: M
        depends_on: [pie]
        name: Спидометр
        description: |
          Означает: полукруг/сектор со стрелкой-указателем на значение.
          Реализация: тот же arc-генератор d3-shape, что у pie (общая полярная математика), плюс
          своя стрелка — угол считаем сами по значению.

      - id: radar
        type: feature
        priority: Medium
        milestone: radial
        size: L
        name: Радар / паутина
        description: |
          Означает: многоугольник по нескольким осям-лучам из центра, одна на измерение.
          Реализация: у d3-shape нет готового хелпера под лучевую раскладку — полярная математика
          (угол на измерение, точка на пересечении луча и значения) целиком своя.

      - id: polar-bars
        type: feature
        priority: Low
        milestone: radial
        size: M
        depends_on: [pie]
        name: Радиальные столбцы (роза)
        description: |
          Означает: столбцы, растущие из центра по кругу — категория задаёт угол, значение длину.
          Реализация: тот же arc-генератор, что у pie, плюс угловая scaleBand — обвязка своя.

  - category: Иерархии и потоки
    items:
      - id: treemap
        type: feature
        priority: Medium
        milestone: hierarchy-flow
        size: M
        name: Плитка (treemap)
        description: |
          Означает: вложенные прямоугольники, площадь каждого — его доля; показывает иерархию и
          величину разом, на месте, где круговая уже не читается.
          Реализация: d3-hierarchy (`treemap`) — укладку считает библиотека, отрисовка своя.
          Примечание: НОВАЯ зависимость движка (d3-hierarchy), решение architect — не тянуть до
          того, как пункт взят в работу.

      - id: sunburst
        type: feature
        priority: Low
        milestone: hierarchy-flow
        size: M
        depends_on: [treemap, pie]
        name: Солнечные лучи (sunburst)
        description: |
          Означает: та же иерархия, но кольцами — вложенность наружу от центра.
          Реализация: d3-hierarchy (`partition`) + уже используемый arc-генератор d3-shape.

      - id: sankey
        type: feature
        priority: Low
        milestone: hierarchy-flow
        size: L
        name: Потоки (sankey)
        description: |
          Означает: узлы и потоки между ними, толщина потока — величина; куда перетекает объём.
          Реализация: d3-sankey — отдельный модуль, НЕ входит в d3-shape/d3-scale, решение
          architect. Форма данных другая: узлы и рёбра, а не строки таблицы — проверить на нём,
          где проходит граница `series-as-data`.

      - id: funnel
        type: feature
        priority: Low
        milestone: hierarchy-flow
        size: S
        name: Воронка
        description: |
          Означает: сужающиеся ступени — сколько осталось на каждом шаге сценария.
          Реализация: чистая арифметика (трапеция на шаг), сторонний модуль не нужен.

  - category: Арматура
    items:
      - id: legend
        type: feature
        priority: Critical
        milestone: furniture
        size: M
        depends_on: [series-as-data, color-from-data]
        name: Легенда
        description: |
          Означает: список серий графика с их цветом — сама не переключает видимость (это
          отдельный пункт, legend-toggle), просто показывает, что есть что.
          Реализация: своя — читает те же описания серий и те же цвета, что пришли в данных; своей
          таблицы цветов не заводит и цвет не назначает.

      - id: tooltip
        type: feature
        priority: Critical
        milestone: furniture
        size: M
        depends_on: [line]
        name: Подсказка при наведении
        description: |
          Означает: crosshair + всплывающее значение под курсором — поиск ближайшей точки серии
          к позиции указателя.
          Реализация: d3-array (bisector — бинарный поиск ближайшего значения по x) даёт поиск
          почти бесплатно, позиционирование всплывашки и её вид — свои.
          Примечание: вместе с ним у серий появляются первые состояния (наведённая/приглушённая) —
          сегодня их нет НАРОЧНО, чтобы не объявлять в паспорте то, чего никто не ставит.

      - id: reference-line-band
        type: feature
        priority: Medium
        milestone: furniture
        size: S
        depends_on: [axis]
        name: Опорная линия / зона
        description: |
          Означает: горизонтальная/вертикальная линия на фиксированном значении (порог) или
          закрашенная полоса между двумя значениями (диапазон нормы), поверх серий.
          Реализация: та же шкала, что у axis — одна координата вместо тика, прямая арифметика.

      - id: axis-label-format
        type: feature
        priority: Medium
        milestone: furniture
        size: S
        depends_on: [axes-derived-from-series]
        name: Подпись и формат делений оси
        description: |
          Означает: у оси есть собственная подпись («млн ₽», «день») и формат деления — проценты,
          валюта, дата, сокращение тысяч. Без этого числовая ось врёт видом: `1000000` вместо `1 млн`.
          Реализация: d3-format/d3-time-format дали бы готовым — НОВАЯ зависимость, решение
          architect; проверить, не хватает ли `Intl.NumberFormat`/`Intl.DateTimeFormat` браузера,
          прежде чем тянуть модуль.

  - category: Интерактивность
    items:
      - id: legend-toggle
        type: feature
        priority: Medium
        milestone: interactivity
        size: S
        depends_on: [legend]
        name: Клик по легенде скрывает серию
        description: |
          Означает: клик по элементу легенды прячет/показывает соответствующую серию.
          Реализация: своё состояние видимости на потребителе — та же категория, что column-
          visibility у table (обычный проп/сигнал, не settings паспорта).

      - id: zoom-pan
        type: feature
        priority: Medium
        milestone: interactivity
        size: L
        depends_on: [axis]
        name: Zoom / pan
        description: |
          Означает: колесо мыши масштабирует, перетаскивание двигает видимую область — все серии
          и ось пересчитываются на лету под новый домен шкалы.
          Реализация: d3-zoom — ВТОРОЙ модуль d3, не входит в d3-scale/d3-shape, отдельная
          зависимость. Пересчёт всех дочерних серий под новый scale — наша обвязка, не тривиальная
          (каждая серия должна реагировать на общий сдвиг домена).

      - id: brush-select
        type: feature
        priority: Medium
        milestone: interactivity
        size: L
        depends_on: [axis]
        name: Brush / выделение диапазона
        description: |
          Означает: перетаскивание по оси выделяет диапазон (например, для фильтрации по времени
          в другом месте интерфейса) — независимо от zoom-pan, свой сценарий использования.
          Реализация: d3-brush — ещё один отдельный модуль d3, третья зависимость движка.

  - category: Данные
    items:
      - id: live-updates
        type: feature
        priority: Medium
        milestone: data-updates
        size: M
        depends_on: [line]
        name: Живое обновление
        description: |
          Означает: данные меняются без пересборки графика с нуля — плавный переход старой формы
          в новую (не мгновенная замена).
          Реализация: своя — Solid-реактивность даёт пересчёт пути на новые данные бесплатно,
          сам ПЛАВНЫЙ переход (интерполяция пути между кадрами) — наше, d3-interpolate как
          возможный помощник, не обязательный.

      - id: canvas-render
        type: feature
        priority: Low
        milestone: performance-at-scale
        size: L
        name: Canvas-рендер для больших датасетов
        description: |
          Означает: альтернативный слой рендера (canvas вместо SVG) для датасетов, на которых SVG
          упирается в потолок производительности (тысячи точек).
          Реализация: целиком свой рендер-бэкенд, второй способ рисовать те же серии — не
          расширение SVG-версии, отдельная реализация с тем же паспортом снаружи.
          Примечание: приоритет Low НАРОЧНО, та же логика, что виртуализация у table — меняет
          рендер целиком, чем позже встраивать, тем меньше фич придётся сверять с ним задним
          числом.

  - category: Экспорт
    items:
      - id: export-image
        type: feature
        priority: High
        milestone: export
        size: M
        name: Экспорт PNG/SVG
        description: |
          Означает: сохранить готовый график как картинку.
          Реализация: сериализация DOM `<svg>` → строка → (для PNG) отрисовка в offscreen canvas
          → blob. Своя, без сторонних библиотек.

      - id: clipboard-copy
        type: feature
        priority: High
        milestone: export
        size: M
        depends_on: [export-image]
        name: Копирование в буфер
        description: |
          Означает: та же картинка, что export-image, но сразу в буфер обмена, не файлом.
          Реализация: та же сериализация + Clipboard API поверх неё.

  - category: Доступность
    items:
      - id: text-summary
        type: feature
        priority: Medium
        milestone: accessibility
        size: M
        depends_on: [line]
        name: Текстовое summary
        description: |
          Означает: описание данных графика для экранного читалки — `aria-describedby` на текст
          или таблицу-фолбэк, та же цель, что `aria-sort` у table's headerCell — доступность не
          требует зрения.
          Реализация: своя — из тех же данных, что уже рисует серия, генерируем текстовое резюме
          (диапазон, тренд, крайние значения).

      - id: keyboard-navigation
        type: feature
        priority: Medium
        milestone: accessibility
        size: L
        depends_on: [point]
        name: Клавиатурная навигация по точкам
        description: |
          Означает: стрелки двигают фокус между точками серии, Enter/Space озвучивает значение.
          Реализация: TanStack тут ни при чём (в table то же самое верно для keyboard-navigation
          по ячейкам) — вся roving-tabindex-механика своя.

# Журнал архитектурных решений и открытых вопросов — синкается страницей "Решения",
# не задачами (см. маппинг в шапке table/ROADMAP.yaml).
log:
  - id: diagram-is-one-component
    type: plan
    date: 2026-09-04
    summary: >
      Декартовы (xy) и радиальные (pie/radar/gauge) диаграммы — ОДИН компонент кита снаружи
      (`diagram`, один паспорт, одна анатомия), не два раздельных, как table/grid. Довод
      пользователя: table/grid разошлись, потому что у них разное ПОВЕДЕНИЕ (сортировка/фильтры
      vs голая раскладка) — разный ментальный контракт потребителя. У декартовых и радиальных
      диаграмм контракт один: «дай данные + шкалу — нарисую форму», разница только в математике
      координат, не в контракте. Разнообразие (line/bar/pie/radar/...) выражается СБОРКАМИ
      (`playground/assemblies/`), не отдельными компонентами и не паспорт-вариантами — тот же
      принцип, что `assemblies-are-showcases-not-gates` у table. Анатомия вырастет большой (одна
      «максимальная» сумка частей на обе семьи, декартовых и радиальных сразу) — та же логика,
      что `one-maximal-features-bag` у table, уже одобренная пользователем как приемлемая цена.

  - id: mechanics-separated-by-files-not-by-component
    type: plan
    date: 2026-09-04
    summary: >
      «Не смешивать механики» реализуется на уровне ФАЙЛОВ, не паспорта: `components/cartesian/*`
      (ось/сетка/линия/область/столбец/точка — движок d3-scale+d3-shape's декартовы генераторы) и
      `components/radial/*` (дуга/сектор — d3-shape's полярные arc/pie генераторы) — отдельные
      папки, обе перечисляются в одной карте `defineKitComponent(passport, {...})`. `root` общий
      для обеих семей, не дублируется.

  - id: engine-is-individual-d3-modules
    type: plan
    date: 2026-09-04
    summary: >
      Движок — отдельные модули d3 (d3-scale уже взят под шкалы), не монолитная charting-
      библиотека — тот же «берём движок, компоненты свои» приём, что у table с
      @tanstack/solid-table, и то же архитектурное решение, что visx (Airbnb) применяет для
      настоящих графиков в масштабе, не только простых (see `products/diagrams`'s собственный file
      header про этот довод). Модули по мере надобности: d3-shape (line/area/stack/arc/pie
      генераторы путей), d3-array (bisector для tooltip, ticks/extent для доменов), d3-zoom
      (interactivity), d3-brush (brush-select) — каждый новый модуль называется в описании
      конкретной фичи, не берётся заранее про запас. Дополнено 2026-09-21: тем же правилом идут
      d3-hierarchy (плитка/кольца), d3-sankey (потоки), d3-format/d3-time-format (формат делений) —
      каждый назван в своём пункте, ни один не взят заранее.

  - id: diagram-is-table-tier-priority
    type: plan
    date: 2026-09-04
    summary: >
      User: диаграммы по важности на уровне table, нужно разнообразие («чем больше тем лучше»),
      но идём по шагам/фичам, как с table — не пытаемся закрыть всё разом. Отсюда и решение вести
      этот роадмап в идентичном table формату с первого дня, а не начинать со свободной формы,
      которую потом пришлось бы мигрировать (как это случилось с table, `roadmap-format-v2` в
      table/ROADMAP.yaml).

  - id: canvas-render-lowest-priority
    type: question
    date: 2026-09-04
    summary: >
      canvas-render — Low приоритет по прямой аналогии с виртуализацией у table, не по прямому
      указанию пользователя в ЭТОЙ сессии (в отличие от table, где Low для виртуализации был
      явным решением user). Оставляю вопросом на подтверждение — если появится реальный сценарий
      с датасетами, где SVG уже ощутимо тормозит, приоритет стоит пересмотреть раньше остальных
      Low/Medium пунктов.

  - id: built-in-five-minutes-needs-rework
    type: plan
    date: 2026-09-21
    summary: >
      Architect: то, что стоит сегодня, собрано на коленке и продумывалось пять минут, а диаграммы
      — очень важная часть кита. Пересмотр компонента целиком, а не доводка по мелочи. Первый
      названный симптом — цвет: варианты формы задают цвет сериям, а он должен приходить из данных.
      Разбор показал, что цвет лишь первый из трёх симптомов одной причины (нет модели данных):
      данные и обе шкалы зашиты литералом в файл сборки, `entity/io.ts` нет вовсе, `bind` не
      объявлен ни на одном узле — график показывает ровно те цифры, что вписал автор сборки.
      Отсюда веха `data-model` первой волной: всё остальное строится поверх неё.

  - id: table-is-the-model-to-follow
    type: plan
    date: 2026-09-21
    summary: >
      Образец устройства — `packages/ui/src/table`, названный architect'ом («таблица тоже сложная
      структура»). Взято дословно три приёма: (1) описание того, ЧТО показывать — данные, а не код
      (`columns` у таблицы это JSON `{accessorKey, header}`, без функций и JSX; у диаграммы так же
      устроен список серий, поля называются строками); (2) сборка — один узел `root` с `bind`,
      без единого ребёнка, корень растит структуру сам; (3) рукописный путь не отменяется —
      `children` рендер-пропом отдаёт живой движок тому, кому нужен полный контроль. Формулировка
      «почему так» — в FAQ таблицы и в её README, здесь не пересказывается.

  - id: color-comes-in-data
    type: plan
    date: 2026-09-21
    summary: >
      Architect дословно: «цвета должны идти в данных, при работе с нашим бэком он сразу будет
      отдавать нужный формат, при работе с чужим — у нас есть адаптеры; в сам компонент ничего не
      хардкодится». Отсюда: компонент не назначает цвет ни по порядку серии, ни по своему правилу.
      В поле цвета лежит ГОТОВОЕ CSS-значение (обычно ссылка на категорию палитры вида
      `var(--type-number-9)`), а не имя категории — иначе компонент сам дописывал бы ступень, то
      есть решал за автора палитры. Палитру задаёт не пакет скина, а пресет: автор палитры или
      сборки (сегодня это мы) кладёт туда серийные категории тем же способом, каким в
      `omnifield-palette` уже лежат `type-string`/`type-number`/`type-boolean`/`type-enum`/
      `type-unknown`. Отклонены: раздача цвета по порядку серии и смешанный вариант с фолбэком на
      порядок — обе кладут правило назначения внутрь компонента.

  - id: scales-move-to-root
    type: plan
    date: 2026-09-21
    summary: >
      Разворот решения, записанного в README компонента («`scale` — ВСЕГДА явный проп, никогда не
      читается из контекста», взято у visx). Причина разворота: шкала — объект-функция, её нельзя
      ни сохранить в пресет, ни передать по сети, ни отредактировать в редакторе, значит сборка,
      хранимая как данные, шкалу передать не может в принципе. Корень считает шкалы сам и раздаёт
      детям — ровно то место, которое у `table` занимает инстанс движка. Явная шкала остаётся
      живой в рукописном пути через `children`-рендер-проп, поэтому принцип visx не выброшен, а
      сужен до того пути, где он работает. README правится по факту правки кода, не раньше.

  - id: axes-derived-insets-defaulted
    type: plan
    date: 2026-09-21
    summary: >
      Две мелких развилки, закрытые architect'ом. Оси выводятся из описания серий (все серии
      смотрят одним полем по горизонтали — ось x одна), явное описание оси остаётся возможным как
      уточнение: иначе простейший график описывается вдвое длиннее, чем он есть по смыслу. Поле
      под подписи осей (сегодня — константа `MARGIN`, подобранная на глаз в каждом файле сборки)
      получает разумный дефолт в компоненте и необязательное переопределение в данных; дословно:
      «может и вообще не нужно будет». Рассмотрены и отклонены как преждевременные чтение числа из
      CSS-переменной рецепта и обмер реальных подписей (приём ECharts) — вернуться к обмеру, если
      дефолт перестанет попадать при крупном шрифте подписей.

  - id: form-does-not-live-in-data
    type: plan
    date: 2026-09-21
    summary: >
      Граница между данными и показом проведена заново, тем же днём, что и сама модель данных.
      Данные несут СОДЕРЖАНИЕ: строки, имена полей под оси, подписи серий, цвет (в том числе цвет
      отдельной точки). Показ несёт ФОРМУ: чем нарисованы серии — линией, областью, столбцами,
      точками. Довод architect'а: один и тот же датасет обязан показываться разными видами, а если
      вид лежит в данных, смена вида превращается в правку данных. Механика — обычный проп корня
      (`shape`), по одной сборке на форму; паспортная настройка отпала (перечень имён закрыт и
      лежит в `packages/skin`), ось варианта отпала (кит не знает имён вариантов по канону).
      Принятая цена — комбинированный график (столбцы плюс линия) одной сборкой не выражается,
      вынесен в бэклог отдельным пунктом `combo-layers`, решаться будет слоями В ОПИСАНИИ ПОКАЗА,
      не возвращением формы в данные.

  - id: market-check-2026-09-21
    type: question
    date: 2026-09-21
    summary: >
      Сверка с рынком перед пересмотром механики (что смотрел · что взял · дата — 2026-09-21).
      Vega-Lite и Observable Plot: канон — КАНАЛ кодирования (поле данных → визуальное свойство
      через шкалу), цвет такой же канал, как координата, легенда выводится из шкалы цвета сама;
      взято как довод, что цвет обязан приходить из данных, а не из рецепта. unovis: значения
      цветов живут в CSS-переменных темы (`--vis-color0…5`), порядковая шкала раздаёт их по ключу
      серии, смена темы не требует перерисовки; взята идея «значение цвета — из темы», отклонена
      раздача по порядку (у нас назначение приходит в данных). visx: явные шкалы пропами —
      оставлено для рукописного пути, не для хранимых сборок (см. `scales-move-to-root`).
      d3-shape: `stackOffsetWiggle`+`stackOrderInsideOut` как рекомендованная пара для стримграфа,
      семейство `curve*` для сглаженной/ступенчатой линии — оба взяты в пункты как турнкей.
      ECharts: автоподбор поля под подписи осей — отклонён на сейчас, оставлен как запасной путь.

# Прикидка по размеру (не оценка в часах, порядок величины) — тот же словарь, что у table:
#   S — движок даёт логику почти бесплатно, нужен только слой anatomy+passport+wiring
#   M — движок даёт логику частично, доделываем сами (UI, дополнительные части анатомии)
#   L — нужна вторая библиотека/модуль ИЛИ заметный собственный движок (движок не помогает вовсе)

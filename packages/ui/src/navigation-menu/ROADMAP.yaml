# Дорожная карта навигационного меню — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.

categories:
  - category: Основа
    items:
      - id: parts-and-kit
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Одиннадцать частей и карта кита
        description: |
          Означает: меню собирается из полосы разделов (`list` + `item`), кнопки со значком
          (`trigger` + `itemIndicator`), панели-слота (`content`) со ссылкой для ручной сборки
          (`link`), скользящего указателя с клином (`indicator` + `arrow`) и общей панели
          (`viewportPositioner` + `viewport`).
          Реализация: части взяты перечнем у машины, адрес каждой (`data-scope`/`data-part`)
          приходит вместе с ней — руками не проставляется. Раскладка файлов повторяет владение:
          части раздела лежат в `components/item/`, клин — в `components/indicator/`.
          Проверено тестом: обе сборки рисуются через реальный движок, каждая часть находится
          по своему адресу.

      - id: own-props-vocabulary
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Свой словарь пропсов у каждой части
        description: |
          Означает: наружу уезжают СВОИ типы (`NavigationMenuProps`, `NavigationMenuLinkProps` и
          так далее), собранные из платформенных атрибутов элемента плюс то, что часть реально
          умеет, — чужой тип пропсов как свой публичный контракт не объявляется нигде.
          Реализация: смена раскрытого раздела отдаётся наружу как `onValueChange(value)` —
          обычной строкой, а не чужим объектом подробностей.

      - id: two-assemblies
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Две сборки — своя панель у раздела и одна общая
        description: |
          Означает: `basic` — панель рисуется внутри своего раздела; `viewport` — содержимое
          раскрытого раздела переезжает в одну общую панель, которая подстраивает размер.
          Проверено живым рендером: после раскрытия узел `content` физически лежит ВНУТРИ узла
          `viewport`, а не там, где его объявила схема.

      - id: recipe-proof
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Доказательный рецепт — паспорт одевается целиком
        description: |
          Означает: каждое состояние паспорта адресовано правилом, `skinGaps` пуст, CSS реально
          генерируется против настоящей палитры.
          Реализация: части, которые кит прячет нативным `hidden` (`content`, `indicator`,
          `itemIndicator`, `viewport`), получают `display` только внутри состояния `open`.
          Измеренные переменные раскрытого раздела объявлены на `root`, поэтому указатель берёт
          их через явно названного предка (`ancestors`), а не надеждой на наследование.

  - category: Не построено
    items:
      - id: no-tag-substitution
        type: feature
        priority: Medium
        milestone: null
        name: Нет своего способа «нарисуй другим тегом»
        description: |
          Означает: части рисуются теми тегами, которые им положены по роли, и подменить разметку
          снаружи нечем — ни одна часть такого пропса не объявляет.
          Реализация: отсутствует сознательно — общий для кита механизм подмены ещё не заведён, и
          выдавать вместо него чужой приём с чужим именем компонент не станет.

      - id: no-external-machine-holder
        type: feature
        priority: Low
        milestone: null
        name: Машину меню нельзя завести снаружи дерева
        description: |
          Означает: держать состояние меню вне его разметки (кнопки-переключатели физически в
          другом месте страницы) можно только через `value`/`onValueChange` на корне — отдельного
          держателя машины, которого можно было бы создать сбоку и подсунуть корню, кит не
          отдаёт.
          Реализация: `value`/`onValueChange` закрывают обычный случай (проверено тестом:
          раскрытие снаружи и смена приходит назад строкой, пустая — закрыто всё); полноценный
          внешний держатель заводится, когда появится потребитель, которому этого не хватило.

      - id: link-lives-outside-the-assemblies
        type: feature
        priority: Low
        milestone: null
        name: Ссылка собирается только руками
        description: |
          Означает: часть `link` есть в ките целиком — компонент, состояние `current`,
          `aria-current`, клавиатурная навигация машины по ссылкам, — но ни одна сборка её не
          зовёт: панель это слот потребителя, а переходы ведёт приложение.
          Реализация: в форме входа нет ни адресов, ни поля «этот адрес открыт сейчас» — из данных
          схемы ссылку взять неоткуда, и это осознанно. Понадобится схемная ссылка — заводить
          вместе с тем, кто её попросит.

# Журнал решений.
log:
  - id: navigation-left-to-the-app
    type: plan
    date: 2026-09-19
    summary: >
      Решение user по концепции: меню не ходит по адресам само — роут переключает приложение
      своим роутером. Ссылки убраны из обеих сборок, панель осталась ПУСТЫМ слотом (канон зоны:
      базовая сборка не наполняет слот за потребителя), форма входа сократилась до разделов
      (`value`, `label`) — адресов в данных меню больше нет. Часть `link` при этом оставлена
      сабкомпонентом кита со всем, что у неё было: `current`, `aria-current`, стрелочная
      навигация машины по ссылкам. Отдельно проверено по доке движка, что перехват наверху
      возможен и без правок компонента (`EventBinding` в `on.context`, `packages/assembly`
      `README.md`/`FAQ.md`, тест `on-event-binding`), — но при пустом слоте он просто не нужен:
      что положили в панель, то и шлёт свои события.
  - id: item-indicator-widened-the-trigger
    type: bug
    date: 2026-09-19
    summary: >
      Заявка с витрины: при раскрытии меню дёргается и становится шире. Замерено в браузере на
      реальном наряде: кнопка 122.2 px закрытой и 154.2 px раскрытой (+32 px), меню целиком
      590.8 → 622.8 px. Причина — значок стоял в `itemIndicator`, а машина держит эту часть в
      разметке только для раскрытого раздела (нативный `hidden`, то есть `display: none`);
      перебить это правилом скина нельзя, иначе пометка перестанет исчезать вовсе. Обе сборки
      переведены на обычный `Icon` в кнопке, `itemIndicator` остался пометкой раскрытого раздела
      для ручной композиции. После правки замер тот же: 154.2 px в обоих состояниях, ширина меню
      не меняется. Закреплено тестом: значок в кнопке один и тот же что закрытой, что раскрытой.
  - id: panel-aligned-with-the-select-popup
    type: plan
    date: 2026-09-19
    summary: >
      Заявка: панель меню и список селекта — один и тот же попап, а выглядели по-разному. Сведено
      по цифрам селекта: коробка — набивка `--space-1`, скругление `--radius-md`, рамка
      `--border-width-1`/`--neutral-6`, без тени; строки — набивка `--space-1`/`--space-2`,
      скругление `--radius-sm`, наведение `--neutral-4`. Замерено в браузере после правки: у обоих
      попапов padding 8px, gap 8px, радиус 8px, строка 6px и высота 35 px. Заодно убран двойной
      короб в сборке `viewport`: внутри общей панели `content` теперь сбрасывает свою рамку и фон
      (через `ancestors` на `viewport`) — коробку там несёт сама общая панель.

  - id: pills-indicator-sank-under-the-list
    type: bug
    date: 2026-09-19
    summary: >
      Найдено при проверке первых двух правок: в виде `pills` подложка под раскрытым разделом была
      не видна вовсе, а подпись — белым по светлому. Причина — `z-index: -1` у указателя: слой
      с отрицательным числом рисуется РАНЬШЕ фонов блоков, то есть уезжает под фон самой полосы.
      Заменено на тот же приём, что у табов: указатель `z-index: 0`, кнопка `position: relative` +
      `z-index: 1`. Проверено в браузере — подложка видна, подпись поверх неё. Правка живёт в форме
      службы: вариаций вида в доказательном рецепте компонента нет, он доказывает только паспорт.

  - id: item-z-index-covered-the-indicator
    type: bug
    date: 2026-09-19
    summary: >
      Заявка с витрины: в виде `line` полоса под раскрытым разделом выглядит обрезанной. Причина —
      `item.open { z-index: 1 }` в рецепте: раздел это флекс-элемент полосы, и числовой `z-index`
      заводит слой даже при `position: static`, поднимая кнопку с её фоном выше указателя.
      Проверено точкой: `elementFromPoint` в центре указателя возвращал `trigger`, со снятым
      `z-index` — `indicator`. Заменено на `z-index: auto` в обоих состояниях; панель осталась
      поверх соседей сама — она позиционирована абсолютно, слой ей не нужен.
  - id: machine-version-split-broke-type-emit
    type: bug
    date: 2026-09-19
    summary: >
      Пакет машины поставлен как `"^1.43.1"` и разрешился в `1.43.3` — со своим вторым
      экземпляром пакета анатомии, тогда как весь остальной кит стоит на общем `1.43.1`.
      Компилятор отказался выпускать типы (`TS2883: the inferred type of 'anatomy' cannot be
      named without a reference to ...@zag-js+anatomy@1.43.3`): тип анатомии лежал в экземпляре,
      до которого из пакета не дотянуться именем. Аннотацией руками не лечилось бы честно —
      экземпляров всё равно осталось бы два; поставлено ровно `1.43.1`, семейство снова на одной
      версии. Следствие на будущее: новый компонент на машине из этого семейства ставится в ту же
      версию, что уже стоит у соседей, а не в самую свежую.
  - id: measured-vars-live-on-root
    type: plan
    date: 2026-09-19
    summary: >
      Первый рецепт читал `--trigger-width`/`--trigger-x` прямо на указателе — сборка наряда
      отказала четырьмя претензиями `variable-elsewhere`: переменные объявлены на `root`, туда их
      пишет машина, и на самой части их никто не ставит. Поправлено явным предком (`ancestors`) в
      базе и в вертикальной настройке — тем же приёмом, что у оглавления. Найдено не глазами, а
      прогоном доказательного рецепта.

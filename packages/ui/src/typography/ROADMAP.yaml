# Дорожная карта типографики — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Первый компонент кита, построенный с нуля именно потому, что ни у Ark, ни у Kobalte нет своего
# примитива для вывода текста — проверено по спискам компонентов обеих библиотек, 2026-09-06.
# САМЫЙ ПРОСТОЙ компонент кита, тот же рецепт, что у Surface — один узел, без состояний, весь вид
# через ось вариаций.

categories:
  - category: Основа
    items:
      - id: polymorphic-tag
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Смена тега (as), независимая от вида
        description: |
          Означает: `<Typography as="h1" data-variant="caption">` рисует `<h1>` с видом `caption`
          — тег и вид выбираются раздельно, ни один не навязывает другой.
          Реализация: полиморфный рендер (тот же приём, что у `Surface`), проверено тестом.

      - id: truncate-setting
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Обрезка по ширине с многоточием — флаг, независимый от вида
        description: |
          Означает: `<Typography truncated>` обрезает текст по ширине родителя и дорисовывает
          многоточие, при ЛЮБОМ варианте вида — `body`, `heading`, `caption` и любом, который
          человек заведёт в редакторе.
          Почему настройка, а не вариант: ось вариаций несёт вид целиком, а обрезка виду
          перпендикулярна — она нужна при каждом из них; заводить `heading-truncated` рядом с
          `heading` означало бы удваивать перечень видов на каждый новый. В `base` рецепта
          положить тоже нельзя — `Typography` рисует и абзацы, `white-space: nowrap` в базе
          убил бы перенос строк у всего текста кита разом.
          Реализация: свой проп `truncated` в `TypographyProps` (до этого тип был чужим
          `PolymorphicProps<T>` целиком), настройка-флаг в паспорте с меткой `data-truncated`,
          правило в рецепте — тем же приёмом, что `outlined`/`filled` у `Workspace`.
          Имя `truncated` добавлено в закрытый перечень `SETTINGS` (`packages/skin`) отдельной
          заявкой — своих имён настроек кит не заводит.
          Обрезка по N строк в этот пункт НЕ входит: произвольное N закрытым перечнем значений
          настройки не выражается, это другая механика (переменная части с `setBy`).

          Сделано (2026-09-20): `components/root.tsx` — `TypographyProps` получил собственный
          `truncated?: boolean`, `splitProps` снимает его с полиморфных пропсов, в разметку уходит
          `data-truncated="true"` (проп сам в DOM не утекает). `entity/passport.ts` — настройка
          флагом с меткой; `playground/settings.ts` заведён (первый у этого компонента) и подключён
          в `playground/index.ts` — без него `defineEditorInfo` падает на непокрытой настройке.
          `playground/recipe.ts` — `settings.truncated.true` с `min-width: 0` + `overflow: hidden`
          + `text-overflow: ellipsis` + `white-space: nowrap` на `root`.

          Проверено на сгенерированном CSS, не на бумаге: правило печатается селектором
          `[data-scope="typography"][data-part="root"][data-truncated="true"]` — то есть реально
          вне вариаций, как и задумано (`test/recipe.test.tsx`, новый сценарий). Плюс живой рендер
          (`test/typography.test.tsx`): без пропа атрибута нет вовсе, с пропом стоит
          `data-truncated="true"` рядом с `data-variant="heading"` — флаг и вид не мешают друг
          другу. `generate && typecheck && lint && test` — зелёные, 304/304 теста кита (было 302,
          +2 новых).

      - id: variant-axis
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Ось видов несёт весь вид целиком
        description: |
          Означает: `data-variant` — единственный способ дать тексту вид (`body`/`heading`/
          `caption` в проверочном рецепте, реальные имена решает продукт), состояний у компонента
          нет вовсе.
          Реализация: обычная ось паспорта, без собственных имён вариаций в ките.

# Журнал решений.
log:
  - id: no-ark-no-kobalte-primitive
    type: plan
    date: 2026-09-06
    summary: >
      User спросил, есть ли готовый примитив для типографики у Ark/Kobalte, прежде чем строить
      свой. Проверено по обоим спискам компонентов: у `@ark-ui/solid` вывода текста нет вовсе, у
      `@kobalte/core` есть только `text-field` (поле ввода, не про вывод). Построено с нуля, тем же
      рецептом, что уже применён к `Surface` — полиморфный тег, ноль стилей по умолчанию, вид через
      `data-variant`.

# Дорожная карта иконки — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.

categories:
  - category: Основа
    items:
      - id: resolve-by-name
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Резолвинг иконки по имени из словаря кита
        description: |
          Означает: `<Icon name="chevron-down" />` рисует настоящий `<svg>` — какая библиотека
          рисует конкретную картинку по этому имени, наружу не видно.
          Реализация: `createResource` + СЛОВАРЬ `entity/catalog.ts` — карта «имя → ленивый
          `import()`» с литеральным ПАКЕТНЫМ специфером на каждую иконку (сегодня 59 имён: шесть,
          что кит называет в сборках playground, соседи по механике компонентов со слотом под
          иконку, и пришедшее заявкой потребителя). Ни макроса сборщика, ни шаблонной строки, ни
          пути в `node_modules`.
          Проверено тестом на двух разных именах, через сборку `basic`, и гейтом
          `test/shipped-artifact.test.ts`, который читает СОБРАННЫЙ `dist` — обе предыдущие
          реализации были зелёными в `vitest` и ломались вне его (разбор в FAQ.md).

  - category: Не построено
    items:
      - id: no-error-fallback
        type: feature
        priority: Medium
        milestone: null
        name: Нет состояния "имя не резолвилось"
        description: |
          Означает: если `name` не существует в резолвящей библиотеке, компонент не показывает
          ничего и никак не сообщает об этом наружу — падает необработанным отказом промиса.
          Проверено эмпирически: несуществующее имя уходит как unhandled rejection,
          `createResource`'s состояние ошибки в `root.tsx` никак не читается.
          Реализация: отсутствует — ни fallback-иконки на случай ошибки, ни видимого состояния.

      - id: not-own-name-vocabulary
        type: feature
        priority: Low
        milestone: null
        name: Словарь есть, но его слова — всё ещё написание `lucide`
        description: |
          Означает: перечень имён теперь СВОЙ (`entity/catalog.ts`, растёт заявкой), и
          тип пропса — union, а не `string`. Но сами слова — буквально kebab-имена `lucide`
          (`chevron-down`, `trash`), поэтому смена библиотеки иконок всё ещё переписала бы каждое
          использование.
          Реализация: слоя «имя кита → имя библиотеки» нет — сегодня словарь и есть карта, у неё
          ключ и значение из одного словаря. Развести их дёшево ровно потому, что список свой.
          Второй хвост: `entity/io.ts` держит `name: z.string()`, а не перечисление — редактор
          скина показывает поле ввода вместо выбора, и опечатка в сборке ловится не схемой, а
          отказом промиса в рантайме (`no-error-fallback`).

# Журнал решений.
log:
  - id: vocabulary-grown-by-consumer-request
    type: plan
    date: 2026-09-20
    summary: >
      Заявка `interfaces/feeder` (мастер сведения полей адаптера): тип поля рисовался текстовым
      бейджем, потому что в словаре не было ни одного значка под типы данных. Добавлено 18 имён
      двумя смыслами — типы данных (`type`, `hash`, `toggle-left`, `list`, `braces`, `brackets`,
      `circle-question-mark`), связи между полями и работа с длинным списком (`link`, `unlink`,
      `arrow-right`, `corner-down-right`, `zap`, `ban`, `asterisk`, `sliders-horizontal`,
      `funnel`, `list-tree`, `wand-sparkles`); `triangle-alert` из заявки уже был. Одиннадцать
      имён второй пачки на момент заявки не рисует никто — взяты вперёд сознательно, решение
      user'а: имя в словаре ничего не весит до отрисовки (значение — ленивый `import()`), а
      вторая заявка через неделю стоит дороже одиннадцати строк.
      Два имени заявки в словарь не встали под своим написанием, и поймал это гейт
      `test/shipped-artifact.test.ts`, а не глаз: `filter` и `circle-help` существуют только в
      ветке `dist/source` пакета (условие `solid`), а в `esm`/`cjs` их нет — `lucide-solid@1.41.0`
      раздаёт по условиям exports-карты РАЗНЫЕ наборы (2066 против 1808 имён, разница — 258
      устаревших алиасов). Взяты канонические `funnel` и `circle-question-mark` (сверено с
      lucide.dev 2026-09-20). Слой «имя кита → имя библиотеки», который позволил бы оставить
      ключ `filter` с загрузчиком `funnel`, сознательно НЕ заводился — его отсутствие это
      принятое решение (`not-own-name-vocabulary` выше), а не пробел, который затыкают попутно
      одной строкой. Потребителю имена названы: `filter` → `funnel`, `circle-help` →
      `circle-question-mark`.
      Урок на будущее, вынесен в FAQ: `ls dist/source/icons` проверкой имени НЕ является —
      это самый широкий набор. Проверяет только прогон гейта, он резолвит каждое имя тем же
      способом, что потребитель без Solid-условия, и растёт вместе со словарём.
      Заодно поправлена цифра в доке: значилось 39 имён при фактических 41 — разошлась до этой
      правки, теперь 59.
  - id: glob-macro-lost-every-icon-in-consumer-build
    type: bug
    date: 2026-09-09
    summary: >
      Заявка витрины: прод-сборка `apps/skin` теряла ВСЕ иконки, дев-сервер — нет. Замерено в
      готовом бандле (`apps/skin/dist/assets/index-*.js`, 2026-09-08): на месте карты иконок стоит
      `Object.assign({})` — `import.meta.glob` раскрылся у потребителя в НОЛЬ совпадений, потому
      что раскрывал его Vite ПОТРЕБИТЕЛЯ относительно `packages/ui/dist/`, а не `src/`. Дев скрывал
      это устройством (`@web-core/build`, `workspace-source.ts`, `apply: "serve"`), `vitest` — тоже.
      Развилку закрывали ЗАМЕРОМ, а не вкусом: `import { icons } from "lucide-solid"` (способ из
      доки lucide для Solid) — 164 КБ gzip в бандл всегда и +30 с сборки; данные из ядра `lucide` —
      94 КБ gzip всегда плюс новая зависимость; порождённая карта на 1808 имён — 120 КБ файла в
      исходниках (это ровно то, что `lucide-react` отдаёт как `lucide-react/dynamic`, но у них она
      ВНУТРИ пакета и пути в ней относительные, поэтому бесплатна; у `lucide-solid` своего
      `./dynamic` нет — сверено с exports-картой 1.43.0). Взят четвёртый: обещание «любое из 1808
      имён» кит не мог сдержать дёшево ни одним способом, поэтому обещание сузили до своего
      словаря — 39 строк, которые кит действительно называет.
  - id: dynamic-bare-specifier-broke-in-real-browser
    type: plan
    date: 2026-09-06
    summary: >
      `vitest` весь прошлый аудит был зелёным на `import(\`lucide-solid/icons/${name}\`)` — но
      живой браузер (`chrome-devtools`, `apps/skin`) падал `Failed to resolve module specifier`:
      Vite не переписывает бэрные пакетные специферы с шаблонной строкой, браузер их резолвить не
      умеет вовсе. Найдено ТОЛЬКО живым прогоном — vitest резолвит такие специферы Node-подобной
      транспиляцией, реального ограничения браузера там нет. Исправлено на `import.meta.glob` с
      файл-относительным путём (не бэрный пакетный специфер — `import.meta.glob` его не
      поддерживает вовсе, проверено; не абсолютный от корня проекта — резолвился бы от корня
      приложения-потребителя, не от кита). Тестовые данные заодно поймали вторую, не связанную
      находку: иконка `trash-2` больше не существует в установленной `lucide-solid@1.41.0`
      (переименована в `trash`) — тест использовал устаревшее имя.

  - id: solid-condition-vs-hardcoded-mjs
    type: plan
    date: 2026-09-06
    summary: >
      Первая реализация `resolveIcon` приклеивала `.mjs` к специфeру
      (`lucide-solid/icons/${name}.mjs`), рассчитывая на условие `"import"`/`"require"` из
      exports-карты пакета. В этом репо резолвится условие `"solid"` (`vite-plugin-solid`), которое
      ведёт на `./dist/source/icons/*.jsx` — с приклеенным `.mjs` подстановка wildcard давала
      несуществующий путь. Проверено эмпирически (`ls` реального `dist/source/icons/`) и
      исправлено: специфер отдан на резолв exports-карте пакета без ручного расширения.

  - id: waitfor-not-fixed-timeout
    type: plan
    date: 2026-09-06
    summary: >
      Черновик теста ждал резолва фиксированным `setTimeout(resolve, 0)` — оказалось короче
      реального времени динамического импорта под Vite/Vitest, тест падал раньше, чем `<svg>`
      появлялся в разметке. Заменено на `vi.waitFor` — поллинг условия вместо угаданного числа
      миллисекунд.

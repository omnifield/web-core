# Дорожная карта каталога `packages/` — работа УРОВНЯ ГРУППЫ: общая поставка, общий гейт, общие
# правила. Пункт про один пакет живёт в роадмапе этого пакета и сюда не дублируется.
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога. Формат тот же, что у сущностей:
# categories → items, log — журнал решений.

categories:
  - category: Поставка группы
    items:
      - id: fixed-group-one-version
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Все пакеты группы держатся на одной версии — `versioning.fixed`"
        description: |
          Решение принято при заведении механики выпуска (2026-09-22) и проверено первой реальной
          поставкой `0.3.0`: восемнадцать пакетов подняты одним номером, `pnpm version -r` собрал
          план из накопленных интентов и породил CHANGELOG каждому.

          Цена названа заранее: пакет без единой правки всё равно получает новый номер. Взамен
          пропадает вопрос совместимости между своими же пакетами — разойтись они не могут.

          Следствие для новой сущности: завёл пакет — вписал его в `versioning.fixed`
          (`../pnpm-workspace.yaml`), иначе он молча выпадет из общей поставки.

      - id: registry-doc-vs-npmrc-drift
        type: bug
        status: Open
        priority: Medium
        milestone: null
        name: "Корневой README называет реестром GitHub Packages, а `.npmrc` указывает на свой Verdaccio"
        description: |
          Найдено architect'ом 2026-09-23 при заведении доки каталога. Корневой `README.md`
          (раздел «Инструменты», подраздел «Реестр пакетов») утверждает: «GitHub Packages
          (`npm.pkg.github.com`) — `publishConfig.registry` объявлен во всех пакетах фреймворка».
          Фактически корневой `.npmrc` объявляет `@web-core:registry=https://150.251.145.87:9873/`
          (свой Verdaccio), и `PUBLISHING.md` описывает выпуск именно туда.

          Что проверить и починить: какой адрес реально стоит в `publishConfig` каждого пакета
          (сверить грепом по `packages/*/package.json`, не по памяти), и привести доку к факту.
          Если `publishConfig` где-то ещё указывает на GitHub Packages — это не только
          расхождение доки, но и риск опубликовать пакет не туда.

          Правка доки — корень (architect); правка `publishConfig` — владелец каждого пакета,
          если расхождение подтвердится.

      - id: release-scenario-of-this-group
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "У группы свой сценарий выпуска — скриптами в `.release/`, на движке `@web-core/cli`"
        description: |
          Решение user (2026-09-23). Движок командных инструментов (`@web-core/cli`) даёт, из чего
          писать тулзы, и про эту группу не знает ничего. СЦЕНАРИЙ выпуска именно этой группы —
          наш, и живёт он рабочей папкой `.release/` в корне репозитория. Штатные шаги выпуска
          (`pnpm version -r`, `pnpm publish -r`) сценарий зовёт напрямую — обёртка над ними
          ничего не добавила бы. Оговорка, стоившая разбора текста: машиночитаемо отдаётся только
          сводка публикации; план выпуска приходит человеческим текстом, `--json` у `pnpm version`
          на него не действует (проверено на pnpm 11.17.0, 2026-09-23).

          Что в сценарии: порядок шагов (план → версии → публикация → проба поставки), условия
          перехода между ними и знание, специфичное для группы — что пакеты держатся одной
          версией (`versioning.fixed`), что приложения и стенды в выпуске не участвуют
          (`versioning.ignore`).

          Ключевое требование, из-за которого сценарий и вынесен в файлы, а не в чью-то голову
          или в пайплайн одной команды: **скрипты одинаковы в любом репозитории**. Те же файлы
          уезжают синком в рабочий репозиторий и работают там же; различаются только переменные —
          адрес реестра, токен, целевая ветка. Девопс берёт из `.release/` готовый сценарий, а
          если ему нужно что-то сверх — строит это у себя из тех же механик, не правя наши
          скрипты.

          Границы: тегов, релизов и мержа сценарий не делает — они на стороне рабочего
          репозитория (решение user, см. `packages/cli/ROADMAP.yaml`'s `scenario-lives-outside`).

          СДЕЛАНО architect'ом 2026-09-23 (корень — его зона). `.release/` заведён членом
          воркспейса (`pnpm-workspace.yaml`, `versioning.ignore` — в выпуске не участвует),
          четыре команды на движке `@web-core/cli`: `plan` · `version` · `publish` · `verify`.
          Знание о группе осталось здесь, механика — в пакете; адрес реестра приходит
          переменной (`NPM_CONFIG_REGISTRY`/`--registry`), в коде его нет.

          Проверено живьём, не только линтером: `plan` на чистом дереве отвечает `nothing`
          (код 0), на временном интенте — `done` с разобранным планом (19 пакетов, `0.3.0 →
          0.3.1`, интент удалён тут же); `verify --only @web-core/io` против живого реестра
          прошёл три шага (`install` 9 с · `import` · `typecheck`), ответ `done`. `publish`
          живьём НЕ прогонялся: это настоящая запись в реестр, её делает выпуск, а не проверка.

          `@web-core/cli` вписан в `versioning.fixed` — группа поставки теперь из 19 пакетов.

  - category: Граница поставки
    items:
      - id: outside-install-is-the-only-proof
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Поверхность поставки проверяется установкой ВНЕ репозитория, а не сборкой внутри"
        description: |
          Внутри монорепо пакеты соединены симлинками, поэтому `exports`, `files`, типы из `dist`
          и диапазоны зависимостей не проверяются вовсе. Два реальных отказа первой публикации
          (2026-09-22) — ручной диапазон `@web-core/style@^0.1.0` в `peerDependencies` скина и
          условие `exports` `development`, ведущее в `src`, — изнутри были невидимы полностью.

          Принято как правило группы: приёмка выпуска — установка опубликованного пакета в чистый
          проект вне репозитория плюс его сборка.

      - id: development-condition-breaks-node-consumers
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Условие `exports` `development` ведёт в `src` — node-потребитель компилирует исходники чужих пакетов"
        description: |
          Найдено architect'ом 2026-09-23 на ревью работы овнеров: `pnpm --filter
          @web-core/studio-mcp typecheck` даёт 479 ошибок вида `Cannot find name 'Element'`,
          `Cannot find name 'document'`, `--jsx is not set` — все на ФАЙЛАХ `packages/ui/src/**`
          и `packages/skin/src/**`, не на своём коде.

          Механизм: `exports` каждого пакета группы несёт `"development": "./src/index.ts"`
          (раскатано коммитом `70587494`, 2026-09-12). Потребитель с node-типизацией
          (`@web-core/build/tsconfig-node`, без `DOM`) по этому условию уходит в ИСХОДНИКИ, где
          есть и JSX, и браузерные глобалы, которых у него нет по построению.

          Проверено: поломка предсуществующая, к правкам зон `skin`/`query` от 2026-09-23
          отношения не имеет — ни одна ошибка не упоминает `presets`/`listHeaders`.

          Что решить (не рецепт, решение за владельцами): нужно ли условие `development` всем
          пакетам группы, или оно уместно только там, где потребитель — браузерное приложение с
          бандлером. Побочный эффект того же условия уже описан в `apps/dashboard/ROADMAP.yaml`
          (`workspace-now-repo-later`): в поставку оно уезжало ведущим в `src`, которых в тарболе
          нет.

          Затрагивает всю группу разом, поэтому пункт стоит здесь, а не в одном пакете: править
          придётся согласованно, а не по одному манифесту.

  - category: Документация группы
    items:
      - id: catalog-doc-triple
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "У каталога своя тройка, корень на неё только ссылается"
        description: |
          Решение user (2026-09-23): каталоги монорепо — самостоятельные единицы со своими
          правилами, и смешивать их описание в корне нельзя. Корень оставляет за собой описание
          самого монорепозитория, состав каждой группы переезжает в её каталог.

          Форма доки каталога отличается от доки сущности (нет `genus`, паспорта, анатомии, IO) —
          шаблон записан в корневом `README.md`, раздел «Каталог — не сущность, и шаблон у него
          свой»: Главное → Критерий включения → Состав ссылками → Общие правила → Как завести
          новую.

log:
  - id: catalog-docs-started-with-packages
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку первым из шести — как пилот формы, по решению user навести
      порядок в доке репозитория. Попутно, при сверке доки с фактом, найдены два расхождения,
      которые до этого никому не принадлежали: адрес реестра в корневом README против реального
      `.npmrc` и условие `exports` `development`, ломающее node-потребителя. Оба записаны
      пунктами здесь, а не починены на ходу: первое — правка доки корня, второе — согласованное
      решение владельцев всех пакетов группы.

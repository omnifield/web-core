      вот тут packages/ui/src/accordion/playground/assemblies/action-list.ts у нас repeat, это
      не оно? если у нас асембл не умеет цикл, то это баг в движке и никаких валидаторов мы не
      делаем — это баг в самом ядре инфры». По факту `repeat` нашёлся — но в
      `packages/skin/src/engine/passport/assembly/expand.ts`, не здесь. User сверил зону сам:
      «репит это не меха скина, это меха сборки. или я что-то путаю? при том что вы сами
      смотрели и ты, и овнер таблицы в assembly пакет и искали repeat там» — то, что architect И
      owner-таблицы (независимо, в разное время) оба инстинктивно искали `repeat` именно в этом
      пакете, было явно принято аргументом самим по себе: если два разных человека ищут
      механику в одном и том же месте и оба ошибаются, ошибается не человек, ошибается место.

      Проверено чтением (не по памяти): `component-registry.ts:133` реально кастует
      `BaseAssemblyTree` (тип `packages/skin`) `as AssemblyTree` (тип этого пакета) — структурно
      совпадающие, независимо объявленные типы; `packages/skin`'s `binding.ts` реализует

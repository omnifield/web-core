      каком виде зависимостей. Одновременно с этим у ДВУХ живых потребителей (`component-
      registry.ts` через `baseAssemblyOf`, `self-assembly-branch.ts` через `growSelfAssembly`) —
      два разных разворачивателя дерева, ни один не мёртвый код.

      Решение user, дословно: «пиши packages/assembly/ROADMAP.yaml — этамеха вообще не
      относится к скину». Роадмап `packages/skin` НЕ пишется сейчас — только после того, как
      owner этого пакета сделает переезд и architect с user вместе прогонят ревью; если ок,

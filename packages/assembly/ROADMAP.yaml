  - id: baseAssemblyOf-signature-mistake-found
    type: plan
    date: 2026-09-12
    summary: >
      Owner `packages/skin` сделал `baseAssemblyOf-becomes-thin-reexport` (свой роадмап) по
      направлению, которое architect записал раньше в `packages/skin/ROADMAP.yaml`: построить
      `ReadablePassport` мержем `ComponentPassport`+`PassportEditorInfo`, тем же приёмом, каким
      `packages/ui/src/component-registry.ts`'s `readable()` строит его для `Registry`. Owner
      сделал это добросовестно и проверил в своей зоне (packages/skin: lint/typecheck/test/build
      зелёные) — но не проверял, ломает ли новая сигнатура кого-то ЗА пределами своей зоны, что и
      обнаружилось у потребителя.

      Architect (при попытке принять пункт) допустил ДВЕ отдельные ошибки, обе исправлены только
      после того, как owner нашёл реальный breakage:

      1. Оценивая «кто вызывает baseAssemblyOf», architect'ов `grep` явно исключал `.test.` файлы
         (`grep -v "\.test\.\|ROADMAP..."`) — вывод «единственный вызывающий» был буквально
         результатом собственного фильтра, не фактом. Без фильтра — 34 файла, ~55 вызовов
         (`packages/ui`, `component-registry.ts` + 33 теста кита).

      2. Сама рекомендация («построй ReadablePassport мержем с editorInfo») была не нужна —
         architect скопировал решение с `readable()` (которой `genus`/`accepts` РЕАЛЬНО нужны для
         `Registry`) на `baseAssemblyOf` (которой не нужны вообще), не прочитав тело функции ПЕРЕД
         тем как советовать. Тело трогает только `component`/`anatomy.keys()`/`root` — три строки
         `grep "passport\."` по файлу.

      User прямо назвал это (не смягчая): «в чём проблема? почему ты не можешь нормально дать ТЗ»
      — и попросил тратить больше токенов на проверку ДО того, как ТЗ уходит owner'у, а не после
      («лучше потратить токены на это, чем тратить токены на переписывание или тем более закладки
      потенциальных багов»). Отдельно попросил впредь различать два разных класса находок: код,
      физически лежащий не в той зоне (как `repeat` раньше), и тип/контракт, навязанный не по
      делу внутри ОДНОЙ зоны (как здесь) — не смешивать разбор одного с другим.

      Разбор в этот раз доведён до конца ИНСТРУМЕНТОМ, не рассуждением: `tsc --strict --noEmit`
      на изолированном файле подтвердил, что `ComponentPassport`-форма реально assignable к
      узкому срезу `{component; anatomy.keys(); root}`, которого одного хватает `baseAssemblyOf`.
      Выборка из 3 дополнительных тестовых файлов (`table`/`select`/`dialog`, не только
      `toggle-group`) подтвердила единообразие формы вызова по всем 34 файлам. Решение —
      `baseAssemblyOf-passport-type-too-wide` выше: сузить тип параметра ЗДЕСЬ, `ReadablePassport`
      саму не трогать (нужна `Registry` целиком). Роадмап `packages/skin` (откат `editorInfo`,
      возврат к 4-аргументной форме) architect пишет СЛЕДУЮЩИМ заходом, после того как этот пункт
      закрыт и проверен, не раньше — по прямой просьбе user: «пиши роадмап assembly, он делает, мы
      ревьюим, потом скин пакет».


log:
  - id: leaf-to-branch-cause-found-in-kit
    type: plan
    date: 2026-09-22
    summary: >
      Заход по `composite-context-lost-for-label-control-positioner-recurrence` (Open, Critical)
      закончился диагнозом, а не фиксом: причина лежит в `packages/ui`, в этой зоне чинить
      нечего. `TreeItem` (`tree-view/components/item/index.tsx`) читает `nodeState().isBranch`
      внутри функции-ребёнка `<ArkNodeContext>`, а Ark вызывает её в ТЕЛЕ своего компонента —
      под `untrack`, без подписки: тернарник `isBranch ? <ArkBranch> : <ArkItem>` вычисляется
      один раз за жизнь узла. Три соседних файла (`content`/`control`/`indicator`) читают тот же
      флаг через `<Show>`, реактивно. Рассинхрон и даёт весь симптом: `content` переключается на
      `Collapsible.Content`, `item` остаётся `ArkItem`, `Collapsible.Root` не появляется,
      `useCollapsibleContext()` — `undefined`, узел остаётся листом навсегда.

      Порядок проверки был обратный привычному и себя оправдал: сперва механизм на голом Solid
      (дёшево, минуты), потом подтверждение живьём. Витрина `apps/studio`, пресет «Дерево —
      оргструктура»: лист «Дизайн» получает первого ребёнка — узел остаётся `treeitem` БЕЗ
      `expandable`, но его шапка в тот же момент становится `button`. Реактивные читатели флага
      переключились, нереактивный нет; значит Zag-коллекция про ветку знает — это добивает и
      гипотезу гонки коллекций (ОБНОВЛЕНИЕ 2 в самом пункте), уже отклонённую иначе.

      Три предыдущих захода искали причину в этой зоне (владелец `<For>`, общий `<Suspense>`,
      способ роста дерева) и все три уткнулись в «голого движка недостаточно». Вывод на будущее
      не про tree-view: когда симптом — потерянный контекст у ОДНОГО из нескольких читателей
      общего флага, сравнивать надо не владельцев, а СПОСОБ ЧТЕНИЯ у каждого читателя. Рабочий
      читатель рядом со сломанным — контрольная группа, которой не хватало прошлым заходам (тем
      же приёмом снято ОПРОВЕРЖЕНИЕ про пустой `Owner.context`).

      Машина этот класс ловит, но не там, где надо: `solid/reactivity` срабатывает на пробе
      `test/children-callback-not-reactive.test.tsx` (пришлось глушить точечно — анти-паттерн
      там предмет), а на самом `packages/ui/.../item/index.tsx` молчит: вызов `props.children()`
      спрятан в вендорном компоненте, на стороне кита видна только JSX-функция. Прогнано
      `npx eslint` по файлу кита — чисто.

      Отдано наружу: фикс за зоной `ui`; конкретное решение — за её владельцем (три соседних
      файла уже показывают рабочую форму). Со стороны этой зоны смена provider-несущей обёртки
      поддержана заранее (`content-of-context-invalidation-on-wrapper-swap`, Done) — перепроверить
      вместе с починенным китом, на той же витрине.

      Прогоны: `test` 49/49 (было 48/48 — плюс проба), `typecheck` чистый. `lint` красный
      четырьмя `solid/reactivity` ДО этой работы — заведено отдельным пунктом
      (`lint-red-on-two-probes`) по решению user'а, чтобы заход остался про диагноз. Поставляемый
      код не менялся ни на символ — версия пакета не поднимается.


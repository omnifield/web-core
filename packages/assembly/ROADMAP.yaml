# Дорожная карта @web-core/assembly — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/build и packages/store (categories → items, log → журнал решений); без
# milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Дерево и содержимое
    items:
      - id: content-as-node
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Содержимое — второй род узла, не проп `children`"
        description: |
          Означает: подпись/значок — узел дерева наравне с частью (`{genus, value}`), лежит в
          общем списке детей, сосуществует и упорядочивается с частями. Прежний проп `children`
          содержимым больше не считается — расхождение называет checkTree (content-in-props).
          Разбор — FAQ.md.

      - id: node-addressing-unified
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Своя часть и чужая ссылка — одно поле узла"
        description: |
          Означает: `{ node: "button" }` ссылается на общий реестр тем же полем, что называет
          свою часть анатомии — «своё или чужое» решает сравнение с анатомией владельца, не
          форма узла. genus:"component" как род содержимого снят (была дохлая ветка).

  - category: Правки и целостность
    items:
      - id: pure-edits
        type: feature
        status: Done
        priority: High
        milestone: null
        name: insertNode/removeNode/moveNode/updateNode — отказ значением
        description: |
          Означает: EditResult = {ok:true, tree} | {ok:false, refusal, means} — недопустимая
          правка не бросает исключение, редактор объясняет причину человеку по имени отказа.

      - id: integrity-check
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: checkTree — все изъяны сразу, не по одному
        description: |
          Означает: root-missing/child-missing/orphaned/cycle/child-shared/content-in-props… —
          значение проверки, не консольное предупреждение (раньше терялось между прогонами).

  - category: Реестр и вложенность
    items:
      - id: registry-supplier-pairs
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Реестр из пар поставщика, не карты потребителя"
        description: |
          Означает: пара (паспорт+части) отдаёт поставщик кита, checkRegistry называет
          расхождение с анатомией значением (part-uncharted/part-not-callable/part-astray).
          Рекурсивная карта компонентов прежнего разрешателя снята вместе с этим.

      - id: nesting-rule-external
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Правило допуска (`admits`) — вход, не собственность механики"
        description: |
          Означает: allowedInside/canAdmit/canContain читают правило, поданное третьим входом
          createRegistry — механика не хранит своего перечня допустимых вложений.

      - id: nesting-reverse-lookup
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: possibleOwnersOf/ownersAdmitting — обратный ход тем же правилом
        description: |
          Означает: скин перечисляет «предка» по адресу правила тем же правилом допуска, что и
          прямой ход — второе правило развело бы «допустимо»/«возможный предок» молча.

  - category: Композиция
    items:
      - id: compose-tree-from-whole-components
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "`composeTree`/`rootNode` — модуль (композиция ЦЕЛЫХ компонентов) одним вызовом"
        description: |
          Заявка user'а (2026-09-11, apps/skin готовит playground: юзер вручную или агентом
          собирает модуль — композицию из нескольких целых компонентов кита, не частей одного
          паспорта). Разобрано, что `canAdmit`/`canContain` уже резолвят кандидата
          `{kind:"component", genus, name}` поперёк ВСЕГО реестра — вложить чужой целый компонент
          в часть чужого паспорта уже работает сегодня (тем же путём, что `Icon`-узел внутри
          `listbox`'а), новой проверки вложенности заводить не пришлось.

          Означает: `rootNode(registry, address, id?)` — первый узел дерева (родителя нет по
          определению, проверять вложенность нечего, только что адрес есть в реестре —
          `insertNode` этот случай не покрывает, ему всегда нужен существующий `parentId`).
          `composeTree(registry, spec, rootId?)` — вложенная спека (`CompositionSpec`, дерево
          `{type, props?, bind?, on?, children?}` из целых компонентов и/или content-листьев)
          обходится рекурсивно, каждый узел кладётся ровно тем же `insertNode`, каким его положил
          бы редактор одним кликом — никакой второй копии правила вложенности. Узел, которому
          отказано, не останавливает сборку соседних веток (его собственные дети дали бы
          `parent-unknown` хором — шум, не новая информация); итог — либо `{ok:true, tree}`
          целиком, либо `{ok:false, refusals}` со ВСЕМИ отказами сразу (тот же приём, что уже
          `checkTree`), частичное дерево наружу не отдаётся.

          Сопутствующая правка: `NewElement` (вход `insertNode`) получил опциональные `bind`/`on`
          — оба поля уже были у `AssemblyElement`, но `insertNode` не умел проставить их при
          СОЗДАНИИ узла (только `updateNode` потом, и то нет — `NodePatch` их тоже не берёт).
          `composeTree` вставляет узел сразу с `bind`/`on`; городить два прохода (вставить, потом
          патчить мимо проверенного API) значило бы обходить движок. Аддитивно, существующие
          вызовы `insertNode` не задеты.

          Тест — `test/compose.test.ts` (новый, `model`-проект, node-окружение, первая целиком
          безбраузерная проба движка сборки в пакете): свой `admits` — копия реальной семантики
          (`packages/skin/src/engine/passport/assembly/admission.ts`), синтетический реестр
          (grid/card/button). Покрыто: `rootNode` (известный/свой id/неизвестный адрес),
          `composeTree` — полная композиция с bind/props/on, свой id узла, content-лист, корень с
          неизвестным адресом, накопление нескольких отказов без остановки соседних веток.
          `pnpm --filter @web-core/assembly test` 29/29, `lint`/`typecheck`/`build` зелёные.
          README (`Анатомия`/`Использование`/`IO`) и FAQ.md (`## Композиция`) обновлены тем же
          заходом.

      - id: composed-into
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "`composedInto` — узел как триггер/содержимое чужого составного компонента"
        description: |
          Означает: кнопка бывает триггером попапа/меню — адрес узла не меняется, композицию
          собирает механизм кита (проп `as`), не своя ветка отрисовки.

  - category: Отрисовка
    items:
      - id: render-tree-core
        type: feature
        status: Done
        priority: High
        milestone: null
        name: RenderTree/RenderNode — один вызов в редакторе и у потребителя
        description: |
          Означает: дерево — данные, второго способа превратить их в вид нет. createComponent
          напрямую (не Dynamic), граница ошибок на каждом узле, явный запасной вид на
          неразрешённый адрес. Перенесено из egor6-66/capsuleTech вместе с причинами.

      - id: invisible-provider
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Невидимый провайдер вокруг компонента без DOM-корня"
        description: |
          Означает: поповер/меню — корневая часть не рисует свой узел, состояние даёт контекст,
          который раздаёт `KitComponent.provider`; RenderTree сам оборачивает корень.

      - id: data-binding
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`{path}` вместо литерала — содержимое и пропы"
        description: |
          Означает: DynamicValue = string | {path}, форма A2UI урезана до литерала и пути.
          `bind` — ОТДЕЛЬНОЕ поле от `props`, не смешано со значением.

      - id: dispatch-events
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`on` — одна точка входа для событий узла"
        description: |
          Означает: DispatchAction резолвит context из DynamicValue до отправки — наружу
          уходит готовый JSON, не сырой DOM Event.

      - id: dispatch-event-binding
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "`on.context` мог прийти только из `data`, не из самого события — фикс"
        description: |
          Означает: EventBinding ({event: "путь.в.событие"}) — третий источник context рядом с
          литералом и DataBinding, резолвится из живого DOM-события В МОМЕНТ вызова обработчика
          (dispatchHandlersFor теперь принимает (domEvent: Event), не () => {...}). Закрывает
          текстовый инпут/textarea/range/select — то, что раньше нельзя было выразить (только
          "отправь то, что уже в data", никогда "отправь то, что юзер только что напечатал").
          Найдено при проектировании сборок Table (global-search/column-filter). Наружу
          по-прежнему уходит плоский JSON, не сырой Event — тот же принцип, что и dispatch-events.
          FAQ.md, test/on-event-binding.test.tsx.

      - id: repeat-node
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Повтор узла по длине массива данных"
        description: |
          Означает: `repeat?: DataBinding` на узле — N разделов из реальных данных, не
          фиксированное число в дереве. Разворачивается ДО RenderTree, в baseAssemblyOf.

      - id: named-ref
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Именованный кусок дерева, объявленный раз, использованный много"
        description: |
          Означает: `{ ref: "имя" }` — на разворотке свои настоящие узлы на КАЖДОЙ площадке, не
          общий граф-узел с двумя родителями (RenderTree обходит дерево, не граф).

      - id: self-assembly-behavior
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Ссылка вызывает своё поведение компонента, не флат-переопределение"
        description: |
          Означает: ComponentPassport.selfAssembly — узкое дерево поведения, growSelfAssembly
          резолвит его рекурсивным вызовом той же механики, данные = props+bind узла-ссылки.

      - id: slots
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Слот живого контента на месте узла"
        description: |
          Означает: `slots?: Record<адрес, SlotEntry>` — узел резолвится как обычно, слот
          меняет только источник СОДЕРЖИМОГО, никогда не подменяет сам узел.

      - id: root-props
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "`rootProps` — динамическое состояние показа корня, дерево не трогает"
        description: |
          Означает: смена (какой элемент активен) доезжает до живого пропа корня геттером — не
          через instanceOf/updateNode, ребёнок не пересобирается на каждый клик.

      - id: content-of-rebuild-freeze
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "Дерево, пересобираемое заново на каждую смену data, теряло байндинг со второй пересборки"
        description: |
          Означает: воспроизведено голым RenderTree (заявка user'а, 2026-09-06) — новый объект
          AssemblyTree на каждый setData, те же id узлов (как у instanceOf кита). Первая
          пересборка доезжала до DOM, вторая и все следующие — нет, DOM замирал на значении
          после первой. Причина — самоубийство ленивого мемо contentOf: Solid диспоузит всё,
          что эффект-потребитель props.children усыновил на прошлом заходе, включая сам мемо
          (если тот усыновлён этим же эффектом и возвращает новую ссылку на каждый пересчёт).
          Первая версия фикса (declared строится один раз, но проверка «пусто ли» читает node()
          снаружи мемо напрямую) чинила это, но пробивала другую дыру — прямое чтение утекало
          подпиской потребителю, тот сам начинал переподписываться, то же самоубийство уровнем
          выше; вторая версия (declared строится один раз ВНУТРИ тела мемо через ленивый `let`)
          ловила третий вариант той же болезни — дети мемо усыновлены им самим. Итоговый фикс —
          три условия разом (declared снаружи мемо, untrack на проверке «пусто», null вместо
          пустого <For> — иначе Ark-паттерн `props.children ?? "*"` молча теряет дефолт, поймано
          на packages/ui's table и field тестах при первой версии фикса). Тест —
          test/rebuild-reactivity-repro.test.tsx. Разбор механизма — FAQ.md.

      - id: content-of-null-vs-for-by-structure
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "contentOf() 0→N после монтирования — null кэшировался навсегда, не только у select"
        description: |
          Заявка owner-skin-app (2026-09-10, `apps/skin/test/render-tree-repeat-reactivity.test.tsx`,
          `apps/skin/ROADMAP.yaml`'s `repeat-items-empty-on-embed`): у `select` (`item` — потомок
          `content` внутри `positioner`) переход 0 items → N items после монтирования не
          подхватывался — `content` в DOM есть, `data-state="open"` честный, но ни одного `item`
          внутри, сколько данные потом ни меняй. У `radio-group` (`item` — прямой потомок `root`)
          тот же переход отрабатывал корректно. Рост уже непустого списка (1→2) у обоих работал —
          ломался конкретно переход 0→N.

          Причина — СОСЕДНЯЯ по коду, но ОТДЕЛЬНАЯ болезнь от `content-of-rebuild-freeze` (та про
          то, ЧТО усыновляет `<For>`; эта — про то, КОГДА решается, рисовать ли его вообще):
          `contentOf()` решает null-vs-`<For>` РОВНО ОДИН РАЗ, на первом обращении к
          `props.children`, глядя на `current.children.length` — величину ДАННЫХ, а не структуры.
          Если узел монтируется раньше, чем `repeat` успевает развернуть детей (данные ещё не
          приехали), `children.length` в этот момент — 0, решение «null» кэшируется В
          `contentCache.memo` НАВСЕГДА (гвард `if (!contentCache.memo)` не даёт пересчитать) — сам
          `<For>`, единственный, кто мог бы подхватить детей позже, просто никогда не создаётся.

          Голый репро (`test/contentof-null-vs-for.test.tsx`, без кита, свой минимальный реестр)
          доказал: дело НЕ в глубине вложенности узла и НЕ в `Portal` (`SelectPositioner` рисуется
          через `Portal` в `document.body` — оба варианта, плоский и вложенный+Portal,
          воспроизводили баг ОДИНАКОВО при старой проверке). Просто у `select`'s `content` первое
          чтение `props.children` чаще успевает случиться раньше, чем у `radio-group`'s `root` —
          момент монтирования у разных компонентов кита разный, но старая проверка была уязвима к
          ЛЮБОМУ порядку, не только к select'ову.

          ПЕРВАЯ версия починки (коммит `4b5ce9a`): критерий null-vs-`<For>` — целиком
          `takesContent(registry, current.type)`, СТРУКТУРНОЕ свойство адреса из реестра (может
          ли эта ЧАСТЬ компонента вообще принимать контент — тот же тест уже стоял рядом, для
          оверлея), не величина `children.length` на момент первого чтения. Тут же названная цена
          («часть, принимающая контент по реестру, но реально без детей навсегда, теряет
          `null`-дефолт») оказалась НЕ гипотетической, а реальной поломкой `field`/`table` — см.
          `content-of-null-vs-for-breaks-ark-native-defaults` ниже, эта версия фикса СУПЕРСЕДНУТА
          финальной (коммит `9b44feb`): критерий — не один, а два разом (`takesContent` решает,
          строить ли `<For>` вообще; `children.length === 0`, проверяемый РЕАКТИВНО внутри тела
          `createMemo`, решает, отдавать ли его на каждом проходе).

          Проверено на живом ките (не только голым репро): `apps/skin/test/render-tree-repeat-reactivity.test.tsx`'s
          `select`-кейс (был `it.fails`, стал зелёным по `expect`) — 0→2 item после пересборки
          `dist/` этого пакета. Находка по ходу: `apps/skin` резолвит `@web-core/assembly/render`
          через `package.json exports` на СОБРАННЫЙ `dist/`, не на исходники — фикс в `src/` не
          подхватывался потребителем без `pnpm build` здесь; тот же урок уже был записан в FAQ.md
          про `content-of-rebuild-freeze` (`stale-dist-not-render-bug` в логе), но ловится заново
          каждый раз, когда правишь этот пакет и проверяешь фикс через потребителя, а не через
          `pnpm test` из корня (который граф Nx пересобирает сам).

      - id: content-of-null-vs-for-breaks-ark-native-defaults
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "Цена content-of-null-vs-for-by-structure оказалась реальной поломкой, не гипотетической — field/table"
        description: |
          `content-of-null-vs-for-by-structure` (выше) сам называет цену: часть, которая ПО
          РЕЕСТРУ может принимать контент, но реально осталась без единого ребёнка НАВСЕГДА (не
          временно, не `repeat`), раньше получала `null` — теперь получает пустой, но truthy
          `<For>`. В доке это названо «известным, принятым компромиссом». Принят он был без
          проверки: ни owner (свои тесты пакета + один целевой тест-потребитель), ни architect на
          ревью (та же проверка, тот же охват) не прогнали ПОЛНЫЙ набор тестов кита
          (`packages/ui`) перед тем как считать фикс готовым.

          Architect прогнал `pnpm --filter @web-core/ui test` при сборе коммита на пуш — красным:
          `src/field/test/field.test.tsx` (1 из 3) и `src/table/test/table.test.tsx` (4 из 23),
          270/275 вместо заявленных где-то 275/275. Причина в обоих случаях ОДНА И ТА ЖЕ, не
          совпадение: часть компонента с Ark-нативным дефолтом на пустое содержимое
          (`props.children ?? "*"` — паттерн `@ark-ui/solid`, сверено чтением исходника,
          `FieldRequiredIndicator` в `dist/chunk/SJA3FTXA.jsx`) перестаёт получать этот дефолт,
          потому что теперь ВСЕГДА получает truthy `<For>`, если часть по реестру `accepts`
          контент — не важно, есть реальные дети или нет.

          - `field`'s `requiredIndicator` (`packages/ui/src/field/playground/parts.ts`: `accepts:
            [{kind:"content",genus:"text"}, {kind:"content",genus:"icon"}]`, means: "по умолчанию
            «*»") — звёздочка обязательности пропадает целиком, поле есть, текста нет.
          - `table`'s заголовки/сортировка — те же 4 теста красные жёстче: не просто пропавший
            текст, `host.querySelectorAll('[data-part="header"]')` — ПУСТОЙ массив, `header-sort-
            trigger` не находится вовсе (`null`, клик падает `TypeError`). Механизм тот же
            (реестр разрешает контент этой части, реальных детей на момент рендера нет), но
            последствие тяжелее — не декоративная деталь, структура таблицы.

          Проверено бисекцией, не по догадке: `git show 4b5ce9a~1:.../render/index.tsx` →
          пересобрать `dist/` → `field`+`table` 26/26 зелёных. Вернуть текущий (постфиксовый)
          `render/index.tsx` → пересобрать → те же 5 тестов красные. Причина — ИМЕННО этот фикс,
          не что-то ещё в дереве.

          ПОЧИНЕНО (коммит `9b44feb`): «может принимать контент по схеме» и «реально когда-нибудь
          получит контент через `repeat`» — РАЗНЫЕ вопросы, и решает их не ОДИН критерий, а ДВА,
          каждый свой. `takesContent` (структурное, по реестру) — решает, строить ли `<For>`
          ВООБЩЕ; часть, закрытая по реестру, `<For>` не получает никогда, тут ничего не
          изменилось. `cur.children.length === 0` — решает, отдавать ли уже построенный `<For>` на
          ЭТОМ проходе, но проверяется НЕ на первом чтении снаружи (тот самый первоначальный баг,
          `content-of-null-vs-for-by-structure`), а РЕАКТИВНО, внутри тела `createMemo` — там, где
          `node()` и так уже читается ради слота, значит подписка не утекает потребителю
          `props.children` (та же ловушка, что чинил `content-of-rebuild-freeze`, не нарушена).
          Часть, всегда пустая (`field`'s `requiredIndicator`, `table`'s невключённая сортировка),
          получает стабильный `null` на каждом пересчёте — Ark-дефолт снова срабатывает. Часть,
          пустая на монтировании но получающая детей через `repeat` (`select`), получает
          `null`→`<For>` по мере прихода данных, не кэшируется навсегда.

          Тест на этот конкретный кейс добавлен четвёртым в `test/contentof-null-vs-for.test.tsx`
          (`openButEmpty` — структурно открытая часть без единого ребёнка навсегда, дефолт должен
          сработать). Перепройден ПОЛНЫЙ `pnpm --filter @web-core/ui test` — 275/275 (было
          270/275) — не выборочно, как в первый раз. Живой `select` (`apps/skin`) — по-прежнему
          0→2 item, регрессии на исходный баг нет.
          тест-потребитель — так и было пропущено оба раза.

      - id: content-of-for-freezes-after-first-nonempty
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "contentOf() — <For> замирал НАВСЕГДА на первом непустом состоянии, дальнейший рост игнорировался"
        description: |
          Заявка user'а напрямую (2026-09-10, живой репро — `select` внутри `apps/skin`'s `Slot`
          открывался с пустым списком, хотя данные есть). Изолировано до ГОЛОГО движка (без
          `apps/skin`, без `Slot`/`Renderer` — только `kitComponentRenderer()`+`RenderTree`):
          `items` растут по одному (`setData` с реальной паузой между вызовами — как клик
          «Добавить» девять раз подряд), а не одним прыжком 0→N.

          Наблюдение: 0→1 (первая непустая запись) подхватывался корректно — список показывал 1
          item. Все ДАЛЬНЕЙШИЕ шаги (1→2, 2→3, ..., 8→9) — список оставался замороженным на 1,
          сколько данных потом ни приезжай. Один прыжок 0→9 (без промежуточных состояний) работал
          штатно — ломался именно ПОСЛЕДОВАТЕЛЬНЫЙ рост через несколько отдельных пересборок ПОСЛЕ
          первого перехода null→`<For>`.

          Механизм — СОСЕДНИЙ с `content-of-rebuild-freeze`, но не тот же: `declared` (`<For>`)
          строится ОДИН РАЗ вне тела `contentCache.memo` (фикс `content-of-rebuild-freeze`),
          усыновляясь реактивным владельцем, что жив НА МОМЕНТ первого вызова `contentOf()` — а это
          ТРАНЗИТНЫЙ эффект-потребитель (`props.children`'а читателя, то есть эффект `insert()`,
          что вставляет детей в DOM у `content`), не сам `RenderNode`. Пока `contentCache.memo()`
          отдаёт `null` (0 items), этот потребительский эффект не имеет причин перезапускаться. Как
          только `children.length` впервые становится > 0, `memo()`'s выход меняется (`null` →
          `declared`, РЕАЛЬНАЯ смена ссылки) — потребительский эффект ОБЯЗАН перезапуститься, чтобы
          вставить `declared` в DOM. Solid ПЕРЕД повторным запуском эффекта диспоузит всё, что было
          усыновлено ИМ ЖЕ на ПРЕДЫДУЩЕМ заходе — а `<For>` был создан именно на этом (первом)
          заходе этого же эффекта (тот же вызов `contentOf()`, тот же владелец). `<For>` умирал
          вместе с чисткой; ссылка `declared` переживала (используется дальше как обычный
          неизменный JSX), но её внутренняя реактивность была уже мертва — дальнейшие изменения
          `node().children` никто не слушал.

          ПЕРВАЯ попытка — `runWithOwner(getOwner_из_тела_createContentOf, () => <For>...)`,
          усыновить `<For>` владельцем самого `RenderNode`. СЛОМАЛА контекст: этот `getOwner()`
          захвачен ДО того, как `rendered()` вообще построит `Comp` (`Select.RootProvider` и
          подобное) — `runWithOwner` туда перепривязывает не только диспоуз, но и РАЗРЕШЕНИЕ
          КОНТЕКСТА (`useContext` идёт по цепочке владельцев, не по DOM), поймано сразу же полным
          прогоном `pnpm --filter @web-core/ui test` — `useSelectContext() === undefined` у
          `label`/`control`/`positioner` (детей ROOT'а, не только `content`).

          ПОЧИНЕНО: `createRoot((dispose) => <For>...)` вместо `runWithOwner`. Solid: root с
          АРНОСТЬЮ-1 колбэком (`dispose` явным параметром) — не «unowned», наследует `context` от
          ТЕКУЩЕГО владельца на момент вызова (`dev.js`'s `createRoot`, `root.context = current ?
          current.context : null`) — то есть выполняется ТАМ ЖЕ, где выполнялся раньше (внутри
          того самого первого вызова `contentOf()`, внутри контекста `Comp`), но с СОБСТВЕННОЙ,
          независимой от родителя, границей диспоуза — родительский (транзитный) эффект больше не
          может утащить `<For>` за собой при повторном запуске. Ручной `dispose` пристёгнут через
          `onCleanup` к ДРУГОМУ, долгоживущему владельцу (`getOwner()` из тела `createContentOf`,
          тело `RenderNode`) — ТОЛЬКО как получатель «узел размонтирован НАВСЕГДА», не как владелец
          рендера/контекста.

          Проверено: `test/select-incremental-growth.test.tsx` (голый движок, новый файл) — рост
          по одному 0→1→...→9 подхватывается на КАЖДОМ шаге, не только на первом и последнем.
          `apps/skin/test/select-in-slot-repro.test.tsx` — то же самое через РЕАЛЬНЫЙ `Slot`+
          `Carousel`, включая «клик до конца роста, потом items дорастают». Полные прогоны без
          выборки: `pnpm --filter @web-core/assembly test` 21/21, `pnpm --filter @web-core/ui
          test` 275/275 (тот самый набор, что ловил предыдущую регрессию field/table), `pnpm
          --filter @web-core/skin-app test` 27/27. Ни одного красного.

      - id: composite-context-lost-for-label-control-positioner-recurrence
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "Узел, отрисованный ЛИСТОМ, получает первого ребёнка — его содержимое падает ContextError и ветка не растёт (причина найдена 2026-09-22, лежит в packages/ui)"
        description: |
          ✅ ЗАКРЫТО 2026-09-22: кит починен (`fix(ui): tree-view — лист, ставший веткой,
          переключает обёртку реактивно` — тернарник заменён на `<Show>`), правок в этой зоне не
          потребовалось ни одной.

          Принято architect'ом после проверки ДВУМЯ способами, не по отчёту:
          - тест кита (`tree-view/test/tree-view.test.tsx`, новый сценарий) идёт путём настоящего
            потребителя — `instanceOf`+`RenderTree`, данные дают листу первого ребёнка,
            проверяются переход, раскрытие, рендер ребёнка и пустая консоль; 321/321 зелёные;
          - живьём в браузере, тем же сценарием, каким баг ловился: на витрине `apps/studio`
            лист «Дизайн» получил первого ребёнка и стал настоящей веткой — на реальном узле
            `data-branch` и `data-state="closed"`, ребёнок в разметке, клик по раскрытию
            отрабатывает, консоль чистая. До фикса на этом же шаге узел оставался листом навсегда.

          Урок этой заявки, который стоит держать при следующем таком разборе: сообщение движка
          (`[web-core-assembly] узел «content» упал при отрисовке…`) называет МЕСТО падения, а не
          виновника — падал чужой компонент внутри нашей границы ошибок. Три захода искали причину
          внутри зоны именно из-за этого.

          🎯 ПРИЧИНА НАЙДЕНА (owner-assembly, 2026-09-22) — она НЕ в этой зоне, чинить нечего здесь.
          Всё, что ниже, — хроника расследования; расходится с этим блоком — прав этот блок.

          Диагноз: `packages/ui/src/tree-view/components/item/` читает один и тот же флаг
          `nodeState().isBranch` ДВУМЯ разными способами, и только один из них реактивен.
          `index.tsx` (`TreeItem`) читает его внутри функции-ребёнка `<ArkNodeContext>`, а Ark
          вызывает её в ТЕЛЕ своего компонента (`var TreeViewNodeContext = (props) =>
          props.children(useTreeViewNodeContext())`, `@ark-ui/solid@5.39.1`) — тело компонента
          исполняется под `untrack` (`createComponent`), подписки нет, тернарник
          `isBranch ? <ArkBranch> : <ArkItem>` вычисляется РОВНО ОДИН РАЗ. Соседние
          `content.tsx`/`control.tsx`/`indicator.tsx` читают тот же флаг через `<Show>` —
          реактивно, на каждое изменение.

          Отсюда весь симптом: у узла, ставшего веткой ПОСЛЕ монтирования, `content` честно
          переключается на `ArkBranchContent` (= `Collapsible.Content`), а `item` остаётся
          `ArkItem` — значит `ArkBranch` (= `Collapsible.Root`, единственный, кто заводит
          провайдер) не появляется вовсе, и `useCollapsibleContext()` возвращает `undefined`.
          Узел остаётся листом навсегда по той же причине: перерисовать его в ветку больше
          некому. Данные, приехавшие готовыми, проходят мимо бага — на первом (и единственном)
          вычислении тернарника флаг уже верный.

          Доказано наблюдением, не рассуждением. Витрина `apps/studio`, пресет «Дерево —
          оргструктура», лист «Дизайн» получает первого ребёнка через панель «Данные»: в a11y-
          снимке узел остаётся `treeitem` БЕЗ `expandable` (то есть `ArkItem`), но его шапка тут
          же становится `button` — то есть `ArkBranchControl`. Реактивные читатели флага
          переключились, нереактивный — нет; Zag-коллекция при этом про ветку ЗНАЕТ (иначе не
          переключился бы и control). Это снимает заодно и гипотезу гонки коллекций
          (ОБНОВЛЕНИЕ 2 ниже), уже отклонённую другим путём.

          Механизм отдельно зафиксирован машиной: `test/children-callback-not-reactive.test.tsx`
          — голый Solid, без кита и без этого движка: callback-форма замирает на первом значении,
          `<Show>` над тем же сигналом переключается. Проба держит ЧУЖОЙ паттерн, поэтому и
          названа так, а не по механике зоны.

          Почему машина не поймала раньше: `eslint-plugin-solid`'s `solid/reactivity` ловит
          ровно этот анти-паттерн (на пробе выше срабатывает, пришлось глушить точечно), но на
          `packages/ui/src/tree-view/components/item/index.tsx` молчит — вызов
          `props.children(...)` спрятан в вендорном компоненте, на стороне кита видна только
          JSX-функция. `npx eslint` по этому файлу — чисто, прогнано.

          Владелец фикса — зона `ui`, не эта: `isBranch` в `TreeItem` нужно читать реактивно
          (тем же `<Show>`, каким его уже читают три соседних файла, либо иным способом на
          усмотрение владельца — выбор решения его, не мой). Паттерн в ките ровно один, проверено
          `grep`'ом: `isBranch` читают четыре файла, три через `<Show>`, один через callback;
          `props.children(` в `packages/ui` не встречается больше нигде. Значит ответ на вопрос
          заявки «ловится ли на accordion/select» — НЕТ, и не может: переход лист→ветка там не
          существует как механика, обёртка компонента от данных не зависит. «Положить узел внутрь
          пустого узла» у компонента за Provider'ом (`select`, `popover`) — это 0→N детей БЕЗ
          смены обёртки, и этот путь рабочий, его держат `test/contentof-null-vs-for.test.tsx` и
          `test/select-incremental-growth.test.tsx`.

          Со стороны этой зоны смена provider-несущей обёртки вокруг `props.children` уже
          поддержана (`content-of-context-invalidation-on-wrapper-swap`, Done,
          `test/nested-provider-lazy-open.test.tsx`) — когда кит начнёт переключаться реально,
          кэш `declared` перестроится под новый контекст. Проверить это вместе с починенным китом
          стоит тем же приёмом (витрина, тот же пресет), но уже после фикса в `ui`.

          ⚠️ Перепроверка architect'ом живьём
          2026-09-22 (chrome-devtools, витрина `apps/studio`) — ПОСЛЕ всех фиксов и опровержений,
          2026-09-22 (chrome-devtools, витрина `apps/studio`) — ПОСЛЕ всех фиксов и опровержений,
          накопленных в этом пункте. Баг ЖИВ, но граница у него заметно уже, чем описано ниже, и
          два исходных симптома больше не воспроизводятся вовсе. Вся история под этим блоком —
          хроника расследования, а не текущее состояние; расходится с ней — прав этот блок.

          ЧТО БОЛЬШЕ НЕ ВОСПРОИЗВОДИТСЯ (проверено кликами, dev-сервер витрины):
          - переключение компонента в дереве слева (`date-picker` → `slider` → `file-upload` →
            обратно) — ноль ошибок в консоли. Исходный симптом «мигает при смене компонента»,
            ради которого пункт заводился, сегодня не ловится ни разу.
          - клик по раскрытию ветки, ПРИЕХАВШЕЙ с данными (пресет «Дерево — оргструктура», ветка
            «Инженерия» с двумя детьми) — раскрывается чисто. Это был репро owner-ui из
            «ОБНОВЛЕНИЯ 3» ниже; сегодня он пуст.

          ЧТО ВОСПРОИЗВОДИТСЯ УСТОЙЧИВО, за полминуты, И В DEV, И В ПРОД-СБОРКЕ (`vite build` +
          `vite preview`, то есть это НЕ артефакт дев-сервера и не `solid-refresh`):

          ```
          [web-core-assembly] узел «content-5» (tree-view.content) упал при отрисовке:
          ContextError: useCollapsibleContext returned `undefined`
          ```

          Условие ровно одно: узел, УЖЕ ОТРИСОВАННЫЙ КАК ЛИСТ, получает СВОЕГО ПЕРВОГО ребёнка.
          Не «рост 1→2», не «0→N одним прыжком на монтировании», не смена компонента — именно
          переход лист→ветка у живого, уже нарисованного узла.

          Последствие НЕ косметическое, и это уточнение против прежней формулировки («мигает, потом
          стабилизируется»): узел остаётся листом НАВСЕГДА. В прод-сборке на пресете «Дерево —
          оргструктура»: у «Дизайн» в данных появился ребёнок, в разметке узел остался без
          раскрытия и без детей, соседняя «Инженерия» (приехала веткой сразу) при этом работает.
          То есть содержимое ветки не рисуется вовсе, а не мигает.

          Шаги репро (витрина, любой режим): `/showcase/tree-view` → панель «Данные» → «Добавить»
          (появится item) → раскрыть его → заполнить `value`/`label` → «Добавить» внутри
          `children`. Ошибка печатается в момент последнего клика, по одной на каждую ячейку показа.

          ЧТО ЭТО ЗНАЧИТ ДЛЯ ПРИОРИТЕТА (решение architect, на сверку владельцу): приложение, где
          данные приезжают готовыми, этого пути не проходит — дерево строится один раз, узел сразу
          знает, ветка он или лист. Зато РЕДАКТОР КОМПОЗИЦИИ проходит его постоянно: «положить узел
          внутрь пустого узла» — это буквально лист→ветка, и не только у `tree-view`, а у любого
          компонента, чьё содержимое живёт за Provider'ом (`Collapsible`, `Select`, `Popover`…).
          Заявка на модули/playground упирается в этот пункт напрямую.

          ЧЕГО ЭТА ПЕРЕПРОВЕРКА НЕ ДЕЛАЛА: не искала причину (три гипотезы уже отклонены ниже, см.
          ОБНОВЛЕНИЯ 1–3 и ОПРОВЕРЖЕНИЕ), не трогала код, не проверяла, воспроизводится ли переход
          лист→ветка на компонентах помимо `tree-view` — это первое, что стоит сделать владельцу:
          если ловится на `accordion`/`select` тем же приёмом, значит дело не в `tree-view`, и
          голый репро (которого до сих пор не получилось собрать) строится на самом простом из них.

          ───────────────────────── история расследования ─────────────────────────

          Найдено architect'ом живьём (2026-09-14, chrome-devtools, `apps/skin`, `http://
          localhost:5174/showcase/date-picker`, клик по компоненту в дереве слева) — user поймал то
          же на `/showcase/button` для `slider`/`file-upload` независимо, до этого. Консоль
          `[web-core-assembly]`, дословно:

          ```
          узел «label» (date-picker.label) упал при отрисовке: ContextError: useDatePickerContext
          returned `undefined`. Seems you forgot to wrap component within <DatePickerProvider />
          узел «control» (date-picker.control) — та же ошибка
          узел «positioner» (date-picker.positioner) — та же ошибка
          ```

          Ровно ТРИ повтора одного и того же трио (label/control/positioner), затем рендер
          стабилизируется и компонент работает корректно (проверено снимком DOM после — реальный
          календарь с кликабельными днями, `input`/`trigger`/`clearTrigger` — без единой ошибки).
          Визуально это и есть "мигает" из жалобы user — узел падает, `ErrorBoundary` показывает
          фолбэк, следующая попытка чаще всего проходит.

          Воспроизведено дважды: сначала при переключении компонента в дереве (HMR теоретически мог
          участвовать — шли параллельные правки в `apps/skin`), ПОТОМ повторно ПОСЛЕ жёсткой
          перезагрузки страницы (Ctrl+Shift+R, ни один файл не сохранялся) — ошибка та же, просто на
          другом компоненте (`date-picker` вместо `slider`/`file-upload`). Значит НЕ HMR/`solid-
          refresh`-артефакт (тот стирается в `vite build`+`preview`, живой прод-стенд не проверен —
          решение user, проверять ли отдельно), воспроизводится и на холодном маунте.

          ПОЧЕМУ это сюда, а не в `packages/skin`/`apps/skin`: имена узлов и сам класс ошибки —
          БУКВАЛЬНО те же, что уже ловил и чинил этот пакет в `content-of-for-freezes-after-first-
          nonempty` (выше в этой же категории): "`useSelectContext() === undefined` у `label`/
          `control`/`positioner` (детей ROOT'а, не только `content`)" — тогда причина была в первой,
          неудачной версии фикса (`runWithOwner(getOwner_из_тела_createContentOf, ...)`), из-за
          которой `<For>` детей узла усыновлялся владельцем ВЫШЕ того места, где `Comp` (тогда
          `Select.RootProvider`) заводит свой контекст — рабочим лечением стал `createRoot((dispose)
          => <For>...)` (`content-of.tsx:121-141`, СЕЙЧАС уже в этом виде, не откачен).

          Гипотеза (НЕ подтверждена трассировкой, только по совпадению симптома — линия
          расследования для owner'а, не готовый диагноз): тот же класс проблемы — владелец/контекст,
          в котором `createContentOf`'s `createRoot` РЕАЛЬНО выполняется на ПЕРВЫЙ вызов `contentOf()`
          — способен оказаться "не тем" в КАКОМ-ТО из путей монтирования составных (Provider-
          требующих) компонентов, помимо `select`, для которого баг уже ловился тестом. Три ровных
          повтора одного и того же трио перед стабилизацией — намёк, что дело не в разовой гонке, а
          в чём-то, что переигрывается детерминированно 3 раза (`signature`-гейтинг `<For each=
          {[signature()]}>` в `render-node.tsx:133-160`? Сама цепочка `RenderTree`'s `<Show when=
          {provider()} fallback={root()} keyed>`, `render-tree.tsx:29-34,51-63`? Не проверено —
          `provider()`'s зависимости прочитаны architect'ом, выглядят синхронными и стабильными
          (`registry` — module-level константа в `apps/skin/shared/ui/renderer/index.tsx:6`), но
          сама причина ТРЁХКРАТНОГО повтора не найдена).

          Тест-покрытие (`test/contentof-null-vs-for.test.tsx` и смежные) сегодня проверяет именно
          `select` — судя по тому, что бага НЕ поймал, вероятно не покрывает составные компоненты с
          `.provider` на РЕГИСТРОВОМ уровне (`RenderTree`'s отдельный `provider()`-механизм,
          `render-tree.tsx`), только repeat-контент внутри одного дерева без внешнего Provider.

          НЕ входит в объём этой заявки (только диагноз и репро, чинить — за owner'ом): точный
          механизм тройного повтора, выбор фикса, тест на голом реестре с составным Provider-
          компонентом (по образцу `select-incremental-growth.test.tsx`, но с реальным `.provider`,
          не только repeat).

          ОБНОВЛЕНИЕ (owner-assembly, 2026-09-15) — третий живой случай, tree-view, разобран
          трассировкой в реальном браузере (chrome-devtools, `apps/skin/showcase/tree-view/demo`),
          не только по совпадению симптома. Репро: узел без детей ("Alpha", лист) получает ПЕРВОГО
          ребёнка через редактор (`recur`) — в консоли ОДНОВременно:

          ```
          узел «content» (tree-view.content) упал: ContextError: useCollapsibleContext returned
          `undefined`. Seems you forgot to wrap component within <CollapsibleProvider />
          узел «item-2» (tree-view.item) упал: TypeError: Cannot read properties of undefined
          (reading 'isBranch')
          ```

          Проверенная и ОТКЛОНЁННАЯ гипотеза: «declared» (кэш `<For>` в `contentOf()`) переживает
          смену обёртки вокруг `props.children` (лист рисует голый `<div>`, ветка —
          `Collapsible.Content`, заводящий свой provider) и несёт владельца от старой,
          безпровайдерной обёртки. По этой гипотезе сделан и подтверждён ОТДЕЛЬНЫЙ, реальный баг
          (см. `content-of-context-invalidation-on-wrapper-swap` ниже, есть тест) — но живьём, с
          трассировкой `Owner.context` до/после перехода лист→ветка, для tree-view она НЕ
          подтвердилась: `contentOf()` для узла «content» вызывается из ОДНОГО и ТОГО ЖЕ владельца
          что до, что после (значит фикс по сравнению владельца тут не срабатывает, и не должен —
          кэш ведёт себя корректно с этой стороны). Настоящая находка: уже на ПЕРВОМ построении
          `declared` (пока узел ещё лист) `Owner.context` у вызывающего — ПУСТОЙ объект, `{}`, без
          единого ключа: не хватает даже контекста, который `TreeRoot` (корень всего дерева,
          `ArkRoot`/`TreeViewProvider`) заводит заметно выше. Значит обрыв владельческой цепочки
          происходит РАНЬШЕ, чем долетает до content-of.tsx — где-то между `TreeRoot` и первым
          вызовом `contentOf()` у листа.

          Рабочая гипотеза (снова НЕ подтверждена до конца, линия расследования): `RenderTree`
          заворачивает ВСЁ дерево в ОДИН общий `<Suspense>` (`render-tree.tsx`), а
          `controlIndicator` (стрелка раскрытия) существует ТОЛЬКО у веток и тянет настоящую
          `Icon` — ровно то же самое суспенс-поведение, что уже описано в кит-тесте tree-view
          (`RenderTree` wraps everything in one `<Suspense>` — a branch's real Icon indicator
          suspends the whole tree until it resolves"). Переход лист→ветка — это ОДНОВРЕМЕННО (а)
          первое появление `controlIndicator` (новый suspense-триггер) И (б) первый вызов
          `contentOf()` у content-узла этой ветки — оба события бьют по ОДНОМУ и тому же общему
          Suspense-барьеру в ОДИН и тот же момент. Дальнейшая цепочка вложенных `createRoot`
          (`content-of.tsx`, один на каждый уровень recur) поверх ОДНОГО suspense-boundary на ВСЮ
          сборку — кандидат на то, где именно рвётся владелец, но НЕ прослежено до конкретной
          строки: остановлено здесь по бюджету расследования, не потому что тупик.

          Стек падения (реальный, `Error.captureStackTrace`, `apps/skin`, chrome-devtools) —
          обрывается на `runComputation`/`updateComputation`/`devComponent`, то есть оба узла
          («content» и «item-2») падают ВНУТРИ отдельно планируемого реактивного пересчёта
          (Solid-scheduler), не как прямое продолжение исходного синхронного рендера — согласуется
          с гипотезой про suspense-резюме, но само по себе её не доказывает.

          НЕ входит в объём этой заявки (снова только диагноз, теперь заметно точнее прежнего):
          проверить гипотезу про `<Suspense>`+`controlIndicator`'s `Icon` предметно (например,
          собрать голый репро с намеренно async-резолвящимся дочерним узлом внутри ОДНОГО
          Suspense, растущим через `recur`), найти точную строку обрыва, выбрать фикс.

          ОБНОВЛЕНИЕ 2 (owner-assembly, 2026-09-15, тот же заход) — гипотеза про `<Suspense>`
          ПРОВЕРЕНА голым тестом и ТОЖЕ ОТКЛОНЕНА: `test/suspense-recur-context.test.tsx` — сиблинг
          с настоящим `createResource` (аналог `Icon`), подвешивающий ОБЩИЙ `<Suspense>` РОВНО в тот
          же тик, когда `content` растит первого `recur`-ребёнка — зелёный, `useContext()` доезжает
          корректно и после резюме. Заодно проверена и ОТКЛОНЕНА третья гипотеза — что дело в
          СПОСОБЕ роста дерева (`test/real-recur-context.test.tsx`: тот же сценарий, но дерево
          растёт ЧЕРЕЗ РЕАЛЬНЫЙ `baseAssemblyOf`/`expand.ts`, recur на самом `root`-узле паспорта —
          как у tree-view, а не через вручную склеенный `AssemblyTree`-литерал) — тоже зелёный.

          Три голых гипотезы отклонены голыми тестами (все три теста остаются в репозитории —
          `test/nested-provider-lazy-open.test.tsx` доказал ОТДЕЛЬНЫЙ реальный баг ниже,
          `suspense-recur-context`/`real-recur-context` — просто фиксируют, что ЭТИ пути НЕ ломают
          контекст, тем же приёмом, каким `test/context-repro.test.tsx` уже держит в репо
          отклонённых подозреваемых по PWEB-214). Значит голого движка (Solid + мой `content-of.tsx`
          + `baseAssemblyOf`) для репро НЕДОСТАТОЧНО — нужен РЕАЛЬНЫЙ `@ark-ui/solid`/`@zag-js/tree-
          view`, не имитация через голый `<Show>`+`Ctx.Provider`.

          Новая, ещё не проверенная гипотеза (следующий заход): `TreeRoot` строит `TreeCollection`
          (`createItemTreeCollection`, `root.tsx`) — СВОЙ, ВНУТРЕННИЙ реактивный снимок дерева у
          Zag-машины, производный от `items`, ПАРАЛЛЕЛЬНО тому, как `baseAssemblyOf`/`recur` строит
          СВОЁ собственное дерево узлов из ТЕХ ЖЕ данных — но по РАЗНЫМ реактивным путям (наш —
          через `data`-сигнал в `apps/skin`, машины — через `items`-проп, зашитый в `rootProps`).
          Если эти два производных дерева обновляются НЕ в один и тот же тик Solid-планировщика,
          новый `recur`-узел («item-2») может существовать в НАШЕМ дереве раньше, чем Zag-машина
          узнаёт о нём — `nodeState()` (`ArkNodeContext`, `useTreeViewNodeContext`) ищет узел по
          `value`/`indexPath` в ЕЩЁ СТАРОЙ коллекции машины и не находит, отсюда `undefined`.
          Совпадает с наблюдением «стек падения обрывается на `runComputation`» (гонка двух
          НЕЗАВИСИМЫХ реактивных пересчётов) и с тем, что баг НЕ ловится ни у select/date-picker
          repeat-тестов (там нет СВОЕЙ параллельной Zag-коллекции над тем же деревом), ни у
          некоторых пробных сборок (нужно, чтобы recur рос ОДНОВременно с обновлением коллекции).

          НЕ входит в объём этой заявки: подтвердить гонку (трассировка обеих реактивных цепочек —
          `baseAssemblyOf`'s пересборка и `createItemTreeCollection`'s memo — в один момент
          времени), найти фикс. Скорее всего фикс живёт НЕ в `packages/assembly` (гонка — между
          `apps/skin`'s данными и `packages/ui`'s `TreeRoot`, а не в самом движке отрисовки), но
          диагноз пока недостаточно точен, чтобы решить это с уверенностью — следующему заходу
          нужен РЕАЛЬНЫЙ кит (`@web-core/ui`'s `tree-view`), не голый движок.

          ОБНОВЛЕНИЕ 3 (owner-ui, 2026-09-15) — гипотеза про гонку ПРОВЕРЕНА живьём и ОТКЛОНЕНА,
          причём сильнее прежних: ветка «Alpha» с двумя детьми (a1/a2) уже полностью отрисована,
          `items`/`data` НЕ меняются — просто клик по уже существующему контролу, чтобы раскрыть.
          Падение (`item-2`/`item-3` `isBranch` undefined, следом `getBoundingClientRect is not a
          function` ×50) воспроизводится на ГОЛОМ клике, без единой мутации данных в этот момент —
          пересчитываться в момент клика попросту нечему, гонка двух реактивных цепочек НАД ОДНИМИ
          данными тут физически не может быть причиной. Спусковой крючок — сам переход
          closed→open, то есть похоже, что содержимое ветки внутри Ark/Zag `Collapsible`
          домонтируется ЛЕНИВО (вопреки более раннему выводу этого же файла, что `lazyMount`/
          `unmountOnExit` нигде не выставлены и `unmounted` должен быть `false` всегда, — то ли
          вывод был неполон, то ли ленивое поведение прячется на уровне, что не проверялся). Та же
          территория, что уже помечена здесь и в `content-of.tsx:120-142` — `Owner.context` пуст
          уже на ПЕРВОМ построении `declared`, вопрос лишь КОГДА именно происходит этот первый
          вызов (при данных или при клике — конкретный триггер оказался вторичным, оба пути
          упираются в одно и то же).

          Побочная находка (owner-ui, не закрыта): пройдя по реальному пути прод-рендера
          (`Renderer` → `component-registry.ts`'s `instanceOf` → `updateNode`), не нашёл, где
          `items` (проп, которым `TreeRoot` строит СВОЮ Zag-коллекцию, `root.tsx`) вообще попадает
          на корень — ни `bind`, ни `rootProps` в этой цепочке его не несут, `tree-view/playground/
          assemblies/base.ts`'s корневой узел тоже без `bind`. При этом «Alpha» (item-1) корректно
          получает `data-branch`/`data-state` от Ark — коллекция Zag ЧТО-ТО про него знает, значит
          `items` куда-то доходит НЕ через найденный путь. Либо особый кит-конвеншн, не найденный
          при разборе, либо ещё один кандидат на «здесь теряются данные/контекст», ОТДЕЛЬНЫЙ от
          `recur` — стоит проверить независимо, вне рамок этой заявки.

          ОПРОВЕРЖЕНИЕ (owner-assembly, 2026-09-15, тот же заход) — САМ диагноз «`Owner.context`
          пуст уже на первом построении» оказался ложным следом, не причиной. Прошёл цепочку
          владельцев (`.owner`) от места первого вызова `contentOf()` до `null` целиком (не только
          `.context` ближайшего) для КАЖДОГО узла живого дерева — включая ЛЕВЫЙ КАТАЛОГ
          (Actions/Inputs/...), который открывается кликом БЕЗ единой ошибки. Результат ОДИНАКОВ
          везде: 200–370 уровней, ни одного `Provider`-ключа нигде по всей цепочке, до самого
          `null` — И у сломанной «Alpha», И у рабочего каталога. Значит пустой `Owner.context` в
          момент первой сборки `declared` — это НОРМА для этого приложения (Context API тут, судя
          по всему, почти не используется вне самих Ark-компонентов), не диагностический признак.
          Моя более ранняя формулировка «не хватает контекста, который TreeRoot заводит заметно
          выше» (см. выше) — снята, была основана на неполном сравнении (без рабочего каталога
          как контрольной группы).

          Значит настоящее различие между «Actions» (работает) и «Alpha» (ломается) — НЕ в
          `content-of.tsx`'s захвате владельца при первой сборке (там всё одинаково у обоих). Разбор
          останавливается здесь: голого движка недостаточно, инструментированная трассировка внутри
          `content-of.tsx` тоже не различает рабочий и сломанный случаи — разница должна быть В
          ТОМ, ЧТО ИМЕННО отличает сборку `tree-view`'s `recur`-узла от каталога-навигации
          структурно (адрес узла, `composedInto`, слой `TreeItem`/`ArkNodeProvider` конкретно для
          ПОВТОРНОГО инстанса ТОГО ЖЕ адреса) — самый прямой следующий шаг: сравнить ПОЭЛЕМЕНТНО,
          чем реестр/сборка каталога-навигации (какой бы ассембли она ни использовала) отличается
          от `recur`'нутого tree-view по структуре узлов, а не по реактивности/владельцам — это,
          возможно, уже не про `Owner`/`Suspense` вообще, а про то, что recur-узел — это
          ПОВТОРНЫЙ адрес корня компонента (`type` совпадает с самим `item-1`), а каталог — обычная
          статическая вложенность без повторного использования корневого адреса.

      - id: content-of-context-invalidation-on-wrapper-swap
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "contentOf() — кэш `declared` не перестраивался при смене provider-несущей обёртки вокруг props.children"
        description: |
          Найдено при разборе `composite-context-lost-for-label-control-positioner-recurrence`
          (выше) — реальный, доказанный ОТДЕЛЬНО от tree-view баг (для tree-view эта гипотеза
          эмпирически ОТКЛОНЕНА, см. обновление выше), но сам по себе валидный: если владелец
          узла, что читает `props.children` (=`contentOf()`), меняется МЕЖДУ двумя вызовами —
          например, СНАЧАЛА читает голый `<div>` (без provider), ПОТОМ, после структурного
          изменения у узла, читает обёртка, заводящая СВОЙ `<X.Provider>` — закэшированный
          `declared`/`createRoot` продолжает нести владельца от ПЕРВОГО (безпровайдерного) чтения
          НАВСЕГДА, дети внутри ловят `useContext() === undefined`.

          Починено: `contentCache` хранит не только `memo`, но и `Owner.context` (приватное поле
          Solid, `dev.js`) вызывающего на момент постройки — новый вызов с ДРУГИМ `.context`
          (сравнение по ссылке, не по значению) диспоузит старый `createRoot` и строит `declared`
          заново из-под текущего владельца. `.context` — не `Owner` целиком: `DoubleReader`
          (`slots.test.tsx`, `props.children` читается дважды в ОДНОМ теле компонента) — два разных
          транзитных эффекта, ОДНА и та же цепочка провайдеров — сравнение по ссылке на `Owner`
          ломало бы этот законный случай, по `.context` — нет (проверено, тест зелёный).

          Тест — `test/nested-provider-lazy-open.test.tsx`, голый движок: узел без provider (0
          детей) → тот же узел с provider (1+ детей), контент, смонтированный ДО появления
          provider, обязан увидеть его ПОСЛЕ. Красный без фикса (`ORPHAN` вместо ожидаемого
          значения), зелёный с ним. Полные прогоны: `pnpm --filter @web-core/assembly test` 40/40,
          `pnpm --filter @web-core/ui test` 289/289, `pnpm --filter @web-core/skin-app test` 33/33
          (4 файла падают на импортах модулей, которых нет в репо — `#/entities/schema` и т.п.,
          не связано с этим фиксом, см. `skin-app-tests-deferred` — тесты приложения временно не
          в объёме).

  - category: "Своя механика, найденная в packages/skin — вернуть домой"
    items:
      - id: repeat-grow-lives-in-wrong-package
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "`repeat-node` (выше, статус Done) на самом деле реализован НЕ в этом пакете"
        description: |
          Найдено architect'ом при разборе плана `@web-core/form` (`packages/form/ROADMAP.yaml`,
          `array-path-projection`), user подтвердил вслух: «репит это не меха скина, это меха
          сборки» — и то, что architect И owner-таблицы независимо друг от друга искали `repeat`
          именно в этом пакете (не нашли), само по себе показывает, где эта механика ДОЛЖНА лежать
          по интуиции любого, кто её ищет.

          Факт: `repeat-node`-пункт этого же роадмапа прямо пишет «разворачивается ДО RenderTree,
          в baseAssemblyOf» — но `baseAssemblyOf` физически лежит в
          `packages/skin/src/engine/passport/assembly/expand.ts`, не здесь. Живой продовый путь
          (`packages/ui/src/component-registry.ts:125`, `PWEB-220`, `instanceOf` — то, чем реально
          материализуется сборка по имени с данными) зовёт `baseAssemblyOf` оттуда. Рядом
          существует ВТОРОЙ, независимый разворачиватель — `growSelfAssembly` (этот пакет,
          `engine/self-assembly.ts`), у которого `repeat` нет вообще (голый `SelfAssemblyElement`,
          без данных), и его тоже реально зовут (`render/self-assembly-branch.ts:
          createSelfAssemblyTree`, дёргается из `render-node.tsx` на каждый узел с
          `passport.selfAssembly`). Оба живые одновременно, ни один не мёртвый код.

          `packages/skin/package.json` при этом НЕ ИМЕЕТ `@web-core/assembly` ни в каком виде
          зависимостей (сверено чтением файла целиком) — значит `packages/skin` физически не мог
          использовать настоящие типы этого пакета, даже если бы захотел, и завёл свою копию (см.
          `shadow-tree-types`/`shadow-data-binding` ниже).

          Что решить: `baseAssemblyOf`+`scopedPath` (алгоритм разворота `repeat`/`recur` по
          реальным данным, глубинный гвард `MAX_ASSEMBLY_DEPTH`) переезжают в этот пакет.
          Отдельный вопрос, не решённый заранее — `merge-or-retire-self-assembly-grower` ниже:
          что делать с уже существующим `growSelfAssembly`, у него та же роль, только без repeat.

          Сделано: `engine/expand.ts` — тот же алгоритм, тот же набор веток (`repeat` как поле,
          старая обёртка `{repeat, template}`, `recur`, глубинный гвард), но производит РЕАЛЬНЫЙ
          `AssemblyTree`/`AssemblyElement`/`AssemblyContent` (`tree.ts`) и резолвит путь через
          РЕАЛЬНЫЙ `resolveDataBinding`/`isDataBinding` (тоже `tree.ts`, `fast-json-patch`), не
          копию. Вход — `ReadablePassport` (`passport-read.ts`), не полный `ComponentPassport`:
          функции никогда не был нужен весь паспорт, только `component`/`root`/`anatomy.keys()` —
          уже, не по-своему, а по образцу, каким узко читает паспорт весь остальной пакет.

          Тип шаблона (`assembly: PassportAssembly`) — type-only импорт из `@web-core/skin/editor`
          с дефолтными generic-параметрами (`Data = unknown`), локально переименован
          (`AssemblyTemplate*`, не `PassportAssembly*`): тем же приёмом, каким `passport-read.ts`
          уже сегодня берёт `Genus`/`ComponentGenus`/`Admission` оттуда же. `@web-core/skin` уже
          был devDependency этого пакета — новой записи в package.json не потребовалось.
          `import type` стирается компилятором целиком, рантайм-импорта из `packages/skin` в этом
          пакете как не было, так и нет — важно, см. `skin-needs-real-assembly-dependency` ниже.

          Предикаты `isAssemblyContent`/`isAssemblyRepeat` НЕ импортированы (это были бы уже
          функции, не типы, — реальный рантайм-импорт из `packages/skin`) — переписаны локально
          как те же однострочники, что и в оригинале (`"genus" in node`/`"template" in node"`).

          Тесты (`test/expand.test.ts`, `model`-проект) — три сценария перенесены из
          `packages/skin/test/{passport-assembly,repeat-field,assembly-depth-guard}.test.ts`
          дословно по сути (пустой bind внутри repeat, repeat полем и старой обёрткой, вложенный
          repeat, гвард глубины на recur/repeat), адаптированы под `ReadablePassport`-фикстуру
          (не нужен `@zag-js/anatomy`/`definePassport` — то, что раньше требовало полного
          паспорта, здесь не требует ничего, кроме трёх полей). `pnpm --filter @web-core/assembly
          test` 39/39, `lint`/`typecheck` чистые. `packages/skin`/`packages/ui` не тронуты —
          старый живой путь (`component-registry.ts` → `./passport.js` → `packages/skin`)
          продолжает работать как раньше; переключение потребителей на новый дом — отдельная
          работа не в этой зоне (см. `shadow-tree-types`, `skin-needs-real-assembly-dependency`).

      - id: merge-or-retire-self-assembly-grower
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Один разворачиватель дерева, не два — `growSelfAssembly` vs переехавший `baseAssemblyOf`"
        description: |
          После переезда (`repeat-grow-lives-in-wrong-package`) в пакете окажутся ДВА алгоритма
          «спека + данные → AssemblyTree»: старый `growSelfAssembly` (без repeat, живой путь у
          `self-assembly-branch.ts`) и переехавший `baseAssemblyOf` (с repeat/recur, живой путь у
          `component-registry.ts`). Не решено заранее, потому что это инженерный выбор владельца
          пакета, не архитектора: слить в один (self-assembly тоже получает repeat бесплатно) или
          оставить два с явной, названной причиной, почему self-assembly'ю repeat не нужен.
          Смотреть по факту, куда реально смотрят оба живых потребителя, не по предположению.

          Решение: оставить два, не сливать. Названная причина, не вкус — у `growSelfAssembly`
          структурно нет ВХОДА для данных на момент роста: `createSelfAssemblyTree`
          (`self-assembly-branch.ts`) — memo от `registry()`/`node()`, живых данных экземпляра там
          нет вообще, `bind`-пути self-assembly резолвятся ПОЗЖЕ, на отрисовке (`render/props.ts`),
          а не на этапе роста дерева. `repeat` — структурная развилка (сколько узлов вырастить),
          её нельзя резолвить без данных в руках на момент вызова, в отличие от `bind` (значение
          подставляется потом). Слияние означало бы тащить `data` через весь путь до
          `self-assembly-branch.ts`/`render-node.tsx` ради возможности, которой сегодня не
          попросил ни один self-assembly — не рефактор, а отдельная фича с непонятным спросом.
          Если self-assembly когда-нибудь понадобится repeat — заводить отдельным пунктом с живым
          сценарием в руках, не сейчас по аналогии.

      - id: shadow-tree-types
        type: bug
        status: Backlog
        priority: High
        milestone: null
        name: "`BaseAssemblyElement/Content/Node/Tree` (packages/skin) — копия `AssemblyElement/Content/Node/Tree` этого пакета"
        description: |
          `packages/skin/src/engine/passport/assembly/output.ts` объявляет свою `BaseAssemblyTree`
          (и `isContentNode`) — структурно один в один с `AssemblyElement`/`AssemblyContent`/
          `AssemblyNode`/`AssemblyTree`/`isContent` этого пакета (`engine/tree.ts`), независимо
          продублирован, не импортирован. Стык, где это аукается прямо сейчас:
          `packages/ui/src/component-registry.ts:133` — `(sketch as AssemblyTree)`, сырой TS-каст
          результата `baseAssemblyOf` (тип `BaseAssemblyTree`) к типу этого пакета, потому что
          типы структурно совпадают, а не потому что один настоящий. Любое расхождение форм в
          будущем (новое обязательное поле у `AssemblyElement`, например) молча не поймается
          компилятором в этом месте.

          Чинится сам собой, если `repeat-grow-lives-in-wrong-package` сделан по-настоящему
          (переехавший код производит РЕАЛЬНЫЙ `AssemblyTree` этого пакета) — отдельным пунктом
          назван, чтобы явно отметить в review: каст в `component-registry.ts:133` должен исчезнуть
          целиком, не остаться «на всякий случай».

      - id: shadow-data-binding
        type: bug
        status: Backlog
        priority: Medium
        milestone: null
        name: "`resolveDataBinding`/`isDataBinding`/`DynamicValue`/`DispatchAction` — своя реализация в packages/skin"
        description: |
          `packages/skin/src/engine/passport/assembly/binding.ts` реализует резолв JSON Pointer
          ВРУЧНУЮ (split по `/`, свой разбор `~1`/`~0`, свой проход по массиву/объекту) — этот
          пакет (`engine/tree.ts`) делает ТО ЖЕ САМОЕ через `getValueByPointer` вендора
          (`fast-json-patch`, уже зависимость). Два независимых прочтения одной спеки (JSON
          Pointer, RFC 6901) — реальный риск разъехаться на граничном случае (пустой сегмент,
          экранирование), не гипотетический: `fast-json-patch` и рукописный разбор не обязаны
          совпадать буква в букву на каждом углу.

          НЕ то же самое, что `shadow-tree-types`: generic-обёртка `paths.ts`/`nodes.ts`
          (`DataBinding<Data, AtRoot>`, типы `Paths<T>`/`ArrayPaths<T>` — проверка `bind`/
          `repeat.path` на этапе автора компонента против его реальной io-схемы) — это настоящая
          добавленная ценность, которой у плоского `Record<string, string>` этого пакета нет, и
          НЕ обязана переезжать. Переезжает только РАНТАЙМ-поведение (сам резолв пути, сама форма
          `DynamicValue`/`DispatchAction` без generic-обёртки) — на него типизированный слой
          `packages/skin` должен лечь СВЕРХУ, не дублировать его заново.

      - id: skin-needs-real-assembly-dependency
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "`packages/skin` — реальная зависимость на `@web-core/assembly`"
        description: |
          Сегодня `packages/skin/package.json` не содержит `@web-core/assembly` ни в dependencies,
          ни в dev/peer — структурная причина, по которой там вообще завелась теневая копия типов
          (`shadow-tree-types`/`shadow-data-binding`): пакет физически не мог сослаться на
          настоящие типы. Без этой зависимости пункты выше нельзя закрыть по-настоящему — это не
          отдельная работа ЭТОГО пакета, а предусловие для роадмапа `packages/skin`.

          ⚠️ БЫЛО ПОДТВЕРЖДЕНО ЭМПИРИЧЕСКИ architect'ом (2026-09-12 — см.
          `verified-real-cycle-with-skin` ниже): реальный (не type-only) `packages/skin →
          @web-core/assembly` образовывал цикл с уже существовавшим `assembly → @web-core/skin`
          (`devDependencies`, type-only). Блокер снят: `assembly-drop-skin-devdependency` (ниже,
          Done) убрал `@web-core/skin` из `package.json` этого пакета целиком — граф Nx на паре
          `assembly ⇄ skin` больше не имеет своей половины цикла, этот пункт безопасен без
          дальнейших условий на СТОРОНЕ `assembly`. Не перепроверено заново прогоном (снятие
          сделано этим же заходом, не отдельным тестом «теперь всё точно ок») — если решится
          заводить эту зависимость, стоит перепрогнать `pnpm build` разок для очистки совести,
          дёшево и уже есть прецедент, как это делается (`verified-real-cycle-with-skin`).

      - id: verified-real-cycle-with-skin
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Цикл `assembly ⇄ skin` — не прецедент по аналогии с `ui`, а прогнанный факт"
        description: |
          Architect добавил `"@web-core/assembly": "workspace:*"` в `dependencies`
          `packages/skin/package.json` (диагностика, не постоянная правка) и прогнал `pnpm build`
          из корня — тот же тест, каким `//devDependencies`-комментарий этого пакета описывает
          прецедент `ui`, но здесь прогнан по-настоящему, не по аналогии:

          ```
          NX   Could not execute command because the task graph has a circular dependency
          @web-core/generators:build --> @web-core/skin:build --> @web-core/assembly:build --> @web-core/skin:build
          ```

          `pnpm install` тоже отдельно предупредил ДО билда: `[WARN] There are cyclic workspace
          dependencies: packages/assembly, packages/skin`. Правка отменена сразу после теста
          (`git diff` на `packages/skin/package.json` и `pnpm-lock.yaml` — пусто, состояние
          восстановлено `pnpm install`). Вывод: type-only ничего не значит для графа задач Nx —
          он считается по `package.json`, не по тому, что реально попадает в рантайм-бандл после
          `tsc`. Направление починки — `assembly-drop-skin-devdependency` ниже, не «подтвердить,
          что Nx не считает type-only рёбра» (эта гипотеза из предыдущей записи неверна, снята).

      - id: assembly-drop-skin-devdependency
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Убрать `@web-core/skin` из devDependencies этого пакета — своя половина цикла"
        description: |
          `engine/passport-read.ts` и `engine/expand.ts` держат `import type ... from
          "@web-core/skin/editor"` (`PassportGenus`/`PassportComponentGenus`/`PassportAdmission`/
          `PassportAssembly*`) — единственная причина, по которой `@web-core/skin` вообще стоит в
          `devDependencies` этого пакета (`package.json:63`). Это ровно тот же приём, которым
          `ReadablePassport` (`passport-read.ts`) уже заменил нужду в целом `ComponentPassport`
          скина — узкий структурный тип вместо импорта чужого пакета. Тот же приём применяется к
          оставшимся импортам: `PassportGenus`/`PassportComponentGenus`/`PassportAdmission` —
          локальные структурные алиасы (как уже сделано для `Genus`/`ComponentGenus`/`Admission`
          в этом же файле, просто ИСТОЧНИК типа сегодня всё ещё `@web-core/skin/editor`, не своя
          форма); `PassportAssembly*` (`expand.ts`) — своя структурная форма шаблона, этой функции
          не нужны generic `Data`/`AtRoot` (уже отмечено в `repeat-grow-lives-in-wrong-package`:
          дженерики стираются до `unknown`/`string` уже сегодня, генерик-слой не используется).

          Как только `@web-core/skin` полностью пропадает из `package.json` этого пакета (не
          только из рантайма — из ЗАПИСИ), граф Nx на паре `assembly ⇄ skin` перестаёт замыкаться
          в принципе — `skin-needs-real-assembly-dependency` (выше) становится безопасным без
          дальнейших условий.

          Сделано: `passport-read.ts` объявляет `Genus`/`ComponentGenus`/`Admission` своими
          литеральными формами (скопирована форма `PassportGenus`/`PassportComponentGenus`/
          `PassportAdmission`, не импортирована); `expand.ts` объявляет `AssemblyTemplateContent`/
          `AssemblyTemplateElement`/`AssemblyTemplateRepeat`/`AssemblyTemplateNode`/
          `AssemblyTemplate` своей плоской структурной формой (без discriminated-union по
          `RepeatPath<Data,AtRoot>` — он и раньше стирался в `string` дефолтным `Data = unknown`,
          терять после стирания было нечего). `@web-core/skin` убран из `devDependencies`
          (`package.json`), `//devDependencies`-комментарий расширен тем же прецедентом, что уже
          был про `@web-core/ui`, только для skin — эмпирически подтверждённым, не по аналогии.
          `pnpm install` из корня — единственная строка диффа лока: `@web-core/skin` пропало из
          importer'а `packages/assembly` (сверено чтением диффа, ничего постороннего не задето).
          `lint`/`typecheck`/`test` (39/39)/`build` — все чистые; сборка (`vite build`) больше не
          печатает предупреждение «"@web-core/skin/editor" is imported… treating it as external» —
          раньше оно было и для `passport-read.ts`, и для `expand.ts`, сейчас пропало полностью,
          не осталось ни одного упоминания `@web-core/skin` вне комментариев (`grep` по `src/`).

      - id: baseAssemblyOf-passport-type-too-wide
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "`baseAssemblyOf(passport: ReadablePassport, …)` — тип параметра шире, чем функция реально использует"
        description: |
          ⚠️ ДРУГОЙ КЛАСС ПРОБЛЕМЫ, чем пункты выше в этой категории — те были про код, физически
          лежащий не в той зоне (`repeat` в `packages/skin`). Этот — про то, что ВНУТРИ этой зоны
          один тип (`ReadablePassport`) навязан ДВУМ функциям с разными реальными потребностями.
          Не путать одно с другим при разборе (прямое указание user, 2026-09-12: «это разные оси
          и их не надо смешивать»).

          Факт, проверенный чтением тела функции (`engine/expand.ts`, не по памяти): `baseAssemblyOf`
          обращается РОВНО к трём полям параметра `passport` — `passport.component` (default для
          `address`, `nameFor` корня), `passport.anatomy.keys()` (список объявленных частей),
          `passport.root` (что считать корнем). `passport.genus`/`passport.parts`/`.accepts` — вообще
          не читаются НИ РАЗУ во всём теле функции (`grep "passport\."` по файлу — три строки, все
          три перечислены выше, других нет).

          Тип параметра при этом — полный `ReadablePassport` (`passport-read.ts`), где `genus:
          ComponentGenus` REQUIRED, а не опционально. Это тот же тип, что `Registry`/
          `ReadableComponent`/`Address` (`engine/registry.ts`) — ИМ `genus`/`accepts` реально нужны
          (нестинг/допуск), `createRegistry` их использует по-настоящему. `baseAssemblyOf` получил
          тот же тип не потому что ему это нужно, а по инерции: architect (это моя собственная
          ошибка, не owner'а) предложил построить `ReadablePassport` для `baseAssemblyOf` тем же
          мержем `ComponentPassport`+`PassportEditorInfo`, каким `packages/ui/src/component-
          registry.ts`'s `readable()` строит его для `Registry` — не проверив, что ВТОРОЙ функции
          этот мёрж вообще не нужен.

          Проверено эмпирически (не только прочитано): `ComponentPassport` (`packages/skin/src/
          engine/passport/form/passport.ts`) УЖЕ структурно удовлетворяет узкому срезу `{ component:
          string; anatomy: { keys(): string[] }; root: string }` — прогнан `tsc --strict --noEmit`
          на изолированном файле с формой `ComponentPassport<Part>` (`anatomy.keys(): Part[]`,
          `root: Part`) против такого среза, ноль ошибок. Совместимость не гипотеза.

          Реальная цена того, что тип не сужен раньше: `packages/skin`'s `expand.ts` (переезжающий
          на реэкспорт настоящей функции, `baseAssemblyOf-becomes-thin-reexport`) был вынужден
          добавить НОВЫЙ параметр `editorInfo` своей публичной `baseAssemblyOf`, чтобы построить
          `genus`/`accepts` для несуществующей у неё нужды — и это сломало типизацию у ВСЕХ 34
          файлов `packages/ui`, которые зовут её старой 4-аргументной формой (`component-
          registry.ts` + 33 тестовых файла кита, ~55 вызовов, `grep -rl "baseAssemblyOf("
          packages/ui` — без фильтров, `.test.` в том числе, в отличие от первого захода
          architect'а, который тесты по ошибке исключил). Все 34 файла сегодня передают ровно
          `ComponentPassport`-форму (сверено выборкой: `toggle-group`/`table`/`select`/`dialog`
          тестов — везде `<component>Passport` из `entity/passport.ts`, старой 4-арг формой).

          Что решить (эта зона, не cross-zone): объявить `baseAssemblyOf`'s параметр `passport`
          УЗКИМ структурным типом (по образцу самого `ReadablePassport`, который тем же приёмом
          сузил нужду в целом `ComponentPassport` — просто на этот раз сузить нужно ЕЩЁ ОДИН шаг,
          для ЭТОЙ конкретной функции) — НЕ трогать `ReadablePassport` саму (нужна `Registry`
          такой, какая есть) и не ослаблять её. Разместить рядом с `ReadablePassport` в
          `passport-read.ts` тем же стилем документирования (сравнение читателю, зачем узко) —

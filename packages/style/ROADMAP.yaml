# Дорожная карта @web-core/style — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/store (categories → items, log → журнал решений); без milestones — у пакета
# нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Ядро — значения
    items:
      - id: values-core
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Токен-контракт, шкалы, роли, оси и их границы
        description: |
          Означает: buildScale/buildAlphaScale/buildChartScale/buildScrim, AXES/axisOf,
          DERIVED_SCALES/SPACE_ROLES/LAYERS, разбор и модель цвета (OKLCH), гейт контраста
          (contrastRatio/AA_TEXT/AA_NON_TEXT). Framework-free, живёт в src/engine/.

      - id: category-color-role
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Категорийная (неоценочная) роль цвета — генератор семян по кругу оттенков
        description: |
          Означает: buildCategorySeeds(seed, count) отдаёт count семян — точек цвета,
          отвёрнутых по кругу равным шагом от оттенка бренда. Лесенку из каждого строит
          обычный buildScale, тем же путём, что у accent или danger: категория в палитре —
          обычная шкала со своим именем и семенем, а не слот внутри чужой шкалы. Режим в
          сигнатуре не нужен — от него зависит лесенка, а не точка.

          Семя стоит на CATEGORY_LIGHTNESS (0.74) и CATEGORY_CHROMA (0.12) — измеренный
          максимум цветности, достижимой в sRGB сразу для ВСЕХ оттенков. От бренда берётся
          только угол старта. Равная цветность — часть смысла роли: категория ярче соседних
          читается как выделенная, то есть оценённая.

          Различимость измерена, а не объявлена: CATEGORY_TELLING (6, 7, 8, 9, 11) — ступени,
          где любые две категории расходятся не меньше OKLAB_JND; CATEGORY_TELLING_LIMIT (12) —
          до скольки категорий это обещано; CATEGORY_NO_TELLING — четыре случая без обещания,
          с причиной на каждый. Мера отдана наружу (deltaEok, OKLAB_JND в
          src/engine/color/distance.ts) тем же доводом, что contrastRatio.

          Снято этим же пунктом: buildChartScale и CHART_SLOTS — частный случай того же
          генератора с count 5, живых потребителей не имел.

          Проверено test/category-seeds.test.ts: 72 стартовых угла (весь круг, шаг 5°) ×
          два режима, все пары, все обещанные ступени.

          ЧЕГО ЭТОТ ПУНКТ НЕ ДЕЛАЕТ: значения никуда не печатаются. Переменных на странице от
          него не появляется — категории объявляет палитра наряда, печатает packages/skin
          обычным путём, тем же, что для danger. Отдельного флага под категории больше не
          нужно.

      - id: css-generate
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Порождение CSS по требованию — /generate, /base.css
        description: |
          Означает: baseCss() — чистая функция в src/css/generate.ts, ручная часть листа
          строкой в src/css/written.ts (RESET_PROOF). Зовётся одинаково сборочным сценарием,
          дев-сервером зоны build и тестами. В листе — только сброс (box-sizing, margin,
          appearance: none на кнопках), ни одного кастом-свойства.

      - id: seed-reference
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Опора семени на каждой оси — значение, при котором обещания зоны верны
        description: |
          Означает: у каждой оси AXES появилось поле reference — {value, market}, где value это
          значение семени, при котором ступени шкалы дают сверенные с рынком числа, а market —
          след сверки с датой. Пол и потолок остались тем, чем были: границами законного.

          Зачем понадобилось: роль отступа называет МНОЖИТЕЛЬ, а число из него делает семя
          наряда. Пока зона не называла опору, любое семя было одинаково законным, и наряд
          стенда стоял в полтора-два раза выше рынка, не нарушая ни одного правила — правила
          не было. Проверить словарь рынком было нельзя в принципе.

          Опоры: space 0.25rem, font-size 1rem, control-height 2.5rem, column 0.5rem,
          radius 0.5rem, rail 16rem, card 24rem, layout 80rem, border-width 1px, tracking 0em,
          density 1. Десять взяты у рынка, одна выведена: высота контрола — единственное семя,
          при котором нижняя ступень держит минимум цели 24×24 на всём диапазоне плотности
          (2.5 × 0.8 × 0.75 = 1.5rem). Из неё же посчитан пол оси плотности, поэтому рыночные
          32px в семя ставить нельзя: это тихо отнимает право крутить плотность вниз.

          Проверено test/seed-reference.test.ts: опора есть у каждой оси, лежит между полом и
          потолком, несёт дату сверки (след без даты через год становится ложью — проверяется
          машиной, а не обещанием), и цепочка «опора контрола × нижняя ступень × пол плотности
          ≥ минимум цели» сходится. Мутация 2.5 → 2 проверку роняет, прогнано руками.

      - id: space-bands
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Три полосы шкалы интервалов — правило стало данными, а не прозой в means
        description: |
          Означает: SPACE_BANDS — inside (0.25…0.5rem), block (0.75…1.5rem), page (2…10rem), и
          у каждой роли в SPACE_ROLES появилось поле band. Разрез взят у рынка, а не придуман:
          Atlassian делит набивку ровно так же — малый компонент до 8px, крупный элемент
          12–24px, между содержимым страницы 32–80px; верх page (160px) взят у Carbon, где это
          верхняя ступень шкалы.

          Зачем: правило «внутренности компонента живут внизу шкалы» жило только в прозе means,
          и разъехалось молча — поймано было глазами владельца кита, а не прогоном.

          Ступени ролей НЕ двигались ни одна. При опорном семени словарь уже стоит на рынке:
          крупный контрол 16px (кнопка Carbon — 16), компактный 12 (Primer — 12), зазор иконки
          с подписью 8 (Primer — 8), зазор пунктов 4 (Primer — 4), карточка 24 (верх полосы
          Atlassian). Разъезд, из-за которого заводилась работа, пришёлся целиком на семя
          наряда — переставлять роли значило бы вычесть завышение дважды.

          Проверено test/spacing-roles.test.ts: при опорном семени каждая роль попадает в свою
          полосу, каждая ступень шкалы — ровно в одну полосу, полосы не перекрываются. Мутация
          band у control-padding-inline (block → inside) проверку роняет, прогнано руками.

  - category: Solid-обвес
    items:
      - id: style-tools-merge
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "@web-core/style-tools слит в @web-core/style, подпуть /solid"
        description: |
          Означает: cn/createStyle/реэкспорт cva переехали из самостоятельного пакета
          @web-core/style-tools в src/solid/ этого пакета, подпуть ./solid в exports.
          solid-js — peerDependenciesMeta.optional, class-variance-authority/clsx/
          tailwind-merge — обычные dependencies. Разрез зависимостей в обе стороны пуст
          (engine/ не импортирует solid/, наоборот тоже). Разбор — FAQ.md.

      - id: engine-css-solid-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "src/index.ts (поверхность) + engine/ + css/ + solid/"
        description: |
          Означает: по образцу packages/store (engine/ + machine/ + addons/ на одном уровне).
          src/values.ts переехал в src/engine/index.ts без смены роли (перечень поверхности).
          src/index.ts — один export * from "./engine/index.js".

  - category: Документация
    items:
      - id: readme-engine-template
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README по общему шаблону "движок"
        description: |
          Означает: Анатомия/Использование/Настройки/Состояния/IO/Сборки/Рецепт заполнены
          фактами без обоснований (обоснования — FAQ.md). Второй пакет на этом шаблоне после
          packages/store.

      - id: faq-roadmap
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: FAQ.md и ROADMAP.yaml — первое заполнение для этого пакета
        description: |
          Означает: вся содержательная аргументация из прежнего 938-строчного README (WCAG-
          выводы, история инвариантов base.css, устройство осей, слияние с обвесом) перенесена
          сюда Q&A-форматом, а не потеряна при сжатии README до шаблона.

  - category: Не сделано
    items:
      - id: test-gate-rewrite
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: Мутационно проверенный гейт зоны не переписан после снятия старого набора
        description: |
          Означает: ~20 файлов тестов (axes/dimension/scale/color-*/base-css/marker/mode/pack/
          types/entries/generate) сняты коммитом f807343 (2026-08-26) вместе с тестовыми
          наборами всего packages/*, «не регрессия для тихого восстановления». Данные и
          функции, которые они проверяли, не менялись; проверок на новой раскладке
          (engine/css/solid) сегодня нет. Восстанавливать — на паттерне сквозных проверок
          (по образцу checkRegistry/kit.test.tsx у packages/assembly), не покомпонентным
          повтором. До восстановления README/FAQ не заявляют «держит проба X» для
          отсутствующих файлов — это и была уборка 2026-09-04.

      - id: outfit-stands-off-reference
        type: bug
        status: Open
        priority: High
        milestone: null
        name: Наряд стенда стоит вне опоры по трём семенам — чинится не здесь
        description: |
          Найдено сверкой зоны 2026-09-23 чтением наряда omnifield-palette через службу скина.
          Расхождения с опорами, объявленными этой зоной:

            space           0.375rem → 0.5rem   против опоры 0.25rem  (в 1.5–2 раза выше)
            column          1rem                против опоры 0.5rem   (вдвое выше)
            control-height  2rem → 2.25rem      против опоры 2.5rem   (ниже опоры)

          Что это даёт на странице: весь словарь отступов едет вверх во столько же раз
          (набивка карточки 36–48px против рыночных 16–24, модалки 72–96 против 24–32, зазор
          раскладки 192–256 против гаттеров 16–24), а число в имени ступени колонки перестаёт
          соответствовать действительности — column-40 при семени 1rem это не сорок знаков, а
          примерно вдвое больше.

          Отдельно по высоте контрола: 2rem само по себе нормально при плотности 1, но пол оси
          плотности (0.75) выведен из семени 2.5rem. На паре «семя 2rem + плотность 0.75»
          компактная ступень даёт 19.2px при минимуме цели 24×24 (WCAG 2.2, 2.5.8) — нарушение
          латентное, вылезет только когда пользователь уплотнит вид.

          ЗОНА ЭТОГО НЕ ЧИНИТ: наряд — данные в службе пресетов, чужая территория. Заявка
          отдана user'ом наружу. Здесь пункт стоит, чтобы находка не потерялась и чтобы было
          видно, почему числа на стенде не совпадают с обещаниями зоны, пока наряд не поправлен.

      - id: service-should-read-reference
        type: feature
        status: Open
        priority: High
        milestone: null
        name: Отклонение наряда от опоры некому поймать машиной
        description: |
          Гейт этой зоны проверяет СЛОВАРЬ — роль, ступень, полосу при опорном семени. Само
          семя приходит из наряда, наряд живёт в службе пресетов, и её проверки про опору
          сегодня не знают: reference появился здесь 2026-09-23 и наружу ещё никем не читается.

          Пока это так, расхождение вроде найденного выше ловится только чтением глазами —
          ровно тем способом, от которого зона уходила, заводя опору данными.

          Что нужно: проверка наряда (check_palette у службы скина) читает AXES[].reference и
          называет отклонение семени от опоры — с числом «во сколько раз», потому что именно во
          столько же раз уедет каждая роль. Запрещать не обязательно: уход от опоры законен,
          молчаливый уход — нет.

          Решение и формулировка контракта — не за владельцем style: это шов между зонами, его
          ведёт architect.

      - id: column-has-no-step-at-ideal-measure
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: В ряду колонки нет ступени под идеал измерения (66 знаков)
        description: |
          Найдено той же сверкой. Канон измерения — 45–75 знаков в строке, идеал 66
          (Bringhurst); потолок нормы — 80 знаков (WCAG 2.2, 1.4.8 AAA). Ряд сегодня:
          24/32/40/48/56 знаков. Верхняя ступень укладывается в канон, но идеал не назван ни
          одной ступенью — под основной текст приходится брать 56 и терять до десяти знаков
          либо выходить за ряд руками.

          Открытый вопрос, а не решение: добавлять ли column-64 и column-72 (ряд остаётся
          внутри потолка 80 и ничего не ломает — это добавление) или оставить как есть, считая
          длину строки делом потребителя. Спрошено у user, ответа пока нет.

log:
  - id: zone-market-audit
    type: plan
    date: 2026-09-23
    summary: >
      Сквозная сверка ВСЕЙ зоны с рынком по решению user («не хочу бегать на каждый момент»).
      Смотрел первоисточники: тема Tailwind (--spacing 0.25rem, ряд кеглей, leading-*, radius-*,
      container-*), шкала интервалов и scaling у Radix Themes, spacing у Carbon, полосы
      применения у Atlassian, размеры контролов у Primer (control-*-size, paddingInline, gap,
      stack-gap-*), сетка и поля Material 3, шкала Fluent 2, плавные шкалы Utopia (360–1240px
      по умолчанию), канон измерения (Bringhurst 45–75, идеал 66) и разбор единицы ch у Meyer.
      Нашёл: форма нашей модели рынку соответствует целиком, а местами совпадает до числа — ряд
      кеглей и межстрочные равны тайлвиндовым, скругление «одно семя плюс смещения» это приём
      Radix (--radius-factor), полосы применения Atlassian ложатся ровно на наши три этажа.
      Настоящее расхождение оказалось не в модели, а в том, что модель НЕ НАЗЫВАЛА опору семени:
      наряд стенда стоял в полтора-два раза выше рынка, не нарушая ни одного правила. Берём:
      опору данными на каждой оси, три полосы данными, след сверки с датой в самих данных. Не
      берём: точное число на роль (рынок сам держит полосы, а не числа) и перестановку ступеней
      словаря (при опоре он уже стоит на рынке — двигать значило бы вычесть завышение дважды).

  - id: spacing-rule-turned-out-to-be-a-seed-defect
    type: plan
    date: 2026-09-23
    summary: >
      Заявка owner-ui: правило user'а про шкалу отступов («space-1 — внутренности компонента»)
      расходится со словарём, гейт кита не пускает привести табы к правилу. Разобрано с user по
      пунктам: сперва решили двигать четыре роли вниз, но сверка с рынком, прогнанная ДО правки,
      показала другое — при опорном семени словарь уже стоит на рынке роль в роль, а толще в
      полтора-два раза он выглядел из-за наряда. Решение user: наряд — расходник, правится он;
      зона обязана назвать числа, иначе следующий автор наряда влепит такие же. Итог: ступени
      ролей не тронуты ни одна, заведены опора и полосы, а правило user'а записано в той форме,
      в какой его держит рынок, — три этажа, а не три ступени. Правка табов в ките
      (paddingInline space-1) лечила симптом и подлежит откату — это зона ui, заявка отдана
      через user.

  - id: category-role-market-check
    type: plan
    date: 2026-09-20
    summary: >
      Сверка перед новой механикой (категорийная палитра). Смотрел: порождение категорийных
      палитр в OKLCH (colorarchive.org/guides/oklch-perceptual-color-design-guide,
      clhenrick.io/blog/color-experiments-with-oklch), критику равномерности Oklab у Рафа
      Левина (raphlinus.github.io/color/2021/01/18/oklab-critique.html), исходную статью
      Оттоссона (bottosson.github.io/posts/oklab), 12-ступенчатые шкалы Radix
      (radix-ui.com/colors/docs/overview/custom-palettes). Нашёл: равный шаг по кругу
      оттенков при удержанных светлоте и цветности — штатный приём ИМЕННО в перцептивном
      пространстве (в HSL он и даёт слипание, ради которого его обычно ругают); известная
      претензия к уходу синего в фиолетовый относится к CIELAB, Oklab заводился как её
      починка. Второй приём оттуда же — проверять попарную различимость порогом заметности,
      а не объявлять её. Берём оба, своего распределения оттенков не изобретаем. Зависимость
      не тянем: взята модель, как и в случае @radix-ui/colors ранее.

  - id: category-role-scope-split
    type: plan
    date: 2026-09-20
    summary: >
      Заявка owner-feeder: семи типам данных нужен устойчивый цвет, под перечисление достался
      danger — бейдж красный там, где ничего опасного нет. Разобрано с architect: работа
      разрезается на три зоны — посчитать (style), напечатать переменные (skin), включить в
      палитре наряда. Владелец style делает первую часть и отдаёт заявку на вторую и третью
      architect'у, а не договаривается с owner-skin напрямую. Число слотов (7) назначено
      architect'ом по числу типов у заявителя. Замечание, попавшее в заявку фактом: фон
      категории на второй ступени слоты не различает (0.009–0.012 при пороге 0.02) — опознают
      рамка и текст; если фон обязан опознавать сам, брать четвёртую или пятую ступень.

  - id: telling-limit-desynced-from-docs
    type: plan
    date: 2026-09-20
    summary: >
      Возврат на доработку от owner-skin: CATEGORY_TELLING_LIMIT стоял 5 при том, что коммит,
      FAQ и роадмап заявляли 12. Дефект мой — константу занесло при правке соседнего блока.
      Тест не поймал, потому что перебирал [2, 7, предел]: семёрка в списке проходила сама по
      себе, а сам предел ни с чем не сверялся — проверка ходила МИМО стерегомого числа.
      Практическая цена: семь категорий измеримо держатся (запас 88%), но по объявленному
      пределу считались необещанными, и проверка палитры у skin обязана была ругаться на
      законный случай. Починено: предел 12, перебор идёт по всем числам до предела
      включительно, и само число зажато с двух сторон — CATEGORY_TELLING_MARGIN (10%) роняет
      проверку при завышении до 13, требование «двумя дальше проваливается» роняет при
      занижении. Обе мутации прогнаны руками и падают.

  - id: no-subject-mechanics-in-engine
    type: plan
    date: 2026-09-20
    summary: >
      Запрет user'а, зафиксированный после сноса chart: механику под конкретный вид UI
      (графики, таблицы, карты, деревья — любой предмет) в движок не заносить. Движок даёт
      РОДЫ значений — шкалу, роль цвета, ось, ступень — и не знает, кто ими рисует. Проверка
      на месте до первой строки: называю род значения или предмет, который его потребляет?
      Предмет в имени или в обосновании — механике здесь не место, идти к роду. Повод: chart
      прожил в зоне с 2026-08-16 больше месяца, живого потребителя не получил ни одного и
      утащил за собой цветность 0.15, которой не существует в sRGB сразу для всех оттенков, —
      предметная механика тянет предметные допущения, и род значения перепроверяют, а «это же
      для графика» не перепроверяет никто. Полный текст с критерием — FAQ.md.

  - id: category-seeds-over-scales
    type: plan
    date: 2026-09-20
    summary: >
      Заявка owner-skin в тот же день: первая версия отдавала готовые шкалы, и потребителю
      оставалось печатать их под составным именем «категория внутри шкалы» — рядом с обычной
      моделью палитры (род цвета = имя + семя + лесенка) заводилась вторая, в которой
      категорию нельзя объявить, настроить или подменить руками. Решение user: обход под
      снос, флоу один. Генератор переделан на выдачу СЕМЯН (buildCategorySeeds), count стал
      параметром, mode из сигнатуры убран — от него зависит лесенка, а не точка. Довод принят
      полностью: разрез проведён не там, где надо было, и это была ошибка владельца style,
      а не недоговорённость между зонами.

  - id: category-seed-chroma-was-unreachable
    type: plan
    date: 2026-09-20
    summary: >
      Вынос семян наружу вскрыл дефект, который прятала прежняя форма. Семя объявляло
      цветность 0.15 при светлоте бренда, но такой цветности в sRGB для большинства оттенков
      НЕ СУЩЕСТВУЕТ: пока лесенка строилась внутри, обрезка гамутом шла поздно и по одной
      ступени, а как только семя стало строкой, formatOklch начал срезать её прямо в точке —
      на тёмном бренде (#1a1a1a) от 0.15 доживало 0.037–0.111, разное у разных оттенков.
      Заявка предполагала совпадение «бит в бит» — оно не выполнилось и не могло. Измерен
      весь круг: максимум цветности, достижимой сразу для всех оттенков, — 0.126 при светлоте
      0.74 (узкое место 200°, сверху 268°). Взято 0.12 при 0.74, от бренда остался только угол
      старта. Предел числа категорий (12) измерен там же: запас над порогом заметности 22% на
      11 категориях, 12% на 12, 3% на 13, −4% на 14.

  - id: style-tools-merge-decision
    type: plan
    date: 2026-09-04
    summary: >
      Пользователь: "давай объедени их в один пакет, но экспорты сделай разные [...] сам
      движок это ядро, тот что у нас сейчас в основе, а тулзы для солида — обвес движка, если
      в будущем понадобится реакт — положим рядом, как второй обвес". Решение: @web-core/style
      и @web-core/style-tools слиты в один пакет; корень "." остаётся framework-free (ядро),
      Solid-специфика — подпуть "./solid". Названо по фреймворку, а не по роли ("/solid", не
      "/tools"), чтобы второй обвес (React) не потребовал переименования первого. Раскладка
      src/ — по образцу packages/store (engine/ + machine/-аналог), только вместо machine/ —
      css/ (порождение стилей, framework-free) и solid/ (обвес, framework peer optional).

  - id: style-tools-tests-recovered-from-history
    type: plan
    date: 2026-09-04
    summary: >
      test/cn.test.ts и test/create-style.test.ts у бывшего @web-core/style-tools не
      существовали на диске на момент слияния (сняты тем же коммитом от 2026-08-26, что и
      остальной гейт style) — но существовали в git-истории раньше этого коммита. Тексты тестов
      извлечены из истории и перенесены в test/solid/ дословно (два
      места переименованы под новые пути импорта), а не написаны заново — форма и покрытие

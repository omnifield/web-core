      предыдущего ревью (`biome-plugin-implementation`: код+тесты сделаны, роадмап не тронут).
      Статус переведён в `Done`, описание переписано в прошедшем времени.
  - id: biome-plugin-implementation
    type: fix
    date: 2026-09-15
    summary: >
      Реализованы `style-canon-as-data` и `biome-plugin` (см. пункты выше): `src/style/index.ts`
      — канон кодстиля (`StyleCanonRule`, свой тип, свой список — `formatting` +
      `organized-imports`, не смешан с Solid-канон `CanonRule[]`); `src/biome/index.ts` —
      перевод в `biome.json`.

      Ревью архитектора нашло два реальных дефекта первой версии, оба исправлены:

      (1) `formatter` без явного `indentStyle`/`indentWidth` — у Biome без этого поля дефолт
      TABS, а весь репозиторий сегодня на 2 пробелах. Натурный прогон `biome check --write` на
      конфиге без этого поля подтвердил: молча переводит отступ на табы. Исправлено — движок
      теперь задаёт `indentStyle: "space"`, `indentWidth: 2` явно, тем же приёмом, каким
      `../eslint/index.ts` держит `ESLINT_RULE_OPTIONS` отдельно от канона (канон говорит только
      «форматирование обязательно», конкретное значение — дело движка).

      (2) `defineBiomeConfig()` был мёртвым кодом в буквальном смысле — не просто «нет
      потребителя», а «в принципе не может быть потребителем»: Biome читает только статический
      `biome.json` на диске, исполняемый конфиг (как flat-конфиг ESLint) не поддерживает.
      Функция, которую нельзя импортировать в чужой `biome.json`, была неверной формой
      артефакта. Исправлено — добавлен `scripts/generate-biome-json.mjs`, вызываемый из
      `build`: материализует канон в реальный `dist/biome/biome.json`, публикуемый в `files`
      (`package.json` — новый подпуть `./biome.json`). Реальный потребитель подключает его через
      `extends`, а не через импорт функции.

      Добавлены пробы (`test/style.test.ts`, `test/biome.test.ts`) — раньше их не было вовсе.
      Один тест реальный, не мок: настоящий бинарь `biome` из `node_modules/.bin` на фикстуре с
      несортированными импортами, табами и неиспользуемой переменной — подтверждает, что
      сгенерированный конфиг реально сортирует, реально держит 2 пробела и реально не трогает
      неиспользуемую переменную (линтер выключен на практике, не только по типу).

      Не сделано в рамках этой правки (вынесено в `biome-plugin-first-consumer`): ни один
      реальный `biome.json` потребителя пока не подключает `dist/biome/biome.json` через
      `extends` — правка вне `packages/lint`, не в границах этого пакета.
  - id: biome-for-style-not-reactivity
    type: decision
    date: 2026-09-15
    summary: >
      По прямому запросу заказчика архитектор снял мёртвую ссылку на задачу трекера (её не
      существует уже давно) из `package.json`'s `description` и комментария `engine/index.ts` —
      четыре несущих правила Solid-канона остаются обязательными по собственному контракту
      пакета, не по внешнему тикету. Описание пакета в реестре расширено тем
      же заходом — раньше называло только Solid/eslint-plugin-solid, теперь называет обе заботы.

      Заодно пересмотрен план `biome-plugin` (см. пункт выше, категория «Канон кодстиля»): повод
      — заказчик заметил грязные, несортированные импорты в одном из файлов приложения-витрины и
      спросил, почему `packages/lint` это не ловит. Разбор показал: `packages/lint` никогда не
      был про это — узкий канон реактивности
      Solid (4 несущих + сопутствующие правила `eslint-plugin-solid`), а кодстиля/сортировки
      импортов в репозитории не покрывает вообще ничто (проверено: нет Prettier, нет
      eslint-plugin-import/simple-import-sort/perfectionist, нет `.editorconfig`, нет
      закоммиченного `.vscode/settings.json` — то, что выглядит форматированием, это личный
      дефолт редактора конкретного разработчика, не стандарт проекта).

      Старый `biome-plugin` (до этой правки) предполагал Biome как ЗАМЕНУ ESLint для ТОГО ЖЕ
      Solid-канона — мотив из более раннего лога (`engine-eslint-split`, 2026-09-05): «сегодня
      линтер ESLint, позже переезд на Biome». Заказчик решил иначе: не плодить пакеты под разные
      правила (реактивность vs кодстиль) — плагином внутри ЭТОГО ЖЕ пакета, тем же приёмом,
      каким уже разведены канон (`.`) и движок (`./eslint`). Итог — ДВА независимых канона в
      одном пакете: Solid-реактивность (как было, ESLint остаётся её единственным движком) и
      кодстиль/импорты (новый, единственный реалистичный движок — Biome). Реализация — за
      владельцем пакета, эта запись фиксирует только решение и почему оно расходится с логом от
      2026-09-05.
  - id: engine-eslint-split
    type: plan
    date: 2026-09-05
    summary: >
      Пакет переведён на форму "движок" по прямому указанию заказчика, тем же приёмом, что
      `@web-core/style`/`@web-core/trace`/`@web-core/solid`: канон (`.`) — данные независимо от
      движка проверки, плагин (`./eslint`) — сегодняшняя реализация поверх
      `eslint-plugin-solid`. Мотив, названный заказчиком: сегодня линтер — ESLint, позже планируется
      переезд на Biome; канон как ESLint-специфичная карта правил (`src/rules.ts`, три объекта
      `{ "solid/<rule>": "error" }`) заставил бы переписывать пакет целиком вместо добавления
      подпутя. `src/rules.ts` заменён на `src/engine/index.ts` (`CanonRule[]`, семантический
      `id`, `severity: "required" | "off"`, без привязки к ESLint). `src/index.ts` (было
      `src/index.ts` со всем содержанием сразу) стал тонким барелем. Публичный экспорт
      `defineConfig` переехал с корня (`@web-core/lint`) на `@web-core/lint/eslint` — 12
      потребителей (`eslint.config.js` четырёх приложений репозитория и восьми пакетов
      `packages/{io,skin,assembly,style,query,store,router,ui}`) переведены на новый путь.
      Функционально ничего не изменилось: `defineConfig()` собранного `./eslint` даёт побайтово

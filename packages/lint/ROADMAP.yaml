      же страницы) — пример использовал не тот адрес, что предлагал сам пакет. Архитектор
      проверил натурно: собрал фиктивный `node_modules/@web-core/lint` с `exports`, прогнал
      реальный `biome check` с `"extends": ["@web-core/lint/biome.json"]` — резолвится и реально
      ловит несортированные импорты. README исправлен на этот адрес.

      (2) `docs-biome-sketch-stale` (см. пункт выше) оставался `Backlog` с описанием, которое
      цитировало стейл-тезис README («тот же список правил») — тот же коммит, что дока, уже убрал

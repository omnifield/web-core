# Дорожная карта @web-core/lint — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/trace/style (categories → items, log → журнал решений); без milestones — у
# пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Канон (ядро)
    items:
      - id: canon-as-data
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Канон как данные, независимо от движка проверки
        description: |
          Означает: `CanonRule` (`id`, `severity: "required" | "off"`, `summary`) — семантическое
          описание правила без привязки к неймспейсу/уровню конкретного линтера. Раньше канон БЫЛ
          картой ESLint-правил (`{ "solid/reactivity": "error" }`) — перевод в конкретный движок
          вынесен в его собственный подпуть. См. FAQ.md.

      - id: barrel-index
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: index.ts — тонкий барель поверх engine/
        description: |
          Означает: публичный адрес `@web-core/lint` не завязан на структуру файлов реализации —
          тот же приём, что у `@web-core/trace`/`@web-core/style`/`@web-core/router`.

  - category: ESLint-плагин
    items:
      - id: eslint-plugin
        type: feature
        status: Done
        priority: High
        milestone: null
        name: ./eslint — перевод канона в eslint-plugin-solid
        description: |
          Означает: `defineConfig()` — тот же публичный контракт, что был у пакета раньше
          (массив flat-конфигов, `PresetOptions.ignores`), теперь как реализация канона, а не
          единственная форма пакета. Перевод `id` → `solid/<id>`, `severity` → `error`/`off` —
          `toEslintRules` в `src/eslint/index.ts`. Проверено: собранный `defineConfig()` даёт
          побайтово ту же карту из 20 правил, что была до рефакторинга (уровни, опция
          `jsx-no-undef`).

      - id: babel-parser
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Разбор — Babel, не @typescript-eslint/parser
        description: |
          Означает: плагин не зависит от версии TypeScript и не может сломаться при её смене —
          `@typescript-eslint/parser` не поддерживает TS 7.0, на котором стоит продукт, а
          правилам `eslint-plugin-solid` типы не нужны вовсе. См. FAQ.md.

      - id: split-ts-jsx-parsing
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Раздельный разбор .ts и .tsx
        description: |
          Означает: угловой каст `<string>value` в `.ts` не читается как JSX-элемент — секции
          `parser-ts`/`parser-jsx` включают плагин `jsx` только там, где он не даст ложных
          срабатываний.

      - id: error-level-no-downgrade
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Уровень — error, без ручки «понизить»
        description: |
          Означает: включённое правило канона всегда `error` в ESLint-выводе, никогда `warn` —
          `eslint` выходит с кодом 0, пока в отчёте только `warn`, и канон на `warn` — это канон,
          которому верят и который молча не работает. См. FAQ.md.

      - id: prepare-lifecycle
        type: feature
        status: Done
        priority: High
        milestone: null
        name: prepare — пакет собирается на установке
        description: |
          Означает: свежий клон линтуется без отдельной команды сборки пресета —
          `eslint.config.js` потребителя грузит Node напрямую, подменить путь на исходники
          некому. См. FAQ.md.

      - id: reactivity-custom-use-property
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "`ESLINT_RULE_OPTIONS.reactivity` — добавить `customReactiveFunctions: [\"use\"]`"
        description: |
          Цепь: найдено при подключении витрины компонентов к `@web-core/query` — владелец того
          приложения упёрся в чужой пакет и передал находку сюда, не правя её у себя. Проверено
          независимо, не на слово:

          Воспроизведено: `contentQuery.use(() => props.component ?? "")` в компоненте
          приложения — реальный `eslint` на этом файле сегодня даёт `solid/reactivity`:
          «This function should be passed to a tracked scope…». Причина — в самом `eslint-plugin-solid`
          (`node_modules/eslint-plugin-solid/src/rules/reactivity.ts:1059-1081`): узнаёт
          трекнутый скоуп по `/^(?:use|create)[A-Z]/` (заглавная буква сразу после префикса —
          `useFoo`/`createBar`) ИЛИ по точному совпадению с `customReactiveFunctions` — голое
          `.use()` (без суффикса, с маленькой буквы) не подходит ни под что, ни при вызове
          функцией, ни свойством объекта.

          `.use()` — не опечатка и не единичный случай, а САМ канон: README `@web-core/query`
          называет `defineQuery(...).use()` реактивным потреблением в компоненте прямым текстом
          (`packages/query/README.md:223,307,323-324`). У `@web-core/store` та же форма —
          `store.use(selector)` (`packages/store/src/engine/action-store.ts:22,38`, комментарий
          там же зовёт её «то же самое, без отдельного импорта»). Проверено ПОЛНОЙ выборкой:
          `grep` по `.use(` по всему коду репозитория — каждое совпадение (4 вызова кроме
          исходного) это ровно один из этих двух канонов, никакого стороннего
          `.use()` с другим смыслом не нашлось — риска, что правило перестанет ловить настоящий
          баг реактивности под тем же именем, на сегодняшнем коде нет.

          Сделано 2026-09-16: `ESLINT_RULE_OPTIONS.reactivity` (`src/eslint/index.ts`) держит
          `{ customReactiveFunctions: ["use"] }` тем же приёмом, что и опция `jsx-no-undef` —
          решение движка, не канона. Проверено натурно, не по доке: собран `dist`, реальный
          `eslint` на фикстуре с `contentQuery.use(() => props.component ?? "")` — до правки
          `solid/reactivity` (exit 1), после — чисто (exit 0). См. `log`,
          `lint-roadmap-backlog-2026-09-16`.

  - category: Не сделано
    items:
      - id: rebuild-test-suite
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Восстановить настоящие пробы пакета
        description: |
          Означало: `vitest.config.ts` ссылался на `test/*.test.ts`, которого в репозитории не
          было — снесён вместе с тестами `packages/build`, когда пробы
          заменили проверкой на приложении-стенде, и, в отличие от `build`, не восстановлен был
          до сих пор. Раньше здесь были настоящие пробы: `test/preset.test.ts` (фикстуры violation/canon/limit + сверка
          состава канона), `test/consumer.test.ts` (чистый проект, реальный CLI ESLint, код
          возврата), `test/prepare.test.ts` (сборка на установке с нуля), `test/surface.test.ts`
          (`pnpm pack` + разбор тарбола).

          Сделано 2026-09-16: все четыре файла восстановлены и адаптированы под сегодняшнюю форму
          пакета (`preset.test.ts` — состав пресета сверяется против `./eslint`, а состав самого
          канона отдельно, независимо от движка, против `../src/solid/index.js`, куда переехали
          Solid-данные при `engine-solid-canon-not-separated`; `consumer.test.ts` — против
          `@web-core/lint/eslint`, не корня; `surface.test.ts` — манифест с пятью точками
          `exports`, а не одной, по обоим движкам). Фикстуры (`test/fixtures/`,
          `test/consumer/`) восстановлены как были. По пути `surface.test.ts` поймал реальный
          баг самой пробы: наивная сверка «каждая цель `exports` обязана лежать в тарболе»
          считала и ветку `development` (указывает на `src/*.ts` — намеренно не едет в
          публикацию) — поправлено, тарбол сверяется только по `types`/`default`. Итог: 6 файлов
          проб, 40 тестов, все зелёные (`pnpm test`). См. `log`,
          `lint-roadmap-backlog-2026-09-16`.

      - id: engine-solid-canon-not-separated
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "`engine/` выдаёт себя за framework-agnostic ядро, а на деле — переименованный список правил `eslint-plugin-solid`"
        description: |
          Найдено при подключении пакета в витрине компонентов (2026-09-16): `id` канона в
          `engine/index.ts` (`reactivity`, `no-destructure`, `no-react-deps`,
          `components-return-once`, `event-handlers`, `imports`, `jsx-no-duplicate-props`,
          `jsx-no-undef`, `jsx-uses-vars`, `jsx-no-script-url`, `no-innerhtml`,
          `no-react-specific-props`, `prefer-for`, `style-prop`, `self-closing-comp`,
          `no-unknown-namespaces`, `no-array-handlers`, `prefer-show`, `no-proxy-apis`,
          `prefer-classlist`) — не независимая номенклатура, а один в один имена правил
          `eslint-plugin-solid`. Тест, который должен сверять, что каждое правило плагина
          попадает ровно в одну из трёх карт (см. `rebuild-test-suite` выше — не восстановлен),
          закрепляет это устройство: канон ОПРЕДЕЛЁН через состав плагина, а не плагин реализует
          независимо сформулированный канон. `eslint/index.ts:3` тем же заходом жёстко
          импортирует `eslint-plugin-solid` — границы «движок берёт подключаемый плагин
          снаружи» нет вообще, `defineConfig()` умеет ровно одну технологию и не может иначе.

          Годная форма для сравнения — в этом же репозитории: `packages/generators/src/engine/
          types.ts` (`AggregatePlugin`/`PerEntryPlugin` — интерфейс, ядро `engine/runner.ts` не
          знает вообще ничего о содержимом плагина) + `packages/generators/src/plugins/kit/
          barrels.ts` (конкретный плагин, реализующий интерфейс СНАРУЖИ ядра). Второй пример
          слабее, но тоже в тему — `packages/assembly/src/engine/` (framework-agnostic: дерево,
          реестр, admits) отделён от `packages/assembly/src/render/` (Solid-слой).

          Solid-реактивность не обязана становиться framework-agnostic содержимым
          (деструктуризация props бессмысленна как запрет для React) — цель не «поддержать
          другой фреймворк», а перестать структурой врать, что список правил независим, когда
          он 1:1 списан с одного плагина. Целевая форма по образцу `generators`: `engine/`
          оставляет только тип (`CanonRule` — уже нейтральный, переносить некуда), сама
          Solid-данность (текущее содержимое `engine/index.ts`) переезжает в отдельный модуль
          под собственным именем, `eslint/index.ts` становится явным потребителем этого
          модуля — граница данные/адаптер по факту уже есть (данные в
          `engine/`, перевод в `eslint/`), но имя папки `engine/` называет её так, будто это
          исполняемый механизм, а хранит она только Solid-данные.

          Публичные точки входа (`@web-core/lint`, `./eslint`, `./biome`, `./biome.json`) не
          меняются — переезд файлов внутри пакета, риска для потребителей нет.

          Сделано 2026-09-16, по образцу `generators`: `engine/index.ts` теперь несёт только тип
          `CanonRule` (+ `CanonSeverity`), ничего Solid-специфичного. Solid-данность (три карты
          правил, ранее жившие в `engine/index.ts`) переехала в новый `src/solid/index.ts`.
          `eslint/index.ts` стал явным потребителем: `import { canonRules, ... } from
          "../solid/index.js"` вместо `"../engine/index.js"`. Барель `src/index.ts` теперь
          реэкспортирует оба модуля (`./engine/index.js` + `./solid/index.js`) — публичный набор
          экспортов (`rules`, `canonRules`, `companionRules`, `offRules`, тип `CanonRule`) не
          изменился. Проверено натурно: собранный барель отдаёт те же 20/4 правила, что и до
          переезда; реальный `eslint` на фикстуре с деструктурированными props по-прежнему ловит
          `solid/no-destructure`. Граница «движок берёт плагин снаружи» до конца не выстроена —
          `eslint/index.ts` всё ещё жёстко импортирует `eslint-plugin-solid` (это и есть его
          работа, тут ничего не задумывалось менять): разведённое — это данные/адаптер
          (`solid/` vs `eslint/`), а не подключаемость чужого плагина. См. `log`,
          `lint-roadmap-backlog-2026-09-16`.

      - id: style-canon-app-path-citation
        type: bug
        status: Done
        priority: Low
        milestone: null
        name: "`style/index.ts` цитирует путь файла приложения-потребителя внутри данных канона — заменить на абстрактную формулировку"
        description: |
          Тот же повод, что и `engine-solid-canon-not-separated`, но дешёвый отдельный фикс:
          `summary` правила `organized-imports` (`src/style/index.ts`) называл поводом для
          правила конкретный файл приложения-потребителя. Не код-связь (не
          импорт), но смысловая — канон, задуманный независимым источником правды, цитировал
          потребителя внутри себя. В `ROADMAP.yaml` (`log`: `style-canon-as-data`,
          `biome-for-style-not-reactivity`) та же цитата уместна — это журнал решений, ему и
          положено называть повод. В `summary` самого правила — нет.

          Сделано 2026-09-16: `summary` заменён на «Импорты сортируются и группируются
          автоматически — в репозитории сегодня порядок импортов не проверяет ничто.», без
          конкретного пути. См. `log`, `lint-roadmap-backlog-2026-09-16`.

  - category: Канон кодстиля (новый, Biome)
    items:
      - id: style-canon-as-data
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Второй канон — кодстиль/импорты, отдельным списком от Solid-канона
        description: |
          Означает: рядом с `engine/index.ts` (Solid-канон) заводится СВОЙ список правил
          кодстиля/сортировки/группировки импортов — тот же приём (ядро как данные, независимо
          от движка), но НЕ тот же список: смешивать «реактивность Solid» и «порядок импортов» в
          одну карту `CanonRule[]` нельзя — тест, что каждое правило eslint-plugin-solid попадает
          ровно в одну из трёх карт (`canonRules`/`companionRules`/`offRules`), специфичен для
          набора правил ЭТОГО плагина и не имеет смысла для правил Biome. Повод — грязные,
          несортированные импорты в одном из файлов приложения-витрины, замеченные
          заказчиком; в репозитории сегодня это не покрыто вообще ничем (ни Prettier, ни
          eslint-plugin-import/simple-import-sort/perfectionist, ни `.editorconfig` — проверено
          архитектором построчным grep по репо). Решение заказчика: не заводить отдельный пакет под
          кодстиль — плагином в этом же пакете, как уже разведены канон/движок у Solid.

      - id: biome-plugin
        type: feature
        status: Done
        priority: High
        milestone: null
        name: ./biome — движок канона кодстиля (не Solid-канона)
        description: |
          ИЗМЕНЕНО 2026-09-15 относительно исходной постановки (см. `log`,
          `biome-for-style-not-reactivity`) — раньше этот пункт означал Biome как
          АЛЬТЕРНАТИВНЫЙ движок ДЛЯ Solid-канона (переезд с ESLint, тот же список правил, другой
          перевод). Пересмотрено: у Biome нет расширяемости под кастомные Solid-специфичные
          правила (реактивность/деструктуризация/JSX — то, что делает eslint-plugin-solid) —
          переезд был бы либо потерей покрытия, либо ожиданием чужого набора правил, которого не
          существует. Реальная сила Biome — форматирование и сортировка/организация импортов, то
          есть ровно `style-canon-as-data` (выше), а не Solid-канон. ESLint остаётся ЕДИНСТВЕННЫМ
          движком Solid-канона, никакого переезда не происходит.

          Означает: `src/biome/index.ts` — перевод style-канона в `biome.json` (секции
          `formatter`+`assist`/`organizeImports`). Реализовано (см. `log`,
          `biome-plugin-implementation`) — в т.ч. отдельно от изначальной постановки, движок
          материализует канон в статический `dist/biome/biome.json` (Biome не читает JS-функцию
          как конфиг, только файл на диске), а не только отдаёт объект. Подключение реального
          потребителя — отдельный пункт (`biome-plugin-first-consumer`, ниже): требует правки
          вне `packages/lint`, не входит в границы этого пакета.

      - id: biome-plugin-first-consumer
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Подключить ./biome как реально работающий канон в первом реальном потребителе
        description: |
          Означает: `biome.json` приложения-потребителя — `{ "extends":
          ["@web-core/lint/biome.json"] }`, скрипт `style` (`biome check .`). Проверено: прогон
          этого скрипта реально резолвит канон через пакетный `exports` и находит живые
          нарушения (186 диагностик формата/сортировки импортов на 170 файлах) — не «настроено
          и молчит», а «настроено и ловит». Само исправление этих 186 — отдельная, не
          запрошенная пока работа (нужно решение про `--write` на всё приложение разом, задача
          другого дня).

          Правка сделана архитектором напрямую в приложении — вне границ этого пакета, по прямой
          просьбе заказчика, не по инициативе. Сопутствующее решение — `biome-app-direct-dependency`
          ниже, тем же заходом.

      - id: biome-import-groups-web-core-first
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`organizeImports` — свои группы (node → сторонние npm → `@web-core/*` → относительные)"
        description: |
          Сегодня `organizeImports: "on"` — плоская сортировка Biome, все внешние пакеты (наши
          `@web-core/*` и сторонние npm) в одном алфавитном списке без разделения. По прямой
          просьбе заказчика — развести НАШИ пакеты в отдельную группу, с пустой строкой между
          группами. Архитектор проверил натурно (не по докам, а прогоном): Biome 2.5.13 реально
          поддерживает `groups` с предопределёнными матчерами (`:NODE:`, `:PACKAGE:`, `:PATH:`,
          `:BLANK_LINE:`) и glob-негацией:

          ```json
          "organizeImports": {
            "level": "on",
            "options": {
              "groups": [
                [":NODE:"], ":BLANK_LINE:",
                [":PACKAGE:", "!@web-core/**"], ":BLANK_LINE:",
                ["@web-core/**"], ":BLANK_LINE:",
                [":PATH:"]
              ]
            }
          }
          ```

          Реальный прогон на фикстуре (node:fs/node:path, solid-js/zod, @web-core/io/@web-core/ui,
          относительные) дал ровно 4 блока с пустой строкой между ними, в этом порядке.

          Сделано 2026-09-16: `defineBiomeConfig()` (`src/biome/index.ts`) отдаёт
          `assist.actions.source.organizeImports` объектной формой (`{ level: "on", options: {
          groups: IMPORT_GROUPS } }`) вместо булева `"on"` — `IMPORT_GROUPS` держит ровно
          рецепт выше. Канон (`src/style/index.ts`) не тронут — конкретные группы, как и
          `indentStyle`, решение движка, не канона (то же разделение, что уже названо в
          `biome-plugin`). `BiomeConfig`-тип расширен новым `ImportGroupEntry`/`OrganizeImportsOn`
          под объектную форму. Проверено натурно ещё раз, отдельно от прогона архитектора: тот же
          рецепт на фикстуре с `node:fs`/`node:path`, `zod`/`solid-js`,
          `@web-core/io`/`@web-core/ui`, `./local` через собранный `dist/biome/biome.json` дал
          ровно 4 блока с пустой строкой в этом порядке — записано настоящим прогоном CLI в
          `test/biome.test.ts` (не мок).

          ПЕРЕИГРАНО тем же днём, по прямой просьбе заказчика, ДО того как правка выше дошла до
          приложения-потребителя: рецепт сменился целиком. Было (см. выше) — 4 группы с пустой
          строкой между каждой, `@web-core/*` отдельным блоком от остальных scoped-пакетов. Стало —
          голые имена (node + обычные npm) → ЛЮБОЙ `@`-scoped пакет (наши `@web-core/*` и чужие
          — `@tanstack`, `@ark-ui`, `@xstate`, `@zag-js` и т.д. — одним блоком, НЕ разведены) →
          `#`-алиасы (subpath imports вида `#/entities/...`) → относительные пути, БЕЗ пустой
          строки между блоками вообще — одним куском, порядок задаёт только их взаимное
          расположение:

          ```json
          "organizeImports": {
            "level": "on",
            "options": {
              "groups": [
                [":NODE:", ":PACKAGE:", "!@*/**", "!#*/**"],
                ["@*/**"],
                ["#*/**"],
                [":PATH:"]
              ]
            }
          }
          ```

          Заодно проверено и отклонено: заказчик попросил 2 пустые строки между импортами и кодом —
          натурный прогон подтвердил, что Biome максимум держит 1 пустую строку подряд и молча
          схлопывает 2+ в 1, настройки на «ровно N» у форматтера нет. Осталась 1 (дефолт), это
          не решение канона — Biome так устроен.

          `IMPORT_GROUPS`/тест в `test/biome.test.ts` переписаны на этот рецепт — прежняя
          фикстура (разведение `@web-core/*`) заменена новой, с одним `@tanstack`-импортом,
          показывающим намеренное объединение с чужими scoped-пакетами. См. `log`,
          `lint-roadmap-backlog-2026-09-16`.

      - id: biome-app-direct-dependency
        type: decision
        status: Backlog
        priority: Medium
        milestone: null
        name: "Приложение-потребитель ставит `@biomejs/biome` прямой devDependency — временное исключение"
        description: |
          Конвенция репозитория: приложения подключают только НАШИ пакеты
          (`@web-core/*`), сторонние инструменты — через них, не напрямую. `@biomejs/biome`
          сегодня — прямая `devDependency` приложения (иначе бинарь `biome` не резолвится в
          `node_modules/.bin` потребителя: `@web-core/lint` держит его как `peerDependency`,
          `optional`, а peer'ы себе ставит сам потребитель, не транзитивно). Заказчик разрешил
          исключение для линтер-тулинга явно, не молчаливо — `eslint` в этом же `package.json`
          уже прямая зависимость по той же причине, прецедент есть.

          Не решено, стоит ли снимать это позже: например, `packages/lint` заводит свой `bin`
          (тонкий wrapper, исполняющий `biome` из СОБСТВЕННОГО `node_modules`) — тогда
          потребителю снова не нужна прямая зависимость на сторонний пакет, чем при живом
          `eslint`-прецеденте, где так и не сделано. Смотреть по факту, не по аналогии — решение
          за заказчиком и архитектором, когда дойдёт очередь.

      - id: docs-biome-sketch-stale
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "README/FAQ — эскиз `./biome` описывает отменённый план (\"тот же список правил\")"
        description: |
          `README.md` (`Главное`, `Рецепт`) утверждал: «когда встанет Biome, канон не
          переписывается — рядом с `./eslint` встаёт `./biome`, тот же список правил» — это про
          старый, снятый план `biome-plugin` (замену ESLint). Поправлено при реализации
          `biome-plugin`: README/FAQ теперь описывают ДВА независимых канона (см. `log`,
          `biome-plugin-implementation`), стейл-тезиса не осталось.

  - category: Документация
    items:
      - id: docs-readable-outside-our-workspace
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Дока и комментарии объясняют себя без нашего рабочего пространства"
        description: |
          Означает: пакет уезжает синком в чужой рабочий репозиторий, где нет ни наших
          приложений, ни нашего трекера, ни наших ролей — и всё, что на них ссылалось, читателю
          на той стороне не говорило ничего.

          Сделано 2026-09-23, двумя правилами разом.

          (1) В коде не проза. Восемнадцать блоков комментариев от пяти строк подряд (129 строк:
          `src` 9 блоков / 72 строки, `test` 9 / 57) разобраны: содержательное переехало в
          `FAQ.md` шестью новыми вопросами (опции правил движка · осознанно выключенные правила ·
          рецепт групп импортов · проект-потребитель · проба `prepare` и её раскладка · почему
          ветка `development` не обязана лежать в тарболе), на месте осталась пометка в одну-две
          строки со ссылкой на разобранное. Голого сноса не было ни в одном блоке. Повторный
          замер тем же способом: ноль блоков от пяти строк.

          (2) Наружу не течёт наш воркспейс. Убраны: хеш коммита нашего репозитория и утверждение
          «проб нет» в `README.md` (§Сборки — пробы восстановлены, шесть файлов, раздел описывал
          состояние до восстановления), слово «кит» о рабочем пространстве (`README.md`, `FAQ.md`),
          внутренние имена ролей в журнале — заменены на то, кто это по смыслу (заказчик,
          владелец пакета, архитектор). Стейл заодно: `README.md` (§Рецепт) и `FAQ.md`
          (вопрос про диапазон peer) звали пробы отсутствующими.

          Разобрано и НЕ тронуто: восемь упоминаний `scripts/generate-biome-json.mjs` — это
          собственный файл пакета (`packages/lint/scripts/`), он объявлен в `files`, вызывается из
          `build` и реально едет в тарболе (утверждается `test/surface.test.ts`). Путь относителен
          корню пакета, а не репозитория, и читается на той стороне так же, как здесь.


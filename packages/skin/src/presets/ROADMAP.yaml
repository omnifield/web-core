# Дорожная карта `@web-core/skin/presets` — источник правды по фактически сделанной работе внутри
# этого подпути. Формат тот же, что у корневого ROADMAP.yaml пакета: categories → items, без
# milestones. Пункты, затрагивающие `wear/`/`solid/` наравне с этим подпутём (единая цепь решений
# по on-demand печати CSS), остались в корневом ROADMAP.yaml — не дублируются здесь.

categories:
  - category: Служба раздачи
    items:
      - id: variants-of-outfit-scoped
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "variantsOf(client, outfitName, component) — варианты компонента в рамках ОДНОГО наряда"
        description: |
          Заявка родилась из живой путаницы на витрине компонентов: её страница показа
          запрашивала `client.list("form"/"assembly", {component})` и получала 0 сборок и 1 форму —
          не баг, а смешение трёх разных понятий (разбор — FAQ.md этого подпути).

          По шагам, как сузили заявку (слова user дословно):
          1. "мне надо брать из прессетов, и в рамках текущего аутфита" — сборки/варианты не из
             кода кита (`packages/ui/src/*/playground/assemblies`), а из службы, и не по всему
             каталогу, а в рамках надетого наряда.
          2. Оказалось, что "сборки" (`kind:"assembly"`) — отдельный от кита реестр, СЕГОДНЯ пустой
             для многих компонентов (никто не звал `save_preset(kind:"assembly", …)`) — не баг,
             других сборок в presets просто ещё нет. Не входит в объём этой заявки.
          3. "вариант — базовая сущность, юзер в редакторе смотрит какие есть варианты, каждый
             отдельно, у каждого тэги, это база навигации/поиска/сортировки" — потребовало понять,
             откуда вообще берётся список вариантов: он не отдельная запись службы, а
             `Object.keys(Form.recipe.variants)` ОДНОЙ form-записи, с тегами из параллельного
             `Form.variantTags`.
          4. "а я тогда не понимаю, как у меня может быть больше одной формы на компонент" — привело
             к находке: `checkOutfit` бросает `component-twice`, если наряд назвал ДВЕ формы одного
             компонента (`engine/look/check.ts:86-97`) — значит форма привязана к НАРЯДУ, не к
             компоненту глобально, и внутри одного наряда на компонент гарантированно 0 или 1 форма.
          5. "мне нужен фильтр по аутфиту… пока базовая работа в рамках одного аутфита, юзер его
             надел и уже в нём мутит скины" — зафиксировало финальную форму: `variantsOf` берёт
             `outfitName` явно, сама делает `client.get(outfit)` + `client.list(form, {component})`,
             пересекает по `outfit.forms`, отдаёт `{name, tags}[]`.

          Реализация: `presets/variants.ts`, `VariantSummary { name, tags }`, тег без объявления —
          `DEFAULT_TAG` (`@web-core/skin/tags`), тем же приёмом, что и у `groupByTag`. Список форм
          по ВСЕМ нарядам разом — сознательно не сделано, user сам назвал это гипотетическим будущим
          кейсом, не сегодняшним.

      - id: variants-of-current-outfit-fallback
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "variantsOf(client, component) — outfitName необязателен, без него берётся надетый наряд"
        description: |
          Заявка user дословно: "можем ли мы добавить variantsOf только для текущего аутфита? я могу
          получить текущий у себя, но в некоторых кейсах это неудобно через хук. сможешь сделать что
          то типо карентВариантОф или подобное, или лучше если я не передаю имя аутфита, то давать
          текущий" — сам же и выбрал вариант из двух предложенных.

          Не отдельная функция `currentVariantsOf` — перегрузка `variantsOf(client, component)` рядом
          с прежней `variantsOf(client, outfitName, component)`: тот же контракт («варианты компонента
          в рамках ОДНОГО наряда»), «текущий» тут не размыт — единственный `data-skin` на
          `document.documentElement` (`readWorn()`, `wear/root.ts`), тот же источник, что и
          `SkinSwitch.worn()`, но без хука/Solid-контекста.

          `readWorn()` рассчитан на браузер (`wear/index.ts`: только `wear/switch.ts`+`solid/`
          трогают документ) — здесь зовётся и из Node/SSR, поэтому обёрнут в `try/catch` на границе
          вызова (`currentOutfitName()` внутри `variants.ts`), не меняя сам `readWorn()`. Ничего не
          надето или нет документа — тот же пустой список, что и у ненайденного наряда, не отказ.

          Тесты — `test/presets-variants.test.ts`: надетый через застабленный `document` наряд
          резолвится, отсутствие `document` — пустой список без похода в сеть.

          Тесты — `test/presets-variants.test.ts`: находит форму по пересечению с `outfit.forms`,
          наряда нет → `[]`, наряд не одевает компонент → `[]`.
      - id: presets-full-crud
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Полный CRUD по каждому виду записи службы раздачи
        description: |
          Означает: list/get/save/replace/remove по палитре/форме/наряду/сборке одним клиентом;
          имя — довод операции, не поле содержимого (у сборки своего имени нет).

      - id: client-graphql-transport
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createPresetsClient — REST → GraphQL внутри, PresetsClient/PresetRecord<T> наружу без изменений"
        description: |
          REST службы хранения пресетов удалён её владельцем — этот
          клиент сейчас ходит в никуда. Чинится ЗДЕСЬ и только здесь: `packages/ui/src/
          component-info.ts` (`createComponentInfo`) и `./source.ts` (`createPresetsSkinSource`,
          рантайм `wear`) стоят целиком на публичном интерфейсе `PresetsClient` — ничего не знают
          про REST/`?kind=` под ним. Сохрани форму — `PresetRecord<T>` (`{id, label, name, state}`)
          и сигнатуры `list`/`get`/`save`/`replace`/`remove` — и обе зоны получат фикс бесплатно,
          без своей правки. Это НЕ рефакторинг ради чистоты — старый клиент уже сломан против
          нового бэка.

          По шагам:

          1. `options.url` — теперь адрес `/graphql` целиком (тот же адрес службы, что резолвит
             у себя приложение-потребитель), не REST-`{base}` для `?kind=`/`/id`.
             Транспорт — `graphqlRequest`/`gql` из `@web-core/query/graphql` (пакет уже готов,
             `packages/query/ROADMAP.yaml`'s `graphql-subpath-no-second-cache`).

          2. `wireList`+`wireRead` (индекс + N GET, тот самый N+1 из `finding-n-plus-one` в
             корневом ROADMAP.yaml) выкидываются целиком. `list(kind)` — ОДИН GraphQL-запрos:
             `{ presets(kind: $kind) { id label name savedAt ... on Form { component recipe
             keyframes variantTags author } ... on Outfit { palette { name } forms { name } tags
             { name } overrides author } ... }}` (фрагмент по нужному типу — kind уже известен
             вызывающему, форма — GraphQL-схема самой службы).

          3. Ответ конвертируется в СЕГОДНЯШНИЙ `PresetRecord<T>` — `state` собирается из полей
             фрагмента ОДИН В ОДИН с `packages/skin/src/engine/look/types.ts`: для `Outfit`
             — `state.palette = palette?.name`, `state.forms = forms.map(f => f.name)`,
             `state.tags = tags.map(t => t.name)` (связи GraphQL резолвятся в объекты, канон
             `Outfit` хочет строки имён — переходник именно здесь, не выше). Потребитель не должен
             отличить старый ответ от нового ни по одному полю.

          4. `get(kind, name)` — тот же список, фильтр по `name` на клиенте (схема не даёт
             get-by-name, только `preset(id)` — не регрессия, `finding-n-plus-one` уже описывал
             это как "два обращения там, где по смыслу одно", осталось так же, поменялся транспорт).

          5. `save`/`replace`/`remove` — мутации `createPreset`/`replacePreset`/`deletePreset`.
             `replace` найдёт id тем же списком, потом ОДНА атомарная `replacePreset(id, ...)` —
             попутно чинит корректность, не только скорость: раньше `replace` был DELETE+POST
             (`finding-n-plus-one` #2), гонка между ними реально могла потерять запись, новая
             мутация атомарна на бэке (`store.Replace`, одна bbolt-транзакция).

          6. `wire.ts`'s `ask`/`PresetsRefused`/`PresetsDown` — контракт (два класса отказа)
             сохраняется, `source.ts`'s `@throws` на них уже завязан. Разбор ошибок GraphQL другой:
             сетевой обрыв/5xx → `PresetsDown` как и было; `errors` в теле 200-ответа (занятое
             имя, неизвестный kind, кривой конверт) → `PresetsRefused`. `ClientError` от
             `graphql-request` (уже реэкспортирован `@web-core/query/graphql`) — источник, из
             которого этот разбор строится, не факт, что 1-в-1 по коду ошибки, сверить нужно
             живьём, не угадывать по типам.

          7. НЕ делать в этом заходе: сводить `list("form")`+`list("outfit")` из `componentInfo` в
             один алиасированный запрос (`forms: presets(kind:"form"){...} outfits: presets(kind:
             "outfit"){...}` — GraphQL это позволяет одним HTTP-вызовом) — заметная, но отдельная
             оптимизация ПОВЕРХ этого фикса, не блокирует его, и трогает `packages/ui`, а не только
             эту зону. Не добавлять `PRESET_KIND.tag` — этим клиентом сегодня никто его не зовёт,
             заводить видом "на будущее" незачем.

             УСЛОВИЕ ИЗМЕНИЛОСЬ (2026-09-09): MCP-сервер зоны собирается перейти на этот клиент
             (его пункт про снятие второго клиента хранилища) и реально зовёт `kind:"tag"`
             — см. `tag-kind-support` ниже.

          8. Тесты — тем же приёмом, что `batching_test.go` в бэке: не верить чтению кода, гонять
             `list`/`get`/`save`/`replace`/`remove` против ЛИБО настоящего дев-бэка, ЛИБО мока
             `fetch` с реальной формой ответа GraphQL (`{data: {...}}`), и сверять, что
             `componentInfo`/`source.ts` на выходе видят ТУ ЖЕ форму `PresetRecord<T>`, что и
             раньше — не только что запрос ушёл.

      - id: tag-kind-support
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createPresetsClient — добавить `tag`, реальный потребитель появился"
        description: |
          Найдено ПЕРЕД тем, как MCP-сервер зоны перешёл на этот клиент (его пункт про снятие
          второго клиента хранилища): та зона хранит словари тегов как обычный пресет
          (`kind:"tag"` — валидный вариант в её `shared.ts`'s `KIND`-enum, реально зовётся
          `save_preset`/`list_presets`/`get_preset`). `client-graphql-transport` сознательно НЕ
          завёл `tag` — на тот момент клиентом никто его не звал. Теперь звёт.

          Три места, зеркально тому, что уже сделано для остальных пяти видов:
          1. `PRESET_KIND.tag = "tag"` + запись в `PresetKindState`.
          2. `LIST_QUERY` — фрагмент `... on Tag { tagLabel author }` (в схеме службы
             поле называется `tagLabel`, НЕ
             `label` — тот верхнеуровневый у `Preset`, разные значения на живой записи).
          3. `toState()` — ветка `kind === "tag"`, форма `{ name, label: tagLabel, author }` (не
             падать в `content`-ветку по умолчанию, как сегодня).

          Канона TS для `Tag` в `src/engine/look/types.ts` НЕТ (на стороне службы этот вид тоже
          описан по живой записи, а не по коду, которого не было). Значит
          здесь тот же вопрос, что уже решали для `author`/`tags` у остальных видов: заводить
          интерфейс `Tag` в каноне (`{name, label?, author?}`) или оставить тип inline в
          `client.ts`, раз канона для него никогда не было и другие модули его не импортируют.
          Решать по факту, не гадать — что реально нужно `checkTags`/`resolveTags`
          (`packages/skin/src/tags`), которые с этим видом соседствуют.

      - id: record-envelope-kind-and-saved-at
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "PresetRecord<T> — добавить kind/savedAt, реальный потребитель их теряет"
        description: |
          Найдено ПЕРЕД тем, как MCP-сервер зоны перешёл на этот клиент (тот же заход, что
          `tag-kind-support`, следующий слой того же аудита). `PresetRecord<T>` сегодня —
          `{id, label, name, state}`. Схема (`Preset`-интерфейс) несёт `kind`/`savedAt` тоже, но
          `LIST_QUERY` их не запрашивает, а три мутации (`CREATE_MUTATION`/`REPLACE_MUTATION`)
          запрашивают только `{id label name}` — оба поля терялись уже в `client-graphql-transport`
          для `componentInfo`/`source.ts`, просто там их никто не читал, поэтому пропало незаметно.

          MCP-сервер зоны их читает: `get_preset`/`list_presets(kind)`/`get_content` сегодня
          отдают агенту `kind`+`savedAt` (старый `store.read()` тащил их с бэка), `save_preset`
          тоже показывает их в ответе. Прямой переход на этот клиент молча срежет оба поля из
          того, что видит агент — не потому что кто-то решил, а потому что клиент их не просил у
          схемы.

          Фикс — тем же приёмом, что `tag`, аддитивно, старым потребителям всё равно:
          1. `PresetRecord<T>` — `+kind: PresetKind`, `+savedAt: string`.
          2. `LIST_QUERY` — `savedAt`/`kind` рядом с сегодняшними `id label name` верхнего уровня
             (уже есть в схеме на `Preset`, ничего не менять на бэке).
          3. `toRecord()` — прокинуть оба поля из `WirePreset` в `PresetRecord`.
          4. `CREATE_MUTATION`/`REPLACE_MUTATION` — та же пара полей в selection set рядом с
             `id label name`; `save()`/`replace()` берут `kind`/`savedAt` из ОТВЕТА мутации, не
             реконструируют сами (мутация возвращает реальный `Preset`, значения оттуда, не из
             аргументов вызова — `savedAt`, например, ставит бэк, а не клиент).

          `DELETE_MUTATION`/`remove()` не трогать — там нет записи на выходе, нечего возвращать.

      - id: presets-client-component-filter
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createPresetsClient.list() — принять фильтр по компоненту, не только по kind"
        description: |
          Вторая половина заявки о фильтре по компоненту, первая половина которой сделана на
          стороне службы хранения пресетов — та же цепь (слова user, разбор `runtime-wear-once`),
          сюда не повторяются. Коротко: `source.ts`'s `css()` сегодня зовёт `client.list(PRESET_KIND.form)` без
          фильтра — тянет формы ВСЕХ компонентов аутфита, хотя странице нужна часть. Движок
          (`generateSkinCss`/`assemble`) уже принимает произвольное подмножество `forms` — упирается
          только в клиент, который сегодня не умеет попросить подмножество у бэка.

          Зависит от бэка: контракт (скорее всего `presets(kind: String, component: [String!])`,
          список компонентов, совпадение — ЛЮБОЙ из списка) выбирает владелец службы по
          факту реализации — его форму здесь ждать, не угадывать заранее по этому файлу.

          По шагам (ориентир, не жёсткий рецепт):
          1. `LIST_QUERY` (`client.ts`) — добавить переменную `$component: [String!]` рядом с
             `$kind`, прокинуть в `presets(kind: $kind, component: $component)`.
          2. `wireList`/`list()` — новый необязательный параметр (например второй аргумент
             `{ component?: readonly string[] }`), пробрасывается в переменные запроса. Имеет
             смысл только для `form`/`assembly`/`content` (те виды, у которых есть `component` в
             схеме) — как типизировать это ограничение (отдельная перегрузка `list()` для трёх
             видов или общий необязательный параметр без строгого ограничения типом) — решить по
             месту, посмотрев на реальных вызывающих.
          3. `get()`/`save()`/`replace()`/`remove()` фильтр по компоненту не нужен — они уже
             адресуют ОДНУ запись по имени, не список.

          В объём ЭТОЙ заявки НЕ входит: `source.ts`'s `createPresetsSkinSource`/`css()` — то,
          ОТКУДА взять список нужных странице компонентов, и прокидывание его в
          `client.list(PRESET_KIND.form, { component })`. Это следующий шаг той же цепи
          (`runtime-wear-once` либо отдельная заявка), не эта правка — здесь только сама
          СПОСОБНОСТЬ клиента попросить подмножество.

      - id: presets-decompose-and-doc-locally
        type: refactor
        status: Done
        priority: Medium
        milestone: null
        name: "presets/ — декомпозиция client.ts (398 строк) на папку client/, документация переехала в README.md/FAQ.md этого подпути"
        description: |
          Означает: `client.ts` разложен на `client/{kinds,record,wire-preset,queries,convert,
          errors,index}.ts` — один файл, одна ответственность (виды/запись/сырой конверт/GraphQL-
          тела/конвертация/классификация отказа/композиция), самый крупный из них 131 строка вместо
          398. `lazy.ts`/`source.ts`/`wire.ts` очищены от инлайновых `why`-комментариев — причины
          теперь в `README.md`/`FAQ.md` этого подпути, тем же приёмом, что уже принят для
          `packages/ui/src/<component>/`. Публичная поверхность подпути (`presets/index.ts`) не
          изменилась ни на экспорт.

      - id: read-one-record-by-name
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "«Дай одну запись» стоит дороже, чем «дай все записи компонента» — фильтр по имени в схеме есть, клиент его не просит"
        description: |
          Заявка владельца витрины компонентов (2026-09-23), сверена architect'ом по коду перед тем, как лечь
          сюда — ниже факты со строками, не пересказ заявки.

          Что происходит сегодня. `get(kind, name)` (`client/index.ts:71`) — это `wireList(kind)`
          БЕЗ единого фильтра (весь список вида, со всеми телами) плюс `.find` на клиенте. Той же
          болезнью больны `replace` (`:103`) и `remove` (`:124`): оба тянут полный список только
          чтобы найти `id` по имени. То есть адресное чтение одной записи обходится дороже, чем
          чтение записей одного компонента через `list(kind, { component })`, у которого фильтр
          есть.

          Служба это уже умеет: `presets(kind: String, component: [String!], name: [String!])`
          в её GraphQL-схеме (отбор по имени сделан там отдельным пунктом) — ЛЮБОЕ имя из
          списка. `LIST_QUERY` (`client/queries.ts`)
          переменной `$name` не объявляет вовсе. Правок на бэке заявка не просит, и они не нужны.

          По шагам — ориентир, не жёсткий рецепт:
          1. `LIST_QUERY` — переменная `$name: [String!]` рядом с `$kind`/`$component`, проброс в
             `presets(...)`. Отдельный это документ или тот же — решать по месту, вместе с
             `list-headers-without-state` ниже (оба пункта трогают тот же запрос).
          2. `wireList` — принять имена и пробросить в переменные.
          3. `get`/`replace`/`remove` — звать с `name: [name]` вместо полного списка.

          Оговорки, чтобы не всплыли в реализации:
          - запись без машинного имени в выдачу по `name` не попадает (контракт схемы) — этим трём
            операциям ровно это и нужно, они адресуют именем, а `wireList` и сегодня отбрасывает
            записи без `name`/`id` (`client/index.ts:57`);
          - `variantsOf` (`variants.ts:40`) своей правки НЕ просит: он зовёт `client.get(outfit,
            outfitName)` и чинится этим пунктом бесплатно. Остаток — что наряд перезапрашивается на
            каждый новый компонент — витрина закрывает кэшем у себя, это названо заявителем прямо.

          Поверхность не меняется: сигнатуры `get`/`replace`/`remove` те же, правка внутри тел.
          Это важно, потому что у клиента есть ВТОРОЙ потребитель вне витрины — MCP-сервер зоны
          (его слой доступа к пресетам). Пока правка аддитивна, та зона не
          трогается вовсе; понадобится сменить сигнатуру или завести новый метод — это делается
          аддитивно, а ломающее идёт через architect, не правкой соседней зоны.

          Чем заявитель проверит на своей стороне: выбор записи в выпадашке даёт РОВНО один запрос
          за её телом.

          СДЕЛАНО (2026-09-23), вместе с `list-headers-without-state` — оба пункта трогают один и тот
          же запрос. `LIST_QUERY` объявил `$name: [String!]` рядом с `$kind`/`$component` и
          пробрасывает его в `presets(...)`; `wireList` принимает фильтр целиком
          (`{component?, name?}`), а не один список компонентов. `get` зовёт его с `name: [name]` —
          один запрос за одной записью, с её содержимым.

          `replace`/`remove` сделаны не тем же документом, а заголовочным (`named()` поверх
          `HEADS_QUERY`): им нужен только `id`, содержимое прежней записи они не читают ни строкой.
          То есть адресные операции теперь стоят одного запроса, и две из трёх — без единого поля
          содержимого в ответе.

          Отбор по имени на клиенте (`.find` по `name`) оставлен после фильтра службы: он не
          компенсирует фильтр, а держит точность адресации на стороне, которая за неё отвечает —
          стоит одну строку и не зависит от того, как служба поведёт себя с пустым/неизвестным
          именем.

          Поверхность не изменилась: сигнатуры `get`/`replace`/`remove` те же, ни витрина
          компонентов, ни MCP-сервер зоны не тронуты ни строкой. `variantsOf` починился бесплатно, как и
          предсказывал пункт — своей правки не потребовал.

          Тесты — `test/presets-client.test.ts`: `get()` шлёт `ListPresets` с `{kind, name}` и
          делает ровно один запрос; `replace()`/`remove()` ходят за `id` заголовочным
          `ListPresetHeads` с тем же `{kind, name}`. Проверено: `lint`/`typecheck`/`test`
          (183/183, было 182)/`build` пакета — зелёные; `pnpm --filter @web-core/ui typecheck`
          (второй потребитель клиента внутри репозитория) — зелёный без правок.

      - id: skin-source-takes-client
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createPresetsSkinSource принимает готовый клиент, а не только адрес — сеть скина перестаёт быть параллельной"
        description: |
          Заявка владельца витрины компонентов (2026-09-23), третья в тот же день. Факт из заявки сверен по коду:
          `source.ts` первым делом звал `createPresetsClient({ url })` и передавал клиент дальше в
          `createLazyComponentSkin({ client, lookup })` — внутренний слой готовый клиент принимал
          всегда, наружу эта возможность выведена не была.

          Что это стоило потребителю (их замер в браузере, реальный наряд, переход на невиданный
          компонент): четыре запроса к `/graphql`, из них два — `ListPresets(kind:"form",
          component:[...])` с одинаковыми переменными. Один их, через `variantsOf`, второй от
          источника скина, ради CSS. Бага в пакете нет: `createLazyComponentSkin` честно кэширует и
          наряд, и форму. Дефект в другом — у одних и тех же данных два независимых владельца сети,
          и приложение не может свести их в один кэш, пока путь скина спрятан за `url`.

          Кэша внутри пакета заявка не просит, и он не заводится: протухание и инвалидация — знание
          приложения (у заявителя `queryClient` с ключами и явной инвалидацией по событию от
          агента), второй такой механизм в движке спорил бы с первым.

          СДЕЛАНО. `PresetsSkinSourceOptions` стал размеченным союзом `PresetsSkinSourceByUrl |
          PresetsSkinSourceByClient` (`lookup` в обоих). Два необязательных поля рядом отвергнуты:
          они завели бы два молчаливых случая — «не дали ни одного» и «дали оба» (разбор — FAQ
          подпути). Тело выбирает одной строкой `"client" in options`, ниже ничего не меняется:
          `css()`/`names()`/`createLazyComponentSkin` и так стояли на `PresetsClient`.

          Принимается `PresetsClient` (пять операций), не `PresetsCatalog`: источник зовёт только
          `list`/`get`, и требовать от чужого кэширующего клиента `listHeaders`, который ему здесь
          незачем, значило бы просить сверх нужного.

          Правка аддитивная: форма `{ url, lookup }` работает как работала, витрина компонентов
          (её провайдер скина — единственный живой вызывающий в репозитории) не тронута.

          Тесты — `test/presets-source-css.test.ts`, три новых кейса на подставном клиенте: `css()`
          идёт через него, а `fetch` не зовётся вовсе; `names()` так же; ленивая печать компонента
          (`components.ensure`) тоже стоит на переданном клиенте. Проверено: `lint`/`typecheck`/
          `test` (186/186, было 183)/`build` пакета — зелёные.

          Проверка «два запроса вместо четырёх» — за заявителем, на его кэширующем клиенте: со
          стороны пакета доказано только то, что чужая сеть используется целиком, а своя не
          открывается.

      - id: list-headers-without-state
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Список для выбора глазами не обязан везти тела записей — цена списка не должна зависеть от их объёма"
        description: |
          Вторая половина той же заявки владельца витрины компонентов (2026-09-23), сверена по коду.

          `LIST_QUERY` (`client/queries.ts:3-54`) всегда запрашивает полный фрагмент КАЖДОГО вида:
          у `Content` — `data`, у `Form` — `recipe`/`keyframes`/`variantTags`, у `Palette` —
          `light`/`dark`/`scales`. Витрине для выпадашки нужны только `name`/`label`: у компонента
          может лежать сотня записей данных, тела тяжёлые, а человек может не выбрать ни одной.

          Служба правок не требует и здесь: выборка полей у GraphQL живёт на стороне запроса, а
          общие поля интерфейса `Preset` (`id`/`label`/`name`/`description`/`kind`/`savedAt`)
          отдаются без единого инлайн-фрагмента.

          Форма — за владельцем (второй документ запроса, опция у `list()`, отдельный метод —
          решать по месту). Контракт, который просит потребитель, один: список метаданных и тело
          выбранной записи обязаны быть ДВУМЯ разными обращениями. Это и есть причина заявки —
          не экономия байт сама по себе, а то, что сегодня их нельзя развести в принципе: обе
          ручки идут одним и тем же запросом, значит у них не может быть разных ключей кэша.

          Оговорка про тип, из-за которой это не «убрать поля из запроса и всё»: `PresetRecord<T>`
          обещает `state` обязательным полем. Отдавать под этим типом запись без содержимого значило
          бы соврать типом — та же болезнь, от которой FAQ этого подпути отводит `WirePreset`
          («чужой ответ разбирается, а не приводится типом»). Своя форма записи-заголовка или
          `Omit<PresetRecord<T>, "state">` — выбрать по месту, посмотрев на реальных вызывающих.

          Второй потребитель клиента (MCP-сервер зоны) — тот же, что назван в
          `read-one-record-by-name`: правка обязана быть аддитивной, его листинги сегодня ждут
          записи целиком.

          Чем заявитель проверит: заход на компонент, где не были ни разу, даёт запрос за списком
          БЕЗ тел; возврат на уже виденный компонент — ноль запросов.

          СДЕЛАНО (2026-09-23). Выбрана форма «отдельный метод + отдельный документ»:
          `listHeaders(kind, { component? })` поверх `HEADS_QUERY` — те же фильтры, что у `list()`,
          в ответе только общие поля `Preset` (`id`/`label`/`name`/`kind`/`savedAt`), ни одного
          инлайн-фрагмента. Флаг у `list()` отвергнут: он оставил бы одну операцию с двумя формами
          ответа, то есть ответ на «что мне вернётся» жил бы в значении аргумента (разбор — FAQ
          подпути).

          Ловушка типа решена не `Omit`, а порядком наследования: `PresetHeader` объявлен ОСНОВОЙ,
          `PresetRecord<T> extends PresetHeader` добавляет `state`. `Omit` тащил бы за собой `T`,
          которому в заголовке нечего описывать; так же сняли вторую правду о составе конверта —
          он объявлен один раз, `toRecord` строится поверх `toHeader`.

          Поверхность расширена аддитивно: `createPresetsClient` возвращает `PresetsCatalog`
          (`PresetsClient` + `listHeaders`), а сам `PresetsClient` не тронут — на нём стоят
          подставные клиенты соседних зон (`packages/ui/test/component-info.test.ts` строит
          объект-литерал этого типа), и новый обязательный метод в интерфейсе сломал бы их
          типизацию ради операции, которую они не зовут. Проверено прогоном `pnpm --filter
          @web-core/ui typecheck` — зелёный без единой правки у соседа.

          Найдено по дороге и НЕ сделано (чужая зона, заявку туда не носил): MCP-сервер зоны
          в своих тулах пресетов уже сегодня зовёт `headersOf(await presets.list(kind))` —
          то есть выкачивает тела и тут же выбрасывает их ради бюджета токенов. Ровно тот случай,
          под который заведён `listHeaders`; переключение — решение той зоны, не этой правки.

          Тесты — `test/presets-client.test.ts`: `listHeaders()` шлёт `ListPresetHeads` с
          `{kind, component}`, в тексте запроса нет ни одного `... on`, а в ответе — заголовки без
          `state`. Проверено: `lint`/`typecheck`/`test` (183/183)/`build` пакета — зелёные.

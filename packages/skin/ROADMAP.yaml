# Дорожная карта @web-core/skin — источник правды по фактически сделанной работе. Формат тот же,
# что у packages/assembly/packages/store: categories → items, без milestones — у пакета нет
# освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Паспорт и анатомия
    items:
      - id: anatomy-from-zag
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Форма анатомии — от @zag-js/anatomy, не своя
        description: |
          Означает: одно объявление анатомии порождает и attrs для узла, и selector для скина —
          разъехаться им негде по построению. Своей формы паспорта в пакете нет.

      - id: passport-two-slices
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Паспорт режется на срез рантайма и срез редактора
        description: |
          Означает: `./model` видит только то, что читают assemble/checkOutfit/generateSkinCss;
          `means`, сборки и правило вложенности живут в `./editor` и не едут в бандл потребителя,
          которому порождение не нужно. Разбор — FAQ.md.

      - id: passport-view-bridge
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Мост «узел → координата» (passport-view)
        description: |
          Означает: механика сборки адресует узлы, скин — координаты; без моста редактор
          произвёл бы стили экземпляров, а не скин.

      - id: self-assembly-slice
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Сборка компонента — отдельно от паспорта, их может быть несколько
        description: |
          Означает: держатель сборок — срез редактора (`PassportEditorInfo.assemblies`), не поле
          паспорта; паспорт остался про форму компонента, не про витрину случаев.

      - id: truncated-setting-name
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "`truncated` — новое имя в закрытом перечне настроек, флаг обрезки текста"
        description: |
          Заявка от архитектора продукта: `Typography` (`packages/ui`) должен уметь обрезать текст
          по ширине многоточием, и обрезка ортогональна виду — она может понадобиться при ЛЮБОМ
          варианте (body, heading, caption и любом, который человек заведёт в редакторе). Ось
          вариаций под это не годится: она несёт вид целиком, а обрезка виду перпендикулярна. В
          `base` рецепта тоже нельзя — `Typography` рисует и абзацы, `white-space: nowrap` в базе
          убил бы перенос строк у всего текста кита разом. Остаётся настройка, то есть имя в
          перечне, который закрыт дважды: типом (`PassportSettings<Props>`) и рантайм-проверкой
          `definePassport` («settings outside the list»).

          Ни одно из пяти существующих имён (`orientation`, `multiple`, `collapsible`, `outlined`,
          `filled`) по смыслу не подходит, обойти перечень на стороне кита нечем — он закрыт
          осознанно. Новой механики при этом не потребовалось: флаг с атрибутной меткой уже живой
          в ките (`Workspace`'s `outlined`/`filled` — `{ values: { kind: "flag" }, byDefault, mark:
          { kind: "attribute", name: "data-outlined" } }`), печать по нему идёт обычной веткой
          рецепта. Правка — буквально расширение словаря.

          СДЕЛАНО (2026-09-20): одна строка `truncated: "Truncated"` в `SETTINGS`
          (`engine/passport/form/settings.ts`). Подпись в манере соседних флагов (причастие), ключ
          — тот, что заложен в план правки кита. Добавление аддитивно: `PassportSettingName`
          расширяется, ни один существующий паспорт не задет ни одним полем. Исчерпывающего
          перебора `SETTINGS` в репозитории нет — все читатели идут через `Object.keys`/
          `Object.hasOwn` (`editor/define.ts`, `passport/form/passport.ts`), сверено грепом по
          `packages/`/`apps/`/`interfaces/`.

          Форма значения — флаг да/нет, решение user. Многострочная обрезка (по N строк) сознательно
          НЕ входит: произвольное N закрытым перечнем значений не выражается, это другая механика.
          Рынок здесь с решением совпадает — `canons/ui-skin/sources/css-overflow.md` (CSS Overflow
          L3, Working Draft 07.10.2025, сверено 2026-08-15): `text-overflow: ellipsis` нормирован в
          L3, а `line-clamp`/`max-lines`/`block-ellipsis` отложены в Level 4 и «not yet fully
          validated by implementation experience».

          Тесты — `test/passport-settings.test.ts` (2 кейса, новый файл): паспорт с `truncated` и
          атрибутной меткой проходит `definePassport`; имя вне словаря по-прежнему отбивается —
          словарь расширен, но не открыт. Проверено: `lint`/`typecheck`/`test` (180/180, было
          178)/`build` пакета — зелёные.

          Что делает кит дальше (зона `packages/ui`, не входит сюда): свой проп `truncated` в
          `TypographyProps`, настройка в паспорте с меткой `data-truncated`, правило обрезки в форме
          и тест на реальном DOM.

      - id: no-validation-axis-on-passport
        type: decision
        status: Rejected
        priority: High
        milestone: null
        name: "Валидация — НЕ четвёртая ось ComponentPassport, вопрос закрыт без правки здесь"
        description: |
          `@web-core/form` (`packages/form/ROADMAP.yaml`, `passport-validation-field-open-question`)
          изначально предполагал новое поле паспорта, симметричное `selfAssembly` — «третья/
          четвёртая ось» рядом со скином. Architect проверил РЕАЛЬНУЮ реализацию (`@web-core/form/
          solid`'s `useComponentValidation`), не предположение: сигнатура —
          `useComponentValidation(_passport: unknown, props: object)` — параметр паспорта
          буквально не используется (подчёркивание в имени, тип `unknown`). Весь механизм
          (свой путь через `props["data-node"]` → лукап в дереве → `bind`; правило показа/
          доступности через `props.meta?.rule`) не читает из `ComponentPassport` ни одного поля.

          Значит вопрос «нужно ли новое поле паспорта» имеет ответ: НЕТ, не сейчас — механике
          нечего было бы с ним делать. `packages/skin` не трогается этим заходом вообще. Если
          позже реально понадобится что-то знать О КОМПОНЕНТЕ для валидации (не о данных) —
          заводить отдельным пунктом с живым сценарием в руках, не по аналогии с этим разбором.

          Cross-zone работа по оси валидации целиком — `packages/ui`
          (`packages/ui/ROADMAP.yaml`, `kit-life-validation-fold-in`): `useKitLife` сам решает,
          звать ли `useComponentValidation`, паспорт этого решения не касается.

  - category: Значения
    items:
      - id: seed-values
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Литерал и семя смешиваются как один механизм
        description: |
          Означает: скин пересеваем — назвал семя, обе половины построила механика; литерал по
          имени перебивает построенное, и ручная правка переживает перегенерацию.

      - id: fluid-poles
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Текучий размер объявляется полюсами, не CSS-выражением руками
        description: |
          Означает: палитра называет значение на узком и широком краю, `clamp()` печатает
          механика — наклон проверяем, а не выведен на глаз автором.

      - id: vocabulary-contract
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Словарь ролей — закрытый машинный контракт палитра↔форма↔наряд
        description: |
          Означает: роль называется по назначению, не по виду; неполнота палитры относительно
          словаря названа ДО дressing, не всплывает молча на странице.

      - id: category-slot-printing
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Флаги, печатавшие ЧУЖИЕ цвета под чужим именем (`chart`, `category`), сняты целиком"
        description: |
          Заход начинался как заявка owner-style «напечатайте семь категорийных шкал флагом, тем же
          приёмом, что уже сделан для chart» — и был сделан буквально так: `category: true` у шкалы
          палитры печатал `--accent-category-3-7`. User разобрал результат и отверг его целиком,
          вместе с образцом, на который он опирался.

          Что было не так, дословно по разбору. В палитре пять родов, названных ПО НАЗНАЧЕНИЮ, и
          это понятная модель. Флаг же вешает на один из родов чужие цвета и выдаёт им его имя:
          `--accent-chart-2` — не accent, он лишь посчитан от его семени. Моя правка довела это до
          абсурда — категории ВНУТРИ категории, семь штук, с собственными лестницами. Доказательство,
          что место выбрано не по смыслу: тот же флаг, поставленный автором палитры на `warning`,
          дал бы тем же цветам имя `--warning-category-3-7`.

          Отдельно названо: у `chart` не было ни строки обоснования нигде (приехал коммитом с
          сообщением `upd`), а я, вместо того чтобы это проверить, написал в FAQ обоснование, почему
          он остаётся, — то есть задним числом легализовал недокументированный обход своей подписью.

          СДЕЛАНО (2026-09-20). Оба флага удалены из `SeededScale` (`engine/recipe/variables.ts`),
          из печати (`engine/seeds/build.ts`) и из схемы тула (`tools/schemas.ts`). Остались `alpha`
          и `scrim` — они не рождают новых цветов, это тот же цвет в другой форме (разбор — FAQ.md).
          Со стороны `@web-core/style` по встречной заявке `buildChartScale` снят, а
          `buildCategoryScales` заменён на `buildCategorySeeds(seed, count)`: генератор отдаёт
          семена, лесенку из каждого строит обычный `buildScale`.

  - category: Рецепт и порождение
    items:
      - id: recipe-form-from-panda
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Форма рецепта — от Panda CSS, с двумя сознательными отличиями
        description: |
          Означает: части/база/вариации/умолчание/пересечения — взятая форма; ось вариаций одна
          (не карта осей), состояние и предок — координаты из паспорта, не чужой словарь условий.

      - id: nested-output
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Порождение — вложенный CSS по умолчанию, плоский — отдельным подпутём
        description: |
          Означает: браузер разворачивает вложенность сам; `./flat` — для файла на диск, старого
          клиента, сверки снимком, не свойство порождения по умолчанию.

      - id: bound-single-source
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Источник паспортов называется один раз (withPassports)
        description: |
          Означает: сигнатура не даёт передать разные источники в проверку наряда и в порождение
          — раньше это расходилось молча, отчёт был чист, а страница адресовала несуществующее.

  - category: Проверки
    items:
      - id: coverage-check
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: skinGaps — покрытие координат значением, не консольным предупреждением
        description: |
          Означает: используется каждым recipe.test.tsx кита — проверка одного паспорта против
          собственного наряда.

      - id: contrast-check
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: skinContrast — читаемость по формуле зоны значений
        description: |
          Означает: перечень пар «текст на заливке», не прошедших WCAG-норму, и пар, которые
          посчитать нечем. Пока без потребителя — витрина ещё не показывает предупреждения.

      - id: category-slot-checks
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Палитра вправе объявить свои категории: запрет снят, минимум остался, различимость считается"
        description: |
          Вторая половина того же разбора — почему цвета вообще лезли внутрь `accent`. Мешала одна
          проверка: `checkOutfit` отбивал `outside-vocabulary` любое имя шкалы вне пятёрки. То есть
          нормальный путь («нужен фиолетовый — объяви категорию `purple`») был закрыт, и оставался
          только обход. Причём запрет приехал тем же коммитом `upd`, что и сам обход: один заход и
          закрыл дверь, и протащил лазейку.

          Разведено то, что было смешано в одном списке:

          - ОБЯЗАТЕЛЬНЫЙ МИНИМУМ — пятёрка, которую палитра закрывает. Остался как был
            (`palette-incomplete`): чужая форма обязана найти `danger` на месте.
          - ДОПУСТИМЫЙ МАКСИМУМ — закрывать не надо ничем. Запрет снят; `outside-vocabulary` теперь
            ловит только имя, не покрытое НИ словарём, НИ собственными категориями палитры
            (`ownScale`, `engine/look/coverage.ts`).

          Печать ничего об этом знать не обязана и не меняется: `seeded` печатает лесенку для любой
          объявленной шкалы, а известность имени для рецептов строится из напечатанного.

          Гейт назначения ступени переписан (`engine/vocabulary/scale-roles.ts`): раньше словарь
          «имя → класс ступени» строился перебором «пять родов × ступени», и `--purple-9` в нём не
          находился — текст, покрашенный ступенью заливки, проезжал бы молча у любой категории сверх
          пятёрки. Теперь имя режется на категорию и ступень, а перечень объявленных категорий
          приезжает из палитры через `Walk.colors` (одно поле, один вызывающий).

          Проверка различимости переписана под новую модель: мерится каждая ПАРА категорий палитры
          на ступенях `CATEGORY_TELLING`, а не слоты внутри одной шкалы. Теперь она не декоративна —
          семена пишет человек, и две похожие строки в палитре дают два неразличимых бейджа при
          рабочей вёрстке. Замерено: на живой пятёрке ближайшая пара accent↔neutral даёт 0.042 при
          пороге 0.02 — ложных срабатываний нет; подсунутая пара в 1° по тону ловится.
          `CATEGORY_TELLING_LIMIT` тут НЕ применяется: он измерен для равномерного круга, а палитра
          объявляет семена какие угодно (разбор — FAQ.md).

          Тесты — `test/categories.test.ts` (11 кейсов; прежний `category-slots.test.ts` удалён
          вместе с предметом): печать своей категории, законность имени сверх пятёрки, минимум
          по-прежнему обязателен, ссылка известна/неизвестна, гейт ступени на своей категории,
          чистая пятёрка, семь категорий из `buildCategorySeeds`, подсунутая пара.

          Найдено по дороге и отдано owner-style: `CATEGORY_TELLING_LIMIT` приехал равным 5 при
          заявленных в сообщении коммита 12 — не сходилось ни с их собственным тестом (перебирал 7),
          ни с моим замером (12 → запас 12%, 13 → 3%, 14 → −4%). Поправлено ими же.

  - category: Теги
    items:
      - id: group-by-tag-accepts-flat-list
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: "groupByTag — принимает и словарь (Form.variantTags), и плоский {name, tags}[]"
        description: |
          Найдено на витрине `apps/skin`: `presets/variantsOf` (`src/presets/ROADMAP.yaml`'s
          `variants-of-outfit-scoped`) отдаёт готовый плоский список вариантов с тегами — вызывающий
          хотел сгруппировать его по тегу для нав-списка, и первая версия ответа ("разверни
          Object.fromEntries сам") user назвал не лучше, чем сделать это самому фильтром: "это
          выглядит не лучше, чем если бы я просто фильтранул у себя. ты не можешь у себя расширить,
          чтобы функция умела работать с массивом?"

          Сделано: `groupByTag` принимает `Record<string, readonly string[]> | readonly
          TaggedName[]` — `Array.isArray` различает форму на входе, тело (перевод в `tag→variants`,
          сортировка `sortTags`) одно на оба случая. Три существующих вызывающих
          (`packages/ui/component-info.ts`, `apps/skin/.mcp/tools/presets.ts`, тесты) передают
          словарь и не меняются — расширение аддитивное, не ломающее.

  - category: Служба раздачи и надевание
    items:
      # presets-full-crud, client-graphql-transport, tag-kind-support,
      # record-envelope-kind-and-saved-at, presets-client-component-filter переехали в
      # src/presets/ROADMAP.yaml — это пункты про сам client.ts, не про надевание.
      - id: canon-missing-author-and-tags
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "author и Outfit.tags — реально пишутся, но не объявлены в TS-канона видов"
        description: |
          Найдено овнером backend/presets (2026-09-09) при сверке плана типизации службы с тем, что
          реально лежит в проде — до́лжно быть починено ЗДЕСЬ, ПЕРЕД тем как backend заведёт
          Go-структуры один-в-один по этим интерфейсам (см. `canon-drift-author-tags-assembly` в
          `backend/presets/ROADMAP.yaml` — типизированная валидация на запись иначе начнёт бить
          существующие живые записи, у которых эти поля реально есть).

          Два расхождения в `src/engine/look/types.ts`:
          1. `author` — сквозной атрибут владения (см. `authorGuard`,
             `apps/skin/.mcp/src/tools/shared.ts`). MCP подмешивает его в `state` ЛЮБОГО вида при
             сохранении (`{...state, author}`), но явно объявлен только в `ContentState`
             (`apps/skin/.mcp/src/tools/shared.ts`) — `Palette`, `Form`, `Outfit`,
             `ComponentAssembly` о нём молчат, хотя реальные записи (проверено живьём: `tag/status`)
             несут `{name, label, author}`.
          2. `Outfit.tags` — MCP подмешивает `tags: string[]` при сохранении наряда
             (`resolveTags`, `shared.ts`), а интерфейс `Outfit` этого поля не объявляет вовсе.

          Решение user дословно: "давай ничего не обходить! все делаем нормально!" — значит
          `author?: string` добавляется явным полем в `Palette`/`Form`/`Outfit`/
          `ComponentAssembly` (по образцу уже объявленного в `ContentState`), `tags?: readonly
          string[]` — явным полем в `Outfit`. Канон должен описывать то, что реально пишет MCP, не
          наоборот.

          Блокирует: `kinds-registry`/`canon-drift-author-tags-assembly` в
          `backend/presets/ROADMAP.yaml` — Go-структуры там пишутся зеркально к ЭТОМУ, исправленному
          канону, не к сегодняшнему.

      - id: wear-switch-moved
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Надевание скина переехало в движок из отдельного рантайм-пакета
        description: |
          Означает: `./wear` (framework-agnostic) + `./solid` (реактивный плагин) — тот же приём,
          что `@web-core/style/solid`. Гонка source.css() гасится счётчиком последнего действия.

      # presets-client-component-filter переехал в src/presets/ROADMAP.yaml — пункт про сам
      # client.ts, не про надевание.

      - id: set-mode-no-refetch
        type: bugfix
        status: Done
        priority: Medium
        milestone: null
        name: "setMode() не ходит к source.css() — переключение половины больше не перезапрашивает скин"
        description: |
          Заявка user дословно: "сейчас свитчер темная/светлая тема постоянно делает перезапрос. вот
          тут мы юзаем apps/skin/.../theme-switch/index.tsx. но там вроде вообще запроса не должно
          быть, там же цвет вроде сразу весь едет" — и сам угадал причину: обе половины
          действительно уже в одном CSS-тексте, полученном на первый `wear()` (`DARK_SELECTOR` в
          `engine/generate/print.ts` печатает и светлый, и тёмный блок разом).

          Было: `SkinConnection.setMode()` (`solid/connection.ts`) звал `wear(current.name, { mode })`
          — тот же наряд, но `wear()` в `wear/switch.ts` безусловно ходит за `source.css()`, даже
          когда имя не изменилось. Каждый клик по переключателю темы — лишний сетевой поход и
          перепечатка листа стилей ради того, что уже есть в CSS.

          Стало: `setMode()` — своя ветка в `SkinSwitch` (`wear/switch.ts`), без `source.css()`:
          `writeDark()` + `remember()`. `SkinConnection.setMode` зовёт её и тот же `applyWorn`, что
          `wear`/`takeOff`/`restore` — `componentData`/`outfitData` не чистятся (имя наряда не
          менялось). Разбор — FAQ.md, раздел «Надевание».

          Тесты: `test/skin-switch-component.test.tsx` (`source.css()` не растёт на второй `setMode`),
          `test/skin-provider.test.tsx` (то же через `SkinConnection`/`SkinProvider`).

      - id: component-skin-on-demand
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "ensureComponentSkin — компонент сам просит свой CSS, по значению variant/setting, аддитивно"
        description: |
          Третья нога той же цепи, что `presets-component-filter` (бэк, Done) и
          `presets-client-component-filter` (выше, Done) — но эта нога живёт не на сети, а внутри
          движка и надевания, и переписана дважды за обсуждение: обе первые версии были неверны,
          третья проверена чтением кода, не угадана.

          Слова user, откуда взялась заявка (сведены в один блок, дословно, по ходу обсуждения):
          "зачем нам куча флоу... я вообще не вижу смысла, чтобы продукт контролировал загрузку на
          таком уровне... нет ли смысла, чтобы стили запрашивал сам компонент? типа лэйзи для
          самого компонента... но это ничего не перезатирает, а просто запрашивается тогда, когда
          нужно". Дальше, отдельно и жёстче, про глубину резки: "у меня может быть в аутфите
          миллион вариантов кнопки, а в апп я юзаю только 5... я хочу, чтобы кнопка запрашивала не
          все миллион вариантов, а брала свой — чтобы когда отрендерилась первая кнопка
          data-variant=primary, она загрузила только primary один раз для всех кнопок с этим
          вариантом, а когда отрендерилась data-variant=secondary — только secondary, и так для
          всех". И почему не чинить это на уровне "какой набор компонентов нужен странице": "я не
          вижу ни одного кейса, когда мне надо проверить, что у меня на старте было всё — это
          больше похоже на баг". Про вторую ось (`settings`, кроме `variant`) — "я предлагаю это
          сразу брать вместе, флоу один" — единый примитив на обе оси, не два похожих рядом.

          Что было НЕВЕРНО на первых двух заходах (стоит здесь, чтобы не повторить третий раз):
          1. Первая версия — приложение само копит список нужных компонентов и перевызывает
             `wear()` с растущим списком, `sheet.put()` (полная замена) на каждый рост. Отвергнута
             user: это политика продукта поверх механики, которой продукт не обязан владеть, и
             `sheet.put()` — не тот примитив (полная замена задумана для смены НАРЯДА целиком, не
             для роста набора загруженных компонентов).
          2. Вторая версия (моя и owner-app) — для одного компонента отдельный узкий путь МИМО
             `assemble()`/`checkOutfit()`, потому что показалось, что полнота наряда там жёстко
             зашита. Опровергнуто чтением `apps/skin/.mcp/src/engine/validate.ts`'s `checkForm`:
             он уже сегодня строит СИНТЕТИЧЕСКИЙ наряд `{ name, palette, forms: [form.name] }` +
             `parts = { palettes: [palette], forms: [form] }` и зовёт `checkOutfit`/`assemble()`
             без единой правки внутри них. Полнота, которую требует `checkOutfit`
             (`engine/look/check.ts:74-84`, флаг `unknown-form`; `assemble.ts:13-14`, бросает
             `OutfitRefused` на любом флаге) — это полнота ПАРЫ «наряд+части», которую ей дали, а
             не «в сторе есть абсолютно всё». Значит для уровня «один компонент» новый примитив
             ВООБЩЕ не нужен — нужна функция, которая строит такую самосогласованную урезанную
             пару (найти имя формы компонента через `client.list(form, {component})`, пересечь с
             `outfit.forms`, которые уже в памяти после `wear()`) и отдаёт её тем же
             `assemble()`/`checkOutfit()`/`generateSkinCss()`, без единой правки в них.

          Что осталось верным и провалилось глубже, когда user спросил про variant/settings:
          резать нужно НЕ на уровне "какая форма компонента", а на уровень ниже — какое ЗНАЧЕНИЕ
          variant/setting внутри ОДНОЙ формы. Тут готового прецедента (как `checkForm`) уже нет —
          два места в `engine/rules/traverse/recipe.ts` ловят частичность рецепта как баг, если
          отдать им сырое подмножество `variants`/`settings` не подумав:
          - `growRecipe` (строки ~16-23): флаг `default-missing`/`unknown-variant`, если
            `recipe.defaultVariant` не найден среди переданных `variants`. Значит default обязан
            грузиться ВМЕСТЕ с `base`, при первом же обращении к компоненту любым его значением —
            иначе движок решит, что дефолта не существует, хотя его просто ещё не загрузили.
          - `growCompound` (строки ~142-186): флаг `unknown-variant`, если хоть одно значение
            пересечения (`CompoundVariant.variants`) не найдено среди переданных `variants`.
            Значит пересечение печатается ТОЛЬКО когда все его значения уже загружены — при
            появлении недостающего значения пересечение допечатывается следом, аддитивно, ничего
            не трогая из уже напечатанного. `CompoundVariant` не несёт поля `settings`
            (`engine/recipe/slot.ts`) — у пересечений связи с осью настроек нет вовсе, поэтому у
            `settings` эта проблема не возникает: там нет своего "default-missing" и нет
            пересечений, резать можно per-value без дополнительной книжки.

          Контракт (предлагается для реализации, не жёсткое ТЗ самому себе):
          1. `engine/rules`/`engine/generate` — новые узкие функции печати НАД уже
             существующими `growRecipe`/`growParts`/`growCompound` (не переписывают их): печать
             `base`+`defaultVariant` вместе; печать одного значения `variant` (+ пересечения,
             ставшие полностью покрытыми); печать одного значения одной `setting`. Ничего в
             `checkOutfit`/`assemble()`/существующей `generateSkinCss` не меняется.
          2. `presets/source.ts` (или новый модуль рядом) — функция «дай мне провалидированный
             рецепт ОДНОГО компонента текущего наряда»: сетевой узкий фетч через уже готовый
             `client.list(PRESET_KIND.form, { component })`, пересечение с `outfit.forms` из
             памяти, самосогласованная пара для `assemble()`/`checkOutfit()` (приём `checkForm`).
          3. `wear/switch.ts` (или новый модуль рядом) — `ensureComponentSkin(component, axis,
             value)`: кеш «что уже допечатано» на текущий наряд (компонент → {base загружен?,
             набор виденных variant-значений, по каждой setting — набор виденных значений}), сеть
             и печать только на НОВОЕ значение, доклейка в лист (не `sheet.put()` — новый способ
             ДОПИСАТЬ, не заменяя). На смену наряда (`wear()` новым именем) — переиграть весь кеш
             целиком против нового наряда тем же путём.
          4. `solid/` — `useComponentSkin(passport, props)`: реактивно читает
             `props[passport.variantAxis.mark.name]` и `props[settings[name].mark.name]` для
             каждой объявленной `setting`, на каждое новое значение зовёт `ensureComponentSkin`.
             Без `SkinProvider` в дереве — не бросает, просто ничего не делает (кит обязан уметь
             жить без presets/провайдера вовсе, это его базовое обещание, не только этой заявки).

          В объём ЭТОЙ заявки НЕ входит: вызов `useComponentSkin(passport, props)` внутри
          конкретных компонентов кита (`packages/ui/src/*/components/root.tsx`, ~35 файлов, один
          новый импорт `passport` + одна строка на файл) — отдельная заявка в
          `packages/ui/ROADMAP.yaml`, ведёт её owner той зоны. Тоже не входит: изменения в
          `backend/presets` (уже отдаёт `component`-фильтр, этого достаточно — резать нужно JSON
          рецепта на CSS-текст, а не сетевой ответ на более мелкие сетевые ответы) и в
          `packages/assembly` (не зовёт `assemble()`/`checkOutfit()` ни разу — проверено grep'ом
          owner'ом assembly, вызов на монтировании решён за кит, не за `RenderNode`).

          Не кодить до согласования: обе половины (эта и `packages/ui`'s) идут через architect на
          сверку контракта между зонами, прежде чем начинать реализацию — решение user, не техническое
          ограничение.

      - id: component-skin-data-passthrough
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "ensureComponentSkin отдаёт найденную форму наружу — витрина не перезапрашивает то, что уже спросил сам компонент"
        description: |
          Продолжение `component-skin-on-demand`: `accumulatorFor` (`presets/lazy.ts:99`) уже
          находит `PresetRecord<Form>` компонента при первом `ensure()`, но использует её только
          чтобы построить recipe/keyframes и выбрасывает — наружу едет только готовый CSS-текст.
          Одновременно `packages/ui/src/component-info.ts`'s `createComponentInfo` (используется
          витриной `apps/skin`, чтобы показать форму/вариант компонента рядом с ним) делает СВОЙ
          отдельный `presets.list(PRESET_KIND.form)` — ровно за тем же, что компонент уже спросил
          сам через `useComponentSkin`.

          Слова user, откуда взялась заявка: "мне нужно получать данные компонента, который он сам
          запрашивает... я не хочу делать отдельно запрос на то же самое, что уже запросил сам
          компонент". Идею слоёв предложил owner ui-продукта (не видит нюансов границ этого
          пакета — контракт ниже уточнён по факту чтения кода, не переписан с нуля):

          1. `wear/switch.ts` — `ComponentSkinSource.ensure` возвращает `Promise<{ css: string;
             data?: unknown }>` вместо `Promise<string>`; `SkinSwitch.ensureComponentSkin` —
             `Promise<unknown>` вместо `Promise<void>`, тот же гейт от гонки с чужим `wear()`
             (`worn()?.name !== startedFor`), что уже есть для CSS. `unknown`, не `Form` — движок
             ничего не знает про `engine/*`-модель формы, это на слой ниже, ломать эту границу ради
             единственного источника не нужно.
          2. `presets/lazy.ts` — `ComponentAccumulator` получает поле `form: PresetRecord<Form> |
             undefined` (та же запись, что уже находит `candidates.find(...)` в строке 99, просто
             сегодня не сохраняется); `ensure()` возвращает `{ css: generateComponentSkinCss(...),
             data: acc.form }`.
          3. `solid/connection.ts`, НЕ `solid/provider.tsx` — здесь, а не в `useComponentSkin`,
             заводится сигнал `componentData: Accessor<ReadonlyMap<string, unknown>>` и обёртка
             `ensureComponentSkin`, которая пишет `data` в карту по имени компонента как побочный
             эффект, тем же приёмом, что уже обёрнуты `wear`/`restore` вокруг `skin.wear`/
             `skin.restore`. Так `useComponentSkin` в `provider.tsx` не меняется вовсе — карта
             наполняется сама на каждый вызов, который он и так уже делает.
          4. Чистка карты — по имени наряда, не на каждый `wear()`: `setMode()` зовёт
             `wear(current.name, { mode })` с ТЕМ ЖЕ именем — форма от режима не зависит, чистить
             не нужно. `restore()` в `connection.ts` сегодня зовёт `skin.restore()` НАПРЯМУЮ, в
             обход локальной обёртки `wear` — если чистку зашить внутрь `wear()`, этот путь её не
             увидит. Нужна одна точка (`applyWorn(result)` или похожая), сверяющая старое/новое имя
             наряда, вызываемая одинаково из `wear`, `takeOff` и `restore`.
          5. Новый хук рядом с `useSkin` в `provider.tsx`:
             `useComponentSkinData<T>(component: string): Accessor<T | undefined>` — читает
             `useSkin().componentData().get(component) as T | undefined`. Имя честнее по границам
             типов, чем `useComponentForm` (источник данных сегодня один — presets с формами, но
             тип на этом слое — `unknown`, не `Form`).

          Что НЕ входит в объём: `packages/ui` не меняется вообще — ни `useKitLife`, ни пропсы
          компонентов, колбэк никуда не прокидывается; данные читаются по ИМЕНИ компонента снаружи,
          под `<SkinProvider>`, а не через явную связь с конкретным инстансом. `ComponentSkinInfo`/
          `createComponentInfo` (`packages/ui/src/component-info.ts`) не трогается этой заявкой —
          переключение витрины `apps/skin` на `useComponentSkinData` вместо своего `presets.list`
          отдельный шаг, не эта правка.

          Осознанно не решается здесь: `undefined` в карте перегружен — "компонент ещё не спросил"
          и "спросил, форма не нашлась" неразличимы, как и сегодня у `ComponentSkinInfo`. Richer-
          состояние (pending/resolved) — другой объём работы, не факт что нужен; не делаю, пока не
          спросят отдельно.

          Тесты, которые меняются (проверено чтением, не только заявкой owner ui — у него в оценке
          не хватало самого нагруженного файла): `test/lazy-component-skin.test.ts` (~8 мест вида
          `const css = await skin.ensure(...)`, ожидающих голую строку → `.css`), `test/skin-switch-
          component.test.tsx` (моки `ensure` возвращают строку напрямую), `test/use-component-skin.
          test.tsx` (стаб `components.ensure` в `stubSource` тоже возвращает голую строку). `test/
          presets-source-css.test.ts` — НЕ задет, `.ensure()` там только в комментарии, не в коде.

      - id: outfit-data-passthrough
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Тот же passthrough — но для наряда целиком (Outfit+Palette), не для одного компонента"
        description: |
          Прямое продолжение `component-skin-data-passthrough` — тот же довод, тот же приём, другой
          уровень. Слова user: "мы можем отдавать аутфит инфу в том же флоу, мне нужна полная, я
          сейчас делаю витрину и там нужна инфа и про аутфит, и про компоненты, компоненты мы сделали
          а вот аутфит нет". "В том же флоу" — буквально: не новый метод `SkinSource`, не отдельный
          сигнал мимо `ensureComponentSkin`, а то же самое действие, на котором уже висит `data`
          компонента.

          Где сегодня теряется. `presets/lazy.ts`'s `contextFor(outfitName)` УЖЕ фетчит и `Outfit`, и
          подходящую `Palette` (`client.get(PRESET_KIND.outfit, ...)`  + `client.list(PRESET_KIND.
          palette)`, поиск по `outfit.state.palette`) — один раз на наряд, кешируется `context`-
          промисом. Но возвращает наружу (`OutfitContext`) только РАСПАКОВАННЫЕ `outfit.state`/
          `palette.state` — сами записи (`PresetRecord<Outfit>`/`PresetRecord<Palette>`, с `name`/
          `label`/`id`) нужны `assemble()` только для чтения содержимого и выбрасываются сразу после.
          Ровно тот же паттерн, что был у `form` до `component-skin-data-passthrough`.

          Контракт (тот же слой, что и у component-версии, продолжает её типы, не переизобретает):
          1. `presets/lazy.ts` — `OutfitContext` получает два новых поля: `outfitRecord: PresetRecord
             <Outfit>`, `paletteRecord: PresetRecord<Palette>` (те самые, что `contextFor` уже
             получает от `client.get`/`client.list`, до `.state`-распаковки). `ensure()` довызывает
             `contextFor(outfitName)` ПОСЛЕ `accumulatorFor` (тот уже вызвал его с тем же именем на
             синхронном шаге внутри себя — `trackedOutfit` совпадает, это попадание в кеш, не второй
             сетевой фетч) и кладёт `{ outfit: ctx.outfitRecord, palette: ctx.paletteRecord }` в
             третье поле возврата.
          2. `wear/switch.ts` — `ComponentSkinSource.ensure()` возвращает `{ css, data?, outfit? }`
             (третье поле рядом с уже существующим `data`, тот же `unknown`, та же причина: этот
             слой не знает про `Outfit`/`Palette` как тип). `SkinSwitch.ensureComponentSkin` — было
             `Promise<unknown>` (голый `data`), становится `Promise<{ data?: unknown; outfit?:
             unknown }>` — раз теперь два независимых куска, отдавать их одним неразличимым `unknown`
             как раньше уже нельзя, значит меняется и этот контракт, не только внутренний.
          3. `solid/connection.ts` — второй сигнал рядом с `componentData`: `outfitData: Accessor
             <unknown>` (ЕДИНСТВЕННОЕ значение, не карта — наряд один на соединение, не по имени).
             Обёртка `ensureComponentSkin` пишет туда `result.outfit` тем же приёмом (гейт по имени
             наряда до/после await — тот же, что уже защищает `componentData` от того же класса
             гонки). `applyWorn` чистит ОБА сигнала при смене имени наряда, не только `componentData`.
          4. `solid/provider.tsx` — `useOutfitData<T>(): Accessor<T | undefined>`, рядом с
             `useComponentSkinData`, тем же приёмом (`createMemo` поверх `useSkin().outfitData()`).

          Что НЕ входит в объём: второй сетевой фетч наряда/палитры отдельно от `ensureComponentSkin`
          не заводится — если ни один компонент на странице ни разу не позвал `useComponentSkin`,
          `outfitData` останется `undefined` (та же ленивая природа, что и у `componentData`, и у
          самого CSS — `component-skin-on-demand`). Явный отдельный «дай мне наряд, не спрашивая
          компонент» — не эта заявка, отдельный кейс, если понадобится.

          Тесты: `test/lazy-component-skin.test.ts` (новые кейсы на `outfit`/`palette` в возврате
          `ensure()`, по образцу уже добавленных на `data`), `test/skin-switch-component.test.tsx`
          (моки `ensure` меняют форму ответа, `ensureComponentSkin` теперь возвращает объект, не голый
          `data`), `test/use-component-skin.test.tsx` (стаб источника туда же).

      - id: component-skin-cls-on-first-mount
        type: bug
        status: Backlog
        priority: Medium
        milestone: null
        name: "component-skin-on-demand — заметный CLS на первом монтировании компонента, решение не выбрано"
        description: |
          Найдено architect'ом при живом замере перформанса витрины (`apps/skin`, `/showcase/table`)
          после `component-skin-on-demand`+`component-skin-wiring`. CLS ~2.7 (порог «плохо» — 0.25,
          то есть на порядок выше) — и это НЕ артефакт дев-сервера: замерено дважды, `vite dev`
          (LCP 3018мс) и `vite preview` прод-сборки (LCP 1632мс, дев-режим дал почти половину LCP)
          — LCP от бандлинга исправился вдвое, а CLS не сдвинулся вовсе (2.69 → 2.70). Раз число
          не меняется между дев/прод — дело не в раздаче файлов, похоже на прямое следствие самой
          механики: компонент рисуется ДО того как долетел и допечатался его CSS
          (`ensureComponentSkin` асинхронный), раскладка (`collapsible`-секции, `radio-group`,
          `carousel`, сама `TABLE` в демо) досчитывается уже после первой отрисовки.

          Слова user (тут же, по итогам замера): "я думаю мы позже это обыграем, пока это не
          страшно, главное что меха работает как надо... просто опиши что кейс есть, но решение
          обсудим на месте" — то есть НЕ регрессия, которую надо чинить сейчас, а известная цена
          принятого раньше компромисса (`component-skin-on-demand`: "между тем что компонент будет
          без своего скина пока он не прилетит, и тем что всё грузится разом — я выбираю первое"),
          её масштаб теперь просто измерен и назван.

          Решение НЕ выбрано и не проектируется этим пунктом — только заявка, что кейс есть и он
          заметный. Направление для будущего обсуждения (не рецепт): возможно, `base`-стили,
          влияющие на размеры/раскладку, стоит прикладывать синхронно до первой отрисовки, а лениво
          оставлять только то, что не двигает layout (цвет, тень и т.п.) — но это гипотеза для
          разговора на месте, не решённый архитектурный шаг.

      - id: dressing-price-dictionary-and-reprint
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Одевание компонента больше не платит за пересчёт палитры и не печатает одно и то же дважды"
        description: |
          Заявка owner-studio-app (2026-09-21): переключение компонента в дереве витрины стоит
          0.3–1.5 с при полном кеше и молчащей сети, а профиль главного потока показывает не рендер
          и не сеть, а цветовую математику (`oklchToLinear` 235 мс, `tryParseColor` 171, всего около
          800 мс из ~1.4 с). Снято их же трассами (`__WEB_CORE_SKIN_TRACE__`), переход table → tabs,
          dev-сервер Vite: `generateComponentSkinCss` 335 вызовов / 1180 мс, `skinRules` 335 / 1134,
          `skinValues` 670 / 933. 335 — не число ячеек витрины (их семь), а число одеваемых
          инстансов кита; `skinValues` ровно вдвое больше — светлая и тёмная половина на вызов.

          Что подтвердилось чтением кода (цепочка вызовов сошлась с их замером один в один):
          1. `vocabularyOf` (`engine/rules/vocabulary.ts`) нужен СПИСОК ИМЁН токенов, чтобы ответить
             «такая переменная объявлена», а получает его через `valueNames` → `skinValues(light)` +
             `skinValues(dark)` → `seeded` → `buildScale`: значения обеих половин строятся целиком и
             выбрасываются на месте, `.keys()` — единственное, что от них берут.
          2. Переиспользовать между вызовами было нечего по построению: `accumulatorFor` держал
             `skin.variables` СВОЕЙ сборки, а `assemble()` строит этот объект заново на каждый вызов
             — содержимое одно, объектов триста.
          3. `ensure()` безусловно звал `scopeRecipe`+`generateComponentSkinCss`, даже когда
             `axis.value` уже лежал в накопленном, то есть когда текст CSS не мог измениться.

          Сделано две правки из трёх (третья — `value-names-without-contrast-math` ниже, решение
          user: «третий пока оставим»):
          - `presets/lazy.ts` — `ensure()` печатает только когда накопление ВЫРОСЛО (или печати ещё
            не было), иначе отдаёт `acc.printed`. `OutfitContext` получил `variables: SkinVariables`,
            собранный один раз на наряд через `assemble({...outfit, forms: []})` (тот же приём, что у
            `css()` в `presets/source.ts`); все накопители наряда берут ЭТОТ объект, а не свой.
          - `engine/seeds/index.ts` — `skinValues` помнит значения половины по объекту `skin.variables`
            (`WeakMap`): функция от него чистая, второй раз считать нечего. Заодно дешевеет полный
            `generateSkinCss`, где `print.ts` зовёт её трижды за один вызов.

          Замер на бенче внутри пакета (тот же способ, что у заявки — трассы и счёт вызовов; 335
          одеваний семи различных пар «компонент + значение», Node, не браузер): было 630 мс стены,
          `generateComponentSkinCss` 335 / 625 мс, `skinRules` 335 / 620, `skinValues` 670 / 561.
          Стало 16 мс стены, `generateComponentSkinCss` 7 / 12 мс, `skinRules` 7 / 11, `skinValues`
          2 / 7. То есть печать — по числу РАЗЛИЧНЫХ пар, палитра — один раз на наряд (2 = светлая
          плюс тёмная). Бенч временный, в репозиторий не кладётся: то же самое держат тесты ниже.

          Тесты — `test/lazy-component-skin.test.ts`, два новых кейса на счётчиках трасс (тумблер
          зоны включается прямо в тесте, `setEnabled` из `@web-core/trace`): повтор уже накопленного
          значения не печатает вовсе, а новое печатает; три одевания двух компонентов дают три печати
          и ровно два `skinValues`. Проверено: `lint`/`typecheck`/`test` (182/182, было 180).

          Проверка в витрине — за owner-studio-app, ЧАСТИЧНАЯ на момент записи: их слова — «стало
          намного лучше, но мы ещё протестили не все». Полное «после» тем же кликом и на остальных
          экранах снимают они; если где-то цена осталась, это новая находка, а не незакрытый пункт.

          Оговорка, названная прямо (разбор — FAQ.md): память значений держится на ТОЖДЕСТВЕ объекта
          переменных. Новая запись палитры по сети — новый объект, всё пересчитывается; правка записи
          НА МЕСТЕ памятью не видна — но её и сегодня не видит контекст наряда, кешируемый по имени.
          Появится редактор, правящий записи в памяти, — чинить инвалидацию контекста, а не память.

      - id: value-names-without-contrast-math
        type: bug
        status: Backlog
        priority: Medium
        milestone: null
        name: "Список имён токенов получается решением уравнений контраста — работа ради перечня слов"
        description: |
          Третья правка той же заявки (`dressing-price-dictionary-and-reprint` выше), отложенная
          сознательно: после первых двух эта математика стоит ОДИН раз на наряд (порядка 6 мс,
          замерено в этом пакете раньше — см. «Почему проверка — отдельная функция» в FAQ.md), то
          есть вопрос ушёл из срочных. Сам дефект остался: `vocabularyOf` спрашивает у `valueNames`
          имена, а тот строит все значения обеих половин (`seeded` → `buildScale`: подбор светлоты,
          `contrastRatio`, `oklchToLinear`) и выбрасывает их той же строкой.

          Направление, НЕ решение: имена ступеней объявлены константой у зоны значений
          (`SCALE_STEPS`, `@web-core/style`), к ним добавляются `contrast`, `a1…a12` при `alpha`,
          `scrim` при `scrim`, литералы обеих половин и размерные ступени — перечислимо без единого
          цвета.

          Ловушка, из-за которой пункт не делается «по-быстрому»: перечисление имён мимо построения
          значений — ВТОРАЯ правда о том, какие токены объявлены, и расходится она молча. Пример
          расхождения уже в коде: шкала, чьё семя не разобралось (`tryParseColor(scale.seed).ok`
          ложно), не объявляет ни одной ступени — перечисление по именам об этом не знает и объявило
          бы их все. Значит имена и значения обязаны порождаться из одного места, а не из двух
          похожих списков.

      - id: skin-provider-on-ready
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "SkinProvider — onReady отдаёт промис restore() коду вне дерева Solid"
        description: |
          Найдено user на витрине `apps/skin`: `variantsOf(component)` без явного имени наряда
          читает текущий наряд синхронно (`readWorn()` → атрибут `data-skin` на корне), а
          роутер-лоадер `pages/showcase/component/route.tsx` зовёт её раньше, чем `SkinProvider`
          успевает восстановить запомненный наряд (`skin.restore()` в `onMount`, асинхронно) —
          атрибута ещё нет, `variantsOf` тихо отдаёт `[]`.

          Слова user: "variantsOf он отдает варианты компонента, если не передать аутфит то он
          вернет текущий... у нас сейчас баг. route.tsx отрабатывает раньше загрузки самого
          аутфита и возвращает пустой. можешь сделать что бы он выстреливал когда аутфит загружен?"

          Причина гонки — не в самой `variantsOf` (`presets/variants.ts`, не тронута), а в том, что
          вызывающему (роутер-лоадер TanStack Router, выполняется ДО рендера страницы, вне дерева
          Solid) нечего ждать: `useSkin()`/реактивный `worn()` ему физически недоступны.

          Сделано: `SkinProvider` (`solid/provider.tsx`) принимает необязательный `onReady?:
          (ready: Promise<SkinWorn | null>) => void` — зовётся один раз на монтировании с промисом
          `skin.restore()` (отказ гасится в `null`, тем же значением, которым `worn()` отвечает на
          «ничего не надето» — причину отказа конкретного источника провайдер не имеет права
          разбирать, тем же доводом, что и существующий `console.debug`). Приложение сохраняет этот
          промис в модульную переменную и авейтит её в лоадере перед вызовом `variantsOf` — правка
          на стороне `apps/skin` (`app/providers/skin.tsx`+`route.tsx`), не входит в этот пакет.

          Тесты: `test/skin-provider.test.tsx` — `onReady()` отдаёт промис, резолвящийся в
          `{name, mode}` восстановленного наряда; отдельный кейс на отказ `restore()` → `onReady`
          резолвится в `null`, не реджектится.


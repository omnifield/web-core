  - category: GraphQL-транспорт
    items:
      - id: graphql-subpath-no-second-cache
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Новый подпуть `./graphql` — транспорт без своего кэша, кэш уже даёт корень пакета"
        description: |
          По образцу `./devtools`/`./persist` — своя папка (`src/graphql/index.ts`), свой подпуть
          в package.json exports. НЕ берём urql/Apollo Client как основу: у обоих свой
          нормализованный кэш, а он у нас уже есть — `@tanstack/solid-query`, смонтированный в
          приложении (`QueryClientProvider`, см. категорию "Точка входа"). Два кэша поверх одних
          данных — источник рассинхрона, которого легко избежать.

          Вместо этого — тонкий клиент БЕЗ состояния (`graphql-request` — сам вендор прямо
          позиционирует себя как "minimal GraphQL client", без кэша, без стора, синглтон `fetch` с
          телом `{query, variables}`).

          Основной (рекомендуемый) экспорт — `createGraphQLClient({ url, headers? })`, фабрика,
          вызываемая ОДИН раз при старте приложения (рядом с `new QueryClient()`), возвращает
          `{ request(document, variables?) }` — url/headers закрыты внутри, каждый вызов только
          документ+переменные. Под капотом — штатный `GraphQLClient` из `graphql-request` (не
          `request()`-функция): у него, в отличие от urql/Apollo, тоже нет кэша — он ТОЛЬКО держит
          url+headers, отклонённый выше "используем urql/Apollo — у них свой кэш" сюда не
          относится.

          Вторым, НЕ рекомендуемым по умолчанию экспортом остаются `graphqlRequest` (`request` из
          `graphql-request`, url на каждый вызов), `gql`, `ClientError` — по прямой просьбе user
          ("могут пригодиться, плюс их уже юзают"). README размечает их явно как внутренности
          движка: взяв `graphqlRequest` напрямую вместо `createGraphQLClient`, потребитель
          СОЗНАТЕЛЬНО отказывается от механики движка (клиент один раз — используешь везде) и
          берёт управление конфигурацией на себя (url/headers в каждом вызове — его забота, не
          пакета).

          Конкретный эндпоинт (адрес службы, заголовки авторизации) — НЕ в этом пакете: это
          конфигурация конкретного приложения, передаётся в `createGraphQLClient` один раз при
          старте.

          Найдено по ходу реализации: `graphql-request` не ограничивается typescript-типами
          вендора `graphql` — `parse`/`print`/`Kind` из него дёргаются в рантайме (парсинг строки
          документа для определения query/mutation, GET-сериализации и т.д.), поэтому `graphql`
          заведён не только в devDependencies для типов, но и в peerDependencies пакета (диапазон
          `"14 - 16"`, тот же, что объявляет сам `graphql-request`) — приложение обязано поставить
          его само, как уже делает для `solid-js`.

      - id: graphql-codegen-types
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: Типы операций генерируются из схемы бэка, не пишутся руками
        description: |
          GraphQL Code Generator (`@graphql-codegen/cli` + `@graphql-codegen/typescript` +
          `@graphql-codegen/typescript-operations`) читает SDL (теперь есть конкретный файл —
          `backend/presets/internal/graphql/schema.graphql`, кодоген в монорепо может смотреть на
          него напрямую, не обязательно живой интроспекцией по сети) и `.graphql`-документы
          потребителя, отдаёт типизированные `TResult`/`TVariables` для каждой операции. Это ТОЖЕ
          абстрактная механика — конфигурация кодогена в этом пакете не знает ни одного поля схемы
          пресетов, только адрес источника SDL. Сами `.graphql`-документы (что реально
          запрашивается) пишут потребители в своей зоне, кодоген только даёт типы под них.

          Уточнение по факту реализованной схемы (2026-09-09, backend/presets готов): в схеме есть
          именованный скаляр `JSON` (recipe-assembly-json-scalar-boundary — под него идут
          `Form.recipe`/`ComponentAssembly.assembly`/`Palette.scales` и т.д.). Кодоген БЕЗ явной
          настройки `config.scalars` типизирует произвольный кастомный скаляр как `any` — это
          снова абстрактная механика (относится к любому кастомному скаляру любой схемы, не только
          к этой), но её нужно задать явно: `scalars: { JSON: "unknown" }`, чтобы граница осталась
          видимой типом (`unknown`, не `any`) — потребитель обязан явно привести/провалидировать
          перед использованием, а не молча доверять форме. Это тот же принцип, что уже закрыл
          границу на бэке (recipe-assembly-json-scalar-boundary) — здесь он просто продолжается на
          сторону клиента.

          Открытый вопрос, не решается в этом файле: кодоген гоняется на билде (свежие типы каждый
          `dev`/`build`) или коммитится сгенерённый файл в репозиторий (стабильность CI без
          доступности бэка в момент сборки) — решать, когда появится первый реальный потребитель
          (apps/skin), не раньше.

  - category: REST-транспорт
    items:
      - id: rest-subpath-no-vendor
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Новый подпуть `./rest` — транспорт для обычных эндпоинтов, свой код, без вендора"
        description: |
          Слова user: "у нас будут также обычные эндпойнты, не только графКюль и нам тоже надо
          удобно с ними работать. у тебя уже стоит тенстак квери" — прямое продолжение
          `graphql-subpath-no-second-cache`, тот же приём (своя папка `src/rest/index.ts`, свой
          подпуть в package.json exports), но другое решение по вендору.

          У GraphQL был смысл брать `graphql-request`: сам протокол нетривиален (тело
          `{query, variables}`, разбор `errors` в ответе). У REST протокола сверх HTTP нет —
          `fetch` + JSON, и всё, что сверху даёт `ky`/`ofetch` (ретраи, таймауты, свой кэш ответов)
          — либо уже делает TanStack Query, либо не нужно вообще, той же причиной, что отвела
          urql/Apollo Client от GraphQL-транспорта: второй слой поверх кэша `@tanstack/solid-query`
          не даёт выгоды. Поэтому `./rest` — СВОЙ код (не реэкспорт стороннего пакета), ноль новых
          зависимостей.

          Первая версия (тем же заходом, что и `graphqlRequest`) передавала url параметром на
          каждый вызов "по образцу `./persist`'s `storage`" — ошибка, замеченная user: `storage`
          передаётся ОДИН раз при вызове `persistQueryClient()` на старте, а `restRequest(url, …)`
          дёргался бы на КАЖДЫЙ запрос — значит потребитель либо повторяет url/headers в каждом
          `queryFn`, либо сам заворачивает пакет в свой клиент ("юзер у себя что-то сварганил").
          Это ровно "набор утилит", а не движок — движок даёт одну гибкую механику, которую берут
          готовой, не пересобирают заново на каждом вызове.

          Основной (рекомендуемый) экспорт — `createRestClient({ baseUrl, headers? })`, фабрика,
          вызываемая ОДИН раз при старте приложения (рядом с `new QueryClient()`), возвращает
          `{ request(path, init?) }` — baseUrl/headers закрыты внутри, каждый вызов только
          path+init. Внутри — тот же `restRequest`, но с примешанным конфигом клиента.

          Вторым, НЕ рекомендуемым по умолчанию экспортом остаются `restRequest<TResult>(input,
          init?)` (url на каждый вызов) и `HTTPError` — по прямой просьбе user ("могут
          пригодиться, плюс их уже юзают"). `restRequest` — тонкая обёртка над `fetch`:
          `init.json` сериализует тело и сам выставляет `content-type: application/json`, если он
          не задан явно; разбор тела ответа по `content-type` (`json`/`text`), `204`/пустое тело →
          `undefined`; на не-2xx кидает `HTTPError` (несёт `response`+разобранное `data`, по
          образцу `ClientError` из `graphql-request`). README размечает `restRequest`/`HTTPError`
          явно как внутренности движка (та же формулировка, что у `graphqlRequest`/`gql`/
          `ClientError` в GraphQL-секции): взяв их напрямую, потребитель СОЗНАТЕЛЬНО отказывается
          от механики движка и берёт конфигурацию на себя.

  - category: Структура пакета

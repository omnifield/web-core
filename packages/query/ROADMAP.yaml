  - category: "defineQuery (эксперимент)"
    items:
      - id: define-query-experimental
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "⚠️ ЭКСПЕРИМЕНТ — `defineQuery`: одно определение запроса, вызов по имени (loader) + `.use()` (компонент)"
        description: |
          Не канон, статус временный. Слова user: "я пока делаю апп скин буду юзать это если все
          полетит то введем официально" — первый и пока единственный потребитель apps/skin
          (presets.ts: palettes/assemblies/variants/outfits/content — пять запросов одной формы
          `presetsClient.list(kind, filter?)`, различался только аргумент).

          Путь к решению: apps/skin спросил, как читать `contentQuery` (написанный через
          `queryClient.query(...)`, императивный Promise под loader) в компоненте — ответ был
          "через createResource". User сравнил с packages/store's createResourceAtom и назвал
          это той же проблемой, что раньше была у store: "у тебя урезаный пакет... приходится
          миксовать твои мехи с солид мехами". Разбор показал: createQuery — уже полный
          реактивный примитив (не сырая механика, как store's createAtom без async), а
          "миксовать" пришлось из-за формы presets.ts (Promise-функции под loader, не
          queryOptions). Предложение переписать под queryOptions+свой createQuery-хук на каждый
          запрос — по образцу TkDodo (мейнтейнер TanStack Query, tkdodo.eu/blog/
          practical-react-query, раздел "Create custom hooks": "even for wrapping one useQuery
          call, creating a custom hook usually pays off", сверено 2026-09-15) — user принял, но
          спросил, почему это не заведено в пакете "из коробки". Ответ: в apps/skin пять запросов
          СТРУКТУРНО идентичны (расходится только kind+arg, никакого select/enabled/своего
          staleTime) — порог "не строить генерик" (реальное расхождение поведения) не сработал,
          копирование шаблона пять раз — то самое дублирование, ради которого генерик оправдан.

          Форма: `defineQuery(queryClient, queryKey, queryFn, config?)` возвращает функцию,
          вызываемую ПО ИМЕНИ (`await contentQuery(id)` — обычный Promise через
          `queryClient.query(...)`, годится в `loader`, где нет Solid reactive owner) с довешенным
          `.use(arg?: Accessor<TArg>)` (реактивно, `createQuery` внутри, для компонента). Один
          `queryClient`, переданный при определении — оба пути делят кэш, прогретый `loader`
          не рефетчится повторно из `.use()`.

          `queryKey`/`queryFn` — два ОТДЕЛЬНЫХ параметра, не один callback `{queryKey, queryFn}`:
          через объединённый callback TypeScript не выводит `TData` одновременно с `TArg` (падает
          в `{}`), подтверждено изолированными прогонами `tsc` при реализации. Разбор — FAQ.md.

          Тесты (`test/define.test.tsx`, реальный рендер) доказывают три вещи: 1) вызов по имени
          — обычный Promise без Solid-owner; 2) `.use()` — реальный рендер, `loading` → данные;
          3) вызов по имени прогревает кэш, `.use()` после него не рефетчит (`queryFn` вызван 1
          раз суммарно) — это и есть решаемая проблема, не просто синтаксический сахар.

          Критерий сработал — см. `define-query-options-passthrough` ниже: первый же реальный
          потребитель просит `enabled`/`placeholderData`, и статус этого пункта пересматривается
          вместе с ответом на ту заявку.

          Критерий пересмотра статуса: если реальное использование в apps/skin потребует
          протаскивать через `defineQuery` растущий список опций вендора (`select`, условный
          `enabled`, per-query `retry` и т.п.) — это сигнал, что механика не годится, откатывать,
          а не разрастать сигнатуру. Держится на простых списковых запросах без такого разнообразия
          — переводить в статус канона (README без пометки ⚠️, версия пакета — решение architect
          при публикации).

      - id: define-query-options-passthrough
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "`defineQuery` не пробрасывает опции вендора — `enabled`/`placeholderData` назвать негде"
        description: |
          Заявка owner-studio-app (2026-09-23), сверена architect'ом по коду: `defineQuery`
          (`src/engine/define.ts:9`) принимает `config?: { staleTime?: number }` и расплющивает
          его в `queryOptions` (`:12`), а `.use(arg)` (`:17`) второго аргумента не имеет — опцию
          нельзя назвать ни при определении, ни на месте вызова.

          Чего не хватает потребителю и зачем (его слова, не догадка): `enabled` — чтобы хук не
          уходил в сеть, пока активного компонента нет (иначе летит запрос с пустым именем);
          `placeholderData` — им закрывается мигание показа на смене компонента. Просит он при
          этом не два частных флага, а сам проброс: «иначе следующая опция придёт такой же
          заявкой».

          РАЗВИЛКА, которую этот пункт обязан назвать, потому что она записана в этом же файле.
          `define-query-experimental` (выше) объявил критерий пересмотра дословно: «если реальное
          использование потребует протаскивать через `defineQuery` растущий список опций вендора
          (`select`, условный `enabled`, per-query `retry` и т.п.) — это сигнал, что механика не
          годится, откатывать, а не разрастать сигнатуру». Заявка — буквально этот случай. Значит
          у владельца два законных ответа, и выбрать нужно осознанно, а не по инерции:

          - проброс — признать критерий слишком строгим и сказать, почему (например: опции
            пробрасываются ЦЕЛИКОМ, одним типом вендора, и тогда это не «растущий список» —
            сигнатура не вырастет ни на строку, когда понадобится седьмая опция);
          - откат — признать, что эксперимент не удержался, и перевести потребителя на
            `queryOptions` + свой хук на запрос (путь TkDodo, уже названный образцом в
            `define-query-experimental` и принятый user'ом тогда же).

          Выбор — за владельцем зоны; выбранный ответ пишется здесь же со своим «почему», и статус
          `define-query-experimental` (эксперимент / канон / снято) пересматривается ТЕМ ЖЕ
          заходом, а не остаётся висеть.

          Если выбран проброс — форма тоже за владельцем, потребитель назвал два приемлемых
          варианта: расширить `config` до полного набора опций либо принимать их вторым аргументом
          у `.use`. Одно стоит проверить ДО выбора формы: опции, названные при ОПРЕДЕЛЕНИИ,
          статичны, а `enabled` у потребителя реактивен (зависит от того, выбран ли компонент).
          `createQuery` читает опции через `Accessor` (README, «опции ФУНКЦИЕЙ») — значит
          реактивная опция обязана попадать внутрь функции, вызываемой на каждый такт, а не
          замерзать в замыкании `defineQuery`. Императивный путь (`query(arg)` через
          `queryClient.query`) `enabled` не имеет смысла вовсе — там вызывающий просто не зовёт
          запрос.

          Чем доказывается: реальным рендером, тем же приёмом, что `test/define.test.tsx` —
          `.use()` с `enabled: false` не зовёт `queryFn`, `placeholderData` виден в `query.data`
          до резолва. Ловушка с типизацией моков (`vi.fn(async (arg) => x)`, не
          `.mockResolvedValue`) — та же, что уже описана в FAQ.md.

          НЕ входит: правки у потребителя (`apps/studio`) — свой `enabled` и своё мигание он
          чинит сам, после того как приедет проброс (или после того, как будет назван путь
          отката).
  - category: Поставка наружу
    items:
      - id: headers-type-browser-only
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "`HeadersInit`/`Headers` в публичных сигнатурах транспорта — типы браузера, а пакет зовут из node"
        description: |
          Найдено architect'ом 2026-09-22 при первой реальной публикации пакетов в реестр:
          `pnpm build` из корня падает на `@web-core/mcp`, дословно —
          `../query/src/graphql/index.ts(9,70): error TS2304: Cannot find name 'HeadersInit'`.
          Из-за этого `@web-core/mcp` единственный из поставки не уехал в реестр.

          Механизм (проверен чтением конфигов, не по догадке): `packages/mcp` — серверный пакет,
          его база `@web-core/build/tsconfig-node` объявляет `lib: ["ESNext"]`, `types: ["node"]`,
          то есть БЕЗ `DOM`. Он импортирует `@web-core/query/graphql`
          (`packages/mcp/src/feedback/index.ts:9` — `ClientError`/`gql`/`graphqlRequest`), а
          `createGraphQLClient` (`src/graphql/index.ts:9`) типизирует конфиг как
          `{ url: string; headers?: HeadersInit }`. `HeadersInit` — глобальный тип библиотеки
          `DOM`; в node-типизации его нет, и тайпчек падает до всякого рантайма. Сам рантайм при
          этом исправен: `fetch`/`Headers` в Node 18+ существуют, вопрос только в типах.

          То же место есть и в REST-транспорте, просто оно пока никого не сломало, потому что
          `mcp` импортирует только `./graphql`: `src/rest/index.ts:77` (`mergeHeaders(clientHeaders:
          HeadersInit | undefined, …): Headers`) и `src/rest/index.ts:87` (`createRestClient(config:
          { baseUrl: string; headers?: HeadersInit })`). Любой следующий серверный потребитель
          `./rest` упрётся в ту же стену.

          Что решить (зона query, не cross-zone): объявить форму заголовков СВОИМ типом, не
          зависящим от среды, — тем же приёмом, каким `packages/assembly` сузил нужду в чужом
          паспорте до структурного `GrowablePassport`. Тип обязан оставаться совместимым с тем,
          что принимает `fetch`/`GraphQLClient` изнутри (простая карта «имя → значение» под это
          подходит). Менять `@web-core/build/tsconfig-node` (добавить туда `DOM`) — НЕ решение:
          серверному пакету нельзя выдавать браузерные глобалы ради одной подписи типа, это
          спрячет ошибку, а не уберёт её.

          Отдельно решить и назвать в описании: считать ли сужение типа заголовков изменением
          публичной поверхности (сегодня формально можно передать `Headers`-объект или массив пар;
          после сужения — только карту). Если да, выпуск идёт минором — владелец записывает это
          интентом (`pnpm change`), версию поднимает architect.

          Воспроизведение: `pnpm --filter @web-core/mcp build` из корня.

          СДЕЛАНО 2026-09-22. Своим типом стал `RequestHeaders` —
          `Readonly<Record<string, string>>`, объявлен в КАЖДОМ из двух подпутей отдельно (а не
          общим внутренним модулем): `./graphql` и `./rest` зафиксированы как не-семья (разный
          протокол, разная ошибка, ничего общего в реализации), и заводить ради одной строки
          третье место, от которого оба зависят, значило бы сшить их обратно. Заменено в трёх
          сигнатурах: `createGraphQLClient` (src/graphql/index.ts), `createRestClient` и
          внутренний `mergeHeaders` (src/rest/index.ts); per-call заголовки в `RestRequestInit`
          не трогали — они приходят из `RequestInit`, а это имя в node-типизации есть.

          Найдено по ходу (чтение `@types/node@24.13.3/web-globals/fetch.d.ts`): под node-типами
          глобально объявлены `fetch`/`Headers`/`Response`/`Request`/`RequestInit`, нет ровно
          `HeadersInit`. Поэтому правка вышла точечной, а не переездом транспорта на другие типы.

          Гейт против повторения: `pnpm typecheck` пакета гоняет ВТОРОЙ проект —
          `tsconfig.node.json` (только `src/graphql`+`src/rest`, база
          `@web-core/build/tsconfig-node`). Проверено возвратом `HeadersInit` в сигнатуру: снова
          `TS2304`, до всякой сборки чужого пакета.

          Решение по открытому вопросу о поверхности: сужение СЧИТАЕМ изменением публичной
          поверхности (формально пропадают `Headers`-объект и массив пар), значит выпуск минорный
          — `0.2.0`. В репозитории `headers` в оба клиента не передаёт ни один потребитель, так
          что фактически не сломано ничего. Файл интента (`.changeset/`) лежит в корне, вне зоны
          query — его кладёт architect; команды `pnpm change` в корневом `package.json` сегодня
          нет и `@changesets/cli` не установлен, это названо architect'у отдельно.


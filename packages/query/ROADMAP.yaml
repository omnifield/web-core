# Дорожная карта @web-core/query — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/build, packages/store и packages/assembly (categories → items, log → журнал
# решений); без milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и
# открытое.
#
# Эта секция (GraphQL) — ПЛАН, согласованный с user 2026-09-09; транспорт (первый пункт) уже
# реализован, кодоген и переезд потребителей (следующие пункты) — ещё Backlog, значит «решено
# делать», не сделано. Контекст: backend/presets переезжает на GraphQL (см.
# /workspaces/web-core/backend/presets/ROADMAP.yaml) — примитивная пара «список id / запись по
# id» не тянет растущий граф связей компонента. Слова user про ЭТОТ пакет: "это абстрактные
# механики и они не зависят от наших схем" — значит здесь заводится ТОЛЬКО транспортный механизм
# (как отправить GraphQL-документ и типизированно получить ответ), без единого поля/типа из схемы
# пресетов. Сама схема и конкретные запросы — забота потребителей (apps/skin, apps/skin/.mcp),
# третий шаг цепи, обсуждается отдельно.

categories:

log:
  - id: headers-own-type-not-dom-global
    type: plan
    date: 2026-09-22
    summary: >
      Закрыт `headers-type-browser-only`. Публичные сигнатуры транспорта больше не зависят от
      библиотеки `DOM`: `HeadersInit` заменён своим `RequestHeaders`
      (`Readonly<Record<string, string>>`) — тем же приёмом, каким `packages/assembly` сузил нужду
      в чужом паспорте до структурного `GrowablePassport`. Тип объявлен в каждом подпути отдельно,
      не общим модулем: `./graphql` и `./rest` не семья, и общий внутренний модуль сшил бы их
      обратно ради одной строки. Сужение поверхности признано изменением публичной поверхности,
      значит выпуск минорный (`0.2.0`), хотя фактически в репозитории `headers` в клиенты не
      передаёт никто.

      Главное, что даёт этот заход дальше: на пакет повешен ВТОРОЙ проект тайпчека
      (`tsconfig.node.json`, база `@web-core/build/tsconfig-node`) — до сих пор пакет проверялся
      только в своей, браузерной типизации, и о том, что он ломает серверного потребителя,
      узнавали из чужой сборки. Теперь граница проверяется у себя. Правило на будущее:
      поставляемый наружу код не имеет права называть глобал, которого нет у потребителя с другой
      базой tsconfig.

  - id: define-query-experimental-added
    type: plan
    date: 2026-09-15
    summary: >
      Добавлен `defineQuery` (⚠️ эксперимент, категория "defineQuery (эксперимент)" этого файла).
      Порог "не строить генерик, если запросы расходятся по поведению" (см. лог
      `transport-client-once-not-toolkit` ниже — тот же принцип "движок даёт готовую механику,
      не заготовку под самостоятельную сборку") здесь не сработал в обратную сторону: пять
      запросов apps/skin's presets.ts структурно идентичны, копирование шаблона — реальное
      дублирование, не расхождение поведения. Реализация нашла и задокументировала (FAQ.md) два
      факта: 1) `queryKey`/`queryFn` обязаны быть отдельными параметрами — через объединённый
      callback TypeScript не выводит `TData` рядом с `TArg`; 2) `vi.fn().mockResolvedValue(x)` не
      годится для тестирования параметризованных generic-хелперов — нужна типизированная
      реализация мока. Статус пересматривается после реального использования в apps/skin.

  - id: transport-client-once-not-toolkit
    type: plan
    date: 2026-09-11
    summary: >
      Слова user: "получается что сейчас он строит механики у себя, тогда какой смысл от твоего
      движка? получается у тебя набор утилит а не движок... смысл движка дать одну гибкую
      механику, что бы юзер не химичил у себя, а просто взял движок квери и заюзал то, что он
      дает". Первая версия `./graphql`/`./rest` передавала url/headers параметром на КАЖДЫЙ вызов
      `graphqlRequest`/`restRequest` — скопировано с `./persist`'s `storage`, но там конфиг
      передаётся один раз при вызове на старте приложения, а не на каждый запрос. Разница
      оказалась решающей: с транспортом на каждый вызов потребитель либо копирует url/headers
      всюду, либо сам собирает клиент вокруг пакета — то самое "юзер химичит у себя".

      Исправлено: `createGraphQLClient({ url, headers? })`/`createRestClient({ baseUrl, headers?
      })` — фабрики, вызываются один раз при старте (рядом с `new QueryClient()`), возвращают
      `request(...)`, который дальше используется как есть в любом `queryFn`/`mutationFn`. Голые
      `graphqlRequest`/`restRequest` (url на каждый вызов) оставлены по прямой просьбе user
      ("могут пригодиться, плюс их уже юзают") — но переклассифицированы в README как внутренности
      движка: используя их вместо клиента, потребитель СОЗНАТЕЛЬНО отказывается от механики движка
      и берёт конфигурацию на себя. Разбор — `graphql-subpath-no-second-cache`/
      `rest-subpath-no-vendor` (описания дополнены), FAQ.md.

  - id: graphql-request-peer-not-just-types
    type: plan
    date: 2026-09-09
    summary: >
      Реализация `graphql-subpath-no-second-cache`: `graphql-request` не просто типизирует свои
      сигнатуры через `graphql`-пакет — `parse`/`print`/`Kind` из него реально дёргаются в
      рантайме (разбор строкового документа при отправке). Значит `graphql` — не devDependency
      «только под TypeScript», а настоящий peerDependency (`"14 - 16"`, диапазон самого
      `graphql-request`) — приложение обязано установить его рядом, иначе рантайм-ошибка резолва
      модуля, не ошибка типов. `gql`-тег из того же вендора рантайм-зависимости не тянет —
      это чистый passthrough по строке, без парсинга в AST.

  - id: backend-landed-transport-assumptions-held
    type: plan
    date: 2026-09-09
    summary: >
      backend/presets реализован (gqlgen, `Preset`-интерфейс + шесть типов, один `POST /graphql`,
      dataloader на связях) — транспортные решения, принятые здесь ДО реализации бэка, не
      потребовали пересмотра: один HTTP-эндпоинт без параметров маршрута подтверждает выбор
      кэш-less `graphql-request` (не нужен урл-роутинг, которым славятся сложные REST-клиенты);
      батчинг живёт целиком на сервере (`no-server-side-n-plus-one` в backend/presets/ROADMAP.yaml)
      — этому пакету по-прежнему нечего делать с N+1 самому. Единственное, что реализация добавила
      конкретного, — кастомный скаляр `JSON` в схеме, из-за которого `graphql-codegen-types`
      дополнен явной настройкой `scalars` (см. выше) — иначе кодоген тихо дал бы `any` вместо
      `unknown` на границе, которую бэк специально оставил непрозрачной.


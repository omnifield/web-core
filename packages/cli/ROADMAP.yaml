# Дорожная карта `@web-core/cli` — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана, не задним числом.
#
# Зона заведена architect'ом 2026-09-23, кода на этот момент нет ни строки: всё со статусом Open
# — ТЗ, а не отчёт. README.md/FAQ.md пишет владелец ПО ФАКТУ кода (дока от кода, не наоборот).

categories:
  - category: Что это за зона
    items:
      - id: engine-for-command-tools
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Движок командных инструментов: из чего строят тулзы, а не готовый релизный конвейер"
        description: |
          Решение user (2026-09-23). Предмет зоны — механика КОМАНДНОГО ИНСТРУМЕНТА: как объявить
          команду, как отдать результат человеку и машине, каким кодом завершиться, откуда взять
          настройки. На этом движке пишутся наши тулзы — выпуск, синк, генераторы, проверки, — и
          он же едет потребителю, которому нужно то же самое у себя.

          Чем зона НЕ является: релизным конвейером. Порядок шагов выпуска, ветки, теги, условие
          «когда публиковать» — это СЦЕНАРИЙ, он живёт снаружи (`.release/` в корне, см.
          `scenario-lives-outside`). Обёртки над `pnpm version`/`pnpm publish` сюда тоже не
          заводятся: шаги выпуска зовёт сценарий напрямую, а лишний фасад над ними добавил бы
          только место, где расходятся два описания одного и того же.

          Тот же принцип держит весь репозиторий: `@web-core/query` даёт транспорт, а документы
          пишет потребитель; `packages/skin` — средство, а не решение.

          Проверка на каждой правке: в пакете не должно быть ни одного знания о НАШЕЙ поставке —
          ни имени группы версий, ни адреса реестра, ни списка наших пакетов, ни имени ветки.
          Появилось — значит движок подменяется нашим сценарием.

      - id: why-it-belongs-to-packages
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Место — `packages/`: это публикуемая механика, а не оснастка одного репозитория"
        description: |
          Критерий включения каталога (`../README.md`) требует трёх признаков сразу: публикуемая
          поверхность, свой предмет, ноль знания о потребителе. Движок командных инструментов
          проходит по всем трём — его имеет смысл поставить в чужой проект ровно так же, как
          `@web-core/build`.

          История формулировки, чтобы её не открутили назад: первые две версии этого ТЗ (та же
          дата) описывали зону как «ручки нашего выпуска», а затем как «механики CI». Обе
          протаскивали внутрь публикуемого пакета наш сценарий и сводились к тонким обёрткам над
          pnpm — то есть к пакету, который почти ничего не даёт. Предмет уточнил user: «я думал
          ты говоришь про cli, что дать инструменты для команд».

      - id: real-consumers-first
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Потребители уже есть — движок пишется под них, а не в пустоту"
        description: |
          Сверено architect'ом по репозиторию 2026-09-23 (факт, не оценка):

          - своих бинарников два: `web-core-node` (`packages/build`) и `web-core-generate`
            (`packages/generators`). Второй разбирает аргументы вручную — `process.argv[2]`
            (`packages/generators/src/cli.ts`), без парсера вообще;
          - самописных скриптов не меньше шести: `scripts/sync-repo.sh`,
            `apps/studio/.mcp/scripts/push-to-prod.mjs`, `packages/lint/scripts/
            generate-biome-json.mjs`, `packages/style/scripts/build-css.mjs` и две проверки в
            `products/windshift/`;
          - `scripts/sync-repo.sh` — 177 строк bash, включая РУКОПИСНЫЙ разбор YAML на awk (три
            функции, чтобы прочитать четыре поля конфига).

          Каждый из них по-своему разбирает аргументы, по-своему печатает и по-разному (или никак)
          возвращает коды. Это и есть предмет: один способ вместо шести.

          Следствие для порядка работ: первым потребителем берётся ОДИН существующий скрипт и
          переписывается на движок целиком — форма проверяется живым переписыванием, а не
          проектируется вслепую. Какой именно — решает владелец; чужие зоны (`push-to-prod`,
          `windshift`) без их владельцев не трогать.

  - category: Механика
    items:
      - id: vendor-parser-not-our-own
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Разбор аргументов — проверенным вендором, свой парсер не пишем"
        description: |
          Правило user, общее для репозитория: своё не выдумываем, если на рынке есть проверенное.
          Иначе шесть самописных скриптов заменятся одним самописным фреймворком.

          Сверка architect'а 2026-09-23 (кандидаты и их состояние; выбор — за владельцем, но из
          этого списка и с обоснованием в `FAQ.md`):

          - **commander** — ~50 млн загрузок в неделю, без зависимостей, хорошая типизация; им
            живут Vue CLI, Create React App. Кандидат по умолчанию для простого набора команд;
          - **citty** (UnJS) — минимальный, TypeScript-first, выводит типы из объявления
            аргументов. Ближе по духу к нашим пакетам, но экосистема меньше;
          - **yargs** — тяжелее, зато сам генерирует помощь и валидацию, сильнее в подкомандах;
          - **oclif** (Salesforce) — полноценный фреймворк с плагинами и автообновлением;
            избыточен, пока тулзы не стали продуктом;
          - **clipanion** — движок командной строки Yarn Berry, но v4 висит в release candidate
            с сентября 2024 без движения. **Не брать**: замерший мажор в основании своей оснастки
            — это риск без выгоды.

          Дата сверки обязательна к обновлению при пересмотре: список меняется молча.

          ВЗЯТ **commander** (владелец, 2026-09-23). Своя сверка по `registry.npmjs.org` и
          `api.npmjs.org` в тот же день: commander 15.0.0 (2026-05-29), зависимостей 0, ~375 млн
          загрузок в неделю; yargs 18.2.0, зависимостей 6, ~195 млн; citty 0.2.2, зависимостей 0,
          ~22 млн. Решило первое: пакет уезжает потребителю, и шесть транзитивных зависимостей
          yargs стали бы его зависимостями. Citty отведён по той же причине, что clipanion в
          списке выше, — живёт в `0.x`, устоявшегося мажора нет. Цена commander 15: ESM-only и
          Node ≥ 22.12 (репозиторий на Node 24, все пакеты ESM — цена нулевая). Разбор —
          `FAQ.md`.

      - id: answer-contract
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Один конверт ответа: человеку читаемо, машине `--json`, код возврата осмысленный"
        description: |
          Сердце движка, от него зависит всё остальное. Сегодня каждый скрипт печатает по-своему,
          и пайплайну приходится разбирать человеческий текст.

          - `--json` — машиночитаемый ответ у любой команды, построенной на движке;
          - человеческий вывод остаётся рядом: тулзы зовут и руками;
          - коды возврата различают «сделано» · «делать нечего» · «отказ». Конкретные числа
            выбирает владелец и называет в README; важно, что «делать нечего» НЕ равно ошибке —
            иначе пайплайн без накопленных изменений будет падать на каждом прогоне;
          - ошибка печатается одинаково у всех тулз: что случилось и что делать дальше.

          СДЕЛАНО 2026-09-23. Конверт — `done` / `nothing` / `failed` (`summary` плюс `data` или
          `remedy`+`details`); команда его ВОЗВРАЩАЕТ, а печатает движок — отсюда и `--json`
          одинаково у всех, и отказ одним видом в stderr. Числа: сделано 0, делать нечего 0,
          отказ 1, неверное употребление 2; своё число задаётся полем `exitCodes` программы.
          Почему «делать нечего» по умолчанию ноль, а не отдельный код, — `FAQ.md`: ненулевой
          ронял бы пайплайн на каждом пустом прогоне, а различение и так лежит в конверте.
          Исключение внутри команды движок ловит сам и превращает в тот же конверт отказа.

      - id: config-and-env
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Настройки: аргумент → окружение → файл конфига, одним способом на все тулзы"
        description: |
          Второе, что сегодня каждый решает сам (и из-за чего в синке живёт awk-парсер YAML).
          Движок даёт один порядок разрешения настройки и один способ её объявить.

          Требование, которое делает это НЕ частным случаем нашего репозитория: тулза, написанная
          на движке, обязана работать в чужом клоне без правки кода — меняются только переменные
          (адрес реестра, токен, целевая ветка), а не механика. Значит ни одна настройка не имеет
          права быть зашитой.

          Разбор формата конфига — тоже вендором (движок не пишет свой парсер YAML/JSON), по тому
          же правилу, что и аргументы.

          СДЕЛАНО 2026-09-23. Настройка объявляется одним полем в `options` команды (`flags`,
          `env`, `config`, `default`, `required`, `choices`, `parse`) и разрешается слоями
          аргумент → окружение → файл → умолчание. Слои держат вендоры: аргумент и окружение —
          commander (`Option.env`, `getOptionValueSource`), файл — cosmiconfig (JSON/YAML/JS/TS,
          поиск по имени программы или явный `--config`). Своего в движке только порядок слоёв и
          проверка недостачи `required` — её пришлось забрать у вендора, иначе значение из файла
          не успевает доехать (разбор — `FAQ.md`). Выбор cosmiconfig вместо c12 обоснован там же:
          c12 на дату выбора отдаёт `latest` как `4.0.0-rc.2`.

      - id: delivery-probe-tool
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Проба поставки как тулза на этом движке — единственная механика со своим кодом"
        description: |
          Из всего, что обсуждалось для выпуска, только это не умеет ни pnpm, ни кто-либо другой:
          поставить опубликованный пакет в ЧИСТЫЙ проект вне репозитория и собрать его.

          Зачем: внутри монорепо пакеты соединены симлинками, поэтому `exports`, `files`, типы из
          `dist` и диапазоны зависимостей не проверяются вовсе (разбор — `../FAQ.md`). Класс
          ошибок, который проба обязана ловить, уже вскрывался живьём при зелёной сборке внутри:
          ручной диапазон на свой же пакет в `peerDependencies` и условие `exports`, ведущее в
          `src`, которых в тарболе нет.

          Имя пакета, версия и адрес реестра приходят ПАРАМЕТРОМ — тулза не знает ни нашего
          реестра, ни нашего списка пакетов.

          Приоритет ниже, чем у `answer-contract`/`config-and-env`: сперва движок, потом тулзы на
          нём. Если по ходу окажется, что проба тянет за собой знание о конкретной поставке, —
          это сигнал, что ей место в `.release/`, а не в пакете.

          СДЕЛАНО 2026-09-23, подпуть `@web-core/cli/probe`: голая функция `probeDelivery` и та же
          работа командой `probeCommand` (приём из `mcp-facade-postponed`). Шаги: чистый проект во
          временной папке → установка → импорт каждого подпути голым `node` → `tsc --noEmit` на тех
          же подпутях. Подпути берутся из `exports` УСТАНОВЛЕННОГО пакета, имя — из его манифеста,
          а не из аргумента: поэтому пробе можно скормить и `@scope/pkg@1.4.0`, и тарбол от
          `pnpm pack` — то есть проверить поставку ДО публикации.

          Чем подтверждено: тесты на настоящих тарболах (здоровый проходит; тарбол, где `exports`
          ведёт в файл вне `files`, валится на шаге `import` — ровно класс ошибок из ТЗ) и приёмка
          собственной поставки — `pnpm pack` своего пакета, затем своя же проба: оба подпути
          импортированы, типы зелёные.

          Бинарника пакет не даёт намеренно (разбор — `FAQ.md`): имя, справка и умолчания верны
          только для конкретного употребления, а их место — в сценарии.

  - category: Открытое после первого захода
    items:
      - id: join-fixed-version-group
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Пакет не вписан в `versioning.fixed` — выпадет из общей поставки"
        description: |
          Найдено владельцем 2026-09-23 при заведении пакета. `pnpm-workspace.yaml` перечисляет
          группу поставки ИМЕНАМИ (маска не срабатывает — проверено architect'ом прогоном
          `pnpm version -r --dry-run`), и `@web-core/cli` в списке нет. Пока строки нет, пакет
          молча не поднимается вместе с группой и разойдётся с ней по версии — ровно то, ради
          чего `fixed` и заведён.

          Правка вне зоны: корневой `pnpm-workspace.yaml` ведёт architect. Владелец назвал, но не
          трогал. Там же — строка в составе каталога (`../README.md`) и зона в
          `.claude/harness.yaml`, если её ещё нет.

          Версия пакета заведена как `0.3.0` — текущая версия группы; поднимать её при публикации
          architect'у не требуется сверх общего бампа.

          ЗАКРЫТО architect'ом: строка `'@web-core/cli'` стоит в `versioning.fixed`
          (`pnpm-workspace.yaml`), группа поставки — 19 пакетов, пакет уехал выпуском `0.4.0`
          вместе с остальными. Проверено владельцем по файлу 2026-09-23, правок с его стороны не
          требовалось.

      - id: first-consumer-rewrite
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Первый живой потребитель: переписать существующий скрипт на движок целиком"
        description: |
          Требование `real-consumers-first`: форма движка проверяется живым переписыванием, а не
          вслепую. За первый заход движок проверен собственной тулзой (проба поставки) и
          фикстурой, запускаемой настоящим процессом, — но ни один из шести самописных скриптов
          репозитория на него ещё не переехал.

          Упирается в границы зон, и это не отговорка, а факт раскладки: `scripts/sync-repo.sh`
          лежит в корне (architect), `packages/generators/src/cli.ts` — зона `generators`,
          остальные — `lint`, `style`, `studio/.mcp`, `windshift`. Владелец `cli` переписать их
          сам не может.

          Что нужно от architect'а: назвать скрипт и поднять его владельца задачей. Самый дешёвый
          кандидат — `packages/generators/src/cli.ts` (сегодня разбирает `process.argv[2]`
          руками), самый ценный — `scripts/sync-repo.sh` (177 строк bash с рукописным разбором
          YAML на awk; движок закрывает и разбор аргументов, и чтение конфига).

  - category: Найдено первым выпуском
    items:
      - id: probe-installs-peers
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Проба не ставит peer-зависимости — и называет отказом то, что отказом не является"
        description: |
          Найдено architect'ом на приёмке выпуска `0.4.0` (2026-09-23, 19 пакетов против живого
          реестра). Проба ставит только сам пакет, поэтому у пакетов, чей код тянет peer в
          рантайме, шаг `import` падает: `@web-core/store` — `Cannot find package 'xstate'`,
          `@web-core/skin` — `postcss`, `@web-core/assembly` и `@web-core/trace` — `solid-js`.

          Проверено фактом, а не по догадке: в `node_modules` проекта пробы `xstate` физически
          отсутствует, хотя `solid-js` там есть — он приехал транзитивно, как зависимость
          соседа, а не как peer.

          Почему это дефект пробы, а не пакетов — проверено по манифестам, не по общему
          рассуждению: у обоих peer помечены `peerDependenciesMeta.optional: true`, а у
          `@web-core/store` есть и прямое обоснование в `FAQ.md` («`./machine` не подмешан в
          корень: приложение, которому хватает `createStore`, эти пакеты не ставит вовсе»). То
          есть пакет честно объявляет контракт «берёшь этот подпуть — поставь его peer», и
          отказ импорта без него — исполнение контракта, а не поломка.

          Сейчас проба выдаёт это отказом и топит в шуме настоящие находки: на том же прогоне из
          12 «отказов» настоящим был ОДИН (`@web-core/mcp`, импорт директории в своём `dist`).

          Что решить владельцу: ставить peer'ы перед импортом (видны в манифесте установленного
          пакета) либо отдельный исход для «нужен optional peer». Важно не потерять третий
          случай: peer, объявленный ОБЯЗАТЕЛЬНЫМ, но не поставленный, — это уже настоящая
          находка, и она не должна попасть в ту же корзину.

          СДЕЛАНО 2026-09-23, взяты ОБА решения сразу. Проба ставит всё, что пакет объявил в
          `peerDependencies`, отдельным шагом `install-peers` (спеки берутся из манифеста
          установленного пакета; диапазон `workspace:` в поставке не разворачивается — такой peer
          ставится без диапазона). Третий случай не потерян: исход `peer-missing` несёт в
          `blocker.optional` пометку из `peerDependenciesMeta`, и приёмку он валит ровно тогда,
          когда peer объявлен обязательным. Шаг выключается флагом `--no-peers` — тогда тот же
          исход становится названным ограничением, а не отказом.

          Чем подтверждено: два теста на настоящих тарболах (один и тот же пакет с `optional`
          peer'ом даёт `peer-missing` при `peers: false` и доходит до импорта, когда peer ставится)
          и живой прогон против реестра — `@web-core/store@0.4.0`, все 7 подпутей `ok`, `xstate` и
          `@xstate/solid` встали шагом `install-peers`; `@web-core/skin@0.4.0` — 9 подпутей `ok`.

      - id: probe-skips-non-js-entries
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Проба импортирует подпути, которые модулями не являются (`.css`, `.json`)"
        description: |
          Тот же прогон. `@web-core/style` падает на `./base.css`
          (`ERR_UNKNOWN_FILE_EXTENSION`), `@web-core/build` — на `./tsconfig`
          (`ERR_IMPORT_ATTRIBUTE_MISSING`: JSON нужно импортировать с атрибутом типа).
          `@web-core/lint` — там же, на своём `./biome.json`.

          Оба подпути объявлены в `exports` законно: пакет отдаёт файл, а не модуль. Проба же
          берёт список подпутей из поставки и импортирует КАЖДЫЙ как ESM-модуль.

          Что решить: как проверять не-JS подпуть — существованием файла, чтением, импортом с
          правильным атрибутом. Важно не «пропустить и молчать»: подпуть, ведущий в никуда, —
          ровно тот дефект поставки, ради которого проба и заведена.

          СДЕЛАНО 2026-09-23. Порядок проверки разделён на три шага вместо одного импорта:
          резолюция подпути (`import.meta.resolve`) → существование файла на диске → и только
          потом загрузка, по расширению. `.json` импортируется с атрибутом типа, модульные
          расширения — обычным импортом, остальное (`.css` и любой другой файл) остаётся
          проверенным существованием, и способ виден в отчёте полем `checkedBy`.

          «Пропустить и молчать» не случилось именно потому, что существование проверяется ДО
          загрузки и для ЛЮБОГО расширения: снято фактом, что `import.meta.resolve()` отдаёт адрес,
          но файла не проверяет (прогон на Node 24 в тот же день). Подпуть, ведущий в никуда, —
          `delivery-broken`, даже если это `.css`.

          Чем подтверждено: тест на тарболе с `.css`, `.json` и заявленным, но не вложенным
          `.css`-подпутём (первые два `ok`, третий — единственный в `broken`), и живой прогон:
          `@web-core/style@0.4.0` — 4 подпути `ok` (`./base.css` проверен файлом),
          `@web-core/build@0.4.0` — 5 `ok` (оба `tsconfig` импортированы как JSON).

      - id: probe-browser-packages
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "Браузерный пакет нельзя проверять голым `node import`"
        description: |
          Тот же прогон: `@web-core/ui`, `@web-core/router`, `@web-core/chat` падают на
          `Client-only API called on the server side` — Solid честно отказывает при импорте
          клиентского кода в Node. Поставка при этом может быть исправной: её потребитель —
          бандлер, а не `node`.

          Что решить: как проверять такие пакеты — сборкой бандлером в чистом проекте, импортом
          под DOM-окружением, или явным исходом «проверено насколько возможно» с названной
          причиной. Тихо пропускать нельзя: тогда у целого класса пакетов приёмки не будет вовсе.

          Отдельно в том же ряду: `@web-core/feeder` падает на ЧУЖОМ пакете
          (`@atlaskit/pragmatic-drag-and-drop`, `ERR_UNSUPPORTED_DIR_IMPORT`). Это не наш дефект,
          но отчёт должен отличать «сломан наш пакет» от «сломана его зависимость» — иначе
          владелец идёт чинить не туда.

          СДЕЛАНО 2026-09-23, выбран третий вариант из названных: явный исход с причиной. Ни
          бандлер, ни DOM-окружение проба не поднимает — вместо этого различает, ЧТО именно
          отказало. На резолюцию и загрузку Node отвечает своими кодами
          (`ERR_MODULE_NOT_FOUND`, `ERR_UNSUPPORTED_DIR_IMPORT`, `ERR_UNKNOWN_FILE_EXTENSION`…),
          и это разговор про поставку; ошибка без такого кода брошена уже кодом пакета — исход
          `node-refused`, приёмку он не валит, но остаётся в отчёте с текстом причины и в списке
          `limited`. Подпуть при этом не остаётся непроверенным вовсе: резолюция, файл и типы
          (`tsc --noEmit`) по нему проходят штатно.

          Чужая поломка разведена отдельным исходом `foreign-broken`: виновник берётся из того, в
          чьём файле произошёл отказ (`blocker.culprit`), а кто его импортировал — рядом
          (`blocker.importedBy`).

          Чем подтверждено: два теста на тарболах (пакет, бросающий «Client-only API…» → приёмка
          зелёная с `node-refused`; пакет, импортирующий директорию внутри своего peer'а →
          `foreign-broken` с чужим `culprit`) и живой прогон: `@web-core/ui@0.4.0` — 3 подпути
          `ok`, 2 `node-refused`, приёмка зелёная; `@web-core/feeder@0.3.0` — `foreign-broken` на
          `@atlaskit/pragmatic-drag-and-drop`, своим `dist` он не назван.

      - id: probe-reports-shape
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Отчёт приёмки должен отделять находки от ограничений инструмента"
        description: |
          Следствие трёх пунктов выше, записанное отдельно, потому что это про контракт ответа, а
          не про конкретную починку. На выпуске `0.4.0` проба ответила «поставка не прошла
          приёмку: 12 из 19», и разбирать, что из этого правда, пришлось человеку вручную:
          настоящим дефектом был ОДИН (`@web-core/mcp` — импорт директории в собственном `dist`),
          остальные одиннадцать — не поставленный peer, не-JS подпуть, браузерный пакет и чужой
          вендор.

          Отчёт в таком виде хуже, чем бесполезен: пайплайн на нём либо всегда красный (и его
          перестают читать), либо его отключают.

          Что нужно: исход и структура отчёта, из которых видно без человека — «сломана наша
          поставка» / «нужен peer» / «проверить этим способом нельзя» / «сломана чужая
          зависимость».

          СДЕЛАНО 2026-09-23, этот пункт закрывался первым: три починки выше легли уже в него.
          Единица отчёта — подпуть, а не шаг: у каждого свой исход (`delivery-broken` ·
          `dependency-undeclared` · `foreign-broken` · `peer-missing` · `node-refused` · `ok`),
          способ проверки (`checkedBy`) и, если не `ok`, причина с виновником (`blocker`). Рядом
          два готовых списка — `broken` (из-за чего приёмка красная) и `limited` (что проверено не
          до конца). Те же мерки уехали потребителю функциями `isBlocking`/`isLimited`: пайплайн
          считает красноту тем же способом, что и проба, а не пересказом её текста.

          Отдельная находка по ходу, стоившая правки механики: подпути импортировались ОДНИМ
          скриптом, поэтому первый же отказ ронял его целиком и о состоянии остальных не
          сообщалось вовсе. Теперь проверка идёт по одному подпуту и печатает запись сразу —
          оборвался процесс, видно, на каком месте встали.

          Новый исход `dependency-undeclared` в ТЗ не назывался, но следует из того же различения:
          недостающий пакет, которого нет НИ в `dependencies`, ни в `peerDependencies`, — дефект
          поставки, а не нехватка peer'а.

          Чем подтверждено: восемь тестов пробы на настоящих тарболах (по одному на каждый исход)
          и прогон против живого реестра, повторяющий приёмку `0.4.0`: `store` · `style` · `build`
          · `skin` зелёные, `ui` — зелёный с двумя `node-refused`, `feeder` — `foreign-broken`,
          а `@web-core/mcp` остался единственным `delivery-broken` (импорт директории в
          собственном `dist`) — ровно та единственная настоящая находка, которую человек на
          приёмке выбирал руками из двенадцати «отказов».

  - category: Границы
    items:
      - id: scenario-lives-outside
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сценарий выпуска — снаружи, в `.release/`; ветки, теги и релизы не здесь"
        description: |
          Решение user (2026-09-23): отсюда правки уезжают синком в отдельную ветку рабочего
          репозитория, там их принимают мержем, там же делают теги и релизы.

          Наш выпуск — сценарий, собранный из тулз на этом движке, и живёт он рабочей папкой
          `.release/` в корне репозитория. Там знание о нашей поставке (что пакеты держатся одной
          версией, что приложения в выпуске не участвуют, в каком порядке идут шаги), здесь —
          только механика.

          Сценарий не меняется от репозитория: те же скрипты уезжают синком и работают в рабочем
          репозитории; различаются ПЕРЕМЕННЫЕ, а не код. Девопс берёт готовое из `.release/`, а
          нужно сверх — строит у себя на том же движке, не правя наши скрипты.

          Совпадает со штатным поведением инструмента: `pnpm version` в рекурсивном режиме
          коммитов и тегов не делает никогда (сказано в его справке) — отказ от них не костыль, а
          то, как механика устроена.

      - id: mcp-facade-postponed
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "MCP-фасад отложен: пайплайн его не вызывает"
        description: |
          Отложено решением user (2026-09-23). CI дёргает команду и читает stdout с кодом
          возврата; MCP — протокол для агента, и поднимать сервер, которого некому звать, значило
          бы завести службу ради красоты.

          Что из этого следует сейчас: команда описывается ДАННЫМИ (имя, аргументы, что делает),
          а исполнение отделено от печати — тогда `toolDefinition()`-фасад надевается позже без
          переписывания. Приём отработан в `packages/skin` (`./tools`: та же операция голой
          функцией и тулом). Сам подпуть этим заходом не заводится.

      - id: out-of-scope
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Обёртки над pnpm, синк и чужие скрипты — не эта зона"
        description: |
          Названо явно, чтобы объём не расползся:

          - **обёртки над `pnpm version`/`pnpm publish`** — не заводятся: их зовёт сценарий
            напрямую. ПОПРАВКА к первой редакции этого пункта (architect, 2026-09-23): там было
            сказано, что pnpm отдаёт машиночитаемо И план, И сводку публикации. Сводку —
            да (`publish -r --report-summary` пишет файл). План — НЕТ: флаг `--json` у
            `pnpm version` объявлен в справке, но на вывод плана не действует ни в каком порядке
            флагов (проверено прогоном на pnpm 11.17.0). Первая проверка смотрела справку, а не
            вывод — цена этой небрежности: разбор текста регуляркой в `.release/src/plan.ts`;
          - **сам сценарий выпуска** — `.release/` в корне (architect);
          - **синк в рабочий репозиторий** — `scripts/sync-repo.sh` и `sync-targets.yaml`
            (architect). Переписать его на движок можно и нужно, но это отдельный заход и не
            условие закрытия этой зоны;
          - **скрипты чужих зон** (`push-to-prod`, `windshift`, `lint`, `style`) — их владельцев;
            переезд на движок каждый делает сам, когда движок появится.

log:
  - id: engine-written-and-proved-by-its-own-tool
    type: plan
    date: 2026-09-23
    summary: >
      Зона получила код за один заход: конверт ответа с кодами возврата, объявление команды
      данными, слои настройки и проба поставки. Вендоры выбраны своей сверкой того же дня —
      commander (0 зависимостей, устоявшийся мажор) и cosmiconfig (c12 отдаёт `latest` как RC).

      Две вещи всплыли только на сборке и стоят того, чтобы помнить. Первая: `tsc`-эмит для этой
      зоны не годится — импорты без расширения (правило репозитория) дают `dist`, который голый
      `node` не грузит вовсе; перешли на штатный `defineLibraryConfig` из `@web-core/build`, и
      `dist` стал импортируемым. Та же поломка видна снаружи у `@web-core/mcp` (`dist/index.js`
      падает с `ERR_UNSUPPORTED_DIR_IMPORT`) — это чужая зона, владельцу отдано уведомлением, здесь
      не чинилось. Вторая: тулзу проверяет только настоящий процесс — тест с `execFile` на
      фикстуре поймал бы любую ошибку в кодах возврата, которую функция-обёртка показывает
      зелёной.

      Приёмка сделана собственным инструментом: `pnpm pack` своего пакета → своя же проба →
      установка в чистый проект, импорт обоих подпутей, `tsc --noEmit`. Заодно подтвердилось, что
      `publishConfig.exports` снимает условие `development` и типы у потребителя идут из `dist`,
      а не в `src`.

  - id: subject-settled-on-command-tooling
    type: plan
    date: 2026-09-23
    summary: >
      Зона трижды меняла формулировку за один день, и это стоит помнить. Первая версия — «ручки
      нашего выпуска» (наш сценарий внутри публикуемого пакета). Вторая — «механики CI»
      (сценарий вынесен, но предмет свёлся к тонким обёрткам над pnpm, то есть пакет почти
      ничего не давал). Третья, принятая: движок КОМАНДНЫХ ИНСТРУМЕНТОВ — из чего строят тулзы.

      Что развернуло формулировку: вопрос user «что даёт тогда вообще этот пакет?» плюс факты по
      репозиторию — шесть самописных скриптов, ручной `process.argv[2]` в живом CLI генераторов и
      177 строк bash с awk-парсером YAML в синке. Предмет нашёлся там, где реальная боль, а не
      там, где красивое имя.

      Правило по вендору зафиксировано отдельным пунктом (`vendor-parser-not-our-own`) со сверкой
      рынка и датой: commander/citty как кандидаты, clipanion отведён — мажор висит в release
      candidate с сентября 2024.

  - id: report-first-then-the-three-fixes
    type: plan
    date: 2026-09-23
    summary: >
      Четыре находки приёмки `0.4.0` чинились в одном заходе, и порядок оказался важнее самих
      починок: первым закрывался контракт отчёта, а peer'ы, не-JS подпути и браузерные пакеты
      легли уже в него. Обратный порядок означал бы три правки, которые потом пришлось бы
      переукладывать под общую форму.

      Что развернуло механику: до этого захода все подпути импортировались одним скриптом, и
      единицей отчёта был ШАГ. Пока это так, никакое различение исходов не помогает — первый
      отказ скрывает остальные. Единицей стал подпуть, и только после этого «сломана поставка»,
      «нужен peer», «проверить нельзя» и «сломан чужой пакет» стало куда записывать.

      Решения оперты на снятые в тот же день факты Node 24, а не на память: `import.meta.resolve()`
      адрес отдаёт, а существование файла не проверяет (отсюда проверка `.css` файлом без риска
      пропустить дефект); на резолюцию и загрузку Node отвечает своим кодом ошибки, а код пакета —
      без него (отсюда машинное различение «поставка сломана» и «в node не исполняется»).

      Рынок сверен тогда же: publint и `@arethetypeswrong/cli` проверяют форму пакета, установку и
      запуск — нет; зависимость не бралась, разбор в `FAQ.md`.

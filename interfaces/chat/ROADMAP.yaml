# Дорожная карта @web-core/chat — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же, что
# у interfaces/feeder, web-core/io, web-core/store (categories → items, log — журнал решений); без
# milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Фундамент
    items:
      - id: chat-package-scaffold
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/chat` — скелет пакета по образцу `interfaces/feeder`"
        description: |
          Означает: `package.json` (`@web-core/chat`, `vite build`, `solid-js` peer, без доменных
          зависимостей — назначение не определено), `tsconfig.json`, `eslint.config.js` (пресет
          `@web-core/lint`), `vite.config.ts` (`defineLibraryConfig`, один вход `index`,
          `solid: true`) — build/typecheck/lint прогнаны, все зелёные. `interfaces/*` в
          `pnpm-workspace.yaml` уже покрывал новый пакет, отдельная правка не понадобилась.

      - id: chat-placeholder-wired
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`ChatPlaceholder` подключён в `apps/skin/src/pages/lab`"
        description: |
          Означает: `apps/skin` получил зависимость `@web-core/chat: workspace:*`, dev-страница
          `pages/lab` рендерит `ChatPlaceholder` рядом с `FeederPlaceholder`/`Tree` — тем же
          приёмом, что фидер.

      - id: chat-zone-registered
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Зона `chat` в `.claude/harness.yaml`"
        description: |
          Означает: `paths: [interfaces/chat]` зарегистрирован, owner-сессию заводит user —
          назначение пакета разбирается с ним напрямую, не через architect.

  - category: Направление (решено architect/user — код впереди)
    items:
      - id: chat-core-agnostic-decision
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Ядро не привязано к тому, кто по ту сторону — агент это фича, не архитектурная развилка"
        description: |
          Означает: TanStack AI (и `@web-core/neurobox` поверх него) заточен под пару юзер↔нейронка
          и несёт механики (тулз-коллы, стриминг), которые к нейронке НЕ привязаны в самом
          протоколе. Neurobox отвечает за нейронку (рантайм, AG-UI, расход) — chat отвечает за то,
          чтобы работать ПРОСТО КАК ЧАТ: юзер↔агент и юзер↔юзер рендерятся одним и тем же ядром,
          поведение чата от собеседника не зависит. Тулз-колл — фича поверх ядра (в теории её мог
          бы позвать и другой юзер, не только агент), видео/вложения — тоже фичи, по умолчанию не
          нужны большинству рабочих чатов. Решение: `neurobox` — один из будущих АДАПТЕРОВ ядра
          (переводит свой AG-UI словарь — `TEXT_MESSAGE_CHUNK`/`TOOL_CALL_*` — в нейтральные parts
          ядра), а не источник модели сообщения. Ядро не знает слов AG-UI.

          Дословно от user: «тэнстак ориентирован на общения юзера и нейронки, при этом он дает
          мехи, который не привязаны конкретно к нейронки. за нейронки отвечает нейробокс, а на
          твоей стороне я хочу чат который будет уметь работать просто как чат в первую очередь.
          общается юзер с агентом или другим юзером, на само поведение чата вообще никак не
          влияет... вызов тулза через чат это не его основная задача, а фича... если мы говорим
          именно про чат с агентом, это как бы фича уже поверх основного чата».

      - id: chat-consumer-owned-history
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "История — на стороне потребителя, чат не хранит: только механика + строго типизированный ИО"
        description: |
          Означает: чат не владеет состоянием беседы (участники+сообщения) — тем же приёмом, что
          `interfaces/feeder`'s `Tree` (схема/значение снаружи, движок ничего не хранит сам).
          Потребитель сам решает, где живёт история (бэк, сессия в `@web-core/store`, IndexedDB —
          что угодно), чат отдаёт и принимает данные через строго типизированный ИО-контракт, не
          диктует хранилище. Совпадение с `feeder` не случайное — общий принцип слоя
          `interfaces/`: движок не владеет состоянием, потребитель кормит и получает (см. также
          `core-io-contract` ниже).

          Следствие: адаптерная идея из `chat-core-agnostic-decision` работает симметрично в обе
          стороны — `neurobox` переводит свой AG-UI словарь в нейтральные `parts` чата (уже
          решено), а будущий адаптер хранилища потребителя переводит чат ↔ своё хранилище тем же
          манером, ничего не зная про `neurobox` и наоборот.

          Решение user (2026-09-14, обсуждение с architect): «предлагаю историю передавать
          потребителю. чат дает мехи для хранения и взаимодействия, но сами данные идут от
          потребителя... чат дает ИО, а мы уже подстраиваем то что нам нужно под него... хранить
          на стороне потребителя, но кормить строго типизированно».

      - id: chat-core-before-features
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Порядок: сначала ядро без единой фичи, фичи — отдельными заходами поверх"
        description: |
          Означает: этот заход и ближайшие — только `core-participant-model`/`core-message-model`/
          `core-parts-extension-point`/`core-composer`/`core-stream-render`/`core-scroll-anchor`
          ниже. Ни тулз-коллы, ни агентский адаптер `neurobox`, ни вложения/видео в этот объём НЕ
          входят — вопрос закрыт явно (user, 2026-09-14): «идем по очереди, сначала доводим ядро,
          что бы фичи класть не на хорошую базу». Точка расширения (open parts registry)
          закладывается, но пустой — первая фича (вероятно, агентский адаптер `neurobox`)
          проверит её собой отдельной задачей.

  - category: Ядро (готово)
    items:
      - id: core-participant-model
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Нейтральная модель участника (participant)"
        description: |
          Означает: `src/entities/conversation/model.ts`, `Participant { id, name }` — identity
          собеседника чата без понятия «агент»/«человек» на уровне типов ядра. Различие агент/
          человек, если вообще где-то нужно (например, для статуса «печатает»), не ветвит
          поведение ядра — это ответственность будущих фич/адаптеров, не ядра.

      - id: core-message-model
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Модель сообщения: message = parts[], в ядре только `text`"
        description: |
          Означает: `src/entities/conversation/model.ts` — `Part { type: string }` (открытая база,
          не литерал, иначе фиче некуда расширяться без правки файла), `TextPart extends Part` —
          единственная закрытая часть ядра, `Message<TPart extends Part = TextPart>` — контейнер
          `parts: readonly TPart[]`, не строка. `tool-call`/`attachment`/`video-embed`/реакции и
          т.п. — НЕ типы ядра, их вносят фичи через точку расширения (`core-parts-extension-point`,
          реализована следующим заходом тем же днём — `registerPart`/`rendererOf`/`PartView`).

      - id: core-parts-extension-point
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Открытая точка регистрации новых типов parts — заложена, не заполнена"
        description: |
          Означает: `src/entities/conversation/part-registry.ts` — `registerPart(type, renderer)`/
          `rendererOf(type)` поверх `Map<string, PartRenderer<Part>>` (типостёрто до `Part`,
          безопасно по факту: ищут всегда по тому же `type`, которым зарегистрировали, — тот же
          приём, что словарь загрузчиков иконок в `web-core/ui`). `src/widgets/message/
          part-view.tsx` — `PartView`, диспетчер по `part.type` через `Show`+`Dynamic`
          (`solid-js/web`), незарегистрированный тип рендерится в `null`, не падает. Обе части
          публично реэкспортированы (`registerPart`/`rendererOf`/`PartView`/`PartRenderer` из
          `src/index.ts`). Ядро само НИЧЕГО не регистрирует — `text` тоже не зарегистрирован,
          рендер текста заводит `core-stream-render` следующим заходом (буферизация токенов —
          его предмет, не этой задачи). `build`/`typecheck`/`lint` зелёные.

      - id: core-composer
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Композер: многострочный ввод, стоп вместо сабмита во время стрима"
        description: |
          Означает: `src/widgets/composer/index.tsx` — `Composer({ onSend, isStreaming?,
          onStop? })` поверх кит-компонентов `Field`/`FieldTextarea`/`Button` (`@web-core/ui`, не
          голого HTML — см. «Правка» ниже), авто-рост высоты (`scrollHeight` на каждый `input`);
          Enter отправляет, Shift+Enter — перенос строки, во время стрима Enter не шлёт (не
          мешает набирать следующее), но и не отменяет — отмена только явным кликом по кнопке,
          которая меняет назначение на «стоп». `isStreaming`/`onStop` — НЕ про агента: «кто-то
          сейчас льёт ответ» — факт, который знает только потребитель (адаптер), сам композер не
          знает источника; без них (человек↔человек без стрима) кнопка всегда «отправить», как у
          обычного чата. `onSend` отдаёт `TextPart[]` — форма один в один с `ChatIO.onSend`,
          композер можно завести прямо на него. `build`/`typecheck`/`lint` зелёные, код
          подтверждён в обоих `dist`.

          Правка 2026-09-14 (после живого теста user — визуала не было вообще): изначально
          композер был голым `<textarea>`/`<button>`, которые в принципе не могут надеть наряд —
          не кит-компоненты. Заменены на `Field`/`FieldTextarea`/`Button` — визуал в этом репо
          приходит НЕ ручным CSS, а нарядом поверх кит-компонентов (`apps/skin/src/app/index.tsx`:
          «цвет приходит со скином — или не приходит вовсе, и тогда кит голый»). Теперь композер
          наследует тот же наряд, что и весь остальной скин, автоматически, без отдельного
          рецепта под chat. `Transcript` уже был на кит-примитиве (`scroll-area`) с самого начала
          и правки не потребовал.

      - id: core-stream-render
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Безопасный рендер текста по мере поступления (token-by-token)"
        description: |
          Означает: `src/widgets/message/buffered-text.ts` — `useBufferedText(source)`, RAF-
          буферизация (источник может обновляться чаще раза за кадр, DOM пишем не чаще раза в
          кадр — рыночная база 2026 года, см. ROADMAP-лог `chat-market-research`). `src/widgets/
          message/text-part.tsx` — сам рендер `text`-части (`<span>` с `white-space: pre-wrap` —
          иначе переносы строк обычного текста схлопнутся) поверх буфера, плюс
          `registerTextPart()`, регистрирующая его через `core-parts-extension-point` — text НЕ
          хардкожен в `PartView`, идёт той же точкой расширения, что будущие фичи.

          Технический нюанс (см. лог `core-stream-render-built`): при `"sideEffects": false`
          пакета (как у ВСЕХ пакетов репозитория) esbuild может выкинуть модуль с побочным
          эффектом целиком, если ни один его экспорт не используется, — bare-import ради эффекта
          из отдельного файла (`text-part.tsx`) так и произошло, `dist` не содержал регистрацию.
          Чинить исключением из `sideEffects` (единственный такой пакет в репо) не стали —
          `registerTextPart()` вызывается на уровне модуля `part-view.tsx`, чей единственный
          экспорт (`PartView`) реально используется, значит модуль целиком остаётся в сборке.
          Проверено НЕ только отсутствием варнинга — `grep` по факту собранных `dist/index.js` и
          `dist/index.jsx` на упоминание `registerTextPart`/`TextPartView`. `build`/`typecheck`/
          `lint` зелёные.

      - id: core-scroll-anchor
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Скролл: stick-to-bottom через anchor + IntersectionObserver"
        description: |
          Означает: `src/widgets/transcript/index.tsx` — `Transcript({ messages })`, первый
          виджет, реально собирающий сообщение → `parts` → `PartView` (первый потребитель
          `core-parts-extension-point`/`core-stream-render` в сборке, не в изоляции). Построен на
          `@web-core/ui` `scroll-area` (новая зависимость пакета — `package.json`), не
          переизобретён. `IntersectionObserver` на 1px-sentinel в конце `ScrollAreaContent`,
          `root: viewport` (не окно браузера — свой `overflow: auto`); пока читатель внизу — новое
          сообщение прокручивает список сама, ушёл читать историю — не дёргаем, кнопка «новые
          сообщения ↓» вместо автоскролла. `build`/`typecheck`/`lint` зелёные, проверено grep'ом
          по факту собранных `dist/index.js`/`dist/index.jsx` (после урока `core-stream-render`
          про `sideEffects`, хотя здесь риска не было — `Transcript` экспортируется напрямую, не
          через bare side-effect импорт).

          Известное упрощение, не чинили сейчас: `<For>` у Solid ключует по РЕФЕРЕНЦИИ элемента —
          если потребитель заменяет `messages` иммутабельно новым массивом на каждый чанк стрима
          (типичный паттерн у `feeder`'а тоже), DOM всех сообщений может пересобираться заново, не
          только последнего. Не блокер для текущего объёма, но при появлении реального адаптера с
          высокочастотным стримом (`neurobox-agent-adapter`) может понадобиться `<Index>` или
          стабильные ссылки на неизменные сообщения — тогда и смотреть.

      - id: core-io-contract
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "ИО-контракт целиком — не только форма сообщения, вход/выход всего состояния беседы"
        description: |
          Означает: `src/entities/conversation/io.ts` — `ChatIO<TPart>`: вход `conversation:
          Conversation<TPart>` (участники+сообщения, целиком, каждый рендер — тем же приёмом, что
          `value` у `Tree` фидера) + `viewerId` (кто из participants — локальный зритель, нужен
          любому чату вне зависимости от того, кто на том конце); выход — только `onSend(parts)`.
          Сознательно НЕ `onChange` целого `Conversation` — чат не собирает `Message` сам
          (id/createdAt/попадание в историю решает потребитель), отдаёт только то, что реально
          сочинил локальный участник. Публичный экспорт — `src/index.ts`. README «IO» обновлён
          (был «пока нет»). Ни одна фича / виджет пока не потребляет контракт — это следующий
          заход (`core-composer`/рендер списка), тип уже зафиксирован и проверен `build`/
          `typecheck`/`lint`.

  - category: Назначение (частично решено)
    items:
      - id: chat-purpose
        type: decision
        status: In Progress
        priority: High
        milestone: null
        name: "Что chat сводит и какой UI даёт"
        description: |
          Архитектурное направление решено (`chat-core-agnostic-decision`): ядро нейтрально к
          собеседнику, агентность/тулзы/вложения — фичи поверх, `neurobox` — будущий адаптер, не
          источник модели. Хранение тоже решено (`chat-consumer-owned-history`): история — на
          стороне потребителя, чат отдаёт только механику и типизированный ИО. Открыто
          по-прежнему: полный список фич первого релиза, транспорт для плеча юзер↔юзер (в
          репозитории пока нет ни вебсокета, ни GraphQL-подписки — проверено чтением
          `web-core/query`), и когда/как заходит фича «агентский адаптер `neurobox`». Разбор
          продолжает owner с user. Первый кейс использования chat — с агентом
          (`neurobox-agent-adapter`, готов).

      - id: neurobox-agent-adapter
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Фича «агентский адаптер @web-core/neurobox» — первый потребитель ядра"
        description: |
          Означает: `src/features/neurobox/` — новый подпуть поставки `@web-core/chat/neurobox`
          (отдельная запись в `vite.config.ts`/`package.json`, НЕ часть корневого `.`), чтобы
          agnostic-ядро физически, не только на словах, не тянуло `@web-core/neurobox`/TanStack AI
          в бандл потребителя, который фичу не импортирует — проверено: `grep neurobox
          dist/index.js dist/index.d.ts` даёт ноль совпадений.

          - `parts.tsx` — три новых типа part'а через `core-parts-extension-point`
            (`ThinkingPart`/`ToolCallPart`/`ToolResultPart`, поля из вендорских `ToolCallState`/
            `ToolResultState`), с рендерами; `registerNeuroboxParts()` регистрирует все три ОДНОЙ
            функцией, ядро не правится. `text` — переиспользован тип ядра, не задублирован.
          - `map-message.ts` — `mapNeuroboxMessage(UIMessage, viewerId)`: TanStack `UIMessage`
            (`role: 'system'|'user'|'assistant'`, `parts` со своим словарём — `content`, не `text`
            у текстовой части) → `Message<NeuroboxPart>` ядра. `role: 'system'` фильтруется целиком
            (не для показа), `'user'`→`viewerId` параметра, `'assistant'`→фиксированный
            `AGENT_PARTICIPANT_ID`. Незнакомые типы part'а (картинка/аудио/видео/структурный вывод)
            молча отбрасываются — тот же приём, что `toWireContent` в `web-core/neurobox` на
            исходящей стороне (бокс текстовый, `NEUROBOX_CLIENT.md`).
          - `use-neurobox-chat.ts` — `useNeuroboxChat({ connection, threadId, viewerId, ... })`:
            обёртка над `useChat` (`@web-core/neurobox/solid`), отдаёт `conversation`/`isStreaming`
            (`chat.isLoading`)/`onSend` (собирает `TextPart[]` в строку, зовёт `chat.sendMessage`)/
            `onStop` (`chat.stop`) — форма готова подключаться прямо в `Transcript`/`Composer`.
            Создание `connection`/токенов — забота потребителя (`createNeuroboxConnection` из
            `@web-core/neurobox`), фича его не создаёт, только принимает готовым.

          Известный факт от бокса, подтверждающий решение `chat-consumer-owned-history`: **бокс
          переписку не хранит и не ждёт её целиком** (`NEUROBOX_CLIENT.md`, «Кто помнит разговор») —
          Claude Code помнит сам, `useChat` внутри `@web-core/neurobox/solid` держит историю ЭТОГО
          прогона в памяти сама; адаптер её только читает и переводит форму, ничего не добавляет.
          Хранилище на стороне chat (если понадобится показ после перезагрузки) — отдельная забота
          потребителя, не этой фичи; обязательное условие — стабильный `threadId`, передаётся
          явным параметром `useNeuroboxChat`, не генерируется внутри.

          `build`/`typecheck`/`lint` зелёные. Известный БЕЗОБИДНЫЙ варнинг при `build` (не ошибка,
          exit code 0): `rollup-plugin-dts` внутри `buildDeclarationFiles`
          (`web-core/build/src/vite/library.ts`) заводит СВОЙ `rollup()` без резолвера/`external`
          — когда публичный тип пакета ссылается на тип ДРУГОГО workspace-пакета (здесь —
          `ConnectConnectionAdapter`/`ToolCallState`/`ToolResultState` из `@web-core/neurobox`),
          эта конкретная сборка `.d.ts` не может его резолвнуть и падает в стандартный фолбэк
          Rollup «could not be resolved — treating as external» — САМ РЕЗУЛЬТАТ при этом верный
          (проверено чтением `dist/neurobox.d.ts`: тип корректно остаётся внешним импортом, не
          инлайнится). Гап общего `web-core/build`, не моей зоны — чинить у себя не стал
          (`escalate-dont-hack-workarounds`), назвать architect.


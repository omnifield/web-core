# Дорожная карта @web-core/feeder — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/io, packages/store, packages/assembly, packages/router (categories → items,
# log — журнал решений); без milestones — у пакета нет освоенной поставки с датами релиза, только
# сделанное и открытое.

categories:
  - category: Фундамент слоя interfaces
    items:
      - id: workspace-registered
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/*` в `pnpm-workspace.yaml`"
        description: |
          Означает: новый корень воркспейса зарегистрирован рядом с `packages/*`/`products/*`/
          `apps/*` — pnpm видит пакеты внутри `interfaces/` без вложенного воркспейса (pnpm
          вложенные не поддерживает, см. комментарий в файле).

      - id: feeder-package-scaffold
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/feeder` — скелет пакета по образцу `packages/form`"
        description: |
          Означает: `package.json` (`@web-core/feeder`, `vite build`, `solid-js` peer,
          `@web-core/generators`+`@web-core/io` dependencies), `tsconfig.json`, `eslint.config.js`
          (пресет `@web-core/lint`), `vite.config.ts` (`defineLibraryConfig`, один вход `index`,
          `solid: true`) — build/typecheck/lint прогнаны, все зелёные.

      - id: feeder-placeholder-wired
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`FeederPlaceholder` подключён в `apps/skin/src/pages/lab`"
        description: |
          Означает: `apps/skin` получил зависимость `@web-core/feeder: workspace:*`, пустая
          dev-страница `pages/lab` (`return ""` раньше) рендерит плейсхолдер. Проверено живым
          dev-сервером Vite (`curl` по `@fs`-резолву `interfaces/feeder/src/index.ts` и по
          скомпилированному `pages/lab/index.tsx` — цепочка резолвится и транспилируется без
          ошибок); визуальная проверка в Chrome не сделана — профиль браузера MCP занят другой
          параллельной сессией, убивать чужой процесс не стали.

  - category: Архитектура пакета
    items:
      - id: fsd-layers-adapted
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптированный FSD: entities/features/widgets не в бизнес-смысле, без app/pages"
        description: |
          Означает: `entities` — структурная модель движка (узел дерева, правило маппинга), не
          бизнес-сущность; `features` — фичи интерфейса (отредактировать значение, выбрать цель
          маппинга), не бизнес-операция; `widgets` — сборка entities+features в UI мода. `app`/
          `pages` не заведены — пакет не приложение с роутингом, вход наружу — экспорты (мод =
          export). Разметка под мод 1: `entities/tree` (`lib/binding.ts`+`lib/use-tree.ts`),
          `features/edit-value` (`ui/kit/*`), `widgets/tree` (`ui/tree/*`) — перенос из
          `apps/skin/entities/feeder`. Разбор — FAQ.md.

  - category: Режимы наполнения
    items:
      - id: mode-typed-tree
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 1 — зод-схема → дерево с ручным редактированием"
        description: |
          Означает: перенос `apps/skin/entities/feeder` (`ui/tree`, `ui/kit`, `lib/binding`,
          `lib/use-tree`) в `interfaces/feeder` под разметку `entities/tree`/`features/edit-value`/
          `widgets/tree`, оторванный от `componentStore.use(kit).io.schema` — `Tree` полностью
          контролируемый (`schema`/`value`/`onChange` пропами), сам ничего не хранит. Принят user,
          подключён живым потребителем (`apps/skin/src/pages/index.tsx`), проверен вручную в
          браузере (правка скаляра, add/remove элемента списка).

      - id: mode-typed-tree-tests
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Тесты мода 1 — entities/tree (логика) + widgets/tree (реальный DOM-рендер)"
        description: |
          Означает: vitest+jsdom. `entities/tree` — `itemBinding`/`useTree` чистой логикой (8
          тестов, `createRoot`, реальная схема через `fieldsOf`). `widgets/tree` — `Tree`
          смонтирован по-настоящему через `solid-js/web` (не мок): скаляр пишет по пути, «Добавить»
          дописывает пустой элемент, у каждого айтема своя кнопка «Убрать» (3 теста). Потребовалось
          `test.server.deps.inline` в `vitest.config.ts` — Ark-UI/Zag/Kobalte внутри `@web-core/ui`
          отдают сырой `.jsx`, vitest иначе грузит их напрямую через Node и падает. Разбор — FAQ.md.

      - id: mode-openapi-recognize
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 2 — entities/openapi: распознавание свагера 2.0 + zod-схема на ручку"
        description: |
          Означает: свой `MappingTemplate` (механизм `@web-core/generators/mapping`, тот же
          `run(raw, templates)`) под Swagger 2.0 — жёсткое совпадение (`isEntry` смотрит на
          `swagger: "2.0"`), самодостаточный (не переиспользует apps/skin-шный
          `entities/openapi/model/import/swagger2.ts`, тот завязан на свои `Endpoint`/`HttpMethod`
          и не строит схему тела). На каждую операцию — `method`/`url`/`tag` + `z.ZodType` из её
          `parameters`/тела (JSON Schema → zod, тот же класс работы, что `@web-core/generators/
          fields`, но на вход другой формат). Тесты — реальный (урезанный) petstore-документ, 8
          шт, включая вложенные `$ref` (Pet→Category/Tag) и защиту от циклов через `z.lazy`.

      - id: mode-openapi-invoke
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 2 — features/invoke-endpoint: реальный HTTP-вызов"
        description: |
          Означает: `rawRestRequest` из `@web-core/query/rest` (новая dependency пакета) —
          выполнить ручку с собранными параметрами, вернуть `{ status, ok, headers, body }`.
          Path-плейсхолдеры (`{petId}`) подставляются по имени ключа `value`, остальное — query
          (массивы — повторяющимися парами), `body` — JSON. Решение user: сеть — на стороне
          feeder, не потребителя (в отличие от apps/skin-шного `model/endpoint/call.ts`, который
          остаётся отдельным, не трогается). Тесты — мок `fetch`, 5 шт.

      - id: mode-openapi-widget
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 2 — widgets/openapi: два вида, OpenapiEditor + OpenapiList"
        description: |
          Означает: по находке user поверх исходного плана — не один виджет, а два под разные
          экраны. `OpenapiEditor` — полный: список ручек из распознанного документа, конфигурация
          параметров каждой переиспользует `Node`/`Leaf` из `widgets/tree` (локальный `binding` на
          карточку, не наружу на каждую правку). `OpenapiList` — компактный: принимает уже
          настроенные `{ endpoint, value }[]`, никакого UI полей, только «Вызвать» на каждую.
          Публичный `onChange` у обоих — `OpenapiInvocation` (`{ endpoint, value, response }`,
          `value` добавлен по итогам ревью user — без него `OpenapiList` нечем было бы кормить),
          стреляет на сам вызов, не на правку поля. Тесты — реальный DOM-рендер (`solid-js/web`),
          6 шт (3+3).

      - id: mode-mapping-entities
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 4 — entities/mapping: describeVariant + applyMapping поверх @web-core/io"
        description: |
          Означает: `describeVariant(unknown)` — распознаёт по `instanceof z.ZodType`, зовёт
          `describeSchema` или `describeSample` из `@web-core/io`, обе отдают одну форму
          (`PathType[]`). `applyMapping(source, rules)` — тонкая обёртка над `applyFieldRules`
          (не `collectFieldRuleReport` — один инстанс, не пачка строк), источник не объект
          считается пустым, не падает. Вся механика — в `io`, отсюда только типизация «двух
          вариантов». Тесты — 6 шт.

      - id: mode-mapping-widget
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 4 — widgets/mapping: Mapping + FieldPicker"
        description: |
          Означает: `Mapping(a, b, onChange)` — на каждый путь варианта Б (`describeVariant(b)`)
          свой `FieldPicker` (нативный `<select>` из путей А — Ark-UI `Select` не открывается в
          jsdom, разбор — FAQ.md). Живой, как мод 1 (`onChange` на каждый пик, не по кнопке) —
          несёт `{ rules: FieldRule[], result: MappingResult }`, `rules` для переиспользования на
          новых данных той же формы (сохранение — на стороне потребителя, бэк, по словам user),
          `result.row` — уже применённое сведение. v1 — только 1:1 (путь→путь), без UI под
          `steps`/`onFail`. Тесты — реальный DOM-рендер, 5 шт.

      - id: mode-openapi-manual-descriptor
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 2 — entities/openapi: EndpointDescriptor (схема A) + descriptorToEndpoint"
        description: |
          Означает: второй способ получить `OpenapiEndpoint[]` — не распознаванием чужого
          документа (swagger2Template), а вручную заполненными дескрипторами. `EndpointDescriptor`
          (`method`/`url`/`params: EndpointParam[]`, `EndpointParam` — `name`/`type: "string"|
          "number"|"boolean"`/`required`) — своя, урезанная схема A по сравнению со
          `Swagger2Parameter`: без `in` (query/path определяется тем же приёмом, что уже применяет
          `invokeEndpoint` — по совпадению имени с `{плейсхолдером}` url), без `enum`/вложенных
          объектов/`headers` (`invokeEndpoint` их сегодня не поддерживает — заводить под них
          дескриптор значило бы строить мёртвую функциональность, отложено явной просьбой user
          «пока базовых настроек хватит»). `endpointDescriptorSchema`+`manualGroupSchema` (обёртка
          `{ endpoints }` — `Tree` рендерит только объектный корень) — те же zod-схемы, что рисует
          `Tree`. `descriptorToEndpoint` — адаптер в `OpenapiEndpoint`, тем же приёмом, что
          `scalarParamToZod` у свагера, дальше по пайплайну (карточка, вызов) разницы в
          происхождении уже нет. Тесты — 7 шт (`test/entities/openapi/descriptor.test.ts`).

      - id: mode-openapi-groups
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мод 2 — widgets/openapi: OpenapiEditor группами (схема read-only / юзер редактируемая)"
        description: |
          Означает: `OpenapiEditor` больше не принимает один `raw: string` — принимает
          `groups: OpenapiGroup[]` (`SchemaGroup { raw }` | `ManualGroup { endpoints:
          EndpointDescriptor[] }`, у обеих `id`+`name` от юзера) + `onGroupsChange`. Группы НЕ
          сливаются в общий список ручек — рендерятся отдельными секциями, каждая подписана; у
          юзера может быть сколько угодно бэков со свагером и сколько угодно без него, находка
          user поверх исходного плана (обсуждение, см. FAQ.md). Группа-схема — read-only состав
          (`SchemaGroupView`, бывшее тело всего `OpenapiEditor` до групп, вынесено как есть):
          «обновить» значит заменить `raw` целиком снаружи, не редактировать ручку поштучно.
          Группа-юзер (`ManualGroupEditor`) — `Tree` (мод 1) поверх `manualGroupSchema` для
          структуры (add/remove/edit ручки и параметра — готовая механика списков мода 1, ничего
          нового не изобреталось) плюс `EndpointCard` на каждый дескриптор (та же карточка
          конфигурации значений+вызова, что у группы-схемы — мод 2 не знает, откуда взялся
          `OpenapiEndpoint`). Добавление/удаление самой группы — тоже внутри `OpenapiEditor`
          (имя+выбор вида+кнопка), не отдельная забота потребителя, тем же приёмом, что и списки
          мода 1. Тесты — 11 шт (`test/widgets/openapi/editor.test.tsx`, было 3). Живого браузера
          не было — vitest+jsdom, тот же precedent, что и у первой версии мода 2.

      - id: mode-file-upload
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Мод 3 — загрузка файла"
        description: |
          Означает: интерфейс инпут-загрузчика; структура содержимого файла неизвестна заранее.
          Объём сузился после мода 4 — сам UI сведения уже есть (`Mapping`), моду 3 остаётся
          только «файл → сэмпл» и передать результат в готовый `Mapping` как вариант А, не
          изобретать сведение заново.

      - id: mapping-ui
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "UI сведения «корм → потребитель» поверх `@web-core/io`"
        description: |
          Означает: экран сопоставления путей — `describeSample`/`describeSchema` (плоский список
          путей+типов чужих данных и целевой схемы) и `FieldRule[]`+`applyFieldRules`/
          `collectFieldRuleReport` (движок «куда что положить» с отчётом) уже существуют в
          `packages/io`, headless. Материализовалось как мод 4 (`Mapping`, `mode-mapping-widget`)
          — не «только для мода 3», как думали раньше (уточнение 2026-09-14), а отдельный
          универсальный мод, не привязанный к происхождению данных (уточнение 2026-09-15, находка
          user — мод 2 без способа скормить результат потребителю был бесполезен).

  - category: Привязка ручки к компоненту (пересборка 2026-09-18)
    items:
      - id: rebuild-context
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Пересборка пакета: прежние публичные виджеты сняты, каркас собирается заново"
        description: |
          Означает: `OpenapiEditor`/`OpenapiList`/`Mapping a,b`/`Tree`-как-экспорт снесены user до
          начала этой работы («там был бардак, теперь переписываем»); доки и `test/` на момент
          старта описывали уже несуществующий код. Уцелело и переиспользуется: распознавание
          Swagger 2.0 (`swagger2Template`), схема A (`EndpointDescriptor`+`descriptorToEndpoint`),
          примитивы вызова (`resolveUrl`/`appendQuery`/`toResult`), движок дерева (переехал в
          `entities/form`, наружу — `TreeForm`). Новый скоуп задан user: «настроил апи → привязал
          ручку к компоненту → на другой странице дёрнул привязанное», стык привязки и есть
          адаптер.

      - id: binding-is-adapter
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Привязка и адаптер — одна запись `Binding`, не две сущности"
        description: |
          Означает: `Binding { source: {apiId, endpointId, value?}, root, rules, extra? }` — «что
          дёрнуть», «где в ответе записи» (L3 `@web-core/io`), «как одна запись ложится на вход
          потребителя» (L2, `FieldRule[]`). `rules: []` — законное состояние «привязано, но не
          сведено» (`isFed`), а не поломка. Второй реестр «адаптеров» потребовал бы синхронизации
          с первым, рассинхрон давал бы молча пустой компонент. Привязка — чистый JSON (на ручку
          ссылается строкой), поэтому сохраняется потребителем и поднимается `hydrate`.

      - id: keys-chosen-by-reader
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Ключи семей: каталог — по `apiId`, привязки — по имени компонента"
        description: |
          Означает: `apiCatalogOf(apiId)` и `bindingStoreOf(component)` на
          `createActionStoreFamily` (`@web-core/store`), приём взят у `componentManagerStoreOf`
          в `apps/studio`. Ключ привязок выбран стороной, которая ЧИТАЕТ: на витрине компонент
          знает только себя. Это же доказывает, почему адаптер не может жить на ручке — одна
          ручка кормит и таблицу, и листбокс, а правила у них разные. Айди ручки —
          `endpointKey` = `метод + url`: привязка обязана пережить перезалив документа, а
          перераспознавание даёт новый массив объектов.

      - id: api-catalog
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`entities/openapi`: каталог ручек одного бэка (`apiCatalogOf`)"
        description: |
          Означает: `{ raw?, endpoints, status, error }`, действия `loadSchema` (через
          `run(raw,[swagger2Template])`), `addEndpoint(descriptor)`, `removeEndpoint(id)`.
          Загрузка прикрыта гардом от гонки (ответ устаревшей загрузки выбрасывается по сверке
          `raw`), нераспознанный документ — статус `failed` с текстом, не исключение. Сначала
          стор лежал в `features/api-manager` (калька со студии) — опущен в `entities` решением
          user 2026-09-18: набор ручек одного бэка это структура, и читать её нужно и экрану
          настройки, и витрине, а фиче нельзя импортировать другую фичу. Тесты — 5.

      - id: api-manager-provider
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`features/api-manager`: провайдер текущего API и `ApiList`"
        description: |
          Означает: `ApiManagerProvider api={id}` + `useApiId`/`useApiCatalog` — интерфейсный
          вопрос «с каким API работаем», без владения структурой. Документ пропом НЕ засевается
          (в отличие от студийного `ComponentManagerProvider`, где состояние выводится из самого
          ключа): здесь юзер приносит документ после монтирования, засев был бы одноразовым.
          `ApiList` рендерит состав и его состояния, а что монтируется на строку — функция-ребёнок
          от того, кто собирает экран. Тесты — 4.

      - id: binding-entity
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`entities/binding`: тип, стор и применение привязки"
        description: |
          Означает: `bindingKey`/`isFed`, `bindingStoreOf(component)` (`bind`/`unbind`/`setRoot`/
          `setRules`/`setExtra`/`hydrate`), `applyBinding(response, binding)` поверх
          `collectRowsReport`/`collectFieldRuleReport` из `@web-core/io`. Своего кода — только
          развилка «набор записей или одна запись» (`GET /users` отдаёт массив, `GET /user/{id}`
          объект, оба законная еда, а `collectRowsReport` ждёт именно массив) и именные отказы
          вместо молчаливых нуля записей. Повторный `bind` той же ручки = смена параметров
          вызова, сведённые правила не сносятся. Тесты — 13.

      - id: invoke-endpoint-rebuilt
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`features/invoke-endpoint`: один вызов настроенной ручки"
        description: |
          Означает: `invokeEndpoint(endpoint, value)` поверх `rawRestRequest`
          (`@web-core/query/rest`) и уцелевших примитивов `resolveUrl`/`appendQuery`/`toResult`.
          Не-2xx — валидный `InvokeResult` (инструмент постмановского рода показывает 404/500 со
          статусом и телом), сорванный транспорт — исключение (ответа не было вовсе, притворяться
          нельзя). Тесты — 5, на моке `fetch`.

      - id: feed-widget
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`widgets/feed`: витрина — `useFeed`/`feedOf`/`feedBindingOf`"
        description: |
          Означает: сборка «взять ручку из каталога → вызвать → применить привязку». Слой
          `widgets`, потому что это сборка entities и фичи вызова, а фича не имеет права звать
          другую фичу. Исход ВСЕГДА один `RowsResult` — успех, «ручки нет в каталоге», 500,
          оборванная сеть; исключение наружу не выходит. Привязки нет — ресурс не стреляет, в
          сеть не ходим. Берётся первая СВЕДЁННАЯ привязка, иначе первая вообще — чтобы
          недоделанная объяснила себя, а не притворилась отсутствием еды. Тесты — 8, включая
          сквозной (каталог → привязка → мок `fetch` → записи в форме компонента).

      - id: mapping-ui-rebuilt
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`entities/mapping` + `widgets/mapping`: UI сведения с новым контрактом"
        description: |
          Означает: `isSchema`/`describeVariant`/`rowSetsOf`/`recordPathsOf` (тонкая обёртка над
          `@web-core/io`) и `Mapping { source, target, root?, rules?, onChange }` — вместо
          снесённого `a`/`b`. Пути показываются ЗАПИСИ, а не ответа (правила применяются к
          записи). Смена «где записи» уносит правила, чей `from` больше не существует: иначе на
          витрине это выглядело бы как беда данных, хотя это беда настройки. `target` — проп, а
          не io-схема, вытянутая внутри движка: сведение обязано работать и для потребителя не из
          кита. Нативный `<select>` (`FieldSelect`) — Ark-UI `Select` не открывается в jsdom.
          Тесты — 7 (entities) + 5 (DOM).

      - id: binding-screen
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`widgets/binding`: экран настройки целиком + публичный API пакета"
        description: |
          Означает: `BindEndpoint` (параметры через `TreeForm` → «Проверить» живым вызовом →
          выбор потребителя → `Mapping`, пишущий `setRoot`/`setRules`) и `BindingEditor`
          (провайдер + список + карточка, `raw` грузится эффектом, потребители пропом). Сведение
          возможно только ПОСЛЕ настоящего вызова: схемы ответа у движка нет (Swagger 2.0 здесь
          разбирается на параметры), и экран говорит это прямо. `src/index.ts` выставил наружу
          весь путь: `BindingEditor`/`BindEndpoint`, `Mapping`, `useFeed`/`feedOf`,
          `ApiManagerProvider`/`ApiList`, `TreeForm`, `invokeEndpoint`, сторы и типы. Тесты — 4
          DOM, включая сквозной «Проверить → свести → правило в сторе привязок».

      - id: dead-tests-left
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "8 тест-файлов от снесённого кода — починить пути или снести"
        description: |
          Означает: `test/` пережил снос хуже кода. Пять файлов покрывают ЖИВОЙ код, который
          переехал (`entities/tree/*` → `entities/form/lib`, `openapi/{descriptor,swagger2}` →
          `models/`, `widgets/tree` → `entities/form/ui/tree`) — чинятся правкой импортов и
          возвращают покрытие. Три мертвы по-настоящему (`widgets/openapi/{editor,list}`,
          `entities/mapping/apply`) — сносить. Текущий `vitest run` даёт 51 зелёный тест и 8
          красных файлов на импортах.

      - id: store-parametrized-selectors
        type: decision
        status: Backlog
        priority: Low
        milestone: null
        name: "Параметризованные селекторы `@web-core/store` не проходят свою же типизацию"
        description: |
          Означает: `SelectorsShape<T>` (`(state, ...args: never[]) => unknown`) не принимает
          `(state, id: string)`, а при трёх явных аргументах типа перегрузка
          `createActionStoreFamily` уводит селекторы в параметр ключа `K`; рантайм их
          поддерживает (`fn.length > 1`), `dist/*.d.ts` пакета вдобавок отстал от `src`. Чужая
          зона — находка отдана наверх. В feeder временно обычные функции над состоянием
          (`endpointBy`, `bindingBy`); вернуть в стор, когда починят.

      - id: live-browser-check
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Живая проверка цикла в браузере (`apps/studio`)"
        description: |
          Означает: текущая сборка проверена только vitest+jsdom (включая сквозной DOM-тест
          экрана). Живьём не гонялась: подключить `BindingEditor`+`useFeed` на страницу
          `apps/studio/src/pages/lab`, свести поля руками и увидеть, как витрина обновляется —
          см. `EXAMPLES.md`, кейс 12.

  - category: Адаптер как пресет (ревизия 2026-09-18)
    items:
      - id: adapter-is-the-entity
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сущность — адаптер, не привязка; `entities/binding` → `entities/adapter`"
        description: |
          Означает: пересматривает `binding-is-adapter`. «Привязка» — глагол, действие, а действия
          живут в `features`; вещь, которая реально хранится и переиспользуется, — адаптер.
          Побочно освобождает слово: в `entities/form` `binding` уже занят привязкой инпута к полю
          формы (`FieldBinding`/`itemBinding`). Переименование сделано целиком:
          `Binding`→`Adapter`, `applyBinding`→`applyAdapter`, `bindingStoreOf`→`adapterStoreOf`,
          `bindingBy`→`adapterBy`, `BindingsState`→`AdaptersState`, `BindingSource`→`FeedSource`,
          `bindingKey`→`sourceKey`; `test/entities/binding`→`test/entities/adapter`. Снаружи
          `interfaces/feeder` за эти имена не держался никто (проверено grep по `apps`/`backend`/
          `products`) — поставка не ломается. Решение user 2026-09-18.

      - id: adapter-is-a-preset
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптер — переиспользуемый пресет N:M, роль — перемапить данные и только"
        description: |
          Означает: адаптер сохраняется на `backend/presets` наравне с прочими пресетами и живёт
          самостоятельно — у одного адаптера много поставщиков (20 бэков, отдающих нужную
          структуру) и много потребителей (3 компонента на одной структуре данных). Отсюда состав
          адаптера — только форма: `root` (где записи), `rules` (как поле ложится), `extra` (что с
          лишними). `source` («какую ручку дёрнуть, с какими параметрами») из него уходит — это не
          форма. Имени компонента внутри адаптера тоже нет: правила целятся в СТРУКТУРУ входа, а
          потребитель лишь объявляет, что такую структуру ест.

          Прежнее возражение («формы не сверить — схемы ответа Swagger 2.0 не даёт») снято user:
          подсунули не тот адаптер — он просто не перемапит. Это безопасно ровно потому, что
          `applyAdapter` отдаёт `FieldRuleReport` (`converted`/`rejected`/`unmapped`), то есть
          промах адаптера ГРОМКИЙ, а не тихий. Отсюда требование к UI: отчёт обязан быть на
          экране — иначе «не перемапилось» выглядит как молча пустой компонент. Решение user
          2026-09-18.

      - id: feed-link-is-thin
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Привязка — тонкая ссылка «потребитель ↔ ручка ↔ адаптер», своей механики нет"
        description: |
          Означает: привязка нужна прежде всего интерфейсу — чтобы юзер видел, с кем адаптер
          работает; на саму перекладку она не влияет. Но и косметикой она не является: витрина
          рисуется заново, компонент называет только себя, и кто-то обязан помнить, какой ручкой и
          каким адаптером его кормить — иначе после перезагрузки страницы пусто. Значит запись
          сохраняется, но состоит из трёх ссылок и ничего не делает сама. Уточнение user
          2026-09-18 поверх моего предложения держать адаптер внутри связки.

      - id: adapter-split-not-done
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Разделить `Adapter` и привязку по решениям выше — НЕ СДЕЛАНО"
        description: |
          Означает: на сегодня переименован только слой имён. Фактический состав `Adapter` всё ещё
          несёт `source`, стор всё ещё ключуется `sourceKey` (apiId+endpointId), то есть адаптер
          по-прежнему прибит к одной ручке и пресетом быть не может. Отложено сознательно, решение
          user 2026-09-18: сначала довести ручки (настроить → дёрнуть → увидеть ответ), потому что
          адаптер строится по ЖИВОМУ ответу и без работающих ручек его не на чем проверить.

          Что предстоит: у адаптера появляется своя личность (id + имя от юзера, `sourceKey`
          умирает); `source` переезжает в отдельную запись привязки; хранение адаптера — через
          `backend/presets`; отчёт `applyAdapter` выводится в UI.

      - id: adapter-report-visible
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Отчёт `applyAdapter` обязан быть на экране"
        description: |
          Означает: переиспользование адаптера безопасно ровно потому, что промах ГРОМКИЙ —
          `FieldRuleReport` (`converted`/`rejected`/`unmapped`) плюс именные отказы `applyAdapter`
          (нет пути `root`, по пути скаляр, правил нет). Спрячем отчёт — «не перемапилось» станет
          неотличимо от пустого компонента, и вся безопасность схемы N:M пропадёт. Поэтому это не
          украшение UI, а условие принятого решения `adapter-is-a-preset`.

  - category: Схема как сущность (2026-09-18)
    items:
      - id: schema-is-an-entity
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Загруженный документ — своя сущность, а не поле `raw` каталога ручек"
        description: |
          Означает: сегодня `ApiCatalogState.raw` держит сырой документ рядом с распознанными
          ручками, то есть документ принадлежит каталогу конкретного бэка. Но сам он ни про какой
          бэк не знает — его принёс юзер, и каталогов по одному документу может быть много.
          Заводится `entities/schema`: то, что юзер загрузил и хочет хранить.
          `ExternalSchemaLoader` при этом остаётся загрузчиком, ни к какому API не привязанным —
          его дело донести документ. Решение user 2026-09-18.

      - id: schema-stores-raw-text
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Хранится сырой текст документа, не разобранные ручки"
        description: |
          Означает: распознавание идёт шаблоном (`@web-core/generators/mapping`), и шаблоны будут
          добавляться — сегодня Swagger 2.0, завтра OpenAPI 3. Разобранные ручки на бэке остались
          бы разобранными по-старому, и отличить это от правильного результата было бы нечем. Из
          сырого текста состав пересобирается в любой момент, обратно — никогда. Предложение
          owner, принято user 2026-09-18.

      - id: schema-entity-local
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "`entities/schema` — локальная часть: состав записи, стор, чем опознаётся"
        description: |
          Означает: наша часть работы, до всякого бэка — тип записи (сырой текст + чем схема
          опознаётся, имя от юзера по образцу адаптера), семья сторов, перенос `raw` из
          `ApiCatalogState` (каталог начинает получать документ, а не владеть им), тесты. Порядок
          задан user 2026-09-18: сначала стабилизируем локально, потом заявка — иначе контракт
          придётся переписывать уже согласованным.

      - id: presets-kind-request
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Заявка в `backend/presets`: новые виды пресета — схема и адаптер"
        description: |
          Означает: обе записи (схема и адаптер) едут на бэк пресетов наравне с прочими пресетами.
          `backend/presets` — ЧУЖАЯ зона со своим реестром видов (`internal/kinds`, Go-структура на
          границе GraphQL), поэтому это не правка на месте, а заявка владельцу через architect.
          Подаётся ПОСЛЕ того, как состав обеих записей устоится локально (`schema-entity-local`,
          `adapter-split-not-done`). Открытым остаётся объём: сваггеры бывают на мегабайты — надо
          спросить у владельца зоны про ограничения на размер `state`.

      - id: readme-after-rebuild
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Переписать README, когда каркас встанет обратно"
        description: |
          Означает: разделы README (Анатомия/Использование/Настройки/IO/Сборки) описывают снятый
          API — `BindingEditor`, `BindEndpoint`, `ApiList`, `useFeed`, `Mapping`. Статусный блок в
          «Главном» это говорит прямо, но сами разделы не переписаны: переписывать их сейчас
          значило бы сочинять доку под ещё не собранный код, а канон репозитория требует обратного
          порядка (дока — от кода). Переписать одним заходом, когда виджеты вернутся.

  - category: Документация
    items:
      - id: readme-faq-roadmap-first-draft
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "README/FAQ/ROADMAP — первый черновик по шаблону «движок»"
        description: |
          Означает: шаблон взят по образцу `packages/store` (первый пилот genus `engine`) —
          Анатомия/Использование заполнены тем, что реально есть (плейсхолдер); Настройки/
          Состояния/IO/Сборки/Рецепт — честно помечены пустыми, функциональности под них пока нет
          (правило «дока — от кода, не наоборот»). FAQ.md держит решения слоя `interfaces`
          (группа/genus/почему openapi не сливается физически) и разбор, какие кирпичи `io`/
          `generators` уже закрывают режимы 2/3.

      - id: docs-rewritten-after-rebuild
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "README/FAQ/EXAMPLES переписаны под фактический код после пересборки"
        description: |
          Означает: доки описывали снесённый API (`OpenapiEditor`/`OpenapiList`/`Mapping a,b`/
          `Tree` как экспорт) — переписаны от кода. README: анатомия по слоям, контракты, точный
          состав тестов (51 зелёный + 8 красных файлов от снесённого, названы явно). FAQ: шапка
          отделяет историческую часть от актуальной, добавлен раздел «Привязка компонента к ручке»
          — 12 решений пересборки (почему привязка и адаптер одна запись, почему ключ по имени
          компонента, почему айди ручки метод+url, почему каталог в entities, почему feed —
          виджет, почему не-2xx по-разному у вызова и у кормления, почему сведение требует
          пробного вызова, почему селекторы стора временно функции). EXAMPLES: 12 кейсов от
          словаря до отладочной таблицы «на витрине пусто — где смотреть», весь код сверен с
          экспортами пакета.

      - id: examples-md
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "EXAMPLES.md — рабочий копипаст-код под все реализованные моды"
        description: |
          Означает: по образцу `interfaces/chat/EXAMPLES.md` (сосед по слою) — не канон, а
          готовый к запуску код. Дерево без бэкенда, дерево со списком, `OpenapiEditor` с реальным
          вызовом (jsonplaceholder, публичный fake-REST — «Отправить» реально стучится в сеть),
          `OpenapiList`, полный флоу редактор→сохранить→витрина, `Mapping` на ответе мода 2.
          README.md урезан до пары базовых сниппетов со ссылкой сюда.

log:
  - id: binding-and-adapter-built
    type: plan
    date: 2026-09-18
    summary: >
      Шесть итераций подряд по ТЗ user, каждая принята по ходу: (1) каркас `features/api-manager`
      и семья сторов по `apiId` + `endpointKey`; (2) `entities/binding` — привязка как единая
      запись вместе с адаптером; (3) восстановленный `features/invoke-endpoint`; (4) перенос
      каталога ручек в `entities/openapi` и `widgets/feed` (`useFeed`) — цикл замкнулся сквозным
      тестом; (5) `entities/mapping` + `widgets/mapping` — UI сведения; (6) `widgets/binding` —
      экран целиком и публичный API пакета.

      Ключевое решение, заданное вопросом user «есть идеи как красиво обыграть»: стык привязки И
      ЕСТЬ адаптер — одна запись `Binding` вместо «ссылка на ручку» + отдельный реестр правил.
      Отсюда всё остальное: ключ привязок по имени компонента (читатель на витрине знает только
      себя; одна ручка кормит несколько компонентов разными правилами), айди ручки метод+url
      (переживает перезалив документа), привязка как чистый JSON (сохраняется потребителем).

      Развилка по слоям вынесена user'у отдельно и решена им в пользу «более правильного»
      варианта: каталог ручек опущен из фичи в `entities/openapi`, в `features/api-manager`
      осталось интерфейсное. `feedOf` при этом всё равно виджет — сборка фичи вызова и сущностей.

      Итог: 51 зелёный тест, `build`/`lint` чистые, пакет выставляет наружу весь путь
      «настроить → привязать → свести → дёрнуть на витрине». Живого браузера не было. Доки
      (README/FAQ/EXAMPLES) переписаны под фактический код в том же заходе — старые описывали
      снесённый API.

  - id: mode-openapi-groups-done
    type: plan
    date: 2026-09-17
    summary: >
      Обсуждение с user, доведённое до кода в одном заходе: кейс — часть бэков юзера отдаёт
      сваггер 2.0, часть вообще без него, ручки нужно заводить вручную. Первая гипотеза (мод 2
      напрямую читает наш собственный «формат» через ещё один `MappingTemplate` рядом со
      swagger2Template) отброшена по ходу разбора — `run(raw, templates)` выбирает ОДИН подошедший
      шаблон, не объединяет, а сваггер-ручки и ручные должны сосуществовать РЯДОМ, не сливаясь в
      кучу (юзеру важно подписывать, что откуда).

      Решение: `OpenapiEditor` работает не с одним `raw`, а со списком ГРУПП (`OpenapiGroup` —
      `SchemaGroup`|`ManualGroup`, у каждой имя от юзера). Группа-схема — read-only, тот же
      `swagger2Template`, что и раньше, «обновить» = заменить `raw` целиком. Группа-юзер —
      полностью редактируемая: ручки внутри заводятся как схема A (`EndpointDescriptor` —
      `method`/`url`/`params[]`), а схема A рендерится и редактируется той же `Tree` (мод 1), что
      уже умеет add/remove/edit по зод-схеме — находка user в разговоре («мод 1 рисует форму по
      схеме, схема для мода 2 — тоже просто данные, зачем что-то новое изобретать»). Уточнение по
      ходу: `Tree` не СТРОИТ zod-тип, он редактирует данные ПО готовой схеме — поэтому реально два
      разных zod-объекта на разных уровнях (схема A самого дескриптора, известная заранее и
      статичная — редактируется `Tree`; итоговая схема ОДНОЙ ручки, `z.ZodType`, строится из
      заполненного дескриптора адаптером `descriptorToEndpoint`, тем же приёмом, что и парсинг
      свагера). `headers`/`enum`/вложенные объекты в дескриптор не заведены — `invokeEndpoint` их

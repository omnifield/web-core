      способом эмуляции клика/pointer/клавиатуры — `FieldPicker` переписан на нативный `<select>`
      (`FieldSelect` из `@web-core/ui`), надёжнее и уместнее для плоского списка путей.

      41 тест на пакет, build/typecheck/lint зелёные. Объём мода 3 сузился — сможет переиспользовать

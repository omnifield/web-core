# Дорожная карта @web-core/feeder — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/io, packages/store, packages/assembly, packages/router (categories → items,
# log — журнал решений); без milestones — у пакета нет освоенной поставки с датами релиза, только
# сделанное и открытое.
#
# Записи про снесённый код здесь НЕ хранятся — даже ради истории. Пакет пережил пересборку, и
# журнал, описывающий несуществующие виджеты, читается как описание живого кода и врёт.

categories:
  - category: Фундамент слоя interfaces
    items:
      - id: workspace-registered
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/*` в `pnpm-workspace.yaml`"
        description: |
          Означает: корень воркспейса зарегистрирован рядом с `packages/*`/`products/*`/`apps/*` —
          pnpm видит пакеты внутри `interfaces/` без вложенного воркспейса (вложенные pnpm не
          поддерживает, см. комментарий в файле).

      - id: feeder-package-scaffold
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/feeder` — скелет пакета"
        description: |
          Означает: `package.json` (`@web-core/feeder`, `vite build`, `solid-js` peer),
          `tsconfig.json`, `eslint.config.js` (пресет `@web-core/lint`), `vite.config.ts`
          (`defineLibraryConfig`, один вход `index`, `solid: true`), `vitest.config.ts`.

      - id: fsd-layers-adapted
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптированный FSD: entities/features/widgets не в бизнес-смысле, без app/pages"
        description: |
          Означает: `entities` — структурная модель движка (склад пресетов, документ API, дерево
          формы, адаптер), не бизнес-сущность; `features` — фичи интерфейса (загрузить документ,
          показать каталог, дёрнуть ручку), не бизнес-операция; `widgets` — сборка entities и
          features в готовый экран. `app`/`pages` не заведены: пакет не приложение с роутингом,
          вход наружу — экспорты, не маршруты. Разбор — FAQ.md.

  - category: Модель API
    items:
      - id: swagger2-recognized
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Распознавание Swagger 2.0 в наш формат документа"
        description: |
          Означает: `swagger2Template` — свой `MappingTemplate` на механизме
          `@web-core/generators/mapping`, совпадение жёсткое (`isEntry` смотрит на `swagger: "2.0"`).
          `parseSchema(raw)` прогоняет документ через список шаблонов; не подошёл ни один —
          исключение с перечислением, что пробовали. Тесты — урезанный настоящий petstore,
          включая вложенные `$ref` и защиту от циклов через `z.lazy`.

      - id: our-endpoint-format
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Наш формат ручки — данные, не зод"
        description: |
          Означает: `SchemaDocument { endpoints, groups, defs }`, ручка —
          `{ id, method, url, groupId?, params: [{ name, in, required, schema }] }`, где `schema`
          параметра — JSON Schema, а `defs` держит общие типы документа (`$ref` остаются
          ссылками, циклы не разворачиваются). Плоский `{имя, тип, обязателен}` отвергнут: он
          беднее того, что мы уже читаем из свагера (тело-объект, енумы, массивы, вложенность),
          и терял бы это прямо на импорте.

          Зод строится из формата при отрисовке (`endpointOf`/`schemaNodeToZod`) и нигде не
          хранится — он не сериализуется и на бэк не уедет.

      - id: no-raw-kept
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сырьё не храним — чужой формат разбирается один раз на входе"
        description: |
          Означает: если хранить сырьё, то КАЖДАЯ манипуляция обязана сначала выяснить, что это за
          формат и как его читать, — и так на сто форматов вперёд. Поэтому чужой документ
          распознаётся ОДИН раз, при загрузке, и дальше не существует: после импорта нет ни
          Swagger 2.0, ни любого другого — есть наш документ.

          Следствие, ради которого всё и затевалось: правка ручки не упирается в сериализацию
          чужого формата, и флоу один — и для загруженных схем, и для заведённых руками. Решение
          user 2026-09-19.

      - id: endpoint-has-own-id
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "У ручки собственный `id`, выданный при разборе; `endpointKey` снесён"
        description: |
          Означает: `EndpointDescriptor.id` — обязательное поле, uuid, ни от чего не производное.
          Им ручка опознаётся в списках (`Endpoints` ключует по `id`) и в правках состава
          (`removeEndpoint` ищет по `id`).

          Прежний ключ `endpointKey` = `метод + url` разъезжался с сущностью ровно там, где эти
          поля правят, — на экране каталога: правка урла сносила узел вместе с открытостью
          аккордеона, а удаление целилось не туда, куда ткнул человек. Плюс две ручки с
          одинаковым методом и урлом были для списка одной. Функция снесена целиком, включая
          публичный экспорт пакета — ломающее изменение, версия минор.

          Решение user 2026-09-19.

      - id: id-is-stamped-at-the-door
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Айди ставит входной слой, а не шаблон формата и не склад"
        description: |
          Означает: `parseSchema` — единственная дверь: принимает чужой документ, отдаёт наш
          формат с проставленными айди и собранным реестром групп (`identify` в `models/edit`).
          Шаблон формата объявлен через `IncomingDocument` (ручки с тегом чужого документа, без
          айди) и ни про айди, ни про группы не знает — следующий шаблон физически не сможет их
          забыть. Склад ни при чём: `content` для него непрозрачен.

          Следствие для чтения: `asSchemaDocument` айди на лету не выдаёт (на чтении это плодило
          бы новый айди на каждый кадр) — он требует `id` у ручки как признак нашего формата.
          Ручка без айди — не наша схема, и внутрь пакета она не проходит. `groups` при этом
          Требование к группе позже усилено: `groupId` обязателен, и ссылка обязана вести в запись
          реестра (`unknown-is-an-ordinary-group`).

          Решение user 2026-09-19.

      - id: group-is-a-record
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Группа — запись документа со своим айди; `tag` снесён"
        description: |
          Означает: `SchemaDocument.groups: Group[]`, `Group { id, name }`, ручка ссылается на
          группу через `groupId`. Поле `tag` снесено с ручки, из `OpenapiEndpoint` и из публичных
          экспортов; `NO_TAG` → `NO_GROUP`, `removeTag` → `removeGroup`.

          Причина: тег фактически работал группой, но опознавался ИМЕНЕМ — а имя правит человек.
          Узел группы ключевался строкой, и переименование для списка означало другую группу, со
          сносом аккордеона и всего, что внутри. Та же болезнь, что у `endpointKey`, и лечится тем
          же: собственным тождеством.

          Что это дало: имя группы правится без последствий для экрана (тест на живучесть узла);
          пустая группа законна, потому что существует сама по себе; две группы с одинаковым
          именем — две разные записи.

          Тег не оставлен рядом «на будущее»: сегодня его никто не читает, а мёртвое поле пришлось
          бы тащить через импорт, склад и форму. Метки вернутся отдельной механикой с живым
          потребителем — и сразу множественными, как `tags` в самом свагере. Слово «тег» осталось
          только в словаре входного слоя (`IncomingEndpoint`).

          Ломающее изменение формата документа: хранения между сессиями нет, мигрировать нечего.
          Решение user (он же architect) 2026-09-19.

      - id: unknown-is-an-ordinary-group
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "`unknown` — обычная группа со своей записью, псевдогруппы нет вовсе"
        description: |
          Означает: у ручки `groupId` стал ОБЯЗАТЕЛЬНЫМ полем, `identify` заводит ручкам без тега
          одну общую запись с именем `unknown` и раздаёт её айди, `groupEndpoints` перебирает только
          реестр документа, а `asSchemaDocument` требует, чтобы ссылка вела в существующую запись.
          `NO_GROUP` снесён, на его месте `UNKNOWN_GROUP` — имя группы по умолчанию, не подменыш
          айди.

          Причина: псевдогруппа притворялась узлом, но записи под ней не было, и человек получал
          узел, который нельзя переименовать (диалог открывался и молча ничего не писал — найдено
          user'ом 2026-09-21), «+» в котором заводил ручку вообще без группы, а корзина целилась по
          выдуманному айди. Это та же болезнь, от которой ушли ручка и группа-тег: тождество на
          том, что не является записью.

          Постановка user 2026-09-21: после разбора чужого формата свагера больше нет, есть наша
          схема, и в ней у каждой ручки группа есть. `unknown` — не «нет группы», а имя группы:
          входящая схема не сказала, к чему ручка относится, значит неизвестно. Правится,
          пополняется и удаляется как любая другая; заведённая кнопкой «+» по-прежнему рождается
          как «Новая группа».

          Отменяет прежние решения: «unknown — не запись» и «ручка со ссылкой в никуда уходит к
          безгрупповым» (`group-is-a-record`, `manual-composition`, `id-is-stamped-at-the-door`).
          Ломающее: `EndpointDescriptor.groupId`, подпись `addEndpoint`, публичный экспорт
          `NO_GROUP`; хранения между сессиями нет, мигрировать нечего — версия минор.

      - id: node-header-pushed-buttons-out
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Длинный заголовок узла выталкивал кнопки действий за край панели"
        description: |
          Означает: поток в шапке `Box` стоял с `flex-shrink: 0` и раздувался под длину текста —
          замер в браузере дал 677 px внутри кнопки шириной 300, кнопки «Настроить»/«+»/корзина и
          стрелка уезжали за правый край рельсы. Чинится раскладкой: поток тянется и сжимается
          (`width: 100%`, `min-width: 0`), заголовок — единственный растяжимый элемент, кнопки и
          стрелка не сжимаются. Заодно снят `max-width: "100"` — значение без единиц, браузер его
          игнорировал.

          Вторая половина — обрезка. Флаг `truncated` у `Typography` в разметке стоит, но правила
          `[data-truncated="true"]` в CSS страницы нет вовсе (проверено перебором всех листов):
          форма typography наряда `omnifield` несёт один `root`. Поэтому обрезка проставлена стилем
          на самом заголовке — решение user 2026-09-21, разбор в FAQ.md. Уйдёт, когда форма её
          понесёт.

          Проверено живьём в `apps/studio`: одно длинное слово без пробелов и длинная фраза
          обрезаются многоточием, высота узла 28 px, кнопки внутри границ. Найдено user'ом
          2026-09-21.

      - id: swagger-tags-lose-the-tail
        type: bug
        status: Backlog
        priority: Low
        milestone: null
        name: "Из `tags` свагера берём только первый — остальные теряются молча"
        description: |
          Означает: `swagger2Template` читает `operation.tags?.[0]`. В Swagger 2.0 `tags` — массив
          меток, и вторая с третьей выбрасываются при импорте без следа. Сегодня это не мешает:
          группировка у нас одна на ручку, и первая метка ей и становится.

          Закрывать вместе с механикой меток (см. `group-is-a-record`): метка множественная по
          природе, и чинить потерю до появления потребителя незачем. Найдено 2026-09-19.

  - category: Пресет как склад
    items:
      - id: preset-is-neutral-storage
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "`entities/preset` — нейтральный склад, openapi его потребитель"
        description: |
          Означает: сущность — именованная пользовательская запись, которая уедет в
          `backend/presets`: `Preset { id, name, content }`, где `content` для склада НЕПРОЗРАЧЕН.

          Разрез — склад и потребитель, оба друг о друге не знают: складу неважно, кто и что в
          него завёз, потребителю неважно, на каком складе лежит его формат. Поэтому
          `entities/preset` не знает про ручки, `entities/openapi` не знает про склад, и ни один
          не импортирует другой — сводит фича. Слово «схема» отвергнуто: оно занято смыслом
          «описание формы», а у склада завтра будут другие потребители. Решение user 2026-09-19.

      - id: preset-has-kind
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Вид записи — ярлык на пресете (`api`/`adapter`), а не признак внутри содержимого"
        description: |
          Означает: `Preset { id, name, kind, content }`, где `kind` — строка, которую склад
          СРАВНИВАЕТ, а не толкует; ставит её дверь, где запись рождается
          (`add(kind, name, content)` — вид первым, как `?kind=` у службы). Ярлык объявляет
          потребитель у себя: `api` — документ схемы, `adapter` — адаптер. Реестра видов на складе
          нет: он перечислял бы своих потребителей, а они про склад знать не должны.

          Причина: потребителей склада стало двое, и опознавать запись структурой её содержимого —
          значит лазить в дебри на каждое чтение. Так же устроена служба, куда записи уедут:
          `backend/presets/internal/kinds` держит вид ярлыком на уровне ЗАПИСИ (`Meta.Kind`, он же
          `?kind=`), состояние остаётся непрозрачным JSON и типизируется только на границе API, а
          индекс отдаёт вид без тела. Локальный склад повторяет транспорт, а не изобретает своё
          опознание.

          Две роли меняются следом: отбор своих записей становится механикой склада (селектор по
          виду), а страж содержимого (`asSchemaDocument`) перестаёт быть способом опознания и
          остаётся проверкой целостности — «запись наша, а содержимое битое». До этого каталог
          показывал ВСЕ пресеты и писал «не похож на схему API» на чужих; с двумя видами это стало
          бы взаимным шумом двух экранов.

          Ярлык `api`, а не `openapi`: он называет вид записи, а форматов документа будет больше
          одного. Ломающее — подпись `add` и состав `Preset`; хранения между сессиями нет,
          мигрировать нечего. Решение user 2026-09-19.

      - id: preset-store-and-ui
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Склад: стор, карточки, загрузчик документа"
        description: |
          Означает: `presetsStore` (`add`/`remove`/`rename`/`replace`/`edit`/`hydrate`, селектор
          `presetBy`), айди — uuid при создании и ни от чего не производный. UI склада —
          `Presets`/`PresetCard`/`PresetInfo`/`PresetLoader`, экран загрузки —
          `ExternalSchemaLoader` (файл или вставка → `parseSchema` → пресет).

          Состав UI пересматривается со вторым потребителем склада: карточка сносится
          (`preset-card-removed`), загрузчик уезжает в общий слой (`loader-is-a-supply-form`),
          перебор становится механикой склада (`listing-belongs-to-the-storage`).

      - id: listing-belongs-to-the-storage
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Перебор склада — механика склада, а не каждого экрана"
        description: |
          Означает: `Presets` принимает вид записей и текст пустого состояния, перебирает их
          `<Key by="id">` и отдаёт наружу аксессор записи — карточку внутрь не навязывает
          (`children` обязателен). Отбор по виду даёт реактивный селектор склада `presetsOf(kind)`,
          следствие `preset-has-kind`. Карточка при этом снесена совсем — потребителя у неё не
          нашлось (`preset-card-removed`).

          Причина: механика уже продублирована, ещё до адаптера. `Presets` не зван ни одним
          экраном зоны — только своим тестом и экспортом наружу, — поэтому `ApiCatalog` переписал
          перебор записей у себя, и дубль остался незамеченным. Взять готовое каталог и не мог:
          `Presets` жёстко рисует `PresetCard` (плоская карточка «имя + дети»), а узел каталога —
          аккордеон `Box`, где имя пресета это заголовок секции. Общее у них не карточка, а отбор
          записей, тождество в переборе и пустое состояние.

          Дефолтной карточки у механики нет сознательно: вид узла у потребителей разный, и дефолт
          означал бы, что склад имеет мнение о содержимом. Решение user 2026-09-19.

      - id: record-comes-with-its-editor
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Склад отдаёт запись вместе со стражем и типизированной правкой"
        description: |
          Означает: `Presets` принимает страж содержимого от потребителя (`asSchemaDocument`,
          будущий `asAdapter`), применяет его и отдаёт наружу УЖЕ приведённое содержимое плюс
          правку черновиком по этой записи — `(content, edit) => …`. Потребитель
          `presetsStore.actions.edit` не зовёт вовсе; на битом содержимом своего вида механика
          показывает отказ текстом.

          Причина: сегодня и то и другое лежит в экране. `ApiCatalog` держит у себя связку
          `presetsStore.actions.edit<SchemaDocument>(preset().id, recipe)` и связку
          «страж → либо содержимое, либо fallback» — обе нужны любому потребителю склада, и экран
          адаптеров написал бы их заново со своим типом.

          Почему страж отдаётся складу, а не остаётся снаружи: чтобы правка была типизирована,
          механика обязана знать тип содержимого, а узнать его она может только от стража. При
          этом нейтральность не теряется — склад страж не толкует, он его зовёт, ровно как
          сравнивает переданный ярлык вида (`preset-has-kind`).

          Роли при этом разъезжаются чисто: ярлык вида отбирает записи, страж проверяет
          целостность содержимого. «Не похоже на схему API» перестаёт быть шумом на чужих записях
          и становится отказом на своей. Решение user 2026-09-19.

      - id: single-line-input-ate-newlines
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Однострочный `<input>` молча резал вставленный документ"
        description: |
          Означает: поле под документ было `FieldInput`, а однострочный `<input>` по спеке
          вырезает переносы строк при нормализации значения — вставленный YAML превращался в одну
          строку и переставал разбираться. Тихо: ни ошибки, ни следа, документ просто «не
          распознавался». Найдено тестом на живой вставке petstore. Чинится `FieldTextarea` в одну
          строку — вид тот же, текст цел.

      - id: loader-is-a-supply-form
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Загрузчик — форма поставки, а не механика склада: `PresetLoader` → `RawLoader`"
        description: |
          Означает: узел «выбрать файл или вставить текст → отдать сырую строку» переезжает из
          `entities/preset` в `shared/ui`, к `Box`, и получает имя `RawLoader`. Надпись кнопки и
          `accept` становятся пропами — сегодня в нём зашиты «Загрузить схему» и список расширений
          документа API.

          Причина глубже косметики: складу сырьё не принадлежит вообще. Он хранит РАЗОБРАННОЕ
          содержимое и сырого текста не видит никогда (`no-raw-kept`) — читает файл и вставку тот,
          кто их разбирает, то есть фича. Имя `PresetLoader` врало дважды: узел не про пресет,
          потому что до склада сырьё не доходит, и не только про схему.

          Загрузка при этом — не частный случай документа API, а одна из форм поставки для любого
          содержимого (постановка user 2026-09-19): адаптер тоже будет приезжать файлом, помимо
          снятия пробой. Поэтому узел общий, а не переезжает в `features/external-schema` к
          сегодняшнему единственному потребителю. Ломающее для публичного экспорта, версия минор.

      - id: preset-card-removed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "`PresetCard` сносится — потребителя у карточки нет ни внутри, ни снаружи"
        description: |
          Означает: компонент строки списка («имя текстом слева, вставка потребителя справа») не
          зван ни одним экраном зоны и ни одним потребителем пакета — только своим тестом и
          публичным экспортом. Единственный потребитель `@web-core/feeder` сегодня —
          `apps/studio`, и он берёт три имени: `ExternalSchemaLoader`, `ApiCatalog`, `TreeForm`.

          Почему сносим, а не доводим: после `listing-belongs-to-the-storage` перебор отдаёт узел
          наружу и вида ему не навязывает, так что карточка перестаёт быть даже дефолтом.
          Понадобится список карточек на экране адаптеров — заведётся тогда, под настоящего
          потребителя, а не под воображаемого. Ломающее для публичного экспорта, версия минор.
          Решение user 2026-09-19.

      - id: paste-from-clipboard
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Вставка кнопкой вместо поля ввода"
        description: |
          Означает: поле под документ существует только чтобы принять вставку — юзер в него ничего
          не печатает. Вместо него кнопка «Вставить», читающая буфер напрямую. Компонент делает
          владелец `packages/ui`, зона переедет на него, когда он появится (решение user
          2026-09-19); до тех пор — текстареа.

          Сверку по поддержке буфера в браузерах НЕ проводили: до неё не дошли. Провести её обязан
          тот, кто будет делать компонент — доступ к чтению буфера исторически разный у браузеров
          и требует разрешения.

  - category: Каталог и вызов
    items:
      - id: catalog-screen
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`ApiCatalog` — состав API: группы → ручки → параметры"
        description: |
          Означает: каталог читает склад напрямую, состав ему не подают. На каждый пресет, похожий
          на документ API (`asSchemaDocument`), рисуется состав: компоновка по группам
          (`groupEndpoints` по реестру документа; ручки, которым схема группы не назвала, разбор
          кладёт в обычную группу `unknown`), под ручкой — форма
          параметров и вызов. Правки состава идут immer-черновиком через
          `presetsStore.actions.edit`.

          Имя менялось дважды: `SchemaCatalog` → `ApiCatalog` вместе с папкой `ui/api-catalog` и
          типом `ApiCatalogResult` (переименование целиком, без алиасов, решение user 2026-09-19).

      - id: endpoint-call
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Вызов ручки: форма параметров по схеме и живой HTTP"
        description: |
          Означает: `endpointOf(descriptor, defs)` строит зод параметров, `TreeForm` рисует по нему
          форму, `useInvoke` держит `result`/`failure`/`pending`, `invokeEndpoint` выполняет вызов
          поверх `rawRestRequest` (`@web-core/query/rest`). Путь/квери/тело раскладываются из
          одного значения: имя из `{плейсхолдера}` url — в путь, ключ `body` — в JSON-тело,
          остальное — в квери. Не-2xx — валидный `InvokeResult`; сорванный транспорт — исключение,
          `useInvoke` кладёт его текст в `failure`.

      - id: manual-composition
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Правка состава руками: «+» на схеме заводит группу, «+» на группе — ручку"
        description: |
          Означает: `addGroup(draft, name?)` кладёт запись `{ id, name }` (по умолчанию «Новая
          группа») в начало реестра, `addEndpoint(draft, groupId?)` — пустую ручку (`GET`, пустой
          урл, без параметров) первой В СВОЕЙ группе; обе возвращают выданный айди. Каталог
          обрабатывает готовые события рекурсивного `Box`: «+» на схеме — `addGroup`, «+» на
          группе — `addEndpoint(group.id)`. У ручки «+» нет: глубже неё в документе ничего не
          заводится. Удаление на всех трёх уровнях, `removeGroup` уносит и запись, и её ручки.

          Новая запись встаёт в начало, а не в конец: заполняют сверху, и искать только что
          заведённое в хвосте списка — лишняя работа. Ручка при этом встаёт первой именно в своей
          группе — голый `unshift` утаскивал бы всю группу наверх, потому что порядок групп шёл
          от первого вхождения ручки (до `group-is-a-record`).

          Группа `unknown` при этом ничем не особенная — ручка заводится в ней так же, как в любой
          другой (`unknown-is-an-ordinary-group`). Решения user 2026-09-19.

          Заполнять заведённую ручку пока нечем — см. `manual-endpoint-editing`.

      - id: manual-endpoint-editing
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Заведённая ручка заполняется на экране — форма конфига в диалоге"
        description: |
          Означает: метод, урл и состав параметров правятся диалогом «Настроить»
          (`config-dialog-edits-the-node`), а не только черновиком из кода. Развилка закрыта в
          пользу зод-схемы дескриптора через собственное дерево формы: список параметров достаётся
          даром, цена — подписи полей из ключей схемы (`method`, `url`, `params`), своих слов у
          них пока нет.

          Что осталось за бортом сознательно: `groupId` — переезд ручки между группами формой не
          делается; описание параметра правится типом, а не как произвольная JSON Schema.

          Найдено 2026-09-19, закрыто 2026-09-19.

      - id: node-sends-itself-on-config
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Каждый узел состава отдаёт себя наружу событием `onConfig`"
        description: |
          Означает: `Box` принимает ОДНО событие `onConfig?: (item?: T) => void` — кнопка
          «Настроить» (иконка `pencil`, словарь кита своего значка настройки не несёт) встаёт
          рядом с «+» и корзиной на каждом узле и появляется, как и они, от самого колбэка. Узел
          элемента отдаёт свой `item`, узел самого бокса зовёт без него: предмета у ярлыка нет.

          Подставляет предмет тот, кто бокс строит: `Endpoints` пробрасывает событие в оба своих
          бокса и за верхний узел отдаёт документ схемы (`group ?? props.document`). Наружу
          каталога едут три вида узла — `SchemaDocument`, `EndpointGroup`, `EndpointDescriptor`.

          Имя события названо user'ом и ставится буквально: пара `onConfig`/`onItemConfig` по
          образцу соседних пропов отвергнута — различие уехало в необязательный аргумент.
          Решения user 2026-09-19.

      - id: config-dialog-edits-the-node
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Узел правится диалогом конфига, а не полем в заголовке `Box`"
        description: |
          Означает: пойманный `onConfig` узел открывает `ConfigDialog`, и тот рисует форму
          `TreeForm` по зод-схеме этого узла. Что правится: у схемы — имя записи склада, у группы
          — имя, у ручки — метод (селект по `HttpMethod`), урл и параметры. `id` не правится
          нигде: на нём держится тождество узла. `groupId` ручки в этот заход не трогаем —
          переезд ручки между группами отдельная работа.

          Зод даёт владелец узла: схемы группы и ручки объявляет `entities/openapi` — никто,
          кроме него, про его узлы не знает; однополевую схему имени записи — `entities/preset`,
          это поле склада, а не документа.

          Пишет сам диалог, он фича и держит правки внутри себя: имя записи —
          `presetsStore.actions.rename`, состав документа — черновиком `edit`. Правка живёт
          локальным состоянием диалога и уезжает в склад по кнопке «Сохранить», а не на каждое
          нажатие клавиши: у формы узла полей много, и запись на каждый символ означала бы поток
          правок склада из одной незаконченной мысли. Поэтому вместе с узлом диалогу едут вид
          узла (`kind`) и айди пресета. Вид едет ЯРЛЫКОМ, а не вычисляется из
          структуры (`"params" in item`): опознавать запись её содержимым — та же болезнь, от
          которой склад ушёл, заведя `kind` (`preset-has-kind`).

          Параметры рисуются по их описанию: есть у параметра `schema` — форма строится по ней
          (`schemaNodeToZod` разворачивает и объект, и массив, и `$ref`), и правится ровно то,
          что описано. Описания нет — параметр заведён руками, и он рисуется скаляром: собрать
          руками произвольную JSON Schema всё равно нечем.

          Этим закрывается развилка `manual-endpoint-editing` (форма строится зод-схемой
          дескриптора через `TreeForm`, не своими полями кита) и отменяется прежний замысел
          править имя прямо в заголовке узла `Box` пропом `onLabel`: правка имени уезжает в тот
          же диалог, и отдельной механики в `shared/ui` не заводится. Решения user 2026-09-19.

      - id: group-renaming
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Переименование группы и записи склада на экране"
        description: |
          Означает: имя группы правится диалогом конфига (`applyGroupConfig` черновиком), имя
          записи склада — тем же диалогом через `presetsStore.actions.rename`. Модель была готова
          с самого начала (`group-is-a-record`: имя — обычное поле, тождество держит `id`), не
          хватало ровно экрана.

          Группа `unknown` сперва переименованию не поддавалась и молчала в ответ — записи в
          документе у неё не было. Снято: теперь это обычная запись
          (`unknown-is-an-ordinary-group`). Закрыто 2026-09-19.

      - id: endpoint-node-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Узел ручки разобран: `Endpoint` = `Config` + `Call`"
        description: |
          Означает: папка `ui/endpoint` (бывшая `endpoint-call`) — барель отдаёт `Endpoint` и
          `Call`, `Config` остаётся внутренним. `Endpoint` держит значение параметров (его правит
          `Config`, читает `Call`) и собирает обоих; `useInvoke` живёт в `Call` — дёргает он один.

          Причина разреза: настройка ручки и её вызов — разные предметы с разной судьбой, и
          настройка дескриптора (`manual-endpoint-editing`) ляжет в `Config`, не задевая код
          вызова. По дороге снесён мёртвый `entities/openapi/ui/endpoint.tsx` — он звался только
          из своего барреля, и имя `Endpoint` освободилось. Решение user 2026-09-19.

      - id: catalog-dispatches-result
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Каталог отдаёт ответ наружу диспатчем `onResult`"
        description: |
          Означает: `ApiCatalog` принимает необязательный `onResult` и стреляет им на каждый
          удавшийся вызов ручки — `ApiCatalogResult { presetId, endpoint, result }`. Событие
          приходит от `Call.onResult`, каталог добавляет к нему происхождение: голый
          `InvokeResult` снаружи неадресуем, ручек на экране десятки. Сорванный транспорт наружу
          не идёт — ответа не было, `Call` называет его словами у себя.

          Ради этого узел пресета (`preset-node.tsx`) втянут в тело каталога: отдельным
          компонентом он существовал только как перекладка пропов, и диспатч добавил бы ей ещё
          один этаж. Экспортируемая функция в файле осталась одна. Решение user 2026-09-19.

      - id: studio-import-rename
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "`apps/studio` импортирует снесённые имена — чинит владелец студии"
        description: |
          Означает: `apps/studio/src/features/lab-manager/ui/api/configuration.tsx` зовёт
          `SchemaCatalog`, которого больше нет. Тем же выпуском уехали `EndpointCall` → `Endpoint`
          и `SchemaCatalogResult` → `ApiCatalogResult`, а `Endpoints` теперь принимает `document`
          вместо `endpoints`. До правки студия не соберётся.

          Чужая зона — отдано наверх, чинить не нам. Найдено 2026-09-19.

      - id: live-browser-check
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Живая проверка в браузере (`apps/studio`)"
        description: |
          Означает: сборка проверена только vitest+jsdom. Живьём не гонялась: открыть экран API в
          `apps/studio`, загрузить документ, раскрыть каталог, дёрнуть ручку и увидеть ответ.
          Отдельно проверить то, чего jsdom не даёт вообще — открытие и закрытие секций аккордеона
          кликом.

  - category: Адаптер
    items:
      - id: adapter-is-the-entity
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сущность — адаптер, не привязка; `entities/binding` → `entities/adapter`"
        description: |
          Означает: «привязка» — глагол, действие, а действия живут в `features`; вещь, которая
          реально хранится и переиспользуется, — адаптер. Побочно освобождает слово: в
          `entities/form` `binding` уже занят привязкой инпута к полю формы. Переименование
          сделано целиком и разом, алиасов не оставлено. Решение user 2026-09-18.

      - id: adapter-is-a-preset
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптер — шов между поставщиком и потребителем, хранится пресетом"
        description: |
          Означает: работа адаптера — принять данные и отдать их в нужной форме; кто дал и кому
          отдаём, адаптеру безразлично. Он сохраняется на `backend/presets` наравне с прочими
          пресетами (второй потребитель склада после документа схемы) и живёт самостоятельно.

          Состав: форма (`root` — где записи, `rules` — как поле ложится, `extra` — что с лишними)
          плюс СПИСКИ проверенных поставщиков и потребителей — просто айдишники ручек,
          компонентов, утилит, чего угодно. Списки говорят «на этих проверяли», а не ограничивают
          применимость; механику перекладки они не меняют. `source` («какую ручку дёрнуть, с какими
          параметрами») внутрь адаптера не входит — это не форма. Решение user 2026-09-18,
          уточнено 2026-09-19.

      - id: adapter-identity-is-outside
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Личность адаптера — на пресете; айди внутри записи носят её вложенные списки"
        description: |
          Означает: `Adapter` — целое содержимое пресета, и своих `id`/`name` у него нет, ровно как
          у `SchemaDocument`: имя от юзера и айди даёт склад. Внутри записи айди носит то, что
          лежит СПИСКОМ и правится на экране, — по тому же правилу, по которому его носят
          `EndpointDescriptor` и `Group`.

          Первый такой список — правила перекладки: `FieldRule` из `@web-core/io` это
          `{ target, from?, steps?, onFail?, fallback? }`, опознавать себя ему нечем, а `target` и
          `from` человек как раз и правит. Ключ, собранный из этих полей, разъехался бы с записью
          ровно там, где её меняют, — та же болезнь, что у `endpointKey` и у тега-как-группы, и
          лечится тем же: выданным айди.

          Решение user 2026-09-19.

      - id: adapter-mismatch-is-loud
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Переиспользование безопасно, потому что промах громкий"
        description: |
          Означает: схемы ответа Swagger 2.0 не даёт, формы сводятся по живому ответу — сверить
          совпадение нечем. Возражение снято отчётом: подсунули не те данные — адаптер просто не
          перемапит, и это видно. `FieldRuleReport` несёт `converted`/`rejected`/`unmapped`,
          `applyAdapter` дополнительно даёт именной отказ, когда по `root` ничего нет или там
          скаляр. Решение user 2026-09-18.

      - id: adapter-is-one-way
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптер односторонний: одна запись — один вход, один выход"
        description: |
          Означает: запись держит ОДИН набор правил, вход → выход. Обратное направление — вторая
          запись на складе, со своими правилами и своими деревьями пользователей: у чтения на входе
          ручка, на выходе компонент; у записи наоборот. Выбор user 2026-09-19 — «за Flux», то есть
          односторонний поток данных.

          Почему не два набора правил в одной записи: деревья пользователей разведены по роли, и
          при двустороннем адаптере ручка `POST` попала бы в оба сразу — «кто у этого адаптера на
          входе» перестало бы читаться. Плюс `root` («где лежат записи») — свойство входа, и его
          пришлось бы держать по одному на направление.

          Половину этого уже решила зона `io`: правила приёма и правила отдачи — два НЕЗАВИСИМЫХ
          списка `FieldRule[]`, отдача не выводится разворотом приёма (поэтому `fieldRulesCodec`
          там снесён), а `applyFieldRules` просто зовётся дважды. Раз общего состояния между
          сторонами нет, склеивать их в одну запись нечего.

          Цена названа сразу: связь между парой таких адаптеров («второй — обратная перекладка к
          первому») нигде не записана и видна только человеку по деревьям. Понадобится показывать
          их парой — это отдельная механика, а не поле «обратный» внутри записи.

      - id: adapter-keeps-two-lists
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Пользователи адаптера — два дерева по роли, ветку строит сам тип"
        description: |
          Означает: в записи два поля — `providers` (кто данные даёт) и `consumers` (кто их ест), и
          каждое не массив, а ДЕРЕВО: первый ключ — тип пользователя, дальше ветку строит и читает
          сам тип, потому что он один знает, чем его пользователь адресуется. Лист — пустой объект.
          Третьей роли нет: «пользователь» это общее слово от «пользоваться», покрывающее обе.

          ```
          providers: { api: { "<presetId>": { "<endpointId>": {} } } }
          consumers: { component: { "user-card": {} } }
          ```

          Почему не массив с общим составом элемента: у пользователей разная природа, и единый
          состав пришлось бы подгонять под всех. Ручка адресуется парой «пресет + ручка» (её айди
          сам по себе не адресуем — она лежит внутри записи вида `api`), компонент — именем, которым
          он объявлен в реестре форм `@web-core/io`. Склеивать пару в одну строку нельзя: это
          вернуло бы `sourceKey`, который сносится этим же заходом.

          Что даёт дерево, кроме свободы типа: дубль невозможен по построению (повторная запись
          перезаписывает лист, а в массиве легла бы второй строкой), а правка и удаление точечные —
          по пути, без поиска индекса, что для immer-черновика разница между `delete` и фильтром.
          Обратная сторона названа сразу: это карта ПРИСУТСТВИЯ, не список, порядок ключей данными
          не является — экран обходит дерево сам и сортирует, как ему нужно.

          Почему два дерева, а не одно: роль из типа НЕ выводится. `GET /users` данные даёт, `POST
          /users` принимает — обе ручки тип `api`. Записывать роль внутрь ветки нельзя: ветка
          принадлежит типу, и каждый тип назовёт роль по-своему. Роль держит адаптер — он между
          сторонами и стоит, — а адрес держит тип.

          Лист пока пустой объект, а не `true`: расширяется без смены формы, когда появится, что в
          нём держать. Держать в нём можно указатели и скелет, но не сами данные (постановка user
          2026-09-19) — по той же причине, по которой проба хранится скелетом, а не ответом
          (`response-skeleton-kept`).

          Следствия для кода: страж `asAdapter` в деревья не смотрит (объект — и достаточно), иначе
          адаптер начал бы толковать чужие форматы; ветку типа `api` объявляет `entities/openapi`,
          а не `entities/adapter`, и адаптер openapi не импортирует. Тот же приём, которым склад не
          знает, что лежит в `content` (`preset-is-neutral-storage`).

          Деревья не валидация: поставщика может в них не быть, а форма его ответа — подходить, и
          узнаётся это только при передаче данных. Смысл записи — «на этих проверяли, работает».
          Пустые деревья законны, адаптер с ними рабочий, а промах громкий сам по себе
          (`adapter-mismatch-is-loud`). Решения user 2026-09-19.

      - id: adapter-has-no-store-of-its-own
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Своего хранилища у адаптера нет — он живёт в складе пресетов, как документ схемы"
        description: |
          Означает: `adapterStoreOf` со всей обвязкой (`AdaptersState`, `bind`/`unbind`/`setRules`/
          `setRoot`/`setExtra`/`hydrate`, поиск `adapterBy`, ключ `sourceKey`, тип `FeedSource`)
          сносится целиком; мёртвый `Consumer { name, input }` уходит с ними — он не зван нигде.
          Адаптер лежит содержимым пресета под ярлыком `adapter` и правится черновиком через
          механику склада (`record-comes-with-its-editor`).

          Причина: два хранилища на одну запись — это два места правды, и расходятся они молча.
          Прежний стор вдобавок раскладывал адаптеры ПО РУЧКАМ (`sourceKey` = айди схемы плюс айди
          ручки), то есть держал ровно то свойство, которое отменено решением
          `adapter-is-a-preset`: шву безразлично, кто именно его кормит.

          Что остаётся у сущности, зеркально `entities/openapi`: тип `Adapter`, страж `asAdapter`,
          `applyAdapter` с `noFeed` и чистые функции правок над immer-черновиком. Ломающее для
          публичных экспортов, версия минор. Решение user 2026-09-19.

      - id: adapter-entity-stale
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Форма `Adapter` приведена к решённому составу, старый стор снесён"
        description: |
          Означает: `Adapter { root, rules, extra?, providers, consumers }`. Стор адаптеров
          (`adapterStoreOf`, `AdaptersState`, `adapterBy`, `sourceKey`, `FeedSource`) и мёртвый
          `Consumer` снесены целиком — он раскладывал записи ПО РУЧКАМ и заводил второе место
          правды рядом со складом. Запись живёт содержимым пресета под ярлыком `ADAPTER_KIND`,
          страж — `asAdapter`.

          Правило несёт выданный айди (`AdapterRule extends FieldRule`): его правят на экране, и
          тождество строки на содержимом держаться не может. Правки над черновиком — `link`
          (заводит связь или меняет источник, сохраняя айди), `unlink`, `rememberUser`/`forgetUser`
          по адресу в дереве.

          Закрыто 2026-09-20.

      - id: adapter-rule-has-id
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "У связи собственный айди — дописан прямо в правило"
        description: |
          Означает: `AdapterRule extends FieldRule` плюс `id`. `FieldRule` в `@web-core/io` айди не
          имеет и не должен: там правило — описание перекладки, которое движок исполняет и
          забывает. У нас это строка списка, которую человек правит (перетащил другое поле —
          сменился `from`, бросил в соседний слот — `target`), поэтому опознавать её содержимым
          нельзя.

          Айди дописан в само правило, а не в обёртку `{ id, rule }`: в `io` лишнее поле уезжает
          пассажиром и не читается, зато код плоский. Решение user 2026-09-20.

      - id: user-kinds-are-registered
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Вид участника объявляется снаружи, а не перечислен в типе"
        description: |
          Означает: `defineUserKind(kind, address)` отдаёт построитель пути, который сам ставит вид
          первым сегментом; реестр общий — `userKinds()` перечисляет объявленное, `userKindOf(path)`
          говорит, чей путь (незнакомый — `undefined`, без догадок). Повторное объявление того же
          вида возвращает прежний: модуль может быть перезагружен дев-сервером.

          Вид `api` объявляет `features/api-manager` (`API_USER`) — фича знает адрес ручки и видит
          обе сущности; компонент объявляет приложение у себя. Закрытое объединение видов
          (`"api" | "component"`) отвергнуто: оно утверждало бы, что все потребители известны
          feeder'у заранее. Постановка user 2026-09-20.

      - id: feed-assembles-consumer-shape
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`feed` собирает ответ в ОДИН объект формы потребителя"
        description: |
          Означает: `feed(response, adapter)` → `{ value, report, error }`. Правила делятся по
          позиции цели: путь с индексом (`/items/0/label`) — поле каждой записи набора, источник
          читается относительно записи; без индекса (`/title`) — одно значение на весь объект,
          источник от корня ответа. Второго признака не заводится: индекс уже есть в пути, который
          приходит из формы потребителя.

          Коллекций в форме может быть несколько (`/items/0/…` и `/legend/0/…`) — каждая собирается
          своими правилами из того же набора записей; второй `root` для этого не нужен.

          До этого `applyAdapter` отдавал список записей, и собрать из него `{ items: [ … ] }` было
          нечем: правила, применённые к каждой записи, давали N объектов вместо одного. Заявка
          owner-studio-app, решение user 2026-09-20.

      - id: serve-feeds-in-one-call
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`serve` — вызов ручки, который сразу отдаёт еду"
        description: |
          Означает: `serve(endpoint, value, { provider, consumer })` дёргает ручку, сам находит
          адаптер этой пары на складе, прогоняет ответ через `feed` и отдаёт конверт `Serving`:
          `result` (оригинал: статус, заголовки, тело) приезжает всегда, `data`/`report`/`error` —
          только если адаптер нашёлся. Нет адаптера — `data` равен `undefined`, а не пустому
          объекту.

          Живёт в `features/api-manager`, где уже лежит вызов: фичи одного слоя друг друга не
          видят, поэтому положить это в `adapter-manager` было нельзя. Постановка user 2026-09-20.

      - id: adapter-lookup
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Поиск и перечисление участников — на стороне feeder"
        description: |
          Означает: `usedBy(adapter, role, path)` — стоит ли лист по адресу; `adapterFor(records,
          provider, consumer)` — запись, на которой проверяли обоих; `usersOf(adapter, role)` —
          листья дерева полными путями; `partnersOf(records, role, path)` — партнёры с другой
          стороны («какие ручки кормят этот компонент» и обратно), без дублей.

          Причина: витрине нужно перечисление, а не только проверка одного пути, и фильтровать
          сырые пресеты у себя она не должна. Заявка owner-studio-app, закрыто 2026-09-20.

      - id: mastering-screen
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мастер сведения: слоты выхода принимают поля входа переносом"
        description: |
          Означает: `AdapterMastering` — две колонки, слева слоты формы потребителя, справа поля
          живого ответа. Поле берётся мышью, слот принимает; связь уезжает в запись адаптера пары,
          а при первой связи запись заводится (до неё на складе пусто — брошенный мастер не
          оставляет пустышек). Внутри — контролируемый `Mastering`, который про склад не знает и
          тестируется без него.

          Вид слота говорит о состоянии: пустой — пунктирная лунка с приглашением, заполненный —
          чип с источником и крестиком, под курсором — акцентная рамка. Тип поля показан значком
          кита и покрашен собственной категорией палитры (`type-string`, `type-number`, …).
          Во время переноса каждый слот отвечает, чем обернётся бросок: `fitOf` даёт точное
          совпадение, безопасное приведение или риск; запрета нет — любой скаляр приводится к
          любому.

          Строки нарисованы своей разметкой, а не `listbox` кита: Zag гасит `mousedown` у пункта, и
          нативное перетаскивание не стартует (разбор — FAQ.md). Перенос — на
          `@atlaskit/pragmatic-drag-and-drop`, обёрнут в `shared/dnd`. Закрыто 2026-09-20.

      - id: api-probe-screen
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "`ApiProbe` — витрина потребителя: только связанные ручки, вызов с кормлением"
        description: |
          Означает: каталог принимает `consumer` (адрес потребителя) и показывает ТОЛЬКО схемы и
          ручки, у которых есть адаптер с ним — список берётся `partnersOf`, документ сужается,
          схема без связанных ручек не рисуется, пустая витрина объясняет себя словами. Правки
          состава нет: ни «Добавить», ни «Убрать», ни «Настроить».

          Вызов идёт через `serve`: наружу едет `ApiProbeResult { presetId, endpoint, serving }` —
          оригинал ответа, собранные данные и отчёт разом. Внутри это необязательные `users` и
          `onServing` у `Endpoint`/`Call` и второй аргумент `useInvoke`: есть потребитель — зовётся
          `serve`, нет — прежний `invokeEndpoint`.

          Первая версия (2026-09-20) про потребителя не знала вовсе и отдавала сырой ответ — витрина
          на ней не собиралась, заявка owner-studio-app. Пагинация механикой так и не стала:
          `limit`/`offset` приезжают обычными параметрами ручки.

      - id: storage-gives-records
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Склад отдаёт записи приведёнными — `recordsOf`, `savedAdapters`"
        description: |
          Означает: `recordsOf(kind, as)` — механика склада: записи своего вида, прогнанные
          стражем, вместе с их пресетом (`{ preset, content }`). Поверх — `savedAdapters()`, тот же
          список для адаптеров без аргументов.

          Причина: связку `presetsOf(kind).map(as).filter(...)` писали у себя и `serve`, и мастер, и
          она же предлагалась потребителю в примерах — то есть ровно «фильтрация сырых пресетов на
          стороне потребителя», от которой ушли, вынося перебор в склад
          (`listing-belongs-to-the-storage`). Теперь дубля нет ни внутри зоны, ни снаружи.
          Заявка owner-studio-app 2026-09-20.

      - id: feed-counted-absent-rules
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "Отчёт `feed` врал на единицу, когда одиночных правил нет"
        description: |
          Означает: при пустом списке правил-без-индекса `feed` всё равно прогонял ответ через
          `collectFieldRuleReport` как одну запись, и та считалась сконвертированной. У адаптера с
          одними построчными правилами `report.converted` оказывался на единицу больше настоящего.

          Найдено 2026-09-20 тестом на кормление из `Endpoint` — ждали 1, получили 2. Чинится
          пропуском прогона: нет правил — пустой отчёт.

      - id: adapter-report-visible
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Отчёт `applyAdapter` обязан быть на экране"
        description: |
          Означает: безопасность переиспользования держится на том, что промах громкий. Спрячем
          отчёт — «не перемапилось» станет неотличимо от пустого компонента, и вся схема потеряет
          смысл. Это не украшение UI, а условие принятого решения `adapter-is-a-preset`.

          Наружу отчёт уже едет — `feed` и `serve` отдают `FieldRuleReport` рядом с данными
          (`feed-assembles-consumer-shape`, `serve-feeds-in-one-call`). Не хватает именно экрана:
          в мастере сведения его не показывают, и человек, настроивший адаптер, промаха не видит.

      - id: adapter-root-unset
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Корень набора выводится из источника связи, а не спрашивается отдельно"
        description: |
          Означает: `feed` режет источник по цифровому сегменту тем же приёмом, что и цель:
          `/data/0/login` → набор `/data`, в записи `/login`. Мастер сведения ничего дополнительно
          не пишет и не спрашивает — человек назвал набор, когда перетащил поле.

          До этого `root` оставался пустым (мастер писал только правила), `collectRowsReport` шёл
          по пустому пути, находил объект вместо массива и отказывался: у потребителя приезжал
          пустой список при верно сведённых связях. Найдено сквозным прогоном owner-studio-app.

          Явный `root` сильнее выведенного — задел под экран выбора набора, когда в ответе
          несколько списков-кандидатов (`discoverRowSets` в `@web-core/io` их и находит). Связь из
          чужого набора в сборку не идёт и называется в отчёте: набор в одной записи один.

          Закрыто 2026-09-20.

      - id: mastering-has-no-keyboard-path
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Связать поле со слотом без мыши пока нельзя"
        description: |
          Означает: единственный способ поставить связь — перетаскивание. С клавиатуры и пальцем
          мастер недоступен. Самый дешёвый дубль — выбрать поле, затем ткнуть слот; он же снимает
          зависимость от нативного DnD на тач-устройствах.

          Отдельно ушла возможность, которая была даром: строки перестали быть `listbox`'ом кита
          (Zag гасит `mousedown`, разбор — FAQ.md), а вместе с ним ушла и его навигация стрелками.
          Найдено 2026-09-20.

      - id: response-skeleton-kept
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "Форма ответа берётся пробой и хранится скелетом, не содержимым"
        description: |
          Означает: адаптеру нужна форма ОТВЕТА, а наш документ описывает только параметры ручки —
          из Swagger 2.0 ответ не достать. Форма берётся пробой (дёрнуть ручку), но хранится не
          содержимое, а `describeSample(ответ)` из `@web-core/io`: плоский `PathType[]`
          (`{ path, type }`), только скалярные листья, значений нет вообще.

          Почему не сам ответ: сведение работает на ТИПАХ, содержимое нужно лишь как источник
          структуры. Плюс проба уезжает на бэк, а в живом ответе — реальные данные чужого
          продакшена. Пути — JSON Pointer, те же, что у `FieldRule.from`/`.target`, поэтому выбор
          из мастера уходит в правило без конвертации.

          Есть описание формы ответа — проба не нужна: источник меняется, формат `PathType[]`
          остаётся. Обратного хода (`PathType[]` → zod) в `io` нет и не предполагается — скелет
          описывает, но не валидирует; ограничение назвал владелец зоны `io` 2026-09-18. Решения
          user 2026-09-18, кода нет.

          Хранение скелета ОТЛОЖЕНО (решение user 2026-09-19): сегодня форма входа берётся с
          живого ответа в момент настройки и никуда не кладётся, а форма выхода читается из
          паспорта формы потребителя (`@web-core/io`, тот же плоский `PathType[]` через
          `describeSchema` — пробы там не нужно вовсе). Адаптер работает только с теми, у кого
          паспорт есть: что не читается, то не обрабатывается.

          Когда до хранения дойдёт, место ему — ЛИСТ дерева поставщика
          (`providers.api[presetId][endpointId]`, см. `adapter-keeps-two-lists`), а не отдельное
          поле записи: форма это свойство того, кто ДАЁТ, привязанное к конкретной ручке, а
          отдельным полем она стала бы одной на всех поставщиков дерева, хотя каждый проверялся на
          своём ответе. Смотрим это в самом конце, когда механика устоится и её поюзают, — и тогда
          же случай «потребитель без паспорта», если он вообще всплывёт: сегодня user склоняется к
          тому, что паспорт заводит сам потребитель, а не мы храним за него скелет.

      - id: presets-kind-request
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Заявка в `backend/presets`: новые виды пресета"
        description: |
          Означает: наши записи едут на бэк пресетов наравне с прочими — теми же ярлыками, что
          стоят у записи локально (`preset-has-kind`). `backend/presets` — ЧУЖАЯ зона со своим
          реестром видов (`internal/kinds`, Go-структура на границе GraphQL), поэтому это не правка
          на месте, а заявка владельцу через architect.

          Подана 2026-09-20 разбором с user. Видов ТРИ, а не два: к `api` и `adapter` добавился
          `menu` — набор адаптеров одного приложения (`menu-is-the-container`). Вместе с видами
          ушли отбор по имени и приём айди от клиента: оба нужны не только нам, разбор — в
          `backend/presets/ROADMAP.yaml` (`feeder-kinds`, `presets-by-name`, `client-supplied-id`).

          Вопрос про объём закрыт замером, а не догадкой: swagger 2.0 Kubernetes — 3.0 МБ сырья и
          1.21 МБ в нашем формате, то есть предел записи службы (1 МиБ) пробит первым же крупным
          настоящим API. Это конфигурация стенда, а не код бэка — обе границы задаются окружением,
          заявку на стенд user отдаёт сам.

      - id: api-kind-is-showcase-only
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "Записи вида `api` живут только в витрине, адаптер уезжает в приложения"
        description: |
          Означает: у двух видов записи разная судьба, и это решает, что с ними делать дальше.
          Документ схемы — фича витрины: человек завёл ручки своего бэка и наполняет ими компонент
          на экране студии. В обычные приложения вид не едет вовсе, связей и отбора ему не нужно.
          Адаптер наоборот — уезжает в приложение, как скин: либо по сети, либо файлом в сборке.

          Следствие, которое иначе всплыло бы поздно: дерево поставщиков адаптера адресует документ
          схемы его айди, и в приложении эта ссылка указывает в пустоту. Для перекладки это
          безвредно — `feed` читает только `root` и `rules`, — и принято сознательно, а не
          обнаружено потом. Постановка user 2026-09-20.

      - id: record-has-two-names
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "У записи два имени: машинное для ссылки и человеческое для списка"
        description: |
          Означает: `Preset { id, kind, label, name?, content }`. Человеческое имя — `label`,
          свободная строка, есть всегда: его показывает список, правит диалог конфига
          (`PRESET_CONFIG`) и собирает мастер сведения из адресов («user-card ← endpoint-3»).
          Машинное — `name` по маске службы (`PRESET_NAME`, `^[a-z0-9][a-z0-9-]{0,31}$`),
          уникальное в пределах вида; `presetNamed(kind, name)` ищет по нему.

          Разведение повторяет конверт службы, изобретать своё незачем. Несимметрично по видам: у
          `adapter` машинное имя обязательно по смыслу (на нём держится `adapter="users-list"` в
          разметке), у `menu` тоже — по нему приложение грузит свой набор; у `api` не нужно вовсе,
          эти записи человек выбирает глазами в списке. Решение user 2026-09-20.

          Машинного имени у заведённой записи НЕТ: `add(kind, label, content)` его не принимает, а
          `name` необязателен. Всё, что человек делает на экране, остаётся в локальном складе, и
          идентификатор он называет ровно тогда, когда сам сохраняет запись в службу, — иначе
          мастер прерывал бы перетаскивание вопросом про имя. Постановка user 2026-09-21.

          Ломающее: `add` принимает `label`, `rename` теперь ставит МАШИННОЕ имя, человеческое
          правит `relabel`, `PRESET_CONFIG` несёт `label`, `PresetInfo` — `label`/`onLabel`,
          `AdapterMastering` — проп `label`. Хранения между сессиями нет, мигрировать нечего —
          версия минор. Закрыто 2026-09-21.

      - id: adapter-is-worn-by-name
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "Адаптер подключается к компоненту по имени, как вариант одевает компонент"
        description: |
          Означает: в приложении адаптер не ищется по паре участников и не выбирается кодом — его
          ставят туда, где он нужен, и называют: автор пишет `adapter="users-list"`, и компонент
          кормится этой записью. Приём тот же, которым компонент одевается вариантом
          (`data-variant`), и назван он так постановкой user 2026-09-20.

          Следствие для деревьев: `providers`/`consumers` — ВИТРИННОЕ знание, отметка «на этих
          проверяли через студию». Рантайм их не читает вовсе, а `adapterFor`/`partnersOf`
          остаются инструментом студии. Поэтому отбор записей по потребителю на стороне службы не
          нужен: приложение берёт своё меню целиком.

          Чего ещё нет: самой обвязки, которая читает имя у компонента и находит запись. Чья это
          зона и как она устроена — не решено, отдельный разговор.

      - id: menu-is-the-container
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "`menu` — набор адаптеров одного приложения, симметрия наряду скина"
        description: |
          Означает: третий вид записи — `{ adapters }`, где `adapters` это машинные имена записей
          вида `adapter`. Приложение грузит своё меню по имени одним запросом и получает адаптеры
          разом; дальше компонент находит свой по имени в уже загруженном, в сеть не ходя.

          Имени ВНУТРИ содержимого у вида нет: имя записи живёт в её конверте, а второе такое же
          рядом разъехалось бы с первым молча. В первой формулировке заявки оно было — недосмотр,
          пойманный на ревью живым прогоном (`menu-name-is-dead`, `backend/presets/ROADMAP.yaml`).

          Причина: имена адаптеров разбросаны по разметке, и заранее их список знает только само
          приложение. Без контейнера ему пришлось бы тянуть ВСЕ адаптеры хранилища, включая чужие.
          У скина ту же задачу решает наряд, который перечисляет свои формы, — заводить под одну
          задачу второй приём незачем.

          Имя вида выбрано user 2026-09-20: наряд надевают целиком, меню целиком подают. Вариант
          `io` отвергнут — слово занято движком перекладки (`@web-core/io`) и называет поток
          данных, а не набор записей.

      - id: storage-talks-to-the-service
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Склад начинает ходить в службу пресетов — сегодня он целиком в памяти"
        description: |
          Означает: `presetsStore` — модульный синглтон без сети, хранения между сессиями нет
          вовсе; `hydrate` есть, а наполнять его некому. Пока это так, решения о видах и конверте
          проверить нечем: первая настоящая сверка контракта (имена, размер, форма содержимого)
          случится ровно тогда, когда записи поедут в службу. Служба к приёму готова — три вида
          заведены, отбор по имени и приём нашего айди сделаны и проверены живьём
          (`feeder-kinds`, `presets-by-name`, `client-supplied-id` в `backend/presets/ROADMAP.yaml`).

          **Отправка — по отдельному действию человека, а не на каждую правку** (решение user
          2026-09-20). Склад остаётся источником правды на сессию: «+» на группе, переименование,
          связь в мастере правят его мгновенно и локально, как сейчас, а в службу запись уезжает,
          когда человек закончил мысль и нажал сохранить. Причина прямая: правка состава — это
          замена содержимого ЦЕЛИКОМ (частичной у службы нет и не будет), то есть мегабайтный
          документ на каждое нажатие; плюс при обрыве связи экран разошёлся бы с хранилищем молча.
          Тот же приём уже работает в диалоге конфига (`config-dialog-edits-the-node`).

          **Адрес службы пакет не держит.** Клиент приходит снаружи готовым — приложение собирает
          его один раз через `createGraphQLClient` из `@web-core/query/graphql` (тонкий клиент без
          своего кэша, поверх смонтированного в приложении solid-query) и отдаёт зоне. Формой
          передачи распоряжается овнер — модульная настройка симметрично самому складу-синглтону
          или контекст, — но инвариант жёсткий: ни адреса, ни заголовков в коде пакета, и своего
          клиента зона не пишет.

          **Что уезжает в конверт.** `Preset { id, kind, name, content }` → `PresetInput`:
          `id` — наш, тот самый, с которым запись родилась; `kind` — наш ярлык как есть;
          `state` — `content` целиком; человеческое имя — в `label`; машинное — в `name`, и только
          у `adapter`/`menu` (у `api` его нет вовсе, поле необязательное). Предусловие — развести
          два имени у записи (`record-has-two-names`): пока имя одно, конверт не собрать честно.

          **Что приезжает.** Чтение — по виду (`presets(kind:)`), а не всё хранилище разом: экран
          схем берёт `api`, мастер и витрина потребителя — `adapter`. Отбор по имени
          (`presets(name:)`) нужен там, где запись адресуют именем. Приехавшее кладётся в склад
          `hydrate`; экраны как читали склад, так и читают — второго источника для них не
          появляется. Своего кэша зона не заводит: механизмов выборки в цепочке и так три, и
          четвёртый здесь был бы прямым вредом.

          **Отказы службы называются словами, а не глотаются.** Их пять, и все человекочитаемые
          (машинных кодов у службы сегодня нет): имя занято в этом виде, айди занят другой
          записью, запись больше предела, хранилище полно, содержимое не подошло под форму вида.
          Отдельно — сеть не ответила вовсе: это не отказ службы, и путать их нельзя (тот же
          разрез, что у `invokeEndpoint`, — см. FAQ.md).

          **Состояние записи на экране.** У записи появляется различие «есть только у меня» и
          «уехала в службу», и его обязано быть видно: иначе человек закроет вкладку, считая, что
          сохранил. Вид этого признака — за овнером, факт его наличия — нет.

          В объём НЕ входит: загрузка меню приложением в рантайме и обвязка, читающая имя у
          компонента (`adapter-is-worn-by-name`); экран самого меню (`menu-has-no-code`);
          разрешение конфликтов, если одну запись правят из двух мест разом — сегодня писателей
          один, и заводить механику под ненаблюдаемый случай рано.

          СДЕЛАНО 2026-09-21 — разговор со службой (`entities/preset/api`, зовётся пока из кода):
          `connectPresets(client)` принимает готовый клиент снаружи, `loadPresets(kind, names?)`
          читает по виду и по машинному имени, `savePreset` заводит запись с нашим айди или
          заменяет уехавшую (различает по `savedAt`), `dropPreset` удаляет, `failureOf` разводит
          отказ службы, молчание сети и неподключённый клиент. Какие поля у вида в схеме службы,
          говорит реестр форм (`definePresetShape`), заполняют его фичи — `API_SHAPE`,
          `ADAPTER_SHAPE`; `menu` не объявлен, его в зоне нет (`menu-has-no-code`). У записи
          появилось `savedAt` и действие склада `markSaved` — это же и признак «уехала в службу».

          ОСТАЛОСЬ: экран — кнопка «Сохранить» с полем машинного имени, показ трёх родов отказа
          словами, видимый признак «есть только у меня», подъём записей в склад при старте.

      - id: menu-has-no-code
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Вида `menu` в зоне нет вовсе — ни ярлыка, ни стража, ни экрана"
        description: |
          Означает: служба вид уже принимает, а у нас о нём нет ни строки — ни `MENU_KIND` рядом с
          `API_KIND`/`ADAPTER_KIND`, ни типа с его стражем, ни экрана, на котором набор собирают
          руками. Собирать меню сегодня негде: адаптеры заводятся мастером по одному, а что из них
          берёт конкретное приложение, сказать некому.

          Отдельным пунктом, а не частью транспорта: подключение к службе имеет смысл и на двух
          сегодняшних видах, а меню — это ещё один экран и ещё одно решение о том, кто его правит.

  - category: Тождество узлов и резолв Solid
    items:
      - id: lists-keyed-by-identity
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Аккордеон схлопывался на любой правке — списки сверялись по ссылке"
        description: |
          Означает: `<For>` опознаёт элемент по ссылке на объект, а ссылки в этой цепочке новые
          всегда — `presetsStore` иммутабельный (path copying отдаёт новый объект пресета на
          каждую правку), `groupEndpoints` пересобирает группы на каждое чтение пропа. Узел
          сносился вместе с DOM, а в нём живёт состояние zag-машины: открытость секции, фокус,
          введённое. При этом устойчивый ключ был — `Box` уже принимал `itemKey` и отдавал его
          только в `value` аккордеона, в сверку не подавая.

          Починено `<Key each by>` из `@web-core/solid/keyed` в `Box`, `ApiCatalog` и
          `Presets`; `children` у `Box`/`Endpoints`/`Presets`/`PresetCard` стали аксессорными —
          узел остаётся тем же, меняется то, что он показывает. Тесты на тождество DOM-узлов:
          удаление ручки не пересобирает соседей, новый объект с тем же ключом обновляет узел.
          Разбор — FAQ.md, «Списки и тождество узла».

      - id: solid-through-own-package
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Импорты Solid — только через `@web-core/solid`"
        description: |
          Означает: 32 файла переведены с `solid-js`/`solid-js/web` на `@web-core/solid` и
          `@web-core/solid/web`, прямых импортов вендора в зоне не осталось. Правило чужое (зона
          `packages/solid`): один модуль-синглтон на репозиторий и одна точка, где решается
          версия. Оттуда же приехал `<Key>` — примитив комьюнити, взятый пакетом готовым, а не
          переписанный у себя.

      - id: zag-ignores-synthetic-click
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Состояние компонента кита в тестах гоняется пропом, не кликом"
        description: |
          Означает: Ark-UI на Zag в jsdom не реагирует на синтетический клик — аккордеон не
          открывается ни от `.click()`, ни от `dispatchEvent`, `onValueChange` не стреляет; при
          этом контролируемый `value` работает штатно. Тот же класс сложностей известен по
          floating-UI-компонентам. Поэтому поведение, завязанное на внутреннее состояние кита,
          проверяется через `value`/`onValueChange`, а структура DOM — структурой. Проверено
          2026-09-19.

      - id: vitest-inlines-kit-deps
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "`test.server.deps.inline` под Ark-UI/Zag/Kobalte"
        description: |
          Означает: эти пакеты внутри `@web-core/ui` отдают непреобразованный `.jsx` по
          `solid`-condition, а vitest по умолчанию грузит зависимости из `node_modules` напрямую
          через Node — голый `.jsx` там не парсится. `server.deps.inline` прогоняет их через
          `vite-plugin-solid`. Найдено эмпирически на первом компонентном тесте.

  - category: Гигиена
    items:
      - id: tests-typechecked
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Папка `test` не типизировалась вообще"
        description: |
          Означает: `tsconfig.json` включал только `src` и `vite.config.ts`, а `pnpm lint` и
          `pnpm typecheck` ходят по нему же — значит тесты не проверял никто, ни tsc, ни vitest
          (он типы не считает). Канон репозитория другой: `packages/io`, `store`, `generators`,
          `solid` держат `["src", "test", "vitest.config.ts"]`.

          Что всплыло сразу, как включили: два теста строили `OpenapiEndpoint` и подавали его
          туда, где ждут `EndpointDescriptor` (у первого нет `params` вообще) — рантайм это
          переживал, потому что `groupEndpoints` читает только `tag`; заглушка `fetch` была
          объявлена без аргументов, из-за чего `mock.calls[0][0]` читался из пустого кортежа;
          два помощника в тесте каталога лежали мёртвыми.

      - id: dead-weight-removed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Мёртвый груз вычищен: неиспользуемые экспорты и тесты снесённого кода"
        description: |
          Означает: снесён реэкспорт в одну строку, которым никто не пользовался, и константа
          набора значений `ParamIn`, не звавшаяся ни в `src`, ни в `test` (сам тип живой). Пять
          тест-файлов, не собиравшихся на импортах несуществующего кода, удалены. Группа ручек без
          группы названа `unknown`. Решения user 2026-09-19.

      - id: docs-cut-to-the-code
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "README/FAQ/EXAMPLES/ROADMAP вычищены от описаний несуществующего кода"
        description: |
          Означает: доки описывали снесённый пересборкой API целыми разделами — виджеты, сторы,
          провайдеры и приложение-потребитель, которых в коде нет. Всё вырезано; EXAMPLES и README
          переписаны от кода целиком, этот файл сведён к живому и запланированному — по требованию
          user 2026-09-19 журнал снесённого не хранится даже ради истории.

          Из FAQ убраны и два утверждения, противоречивших коду: «хранить сырой текст» (отменено
          `no-raw-kept`) и состав адаптера без списков потребителей.

      - id: store-parametrized-selectors
        type: decision
        status: Backlog
        priority: Low
        milestone: null
        name: "Параметризованные селекторы `@web-core/store` не проходят свою же типизацию"
        description: |
          Означает: `SelectorsShape<T>` (`(state, ...args: never[]) => unknown`) не принимает
          `(state, id: string)`, а при трёх явных аргументах типа перегрузка
          `createActionStoreFamily` уводит селекторы в параметр ключа `K`; рантайм их поддерживает
          (`fn.length > 1`), `dist/*.d.ts` пакета вдобавок отстал от `src`. Чужая зона — находка
          отдана наверх.

          Своего повода у feeder больше нет: обходом была функция `adapterBy`, а она уходит вместе
          со стором адаптеров (`adapter-has-no-store-of-its-own`). Пункт остаётся как переданная
          наверх находка чужой зоны, а не как наш долг.

log:
  - id: mastering-and-adapter-model
    type: plan
    date: 2026-09-20
    summary: >
      Заход закрыл вторую половину пути пакета — от «поля перетаскиваются» до «потребитель получает
      готовый объект». Шли мелкими итерациями, каждую user смотрел живьём в студии и правил курс.

      Сначала интерфейс. Две колонки списков (`mastering-screen`), потом перенос, потом вид: слот
      стал лункой с приглашением, заполненный — чипом с крестиком, а во время переноса каждый слот
      отвечает, чем обернётся бросок (`fitOf`). Дважды упёрлись в чужое и оба раза не стали гнуть:
      `listbox` кита гасит `mousedown` и убивает нативный DnD — ушли на свою разметку; ролей
      палитры под типы данных не хватало и они врали смыслом — подали заявку, зона завела механику
      собственных категорий, и бейджи встали на `type-*`. Перенос взяли готовый
      (`@atlaskit/pragmatic-drag-and-drop`), сверив рынок: у кита DnD нет, у solid-dnd последний
      релиз 2023 года.

      Потом модель. Стор адаптеров снесён целиком (`adapter-entity-stale`): он раскладывал записи
      по ручкам, то есть держал ровно то свойство, которое отменено решением «шву безразлично, кто
      его кормит». Запись стала жильцом склада под ярлыком `adapter`, связь получила выданный айди
      (`adapter-rule-has-id`), появились правки над черновиком и поиск по паре участников.

      Третьей частью пришла заявка owner-studio-app, и она вскрыла настоящую дыру: `applyAdapter`
      отдавал СПИСОК записей, а потребителю нужен ОДИН объект его формы — собрать `{ items: [ … ] }`
      было нечем. Закрыто `feed`, где род правила определяет позиция цели: индекс в пути значит «на
      каждую запись», его отсутствие — «одно значение на объект» (`feed-assembles-consumer-shape`).
      Следом `serve` (вызов, сразу отдающий еду), перечисление партнёров, регистрируемые виды
      участника вместо закрытого объединения и `ApiProbe` — каталог без правки состава.

      По дороге дважды пришлось повторять чужое (разбор JSON Pointer и запись по нему) — заявка в
      `io` подана и закрыта, копии в зоне не осталось. Пагинация из заявки механикой не стала:
      выяснилось, что это обычные параметры ручки.

      Вторым кругом owner-studio-app показал, что кирпичи сделаны, а сценарий витрины из них не
      складывается: каталог не знал про потребителя, вызов не знал про адаптер, склад не отдавался
      сам. Закрыто тем же заходом — `ApiProbe` берёт `consumer` и зовёт `serve`
      (`api-probe-screen`), склад отдаёт записи приведёнными (`storage-gives-records`). Там же
      нашлась ошибка в отчёте `feed` (`feed-counted-absent-rules`).

      Третьим кругом заявки закрылся корень набора (`adapter-root-unset`): он выводится из пути
      источника, потому что человек уже назвал его мышью. Разговор занял больше, чем правка, —
      и заслуженно: сперва я объяснял механику через внутренности (`collectRowsReport` «видит
      объект вместо массива»), а надо было показать то, что видно человеку: три записи на входе,
      одна строка на выходе.

      Итог: lint, typecheck и 228 тестов зелёные (было 152). Живой браузер впервые за историю зоны
      был — мастер проверен на настоящем переносе, со скриншотами и замером состояний. Открытым
      осталось: `root` записи никто не выбирает (`adapter-root-unset`), отчёт не показан на экране
      (`adapter-report-visible`), связать без мыши нельзя (`mastering-has-no-keyboard-path`).

  - id: node-config-dialog
    type: plan
    date: 2026-09-19
    summary: >
      Заход про одно: как узел каталога правится человеком. Сначала у `Box` завелось событие
      `onConfig` — кнопка «Настроить» рядом с «+» и корзиной на каждом узле, наружу едет сам узел
      (`node-sends-itself-on-config`). Имя события названо user'ом, и переименовывать его «по
      конвенции соседних пропов» было ошибкой, стоившей нескольких кругов: имя из ТЗ ставится
      буквально, а если два случая просятся под одно имя — различие уезжает в необязательный
      аргумент, а не во второй проп.

      Дальше — сама правка. Разобрано до кода и записано решением
      (`config-dialog-edits-the-node`): узел ловит диалог, форму строит по зод-схеме вида узла,
      схему даёт владелец узла (`entities/openapi` — группу и ручку, `entities/preset` — имя
      записи), пишет сам диалог, а вид узла едет ЯРЛЫКОМ, не вычисляется из структуры. Правка
      копится локально и уезжает в склад по «Сохранить» — у формы конфига полей много, и запись на
      каждый символ означала бы поток правок из незаконченной мысли.

      Тем же заходом закрылись два старых пункта: заведённую ручку стало чем заполнить
      (`manual-endpoint-editing` — развилка решена в пользу зод-схемы дескриптора) и появился
      экран переименования группы и записи (`group-renaming`). Описание параметра при правке
      переживает форму, пока не меняли тип: `$ref` остаётся ссылкой, а не пустым объектом.

      Итог: lint, typecheck и 152 теста зелёные (было 146). Заодно подпись узла ручки стала одним
      методом, без урла (правка user'а), и тесты, читавшие урл из заголовка, переписаны на то, что
      видно: узел отдаёт урл своим содержимым, а состав каталога считается по числу узлов.
      Живого браузера снова не было.

  - id: storage-mechanics-pulled-out
    type: plan
    date: 2026-09-19
    summary: >
      Заход начался как разбор адаптера, а первым делом уехал в склад: у пресетов появился второй
      потребитель, и стало видно, что часть общих механик забрал себе экран схем. Разбор шёл
      вопросами, решения по каждому принимал user, и до кода была записана вся модель адаптера —
      личность снаружи (`adapter-identity-is-outside`), два дерева пользователей по роли
      (`adapter-keeps-two-lists`), одна запись на одно направление (`adapter-is-one-way`), своего
      стора нет (`adapter-has-no-store-of-its-own`).

      Сделан при этом склад, а не адаптер: иначе адаптер пришлось бы переписывать под общие
      механики сразу после. У записи завёлся вид ярлыком (`preset-has-kind`) — тем же приёмом, что
      у службы пресетов, где вид лежит на уровне записи, а состояние остаётся непрозрачным. Перебор
      записей, страж содержимого и правка черновиком переехали в склад
      (`listing-belongs-to-the-storage`, `record-comes-with-its-editor`): каталог схем теперь
      говорит только вид, страж и что рисовать в узле, а `<Key>`, пустое состояние и
      `presetsStore.actions.edit` не пишет вовсе. Карточка снесена за отсутствием потребителя
      (`preset-card-removed`), загрузчик уехал в `shared/ui` под именем `RawLoader`
      (`loader-is-a-supply-form`) — складу сырьё не принадлежит, а загрузка это форма поставки
      любого содержимого.

      Заодно вскрылось, что `Presets` не был зван ни одним экраном зоны — только тестом и
      экспортом наружу, — из-за чего дубль перебора в каталоге никто не замечал.

      Итог: lint, typecheck и 143 теста зелёные (было 136). Ломающее для публичных экспортов:
      `add` принимает вид первым аргументом, `Preset` несёт `kind`, `PresetCard` и `PresetLoader`
      из поверхности ушли — версия минор. Живого браузера снова не было.

  - id: groups-replace-tags
    type: plan
    date: 2026-09-19
    summary: >
      Заход шёл от интерфейса к модели и закончился сменой концепта. Сначала каталог научился
      отдавать ответ наружу — `onResult` с происхождением (`presetId` + ручка), иначе снаружи
      непонятно, какая из десятков ручек ответила. Потом завелась правка состава кнопками, и на
      ней вскрылось старое: «+» заводил ручку с тегом `new`, повторные нажатия копили ручки в
      один тег, а переименовать тег было нельзя в принципе — группировка держалась на ИМЕНИ, и
      правка имени для списка означала другую группу.

      Разрез предложил user (он же architect): тег фактически работал группой, значит группа
      должна стать записью со своим айди, а тег — уйти. Так и сделано: `Group { id, name }` в
      документе, `groupId` у ручки, `tag` снесён отовсюду, кроме словаря входного слоя. Теги
      свагера превращает в группы `identify` — той же дверью, что выдаёт айди ручкам. Пустая
      группа стала законной, и «+» на схеме теперь заводит именно её, а не ручку с выдуманным
      тегом.

      По дороге разобран узел ручки: `Endpoint` = `Config` (форма) + `Call` (вызов), барель
      отдаёт первые два, `Config` внутренний — место под будущую настройку дескриптора. Каталог
      переименован в `ApiCatalog` целиком, вместе с папкой и типом события. Мёртвый
      `entities/openapi/ui/endpoint.tsx` снесён.

      Итог: lint, typecheck и 136 тестов зелёные. Живого браузера снова не было, а `apps/studio`
      на снесённых именах не соберётся — отдано наверх (`studio-import-rename`).

  - id: endpoint-identity-fixed
    type: plan
    date: 2026-09-19
    summary: >
      Продолжение разбора тождества, начатого в прошлый заход: у ручки завёлся собственный айди.
      Прежний ключ `метод + url` держался ровно до первой правки урла — а правят его на том же
      экране, где показывают, — и ломал и узел аккордеона, и адресацию удаления; две ручки с
      одинаковым методом и урлом были для списка одной.

      Разрез принят user: внутри пакета существует ТОЛЬКО наша схема, и превращает в неё чужой
      документ одно место — входной слой. Шаблон формата отдаёт `IncomingDocument` (наш документ
      до простановки айди) и про айди не знает даже типом; `parseSchema` прогоняет его через
      `identify`; `asSchemaDocument` требует `id` как признак нашего формата, а не чинит
      содержимое на лету. `endpointKey` снесён целиком, включая публичный экспорт.

      По дороге нашлось, что папка `test` не типизировалась вообще (`tsconfig.json` не включал
      её, при том что весь остальной репозиторий включает). Включили — и сразу вылезли два теста,
      подававшие `OpenapiEndpoint` вместо дескриптора, и заглушка `fetch` без аргументов.
      Починено там же.

      Итог: lint, typecheck (впервые вместе с тестами) и 115 тестов зелёные. Живого браузера
      по-прежнему не было.

  - id: docs-and-identity-cleanup
    type: plan
    date: 2026-09-19
    summary: >
      Заход начался с бага «аккордеон дёргается при правке пресетов» и раскопался до общей
      причины: списки в пакете сверялись по ссылке на объект, при том что стабильный ключ был
      объявлен пропом `itemKey` и в сверку не подавался. Иммутабельный стор отдаёт новый объект на
      каждую правку, `groupEndpoints` пересобирает группы на каждое чтение — узел сносился вместе
      с DOM и уносил состояние zag-машины. Починено `<Key each by>`; попытка написать свой аналог
      была отбита user как самопал, вместо неё зона `packages/solid` завела примитив готовым, и
      feeder встал на него.

      Дальше по требованию user вычищено всё наследство пересборки: снесены пять тест-файлов, не
      собиравшихся на импортах несуществующего кода, и пара неиспользуемых экспортов; импорты
      Solid переведены на `@web-core/solid` во всех 32 файлах зоны. Доки переписаны от кода — FAQ потерял больше трети записей, EXAMPLES и
      README переписаны целиком, этот файл сведён к живому и запланированному.

      Две находки, поднятые по ходу и решённые user: адаптер — шов, которому безразлично кто и
      кому, со списками проверенных поставщиков и потребителей айдишниками (код этому пока не
      соответствует, `adapter-entity-stale`); пресет хранит разобранный документ, а не сырьё, и
      прежняя запись FAQ об обратном была ложью. Отдельно найдено, что у ручки и тега нет
      собственного айди — опознаются содержимым, которое юзер правит
      (`endpoint-identity-is-derived`).

      Итог: lint, typecheck и 111 тестов зелёные, `pnpm test` по зоне чист впервые за пересборку.
      Живого браузера не было.

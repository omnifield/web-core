# Дорожная карта @web-core/feeder — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у packages/io, packages/store, packages/assembly, packages/router (categories → items,
# log — журнал решений); без milestones — у пакета нет освоенной поставки с датами релиза, только
# сделанное и открытое.
#
# Записи про снесённый код здесь НЕ хранятся — даже ради истории. Пакет пережил пересборку, и
# журнал, описывающий несуществующие виджеты, читается как описание живого кода и врёт.

categories:
  - category: Фундамент слоя interfaces
    items:
      - id: workspace-registered
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/*` в `pnpm-workspace.yaml`"
        description: |
          Означает: корень воркспейса зарегистрирован рядом с `packages/*`/`products/*`/`apps/*` —
          pnpm видит пакеты внутри `interfaces/` без вложенного воркспейса (вложенные pnpm не
          поддерживает, см. комментарий в файле).

      - id: feeder-package-scaffold
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`interfaces/feeder` — скелет пакета"
        description: |
          Означает: `package.json` (`@web-core/feeder`, `vite build`, `solid-js` peer),
          `tsconfig.json`, `eslint.config.js` (пресет `@web-core/lint`), `vite.config.ts`
          (`defineLibraryConfig`, один вход `index`, `solid: true`), `vitest.config.ts`.

      - id: fsd-layers-adapted
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптированный FSD: entities/features/widgets не в бизнес-смысле, без app/pages"
        description: |
          Означает: `entities` — структурная модель движка (склад пресетов, документ API, дерево
          формы, адаптер), не бизнес-сущность; `features` — фичи интерфейса (загрузить документ,
          показать каталог, дёрнуть ручку), не бизнес-операция; `widgets` — сборка entities и
          features в готовый экран. `app`/`pages` не заведены: пакет не приложение с роутингом,
          вход наружу — экспорты, не маршруты. Разбор — FAQ.md.

  - category: Модель API
    items:
      - id: swagger2-recognized
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Распознавание Swagger 2.0 в наш формат документа"
        description: |
          Означает: `swagger2Template` — свой `MappingTemplate` на механизме
          `@web-core/generators/mapping`, совпадение жёсткое (`isEntry` смотрит на `swagger: "2.0"`).
          `parseSchema(raw)` прогоняет документ через список шаблонов; не подошёл ни один —
          исключение с перечислением, что пробовали. Тесты — урезанный настоящий petstore,
          включая вложенные `$ref` и защиту от циклов через `z.lazy`.

      - id: our-endpoint-format
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Наш формат ручки — данные, не зод"
        description: |
          Означает: `SchemaDocument { endpoints, defs }`, ручка —
          `{ method, url, tag?, params: [{ name, in, required, schema }] }`, где `schema`
          параметра — JSON Schema, а `defs` держит общие типы документа (`$ref` остаются
          ссылками, циклы не разворачиваются). Плоский `{имя, тип, обязателен}` отвергнут: он
          беднее того, что мы уже читаем из свагера (тело-объект, енумы, массивы, вложенность),
          и терял бы это прямо на импорте.

          Зод строится из формата при отрисовке (`endpointOf`/`schemaNodeToZod`) и нигде не
          хранится — он не сериализуется и на бэк не уедет.

      - id: no-raw-kept
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сырьё не храним — чужой формат разбирается один раз на входе"
        description: |
          Означает: если хранить сырьё, то КАЖДАЯ манипуляция обязана сначала выяснить, что это за
          формат и как его читать, — и так на сто форматов вперёд. Поэтому чужой документ
          распознаётся ОДИН раз, при загрузке, и дальше не существует: после импорта нет ни
          Swagger 2.0, ни любого другого — есть наш документ.

          Следствие, ради которого всё и затевалось: правка ручки не упирается в сериализацию
          чужого формата, и флоу один — и для загруженных схем, и для заведённых руками. Решение
          user 2026-09-19.

      - id: endpoint-has-own-id
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "У ручки собственный `id`, выданный при разборе; `endpointKey` снесён"
        description: |
          Означает: `EndpointDescriptor.id` — обязательное поле, uuid, ни от чего не производное.
          Им ручка опознаётся в списках (`Endpoints` ключует по `id`) и в правках состава
          (`removeEndpoint` ищет по `id`).

          Прежний ключ `endpointKey` = `метод + url` разъезжался с сущностью ровно там, где эти
          поля правят, — на экране каталога: правка урла сносила узел вместе с открытостью
          аккордеона, а удаление целилось не туда, куда ткнул человек. Плюс две ручки с
          одинаковым методом и урлом были для списка одной. Функция снесена целиком, включая
          публичный экспорт пакета — ломающее изменение, версия минор.

          Решение user 2026-09-19.

      - id: id-is-stamped-at-the-door
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Айди ставит входной слой, а не шаблон формата и не склад"
        description: |
          Означает: `parseSchema` — единственная дверь: принимает чужой документ, отдаёт наш
          формат с проставленными айди (`identify` в `models/edit`). Шаблон формата объявлен
          через `IncomingDocument` (наш документ ДО простановки айди) и про айди не знает —
          следующий шаблон физически не сможет их забыть. Склад ни при чём: `content` для него
          непрозрачен.

          Следствие для чтения: `asSchemaDocument` айди на лету не выдаёт (на чтении это плодило
          бы новый айди на каждый кадр) — он требует `id` у ручки как признак нашего формата.
          Ручка без айди — не наша схема, и внутрь пакета она не проходит.

          Решение user 2026-09-19.

      - id: tag-identity-is-derived
        type: decision
        status: Open
        priority: Medium
        milestone: null
        name: "У тега собственного айди нет — опознаётся именем"
        description: |
          Означает: тег не запись, а компоновка ручек — `groupEndpoints` собирает группы заново на
          каждое чтение, и узел тега ключуется собственным именем. Переименуют тег — для списка
          это другая группа, со всеми последствиями для открытости аккордеона.

          Сегодня не ломается: переименования тега в коде нет вообще (`models/edit` знает только
          `removeTag`). Закрывать придётся вместе с заведением правки тега. Найдено 2026-09-19.

  - category: Пресет как склад
    items:
      - id: preset-is-neutral-storage
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "`entities/preset` — нейтральный склад, openapi его потребитель"
        description: |
          Означает: сущность — именованная пользовательская запись, которая уедет в
          `backend/presets`: `Preset { id, name, content }`, где `content` для склада НЕПРОЗРАЧЕН.

          Разрез — склад и потребитель, оба друг о друге не знают: складу неважно, кто и что в
          него завёз, потребителю неважно, на каком складе лежит его формат. Поэтому
          `entities/preset` не знает про ручки, `entities/openapi` не знает про склад, и ни один
          не импортирует другой — сводит фича. Слово «схема» отвергнуто: оно занято смыслом
          «описание формы», а у склада завтра будут другие потребители. Решение user 2026-09-19.

      - id: preset-store-and-ui
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Склад: стор, карточки, загрузчик документа"
        description: |
          Означает: `presetsStore` (`add`/`remove`/`rename`/`replace`/`edit`/`hydrate`, селектор
          `presetBy`), айди — uuid при создании и ни от чего не производный. UI склада —
          `Presets`/`PresetCard`/`PresetInfo`/`PresetLoader`, экран загрузки —
          `ExternalSchemaLoader` (файл или вставка → `parseSchema` → пресет).

      - id: single-line-input-ate-newlines
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Однострочный `<input>` молча резал вставленный документ"
        description: |
          Означает: поле под документ было `FieldInput`, а однострочный `<input>` по спеке
          вырезает переносы строк при нормализации значения — вставленный YAML превращался в одну
          строку и переставал разбираться. Тихо: ни ошибки, ни следа, документ просто «не
          распознавался». Найдено тестом на живой вставке petstore. Чинится `FieldTextarea` в одну
          строку — вид тот же, текст цел.

      - id: paste-from-clipboard
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Вставка кнопкой вместо поля ввода"
        description: |
          Означает: поле под документ существует только чтобы принять вставку — юзер в него ничего
          не печатает. Вместо него кнопка «Вставить», читающая буфер напрямую. Компонент делает
          владелец `packages/ui`, зона переедет на него, когда он появится (решение user
          2026-09-19); до тех пор — текстареа.

          Сверку по поддержке буфера в браузерах НЕ проводили: до неё не дошли. Провести её обязан
          тот, кто будет делать компонент — доступ к чтению буфера исторически разный у браузеров
          и требует разрешения.

  - category: Каталог и вызов
    items:
      - id: catalog-screen
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`SchemaCatalog` — состав API: теги → ручки → параметры"
        description: |
          Означает: каталог читает склад напрямую, пропов не принимает. На каждый пресет, похожий
          на документ API (`asSchemaDocument`), рисуется состав: группировка по тегам
          (`groupEndpoints`, ручки без тега — в группу `unknown`), под ручкой — форма параметров и
          вызов. Правки состава идут immer-черновиком через `presetsStore.actions.edit`.

      - id: endpoint-call
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Вызов ручки: форма параметров по схеме и живой HTTP"
        description: |
          Означает: `endpointOf(descriptor, defs)` строит зод параметров, `TreeForm` рисует по нему
          форму, `useInvoke` держит `result`/`failure`/`pending`, `invokeEndpoint` выполняет вызов
          поверх `rawRestRequest` (`@web-core/query/rest`). Путь/квери/тело раскладываются из
          одного значения: имя из `{плейсхолдера}` url — в путь, ключ `body` — в JSON-тело,
          остальное — в квери. Не-2xx — валидный `InvokeResult`; сорванный транспорт — исключение,
          `useInvoke` кладёт его текст в `failure`.

      - id: live-browser-check
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Живая проверка в браузере (`apps/studio`)"
        description: |
          Означает: сборка проверена только vitest+jsdom. Живьём не гонялась: открыть экран API в
          `apps/studio`, загрузить документ, раскрыть каталог, дёрнуть ручку и увидеть ответ.
          Отдельно проверить то, чего jsdom не даёт вообще — открытие и закрытие секций аккордеона
          кликом.

  - category: Адаптер
    items:
      - id: adapter-is-the-entity
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сущность — адаптер, не привязка; `entities/binding` → `entities/adapter`"
        description: |
          Означает: «привязка» — глагол, действие, а действия живут в `features`; вещь, которая
          реально хранится и переиспользуется, — адаптер. Побочно освобождает слово: в
          `entities/form` `binding` уже занят привязкой инпута к полю формы. Переименование
          сделано целиком и разом, алиасов не оставлено. Решение user 2026-09-18.

      - id: adapter-is-a-preset
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Адаптер — шов между поставщиком и потребителем, хранится пресетом"
        description: |
          Означает: работа адаптера — принять данные и отдать их в нужной форме; кто дал и кому
          отдаём, адаптеру безразлично. Он сохраняется на `backend/presets` наравне с прочими
          пресетами (второй потребитель склада после документа схемы) и живёт самостоятельно.

          Состав: форма (`root` — где записи, `rules` — как поле ложится, `extra` — что с лишними)
          плюс СПИСКИ проверенных поставщиков и потребителей — просто айдишники ручек,
          компонентов, утилит, чего угодно. Списки говорят «на этих проверяли», а не ограничивают
          применимость; механику перекладки они не меняют. `source` («какую ручку дёрнуть, с какими
          параметрами») внутрь адаптера не входит — это не форма. Решение user 2026-09-18,
          уточнено 2026-09-19.

      - id: adapter-mismatch-is-loud
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Переиспользование безопасно, потому что промах громкий"
        description: |
          Означает: схемы ответа Swagger 2.0 не даёт, формы сводятся по живому ответу — сверить
          совпадение нечем. Возражение снято отчётом: подсунули не те данные — адаптер просто не
          перемапит, и это видно. `FieldRuleReport` несёт `converted`/`rejected`/`unmapped`,
          `applyAdapter` дополнительно даёт именной отказ, когда по `root` ничего нет или там
          скаляр. Решение user 2026-09-18.

      - id: adapter-entity-stale
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Форма `Adapter` в коде не соответствует решениям — НЕ СДЕЛАНО"
        description: |
          Означает: на сегодня сделан только слой имён. Фактический состав `Adapter` всё ещё несёт
          `source`, стор ищет запись по `sourceKey` (apiId+endpointId), то есть адаптер прибит к
          одной ручке и пресетом быть не может. Живого потребителя у `entities/adapter` нет ни
          одного — сущность вызывается только из своих тестов.

          Что предстоит: своя личность (id + имя от юзера, `sourceKey` умирает); вместо `source` —
          списки проверенных поставщиков и потребителей айдишниками; хранение через
          `backend/presets`; отчёт `applyAdapter` на экране. Отложено сознательно, решение user
          2026-09-18: адаптер строится по ЖИВОМУ ответу, и без работающих ручек его не на чем
          проверить.

      - id: adapter-report-visible
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "Отчёт `applyAdapter` обязан быть на экране"
        description: |
          Означает: безопасность переиспользования держится на том, что промах громкий. Спрячем
          отчёт — «не перемапилось» станет неотличимо от пустого компонента, и вся схема потеряет
          смысл. Это не украшение UI, а условие принятого решения `adapter-is-a-preset`.

      - id: response-skeleton-kept
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "Форма ответа берётся пробой и хранится скелетом, не содержимым"
        description: |
          Означает: адаптеру нужна форма ОТВЕТА, а наш документ описывает только параметры ручки —
          из Swagger 2.0 ответ не достать. Форма берётся пробой (дёрнуть ручку), но хранится не
          содержимое, а `describeSample(ответ)` из `@web-core/io`: плоский `PathType[]`
          (`{ path, type }`), только скалярные листья, значений нет вообще.

          Почему не сам ответ: сведение работает на ТИПАХ, содержимое нужно лишь как источник
          структуры. Плюс проба уезжает на бэк, а в живом ответе — реальные данные чужого
          продакшена. Пути — JSON Pointer, те же, что у `FieldRule.from`/`.target`, поэтому выбор
          из мастера уходит в правило без конвертации.

          Есть описание формы ответа — проба не нужна: источник меняется, формат `PathType[]`
          остаётся. Обратного хода (`PathType[]` → zod) в `io` нет и не предполагается — скелет
          описывает, но не валидирует; ограничение назвал владелец зоны `io` 2026-09-18. Решения
          user 2026-09-18, кода нет.

      - id: presets-kind-request
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Заявка в `backend/presets`: новые виды пресета"
        description: |
          Означает: наши записи едут на бэк пресетов наравне с прочими. `backend/presets` — ЧУЖАЯ
          зона со своим реестром видов (`internal/kinds`, Go-структура на границе GraphQL),
          поэтому это не правка на месте, а заявка владельцу через architect. Подаётся ПОСЛЕ того,
          как состав записей устоится локально. Открытым остаётся объём: сваггеры бывают на
          мегабайты — надо спросить владельца зоны про ограничения на размер `state`.

  - category: Тождество узлов и резолв Solid
    items:
      - id: lists-keyed-by-identity
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Аккордеон схлопывался на любой правке — списки сверялись по ссылке"
        description: |
          Означает: `<For>` опознаёт элемент по ссылке на объект, а ссылки в этой цепочке новые
          всегда — `presetsStore` иммутабельный (path copying отдаёт новый объект пресета на
          каждую правку), `groupEndpoints` пересобирает группы на каждое чтение пропа. Узел
          сносился вместе с DOM, а в нём живёт состояние zag-машины: открытость секции, фокус,
          введённое. При этом устойчивый ключ был — `Box` уже принимал `itemKey` и отдавал его
          только в `value` аккордеона, в сверку не подавая.

          Починено `<Key each by>` из `@web-core/solid/keyed` в `Box`, `SchemaCatalog` и
          `Presets`; `children` у `Box`/`Endpoints`/`Presets`/`PresetCard` стали аксессорными —
          узел остаётся тем же, меняется то, что он показывает. Тесты на тождество DOM-узлов:
          удаление ручки не пересобирает соседей, новый объект с тем же ключом обновляет узел.
          Разбор — FAQ.md, «Списки и тождество узла».

      - id: solid-through-own-package
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Импорты Solid — только через `@web-core/solid`"
        description: |
          Означает: 32 файла переведены с `solid-js`/`solid-js/web` на `@web-core/solid` и
          `@web-core/solid/web`, прямых импортов вендора в зоне не осталось. Правило чужое (зона
          `packages/solid`): один модуль-синглтон на репозиторий и одна точка, где решается
          версия. Оттуда же приехал `<Key>` — примитив комьюнити, взятый пакетом готовым, а не
          переписанный у себя.

      - id: zag-ignores-synthetic-click
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Состояние компонента кита в тестах гоняется пропом, не кликом"
        description: |
          Означает: Ark-UI на Zag в jsdom не реагирует на синтетический клик — аккордеон не
          открывается ни от `.click()`, ни от `dispatchEvent`, `onValueChange` не стреляет; при
          этом контролируемый `value` работает штатно. Тот же класс сложностей известен по
          floating-UI-компонентам. Поэтому поведение, завязанное на внутреннее состояние кита,
          проверяется через `value`/`onValueChange`, а структура DOM — структурой. Проверено
          2026-09-19.

      - id: vitest-inlines-kit-deps
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "`test.server.deps.inline` под Ark-UI/Zag/Kobalte"
        description: |
          Означает: эти пакеты внутри `@web-core/ui` отдают непреобразованный `.jsx` по
          `solid`-condition, а vitest по умолчанию грузит зависимости из `node_modules` напрямую
          через Node — голый `.jsx` там не парсится. `server.deps.inline` прогоняет их через
          `vite-plugin-solid`. Найдено эмпирически на первом компонентном тесте.

  - category: Гигиена
    items:
      - id: tests-typechecked
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Папка `test` не типизировалась вообще"
        description: |
          Означает: `tsconfig.json` включал только `src` и `vite.config.ts`, а `pnpm lint` и
          `pnpm typecheck` ходят по нему же — значит тесты не проверял никто, ни tsc, ни vitest
          (он типы не считает). Канон репозитория другой: `packages/io`, `store`, `generators`,
          `solid` держат `["src", "test", "vitest.config.ts"]`.

          Что всплыло сразу, как включили: два теста строили `OpenapiEndpoint` и подавали его
          туда, где ждут `EndpointDescriptor` (у первого нет `params` вообще) — рантайм это
          переживал, потому что `groupEndpoints` читает только `tag`; заглушка `fetch` была
          объявлена без аргументов, из-за чего `mock.calls[0][0]` читался из пустого кортежа;
          два помощника в тесте каталога лежали мёртвыми.

      - id: dead-weight-removed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Мёртвый груз вычищен: неиспользуемые экспорты и тесты снесённого кода"
        description: |
          Означает: снесён реэкспорт в одну строку, которым никто не пользовался, и константа
          набора значений `ParamIn`, не звавшаяся ни в `src`, ни в `test` (сам тип живой). Пять
          тест-файлов, не собиравшихся на импортах несуществующего кода, удалены. Группа ручек без
          тега переименована в `unknown`. Решения user 2026-09-19.

      - id: docs-cut-to-the-code
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "README/FAQ/EXAMPLES/ROADMAP вычищены от описаний несуществующего кода"
        description: |
          Означает: доки описывали снесённый пересборкой API целыми разделами — виджеты, сторы,
          провайдеры и приложение-потребитель, которых в коде нет. Всё вырезано; EXAMPLES и README
          переписаны от кода целиком, этот файл сведён к живому и запланированному — по требованию
          user 2026-09-19 журнал снесённого не хранится даже ради истории.

          Из FAQ убраны и два утверждения, противоречивших коду: «хранить сырой текст» (отменено
          `no-raw-kept`) и состав адаптера без списков потребителей.

      - id: store-parametrized-selectors
        type: decision
        status: Backlog
        priority: Low
        milestone: null
        name: "Параметризованные селекторы `@web-core/store` не проходят свою же типизацию"
        description: |
          Означает: `SelectorsShape<T>` (`(state, ...args: never[]) => unknown`) не принимает
          `(state, id: string)`, а при трёх явных аргументах типа перегрузка
          `createActionStoreFamily` уводит селекторы в параметр ключа `K`; рантайм их поддерживает
          (`fn.length > 1`), `dist/*.d.ts` пакета вдобавок отстал от `src`. Чужая зона — находка
          отдана наверх. В feeder временно обычная функция над состоянием (`adapterBy`); вернуть в
          стор, когда починят.

log:
  - id: endpoint-identity-fixed
    type: plan
    date: 2026-09-19
    summary: >
      Продолжение разбора тождества, начатого в прошлый заход: у ручки завёлся собственный айди.
      Прежний ключ `метод + url` держался ровно до первой правки урла — а правят его на том же
      экране, где показывают, — и ломал и узел аккордеона, и адресацию удаления; две ручки с
      одинаковым методом и урлом были для списка одной.

      Разрез принят user: внутри пакета существует ТОЛЬКО наша схема, и превращает в неё чужой
      документ одно место — входной слой. Шаблон формата отдаёт `IncomingDocument` (наш документ
      до простановки айди) и про айди не знает даже типом; `parseSchema` прогоняет его через
      `identify`; `asSchemaDocument` требует `id` как признак нашего формата, а не чинит
      содержимое на лету. `endpointKey` снесён целиком, включая публичный экспорт.

      По дороге нашлось, что папка `test` не типизировалась вообще (`tsconfig.json` не включал
      её, при том что весь остальной репозиторий включает). Включили — и сразу вылезли два теста,
      подававшие `OpenapiEndpoint` вместо дескриптора, и заглушка `fetch` без аргументов.
      Починено там же.

      Итог: lint, typecheck (впервые вместе с тестами) и 115 тестов зелёные. Живого браузера
      по-прежнему не было.

  - id: docs-and-identity-cleanup
    type: plan
    date: 2026-09-19
    summary: >
      Заход начался с бага «аккордеон дёргается при правке пресетов» и раскопался до общей
      причины: списки в пакете сверялись по ссылке на объект, при том что стабильный ключ был
      объявлен пропом `itemKey` и в сверку не подавался. Иммутабельный стор отдаёт новый объект на
      каждую правку, `groupEndpoints` пересобирает группы на каждое чтение — узел сносился вместе
      с DOM и уносил состояние zag-машины. Починено `<Key each by>`; попытка написать свой аналог
      была отбита user как самопал, вместо неё зона `packages/solid` завела примитив готовым, и
      feeder встал на него.

      Дальше по требованию user вычищено всё наследство пересборки: снесены пять тест-файлов, не
      собиравшихся на импортах несуществующего кода, и пара неиспользуемых экспортов; импорты
      Solid переведены на `@web-core/solid` во всех 32 файлах зоны. Доки переписаны от кода — FAQ потерял больше трети записей, EXAMPLES и
      README переписаны целиком, этот файл сведён к живому и запланированному.

      Две находки, поднятые по ходу и решённые user: адаптер — шов, которому безразлично кто и
      кому, со списками проверенных поставщиков и потребителей айдишниками (код этому пока не
      соответствует, `adapter-entity-stale`); пресет хранит разобранный документ, а не сырьё, и
      прежняя запись FAQ об обратном была ложью. Отдельно найдено, что у ручки и тега нет
      собственного айди — опознаются содержимым, которое юзер правит
      (`endpoint-identity-is-derived`).

      Итог: lint, typecheck и 111 тестов зелёные, `pnpm test` по зоне чист впервые за пересборку.
      Живого браузера не было.

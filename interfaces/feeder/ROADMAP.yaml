      отдельный мод, вход — два «варианта» (А/Б, каждый сырые данные или zod-схема), юзер сводит
      поля вручную (v1 — 1:1, без `steps`/`onFail` в UI), движок отдаёт `{ rules, result }` живьём
      на каждый пик. `rules` — сохранить и переиспользовать на новых данных той же формы,
      сохранение на бэке — забота user, не feeder.

      `entities/mapping` (`describeVariant`+`applyMapping`) — тонкая обёртка, вся механика в
      `@web-core/io` (`describeSample`/`describeSchema`/`applyFieldRules`), от feeder только
      интерфейс — по словам user. `widgets/mapping` — по ходу тестирования выяснилось, что Ark-UI

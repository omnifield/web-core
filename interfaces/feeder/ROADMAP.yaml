  - id: mode-mapping-done
    type: plan
    date: 2026-09-15
    summary: >
      Мод 4 (`Mapping`) заведён и доведён до принятого состояния в одном заходе — не по
      исходному плану (там сведение было частью модов 2/3, `mapping-ui`), а по находке user

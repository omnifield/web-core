# Дорожная карта каталога `interfaces/` — работа УРОВНЯ ГРУППЫ: границы этажа, состав, общие
# правила. Работа конкретного интерфейса живёт в его роадмапе и сюда не дублируется.
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога.

categories:
  - category: Границы этажа
    items:
      - id: interfaces-floor-between-base-and-surfaces
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Этаж между базой и поверхностями — свой корень воркспейса, не подпапка пакетов"
        description: |
          Сущность этого каталога сводит несколько пакетов базы под общий UI и отдаётся готовой
          больше чем одному потребителю. Отдельный корень нужен, чтобы не потерять различие с
          `../packages/`: базовый пакет о потребителях не знает вовсе, интерфейс обязан знать, что
          с чем соединяет. Смешение стирает ровно это свойство, а вместе с ним — переносимость
          базы.

          `genus` — `engine` (тот же, что у `store`/`assembly`), `группа` — `interfaces`, общая на
          весь корень.

      - id: second-consumer-is-the-admission-test
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Пропуск сюда — ВТОРОЙ потребитель, не намерение сделать общий механизм"
        description: |
          Пока UI просит одно приложение, общность — гипотеза, а вынос наверх стоит чужой зоны,
          своей доки и своего выпуска. Второй потребитель — первое настоящее доказательство. То же
          правило уже применялось в `packages/skin` (файловый источник скина: «второй потребитель
          — признак механики, а не частного случая»), здесь оно закреплено как критерий каталога.

  - category: Состав
    items:
      - id: chat-purpose-undefined
        type: feature
        status: Open
        priority: Low
        milestone: null
        name: "`chat` — фундамент заложен, назначение не определено"
        description: |
          В каталоге лежит второй пакет (`@web-core/chat`) с заведённой структурой, но его
          собственная дока назначения не называет. Пока назначение не сформулировано, критерий
          каталога на нём не проверен: неизвестно даже, сводит ли он несколько пакетов и есть ли у
          него второй потребитель.

          Что нужно: владелец зоны формулирует предмет сущности (что сводит, кто потребители) —
          после этого проверяется соответствие критерию включения. Если критерий не выполняется,
          сущности место не здесь, и это отдельное решение с architect, а не молчаливое оставление
          «пусть лежит».

log:
  - id: interfaces-catalog-doc
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку по решению user: корень описывает монорепо, состав группы живёт
      в самой группе. Записан критерий включения, которого раньше не было нигде: сводит несколько
      пакетов, несёт свой UI, потребителей больше одного. При сверке с фактом видно, что `chat`
      этот критерий не проверял — назначение сущности не сформулировано; записано открытым
      пунктом владельцу.

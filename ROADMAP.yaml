# ⚠️ ЭТО НЕ УТВЕРЖДЁННЫЙ ПЛАН. Файл заполнен ассистентом (Claude) 2026-09-09 по просьбе user'а
# и содержит ЕГО выводы. Часть из них измерена, часть — догадки по чтению кода. Всё, что здесь
# написано, подлежит независимой перепроверке ПЕРЕД тем, как по этому что-то делать.
#
# Как читать. У каждого пункта есть поле `basis`:
#   measured  — ассистент запустил команду и увидел результат. Команда приведена в `repro`,
#               её можно повторить и получить своё число. Это самое надёжное, что здесь есть.
#   code-read — ассистент прочитал исходники и сделал вывод из них. Файл и строка указаны.
#               В рантайме НЕ проверялось: реальное поведение может отличаться.
#   guess     — предположение. Не проверялось ничем. Относиться как к гипотезе.
#
# ЧЕГО ЗДЕСЬ НЕТ И ЧТО ЭТО ОБЕСЦЕНИВАЕТ. Все замеры сделаны из контейнера через Node и curl,
# НЕ из браузера. Ни одного числа из DevTools в этом файле нет. Поэтому:
#   • лимит одновременных соединений браузера (взято 6) — допущение, а не факт;
#   • HTTP-кеш браузера не учитывался вовсе;
#   • накладные расходы dev-сервера Vite не отделены;
#   • production-сборка не профилировалась;
#   • НЕ проверено, что браузер при смене компонента реально шлёт именно эти запросы — это
#     вывод из чтения кода, а не наблюдение.
# Нормальная проверка выглядит так: открыть витрину, вкладку Network, кликнуть по компоненту в
# дереве и посмотреть фактическое число запросов и время. Пока этого не сделано, числа ниже —
# оценка сверху из другой среды.
#
# ИСТОРИЯ ЭТОГО ФАЙЛА, чтобы не повторять ошибку. Первая версия плана (удалена user'ом) объявляла
# главной проблемой надевание наряда (`css()`) и советовала начинать с `names()`. Она была
# написана ПОСЛЕ замера только одного пути — работы с нарядами — и БЕЗ чтения `componentInfo`.
# Когда потом был измерен путь смены компонента, оказалось, что доминируют формы, а `names()`
# экономит 2 запроса из 47. Приоритеты первой версии были выставлены неверно. Вывод на будущее:
# не расставлять приоритеты, пока не измерен КАЖДЫЙ путь, а не первый попавшийся.

categories:
  - category: Замеры (то, что действительно наблюдалось)
    items:
      - id: measure-rtt
        type: feature
        status: Done
        priority: High
        basis: measured
        name: Время ответа службы пресетов — это сеть, а не работа бэка
        repro: |
          curl -s -o /dev/null -w "tls %{time_appconnect} ttfb %{time_starttransfer}\n" \
            https://150.251.145.87:9787/healthz
          curl -s -o /dev/null -w "connect %{time_connect} tls %{time_appconnect} ttfb %{time_starttransfer}\n" \
            "https://150.251.145.87:9787/api/presets?kind=outfit" \
            "https://150.251.145.87:9787/api/presets?kind=outfit"
        description: |
          Наблюдалось 2026-09-09 со стенда https://150.251.145.87:9787, из контейнера.

          Холодное соединение: connect 95 мс, TLS 201 мс, ответ 295 мс.
          Второй и последующие запросы по тому же соединению: 95 мс.
          Ручка `/healthz`, которая не делает ничего: те же 295 мс вхолодную.

          ВЫВОД (уже не замер, а трактовка): раз пустая ручка стоит столько же, сколько выдача
          списка, время уходит на дорогу, а не на работу службы. Значит цена ≈ число запросов ×
          95 мс плюс рукопожатие на каждое новое соединение.

          ЧЕГО НЕ ЗНАЮ: как это выглядит из браузера юзера, а не из контейнера. Сеть может быть
          другой.

      - id: measure-counts
        type: feature
        status: Done
        priority: High
        basis: measured
        name: Сколько записей в службе по видам
        repro: |
          for k in outfit palette form content tag; do
            echo -n "$k: "; curl -s "https://150.251.145.87:9787/api/presets?kind=$k" | grep -o '"id"' | wc -l
          done
        description: |
          На 2026-09-09: outfit 2, palette 2, form 28, content 14, tag 2.

          Важно для всего остального: формы — самый многочисленный вид, и именно их число
          определяет стоимость. Числа будут меняться, поэтому все оценки ниже привязаны к ним,
          а не к абсолютным миллисекундам.

      - id: measure-index-without-state
        type: feature
        status: Done
        priority: High
        basis: measured
        name: Индекс службы не отдаёт содержимое записей
        repro: curl -s "https://150.251.145.87:9787/api/presets?kind=outfit"
        description: |
          Ответ на `?kind=` содержит только `id`, `label`, `name`, `kind`, `savedAt`. Поля
          `state` в нём нет.

          Это наблюдение, а не догадка: так выглядит фактический ответ службы. Из него следует
          всё N+1 ниже.

      - id: measure-component-switch
        type: feature
        status: Done
        priority: High
        basis: measured
        name: Смена компонента обходится в 47 запросов и ~2.2 секунды
        repro: |
          # Эмуляция браузера: общий пул из 6 соединений на хост, три вида читаются параллельно.
          node --input-type=module -e "
          const B='https://150.251.145.87:9787/api/presets';
          const j=u=>fetch(u).then(r=>r.json());
          let active=0; const q=[];
          const gate=fn=>new Promise((res,rej)=>{const run=()=>{active++;fn().then(res,rej).finally(()=>{active--;const n=q.shift();if(n)n();});};active<6?run():q.push(run);});
          const list=async k=>{const items=(await gate(()=>j(B+'?kind='+k))).items;await Promise.all(items.map(i=>gate(()=>j(B+'/'+i.id))));return items.length;};
          const t0=Date.now();
          const [f,o,c]=await Promise.all([list('form'),list('outfit'),list('content')]);
          console.log('запросов:', 3+f+o+c, '| время:', Date.now()-t0, 'мс');"
        description: |
          Результат: 47 запросов, 2157 мс. Отдельно: формы 29 запросов / 1134 мс,
          контент 15 / 507 мс, наряды 3.

          Совпадает с тем, что user наблюдает в интерфейсе («2-3 секунды при смене компонента»).

          ОГОВОРКА, снимающая половину веса с этого пункта: это ЭМУЛЯЦИЯ. Набор запросов взят из
          чтения кода (см. `finding-component-info`), а не снят с браузера. Совпадение времени с
          жалобой user'а — довод в пользу версии, но не доказательство: те же 2-3 секунды могли
          бы дать и другие причины. Проверять надо во вкладке Network.

      - id: measure-before-graphql-baseline
        type: feature
        status: Done
        priority: High
        basis: measured
        name: "«ДО» — контрольный замер перед переездом на GraphQL, для сравнения после"
        repro: |
          # Тот же скрипт, что у measure-component-switch, прогнан заново 2026-09-09 — специально
          # СЕЙЧАС, пока backend/presets на стенде ещё старый REST (переезд идёт в web-core/skin,
          # стенд не трогали). После переезда потребителей — прогнать буквально то же самое и
          # сравнить с этими числами, не с числами 2026-09-09 measure-component-switch (те уже
          # устарели по времени, хоть счётчик совпал).
        description: |
          Три прогона подряд, тот же стенд, тот же скрипт: 47 запросов/1495 мс, 47/1931 мс,
          47/1027 мс (среднее ~1484 мс). Число записей не изменилось с исходного замера (форма 28,
          наряд 2, контент 14) — совпадение счётчика (47) с той версией случайное по данным, не
          по методу, но подтверждает, что оговорка «числа будут меняться» из `measure-counts`
          сработала бы, если бы записей стало больше. `/healthz` свежим прогоном: connect 66 мс,
          TLS 143 мс, ttfb 217 мс — того же порядка, что раньше.

          ОТДЕЛЬНОЕ наблюдение, НЕ основной замер (basis для него ниже отдельно): реальный браузер
          (chrome-devtools, dev-сервер apps/skin, `/showcase/button`, ЛОКАЛЬНАЯ база, не стенд)
          показал 211 xhr/fetch запросов на ПЕРВЫЙ заход на компонент — то есть заметно больше 47.
          Это не тот же сценарий (первый заход, не смена компонента, другая база с другим числом
          записей) и снят В ПРОЦЕССЕ параллельной правки `web-core/skin` овнером (пойманы 400-ки от
          POST, список запросов сбрасывался между вызовами — среда была в движении, не чистая).
          Записано как сигнал «порядок величины похож или хуже, не лучше», а не как число для
          сравнения «до/после» — для этого пересниму тем же приёмом (браузер, вкладка Network)
          после переезда, на спокойной среде.

  - category: Выводы по коду (прочитано, в рантайме не проверялось)
    items:
      - id: finding-n-plus-one
        type: bug
        priority: High
        basis: code-read
        name: Чтение любого вида пресетов — это 1+N запросов
        description: |
          `createPresetsClient().list()` (web-core/skin/src/presets/client.ts:119-126) сначала
          берёт индекс (`?kind=`), затем делает `wireRead` на КАЖДУЮ запись по её id — потому
          что индекс не отдаёт `state` (см. `measure-index-without-state`).

          28 форм = 29 запросов. Растёт линейно по числу записей.

          Туда же `get(kind, name)` (client.ts:128-134): тянет весь индекс, чтобы найти id по
          имени, — два обращения там, где по смыслу одно. И `replace()` (client.ts:151-161):
          индекс + DELETE + POST.

      - id: finding-component-info
        type: bug
        priority: High
        basis: code-read
        name: Справочник форм и нарядов перезапрашивается на каждую смену компонента
        description: |
          `componentInfo(component)` (web-core/ui/src/component-info.ts:199) делает
          `Promise.all([presets.list("form"), presets.list("outfit")])`. Вызывается через
          `componentInfoAtom`, ключ которого — `currentComponent`
          (apps/skin/src/entities/component/model/store.ts:14), то есть на каждую смену
          компонента заново.

          ВЫВОД: формы и наряды от компонента не зависят — это общий справочник, одинаковый для
          `button` и для `table`. Значит 32 запроса из 47 повторяют уже скачанное.

          ЭТО ГЛАВНОЕ ПОДОЗРЕНИЕ по жалобе «2-3 секунды при смене компонента». Именно его надо
          подтверждать в первую очередь и именно в браузере.

          ЧЕГО НЕ ПРОВЕРЯЛ: правда ли `componentInfo` не использует компонент при отборе форм
          где-то дальше по коду. Читал только точку запроса.

      - id: finding-content-unfiltered
        type: bug
        priority: Medium
        basis: code-read
        name: Контент выкачивается целиком и фильтруется на клиенте
        description: |
          `listContentFor(component)` (apps/skin/src/entities/component/model/content.ts) берёт
          ВСЕ content-записи и отбирает нужные фильтром на клиенте, по полю внутри `state`.
          Сегодня это 15 запросов ради пары записей.

          Server-side фильтра нет: служба про содержимое `state` ничего не знает, для неё это
          непрозрачный кусок. То есть без правки бэка это не лечится в принципе — только кешем.

      - id: finding-names-discards-state
        type: bug
        priority: Low
        basis: code-read
        name: Список нарядов для кнопки вычитывает записи и выбрасывает их
        description: |
          `createPresetsSkinSource().names()` (web-core/skin/src/presets/source.ts:28) зовёт
          `client.list(outfit)` и берёт только `record.name` — а имя уже есть в индексе.

          Правка тривиальная, но экономит 2 запроса из 47. В первой версии плана этот пункт
          стоял высоко — это была ошибка приоритизации.

      - id: finding-setmode-refetch
        type: bug
        priority: Medium
        basis: code-read
        name: Переключение light/dark, похоже, заново скачивает весь наряд
        description: |
          `setMode()` (web-core/skin/src/solid/connection.ts:47-50) реализован как
          `wear(current.name, { mode })`, а `wear()` (wear/switch.ts) зовёт `source.css(name)`.
          `css()` (presets/source.ts:29-46) — это `get(outfit)` + `list(palette)` +
          `list(form)`, то есть снова десятки запросов.

          ВЫВОД, требующий проверки: CSS при этом получается тот же самый, потому что режим в
          лист стилей не входит — он ставится флагом на корне (`writeDark()` в wear/root.ts).
          Если так, то перезапрос при смене режима бесполезен целиком.

          НЕ НАБЛЮДАЛОСЬ в браузере ни разу. Чистый вывод из чтения. Проверяется за минуту:
          переключить light/dark с открытой вкладкой Network.

      - id: finding-double-names
        type: bug
        priority: Low
        basis: code-read
        name: Список имён нарядов запрашивается дважды за один старт
        description: |
          В `ThemeSwitch` (apps/skin/src/shared/ui/theme-switch/index.tsx) рядом стоят
          `createResource(() => SOURCE.names())` и `onMount(() => skin.restore())`, а
          `restore()` (wear/switch.ts) внутри себя тоже зовёт `source.names()`.

          Мелочь, но показывает, что за трафиком к службе никто не следит.

      - id: finding-no-cache
        type: bug
        priority: High
        basis: code-read
        name: Кеша сетевых данных нет, при том что слой для него уже подключён
        description: |
          Клиент службы ходит голым `fetch`. Ни один запрос к пресетам не кешируется.

          При этом `QueryClientProvider` (@web-core/query, это re-export TanStack Solid Query)
          уже смонтирован в apps/skin/src/app/index.tsx:34 — с комментарием «данных по сети
          витрина сегодня не тянет ни одной, клиент заведён на будущее». Комментарий устарел:
          данные по сети витрина тянет.

          Заодно: в приложении сейчас три механизма выборки одновременно — solid'ов
          `createResource` (theme-switch, widgets/component/input, pages/embed),
          `createResourceAtom` из @web-core/store (entities/component/model/store.ts) и
          неиспользуемый @web-core/query.

  - category: Предложения (НЕ проверены, обсуждались, не согласованы)
    items:
      - id: proposal-cache-directories
        type: feature
        priority: High
        basis: guess
        name: Кешировать формы и наряды на сессию
        description: |
          ГИПОТЕЗА: если справочники брать один раз, смена компонента станет ~15 запросов
          вместо 47, без правок на бэке.

          Ожидаемый эффект посчитан арифметикой из `measure-component-switch`, а НЕ измерен на
          работающей правке. Реальный выигрыш может оказаться другим.

          Открытый вопрос: чем кешировать. Логично @web-core/query, раз он уже подключён, но
          тогда стоит решить, что делать с двумя другими механизмами выборки — иначе появится
          четвёртый.

      - id: proposal-index-with-state
        type: feature
        priority: High
        basis: guess
        name: Отдавать содержимое записей прямо в индексе
        description: |
          ГИПОТЕЗА: если `?kind=` (или отдельный `?include=state`) вернёт записи целиком, N+1
          исчезает как класс: 47 запросов превращаются примерно в 3, и рост по числу сборок и
          вариантов перестаёт быть опасным.

          Оценка объёма: запись наряда ~790 Б (измерено). Сто записей ≈ 80 КБ одним ответом.
          НЕ измерялось: сколько весят формы и контент — они могут быть заметно крупнее, и
          тогда вывод «тело ничего не решает» перестанет быть верным. Это надо померить ДО
          того, как принимать решение.

          Зона: backend/presets, обработчик list (internal/api/handler.go).

      - id: proposal-http2
        type: feature
        priority: Low
        basis: guess
        name: HTTP/2 на службе
        description: |
          Служба отвечает по HTTP/1.1 (видно в заголовках ответа curl). ГИПОТЕЗА: переход на
          HTTP/2 снимет потолок соединений и лишние рукопожатия.

          Величина выигрыша не оценивалась вообще. Если пройдёт `proposal-index-with-state`,
          запросов станет мало и смысл почти пропадёт.

      - id: proposal-etag
        type: feature
        priority: Low
        basis: guess
        name: Условные запросы (ETag / If-None-Match)
        description: |
          Дадут 304 вместо тела. Экономят трафик, но не время в дороге, а по замерам время
          уходит именно на дорогу. Записано, чтобы не предлагали заново как решение, — но и
          это утверждение стоит на выводе `measure-rtt`, а не на прямой проверке.

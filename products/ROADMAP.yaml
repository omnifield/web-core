# Дорожная карта каталога `products/` — работа УРОВНЯ ГРУППЫ: границы каталога, условия переезда
# наружу. Работа конкретного продукта живёт в его собственной доке и сюда не дублируется.
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога.

categories:
  - category: Границы каталога
    items:
      - id: products-are-temporary-guests
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Каталог временный: продукт живёт здесь, пока идёт становление, и уезжает своим репозиторием"
        description: |
          Продукт — первый честный потребитель базы: он находит то, чего не находят ни витрина, ни
          эталон, потому что решает настоящую задачу. Пока он здесь, находка чинится в пакете
          сразу, без выпуска в реестр.

          В `../web-core/` продукту нельзя — там база фреймворка, и смешение «из чего сделано» с
          «что сделано» стирает границу, на которой стоит весь репозиторий. Поэтому свой каталог,
          и он честно назван временным.

      - id: domain-vs-proof-boundary
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Граница с `apps/` — по предмету: там доказывают свойство базы, здесь решают задачу пользователя"
        description: |
          Витрина, эталон и демо существуют ради фреймворка и остаются в репозитории навсегда. У
          продукта своя предметная область и свой человек — он временный гость. Тот же критерий
          записан с обратной стороны в `../apps/README.md`: приложение, у которого появился свой
          пользователь и своя предметная область, перестаёт быть доказательством и переезжает
          сюда.

  - category: Переезд наружу
    items:
      - id: move-out-returns-delivery-check
        type: decision
        status: Open
        priority: High
        milestone: null
        name: "Переезд — этап с проверкой поставки, а не `git mv`"
        description: |
          Условие закрытия для ЛЮБОГО продукта этой группы, не только для первого: продукт ставит
          `@web-core/*` из реестра (`../PUBLISHING.md`), собирается и поднимается на чистой
          машине, и только после этого папка уезжает из монорепо.

          Причина названа в `../web-core/FAQ.md`: внутри воркспейса поверхность поставки подменена
          симлинками и не проверяется вовсе. Два реальных отказа первой публикации (ручной
          диапазон в `peerDependencies`, условие `exports` в `src`) изнутри были невидимы
          полностью.

          Статус Open — потому что ни один продукт этого этапа ещё не проходил: `windshift`
          вендорится целиком и от `@web-core/*` не зависит, а `tables`/`map` кода не имеют.

  - category: Состав
    items:
      - id: zones-without-code
        type: decision
        status: Done
        priority: Low
        milestone: null
        name: "`tables` и `map` — зоны с каноном, но без кода, и это честное состояние"
        description: |
          В `../.claude/harness.yaml` зоны заведены, канон собран (`../canons/`), папок в каталоге
          нет. Пустая папка ради симметрии была бы имитацией работы; появится первая строка кода —
          появится и папка, а строка в составе каталога добавляется тем же заходом.

log:
  - id: products-catalog-doc
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку по решению user навести порядок в доке. Записаны критерий
      включения (свой домен, свой пользователь, горизонт переезда), граница с `apps/` по предмету
      и — главное — условие переезда наружу как отдельного этапа с проверкой поставки из реестра.
      До этого условие жило только в роадмапе `apps/dashboard`, то есть относилось к одной
      сущности вместо всей группы.

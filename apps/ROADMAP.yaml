# Дорожная карта каталога `apps/` — работа УРОВНЯ ГРУППЫ: общие правила приложений, состав
# группы, порты. Работа конкретного приложения живёт в его роадмапе и сюда не дублируется.
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога.

categories:
  - category: Правила группы
    items:
      - id: apps-prove-not-serve
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Приложение здесь доказывает свойство фреймворка, а не обслуживает пользователя"
        description: |
          Граница группы проходит по ПРЕДМЕТУ, не по тому, кому показывают результат: витрина
          показывает кит настоящим рендером, эталон падает на сломанном шве, демо-дашборд
          доказывает переносимость собранного модуля. Появилась своя предметная область и свой
          пользователь — сущность уезжает в `../products/`, а оттуда отдельным репозиторием.

          Прямое следствие, записанное отдельно, потому что на нём спотыкаются: новых механик в
          приложении не заводят. Не хватило механики — это заявка владельцу пакета; иначе
          демонстрация показывает то, чего в базе нет, и у потребителя не повторяется.

      - id: apps-take-packages-by-version
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Приложение берёт базу номером версии, а не протоколом `workspace:*`"
        description: |
          Решение user 2026-09-23. Каталоги этого дерева становятся самостоятельными
          репозиториями: база — своим, каждое приложение — своим. Отсюда требование, которого
          раньше не было: приложение обязано собираться, когда базы рядом НЕТ. Клонировали одно
          приложение — оно должно встать из реестра и работать.

          `workspace:*` этого не умеет в принципе: вне воркспейса он не разрешается вовсе.
          Номер версии умеет обе роли сразу — база рядом есть, берётся живая папка; базы нет,
          берётся реестр. Какая роль сработает, решает не манифест, а то, что оказалось рядом.

          Подстановку по диапазону включает `linkWorkspacePackages` в корне рабочего дерева
          (`../pnpm-workspace.yaml`). У pnpm она по умолчанию ВЫКЛЮЧЕНА, и без неё номер версии
          всегда уходит в реестр — на этой настройке и держится привычный флоу «правлю пакет,
          вижу в приложении сразу».

          Измерено на живом дереве 2026-09-23 (pnpm 11.17.0): после перевода манифестов все связи
          встали как `link:` на соседние папки — `reference` 7 из 7, `studio` 15 из 15,
          MCP-сервер витрины 6 из 6, ни одной из реестра; симлинк на диске проверен отдельно.
          Контрольный прогон ДО настройки показывал обратное: те же номера версий разрешались в
          опубликованные пакеты.

          ⚠️ Грабля, которую стоит знать заранее: настройка не переписывает уже зафиксированное.
          Записи в `pnpm-lock.yaml` прилипают, и `--force` их не трогает — выглядит как «не
          работает». Помогает только чистый пересчёт: снести lockfile и поставить заново.

          Правку манифестов зон сделал architect, а не владельцы: это смена контракта между
          зонами, единая для всего дерева, и после чистого пересчёта lockfile она обязана быть
          применена сразу везде. Разнесённая по владельцам, она дала бы дерево, где половина
          приложений смотрит в реестр, а половина — в соседнюю папку. Решение user тем же днём.

      - id: apps-private-and-ignored-in-release
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Приложения не публикуются и перечислены в `versioning.ignore` поимённо"
        description: |
          `"private": true`, версии нет, в `versioning.fixed` не входят. Пути перечислены в
          `versioning.ignore` (`../pnpm-workspace.yaml`) ПОИМЁННО: маска каталога (`./apps/**`)
          молча не срабатывает — проверено прогоном 2026-09-22. Завели приложение — добавили
          строку, иначе оно повиснет в плане выпуска строкой `0.0.0 → 0.0.0`.

  - category: Состав и адреса
    items:
      - id: ports-are-fixed-and-named
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "У каждого приложения свой порт с `--strictPort`, названный в его README"
        description: |
          Приложения живут рядом и поднимаются одновременно. Без `--strictPort` второе молча
          встаёт на соседний порт и притворяется первым — дороже всего это стоит в живой проверке
          через браузер, где агент или человек смотрит не туда, куда думает.

          Сегодня занято: `studio` — 5174. `reference` порт не фиксирует (`vite` без флага) —
          открытый хвост этого пункта, решать владельцу зоны. Порт статборда к этому правилу
          отношения не имеет: он уехал своим репозиторием в корень дерева и соседями по группе
          больше не стеснён.

      - id: reference-port-not-fixed
        type: bug
        status: Open
        priority: Low
        milestone: null
        name: "`reference` поднимается без `--strictPort` — правило группы на него не распространено"
        description: |
          Найдено architect'ом 2026-09-23 при заведении доки каталога: `apps/reference`'s
          `dev`-скрипт — голый `vite`, без порта и без `--strictPort`, тогда как правило группы
          требует своего фиксированного порта. Практический риск тот же, что у витрины: при
          занятом порте Vite тихо берёт соседний, и проверка идёт не на том приложении.

          Кому: владельцу зоны `reference`. Объём — одна строка в `package.json` плюс порт,
          названный в README зоны.

log:
  - id: statboard-left-the-catalog
    type: plan
    date: 2026-09-23
    summary: >
      Зона `dashboard` переименована в `statboard` и вынесена из каталога: папка лежит теперь
      своим корнем рядом с деревом (`../statboard/`), а не приложением здесь. Решение user:
      статборд — самостоятельный репозиторий, который коллеги клонируют отдельно, поднимают и
      собирают на наших инструментах своё; его предмет — работа коллеги, а не доказательство
      свойства базы. Критерий включения группы от этого не изменился, состав стал на строку
      короче.

  - id: apps-catalog-doc
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку по решению user навести порядок в доке: корень описывает
      монорепо, состав группы живёт в самой группе. При сверке доки с фактом найдено, что
      `reference` не держит фиксированный порт вопреки правилу группы — записано открытым
      пунктом владельцу, а не починено на ходу (чужая зона).

# Дорожная карта apps/dashboard — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана, не задним числом. Формат тот же, что
# у apps/studio и web-core/*: categories → items, log — журнал решений.
#
# Зона заведена architect'ом 2026-09-22, кода на этот момент нет ни строки: всё, что ниже с
# статусом Open, — ТЗ, а не отчёт. README.md/FAQ.md пишет владелец ПО ФАКТУ кода (дока от кода,
# не наоборот) — здесь только то, что решено до первой строки.

categories:
  - category: Зачем это приложение
    items:
      - id: purpose-first-stage
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Демо-дашборд доказывает ОДНО: собранное в студии живёт там, где студии нет"
        description: |
          Решение user (2026-09-22), первый из нескольких этапов показа. Приложение существует,
          чтобы показать конвейер целиком: человек собирает модуль в студии → выгружает его
          файлом себе на диск → кладёт файл в исходники этого приложения → добавляет пару строк
          → модуль рисуется. Поменял модуль в студии, заменил файл — картинка изменилась.

          Из этого следует, чем приложение НЕ является, и это важнее списка фич:
          - не продукт и не витрина второго сорта. Экран один, украшений нет;
          - не полигон новых механик: всё, что оно делает, обязано делаться уже существующими
            средствами фреймворка. Понадобилась новая механика — это находка и заявка владельцу
            соответствующей зоны, а не правка здесь;
          - не место, где живёт бизнес-логика: данных из сети на этом этапе нет вовсе.

          Урок `apps/reference` (README той зоны, «Экран намеренно один») применяется буквально:
          полигон, выросший в приложение, перестаёт быть полигоном — за ним начинают ухаживать
          вместо того, чтобы им проверять.

      - id: workspace-now-repo-later
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Живёт в воркспейсе, уезжает в свой репозиторий — и переезд возвращает проверку, которой здесь нет"
        description: |
          Решение user: заводим внутри `apps/`, пакеты берём `workspace:*`. Причина прямая —
          находки по дороге чинятся в пакете и видны сразу, без выпуска в реестр.

          Цена названа заранее, чтобы не выяснять её при переезде. Пакеты, подключённые
          воркспейсом, — это симлинки на папки: поверхность поставки (`files`, `exports`, типы из
          `dist`, диапазоны зависимостей) в таком режиме НЕ проверяется. Ровно этот класс ошибок
          и вскрылся на первой публикации 2026-09-22: `@web-core/skin` требовал стили `^0.1.0`
          при реальных `0.2.0`, а `exports` уезжали с условием `development`, ведущим в `src/`,
          которых в поставке нет. Изнутри репозитория ни одна из них не видна.

          Значит переезд в отдельный репозиторий — не «перенести папку», а отдельный этап со
          своей проверкой: приложение ставит `@web-core/*` из реестра (PUBLISHING.md в корне),
          собирается и поднимается. До этого момента «работает в воркспейсе» ничего не говорит о
          том, что оно заработает снаружи.

  - category: Этап 1 — модуль приезжает файлом
    items:
      - id: app-skeleton
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Скелет приложения на оснастке фреймворка, без самописной обвязки"
        description: |
          Обычный Vite-проект на `@web-core/build` — три файла конфигурации по три строки
          (`vite.config.ts`/`vitest.config.ts`/`tsconfig.json`), как у `apps/reference` и
          `apps/studio`. Монтирование — `mountApp()` из `@web-core/solid` в `#root`.

          Порт — свой, с `--strictPort`, чтобы жить рядом с витриной (`5174`) и не занимать её
          место молча. Значение выбирает владелец, называет в README.

          Чего в скелете быть НЕ должно: клиента службы пресетов, GraphQL, любой сетевой
          обвязки. Приложение на этом этапе не ходит в сеть вообще — это проверяемое свойство, а
          не пожелание (см. `no-backend-on-stage-one`).

      - id: modules-from-files
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Модули лежат файлами в исходниках, подключаются массивом"
        description: |
          Файл модуля — ровно конверт службы пресетов: `{ kind, label, name, description?, state }`
          (`PresetInput`, `backend/presets/internal/graphql/schema.graphql`). Это не совпадение и
          не удобство: то же самое содержимое лежит в службе, поэтому «выгрузить на диск» и
          «залить обратно» — одно действие, а второго формата не заводится.

          Внутри `state` вида `module` (контракт согласован с владельцем службы 2026-09-22):
          `tree` — спека композиции, `tags` — категории именами, `modules` — имена вложенных
          модулей, `author`.

          Как подключается: файлы лежат россыпью в исходниках, приложение держит ОДИН массив, где
          каждая запись — модуль и данные, которыми его кормят. Добавить модуль = положить файл и
          дописать строку в массив; заменить модуль = заменить файл. Ни первое, ни второе не
          должно требовать правок в другом месте — это и есть то, что демонстрируется.

          Данные — такие же файлы: записи вида `content`, выгруженные из студии (диаграммы и
          таблицы там уже есть). Никаких выдуманных моков рядом: показываем ровно то, что человек
          сделал в студии.

      - id: manual-grid-renders-modules
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Грид — обычный JSX, модули внутри рисуются движком сборки"
        description: |
          Сам экран — не модуль: обычная разметка с компонентом сетки из кита, написанная руками.
          Внутри неё — по одному месту на каждый элемент массива модулей.

          Рисование модуля новой механики не требует: `composeTree(registry, spec)`
          (`@web-core/assembly`) собирает дерево из спеки, `RenderTree` (`@web-core/assembly/render`)
          его рисует, реестр берётся у кита (`kitComponentRenderer()`, `@web-core/ui/component-registry`).
          Рабочий образец — `apps/studio/src/shared/ui/renderer/index.tsx`: он уже умеет и
          композицию, и именованную сборку одного компонента. Списывать оттуда МОЖНО и нужно, но
          именно списывать в свою зону, а не импортировать через границу приложений.

          Отказ сборки (`composeTree` вернул `refusals`) обязан быть виден человеку на экране, а
          не только в консоли: файл принёс имя компонента, которого нет в ките, — это первое, во
          что упрётся тот, кто будет переносить файлы руками.

      - id: skin-from-file
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Вид приезжает файлом, а не из службы — источник скина собирается на месте"
        description: |
          Стили закладываются сразу, на этом же этапе (решение user). Сегодня вид приходит через
          `SkinSource`, который ходит в сеть (`createPresetsSkinSource`, `@web-core/skin/presets`)
          — приложению без бэка он не годится.

          Своего источника из файлов в зоне `skin` сегодня НЕТ, но заводить его там не требуется:
          `SkinSource` — это `names()` и `css(name)`, то есть интерфейс из двух функций. Наряд,
          палитра и формы кладутся файлами (те же конверты, что у модулей), а `css(name)`
          собирается вызовом `assemble(outfit, { palettes, forms })` + `generateSkinCss(skin)` из
          `@web-core/skin`. Двадцать строк в этой зоне, ноль правок в чужих.

          Требование: кит одевается по-настоящему. Компоненты просят свой CSS сами
          (`useComponentSkin` внутри `useKitLife`), значит достаточно поднять `SkinProvider` с этим
          источником на корне — но проверить это нужно глазами, а не тем, что провайдер
          смонтирован.

          Если по дороге выяснится, что источник из файлов нужен не только здесь (второй
          потребитель — уже признак механики, а не частного случая), — это заявка владельцу
          `web-core/skin`, а не разрастание этой зоны.

      - id: no-backend-on-stage-one
        type: decision
        status: Open
        priority: High
        milestone: null
        name: "Ни одного сетевого запроса — и это проверяется, а не обещается"
        description: |
          На первом этапе приложение не ходит в сеть ни за чем: ни за модулями, ни за данными, ни
          за видом. Служба пресетов при этом живёт и наполняется — но её потребитель студия, не
          это приложение.

          Свойство проверяемое, и проверить его стоит машиной: в собранном бандле нет адреса
          службы, а живой прогон не делает ни одного запроса к ней. Тот же приём, каким
          `apps/reference` стережёт свои замороженные точки: утверждение без пробы — это
          пожелание, которое через месяц перестанет быть правдой молча.

      - id: user-flow-proven-end-to-end
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Сквозной прогон рукой: собрал в студии → перенёс файл → увидел на дашборде"
        description: |
          Условие закрытия этапа — не «приложение собирается», а пройденный целиком путь
          человека, руками, с записью результата:

          1. в студии собран модуль и выгружен файлом;
          2. файл положен в исходники этого приложения, в массив добавлена строка;
          3. модуль виден на дашборде, одет, с данными;
          4. модуль изменён в студии, файл заменён — картинка изменилась, других правок не
             потребовалось.

          Что здесь проверяется на самом деле: что перенос действительно стоит «файл плюс пара
          строк». Если на каком-то шаге понадобилось поправить код приложения — это находка, и
          она важнее самой демонстрации: значит контракт файла неполон.

log:
  - id: zone-created-with-stage-one-brief
    type: plan
    date: 2026-09-22
    summary: >
      Зона заведена architect'ом по решению user: первый этап показа — демо-дашборд, который
      доказывает, что собранное в студии переносится в чужое приложение файлом. Сценарий выбран из
      двух (витринный против прикладного): витринный, маленький — он отвечает на вопрос «как это
      выходит за пределы витрины», а второй отвечает на другой вопрос («можно ли на этом писать
      продукты») и честно показывается уже не демкой, а первым продуктом.

      Решения, принятые до первой строки кода: приложение живёт в воркспейсе и уезжает в свой
      репозиторий отдельным этапом (цена названа в `workspace-now-repo-later`); файл модуля — это
      конверт службы пресетов, а не свой формат; вид приезжает файлами, источник скина собирается
      на месте из двух функций; сети нет вовсе и это проверяется машиной.

      Параллельно с этим этапом идут две работы в других зонах, обе — предусловия второй половины
      сценария: вид `module` в службе пресетов (`backend/presets`) и сборщик модулей в студии
      (`apps/studio`, ведёт user сам). Эта зона от их готовности не зависит: файлы можно положить
      руками и до того, как студия научится их выгружать.

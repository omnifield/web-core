  - id: assembly-tree-esm-named-import
    type: finding
    date: 2026-09-14
    summary: >
      User сказал начинать план перехода на `@web-core/neurobox` — код-часть (пакет+десять файлов+
      комментарий) сделана и типчекнута чисто, но финальный шаг плана (`verify-after-switch`,
      реальный `pnpm start` + вызов тула через `stdioPeer`) уткнулся в падение сервера ДО регистрации
      тулов: `packages/assembly/dist/integrity-*.js` (компилируется из `src/engine/tree.ts:3`)
      именованно импортирует `getValueByPointer` из `fast-json-patch` — под настоящим Node ESM
      (не Vite/Vitest) это `ERR_MODULE_NOT_FOUND`/`SyntaxError`, `cjs-module-lexer` не видит имя,
      которое `fast-json-patch` кладёт в `exports` динамикой (`Object.assign(exports, core)`).
      Пересборка `pnpm --filter @web-core/assembly run build` не помогла — баг в исходнике, не в
      протухшем `dist`.
      НЕ моя находка с нуля: `apps/skin/.mcp/FAQ.md` (строки 255-265) уже документирует РОВНО этот
      паттерн и его починку — `packages/io/src/paths.ts` в своё время переведён на дефолтный импорт
      по той же причине, а `packages/assembly/src/tree.ts` (тогдашнее имя файла) сознательно оставлен
      как есть с пометкой «эта зона в графе зависимостей skin-mcp не стоит». Та предпосылка сегодня
      неверна — сверено `grep`'ом: `packages/skin/src/engine/passport/assembly/{expand,binding,
      index}.ts` импортируют `@web-core/assembly`, а `skin-mcp`'s `package.json` зависит от
      `@web-core/skin` — цепочка `skin-mcp → @web-core/skin → @web-core/assembly → tree.ts` реальна,
      просто не была пройдена живьём раньше (предыдущие живые прогоны зоны, судя по этому файлу,
      не доходили до этого конкретного пути кода, либо `assembly` вошёл в граф позже).
      Не моя зона чинить — `packages/assembly/src/engine/tree.ts` вне `canons/ui-skin/`/
      `apps/skin/.mcp/`. Однострочная правка известна (дефолтный импорт `import jsonpatch from
      "fast-json-patch"` + `jsonpatch.getValueByPointer(...)`, тот же приём, что уже применили в
      `packages/io/src/paths.ts`), но применять её здесь значило бы редактировать чужую зону —
      эскалирую находку user/architect, не обхожу молча.
      Из-за этого блокера `verify-after-switch` закрыт частично: typecheck зоны чист (0 ошибок в
      своих файлах, 469 baseline-ошибок `--jsx` в `packages/ui` не изменились ДО/ПОСЛЕ — сверено
      прямым диффом), имена экспортов каждого перенесённого подпути (`/server`, `/pagination`,
      `/mcp`, `/zone-feedback`) сверены чтением реального `packages/neurobox/src/*` (не по памяти) —
      но реальный вызов тула через живой процесс подтвердить не удалось, упёрлось раньше, чем дошло
      до регистрации тулов.

      РЕШЕНО (architect, 2026-09-14, `packages/assembly` — зона прямой работы по движку): починено
      той же однострочной правкой, что и предложил owner (`packages/io/src/engine/paths.ts` — образец),
      других именованных импортов из `fast-json-patch` в `packages/assembly`/`packages/skin` нет
      (сверено `grep`'ом). Проверено живьём, не только сборкой: `pnpm --filter @web-core/assembly
      build` (пересобран `dist/`) → `pnpm start` в `apps/skin/.mcp` реально стартует без падения
      (раньше — `SyntaxError` на первом же импорте, до этой строки процесс не доживал вовсе). Полный
      прогон тула (`verify-after-switch`) по-прежнему не завершён этим — блокер снят, сам прогон
      (`list_components`/`report_feedback`/`browser_navigate`/`push-to-prod`) заново не переигран,
      остаётся за владельцем зоны.


  - id: remote-stand-outfits-missing-forms
    type: fix
    date: 2026-09-10
    summary: >
      Живая заявка user: «диаграмма красит индикаторы графиков серым, не брендом, хотя у неё
      3 варианта — сделай покрасивее». Первая правка (`omnifield-diagram`'s `recipe` — `fill`/
      `stroke`/`fillOpacity` → `color`, тем же приёмом, что эталонный `packages/ui/src/diagram/
      playground/recipe.ts`, обоснование — компонент красит вложенные `circle`/`rect`/`path` через
      `fill="currentColor"`/`stroke="currentColor"`, а `fill`/`stroke`, поставленные CSS на
      обёртку `<g data-part="…">`, до потомка с СОБСТВЕННЫМ атрибутом не доезжают — доезжает только
      `color`, он резолвит `currentColor` по цепочке наследования независимо от вложенности) не
      решила симптом — user вернулся: «не работает, всё также серое».
      Настоящая причина глубже: `omnifield-diagram` вообще НЕ входила в `forms[]` наряда
      `omnifield` — компонент не получал сгенерированного CSS вовсе, браузер красил его дефолтными
      UA-цветами SVG (потому и «серое» — это не брендовый серый, это отсутствие скина в принципе).
      Проверка ВСЕХ 36 форм против `forms[]` `omnifield` нашла ещё 8 таких же сирот:
      `omnifield-drawer`/`slider`/`splitter`/`timer`/`toggle`/`icon`/`tabs`/`table` — все проходили
      `check_form` с `ok:true` (структурно исправны), ни одна не была подключена к наряду.
      Второй реальный наряд (`amethyst`) страдал тем же — `forms[]` совпадал с `omnifield` ДО
      правки один-в-один (те же 9 пропусков), user сам это заметил, переключив тему.
      `omnifield-date-picker-outline` НЕ добавлен ни в один наряд намеренно — второй, альтернативный
      набор форм для компонента `date-picker`, `omnifield-date-picker` того же компонента уже в
      обоих нарядах, добавление второго значило бы два конкурирующих рецепта одного компонента в
      одном наряде.
      Тег `variantTags` формы `omnifield-diagram` заодно приведён к заявке user — `danger`/`success`
      были помечены `"status"` (дубль оси, диаграммам такой смысл не нужен), теперь все 4 варианта
      (`accent`/`danger`/`muted`/`success`) — только `"default"`.
      Эскалация в доку: `check_form`/`check_outfit` СТРУКТУРНО не могут поймать ни «форма мертва без
      наряда» (наряд — независимая сущность, не обязана перечислять все формы), ни «висячее имя
      animation без keyframes» (то же класс проблемы, что и предыдущая находка этого дня,
      `remote-stand-forms-keyframes-patched` ниже) — user прямо попросил записать оба грабли в
      доку ЧЁТКО, как обязательные пункты, не полагаясь на память через неделю. Сделано —
      `docs/forms.md`, раздел «ОБЯЗАТЕЛЬНО», задел на автоматическую проверку —
      `form-animation-and-outfit-coverage-checks` выше.
      Проверено живьём: `check_outfit` на пропатченных `omnifield`/`amethyst` — `ok:true` на обоих;
      `get_preset` подтверждает `forms[]` несёт все 35 форм за вычетом намеренно пропущенной
      `omnifield-date-picker-outline`. Визуальную проверку самого рендера (красится ли теперь
      диаграмма брендом на живой странице) НЕ делал — витрина `apps/skin` показывает `diagram`
      пустым местом на `showcase` независимо от этой правки, отдельный рендер-баг, им занимается
      user/другой архитектор, не эта зона.

  - id: remote-stand-forms-keyframes-patched
    type: fix
    date: 2026-09-10
    summary: >
      Закрыл находку `remote-stand-forms-missing-keyframes` ниже — вместе с user, через живой
      GraphQL-коннект к `9787` (`env-presets-url-points-to-rest-only-stand` тем временем сама
      рассосалась: тот же `POST /graphql` на `9787` сегодня отвечает нормальным GraphQL, не REST-
      404 — стенд успели поднять на актуальном бинарнике между сессиями, отдельно чинить нечего).
      Прогнал по всем 35 `omnifield-*` формам на `9787`, у кого `recipe` ссылается по имени на
      анимацию, а `keyframes` при этом пуст — нашёл ровно два совпадения: `omnifield-accordion`
      (ссылается на все 4 — `grow/shrink-block-size`, `grow/shrink-inline-size`) и
      `omnifield-tree-view` (только `grow/shrink-block-size`). `omnifield-popover` — канон
      `popover`'s recipe.ts несёт свои keyframes (`popover-in`/`popover-out`), но ЭТА сохранённая
      форма их по имени не зовёт вовсе — молчание безвредно, не трогал.
      Локально `omnifield-accordion` уже был верным (`keyframes` из 4 правил на месте), а
      `omnifield-tree-view` — `null` даже на локальном бэке (8787): форму когда-то сохранили без
      keyframes вовсе, не только не довезли до 9787. Починил локально первым (через `check_form`+
      `save_preset`, с канонными значениями `GROW_SHRINK_BLOCK` из `@web-core/skin/model` — те же
      цифры, что уже в accordion) — по пути наступил на грабли: первый `save_preset` без `label`
      затёр «Омнифилд — дерево» дефолтным `omnifield-tree-view` (`label ?? name` в
      `createPresetsClient`), пришлось пересохранять с явным `label`.
      На 9787 recipe двух форм структурно ОТЛИЧАЕТСЯ от локального (более старая форма — другая
      вложенность `@media`/другие props у `content`), значит это не тот же снимок данных, что
      локально — переносить local's `recipe` целиком значило бы менять форму куда шире
      «добавить keyframes». Вместо этого патчил ТОЛЬКО поле `keyframes` поверх remote-записи как
      она есть — `recipe`/`variantTags`/`label`/`author` remote не тронуты. `author` там —
      `EgorRaybul` (без пробела; локально то же лицо записано как `Egor Raybul`, с пробелом — две
      разные строки для authorGuard, разные окружения писали с разным форматом) — save_preset звал
      с `author` РОВНО как в remote-записи, иначе бы authorGuard отказал.
      Проверено живьём: `check_form` на пропатченном состоянии — `ok:true` на обеих формах ДО
      сохранения; после `save_preset` — повторный `get_preset` с 9787 подтверждает
      `keyframes` на месте (`grow-block-size,grow-inline-size,shrink-block-size,shrink-inline-size`
      у accordion; `grow-block-size,shrink-block-size` у tree-view), `label`/`recipe` не поменялись.
      Живой браузерный замер (`document.styleSheets`/таймлайн клика на самом стенде 9787) не
      делал — эту часть уже подтвердил user до находки через chrome-devtools MCP на симптоме
      "нет @keyframes вовсе"; было бы правильно перепроверить теперь и его, но это следующий шаг,
      не сделан в этом заходе.

  - id: remote-stand-forms-missing-keyframes
    type: finding
    date: 2026-09-10
    summary: >
      Живая заявка user: реальные (не showcase-превью) виджеты витрины — сайдбар-дерево
      (`apps/skin/src/widgets/component/tree`) и раскрывашки списка в редакторе данных
      (`apps/skin/src/widgets/component/input`'s `ListField`, аккордеон) — не закрываются/дёргаются/
      потеряли анимацию открытия на стенде `https://150.251.145.87:9787`. Подозрение user:
      конфликт нашей анимации с анимацией Ark (тот же класс, что уже раз ломал `packages/style`).
      Гипотеза не подтвердилась — конфликта в каскаде нет (`[data-part="content"]` не несёт
      статичной `block-size`/`height`, что перебивала бы keyframe-анимацию, сверено прямым разбором
      всех совпадающих правил стиля через `document.styleSheets`).
      Реальная причина найдена прямым замером живого DOM (chrome-devtools MCP, реальный
      `click` — НЕ синтетический `.click()`, тот на этом стенде вообще не долетал до машины Ark):
      на стенде `9787` в отданном CSS — ЦЕЛИКОМ, по всем `document.styleSheets` — НОЛЬ правил
      `@keyframes` (ни `grow-block-size`/`shrink-block-size`, ни `*-inline-size`), хотя `animation:`
      на `[data-part="content"][data-state="open"/"closed"]` эти имена называет. Браузер молча
      игнорирует анимацию с несуществующим именем — `blockSize` замирает на текущем значении:
      открытие даёт сразу полную высоту без роста (пропала анимация), закрытие оставляет высоту
      замороженной на прежнем значении (не закрывается) — оба симптома user совпадают буква в
      букву. Переключение той же витрины на локальный `backend/presets` (порт 8787, `.env.local` в
      корне воркспейса, `PRESETS_URL=http://127.0.0.1:8787`, не общий `.env` — машинно-локальный
      файл, гитигнорится) на ТОМ ЖЕ коде убирает симптом целиком: все 4 keyframe-правила на месте,
      реальный клик по аккордеону в `widgets/component/input` — рост от 0 до измеренной высоты
      на открытии, схлопывание до `hidden` на закрытии, оба подтверждены таймлайном вычисленного
      стиля по кадрам.
      Код признан исправным (проверено чтением, не по памяти): `packages/skin/src/engine/look/
      assemble.ts` мёрджит `form.keyframes` каждой формы наряда в `skin.keyframes`,
      `packages/skin/src/engine/generate/print.ts`'s `keyframesText()` печатает `@keyframes` из
      `skin.keyframes`, `generate/index.ts` включает их в текст CSS — путь от `form.keyframes` до
      отданного `@keyframes`-правила цел на всех трёх шагах. `packages/ui/src/accordion/playground/
      recipe.ts` экспортирует `keyframes: {...GROW_SHRINK_BLOCK, ...GROW_SHRINK_INLINE}` как
      положено. Значит дело не в движке/не в переезде на аксесоры (`unified-item-collection-engine`
      этот файл вообще не трогал) — дело в ДАННЫХ на стенде `9787`: сохранённая там запись формы
      `accordion` (и, вероятно, `tree-view` — не проверено по отдельности, тот же класс симптома)
      либо записана ДО того, как поле `keyframes` появилось в recipe, либо анимацию туда никогда не
      заносили вовсе.
      Не моя зона чинить — правка данных на удалённом стенде, не код. Эскалирую находку, не
      обхожу: owner'у нужно пересохранить актуальные формы (минимум `accordion`, свериться и по
      остальным с анимацией — `tree-view`, возможные другие) на адрес `9787` тем же путём, что
      `push-to-prod`/сохранение через плейграунд — с ключевым `keyframes`, не только `recipe`.
      После пересохранения стоит повторить тот же живой замер (`document.styleSheets` → количество
      `@keyframes`-правил, реальный клик + таймлайн `data-state`/`blockSize` по кадрам), не верить
      на слово, что записалось.

  - id: env-presets-url-points-to-rest-only-stand
    type: finding
    date: 2026-09-09
    summary: >
      Живая проверка retire-engine-store/feedback-tools-migration нашла: корневой `.env`'s
      `PRESETS_URL` (`https://150.251.145.87:9787`) отвечает REST-совместимым `{"error":
      "not_found",...}` на `POST /graphql` — 404, служба на этом адресе ещё не несёт GraphQL,
      хотя и `packages/skin/src/presets/client.ts`, и эта зона уже целиком на GraphQL. Не
      находка про мой код: тот же адрес раньше так же обслуживал REST, просто раньше этой зоне
      GraphQL не был нужен. Затронуто шире одной зоны — сама витрина `apps/skin` тоже ходит через
      `createPresetsClient`, значит и ей на этом стенде должно быть так же плохо. Не моя зона
      чинить (инфраструктура/деплой стенда), эскалирую находку, не обхожу молча. Для живой проверки
      здесь поднят локальный `backend/presets` (порт 8787, свежая пересборка) и `skin-mcp` временно
      запущен с явным `SKIN_MCP_PRESETS_URL=http://127.0.0.1:8787` поверх `.env`'s значения —
      только для проверки этой сессии, не постоянная правка окружения.

  - id: api-shape-rework-decided
    type: plan
    date: 2026-09-08
    summary: >
      User измерил реальные ответы на поднятом сервере и назвал происходящее прямо: одна ручка
      отдаёт половину репозитория, файл на 500 строк, это не соответствует тому, чем МСИПИ стал
      (полноценный сервис на пике популярности, не утилита). Решено не чинить точечно, а сперва
      сверить план с источниками: спека MCP, Anthropic «Writing effective tools for agents», реальный
      исходник chrome-devtools-mcp (не по памяти). Первый предложенный вариант (get_passport с
      флагом response_format:concise/detailed) user отклонил метко: «паспорт» не должен решать,
      входит ли в него сборка или анатомия — это разные сущности, а не разная подробность одной.
      Также рассмотрен и отклонён GraphQL — несоразмерно задаче (фиксированный маленький набор
      граней компонента, не глубокий произвольный граф; модели пришлось бы писать текст запроса
      вместо заполнения обычной JSON Schema). Итоговая форма — три честно названных тула
      (get_passport/get_assemblies/get_io_schema), решение записано в api-response-shape-rework.
      Прошлая версия этого файла (посценарийная история находок и точечных починок) удалена по
      прямому указанию user — новый вид описывает ТЕКУЩЕЕ и ПЛАНИРУЕМОЕ состояние, не хронологию
      ошибок.

  - id: external-agent-remeasured-independently
    type: plan
    date: 2026-09-08
    summary: >
      Внешний агент замерил зону заново после api-response-shape-rework, независимо от внутренних
      цифр этого файла — совпало: разведка «список → паспорт» подешевела с ~14.9k до ~7.5k токенов
      без фильтра, ~4.8k с ним; list_components 17358 → 8271 символов (288 с group=actions);
      get_passport 16354 → 4005 на другом реальном компоненте (io-схема и сборки уехали в свои
      ручки); instructions 1650 → 423 символа; при удвоении числа ручек (13 → 24) вес описаний
      остался тем же ~9.7k — то есть резали осознанно, не дали разрастись. Та же заявка сразу нашла
      следующий слой (limitSchema, list_feedback, list_presets без kind) — см. пункты выше в этой
      категории, все три закрыты тем же заходом.

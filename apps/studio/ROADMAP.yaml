      - id: no-tests
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Единственный интеграционный тест бил через мёртвый код — почищено"
        description: |
          Было (текст ТЗ устарел ещё до открытия — проверено ДО правок): `test/` не пустая, в ней
          уже пять файлов, четыре проходили. Пятый (`input-to-preview.test.tsx`, «автогенерация на
          смену компонента доезжает до показа текстом») падал: `widgets/component/preview` (его
          единственный потребитель) звал `<Slot slides={[...]}>` — устаревший контракт, `Slot`
          (`entities/showcase/ui/slot`) давно принимает `component`/`tag`/`assemblies`/`variants`/
          `loading` (переехал ещё в `slot-loader-around-renderer`), реальная витрина
          (`pages/showcase`) зовёт именно так. `widgets/component/preview` нигде в коде больше не
          импортировался (только реэкспорт из барреля) — мёртвый код, живший исключительно ради
          этого теста. Название теста прямо называло причину: он проверял фейк-генератор
          (`zocker`), которого больше нет (`zocker-removed`).

          Остальные четыре теста — три узких регрессионных теста ДВИЖКА (`RenderTree`/
          `RenderNode`, `@web-core/assembly`, голым API без виджетов приложения) и один про
          процентное кодирование логина в заголовке чата (`chat-session.test.ts`) — валидны,
          не тронуты. Ни один не проверял РЕАЛЬНЫЙ путь через актуальный `Slot`, который README
          называет "Сборки… проверены только вручную".

          Сделано: `widgets/component/preview` снесён целиком (директория + строка в барреле
          `widgets/component/index.ts`) — согласовано с user до правки. `input-to-preview.test.tsx`
          переписан на актуальный контракт `Slot` (тот же, каким его зовёт `pages/showcase`), два
          случая: (1) сохранённый content-рекорд долетает до видимого текста показа
          (`data.label` → `/label`-биндинг паспорта button) — то, что README называет проверенным
          только руками, теперь проверяется прогоном; (2) пустой список content не роняет показ
          (мок-строка `"-мок-"`, которую `Input` кладёт при пустом списке, НЕ рендерится текстом —
          у button биндинг `/label`-путём, скаляр вместо объекта не находит поле, значит проверять
          "текст не пуст" для этого случая было бы неверно — тест проверяет только "не упало").
          Сеть не трогали: `@web-core/skin/presets`'s `createPresetsClient` замокан целиком
          (`vi.mock` + `vi.hoisted` под мутируемое состояние моков между двумя `it`), настоящие
          `componentInfo`/`Input`/`Slot` — без изменений, граница мока — ровно на сетевом клиенте.
          `queryClient.clear()` в `afterEach` — кэш `content-graphql-migration` иначе пережил бы
          между двумя `it` в одном файле и второй тест видел бы данные первого.

  - category: Дерево компонентов
    items:
      - id: tree-item-value-not-id
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Sidebar-дерево: активный узел не подсвечивался, раскрытие одного узла двигало все разом"
        description: |
          Регресс от миграции ДРУГОЙ зоны (`unified-item-collection-engine`, `web-core/ui`,
          2026-09-09) — не моя правка этой сессии, но чинить нужно здесь. `web-core/ui/src/shared/
          utils/collection.ts`'s `createItemTreeCollection` строит identity узла zag-коллекции
          строго по `node.value` (`nodeToValue: (node) => node.value`) — так было решено каноном
          `item` (`value`/`label`/`children?`). `entities/component/model/tree.ts`'s `TreeItemData`
          несла только `id` (старый контракт, до канона) — `.value` не было вовсе, значит
          `nodeToValue` возвращал `undefined` ДЛЯ ЛЮБОГО узла: identity всех узлов схлопывалась в
          один и тот же `undefined`, отсюда оба симптома — раскрытие/закрытие ОДНОГО узла двигало
          состояние, разделяемое ВСЕМИ (баг user: "узлы открываются/закрываются все разом"), и
          `activeValue` (тоже сравнение по `value`) не совпадал ни с одним узлом (баг user:
          "активный элемент не выделяется").

          Починено: `TreeItemData.id` → `TreeItemData.value` (`entities/component/model/tree.ts`),
          два места чтения в `widgets/component/tree/index.tsx` (`payload.id`→`payload.value` в
          обработчике клика, `item.id`→`item.value` в `defaultExpandedValue`) — переименование, не
          новое поле: строковое значение (имя группы/имя компонента) то же самое, что раньше несло
          `id`, просто под именем, которое ждёт кит.

          Проверено живьём (MCP-браузер, `/showcase/button` → `/showcase/checkbox`): свернул
          "Actions" кликом — свернулась ТОЛЬКО она, остальные пять групп остались раскрыты; клик по
          листу "checkbox" — навигация прошла, лист подсветился синим, группа "Inputs" сама
          раскрылась, "Actions" осталась свёрнутой. Раньше (по словам user) оба эффекта были
          разбиты — один клик двигал всё дерево разом.

  - category: GraphQL-переезд (третий шаг цепи backend/presets → web-core/query → потребители)
    items:
      - id: shared-api-presets-single-endpoint
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "shared/api/presets — один адрес /graphql, не сборка ?kind=/id"
        description: |
          Означает: `resolveUrl()` (`shared/api/presets/index.ts`) дописывала `API_PATH =
          "/api/presets"` и комментарием ссылалась на константу `root` в
          `backend/presets/internal/api/handler.go` — файла уже не было, ссылка была мёртвой.
          Заменено на `GRAPHQL_PATH = "/graphql"` (путь держит бэк константой в
          `mux.Handle("POST /graphql", ...)`, `backend/presets/cmd/presets/main.go`), логика
          суффиксации та же (полный адрес с путём принимается как есть, без пути — дописывается).
          `PRESETS_URL`/`VITE_PRESETS_URL` как переопределение не тронуты — один адрес на всё
          приложение, не три копии; трое потребителей (`entities/component/model/info.ts`,
          `.../content.ts`, `shared/ui/theme-switch`) правки не потребовали — все передают
          `PRESETS_URL` как есть в `createPresetsClient({url})`/`createPresetsSkinSource({url})`.

          По ходу найдено (не в этом ТЗ, не чинено): `apps/skin/.mcp/src/engine/store.ts` — свой,
          отдельный REST-клиент с той же мёртвой ссылкой (`API_PATH = "/api/presets"`), плюс
          `.mcp/README.md` и `.mcp/FAQ.md` документируют старые REST-примеры. `.mcp` — отдельный
          пакет (см. `zocker-removed`), отдельное ТЗ.

      - id: content-graphql-migration
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "entities/component/model/content.ts — кэш на сессию, транспорт уже GraphQL"
        description: |
          ИСПРАВЛЕНО (2026-09-09, найдено овнером ДО написания кода — версия ниже отменяет
          первую): исходный текст этого пункта описывал «REST-клиент → graphqlRequest напрямую»,
          но писался ДО того, как `web-core/skin`'s `createPresetsClient` сам переехал на GraphQL
          (`client-graphql-transport`, коммит `4f359e6`) — тот самый клиент, которым этот файл уже
          пользуется. Транспорт здесь уже GraphQL, вопрос был решён в другой зоне, и текст ТЗ этого
          не знал.

          Реальный оставшийся пробел — только кэш на сессию, которого правда не было: каждый заход
          в компонент бил по сети заново (`listContentFor`/`getContentByName` звали
          `presets.list`/`presets.get` без кэша). Решение — НЕ заводить второй, дублирующий
          GraphQL-запрос и свою конверсию ответа (это уже есть и протестировано в
          `client.ts`'s `LIST_QUERY`/`toRecord`), а обернуть существующие вызовы `presets.list`/
          `presets.get` в `queryClient.fetchQuery({..., staleTime: Infinity})` из
          `@web-core/query`. `fetchQuery` — императивный метод клиента, не хук `createQuery`: этот
          файл не Solid-компонент, `createQuery` сюда физически не встал бы.

          `staleTime: Infinity` — намеренно, не заглушка: авто-протухание по времени не нужно,
          если инвалидация явная и событийная (`chat-did-cache-invalidation` — по сигналу из
          `did`, не по таймеру). Два механизма протухания разом (время + событие) были бы лишней
          сложностью без выгоды.

          Сделано: новый `#/shared/api/query-client` (`export const queryClient = new
          QueryClient()`) — общий инстанс СНАРУЖИ `app/index.tsx` (тот его раньше заводил сам и не
          отдавал наружу), нужен и `content.ts`, и будущему `chat-did-cache-invalidation` вне
          Solid-дерева, где `useQueryClient()` не работает. `listContentFor` кэширован ключом
          `["content", "list"]`, `getContentByName` — `["content", "get", name]`, отдельной
          записью, не через список (буквально по тексту ТЗ — обернуть оба вызова, не только
          `list`). Находка по ходу: query-core запрещает `queryFn` возвращать `undefined`
          (означает «данных ещё нет», не «записи нет»), а «имя не найдено» у content — законный
          исход (`/embed/...` без `?content=`) — `getContentByName` кэширует `null` вместо
          `undefined` и разворачивает обратно на выходе.

      - id: chat-did-cache-invalidation
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Ответ агента триггерит перезапрос — chat.did уже приходит, просто не читается"
        description: |
          Заявка user: когда агент через MCP меняет пресет (`save_preset`/`save_content`), витрина
          должна САМА перезапросить задетые данные, не только показать ответ в чате. Расширять MCP
          не нужно — у него нет канала в браузер, канал уже есть: `ChatRunResult.did` (`entities/
          chat/model/api.ts:27`) на каждом `run-finished` несёт `{server, tool, arguments}` по
          каждому вызову MCP-тула за прогон. Сейчас читается только `reply`/`refusal` — `did`
          сознательно не читался (см. `chat-real-backend` выше), этим заходом дочитывается.

          ИСПРАВЛЕНО (2026-09-09, найдено овнером ДО написания кода — версия ниже отменяет
          первую): исходный текст велел вытаскивать `arguments.state?.name`/
          `arguments.state?.component` и инвалидировать по ним. Но реальный кэш, который завёл
          `content-graphql-migration`, — ключи `["content", "list"]`/`["content", "get", name]`,
          НЕ по компоненту (`listContentFor` фильтрует список на клиенте уже ПОСЛЕ чтения из
          кэша) — ключа вида `["content", component]` в коде нет. Для `form`/`outfit`/`palette`/
          `assembly` (виды `save_preset`) кэша в этом приложении вообще нет —
          `componentInfo`/`web-core/ui` на `queryClient` не переехал (снятый отсюда кросс-зонный
          блокер, см. лог ниже). Вытаскивать `name`/`component` сейчас смысла не было — им
          некуда деваться, ни один кэш по ним не ключуется.

          Механика (по факту, не по гипотезе): `sendChatMessage` возвращает `did` — на успешном
          ответе агента пройти по `did`; `tool === "save_content"` →
          `queryClient.invalidateQueries({queryKey: ["content"]})` (TanStack Query матчит по
          ПРЕФИКСУ ключа — накрывает и `list`, и `get`, весь список целиком, без разбора по
          компоненту: дешёвый лишний перезапрос вместо пропущенного); `tool === "save_preset"` →
          `queryClient.invalidateQueries({queryKey: [arguments.kind]})` — сегодня no-op (нечего
          инвалидировать), но задел под конвенцию ключей на будущее, когда `componentInfo`
          переедет на `queryClient`.

          Заявка на форму `did.arguments` ЗАКРЫТА (2026-09-09, ответ box-агента): правило
          структурное, не по именам полей — скаляры доживают до `did` на любой глубине ДО второй
          включительно, объёмные (объекты/массивы глубже) заменяются пометкой размера. Живой
          прогон, пример для `save_preset`:

          ```json
          "save_preset": {
            "kind": "form",
            "state": {
              "name": "proba-did-form", "component": "button",
              "recipe": "«объект из 4 полей»", "variantTags": "«объект из 8 полей»"
            }
          }
          ```

          Значит `arguments.kind`/`arguments.state?.name`/`arguments.state?.component` — ВСЕГДА
          настоящие значения, не пометки (это скаляры на глубине ≤2), а `state.recipe`/`.assembly`/
          `.scales`/… — строка-пометка, не объект: код инвалидации не должен пытаться читать ИЗ
          них, только проверять их отсутствие/наличие как сигнал вида. Правило общее для любых
          будущих ручек ("так это будет работать и с теми ручками, которых ещё нет" — дословно
          box-агент), не привязано к словарю имён этой заявки — не нужно синхронизировать список
          полей при появлении новых kind. Проверено локально агентом на его стороне; на сервере
          прогон не повторялся (платный) — если нужна проверка там, решать user.

          Требует `@web-core/query`'s `QueryClient` смонтированным в приложении, чтобы у
          `invalidateQueries` было что инвалидировать — см. `content-graphql-migration` (первый
          настоящий потребитель `createQuery` в этом приложении, `finding-no-cache` в корневом
          ROADMAP.yaml уже отмечал, что `QueryClientProvider` смонтирован, но не использован).

          Сделано: `entities/chat/model/store.ts`'s `invalidateFor(did)` — по каждому вызову из
          `ChatRunResult.did`, `save_content` дёргает `queryClient.invalidateQueries({queryKey:
          ["content"]})` (совпадение по ПРЕФИКСУ — накрывает и `list`, и `get`), `save_preset`
          дёргает тем же способом по `arguments.kind` (сегодня no-op, задел на будущее). Зовётся из
          `sendMessage` на КАЖДОМ успешном ответе `sendChatMessage` (и `reply`, и `refusal` —
          `did` не привязан к исходу, тулы могли быть вызваны до отказа), не только когда есть
          текстовый `reply`.

      - id: witrina-remote-graphql-live
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Подключить витрину к внешнему стенду — деплой подтверждён живьём"
        description: |
          Закрывает находку `input-widget-real-ui-first-pass` (лог ниже): удалённый стенд БЫЛ на
          старом REST, теперь раскатан на GraphQL и проверен внешне (2026-09-09, отчёт после
          `ship.ps1`): `POST https://150.251.145.87:9787/graphql` отвечает, старый
          `/api/presets` — 404, `/healthz` наружу оставлен. Живой прогон настоящим агентом
          (прочитал группу компонентов → io-схему → `save_preset`) подтвердил и
          `author-header-not-argument` (см. `apps/skin/.mcp/ROADMAP.yaml`) на реальном контуре:
          `author` записи — логин из заголовка (`Raybul`), не то, что мог напечатать агент.

          Дальше — то, ради чего всё это: витрина переходит с локального бэка на этот адрес для
          РЕАЛЬНОЙ работы (создание скинов), не только для теста. `PRESETS_URL`/
          `VITE_PRESETS_URL` (`shared/api/presets`, `.env.local` — не в гит) →
          `https://150.251.145.87:9787/graphql`. CORS на `localhost:5174` уже открыт на бэке —
          проверять с этой стороны нечего, только выставить адрес и убедиться живым запросом
          из браузера.

          Локальный бэк+`.mcp` (тот, что использовали для разработки этой миграции) остаётся —
          для разработки и тестов функционала внутри репозитория, не для создания реальных
          скинов. Внешний контур — отдельная, параллельная площадка: там же тестируются внешние
          агенты и их функционал, не только витрина.

          Старые записи на внешнем стенде несут разнобой в `author` (`Egor Raybul` /
          `egorraybul@gmail.com`) — следы прежних, REST-эры заливок, не сегодняшней миграции;
          не чинить задним числом, только новые записи идут через заголовок.

          Сделано: НИКАКОЙ правки не потребовалось — корневой `.env` воркспейса (машинный, не в
          гит) уже держал `PRESETS_URL=https://150.251.145.87:9787` ДО этой сессии (тем самым
          адресом и была найдена находка `input-widget-real-ui-first-pass` — старый бэк на нём
          отвечал REST-404). Раз бэк переехал, тот же адрес автоматически стал верным: `resolveUrl`
          (`shared-api-presets-single-endpoint`) сам дописывает `/graphql`, вторая правка не нужна.

          Проверено живьём (свой dev-сервер 5175, БЕЗ переопределений): `/showcase/button` —
          наряд `omnifield` надет полностью (стили, не голый HTML), выпадашка "Наши данные"
          показала настоящую сохранённую запись, поля `label`/`data-variant`
          (`input-widget-real-ui`) заполнились её реальными значениями, показ отрисовал кнопку
          этими данными в двух сборках (default/status). Реальный сквозной прогон через GraphQL,
          не заглушка.

          НЕ СДЕЛАНО (вне зоны): пункт просил `.env.local` — отдельный, независимый от общего
          `.env` пин на случай, если кто-то переключит общий файл обратно на локальный бэк для
          разработки. Технически такой файл должен лежать в КОРНЕ воркспейса
          (`/workspaces/web-core/.env.local`), не в `apps/skin/` — `envDir` этого приложения
          (`web-core/build/src/vite/app.ts`) жёстко указывает на корень воркспейса, файл ВНУТРИ
          `apps/skin/` Vite не читает вовсе (проверено — завёл такой по ошибке, `loadEnv` его не
          увидел, убрал). Корень воркспейса — не моя зона (`apps/skin/`), создавать там файл не
          стал; раз действующий `.env` и так уже указывает правильно и живой прогон это
          подтвердил, отдельный пин можно завести отдельным мелким шагом через architect, если
          нужна такая страховка.

  - category: "Lab — адаптеры (схема ↔ компонент)"
    items:
      - id: adapter-schema-resource
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Схема — самостоятельный ресурс Lab: скелет чужого ответа, без значений"
        description: |
          План (обсуждение user+architect, 2026-09-10). Юзер добавляет на `/lab` ручку своего
          OpenAPI — приложение сохраняет ТОЛЬКО скелет её ответа: ключи + тип значения, сами
          значения выбрасываются сразу. Схема ни к чему не привязана: не к компоненту, не к
          адаптеру — самостоятельный ресурс, живёт своей жизнью.

          Хранение (persist на бэке, CRUD) — вне `apps/skin`, отдельный трек в `backend/presets`
          (седьмой kind рядом с assembly/content/form/outfit/palette/tag, см.
          `web-core/io/ROADMAP.yaml`'s `adapter-flow-two-way-and-l3` в log). Здесь — только то, что
          показывает и собирает `/lab`: форма добавления ручки, вызов, авто-построение скелета из
          образца ответа.

      - id: adapter-child-of-schema
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Адаптер — дочерний ресурс СХЕМЫ, не компонента: жизненный цикл, много на одну схему"
        description: |
          План (2026-09-10). Адаптер живёт, ПОКА ЖИВА схема — удалили схему, адаптер удаляется
          вместе с ней (адаптировать больше нечего). На одну схему можно навесить сколько угодно
          адаптеров — под аккордеон, под select, под любой другой компонент кита, независимо друг
          от друга. Компонент про адаптеры не знает вообще, ни один — только свой `entity/io.ts`
          (`web-core/ui`), это граница, которую UI не должен размывать.

          Связь поле-в-поле человек пишет РУКАМИ в обе стороны отдельно (приём: поле схемы → поле
          компонента; отдача: поле компонента → поле схемы) — второе направление НЕ выводится
          машиной из первого, оба через один и тот же движок `web-core/io` (`applyFieldRules`
          дважды, разными списками правил). Разбор всей цепочки решения — `web-core/io/ROADMAP.yaml`'s
          `adapter-flow-two-way-and-l3`.

          ИСПРАВЛЕНО (2026-09-11, после первой версии кода в `apps/skin` — жёсткий `schemaId`/
          `component` прямо на `Adapter`, найдено user неверным, разбор ошибки — `DBP.md`):
          "дочерний ресурс схемы" была неточной моделью. Верно — Adapter/OpenAPI(ручка+схема)/
          Component ТРИ НЕЗАВИСИМЫЕ сущности, ни одна не знает о соседях напрямую (адаптер не знает,
          что источник — ручка, а потребитель — компонент; ему это не нужно, он просто принимает
          одну форму и отдаёт другую). Схема (скелет запроса/ответа) была и остаётся собственностью
          ТОЛЬКО ручки (`endpointId`) — в этой части план не поменялся.

          Вместо `schemaId`/`component` у `Adapter` — необязательное поле `channels: Channel[]`
          (`Channel = { in: Ref; out: Ref }`, `Ref = { type: string; id: string }`, `type` —
          открытая строка, не закрытый union: новые типы источников/потребителей появятся снаружи,
          адаптеру не нужно знать список заранее). Это "стабильные каналы" — подсказка UX (не
          перебирать руками все адаптеры на новую пару), не жёсткая связь: адаптер остаётся
          универсальным и может встать в ЛЮБУЮ подходящую пару, объявленную или нет. Пример от user:
          один адаптер с входом "GET users" может обслуживать и `accordion`, и `listbox` — под
          разные компоненты либо один и тот же адаптер (если подходит), либо разные (разный
          ремаппинг), `channels` — просто список подтверждённых сочетаний, юзер ведёт сам.

          Связка "какой компонент + какая ручка + какой адаптер сейчас в работе" (было —
          `getOrCreateAdapter(schemaId, component)` внутри `entities/adapter`) переезжает в новый
          слой `features/` — «шов» компонент↔ручка. `entities/adapter` только показывает мастеринг
          (`AdapterMastering`) уже готовой парой, ничего не резолвит сам.

      - id: openapi-entity-extraction
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "entities/openapi — ручка+схема выносится из entities/adapter в свою сущность"
        description: |
          План (2026-09-11, DBP.md). `entities/adapter/model/endpoint`+`schema`+`ui/openapi` —
          целиком в новую сущность `entities/openapi`. Не только под адаптеры: user прямым текстом
          — "это полноценный свой функционал опенАпи, для любых целей", адаптеры — первый
          потребитель, не единственный. Флоу: юзер добавляет ручку на `/lab` (вручную или вставкой
          готовой OpenAPI-схемы из Свагера), список ручек виден всем, каждая несёт схему
          запроса/ответа целиком. Хранение на бэке — отдельный трек (`adapter-schema-resource`),
          здесь — только UI/модель `apps/skin`. `entities/adapter` после выноса держит только сам
          `Adapter` (тип+стор) и `AdapterMastering`.

      - id: features-layer-component-openapi-join
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "features/ — новый слой FSD: шов компонент↔ручка, выбор пары для мастеринга"
        description: |
          План (2026-09-11). В приложении сегодня только `app/pages/widgets/entities/shared` —
          `features` отсутствует как слой. Заводится под ИМЕННО эту связку: выбор "какой компонент
          + какая ручка" (левое дерево кита + правый райтбар со списком ручек `entities/openapi`)
          и резолв/создание нужного `Adapter` под эту пару — раньше эта логика ошибочно жила внутри
          `entities/adapter` (`getOrCreateAdapter`, знание про `currentComponent`/`currentEndpointId`
          разом). Сама сборка (`AdapterMastering`, две панели схем) остаётся в `entities/adapter` —
          фича вызывает её, передав уже выбранную пару.

      - id: adapter-mapping-ui-wizard
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "UI сведения полей — паттерн CSV-мастера импорта, не конструктор шагов"
        description: |
          Решение по интерфейсу (research 2026-09-10, разбор — log ниже): не повторяем старый
          конструктор адаптера таблиц (`products/tables`, снят) — там связь была не видна даже на
          уровне простого переименования ключей, слишком абстрактно для нетехнического юзера.
          Берём паттерн мастеров импорта CSV (Flatfile/OneSchema/CSVBox) — та же задача (чужой
          источник с неизвестными именами → фиксированная целевая схема), уже обкатана на
          нетехническую аудиторию.

          Экран: две колонки. Слева — ЦЕЛЬ (поля компонента из `entity/io.ts`, фиксированы). Справа
          — ИСТОЧНИК (поля схемы, из `discoverPaths`, уже есть в `web-core/io`). На каждое целевое
          поле — дропдаун с источником, авто-подсказка по похожести имён (не пустой список на
          выбор вслепую). Рядом с каждой строкой — живой пример «было → стало» на реальных данных
          из образца ответа (не абстрактный превью после сохранения — сразу, по ходу настройки).
          Обратное направление (компонент → схема, отдача) — ТА ЖЕ таблица, колонки местами, не
          новый экран и не новая концепция.

      - id: adapter-value-transform-inline
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Преобразование значения — местный контрол у пары полей, не отдельный конструктор шагов"
        description: |
          Продолжение `adapter-mapping-ui-wizard`. Когда паре полей нужна обработка значения (дата
          в чужом формате, словарь кодов, число из строки с запятой) — контрол всплывает ПРЯМО У
          ЭТОЙ строки мастера (например, дропдаун «формат даты: ДД.ММ.ГГГГ», тем же приёмом что
          CSVBox), не уводит в отдельный экран сборки цепочки действий. Под капотом — те же `Step`
          из `web-core/io` (`trim`/`date`/`dictionary`/…), просто интерфейс не показывает юзеру
          слово "шаг" и не заставляет собирать цепочку руками, если хватает одного преобразования.

      - id: adapter-rows-picker-ui
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Выбор набора записей (L3) — карточки-кандидаты, не путь руками"
        description: |
          Для схем, где нужный список лежит внутри обёртки (`/data/items`, `/result`, …) — экран
          ПЕРЕД таблицей сведения полей: кандидаты от `discoverRowSets` (`web-core/io`) показаны
          кликабельными карточками с примером содержимого, юзер выбирает клик, не вписывает JSON
          Pointer руками. После выбора — `discoverRowPaths` даёт список полей ВНУТРИ записи,
          которым дальше наполняется правая колонка `adapter-mapping-ui-wizard`.

  - category: Перформанс переключения компонента на витрине
    items:
      - id: catalog-list-remounts-whole-preview-on-switch
        type: bug
        status: Removed
        priority: High
        milestone: null
        name: "Переключение компонента/наряда даёт 3 подряд ре-монтирования всего превью, не точечное обновление"
        description: |
          Найдено architect'ом (2026-09-14) по жалобе user: "у нас проблемы при переключении
          компонента на ветрине, постоянные перезапросы, на одно и тоже плюс мерцает экран при
          переходе на компоненты которые принимают детей... компоненты мигают, не просто одевают
          скин, а уже одетые мигают раз по 4-5". Проверено чтением (Explore-агент + architect лично,
          не только гипотеза с прошлой недели про `web-core/skin`'s `useKitLife` — та НЕ
          подтвердилась для этого приложения: сигнал `componentData`/`outfitData`
          (`web-core/skin/src/solid/connection.ts:96-108`), который эта гипотеза называла причиной,
          сегодня в `apps/skin` не читает НИКТО (grep по `useComponentSkinData`/`useOutfitData` —
          ноль вхождений), и на повторном разборе architect'ом (с учётом того, что `createMemo`
          в Solid по умолчанию сравнивает СВОЙ результат и не оповещает подписчиков, если он не
          изменился) сама запись `connection.ts` тоже похожа на ложную тревогу, не только на
          "пока не подключено" — отдельно в `web-core/skin/ROADMAP.yaml` пока НЕ заведено, решение
          по плану user: сначала чистая витрина, потом замер движка отдельным заходом, не гадать
          заранее).

          Реальная цепочка, целиком в этом приложении:
          1. `entities/component/model/store.ts:66-84` — `setComponent`/`setOutfit` синхронно
             меняют state И сразу (без ожидания) запускают `loadVariants()`/`loadAssemblies()`
             (`:42-64`, fire-and-forget). На одно нажатие "выбрать компонент" получается ТРИ
             обновления state подряд: сам `setState` в `setComponent`, потом резолв `loadVariants`,
             потом резолв `loadAssemblies`.
          2. `variantsByTag` селектор (`store.ts:89-93`) на каждое чтение зовёт `groupByTag(state.
             variants.data ?? [])` (`@web-core/skin/tags`) заново — тот строит НОВЫЕ объекты
             `{tag, variants}` каждый раз, даже если исходные данные не изменились между двумя из
             трёх обновлений.
          3. `widgets/catalogs/ui/list.tsx:12` — `<For each={props.items}>` (сюда приходит результат
             `variantsByTag`). У `solid-js`'s `<For>` НЕТ пропа `by`/ключа (проверено по
             `node_modules/.pnpm/solid-js@1.9.14/.../flow.d.ts:16-20` — только `each`/`fallback`/
             `children`) — сверка элементов идёт по ССЫЛКЕ объекта. Раз каждое из трёх обновлений
             даёт новый массив новых объектов — `<For>` на каждое из них считает ВСЕ строки
             удалёнными и вставленными заново, а не переиспользует DOM. Полностью размонтируется и
             монтируется заново всё поддерево `DemoStand → Preview → Carousel → Renderer` (реальные
             компоненты кита внутри) — 3 раза на один клик.

          Почему сильнее видно у компонентов с детьми (Accordion/Tabs) — это НЕ отдельный баг:
          `RenderTree` (`web-core/assembly/src/render`) рекурсивно строит self-assembly, у составных
          компонентов в этом поддереве физически больше DOM-узлов/инстансов кита — тот же полный
          ремонт, просто крупнее видно и дольше выполняется.

          Направление (не готовое решение, дизайн — за owner'ом): (а) в `setComponent` дождаться
          `loadVariants`/`loadAssemblies` ПЕРЕД тем как давать `<For>` увидеть новые данные, чтобы
          было одно обновление, а не три подряд — или (б) сделать `variantsByTag`/`groupByTag`
          стабильными по ссылке (мемоизация по фактическому содержимому `variants.data`, не пересчёт
          на каждое чтение), чтобы неизменные строки переживали ре-рендер. Возможно нужны оба —
          (а) убирает лишние ДВЕ волны из трёх, (б) защищает от `<For>`-ремонта на оставшуюся.

          Объём правки небольшой и локальный: `store.ts` (95 строк, трогаются ~15: `loadVariants`/
          `loadAssemblies`/`setComponent`/`setOutfit`/`variantsByTag`), `list.tsx` не обязательно
          трогать вовсе, если (б) закрывает вопрос стабильностью входа. НЕ входит в объём: механика
          `web-core/skin` (`connection.ts`, `useComponentSkin`) — по плану user это отдельная зона,
          отдельный заход ПОСЛЕ того, как здесь станет чисто: сначала замер на чистом приложении,
          потом (если замер покажет реальную проблему, не только код-смелл на бумаге) отдельное ТЗ
          owner'у `web-core/skin`, не раньше.

          Проверка закрытия: живой клик "выбрать компонент" в chrome-devtools (`take_snapshot`
          до/после, `list_network_requests`) — превью НЕ размонтируется полностью (старые DOM-узлы
          компонентов, не относящихся к сменившимся данным, переживают клик), сеть не бьёт по
          вариантам/сборкам повторно на уже виденную пару.

          ТРЕБУЕТ ПЕРЕОЦЕНКИ, НЕ ЗАКРЫТ (сверка доки с кодом 2026-09-20): описанной здесь цепочки
          в дереве больше нет. `entities/component/model/store.ts:66-84` с `setComponent`/
          `loadVariants`/`loadAssemblies` и селектором `variantsByTag` не существует — данные
          компонента ведёт `ComponentProvider` через кэш запросов, а три обновления state подряд
          на один клик были свойством именно снесённого стора. Вторая половина той же жалобы
          закрыта отдельно (`component-store-loads-without-cache`: сеть на повторный заход не
          бьёт, проверено живьём).

          Что из этого следует: мигание показа могло уйти вместе с той цепочкой, а могло остаться
          по другой причине — сегодняшний диагноз не проверялся ни разу. Прежде чем чинить, нужен
          НОВЫЙ замер на нынешнем коде: тот же живой клик, `take_snapshot` до/после. Чинить по
          тексту, описывающему несуществующий код, нельзя.

          ЗАМЕР СДЕЛАН (2026-09-21), пункт ЗАКРЫТ как неверно поставленный: главной причиной были
          не ячейки показа и не `<For>`, а цена одевания в `web-core/skin` — один клик стоил 335
          вызовов `generateComponentSkinCss` (1180 мс), внутри которых заново решалась вся палитра.
          Разбор и цифры — `preview-switch-cost-measured` ниже; остаток, который правда наш,
          вынесен туда же.

      - id: preview-switch-cost-measured
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Переключение компонента: что осталось после починки скина — 492 мс на клик"
        description: |
          Замер (2026-09-21, dev-сервер, без троттлинга, наряд omnifield, переход table → tabs).
          Метод: штатные трассы скина (`globalThis.__WEB_CORE_SKIN_TRACE__ = true` + перехват
          `console.debug`) плюс CPU-профиль главного потока из трассы DevTools, агрегированный по
          self-time.

          БЫЛО: активная работа 1452 мс на клик, из них 917 мс — цветовая математика
          (`oklchToLinear` 235, `tryParseColor` 171, `split` 128, `angle` 77, `number` 55). Причина
          снаружи зоны: одевание каждого инстанса кита печатало CSS заново и внутри пересчитывало
          палитру целиком — 335 `generateComponentSkinCss` / 1180 мс, 670 `skinValues` / 933 мс.
          Заявка ушла владельцу `web-core/skin`, правка принята.

          СТАЛО: 3 вызова `generateComponentSkinCss` / 3 мс, `skinValues` не пересчитывается ни
          разу, цветовых функций в профиле нет вовсе. Активная работа — 492 мс.

          ОСТАТОК, который наш: сборщик мусора 106 мс, планировщик Solid (`runTop`/`runQueue`/
          `cleanNode`) около 90 мс, остальное — загрузка модулей и сеть. Это и есть предмет пункта:
          понять, что именно порождает столько мусора и перепланирований на один клик, прежде чем
          что-то оптимизировать. Гипотеза (НЕ проверена): пересборка всех ячеек показа, см.
          `preview-cells-keyed-by-value`.

          НЕ ЗАКРЫТО ЗАМЕРОМ: контрольный прогон кэшированного перехода (до правок скина он давал
          INP 1289 мс) снять не успели — оборвалось соединение с браузером. Нужен, чтобы иметь
          «отклик на клик» до и после в одинаковых условиях. Прод-сборку не профилировали вовсе:
          все числа сняты на dev-Vite с несобранным китом, сопоставимы между собой, но не с
          поставкой.

          ТЗ (architect, 2026-09-22). Заход — ТОЛЬКО ЗАМЕР, ни одной правки кода. Причина такой
          границы записана в этом же файле дважды: гипотеза про `useKitLife` в скине и гипотеза про
          `<For>` в каталоге обе не подтвердились, а настоящим корнем оказалась палитра — и нашёл
          её замер, а не чтение. Третий раз угадывать дороже, чем померить.

          Что изменилось с прошлого замера: снят `keyed` у провайдера компонента
          (`component-provider-keyed-drops-rail-state`) — поддерево больше не пересоздаётся, значит
          прежние числа сняты на другом дереве. На ревью той правки видно новое поведение: после
          клика адрес уже новый, а показ и панель данных ещё около секунды держат ПРЕДЫДУЩИЙ
          компонент целиком, потом подменяются разом. Это и есть предмет замера.

          Метод — тот же, иначе числа не сопоставимы: dev-сервер, без троттлинга, наряд
          `omnifield`, переход `table` → `tabs`; трассы скина (`globalThis.__WEB_CORE_SKIN_TRACE__
          = true` плюс перехват `console.debug`) и CPU-профиль главного потока, агрегированный по
          self-time. Снять три числа, а не одно: активная работа на клик (сегодня 492 мс, из них GC
          106 и планировщик Solid ~90), отклик на клик (INP — тот самый контрольный прогон, что в
          прошлый раз оборвался) и ЗАДЕРЖКУ подмены — от клика до момента, когда показ несёт данные
          нового компонента. Рядом — сеть (`list_network_requests`): сколько запросов уходит на
          переход и сколько из них на уже виденную пару.

          Ответ, ради которого заход: из чего складывается эта секунда — ожидание сети, пересборка
          ячеек показа или планировщик. Гипотезы называть можно, выдавать за вывод — нет: каждая
          либо подтверждена числом, либо помечена непроверенной.

          Что НЕ делать: не трогать `distributor.tsx` и `@web-core/solid/keyed` (это
          `preview-cells-keyed-by-value`, он ждёт результата замера), не заводить
          `keepPreviousData`/`startTransition` (развилка решается по числам, и первое упирается в
          чужую зону — `defineQuery` опции не пробрасывает), не лезть в `web-core/skin`.

          Результат — запись прямо в этот пункт: числа, метод, дата и вывод, какой пункт чинить
          следующим. Прод-сборку по-прежнему не профилируем, это отдельный разговор.

          Браузер в девбоксе есть (Chrome ставит сам девконтейнер) — прошлый замер оборвался
          именно на этом, теперь повторять нечем.

          Git: работаем в той же ветке, что и первый пункт (`dev`); коммит овнеру можно, пуш и
          влитие — architect.

          ЗАМЕР СДЕЛАН (2026-09-22, на дереве уже БЕЗ `keyed`). Метод как заказан: dev-сервер
          (свой, 5175), Chrome из девбокса, без троттлинга, наряд `omnifield`, переход
          `table` → `tabs`; трассы `skin`/`assembly` включены флагами, счётчики сняты перехватом
          `console.debug`; CPU-профиль главного потока агрегирован по self-time из сырой трассы
          (`Profile`/`ProfileChunk`, сумма `timeDeltas` по сэмплам в окне клика). Все числа — с
          dev-Vite и несобранным китом, с поставкой не сопоставимы.

          ПЕРВЫЙ переход на компонент после перезагрузки страницы: задержка подмены 698 и 464 мс
          (два прогона), INP 264 мс, активная работа главного потока 422 мс в окне 1.2 с и 280 мс
          в окне 0.9 с, из них сборщик мусора 66 и 63 мс, планировщик Solid (`runTop`/`runQueue`/
          `cleanNode`/`markDownstream`) 92 и 55 мс. Сеть — 4 запроса к `/graphql`.

          ВОЗВРАТ на уже виденный компонент: задержка подмены 157 мс, INP 216 мс, активная работа
          206 мс, сборщик мусора 30 мс, планировщик 44 мс, сеть — ноль запросов. Отдельно в
          профиле видно 12.5 мс на собственном перехвате `console.debug` — это цена инструмента, а
          не приложения, и в оценку выигрыша её брать нельзя.

          Скин в обоих прогонах остаётся дешёвым: 3 вызова `generateComponentSkinCss` на 4–5 мс,
          `skinValues` не зовётся, цветовых функций в профиле нет. Разворот дерева показа —
          18 узлов `tabs` на 5–18 мс. То есть ни одевание, ни сборка в эту секунду не входят.

          ИЗ ЧЕГО СКЛАДЫВАЕТСЯ ЗАДЕРЖКА — ответ по числам. Активная работа объясняет 206 мс из
          кэшированного перехода почти целиком; в первом переходе поверх неё ложится ожидание сети,
          и именно оно даёт разницу 157 → 464/698 мс. При этом 4 запроса первого перехода — это
          РАЗОВЫЙ прогрев склада пресетов, а не цена перехода: следующий заход на компонент, где не
          были ни разу, сети не требует вовсе (проверено с очищенным буфером resource timing —
          ноль запросов и ноль модулей). Значит «около секунды» из ревью — это первый переход после
          загрузки, дальше задержка втрое меньше.

          ХАРАКТЕР ПОДМЕНЫ: старое исчезает и новое появляется В ОДИН И ТОТ ЖЕ момент — оба маркера
          дали 464 мс на одном прогоне. Показ держит предыдущий компонент целиком и подменяется
          разом; пустоты между ними нет, мигание из прошлых замеров не воспроизводится.

          ГИПОТЕЗА, НЕ ПРОВЕРЕНА: «держит старое» — не наш код, а Suspense-интеграция
          `solid-query` (ресурс отдаёт прежнее значение, пока не готов новый ключ). Если так,
          эффект `keepPreviousData` уже достигнут даром, и развилка из ТЗ выше
          (`keepPreviousData` против `startTransition`) беспредметна. Проверять отдельным заходом,
          на решение сегодня не опирается.

          ЧТО ЧИНИТЬ СЛЕДУЮЩИМ: `preview-cells-keyed-by-value` целится ровно в планировщик и
          мусор — это 44–92 мс планировщика плюс 30–66 мс GC, то есть верхняя граница выигрыша
          около 100 мс на клик из 206–422 мс активной работы. Делать стоит, но задержку, которую
          видно глазом, он не снимет: она приходит из первого прогрева склада, а не из пересборки
          ячеек. Сама пересборка при этом подтверждена цифрой, а не чтением кода.

          РЕВЬЮ architect (2026-09-22): числа, метод и оговорка про цену инструмента приняты, один
          вывод — нет. «Четыре запроса — разовый прогрев склада» не подтвердился: сеть платится за
          КАЖДЫЙ первый заход на компонент, а не один раз на загрузку страницы. Перепроверено своим
          прогоном (свежая загрузка `/showcase/table`, Chrome девбокса, `list_network_requests`
          после каждого клика): `tabs` первым заходом — 4 запроса; `accordion`, где не были ни
          разу, — снова 4; возврат на `tabs` — ноль; `select` первым заходом — 3. Ноль даёт
          ВОЗВРАТ на виденное, а не то, что склад уже прогрет.

          Следствие важнее самой поправки: «около секунды» — не разовая цена после загрузки, а
          цена обычной работы, потому что человек ходит по компонентам, где ещё не был. «Дальше
          втрое дешевле» верно только для возврата.

          НАХОДКА ПО ХОДУ ПЕРЕПРОВЕРКИ (прочитаны тела запросов): из трёх-четырёх запросов первого
          захода один — `ListPresets(kind: "outfit")` БЕЗ компонента, то есть общий справочник
          нарядов, одинаковый для любого компонента, — и он летит заново на каждый новый компонент.
          Кэш студии ключуется по `["variants", component]`
          (`entities/component/api/presets.ts`), а внутри `variantsOf` из `@web-core/skin/presets`
          зовётся `client.get(outfit)` плюс `list(form, {component})`: под ключ компонента попала и
          та часть, которая от компонента не зависит. Остальные запросы честные — `content` и
          `form` по этому компоненту.

      - id: switch-cost-after-context-removed
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Переключение компонента после снятия контекста — замер и сравнение с прежним"
        description: |
          Замер (2026-09-23) сразу после того, как `ComponentProvider` был снят, а сведения о
          компоненте переехали в `useInfo` с раздельными ожиданиями по запросу. Повод — ощущение
          user'а «интерфейс стал быстрее раз в десять»; как общее ускорение числа его не
          подтверждают, но объясняют, откуда ощущение.

          Метод тот же, что у `preview-switch-cost-measured`, иначе числа несопоставимы: свой
          dev-сервер (5175), Chrome девбокса, без троттлинга, наряд `omnifield`, трассы skin и
          assembly флагами, счётчики перехватом `console.debug`, CPU-профиль главного потока по
          self-time. Добавлено то, чего в прошлый раз не было: подмена меряется ДВУМЯ маркерами
          внутри области показа — отдельно «старое исчезло» и «новое появилось». Область показа
          изолирована последним `workspace/main`: рейл сам собран из компонентов кита, и наивный
          поиск по `data-scope` считал бы его аккордеон за показ.

          ПЕРВЫЙ заход на компонент (в кэше пусто), два прогона — `table → tabs` и
          `accordion → radio-group`: старое исчезает за 161 и 163 мс, новое появляется на 768 и
          447 мс, INP 211 и 235 мс, активная работа главного потока 326 мс (окно 968) и 309 мс
          (окно 650), сборщик мусора 33 и 42 мс, планировщик Solid 45 и 46 мс, сеть — 4 запроса
          к `/graphql`.

          ВОЗВРАТ на виденный компонент: `tabs → table` — 247 и 240 мс, оба маркера совпадают
          (подмена разом), активная работа 264 мс, мусор 26, планировщик 36, сеть ноль. Обратный
          `table → tabs` — 147 мс до ухода старого и 502 мс до появления нового. `radio-group →
          accordion` — 576 мс, INP 673 мс.

          БЫЛО (2026-09-22, с контекстом, та же пара): первый заход — подмена 464 и 698 мс, INP
          264, активная 422 и 280, мусор 66 и 63, планировщик 92 и 55, сеть 4. Возврат — подмена
          157 мс, INP 216, активная 206, мусор 30, планировщик 44, сеть ноль.

          ЧТО ИЗМЕНИЛОСЬ НА САМОМ ДЕЛЕ — характер перехода, не суммарное время. Раньше показ
          держал предыдущий компонент целиком и подменялся разом; теперь старое уходит за
          ~150 мс и на его месте ожидание, а новое доезжает позже. Отсюда ощущение мгновенной
          реакции. Мусор и планировщик упали примерно вдвое — работы на клик правда меньше.
          Время до готового показа при этом НЕ улучшилось: 447–768 мс против 464–698, а на
          возврате местами выросло (240–576 против 157). Скин остаётся дешёвым: цветовой
          математики в профиле нет вовсе, печать CSS — три вызова.

          Сеть не изменилась — 4 запроса на каждый новый компонент: адресное чтение и список без
          тел из свежего клиента (`presets-client-list-and-detail`) ещё не подключены.

          ОГОВОРКИ, без которых числа врут: параллельно работал чужой dev-сервер на 5174, машина
          не была пустой, а прошлый замер снимался в других условиях; всё снято на dev-Vite с
          несобранным китом и с поставкой не сопоставимо; перехват `console.debug` стоит 21–25 мс
          внутри активной работы — это цена инструмента, не приложения; возвраты мерились на
          разных компонентах, `accordion` тяжелее `table`, поэтому его INP 673 мс — не та же
          пара, что мерили в прошлый раз.

      - id: network-one-client-and-heads
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Сеть на переход: один клиент на приложение и скин, список записей без тел"
        description: |
          Разбор (2026-09-23) четырёх запросов, которые уходили на каждый новый компонент. Тела
          запросов прочитаны в браузере, не выведены из кода: `outfit` по имени (наш, через
          `variantsOf`), `content` по компоненту с телами записей (наш) и `form` по компоненту
          ДВАЖДЫ — один наш, ради списка вариантов, второй от источника скина, ради CSS.

          Дубль оказался не дефектом пакета: `createLazyComponentSkin` честно кэширует и наряд, и
          форму по компоненту. Причина в том, что у одних и тех же записей было ДВА владельца
          сети — `createPresetsSkinSource` заводил свой клиент по адресу, и приложение не могло
          свести оба пути в свой кэш. Заявка ушла владельцу `web-core/skin`, правка принята:
          источник принимает готовый клиент (`{client, lookup}` рядом с `{url, lookup}`).

          Сделано у себя: `shared/api/clients/cached.ts` — обёртка над клиентом пресетов, у
          которой `list`/`listHeaders`/`get` идут через `queryClient` со `staleTime: Infinity`, а
          запись пробрасывается как есть; этот клиент отдан и приложению, и источнику скина. Кэш
          остаётся заботой приложения — протухание событийное, по `did` из ответа агента, второй
          механизм внутри движка был бы лишней сложностью.

          Вторая половина объёма: `contentOf` перешёл на `listHeaders` (имя и ярлык), тело
          выбранной записи едет своим запросом по имени — новый `contentRecordOf` и житель
          сегмента `use` (`useContentRecord`). Поставщик записей кормит доску эффектом по приезду
          тела; явный выбор в списке помечается признаком «просьба заменить», иначе он потерялся
          бы против правила «чужую подачу не перебиваем».

          Проверено живьём (dev-сервер, боевой стенд): заход на компонент, где не были, — ТРИ
          запроса (`ListPresetHeads` по content 366 Б, `form` 2399 Б, тело выбранной записи
          266 Б) вместо четырёх, причём объём списка больше не растёт по числу записей; возврат на
          виденный компонент — ноль запросов; выбор другой записи в выпадашке — ровно один запрос,
          и еда доехала до всех семи ячеек показа. Скин при этом надет: `data-skin="omnifield"`,
          110 КБ сгенерированного CSS, токены палитры на месте.

          Осталось открытым: наш `variantsOf` по-прежнему читает форму вторым чтением (уже из
          кэша, без сети). Убрать его совсем можно, если `web-core/skin` даст чистую функцию
          «варианты по уже полученной форме» — заявка не подавалась, решать по надобности.

      - id: variants-from-loaded-form
        type: feature
        status: Backlog
        priority: Low
        milestone: null
        name: "Варианты из уже скачанной формы — убрать второе чтение"
        description: |
          Остаток от `network-one-client-and-heads` (2026-09-23). Сеть за форму компонента платится
          один раз: клиент у приложения и у скина теперь общий, и наш `variantsOf` берёт её из
          кэша. Но читаем мы её всё равно дважды — сначала скин ради CSS, потом мы ради списка
          вариантов, — и своей функции «варианты по уже полученной форме» у нас нет: логика
          «взять форму, принадлежащую наряду, собрать `recipe.variants` плюс `variantTags`» живёт
          в `variantsOf` (`@web-core/skin/presets`) и ходит в сеть сама.

          Чтобы убрать второе чтение, нужна чистая функция на стороне скина, принимающая форму и
          наряд, — заявка НЕ подавалась: после общего клиента выгода маленькая (работа с кэшем,
          не сеть), и городить ради неё правку чужой зоны сейчас незачем. Заведено, чтобы вопрос
          не всплыл заново как новый.

          Рядом лежит вторая половина той же мысли: у скина есть `useComponentSkinData`/
          `useOutfitData` — форма и наряд, уже скачанные для одевания. Читать их вместо своего
          запроса нельзя как есть: они наполняются ПОСЛЕ того, как компонент отрисован, а список
          вариантов нужен до показа — по нему строятся ячейки.

      - id: preview-cells-keyed-by-value
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Ячейки показа пересобираются по ссылке — ключ по значению есть в @web-core/solid"
        description: |
          `ui/containers/distributor.tsx` строит `indexed()`/`entryGroups()`/`groups()` обычными
          функциями: каждое чтение создаёт новые массивы и новые объекты `Cell`. `<For>` из
          `solid-js` сверяет элементы ПО ССЫЛКЕ (у него нет `by`, проверено по `flow.d.ts`
          1.9.14 — только `each`/`fallback`/`children`), поэтому любое обновление читается им как
          «все ячейки удалены и вставлены заново».

          Средство в репозитории есть и не используется: `@web-core/solid/keyed` (реэкспорт
          `@solid-primitives/keyed`) даёт `<Key by=…>` — сверку по значению. Объём: `groups()`
          мемоизировать, список ячеек перевести на ключ «группа + позиция» (адрес у ячейки уже
          есть, `cellKeyOf` в `model/store.ts`).

          Проверка закрытия — замером, не на глаз: тот же клик, активная работа главного потока и
          доля GC до/после (сегодня 492 мс и 106 мс соответственно, `preview-switch-cost-measured`).

      - id: component-provider-keyed-drops-rail-state
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Секции рейла схлопываются при смене компонента — их сносит keyed-провайдер"
        description: |
          Жалоба user (2026-09-21): аккордеон в правом рейле сбрасывает раскрытие при переходе по
          компонентам. Причина найдена чтением: `entities/component/model/context.tsx:51` —
          `<Show when={props.name} keyed>`, то есть смена имени уничтожает ВСЁ поддерево, а рейл
          стоит внутри него (`pages/showcase/index.tsx`). Состояние раскрытия живёт в самой машине
          аккордеона, то есть в этом поддереве: `RailSections` получает только `defaultValue`.

          Почему провайдер вообще такой: это рецепт `web-core/store`'s `EXAMPLES.md` §6 —
          «реактивный ключ семьи → перемонтируй поддерево `<Show keyed>`». Изоляцию по компоненту
          при этом держат сами семьи сторов (`feedStoreOf`/`settingsStoreOf`/`previewStoreOf`/
          `presetPickStoreOf`), а кэш запросов реактивен по аксессору — ремаунт не нужен ни тем,
          ни другим. Заявка ушла владельцу `web-core/store`, механика принята: семью теперь можно
          звать аксессором ключа (`familyOf(() => name)`), §6 переписан.

          Значит правка здесь: снять `keyed`, `ComponentFacts.name` сделать аксессором, четыре
          семьи звать аксессором (тела потребителей при этом не меняются). Проба это подтвердила —
          секции переживают переключение, доски компонентов не путаются, — но в дерево не
          заезжала: откачена по решению user до отдельного захода.

          ОТДЕЛЬНЫЙ ВОПРОС, решить до кода: нужен ли контекст вообще. user: «компоненты будут нужны
          везде, не только в шоукейсе» — тогда выбор между «обернуть контекстом всё приложение» и
          «вынести в стор». Пробовали второе, см. `component-facts-without-provider`.

          ВОПРОС СНЯТ С ЭТОГО ЗАХОДА (разбор architect+user, 2026-09-22): сегодня он беспредметен.
          `ComponentProvider` стоит ровно в двух местах — `pages/showcase` и `pages/lab`, — и обе
          страницы дают ему имя из параметра своего маршрута; `/embed` к нынешней архитектуре не
          подключён вовсе (сказано прямо в `pages/embed/index.tsx`). Выбирать между контекстом и
          синглтоном будем, когда появится читатель фактов ВНЕ страницы с параметром, — тогда же
          понадобится `createSingletonRoot`, иначе вернутся те 154 наблюдателя из пробы. Снятие
          `keyed` этот выбор не предрешает: провайдер остаётся, меняется только то, чем он держит
          имя.

          ТЗ (architect, 2026-09-22). Объём — снять `keyed`, ничего сверх. Разбор кода подтвердил,
          что ремаунт не нужен ни одному потребителю: имя компонента читают девять мест, четыре из
          них адресуют семьи сторов, остальные печатают строку в разметке. Семью теперь зовут
          аксессором ключа (`web-core/store`'s `EXAMPLES.md` §6) — подписка сама переезжает на стор
          нового ключа, состояние прежнего остаётся в семье и ждёт возврата.

          Что меняется: `<Show when keyed>` в `entities/component/model/context.tsx` снимается,
          `ComponentFacts.name` из строки становится аксессором (докблок поля про «внутри имя не
          меняется» уезжает вместе с `keyed`), девять чтений переходят на `name()`, четыре семьи
          зовутся аксессором. Тела потребителей не меняются — наружу семья отдаёт тот же
          `ActionStore`.

          НЕ входит в объём — мигание показа. Это вторая причина, не та же самая: своего
          `<Suspense>` в приложении нет ни одного, поэтому ожидание `createQuery` на смене ключа
          всплывает до `Suspense` роутера и уносит страницу целиком. Мерить его отдельным заходом и
          ПОСЛЕ этой правки — на дереве, где виноватый остался один. Лекарства известны заранее, оба
          штатные (сверено с доками TanStack 2026-09-22 — `placeholder-query-data` и
          `paginated-queries`): `placeholderData: keepPreviousData`, который упирается в
          `defineQuery` (`web-core/query` принимает только `staleTime`, опции наружу не пробрасывает
          — значит заявка в чужую зону), либо `startTransition` вокруг навигации — родной Solid и
          правка у себя.

          Проверка закрытия — живьём, не на глаз: `/showcase`, раскрыть секцию «Показ», уйти на
          соседний компонент — секция осталась раскрытой; накормить компонент руками, уйти и
          вернуться — правка на месте, доски соседей не перепутаны; прогон зоны зелёный
          (`test`/`lint`/`typecheck`).

          Git: ветку заводит architect, овнеру — коммит в неё; пуш и влитие не его.

          СДЕЛАНО (2026-09-22), объём ровно по ТЗ. `<Show when={props.name}>` без `keyed`,
          `ComponentFacts.name` — `Accessor<string>`, синхронный срез кита обёрнут `createMemo`
          (`componentDescriptorOf` зовётся заново на новое имя), запросы зовутся тем же аксессором
          (`variantsOf.use(name)`). Четыре семьи правки не потребовали вовсе: в них и раньше
          передавали `component.name`, а теперь это аксессор — семья различает режимы по
          `typeof key === "function"` сама. Переведены на `name()` пять мест, печатавших строку
          (`passport.tsx`, `form.tsx`, `openapi/ui.tsx`, `lab/kitchen`), плюс докблок `preview.ts`,
          ссылавшийся на `keyed` как на причину стабильности стора.

          Проверено прогоном: новый `test/component-provider-name.test.tsx` (2 теста) — узел
          поддерева переживает смену имени (тот же DOM-узел, одно монтирование) и доски
          компонентов не путаются (еда кнопки ждёт возврата, пока кормят аккордеон). Тест ловит
          регресс: с возвращённым `keyed` краснеют оба случая — проверено. Зона зелёная:
          `eslint` 0, `tsc` 0, 15 файлов / 70 тестов. Красным остаётся `.mcp/test/presets.test.ts`
          — чужая зона (`apps/studio/.mcp`), падает и на дереве без этих правок (сверено
          `git stash`), не трогал.

          НЕ ПРОВЕРЕНО ЖИВЬЁМ: браузера в контейнере нет (`chrome-devtools` не стартует —
          `/usr/bin/chromium` отсутствует), поэтому клик «раскрыть секцию → уйти на соседний
          компонент» снят не был. Свойство, ради которого правка делалась, покрыто прогоном, но
          сам рейл в проверке не участвовал — живой прогон остаётся за тем, у кого браузер есть.

          РЕВЬЮ architect (2026-09-22): принято. Браузер в девбоксе починен отдельно — Chrome
          ставит сам девконтейнер, — и живой прогон снят, тот самый, которого не хватало отчёту.
          `/showcase/button`: раскрыл секцию «Показ», поправил руками `label` на «РЕВЬЮ-МЕТКА»,
          ушёл на `checkbox`, вернулся. Секция пережила оба перехода раскрытой, и это видно не на
          глаз: узлы рейла в снимке сохранили свои адреса через все переходы, а ячейки показа
          каждый раз получали новые — сносится только показ, поддерево провайдера живо. Доски не
          перепутались: у `checkbox` поле пустое и пресет не выбран, возврат на `button` вернул
          «РЕВЬЮ-МЕТКА» и в поле, и во все семь ячеек. Прогон повторён своими руками: `tsc` 0,
          `eslint` 0, 13 файлов / 58 тестов зелёные (прогон без `.mcp` — чужая зона).

          НАБЛЮДЕНИЕ ПО ХОДУ, не дефект этой правки: сразу после клика по соседнему компоненту URL
          уже новый, а показ и панель данных ещё держат ПРЕДЫДУЩИЙ компонент целиком — снимок
          поймал `button` с его едой на адресе `checkbox`, через секунду всё встало на место.
          Раньше это место мигало пустотой, теперь секунду показывает устаревшее. Это и есть
          предмет отложенного замера и выбора между `keepPreviousData` и `startTransition`.

      - id: component-facts-without-provider
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Факты о компоненте без провайдера: что выяснила проба со стором"
        description: |
          Проба (2026-09-21, по ТЗ user, в дерево не заезжала — откачена): `ComponentProvider`
          снят, имя компонента положено в `componentStore` рядом с нарядом, страница кладёт его
          эффектом на параметр маршрута, `useComponent()` собирает факты из стора и кэша запросов.

          Что проба показала — это и есть ценность записи:

          1. Писать имя в `loader` маршрута НЕЛЬЗЯ: `defaultPreload: "intent"`
             (`web-core/router`'s `defaultRouterOptions`) гоняет загрузчик на наведение, и витрина
             переключалась бы до клика. Место записи — страница, эффектом.
          2. Без провайдера `useComponent()` заводил СВОЮ пару запросов у каждого читателя — 154
             вызова на один переход (замерено). У свежего наблюдателя нет предыдущих данных,
             поэтому каждый уходил в ожидание. Лечится `createSingletonRoot`
             (`@web-core/solid/rootless`): факты строятся один раз на приложение.
          3. Ожидание всплывает до `<Suspense>` РОУТЕРА (`@tanstack/solid-router`'s `Match.js`) и
             уносит в офскрин всю страницу — доказано маркером на DOM-узле: из главной области
             уезжает и возвращается ТОТ ЖЕ узел. Отсюда «мигает всё, кроме хедера». Источник
             ожидания — рейл: его панели читают данные компонента.
          4. `placeholderData: keepPreviousData` ожидание снимает, но `defineQuery`
             (`web-core/query`) опции не пробрасывает — нужен свой `createQuery`, и ему нужен
             явный `queryClient`: синглтон живёт вне дерева и провайдера не видит.
          5. Ловушка, на которую напоролись: `queryFn`, зовущий тот же `defineQuery` с тем же
             ключом, вешает запрос на себя — пустой экран без единой ошибки в консоли. Фетчер и
             запрос разводить обязательно.

          Что решить до кода: цена `keepPreviousData` — доли секунды варианты будут от прежнего
          компонента, а паспорт и сборки уже от нового. Либо показ переключается целиком по
          приезде всех данных, либо ожидание показывается локально в показе, а не страницей.

          РАЗВИЛКА ЗАКРЫТА (2026-09-23): выбран третий путь, которого в пробе не было — семья
          ячеек с активной (`component-cell-family-with-active`). Ни контекста с ремаунтом, ни
          синглтона фактов: синхронное знание живёт в ячейке по имени, активную называет маршрут,
          читатели берут `active()`. Находки пробы остаются в силе как грабли — запись в
          загрузчике маршрута, наблюдатель на каждого читателя, `queryFn`, зовущий сам себя, —
          и именно поэтому асинхронное чтение собирается в одном месте, сегменте `use`
          (`entity-use-segment`), а не заводится каждым потребителем.

      - id: component-store-loads-without-cache
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "loadVariants/loadAssemblies бьют по сети заново на каждое переключение, кэша нет вовсе"
        description: |
          Тот же триаж, что `catalog-list-remounts-whole-preview-on-switch` (тот же клик, вторая
          половина жалобы user: "постоянные перезапросы, на одно и тоже"). Отдельный пункт, потому
          что чинится отдельно от ремонта DOM — это про сеть, не про реактивность.

          `entities/component/api/presets.ts:16-20`'s `variantsOf` и `:11`'s `assembliesOf` — прямые
          вызовы `presetsClient.list`/`variantsOfOutfit` (`@web-core/skin/presets`), без единого
          кэша. Каждый `setComponent`/`setOutfit` (`store.ts:66-84`) — это заново `client.get(outfit)`
          + `client.list(form, {component})` внутри `variantsOf` (`web-core/skin/src/presets/
          variants.ts:15-18`, у него самого кэша тоже нет — он и не должен, это дешёвая stateless-
          функция, дедуп не её ответственность) плюс `client.list(assembly, {component})` — целыми
          списками, даже если пара (наряд, компонент) уже грузилась в этой сессии секунду назад.

          Средство под рукой уже есть и не используется: `shared/api/clients/index.ts:5` заводит
          `export const queryClient = new QueryClient()` (`@web-core/query`), `QueryClientProvider`
          смонтирован в `app/index.tsx` — но живого потребителя `createQuery`/`.fetchQuery(`/
          `invalidateQueries` во всём приложении сегодня НЕТ (проверено grep'ом по `apps/skin/src`,
          ноль вхождений) — заведён впрок, не подключён. Роадмап раньше описывал похожую обвязку
          вокруг `content.ts` (`content-graphql-migration`, ниже в этом же файле, статус Done) —
          но файла `entities/component/model/content.ts` в репозитории сегодня нет (проверено —
          не найден), похоже приложение с тех пор рефакторили и этот путь уехал/исчез; ссылаться на
          него как на живой пример нельзя, статус того пункта разошёлся с кодом. Значит здесь —
          первый реальный живой потребитель `queryClient`, не повтор существующего приёма.

          Направление: обернуть `variantsOf`/`assembliesOf` (и, раз уж заход один, `palettesOf`/
          `outfitsOf`, они того же вида в том же файле) в `queryClient.fetchQuery({queryKey: [...],
          queryFn: ..., staleTime: Infinity})` — ключи по факту различающих параметров
          (`["variants", outfit, component]`, `["assemblies", component]`), протухание — по явной
          инвалидации, не по таймеру (тот же довод, что был у content-миграции: авто-протухание
          излишне, если событие смены наряда/компонента уже известно коду). Инвалидация имени наряда
          уже есть в жизненном цикле `SkinProvider`/`connection.ts` на смену наряда — owner решает
          сам, откуда его дёргать здесь (`setOutfit`, вероятно).

          Объём: `entities/component/api/presets.ts` (31 строка, все 4 экспорта). Возможна лёгкая
          правка `store.ts`, если инвалидация нужна оттуда. НЕ входит в объём: сам `presetsClient`/
          `variantsOf` в `web-core/skin` не трогаются — дедуп на уровне HTTP/GraphQL им не нужен,
          кэш — забота вызывающего приложения, не механики.

          Проверка закрытия: `list_network_requests` в chrome-devtools — переключение компонента
          туда-обратно (A→B→A) на одном наряде не даёт повторного запроса на уже виденную пару
          (наряд, компонент).

          СДЕЛАНО (обнаружено при сверке доки с кодом 2026-09-20, не этим заходом — правка приехала
          раньше): `entities/component/api/presets.ts` целиком на `defineQuery(queryClient, ключ,
          запрос, {staleTime: Infinity})` — все четыре названных экспорта плюс `contentOf`, ключи
          по различающим параметрам (`["variants", component]`, `["assemblies", component]`).
          Текст пункта успел устареть и в другом: `entities/component/model/store.ts:66-84` с
          `loadVariants`/`loadAssemblies` больше не существует — данные компонента ведёт
          `ComponentProvider`, а кэш и есть их стор.

          Проверка закрытия прогнана ровно так, как требовал пункт (dev-сервер, chrome-devtools,
          `/showcase`): первый заход на `button` — 25 запросов к `/graphql`; клик на `checkbox` —
          +4 (новая пара, законно); возврат на `button` — +0. Повторного запроса на уже виденную
          пару нет.

  - category: Кормление компонента
    items:
      - id: feed-board-entity
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "entities/feed — доска кормления: поставщик и потребитель еды не знают друг о друге"
        description: |
          Означает: еда уехала из стора показа в собственную сущность. Поставщик кладёт порцию
          (`serve(by, data)`), потребители читают (`data()`), метка `by` говорит, чем накормлено
          сейчас, и по ней же интерфейс решает, чья панель настройки активна.

          Почему не осталась в показе: еда не его свойство, и потребитель у неё не один — кормить
          нужно и изолированный показ, и будущий редактор, и тестирование, а каждый завёл бы свою
          копию. Разбор — FAQ.md.

          Метка — открытая строка, не перечисление: сущность не знает списка поставщиков и не
          меняется от появления нового. Как поставщик выбрал эти данные (имя записи, черновик
          формы, адрес ручки) на доске НЕ лежит — это нужно только ему и живёт в его сторе.

          Доска плоская и одна на компонент. Прежний стор показа умел адресовать корм ячейкой, но
          ни один живой вызов ячейку не передавал — механика без потребителя, ячейки остались
          понятием показа.

          Еда клонируется на входе: приезжает из чужого стора, где может лежать реактивный прокси,
          а immer морозит положенное глубоко. Клонирование стоит на доске, а не у поставщиков —
          иначе первый забывший роняет того, у кого взял. Проверяется `test/feed-board.test.ts`
          (4 теста), включая прямую проверку, что исходный объект не заморожен.

          Своего провайдера у сущности нет: компонент уже назван `ComponentProvider`'ом, стор —
          семья по его имени. Второй контекст рядом дал бы то же самое и ещё одно место, где два
          имени расходятся.

      - id: feed-providers-as-features
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Поставщики еды — отдельные слайсы под features/feed, показ о них не знает"
        description: |
          Означает: `features/feed/preset` (выбор сохранённой записи) и `features/feed/manual`
          (правка формой по io-схеме). Показ читает только `useFeed().data()` — ни про записи, ни
          про формы, ни про будущие ручки он не знает.

          Общего barrel'а у группы НЕТ намеренно: импорт одного поставщика не должен тянуть
          остальных — `feed/manual` тащит `@web-core/feeder`. Ходят точечно, `#/features/feed/preset`.

          `preset` держит свой стор — выбранную запись. Еду кладёт эффект, а не обработчик: тело
          записи живёт в кэше запросов и может приехать позже выбора или смениться под ним, и
          подача из эффекта доносит такое обновление до доски.

          Чужую подачу поставщик не перебивает (человек поправил руками — возврат на компонент это
          не откатывает), но имён соседей при этом не знает: проверяется факт «положил не я»
          (`by !== undefined && by !== "preset"`), метка читается через `untrack` — иначе
          собственная подача будила бы тот же эффект по кругу. Явный выбор в списке кормит
          отдельно и сразу.

          Проверено живьём (dev-сервер, chrome-devtools, `/showcase/button`): запись доезжает до
          всех семи ячеек показа; форма ручного ввода показывает еду, положенную ПОСТАВЩИКОМ
          ЗАПИСЕЙ (они никак не связаны в коде — это и есть доказательство шва); правка руками
          доезжает до показа обратно; уход на соседний компонент и возврат ручную правку сохраняет.

  - category: Панель кормления
    items:
      - id: feed-panel-one-section
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Поставщики еды — один блок в секции «Данные», а не секция на каждого"
        description: |
          ТЗ user (2026-09-21): все поставщики в одну секцию рейла, во `Flow`, с разделителем
          между ними; секцию назвать «Данные».

          Разобранный по ходу изъян раскладки (замечание user): `widgets/feed` отдавал
          `feedSections()` и ради формы записи импортировал `RailSection` у `widgets/rail` —
          виджет, лезущий к соседу по СВОЕМУ слою. Теперь наружу едет `FeedPanel` — готовый блок,
          а секцию вокруг него называет страница, место сборки виджетов. Связи внутри слоя не
          осталось.

          Поставщики завёрнуты в `FlowItem`, между ними — `FlowItem` с чертой. Черта сейчас
          нарисована стилем по месту (`border-block-start` + `currentColor`, работает в обеих
          темах): отдельного компонента-линии в ките нет — `MenuSeparator` адресуется
          `data-scope="menu"` и снаружи меню не живёт, ручка `splitter` про другое, у наряда
          `omnifield-surface` варианта-черты тоже нет (проверено паспортами и складом пресетов).
          Решение user: временно стилем, компонент кита он заведёт позже — тогда инлайн уходит.

          Проверено живьём (dev-сервер 5175, chrome-devtools, `/showcase/accordion`): в рейле три
          секции — «Показ», «Настройки», «Данные»; внутри «Данных» пресет, черта, ручка API,
          черта, форма ручного ввода. Линии нарисованы обе, панель не разъехалась.

  - category: Настройки компонента
    items:
      - id: component-settings-panel
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Секция «Настройки» — панель настроек компонента из его же паспорта"
        description: |
          ТЗ user (2026-09-21): у компонента есть настройки, которые он умеет — человеческая
          половина в `web-core/ui/<компонент>/playground/settings.ts`, машинная в
          `entity/passport.ts`. Нужен интерфейс к ним в уже принятой манере приложения.

          Объём согласован с user до кода: один набор на компонент на весь показ (настройки —
          корневые пропы, а ось вариантов уже занята); значения живут только сессию; место —
          витрина (`/showcase`), не лаборатория; компонент без настроек оставляет секцию пустой.

          Сделано доской, как кормление: `entities/settings` держит выбор (семья сторов по имени
          компонента, в состоянии только тронутое человеком), `features/settings` показывает
          панель, показ (`features/preview`'s вьюха формы) читает доску и кладёт результат в
          `rootProps` рендерера. Панель и показ друг о друге не знают.

          Список настроек, их контролы и зависимости витрина не описывает — берёт из паспорта:
          `values.kind` решает контрол (`flag` → `Switch`, `choice` → `SegmentGroup` с вариантами
          паспорта), `byDefault` даёт значение нетронутой настройки, `means` из среза редактора —
          подпись под строкой и подсказку на варианте. Применимость считает `settingApplies`
          (`@web-core/skin/model`) — у неё до сих пор не было ни одного потребителя, своё правило
          под `dependsOn` не писали.

          `useComponent()` получил `passport`: машинная половина среза наружу не отдавалась, хотя
          `componentDescriptorOf` её уже возвращала.

          Чистая логика вынесена в `entities/settings/lib` (`settingsOf`/`effectiveValues`/
          `rootPropsOf`) и покрыта `test/component-settings.test.ts` (8 тестов) на НАСТОЯЩИХ
          паспортах кита (`accordion` — три настройки с зависимостью, `button` — ни одной):
          состав и порядок списка, умолчание против выбранного, погасание `collapsible` при
          `multiple`, отсев неприменимого из корневых пропов, изоляция досок соседних компонентов.

          Проверено живьём (свой dev-сервер 5175, chrome-devtools, `/showcase/accordion`): секция
          построила три настройки с прозой из `playground/settings.ts`; `horizontal` развернул все
          семь ячеек показа (`data-orientation` у каждой, аккордеон рейла не задет); включённый
          `multiple` погасил `collapsible` (`data-disabled` + приглушение) и реально дал держать
          два раздела открытыми разом; снятый `multiple` вернул соседку в строй. `/showcase/button`
          — секция на месте и пуста, консоль чистая.

          Не сделано намеренно: сохранение выбора (решение user — только сессия), настройки в
          `/embed` (своего канала для них у изолированного показа нет), виды значений сверх
          `flag`/`choice` — других паспорт сегодня не знает.

  - category: Имена и раскладка
    items:
      - id: preview-feature-renamed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "features/component-manager → features/preview: имя называет механику, не приложение"
        description: |
          Означает: «менеджер компонентов» описывал всё приложение и не отличал фичу ни от чего —
          следующая (тестирование, валидаторы) была бы таким же «менеджером». Папка при этом уже
          сама себя называла иначе: внутри лежал `ui/demo-stand` со своим README, терминология
          модели была «стенд».

          Переехало в два шага, чтобы ревью отличало переименование от архитектурной правки:
          сперва `demo-stand` (плюс схлопнут дублирующий `ui/demo-stand` уровнем выше), затем
          `preview` — «стенд» называет мебель, а не механику. Префикс `component-` не взят: в этом
          приложении его можно дописать к чему угодно.

          `model/stand.ts` → `model/preview.ts`, `useStand` → `usePreview`, `demoStandStoreOf` →
          `previewStoreOf`, три теста следом. Проза приведена к тому же слову — иначе дока
          рассказывала бы про стенд, которого в коде нет.

      - id: widgets-name-place-not-owner
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Виджеты названы местом или темой: rail, preview, feed вместо *-manager"
        description: |
          Означает три правки одной природы.

          `widgets/rail` — поверхность бокового рейла, принимает детей. До этого была написана
          дважды под двумя именами: блок под фичу «API» в лаборатории и панель управления в
          витрине, причём вторая копия обходилась без прокрутки вовсе. `widgets/lab-manager` снят
          целиком — своей логики там не было, а переключение между фичами, которое он обещал
          завести у себя, давно живёт в `pages/lab` на `NavigationTabs`.

          `widgets/component-manager` распался по темам: `widgets/preview` (`PreviewArea` —
          рабочая область показа, `PreviewControls` — переключатели) и `widgets/feed` (`FeedPanel`
          — по секции на поставщика). Панель до этого смешивала две оси, и будущий поставщик из
          ручки полез бы в виджет чужой темы.

          Отступ содержимого переехал внутрь поверхности: снаружи он оставлял полосу прокрутки
          внутри отступа и был только у одной из двух копий — сведение обязано выбрать одно.

          Отсюда же критерий «общего» виджета: он общий, если не импортирует ни одной фичи и ни
          одной сущности приложения. По нему `catalogs`/`navigations`/`header`/`rail` готовы уехать
          в отдельный пакет, а `preview`/`feed` — нет и не будут.

      - id: rail-sections-widget
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "RailSections — секции рейла списком, а не аккордеоном на каждом месте вызова"
        description: |
          ТЗ user (2026-09-21): аккордеон в рейле собирался руками на каждом месте вызова —
          `AccordionItem`/`AccordionControl`/`AccordionControlIndicator`/`AccordionContent` на
          каждую секцию. Нужен виджет, которому дают список секций (заголовок + содержимое), а
          разметку он держит у себя.

          Форма контракта выбрана user из трёх предложенных: массив `items` с `{value, label,
          children}` — порядок явный, значение для раскрытия своё, заголовок любой `JSX`. Запись
          «заголовок → содержимое» (как у `NavigationTabs`) отклонена: ключ работал бы разом и
          именем секции, и значением состояния. Управление раскрытием отдаётся наружу теми же
          именами, что у корня аккордеона кита (`multiple`/`collapsible`/`value`/`defaultValue`/
          `onValueChange`) — виджет своего состояния не держит.

          Поверхность рейла осталась отдельным виджетом (`RailPanel`): в витрине рядом с секциями
          лежит `PreviewControls`, который аккордеоном не оборачивают, и слияние двух виджетов в
          один закрыло бы это место. Папка стала россыпью — `ui/panel.tsx` + `ui/sections.tsx`,
          снаружи вход тот же `#/widgets/rail`.

          `Surface` вокруг содержимого секции виджет НЕ ставит: это чрома содержимого, а не
          раскладка, и решает её вызывающий — `FeedPanel` оборачивает сам, как оборачивал раньше.

          `widgets/feed` переведён на виджет этим же заходом (решение user): ручной аккордеон из
          него ушёл целиком, вид витрины не изменился.

          ВТОРОЙ ЗАХОД (ТЗ user, тот же день): переключатели показа встают в ТОТ ЖЕ аккордеон
          секцией «Показ», а начальное состояние называется на самой секции. Отсюда две правки.

          Первая: у секции появилось поле `open` — «раскрыта изначально». Корневой `defaultValue`
          при этом остался и сильнее флага: он говорит про набор целиком, а флаг — про одну
          секцию, и молча складывать их было бы не видно с места вызова.

          Вторая: `widgets/feed` отдаёт СПИСОК секций (`feedSections()`), а не готовую панель —
          иначе показ в тот же аккордеон не встал бы, и в рейле стояли бы два корня подряд,
          притворяющиеся одним списком. Один аккордеон на все четыре секции собирает страница
          (`pages/showcase`) — она и есть место сборки виджетов. Открытым по умолчанию оставлен
          только «Ручной ввод» (решение user), флагом на самой секции.

          Проверено живьём после правки (dev-сервер 5175, chrome-devtools, `/showcase/button`):
          при заходе раскрыт ровно «Ручной ввод», «Показ»/«Пресет»/«Ручка API» свёрнуты; клик по
          «Показ» раскрыл переключатели показа, «Ручной ввод» остался открыт рядом.

          ТРЕТИЙ ЗАХОД (ТЗ user, тот же день): плоскость под содержимым и отступ держит сам
          виджет. Содержимое секции ложится в `Surface` с отступом в шаг рейла
          (`spaceVar("space-1")`, тот же, что у `ui/panel.tsx`), а секция, которой отступ мешает,
          говорит `padded: false` — по словам user, таких примерно одна из десяти, поэтому
          умолчание положительное, а флаг снимающий. `widgets/feed` свой ручной `Surface` отдал
          виджету: обёртка стала свойством секции рейла, а не заботой каждого поставщика.

          Отступ ставится инлайном, а не оставляется наряду: скин одевает `Surface` фоном и
          рамкой, но отступа не обещает (у компонента нет значений по умолчанию вовсе), и флагу
          нужно детерминированно перебивать то, что есть.

          Проверено живьём (те же сервер и страница): у всех четырёх секций `padding` 8px
          (`var(--space-1)`), вид панели прежний; временно выставленный `padded: false` на секции
          «Показ» дал на ней `0px` при 8px у соседей — правка откачена сразу после замера.

          ЗАТЫК ПО ХОДУ, НЕ МОЯ ЗОНА (назван user'у): витрина минут десять не монтировалась вовсе
          — `interfaces/feeder`'s `entities/openapi/models/index.ts` реэкспортировал `NO_GROUP`,
          которого в `models/group.ts` не было (там `UNKNOWN_GROUP`). Зона в этот момент правилась
          снаружи, шов сошёлся сам; не чинил и не трогал.

          Проверено: `test/rail-sections.test.tsx` (3 теста) — секция на каждый пункт списка со
          своим заголовком и содержимым, названная `defaultValue` секция раскрыта и соседняя
          закрыта, раскрытие управляется снаружи через `value`. Клик в прогоне НЕ проверяется:
          машина Zag в jsdom на `click()`/`MouseEvent`/`Enter` не переключается вовсе (проверено
          дампом DOM — `data-state` остаётся `closed`), тот же обход у тестов самого кита — они
          проверяют отправленное событие, не раскрытие. Раскрытие кликом проверено живьём
          (dev-сервер 5175, chrome-devtools, `/showcase/button`): «Ручка API» раскрылась, «Пресет»
          остался открыт рядом, вид панели прежний.

      - id: dead-tests-removed
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мёртвые тесты снесены — проверка зоны снова зелёная"
        description: |
          Означает: пять тестов держали typecheck и прогон красными, охраняя код, которого в дереве
          нет. Красный гейт обесценивал каденс «проверка перед коммитом»: он падал всегда и потому
          не ловил ничего.

          `openapi-skeleton` охранял `skeletonOf` из `entities/schema` — по всему репозиторию он
          существовал только внутри самого теста. `openapi-endpoints` и `openapi-import-swagger2`
          били в `entities/openapi`, уехавшую в `interfaces/feeder`, где у неё свой тест.
          `input-to-preview` и `select-in-slot-repro` били в `Slot`/`componentDataAtom`/
          `widgets/component/input`. Свойство, которое ловил последний, осталось под
          `select-incremental-growth` (голый движок), а сам дефект починен в `web-core/assembly`.

          После правки: `tsc` 0, `eslint` 0, 13 файлов и 65 тестов зелёные.


  - category: Кормление из ручки API
    items:
      - id: feed-openapi-provider
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "features/feed/openapi — поставщик еды из живой ручки"
        description: |
          План (обсуждение user 2026-09-20). Третий поставщик рядом с `preset` и `manual`, по тому
          же контракту: человек ткнул — корм сменился, метка на доске `openapi`. Автовызова нет и
          не планируется: витрину открывают часто, а дёргать чужой API на каждый клик по дереву
          нельзя (решение user).

          Своего состояния почти не держит: что показывать и что вызывать, решает каталог со
          стороны `@web-core/feeder`, студия кладёт полученное на доску через `feed.serve`.
          Данные приходят УЖЕ собранными по форме компонента — разворачивать записи и угадывать,
          где у компонента список, студия не должна (решение user: структура живёт в адаптере).

          Зависит от заявки на сторону feeder (позиции 2–5 — поиск связанных ручек, каталог в
          режиме вызова, сборка результата в готовый объект, отдача готовых данных).

          СДЕЛАНО (2026-09-20, заявка закрыта владельцем feeder): `features/feed/openapi` —
          `ApiProbe` с названным потребителем, готовая еда из `serving.data` ложится на доску
          меткой `openapi`. Секция «Ручка API» в `FeedPanel`; ни доска, ни показ, ни соседние
          панели не тронуты — ровно то, ради чего еда уезжала из стора показа.

          Сборка, сказавшая об ошибке, едой НЕ считается, хотя объект при этом приезжает:
          промахнувшийся по корню адаптер отдаёт пустую форму (`{items: []}`), и подать её —
          значит молча стереть то, чем компонент уже накормлен. Поймано живым прогоном: до этой
          проверки вызов с непроставленным корнем гасил показ вместо того, чтобы оставить
          прежнюю еду.

      - id: lab-adapter-mastering-screen
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "/lab — экран сведения полей: компонент слева, ручка справа"
        description: |
          План (2026-09-20). В главной области лаборатории — `AdapterMastering` из
          `@web-core/feeder`: пара «выбранный компонент + выбранная ручка», создание и правка
          адаптера этой пары. Адаптер ищет и заводит сам мастеринг (`adapterFor` внутри него) —
          студия парой не управляет, только называет её.

          В райтбаре — `ExternalSchemaLoader` (загрузка документа схемы) и `ApiCatalog` (каталог
          ручек с настройкой в диалоге), оба уже стоят в `features/lab-manager`, но сегодня
          каталог никуда не отдаёт результат.

          Левая колонка мастеринга (`output`) — поля компонента, `describeSchema` по io-схеме из
          `useComponent().io()`. Правая (`input`) — поля ответа ручки, и вот здесь ограничение:
          схемы ОТВЕТА нет ни в `EndpointDescriptor`, ни в `OpenapiEndpoint` (там схема запроса,
          её использует `Config`), и `parseSchema` её не сохраняет. Значит правая колонка
          строится из ЖИВОГО ответа (`describeSample(result.body)`) — мастеринг пуст, пока ручку
          не дёрнули хотя бы раз. Принято осознанно (тот же приём у мастеров импорта CSV: сперва
          образец, потом сведение); альтернатива — feeder научится сохранять схему ответа при
          разборе документа, это позиция 6 заявки.

          СДЕЛАНО (2026-09-20): экран стоит, пути участников строятся построителями
          (`COMPONENT_USER` в `entities/component`, `API_USER` из feeder) — литералы убраны.
          Канал «каталог в рейле → экран в главной области» — сущность `entities/endpoint`:
          она хранит пробу (какую ручку дёрнули и чем та ответила), каталог кладёт, экран читает.
          Тот же приём, что у доски кормления: две фичи в разных ветках дерева встречаются на
          сущности, а не видят друг друга.

          Лаборатория обёрнута в `ComponentProvider` — раньше его там не было вовсе, и
          `useComponent` на этой странице не работал.


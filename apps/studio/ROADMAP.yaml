  - category: Модули
    items:
      - id: module-templates-in-repo
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Модули лежат файлами в зоне, витрина их собирает и показывает"
        description: |
          ТЗ user (2026-09-24): до редактора — пара готовых модулей-дашбордов файлами в репозитории,
          пара наборов данных на всех, каталог «Модули» из них, и посмотреть, как это выглядит.

          Сделано. `entities/module/model/templates` — спеки `composeTree` документами JSON
          (`sales-dashboard`, `traffic-dashboard`, прежний `test-module`) плюс реестр, который
          называет ярлык и приводит загруженное к `CompositionElement`. Рядом
          `entities/module/model/presets` — два набора данных (`first-half`, `second-half`),
          одинаковых по составу секций, поэтому подходят любому модулю. Дерево каталога строится
          из реестра, а не из мока.

          Граница «шаблон против данных» проведена по `io` компонента, а не по удобству: колонки
          таблицы и серии диаграммы — вход компонента и едут в наборе данных вместе с записями,
          в шаблоне остаётся форма (`shape`) и адрес секции. Замечание user по ходу: первая версия
          держала колонки в шаблоне — так второй набор данных пришлось бы подгонять под заголовки
          первого. Разбор — FAQ.md.

          Маршруты витрины разведены по каталогам (ТЗ user): `/showcase/component/{-$component}`
          и `/showcase/module/{-$module}` вместо прежнего `/showcase/{-$component}`. Вкладка
          каталога идёт за адресом и переживает ветку без выбранного пункта; правый рейл с
          панелями компонента на ветке модуля не рисуется — своего у модуля пока нет.

          Проверено прогоном (`test/module-templates.test.ts`, 10 проверок): каждый шаблон
          собирается НАСТОЯЩИМ реестром кита без единого отказа вложенности, и каждый байндинг
          каждого шаблона находит значение в каждом наборе данных. Живьём (dev-сервер 5175,
          chrome-devtools, наряд `omnifield`): «Дашборд продаж» — столбцы, кольцо и таблица с
          данными набора; «Дашборд трафика» — линия план/факт, заливка, лежачие столбцы и таблица;
          переключение модулей в дереве меняет адрес и показ.

          Видно глазом и НЕ чинено (находки, не дефекты этой работы): ячейки сетки встают в одну
          строку по умолчанию наряда, поэтому дашборд занимает только верх области; легенды у
          диаграммы нет вовсе — в анатомии нет такой части; столбцы двух серий рисуются друг
          поверх друга (`DiagramBar` не разносит серии по полосе), поэтому «план и факт» показан
          линией, а столбцы взяты одной серией.

          Не сделано намеренно: переключателя наборов данных нет — показывается первый, второй
          ждёт решения user (редактора по ТЗ пока не делаем).

      - id: module-groups-by-level
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Модули аналитики разложены по левелам — левел это папка и группа каталога"
        description: |
          ТЗ user (2026-09-24): в `entities/module/model/templates/analytics` каждый левел — своя
          папка со своим барелем и своя группа каталога, дерево читается как
          «Аналитика → Левел 1 → модуль».

          Сделано. `analytics/level1` — новый модуль `errors-report` («Ошибки по службам»:
          заголовок и одна лежачая диаграмма на записи `diagram-errors-by-service`);
          `analytics/level2` — прежние `sales-dashboard` и `traffic-dashboard`, они многоячеечные.
          `analytics/index.ts` отдаёт левелы группами, а не плоский список шаблонов.

          Группа стала рекурсивной: держит либо модули, либо вложенные группы, и `modulesTree`
          обходит её рекурсивно. Адресация модуля осталась по имени — `moduleTemplateOf` ищет в
          плоском `MODULE_TEMPLATES`, место в дереве на адрес не влияет. Разбор — FAQ.md.

          Проверено прогоном (`test/module-templates.test.ts`): дерево каталога сверяется с
          составом групп вместе с вложенными, каждый шаблон собирается настоящим реестром кита,
          каждый байндинг находит секцию склада. Зона зелёная: 18 файлов / 94 теста.

      - id: level1-table-module
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Левел 1 — модуль-таблица с заголовком"
        description: |
          ТЗ user (2026-09-24): в `analytics/level1` нужен модуль «таблица с заголовком».

          Сделано. `stock-report` («Остатки на складе») — одна ячейка сетки: `typography`
          заголовком и `table` под ним. Колонки приходят входом таблицы, а не пишутся в шаблон —
          иначе второй набор данных пришлось бы подгонять под заголовки первого.

          Тем же днём модуль переписан под `module-input-contract` (узлы `title` и `main-table`,
          байндинг адресует свой узел), а левел остался единственным: `level2` и модуль-диаграмму
          user снёс, склад мок-данных тоже — показ кормится пустым набором, пока не заведено
          наполнение.

          Проверено прогоном (`test/module-templates.test.ts` обходит все шаблоны разом): шаблон
          собирается настоящим реестром кита без отказов вложенности. Зона: 18 файлов / 94 теста.

          Живьём в браузере НЕ смотрели — показ модуля остаётся за живым прогоном.

      - id: catalog-tabs-hook-in-widget
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Вкладки каталогов — один хук виджета; модель каталога больше не знает страницу"
        description: |
          ТЗ user (2026-09-24): в странице витрины должен остаться один хук, а каталог не имеет
          права хардкодить адрес страницы; хук — обязанность виджета каталогов, фича даёт только
          модель.

          Было: `uiCatalog()` нёс полный маршрут витрины (`/showcase/component/{-$component}`),
          поэтому песочница с тем же списком молча уводила в витрину, а склейка с адресом жила в
          страницах тремя кусками — сигнал вкладки, эффект синхронизации с маршрутом, переход в
          ветку без пункта, — и в трёх страницах по-разному.

          Стало: `features/catalogs` — только модель (`UI_CATALOGS`: имя, ярлык, дерево из
          сущности, имя параметра), ни одного адреса. `widgets/catalogs`'s
          `useRouterCatalogTabs(catalogs, routes)` принимает эту структуру плюс таблицу «каталог →
          маршрут» от страницы и отдаёт активную вкладку, её переключение и готовые группы дерева.
          Каталог без названного маршрута не показывается — этим лаборатория показывает одни
          компоненты, не заводя своего списка.

          Слой соблюдён в ту сторону, в какую положено: хук лежит в `widgets`, потому что
          `features` ниже и виджет импортировать не вправе, а результат склейки нужен именно
          `CatalogTrees`. Первая версия этой правки была сделана наоборот (фича звала виджет) и
          снята. Разбор — FAQ.md.

          Страницы: `pages/showcase` и `pages/playground` — один вызов хука вместо обвязки,
          `pages/lab` — тот же хук с единственным названным маршрутом лаборатории (свой импорт
          `componentsTree` ушёл). Снят `useRouterCatalogSelection` — его знание целиком вошло в
          новый хук.

          Проверено прогоном: 18 файлов / 94 теста зелёные, `eslint` по тронутым путям чист.
          Живьём в браузере НЕ проверено — переключение вкладок и переход в ветку остаются за
          живым прогоном.

      - id: module-input-contract
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Вход модуля виден снаружи — подписанный узел и его io, без выдуманных имён секций"
        description: |
          ТЗ user (2026-09-24). Сегодня модуль снаружи — чёрный ящик: чем его кормить, видно
          только если открыть JSON и глазами собрать все `bind`. Для мок-данных этого мало
          (непонятно, какой узел чем наполнять), для разработки тоже (непонятно, требует модуль
          таблицу или диаграмму, пока не вскроешь).

          Принцип, на котором стоит вся работа (решение user): КОМПОНЕНТ ВСЕГДА ПРИНИМАЕТ ТОЛЬКО
          СВОЮ ФОРМУ — хоть сам по себе, хоть внутри модуля. Хотят кормить другой структурой —
          ставят адаптер, а сборка чужих форм не изобретает.

          Сегодняшние шаблоны этот принцип нарушают, и это дефект, а не дизайн: `stock-report`
          несёт `"data": "/inventory/data"`, где `inventory` — имя папки в общем мок-складе
          (`MODULE_DATA`), придуманное автором шаблона. Ни таблица, ни кит про такое имя не знают
          вовсе; шаблон через него знает, как устроен склад моков. Левый сегмент пути должен быть
          именем СВОЕГО узла, правый — именем пропа из `io` его компонента, и больше в пути ничего.

          `id` у узла композиции трогать не нужно — он УЖЕ есть (`CompositionElement.id`,
          `web-core/assembly/src/engine/compose.ts:21`), и `composeTree` его уважает
          (`child.id ?? nextId(...)`). Подпись остаётся НЕОБЯЗАТЕЛЬНОЙ: подписан узел — он
          адресуется снаружи и кормится по своей `io`; не подписан — статический, рисуется как
          написан, и данных ему никто не даёт. Автопростановки имён не делаем (движок и так даёт
          узлу производный id по месту в дереве, а стабильное имя нужно ровно тем узлам, которые
          собираются кормить).

          Объём первого захода:

          1. Правило адресации в шаблонах: левый сегмент `bind`-пути — `id` узла, которому этот
             `bind` принадлежит. Четыре существующих шаблона (`stock-report`, `errors-report`,
             `sales-dashboard`, `traffic-dashboard`) переписать по нему, склад данных
             (`model/presets`) переложить под новые имена.
          2. `moduleIoOf(template)` в `entities/module` — вход модуля списком: подписанный узел →
             `io` его компонента (`ioOf` из `@web-core/ui`, синхронно, без сети). Ничего сверх
             этого не выдумывать: форма полей уже написана в ките, второй её копии быть не должно.
          3. Что нельзя вывести — ярлык узла («Заказы», «Выручка по кварталам») — объявляется в
             самом шаблоне рядом с подписью. Только ярлык; типы полей туда не пишутся никогда.
          4. Тест-гейт (`test/module-templates.test.ts`, рядом с уже живущими проверками): имена
             узлов уникальны в пределах модуля; у каждого подписанного узла его компонент
             действительно объявил `io` (адрес есть, а класть по нему нечего — ошибка шаблона);
             левый сегмент каждого `bind` совпадает с `id` своего узла; каждый набор данных
             закрывает все подписанные узлы модуля.

          НЕ входит: редактор и форма наполнения мок-данными по этому контракту — следующий заход,
          когда контракт будет стоять. Движок `@web-core/assembly` не трогаем вовсе.

          СДЕЛАНО ЧАСТЬЮ (2026-09-24), остаток назван ниже.

          Правило адресации стоит: у `stock-report` подписаны два узла — `title` (`typography`) и
          `main-table` (`table`), — и каждый байндинг адресует СВОЙ узел (`/main-table/data`,
          `/main-table/columns`, `/main-table/defaultSorting`). Имени мок-склада в пути больше
          нет ни одного. Ярлык узла объявлен в самой спеке рядом с подписью (`label`), потому что
          из кита он не выводится; типов полей там нет.

          `moduleIoOf(template)` (`entities/module/model/io.ts`) отдаёт вход модуля списком:
          подписанный узел → его ярлык, компонент и `io` этого компонента из кита (`ioOf`,
          `@web-core/ui/io`, синхронно). Своей копии формы полей витрина не держит. Пока панели
          под это нет, список печатается в консоль из `pages/showcase` по выбранному модулю —
          временно и по просьбе user.

          Тест-гейт закрыт тремя проверками из четырёх: имена узлов уникальны в пределах модуля;
          у каждого подписанного узла компонент действительно объявил форму; левый сегмент
          каждого байндинга совпадает с `id` своего узла. Прежняя проверка «путь находит секцию
          склада» снята — она и адресовала склад, то есть ровно тот дефект, который чинится.

          ОСТАЛОСЬ: четвёртая проверка («каждый набор данных закрывает все подписанные узлы
          модуля») не написана — писать её сегодня не на чем. Склад мок-данных
          (`model/presets`, 23 снимка записей службы) user снёс по ходу захода, и страница модуля
          кормит показ пустым набором: модуль рисуется без данных. Набор данных под контракт —
          следующий заход, вместе с наполнением.

          По ходу найдено и НЕ сделано (чужая зона, `web-core/assembly`): подписать `typography`
          мало, чтобы её накормить. Текст приходит не пропом, а content-узлом, и в спеке
          композиции его значение объявлено строкой (`CompositionContent.value: string`,
          `NewContent.value: string`), тогда как рендер умеет резолвить и привязку
          (`valueOf` разбирает `{path}`, `render/content-value.ts`). Сборки самого кита такую
          привязку пишут (`typography`'s `basic` — `{genus:"text", value:{path:"/text"}}`), но их
          тип другой (`PassportAssembly`). Значит узел `title` подписан и виден во входе, а
          кормится по-прежнему литералом. Заявку владельцу `web-core/assembly` не подавал —
          решать architect'у.

          Открытый хвост, решать ПОСЛЕ первого захода и не в этой зоне: если левый сегмент `bind`
          всегда равен `id` узла, а правый — имени пропа, то `bind` в шаблоне становится выводимым
          целиком и писать его руками незачем — данные раздавались бы по имени узла. Это механика
          раздачи внутри движка (`resolveDataBinding`), то есть заявка владельцу
          `web-core/assembly`, а не правка здесь. Заводить её до того, как правило обкатано на
          четырёх шаблонах, рано.

  - category: Сущности — раскладка и адресация
    items:
      - id: component-cell-family-with-active
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Компонент — семья ячеек с активной; контекст уходит"
        description: |
          Сделано и лежит в дереве (2026-09-22): `entities/component/model/store.ts` — семья
          ячеек, ячейка рождается из своего же ключа и держит синхронный срез кита (паспорт, срез
          редактора, io-схема). Маршрут показа (`pages/showcase/component/route.tsx`) на
          `onEnter`/`onStay` рождает ячейку и делает её активной; читатели зовут
          `componentStoreOf.active()` и имени не знают — подписка переезжает сама. Переключение
          проверено на `features/preview/ui/cards/passport.tsx`.

          Правило, ради которого так: асинхронное в стор не заходит вовсе. Стор синхронный и
          держит ячейки по имени, сеть ведёт `defineQuery` (`entities/component/api`) своим кэшем
          по ключу запроса — два разных механизма с разной природой не смешиваются.

          Открыто: `ComponentProvider`/`useComponent` ещё жив, на нём десять читателей. Семеро
          берут только синхронное (`entities/settings`, `entities/feed`, `feed/manual`,
          `feed/openapi`, `preview/views/form`, `cell-wrapper`, `matrix`, `lab/kitchen`) — они
          переводятся на активную ячейку и ничего не ждут. Трое берут асинхронное: варианты
          (`features/preview/model/preview.ts`), статус ожидания и отказа (`distributor.tsx`),
          список записей данных (`features/feed/preset/ui.tsx`) — им нужен сегмент `use`.
          Контекст снимается последним, когда читателей не останется.

          Закрывает развилку `component-facts-without-provider`: выбор «контекст или стор» решён
          в пользу семьи с активной ячейкой.

      - id: entity-use-segment
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "use — сегмент сущности: использование, а не папка хуков"
        description: |
          Решение user (2026-09-23). У сущности появляется каталог `use` рядом с `model`/`api`/
          `lib` и будущим `database`. Раскладка по природе источника: `model` — синхронное, схемы
          и стор; `api` — запросы на бэк; `database` — запросы в индексную базу; `lib` — утилиты,
          чаще непубличные. `use` — использование сущности: то, что СВЯЗЫВАЕТ несколько её
          каталогов, например «взять имя из стора и сходить с ним в api».

          Критерий отбора: едет только склейка двух и более каталогов. Чтение одного стора —
          селектор, ему место в `model`. Цепочки нет — потребитель идёт в `api`/`model` напрямую,
          остальное из публичного доступа не убирается.

          Границы: `use` видит `model`/`api`/`lib`, они его не видят никогда; соседнюю сущность
          `use` не видит тоже — межсущностная склейка живёт в `features`. Это «фича на уровне
          сущности», а не второй слой фич. Житель не обязан быть хуком: к реактивности сегмент
          отношения не имеет, обычная асинхронная функция-сценарий — такой же законный житель.
          Держится пока на словах, без линт-правила по путям.

          Сверка с каноном FSD (2026-09-23, feature-sliced.design, «Slices and segments»):
          стандартных сегментов пять (`ui`/`api`/`model`/`lib`/`config`), свои разрешены прямым
          текстом, но имя обязано называть НАЗНАЧЕНИЕ, а не природу кода — `hooks`/`components`/
          `types` названы там плохими именами. `use` взято именно как назначение («использовать
          сущность»), и ровно поэтому назначение записано словами здесь и в FAQ: имя совпадает с
          префиксом хуков, и без записанного критерия его прочтут как «папку хуков», а сегмент
          станет свалкой.

          Первые жители — под трёх асинхронных читателей контекста: варианты активного компонента
          вместе со статусом ожидания и отказа; список записей данных активного компонента. Тело
          выбранной записи — третьим, но не раньше правок в клиенте пресетов
          (`presets-client-list-and-detail`): сегодня тело приезжает вместе со списком, разводить
          пока нечего.

      - id: boards-address-target-not-component
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Доски адресуют таргет, а не компонент: ключ вида «component:button»"
        description: |
          Решение user (2026-09-23). `entities/feed` и `entities/settings` сегодня спрашивают
          `useComponent()` — сущность берёт соседа по слою. Это нарушение раскладки, но важнее
          другое: оно неверно по сути. Скоро появятся модули — сборки из компонентов, — и кормить
          и настраивать нужно будет их тем же способом. Доска не должна знать, кого обслуживает.

          Становится так: ключ семьи — ТАРГЕТ, строка вида `component:button` /
          `module:login-form`. Префикс вида обязателен: имена компонента и модуля могут совпасть, и
          без него две разные доски схлопнулись бы в одну. Сущность про природу ключа не знает.
          `useFeed()`/`useSettings()` теряют аргумент и читают активную ячейку своей семьи; кто
          сейчас таргет — решает фича, не маршрут и не сама доска.

          Настройки при этом перестают ходить за паспортом: сущность держит выбор человека и
          чистые функции сведения (`lib`), а объявленный список настроек приходит ВХОДОМ от фичи.
          У компонента он из паспорта, у модуля будет свой источник — сущность от этого не
          меняется.

          Чинятся два файла: `entities/feed/model/feed.ts` и `entities/settings/model/settings.ts`.
          `previewStoreOf`/`presetPickStoreOf` не трогаются — они живут в `features/`, а фиче
          брать сущность законно.

          Сверка с каноном FSD (2026-09-23, «Cross-import», «Public API»): для неустранимых
          ссылок между сущностями есть `@x`-нотация, но канон называет её последним средством и
          рекомендует композицию сверху — связь собирает вышележащий слой. Взята композиция;
          `@x` не заводим, потому что он связь легализует, а не убирает.

          Риск принят осознанно: активаций становится несколько (компонент, еда, настройки), и
          забытая активация означает доску, молча показывающую чужой таргет. Пока вызыватель один,
          список активаций держится в одном месте; появится второй — уезжает в фичу одной
          функцией выбора.

          Рядом меняется навигация (решение user, объём не раскрывается заранее): в сайдбаре
          вкладки с двумя деревьями — компоненты и модули. Адресация частей модуля по отдельности
          (кормим модуль целиком или его места) — обсуждается ближе к делу, здесь не решено.

      - id: outfit-own-entity
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Наряд — своя сущность, а не поле в сторе компонента"
        description: |
          Означает (2026-09-22, в дереве): `entities/outfit` — свой одиночный стор
          (`outfitStore`) плюс переехавший туда переключатель темы из `shared/ui/theme-switch`.
          Наряд один на приложение и свойством компонента не является, поэтому и в его сторе ему
          места нет.

          Хвост, НЕ закрыт: кэш вариантов ключуется только компонентом (`["variants", component]`),
          хотя `variantsOf` из `@web-core/skin/presets` читает внутри и наряд — смена наряда этот
          кэш не протухает, а каждый новый компонент заново тянет наряд. Лечится у себя, но
          после правок в клиенте пресетов (`presets-client-list-and-detail`): сегодня чтение
          наряда по имени стоит полного списка нарядов со всеми телами.

      - id: presets-client-list-and-detail
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "БЛОКЕР (чужие зоны): список пресетов не взять без тел, запись по имени — без полного списка"
        description: |
          Найдено чтением кода (2026-09-23) при разборе, как развести «список записей» и «тело
          выбранной». У себя не лечится и костылём не обходится — заявка ушла architect'у.

          `web-core/skin`, `src/presets/client/index.ts`: `get(kind, name)` — это `wireList(kind)`
          (весь список вида, без фильтра по компоненту, со всеми телами) плюс `.find` на клиенте,
          то есть «дай одну запись» стоит дороже, чем «дай все записи компонента». Тем же болеют
          `replace` и `remove` — оба тянут полный список ради поиска `id` по имени. `queries.ts`:
          `LIST_QUERY` всегда просит полный фрагмент каждого вида — у `Content` это `data`, у
          `Form` — `recipe`/`keyframes`/`variantTags`, у `Palette` — `light`/`dark`/`scales`.
          Значит сто записей данных приезжают с телами, хотя выпадашке нужны `name`/`label`, а
          человек может не выбрать ни одной.

          Требования заявки: взятие записи по имени — запросом за одной записью; список — без
          состояния; список и тело — два обращения с разными ключами кэша. Серверная сторона
          готова и правок не требует: `presets(kind, component, name)` и `preset(id)` в схеме
          `backend/presets` уже есть, выборка полей у GraphQL и так на стороне запроса.

          Туда же требование к `web-core/query` (`src/engine/define.ts`): `defineQuery` принимает
          только `staleTime`, опции TanStack наружу не пробрасываются и на месте вызова
          (`query.use`) не называются. Нужны `enabled` — не ходить в сеть, пока таргета нет,
          иначе полетит запрос с пустым именем, — и `placeholderData`, которым закрывается
          мигание показа на смене компонента.

          Проверка, когда приедет: заход на невиданный компонент даёт список без тел; выбор записи
          — ровно один запрос за её телом; возврат на виденный компонент — ноль запросов; переход
          между компонентами не тянет список нарядов заново.


log:
  - id: entities-target-and-use-segment
    type: plan
    date: 2026-09-23
    summary: >
      Разговор про раскладку сущностей, из которого вышли три решения и одна заявка наружу. Код
      этим заходом не писался — записана картина, дальше идём мелкими шагами, обсуждая каждый на
      месте.

      Первое: у сущности появляется сегмент `use` — использование. Раскладка внутри сущности идёт
      по природе источника (`model` — синхронное, `api` — сеть, `database` — индексная база,
      `lib` — утилиты), и склейке этих каталогов до сих пор не было места: она расползалась по
      потребителям копипастом. `use` берёт только склейку, соседей по слою не видит и сам никому
      не виден. Канон FSD (сверено 2026-09-23) свои сегменты разрешает, но требует имени по
      назначению и прямо называет `hooks` плохим именем; `use` прошло именно как назначение
      («использовать сущность»), и поэтому критерий отбора записан словами — иначе имя прочтут
      как папку хуков.

      Второе: доски кормления и настроек перестают быть про компонент. Скоро модули — сборки из
      компонентов, — и кормить с настраивать нужно и их; значит ключ доски это ТАРГЕТ
      (`component:button` / `module:login-form`, префикс вида обязателен), а про компонент узнаёт
      фича, не сущность. Попутно уходит и нарушение слоя: `entities/feed` и `entities/settings`
      сегодня спрашивают `useComponent()` у соседа. Канон предлагает для таких ссылок `@x`, но
      называет её последним средством и советует композицию сверху — взяли композицию.

      Третье: развилка «контекст или стор» из `component-facts-without-provider` закрыта в пользу
      семьи с активной ячейкой, которая уже лежит в дереве. Асинхронное в стор не заходит: он
      синхронный, сеть ведёт кэш запросов.

      Наружу ушла заявка по двум чужим зонам (`presets-client-list-and-detail`): в клиенте
      пресетов «дай одну запись» стоит полного списка со всеми телами, а список нельзя попросить
      без тел вовсе — значит развести «список» и «тело выбранной записи» сегодня физически
      невозможно; и `defineQuery` не пробрасывает опции, без которых хук не умеет ни промолчать
      без таргета, ни удержать прежние данные на смене ключа. Бэк при этом готов — фильтр по
      имени в схеме есть.

  - id: switch-cost-root-was-in-skin
    type: plan
    date: 2026-09-21
    summary: >
      Разбор жалобы «аккордеоны рейла сбрасываются, а переход по компонентам мигает и тормозит».
      Заход интересен тем, что ни одна из трёх первых версий диагноза не подтвердилась, а корень
      оказался вообще не в этой зоне — и нашёлся только замером, а не чтением кода.

      Сброс рейла объяснился сразу: `ComponentProvider` держит `<Show keyed>`, и смена имени
      сносит поддерево вместе с состоянием аккордеона. Но это оказался рецепт `web-core/store`
      (`EXAMPLES.md` §6 предписывал ремаунт на реактивный ключ семьи), поэтому чинить у себя
      значило нарушать чужой канон — ушла заявка, владелец добавил вызов семьи аксессором ключа и
      переписал §6. Заведён `component-provider-keyed-drops-rail-state`.

      Мигание оказалось не пересозданием, а `<Suspense>`: пометили DOM-узел маркером и увидели,
      что из главной области уезжает и возвращается ТОТ ЖЕ узел. Ожидание всплывало из рейла —
      его панели читают данные компонента, — до `Suspense` роутера, который уносит страницу
      целиком. Отсюда и «мигает всё, кроме хедера».

      Торможение мерили профилем, и здесь вылез настоящий корень: 917 мс из 1452 мс активной
      работы на клик — цветовая математика (`oklchToLinear`, `tryParseColor`, `contrastRatio`).
      Штатные трассы скина показали 335 вызовов `generateComponentSkinCss` и 670 `skinValues` на
      ОДИН клик: каждое одевание инстанса кита заново решало всю палитру, причём `valueNames`
      брала у результата только ключи. Заявка ушла владельцу `web-core/skin`; после правки — 3
      вызова, цветовых функций в профиле нет вовсе, активная работа 492 мс.

      Что осталось нам: 492 мс, из них GC 106 мс и планировщик Solid около 90 мс
      (`preview-switch-cost-measured`), плюс ячейки, которые `<For>` сверяет по ссылке
      (`preview-cells-keyed-by-value`). Проба «факты без провайдера, стор вместо контекста»
      прогонялась и откачена — её находки записаны отдельно
      (`component-facts-without-provider`), чтобы следующий заход не наступил на те же грабли:
      preload-загрузчик маршрута, наблюдатель запроса на каждого читателя, `queryFn`, зовущий сам
      себя.

      Ни одна правка этой зоны в дерево не заехала: всё, что записано выше, — измеренные факты и
      согласованный объём, код пишется отдельным заходом.

  - id: component-settings-second-board
    type: plan
    date: 2026-09-21
    summary: >
      Настройки компонента получили интерфейс, и заход интересен не панелью, а тем, что она
      почти целиком собралась из уже готового. Паспорт кита давно несёт обе половины настройки —
      машинную (`values.kind`, `byDefault`, `dependsOn`) и человеческую (`means` настройки и
      каждого варианта, `playground/settings.ts`), движок скина давно отвечает на зависимость
      функцией `settingApplies`, а канал в показ уже проложен `rootProps` рендерера. Витрине
      осталось не описывать настройки, а показать объявленное: список строится обходом паспорта,
      контрол выбирается по виду значений, проза становится подписью.

      Раскладка — вторая доска рядом с доской кормления, тем же правилом: панель в рейле и показ
      в главной области это две фичи, и встречаться им можно только на сущности
      (`entities/settings`), иначе показ импортировал бы панель. Решения user по объёму: один
      набор на компонент на весь показ, только сессия, витрина а не лаборатория, компонент без
      настроек оставляет секцию пустой.

      Умолчание в состоянии витрины НЕ дублируется — в сторе только тронутое человеком: вторая
      копия умолчания разошлась бы с паспортом молча, и экран показывал бы вчерашнее значение как
      сегодняшнее. `settingApplies` витрина не переписывала, хотя правило простое: у него уже есть
      владелец и место рядом с данными, на которые оно опирается.

      Проверено прогоном (8 тестов на настоящих паспортах `accordion`/`button`) и живьём в
      браузере: `horizontal` развернул все семь ячеек, `multiple` погасил `collapsible` и дал
      держать два раздела открытыми разом. Подробности — `component-settings-panel` выше.

  - id: openapi-feeding-end-to-end
    type: plan
    date: 2026-09-20
    summary: >
      Кормление компонента живой ручкой доведено до конца и проверено сквозным прогоном, не по
      частям. Работа шла параллельно с владельцем `interfaces/feeder`: студия называла, чего ей
      не хватает, он отдавал механику, студия вставала на неё.

      Заявка ушла шестью позициями: закрепить вид участника в контракте и дать построители путей;
      перечисление связанных ручек на стороне feeder; каталог в режиме вызова; сборка результата
      в готовый объект по форме потребителя; отдача готовых данных, а не сырого ответа; схема
      ответа ручки. Все закрыты — появились `defineUserKind`/`API_USER`, `usersOf`/`partnersOf`,
      `ApiProbe`, `feed`, `serve`, `recordsOf`.

      Седьмой находкой стал корень набора записей. Первый сквозной прогон дал `data: {items: []}`
      и `error: «в ответе ожидался массив записей»` — ручка отдавала `{total, data:[…]}`, список
      лежал в `/data`, а `root` адаптера оставался пустым: мастер сведения его не задаёт. Отдельный
      экран выбора корня заводить не стали — человек уже показывает корень мышью, перетаскивая
      `/data/0/login`. Владелец feeder дорезал источник симметрично цели (`splitOf` рядом с
      `listOf`), корень берётся из первой связи, расхождение корней отдаётся отчётом, а не молча.

      Прогон после правки: схема swagger 2.0 на локальную ручку, вызов из лаборатории, обе
      колонки сведения построены (`describeSchema` слева, `describeSample` справа), две связи
      перетаскиванием, переход на витрину, вызов из секции «Ручка API» — все три ячейки показа
      получили `ivanov`/`petrov`/`sidorov`. Путь закрыт целиком.

      Два ограничения записаны как есть, а не обойдены. Склад пресетов у feeder живёт в памяти,
      поэтому лабораторию и витрину нельзя разнести перезагрузкой страницы — сценарий проходит
      только SPA-переходом; хранение на бэке отложено решением user. И `parseSchema` принимает
      только swagger 2.0 — документ OpenAPI 3.0 отвергается.

  - id: feed-as-entity-and-widget-naming
    type: plan
    date: 2026-09-20
    summary: >
      Заход про архитектуру: как вносить обвес, не вплетая его в движок приложения. Разговор начат
      с того, что кормление компонента (пресеты, ручной ввод, завтра ручки API) — фича, а не
      несущая механика, и при нынешней раскладке каждая такая фича вплеталась бы в показ.

      Сверка с рынком (2026-09-20): Storybook — ядро не знает аддонов, аддон вкладывается в
      названные типы точек (PANEL/TAB/TOOL) плюс decorators и parameters; VS Code — та же идея, но
      декларация статическая, манифест читается на старте. Взято: именованные точки и сборка в
      одном месте. Не взято: рантайм-загрузка — одно приложение в монорепо, динамика платится
      типобезопасностью ни за что.

      Первое предложение овнера (реестр источников + провайдер со списком в `app/`) user заменил
      более точной моделью, и она лучше: точка расширения — СУЩНОСТЬ студии, которая держит стор,
      даёт контекст и механику, а фичи в неё пишут и читают. Так снимается «фича импортирует
      фичу» (сущность лежит ниже фич), исчезает реестр как задача (регистрировать некого) и
      появляется правило, по которому лягут будущие тестирование, валидаторы, сборки — каждое
      своей сущностью-доской, а не очередным реестром. У фичи при этом остаётся СВОЙ стор со
      своими рабочими моментами; на доску кладётся только то, что нужно другому участнику.

      Сделано по этому правилу: `entities/feed` (доска), `features/feed/preset` и
      `features/feed/manual` (поставщики), показ перестал хранить еду вовсе. Дальше тем же
      приёмом — поставщик из ручки OpenAPI, для которого место уже готово.

      Попутно закрыт долг по именам: `features/preview` вместо `component-manager` (двумя шагами
      — сперва переименование, потом вынос еды, чтобы ревью их различало), виджеты названы местом
      или темой (`rail`/`preview`/`feed`), `widgets/lab-manager` снят целиком. Снесены пять
      мёртвых тестов, после которых проверка зоны впервые за долгое время зелёная целиком.

      Дока зоны переписана ОТ КОДА, а не правкой старого текста: README врал почти везде (описывал
      снесённый фейк-генератор и маршруты, которых нет), FAQ наполовину состоял из ответов про
      `zocker` и «тестов пока нет». По ходу сверки нашлось, что открытый пункт
      `component-store-loads-without-cache` давно сделан кодом — закрыт его же проверкой, живым
      замером сети; а `catalog-list-remounts-whole-preview-on-switch` описывает уже не
      существующую цепочку и помечен как требующий нового замера, а не починки по старому тексту.

  - id: adapter-independent-entities-decomposition
    type: plan
    date: 2026-09-11
    summary: >
      Разбор ошибки декомпозиции в первой версии кода `entities/adapter` (детально — `DBP.md`,
      завёден по прямому требованию user): компонент настройки ручки (`EndpointForm`) был молча
      перенесён в зону мастеринга без запроса; отдельно — `model/` внутри `entities/adapter` был
      плоской кучей 8 файлов трёх разных доменов (Endpoint/Schema/Adapter) вместо группировки по
      домену. Обе поправлены на месте (форма вернулась в зону ручки под аккордеон, `model/`
      переразложен по поддоменам `adapter/`/`endpoint/`/`schema/`, каждый со своим `index.ts`).

      Дальше user проговорил флоу целиком, вскрылась более глубокая неточность модели — записана
      как исправление в `adapter-child-of-schema` выше. Коротко: Adapter/OpenAPI(ручка+схема)/
      Component — ТРИ независимые сущности, ни одна не ссылается на соседей напрямую. У `Adapter`
      вместо `schemaId`/`component` — необязательные `channels: {in: Ref, out: Ref}[]`
      (`Ref = {type: string, id: string}`) — подтверждённые UX-подсказки "с какими парами я
      работаю", не жёсткая связь: адаптер остаётся универсальным, встаёт в любую подходящую пару.
      `entities/adapter/ui/openapi` (список ручек+форма+сохранение схемы) выносится целиком в
      новую сущность `entities/openapi` — самостоятельный функционал, не только под адаптеры
      (`openapi-entity-extraction`). Связка "выбранный компонент + выбранная ручка → нужный
      адаптер" переезжает в новый слой `features/`, которого в приложении раньше не было
      (`features-layer-component-openapi-join`) — `entities/adapter` только показывает мастеринг
      уже готовой парой, сам ничего не резолвит.

      Договорено идти итерациями — маленькими шагами, обсуждая каждую перед кодом, не забегая
      вперёд и не делая лишнего.

  - id: adapter-lab-flow-and-ui-research
    type: plan
    date: 2026-09-10
    summary: >
      Продолжение `web-core/io/ROADMAP.yaml`'s `adapter-flow-two-way-and-l3` — тот же разговор,
      здесь записана часть про `/lab` и интерфейс. Флоу от user: юзер добавляет на `/lab` ручку
      своего OpenAPI, приложение сохраняет только скелет её ответа (ключи+тип, без значений) —
      схема. Дальше юзер строит адаптер под конкретный компонент кита — связь поле-в-поле в обе
      стороны, руками, каждое направление отдельно (не разворотом одного в другое). Адаптер —
      ресурс СХЕМЫ, не компонента: живёт, пока жива схема, на одну схему — сколько угодно
      адаптеров. Компонент про адаптеры не знает — только свой `entity/io.ts`.

      По запросу user — ресёрч в сети, на что ориентироваться интерфейсом (прошлая попытка,
      конструктор адаптера `products/tables`, была непонятна даже на уровне переименования ключей).
      Нашли два полюса: конструкторы workflow (Zapier/Make — вставка через pill/токен, node-граф)
      рассчитаны на людей с workflow-мышлением; мастера импорта CSV (Flatfile/OneSchema/CSVBox)
      решают БУКВАЛЬНО нашу задачу — чужой источник с неизвестными именами → фиксированная целевая
      схема — и обкатаны именно на нетехническую аудиторию. Решение: ориентир — второй полюс.
      Источники: appmaster.io/blog/csv-import-column-mapping-ui, blog.csvbox.io/inside-csvbox-column-mapping,
      try.oneschema.co/flatfile-vs-oneschema, help.zapier.com (field mapping — для контраста, не
      взяли).

      Записаны пять пунктов категории "Lab — адаптеры" (все Open, работа не начата): схема и
      адаптер как ресурсы с разведённым жизненным циклом, сам мастер сведения полей (две колонки,
      дропдаун, авто-подсказка, живой пример «было → стало» по месту, не после), преобразование
      значения как МЕСТНЫЙ контрол у пары полей (не отдельный конструктор цепочки), выбор набора
      записей (L3) — кликабельные карточки-кандидаты, не путь руками. Хранение схемы/адаптера как
      персистентных ресурсов (CRUD, `backend/presets`) — явно ЗА границей `apps/skin`, отдельный
      трек после того, как движок `web-core/io` и этот UI устаканятся.


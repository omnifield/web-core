  - id: chat-real-session-api
    type: plan
    date: 2026-09-09
    summary: >
      Чат подключён к реальной сессии агента вместо локального мока. Контракт от user: `POST
      /sessions/{id}/messages` (`Authorization: Bearer <общий токен>`, `X-User-Login: <логин>`,
      тело `{text, context: {component, variant, outfit}}`), ответ — один синхронный JSON
      (`event: "run-finished"`, `reply`/`refusal`/`did`), без стрима/поллинга. Уточнено с user перед
      реализацией: session id = имя ТЕКУЩЕГО компонента (агент хранит чат per-session, сессия
      должна быть в рамках компонента); токен — билд-тайм env `VITE_CHAT_TOKEN`, тем же приёмом,
      что `VITE_PRESETS_URL`; `variant`/`outfit` в `context` пока не шлём — их нет ни в роутинге,
      ни в каком-либо сторе фронта; базовый адрес — `VITE_CHAT_URL`, дефолт
      `https://150.251.145.87/api` (назван user, отдельный сервис, не служба пресетов).

      Новый `entities/chat/model/api.ts`'s `sendChatMessage`; `store.ts`'s `sendMessage` стал
      асинхронным (оптимистичная запись сообщения юзера → ожидание → дозапись `reply`/`refusal`
      единым путём → ошибка сети тоже текстом в чат, не проглатывается) и завёл сигнал `pending`,
      которым `ChatControl` дизейблит форму на время запроса. Моковая затравка сообщений
      (`MOCK_MESSAGES`) убрана — история пуста до первой реальной переписки.

      Не сделано осознанно (нет источника/эндпоинта на момент разговора): `variant`/`outfit` в
      context; загрузка истории чата при заходе на компонент (нет GET-эндпоинта); рендер `did`
      (вызовов MCP-тулов из ответа) в UI — виден только `reply`/`refusal`.

  - id: slot-loader-around-renderer
    type: plan
    date: 2026-09-09
    summary: >
      Точечное ТЗ user: "тут .../slot/index.tsx надо сделать лоадер, пока компонент не загрузился.
      лоадер должен быть только для Renderer а не для всего слота". Граница ожидания положена
      ровно вокруг `Renderer` внутри `CarouselItem` (`Show`+`fallback`), всё остальное в слоте
      остаётся на экране. Слот оставлен глупым — признак приходит пропом `loading`, считает его
      вызывающий; в `ComponentHandle` заведён `loading()` (`componentInfoAtom.status === "pending"`),
      потому что `!ready()` тут не работает: ресурс держит последнее известное `info` и в pending,
      значит `ready()` на смене компонента остаётся true при заведомо чужом info.
      Спиннера не рисовали: своей графики у витрины нет по решению user 2026-08-27 (`index.html`),
      а в ките такого компонента нет — ожидание сказано словом через `Typography`.
      По ходу найдено (не чинено, не моё ТЗ): уже запущенный dev-сервер на 5174 отдавал старую
      версию модулей — тот же кэш трансформа, что и в `embed-routes-pathless-layout`; проверка
      велась на своём сервере (5175, `--force`), чужой процесс не трогали.

  - id: chat-session-and-sse
    type: plan
    date: 2026-09-09
    summary: >
      ТЗ бокса от user («как разговаривать с боксом») переписало транспорт чата, а следом сам user
      назвал, где сессии жить: «после логина сразу отлетает запрос и получаем айди сессии, ложим его
      рядом с логином юзера; дальше из любого места юзер может взять свой айди сессии или логин; в
      чате подставляется логин и айди сессии из стора юзера». Сделано так: `login()` заводит сессию
      (`POST /api/sessions`) и кладёт выданный id рядом с логином (`currentSession` + ключ `session`
      в localStorage), `logout()` чистит оба, `renewSession()` заводит заново. Чат сессию не
      заводит и не хранит — только подставляет; на 404 просит стор обновить её и повторяет ход раз.
      Транспорт (адрес, токен, заголовки, `createSession`) вынесен в `shared/api/box`, чтобы
      `entities/user` и `entities/chat` не импортировали друг друга ради него.

      Прошлая механика снята целиком: session id больше не имя компонента и не заводится первым
      сообщением; ответа агента в теле POST нет — приходит квитанция с `run`, а сам ответ читается
      событием `run-finished` из SSE-потока `GET /sessions/{id}/events` (заголовки — значит
      `EventSource` не годится), поток открывается ДО POST. Обрыв потока не теряет прогон:
      дочитывание через `/runs` + `/messages` + `/runs/{run}/steps`.

      Проверено живьём против бокса (2026-09-09, `https://150.251.145.87/api`, токен от user в
      `apps/skin/.env.local`, в гит не едет): вход → 201 и id в сторе; сообщение → 202-квитанция;
      ответ агента приехал `run-finished`'ом из потока и осел в чате. По ходу проверки найдено, что
      дев-сервер не видел правок вовсе — репозиторий подмонтирован с хоста (fstype `9p`), а на нём
      inotify не отдаёт событий; лечится переносом репо в контейнерный том (`Clone Repository in
      Container Volume`, как и написано в `.devcontainer/devcontainer.json`), решение за user.

      Найдено тестом и починено в коде, а не в тесте: логин кириллицей нельзя положить в
      `X-User-Login` — HTTP-заголовок это байты, и `fetch` роняет запрос до сети. Не-ASCII логин
      едет процентно закодированным, латиница как есть.

      Открытым остаётся (решение не наше): бокс увидит закодированный логин как имя личности — нужен
      читаемый, логины надо ограничивать латиницей на форме входа; пароль в `entities/user/ui/auth`
      по-прежнему захардкожен на клиенте и никак не связан с `VITE_CHAT_TOKEN`; сессия теперь одна
      на юзера, а не на компонент — в одной памяти агента идут разговоры про все компоненты
      (компонент едет в `context` каждого сообщения), и с ростом истории каждый ход дорожает.

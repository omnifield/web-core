      - id: no-tests
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Единственный интеграционный тест бил через мёртвый код — почищено"
        description: |
          Было (текст ТЗ устарел ещё до открытия — проверено ДО правок): `test/` не пустая, в ней
          уже пять файлов, четыре проходили. Пятый (`input-to-preview.test.tsx`, «автогенерация на
          смену компонента доезжает до показа текстом») падал: `widgets/component/preview` (его
          единственный потребитель) звал `<Slot slides={[...]}>` — устаревший контракт, `Slot`
          (`entities/showcase/ui/slot`) давно принимает `component`/`tag`/`assemblies`/`variants`/
          `loading` (переехал ещё в `slot-loader-around-renderer`), реальная витрина
          (`pages/showcase`) зовёт именно так. `widgets/component/preview` нигде в коде больше не
          импортировался (только реэкспорт из барреля) — мёртвый код, живший исключительно ради
          этого теста. Название теста прямо называло причину: он проверял фейк-генератор
          (`zocker`), которого больше нет (`zocker-removed`).

          Остальные четыре теста — три узких регрессионных теста ДВИЖКА (`RenderTree`/
          `RenderNode`, `@web-core/assembly`, голым API без виджетов приложения) и один про
          процентное кодирование логина в заголовке чата (`chat-session.test.ts`) — валидны,
          не тронуты. Ни один не проверял РЕАЛЬНЫЙ путь через актуальный `Slot`, который README
          называет "Сборки… проверены только вручную".

          Сделано: `widgets/component/preview` снесён целиком (директория + строка в барреле
          `widgets/component/index.ts`) — согласовано с user до правки. `input-to-preview.test.tsx`
          переписан на актуальный контракт `Slot` (тот же, каким его зовёт `pages/showcase`), два
          случая: (1) сохранённый content-рекорд долетает до видимого текста показа
          (`data.label` → `/label`-биндинг паспорта button) — то, что README называет проверенным
          только руками, теперь проверяется прогоном; (2) пустой список content не роняет показ
          (мок-строка `"-мок-"`, которую `Input` кладёт при пустом списке, НЕ рендерится текстом —
          у button биндинг `/label`-путём, скаляр вместо объекта не находит поле, значит проверять
          "текст не пуст" для этого случая было бы неверно — тест проверяет только "не упало").
          Сеть не трогали: `@web-core/skin/presets`'s `createPresetsClient` замокан целиком
          (`vi.mock` + `vi.hoisted` под мутируемое состояние моков между двумя `it`), настоящие
          `componentInfo`/`Input`/`Slot` — без изменений, граница мока — ровно на сетевом клиенте.
          `queryClient.clear()` в `afterEach` — кэш `content-graphql-migration` иначе пережил бы
          между двумя `it` в одном файле и второй тест видел бы данные первого.

  - category: Дерево компонентов
    items:
      - id: tree-item-value-not-id
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Sidebar-дерево: активный узел не подсвечивался, раскрытие одного узла двигало все разом"
        description: |
          Регресс от миграции ДРУГОЙ зоны (`unified-item-collection-engine`, `packages/ui`,
          2026-09-09) — не моя правка этой сессии, но чинить нужно здесь. `packages/ui/src/shared/
          utils/collection.ts`'s `createItemTreeCollection` строит identity узла zag-коллекции
          строго по `node.value` (`nodeToValue: (node) => node.value`) — так было решено каноном
          `item` (`value`/`label`/`children?`). `entities/component/model/tree.ts`'s `TreeItemData`
          несла только `id` (старый контракт, до канона) — `.value` не было вовсе, значит
          `nodeToValue` возвращал `undefined` ДЛЯ ЛЮБОГО узла: identity всех узлов схлопывалась в
          один и тот же `undefined`, отсюда оба симптома — раскрытие/закрытие ОДНОГО узла двигало
          состояние, разделяемое ВСЕМИ (баг user: "узлы открываются/закрываются все разом"), и
          `activeValue` (тоже сравнение по `value`) не совпадал ни с одним узлом (баг user:
          "активный элемент не выделяется").

          Починено: `TreeItemData.id` → `TreeItemData.value` (`entities/component/model/tree.ts`),
          два места чтения в `widgets/component/tree/index.tsx` (`payload.id`→`payload.value` в
          обработчике клика, `item.id`→`item.value` в `defaultExpandedValue`) — переименование, не
          новое поле: строковое значение (имя группы/имя компонента) то же самое, что раньше несло
          `id`, просто под именем, которое ждёт кит.

          Проверено живьём (MCP-браузер, `/showcase/button` → `/showcase/checkbox`): свернул
          "Actions" кликом — свернулась ТОЛЬКО она, остальные пять групп остались раскрыты; клик по
          листу "checkbox" — навигация прошла, лист подсветился синим, группа "Inputs" сама
          раскрылась, "Actions" осталась свёрнутой. Раньше (по словам user) оба эффекта были
          разбиты — один клик двигал всё дерево разом.

  - category: GraphQL-переезд (третий шаг цепи backend/presets → packages/query → потребители)
    items:
      - id: shared-api-presets-single-endpoint
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "shared/api/presets — один адрес /graphql, не сборка ?kind=/id"
        description: |
          Означает: `resolveUrl()` (`shared/api/presets/index.ts`) дописывала `API_PATH =
          "/api/presets"` и комментарием ссылалась на константу `root` в
          `backend/presets/internal/api/handler.go` — файла уже не было, ссылка была мёртвой.
          Заменено на `GRAPHQL_PATH = "/graphql"` (путь держит бэк константой в
          `mux.Handle("POST /graphql", ...)`, `backend/presets/cmd/presets/main.go`), логика
          суффиксации та же (полный адрес с путём принимается как есть, без пути — дописывается).
          `PRESETS_URL`/`VITE_PRESETS_URL` как переопределение не тронуты — один адрес на всё
          приложение, не три копии; трое потребителей (`entities/component/model/info.ts`,
          `.../content.ts`, `shared/ui/theme-switch`) правки не потребовали — все передают
          `PRESETS_URL` как есть в `createPresetsClient({url})`/`createPresetsSkinSource({url})`.

          По ходу найдено (не в этом ТЗ, не чинено): `apps/skin/.mcp/src/engine/store.ts` — свой,
          отдельный REST-клиент с той же мёртвой ссылкой (`API_PATH = "/api/presets"`), плюс
          `.mcp/README.md` и `.mcp/FAQ.md` документируют старые REST-примеры. `.mcp` — отдельный
          пакет (см. `zocker-removed`), отдельное ТЗ.

      - id: content-graphql-migration
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "entities/component/model/content.ts — кэш на сессию, транспорт уже GraphQL"
        description: |
          ИСПРАВЛЕНО (2026-09-09, найдено овнером ДО написания кода — версия ниже отменяет
          первую): исходный текст этого пункта описывал «REST-клиент → graphqlRequest напрямую»,
          но писался ДО того, как `packages/skin`'s `createPresetsClient` сам переехал на GraphQL
          (`client-graphql-transport`, коммит `4f359e6`) — тот самый клиент, которым этот файл уже
          пользуется. Транспорт здесь уже GraphQL, вопрос был решён в другой зоне, и текст ТЗ этого
          не знал.

          Реальный оставшийся пробел — только кэш на сессию, которого правда не было: каждый заход
          в компонент бил по сети заново (`listContentFor`/`getContentByName` звали
          `presets.list`/`presets.get` без кэша). Решение — НЕ заводить второй, дублирующий
          GraphQL-запрос и свою конверсию ответа (это уже есть и протестировано в
          `client.ts`'s `LIST_QUERY`/`toRecord`), а обернуть существующие вызовы `presets.list`/
          `presets.get` в `queryClient.fetchQuery({..., staleTime: Infinity})` из
          `@web-core/query`. `fetchQuery` — императивный метод клиента, не хук `createQuery`: этот
          файл не Solid-компонент, `createQuery` сюда физически не встал бы.

          `staleTime: Infinity` — намеренно, не заглушка: авто-протухание по времени не нужно,
          если инвалидация явная и событийная (`chat-did-cache-invalidation` — по сигналу из
          `did`, не по таймеру). Два механизма протухания разом (время + событие) были бы лишней
          сложностью без выгоды.

          Сделано: новый `#/shared/api/query-client` (`export const queryClient = new
          QueryClient()`) — общий инстанс СНАРУЖИ `app/index.tsx` (тот его раньше заводил сам и не
          отдавал наружу), нужен и `content.ts`, и будущему `chat-did-cache-invalidation` вне
          Solid-дерева, где `useQueryClient()` не работает. `listContentFor` кэширован ключом
          `["content", "list"]`, `getContentByName` — `["content", "get", name]`, отдельной
          записью, не через список (буквально по тексту ТЗ — обернуть оба вызова, не только
          `list`). Находка по ходу: query-core запрещает `queryFn` возвращать `undefined`
          (означает «данных ещё нет», не «записи нет»), а «имя не найдено» у content — законный
          исход (`/embed/...` без `?content=`) — `getContentByName` кэширует `null` вместо
          `undefined` и разворачивает обратно на выходе.

      - id: chat-did-cache-invalidation
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Ответ агента триггерит перезапрос — chat.did уже приходит, просто не читается"
        description: |
          Заявка user: когда агент через MCP меняет пресет (`save_preset`/`save_content`), витрина
          должна САМА перезапросить задетые данные, не только показать ответ в чате. Расширять MCP
          не нужно — у него нет канала в браузер, канал уже есть: `ChatRunResult.did` (`entities/
          chat/model/api.ts:27`) на каждом `run-finished` несёт `{server, tool, arguments}` по
          каждому вызову MCP-тула за прогон. Сейчас читается только `reply`/`refusal` — `did`
          сознательно не читался (см. `chat-real-backend` выше), этим заходом дочитывается.

          ИСПРАВЛЕНО (2026-09-09, найдено овнером ДО написания кода — версия ниже отменяет
          первую): исходный текст велел вытаскивать `arguments.state?.name`/
          `arguments.state?.component` и инвалидировать по ним. Но реальный кэш, который завёл
          `content-graphql-migration`, — ключи `["content", "list"]`/`["content", "get", name]`,
          НЕ по компоненту (`listContentFor` фильтрует список на клиенте уже ПОСЛЕ чтения из
          кэша) — ключа вида `["content", component]` в коде нет. Для `form`/`outfit`/`palette`/
          `assembly` (виды `save_preset`) кэша в этом приложении вообще нет —
          `componentInfo`/`packages/ui` на `queryClient` не переехал (снятый отсюда кросс-зонный
          блокер, см. лог ниже). Вытаскивать `name`/`component` сейчас смысла не было — им
          некуда деваться, ни один кэш по ним не ключуется.

          Механика (по факту, не по гипотезе): `sendChatMessage` возвращает `did` — на успешном
          ответе агента пройти по `did`; `tool === "save_content"` →
          `queryClient.invalidateQueries({queryKey: ["content"]})` (TanStack Query матчит по
          ПРЕФИКСУ ключа — накрывает и `list`, и `get`, весь список целиком, без разбора по
          компоненту: дешёвый лишний перезапрос вместо пропущенного); `tool === "save_preset"` →
          `queryClient.invalidateQueries({queryKey: [arguments.kind]})` — сегодня no-op (нечего
          инвалидировать), но задел под конвенцию ключей на будущее, когда `componentInfo`
          переедет на `queryClient`.

          Заявка на форму `did.arguments` ЗАКРЫТА (2026-09-09, ответ box-агента): правило
          структурное, не по именам полей — скаляры доживают до `did` на любой глубине ДО второй
          включительно, объёмные (объекты/массивы глубже) заменяются пометкой размера. Живой
          прогон, пример для `save_preset`:

          ```json
          "save_preset": {
            "kind": "form",
            "state": {
              "name": "proba-did-form", "component": "button",
              "recipe": "«объект из 4 полей»", "variantTags": "«объект из 8 полей»"
            }
          }
          ```

          Значит `arguments.kind`/`arguments.state?.name`/`arguments.state?.component` — ВСЕГДА
          настоящие значения, не пометки (это скаляры на глубине ≤2), а `state.recipe`/`.assembly`/
          `.scales`/… — строка-пометка, не объект: код инвалидации не должен пытаться читать ИЗ
          них, только проверять их отсутствие/наличие как сигнал вида. Правило общее для любых
          будущих ручек ("так это будет работать и с теми ручками, которых ещё нет" — дословно
          box-агент), не привязано к словарю имён этой заявки — не нужно синхронизировать список
          полей при появлении новых kind. Проверено локально агентом на его стороне; на сервере
          прогон не повторялся (платный) — если нужна проверка там, решать user.

          Требует `@web-core/query`'s `QueryClient` смонтированным в приложении, чтобы у
          `invalidateQueries` было что инвалидировать — см. `content-graphql-migration` (первый
          настоящий потребитель `createQuery` в этом приложении, `finding-no-cache` в корневом
          ROADMAP.yaml уже отмечал, что `QueryClientProvider` смонтирован, но не использован).

          Сделано: `entities/chat/model/store.ts`'s `invalidateFor(did)` — по каждому вызову из
          `ChatRunResult.did`, `save_content` дёргает `queryClient.invalidateQueries({queryKey:
          ["content"]})` (совпадение по ПРЕФИКСУ — накрывает и `list`, и `get`), `save_preset`
          дёргает тем же способом по `arguments.kind` (сегодня no-op, задел на будущее). Зовётся из
          `sendMessage` на КАЖДОМ успешном ответе `sendChatMessage` (и `reply`, и `refusal` —
          `did` не привязан к исходу, тулы могли быть вызваны до отказа), не только когда есть
          текстовый `reply`.

      - id: witrina-remote-graphql-live
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Подключить витрину к внешнему стенду — деплой подтверждён живьём"
        description: |
          Закрывает находку `input-widget-real-ui-first-pass` (лог ниже): удалённый стенд БЫЛ на
          старом REST, теперь раскатан на GraphQL и проверен внешне (2026-09-09, отчёт после
          `ship.ps1`): `POST https://150.251.145.87:9787/graphql` отвечает, старый
          `/api/presets` — 404, `/healthz` наружу оставлен. Живой прогон настоящим агентом
          (прочитал группу компонентов → io-схему → `save_preset`) подтвердил и
          `author-header-not-argument` (см. `apps/skin/.mcp/ROADMAP.yaml`) на реальном контуре:
          `author` записи — логин из заголовка (`Raybul`), не то, что мог напечатать агент.

          Дальше — то, ради чего всё это: витрина переходит с локального бэка на этот адрес для
          РЕАЛЬНОЙ работы (создание скинов), не только для теста. `PRESETS_URL`/
          `VITE_PRESETS_URL` (`shared/api/presets`, `.env.local` — не в гит) →
          `https://150.251.145.87:9787/graphql`. CORS на `localhost:5174` уже открыт на бэке —
          проверять с этой стороны нечего, только выставить адрес и убедиться живым запросом
          из браузера.

          Локальный бэк+`.mcp` (тот, что использовали для разработки этой миграции) остаётся —
          для разработки и тестов функционала внутри репозитория, не для создания реальных
          скинов. Внешний контур — отдельная, параллельная площадка: там же тестируются внешние
          агенты и их функционал, не только витрина.

          Старые записи на внешнем стенде несут разнобой в `author` (`Egor Raybul` /
          `egorraybul@gmail.com`) — следы прежних, REST-эры заливок, не сегодняшней миграции;
          не чинить задним числом, только новые записи идут через заголовок.

          Сделано: НИКАКОЙ правки не потребовалось — корневой `.env` воркспейса (машинный, не в
          гит) уже держал `PRESETS_URL=https://150.251.145.87:9787` ДО этой сессии (тем самым
          адресом и была найдена находка `input-widget-real-ui-first-pass` — старый бэк на нём
          отвечал REST-404). Раз бэк переехал, тот же адрес автоматически стал верным: `resolveUrl`
          (`shared-api-presets-single-endpoint`) сам дописывает `/graphql`, вторая правка не нужна.

          Проверено живьём (свой dev-сервер 5175, БЕЗ переопределений): `/showcase/button` —
          наряд `omnifield` надет полностью (стили, не голый HTML), выпадашка "Наши данные"
          показала настоящую сохранённую запись, поля `label`/`data-variant`
          (`input-widget-real-ui`) заполнились её реальными значениями, показ отрисовал кнопку
          этими данными в двух сборках (default/status). Реальный сквозной прогон через GraphQL,
          не заглушка.

          НЕ СДЕЛАНО (вне зоны): пункт просил `.env.local` — отдельный, независимый от общего
          `.env` пин на случай, если кто-то переключит общий файл обратно на локальный бэк для
          разработки. Технически такой файл должен лежать в КОРНЕ воркспейса
          (`/workspaces/web-core/.env.local`), не в `apps/skin/` — `envDir` этого приложения
          (`packages/build/src/vite/app.ts`) жёстко указывает на корень воркспейса, файл ВНУТРИ
          `apps/skin/` Vite не читает вовсе (проверено — завёл такой по ошибке, `loadEnv` его не
          увидел, убрал). Корень воркспейса — не моя зона (`apps/skin/`), создавать там файл не
          стал; раз действующий `.env` и так уже указывает правильно и живой прогон это
          подтвердил, отдельный пин можно завести отдельным мелким шагом через architect, если
          нужна такая страховка.

  - category: "Lab — адаптеры (схема ↔ компонент)"
    items:
      - id: adapter-schema-resource
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Схема — самостоятельный ресурс Lab: скелет чужого ответа, без значений"
        description: |
          План (обсуждение user+architect, 2026-09-10). Юзер добавляет на `/lab` ручку своего
          OpenAPI — приложение сохраняет ТОЛЬКО скелет её ответа: ключи + тип значения, сами
          значения выбрасываются сразу. Схема ни к чему не привязана: не к компоненту, не к
          адаптеру — самостоятельный ресурс, живёт своей жизнью.

          Хранение (persist на бэке, CRUD) — вне `apps/skin`, отдельный трек в `backend/presets`
          (седьмой kind рядом с assembly/content/form/outfit/palette/tag, см.
          `packages/io/ROADMAP.yaml`'s `adapter-flow-two-way-and-l3` в log). Здесь — только то, что
          показывает и собирает `/lab`: форма добавления ручки, вызов, авто-построение скелета из
          образца ответа.

      - id: adapter-child-of-schema
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "Адаптер — дочерний ресурс СХЕМЫ, не компонента: жизненный цикл, много на одну схему"
        description: |
          План (2026-09-10). Адаптер живёт, ПОКА ЖИВА схема — удалили схему, адаптер удаляется
          вместе с ней (адаптировать больше нечего). На одну схему можно навесить сколько угодно
          адаптеров — под аккордеон, под select, под любой другой компонент кита, независимо друг
          от друга. Компонент про адаптеры не знает вообще, ни один — только свой `entity/io.ts`
          (`packages/ui`), это граница, которую UI не должен размывать.

          Связь поле-в-поле человек пишет РУКАМИ в обе стороны отдельно (приём: поле схемы → поле
          компонента; отдача: поле компонента → поле схемы) — второе направление НЕ выводится
          машиной из первого, оба через один и тот же движок `packages/io` (`applyFieldRules`
          дважды, разными списками правил). Разбор всей цепочки решения — `packages/io/ROADMAP.yaml`'s
          `adapter-flow-two-way-and-l3`.

          ИСПРАВЛЕНО (2026-09-11, после первой версии кода в `apps/skin` — жёсткий `schemaId`/
          `component` прямо на `Adapter`, найдено user неверным, разбор ошибки — `DBP.md`):
          "дочерний ресурс схемы" была неточной моделью. Верно — Adapter/OpenAPI(ручка+схема)/
          Component ТРИ НЕЗАВИСИМЫЕ сущности, ни одна не знает о соседях напрямую (адаптер не знает,
          что источник — ручка, а потребитель — компонент; ему это не нужно, он просто принимает
          одну форму и отдаёт другую). Схема (скелет запроса/ответа) была и остаётся собственностью
          ТОЛЬКО ручки (`endpointId`) — в этой части план не поменялся.

          Вместо `schemaId`/`component` у `Adapter` — необязательное поле `channels: Channel[]`
          (`Channel = { in: Ref; out: Ref }`, `Ref = { type: string; id: string }`, `type` —
          открытая строка, не закрытый union: новые типы источников/потребителей появятся снаружи,
          адаптеру не нужно знать список заранее). Это "стабильные каналы" — подсказка UX (не
          перебирать руками все адаптеры на новую пару), не жёсткая связь: адаптер остаётся
          универсальным и может встать в ЛЮБУЮ подходящую пару, объявленную или нет. Пример от user:
          один адаптер с входом "GET users" может обслуживать и `accordion`, и `listbox` — под
          разные компоненты либо один и тот же адаптер (если подходит), либо разные (разный
          ремаппинг), `channels` — просто список подтверждённых сочетаний, юзер ведёт сам.

          Связка "какой компонент + какая ручка + какой адаптер сейчас в работе" (было —
          `getOrCreateAdapter(schemaId, component)` внутри `entities/adapter`) переезжает в новый
          слой `features/` — «шов» компонент↔ручка. `entities/adapter` только показывает мастеринг
          (`AdapterMastering`) уже готовой парой, ничего не резолвит сам.

      - id: openapi-entity-extraction
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "entities/openapi — ручка+схема выносится из entities/adapter в свою сущность"
        description: |
          План (2026-09-11, DBP.md). `entities/adapter/model/endpoint`+`schema`+`ui/openapi` —
          целиком в новую сущность `entities/openapi`. Не только под адаптеры: user прямым текстом
          — "это полноценный свой функционал опенАпи, для любых целей", адаптеры — первый
          потребитель, не единственный. Флоу: юзер добавляет ручку на `/lab` (вручную или вставкой
          готовой OpenAPI-схемы из Свагера), список ручек виден всем, каждая несёт схему
          запроса/ответа целиком. Хранение на бэке — отдельный трек (`adapter-schema-resource`),
          здесь — только UI/модель `apps/skin`. `entities/adapter` после выноса держит только сам
          `Adapter` (тип+стор) и `AdapterMastering`.

      - id: features-layer-component-openapi-join
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "features/ — новый слой FSD: шов компонент↔ручка, выбор пары для мастеринга"
        description: |
          План (2026-09-11). В приложении сегодня только `app/pages/widgets/entities/shared` —
          `features` отсутствует как слой. Заводится под ИМЕННО эту связку: выбор "какой компонент
          + какая ручка" (левое дерево кита + правый райтбар со списком ручек `entities/openapi`)
          и резолв/создание нужного `Adapter` под эту пару — раньше эта логика ошибочно жила внутри
          `entities/adapter` (`getOrCreateAdapter`, знание про `currentComponent`/`currentEndpointId`
          разом). Сама сборка (`AdapterMastering`, две панели схем) остаётся в `entities/adapter` —
          фича вызывает её, передав уже выбранную пару.

      - id: adapter-mapping-ui-wizard
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "UI сведения полей — паттерн CSV-мастера импорта, не конструктор шагов"
        description: |
          Решение по интерфейсу (research 2026-09-10, разбор — log ниже): не повторяем старый
          конструктор адаптера таблиц (`products/tables`, снят) — там связь была не видна даже на
          уровне простого переименования ключей, слишком абстрактно для нетехнического юзера.
          Берём паттерн мастеров импорта CSV (Flatfile/OneSchema/CSVBox) — та же задача (чужой
          источник с неизвестными именами → фиксированная целевая схема), уже обкатана на
          нетехническую аудиторию.

          Экран: две колонки. Слева — ЦЕЛЬ (поля компонента из `entity/io.ts`, фиксированы). Справа
          — ИСТОЧНИК (поля схемы, из `discoverPaths`, уже есть в `packages/io`). На каждое целевое
          поле — дропдаун с источником, авто-подсказка по похожести имён (не пустой список на
          выбор вслепую). Рядом с каждой строкой — живой пример «было → стало» на реальных данных
          из образца ответа (не абстрактный превью после сохранения — сразу, по ходу настройки).
          Обратное направление (компонент → схема, отдача) — ТА ЖЕ таблица, колонки местами, не
          новый экран и не новая концепция.

      - id: adapter-value-transform-inline
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Преобразование значения — местный контрол у пары полей, не отдельный конструктор шагов"
        description: |
          Продолжение `adapter-mapping-ui-wizard`. Когда паре полей нужна обработка значения (дата
          в чужом формате, словарь кодов, число из строки с запятой) — контрол всплывает ПРЯМО У
          ЭТОЙ строки мастера (например, дропдаун «формат даты: ДД.ММ.ГГГГ», тем же приёмом что
          CSVBox), не уводит в отдельный экран сборки цепочки действий. Под капотом — те же `Step`
          из `packages/io` (`trim`/`date`/`dictionary`/…), просто интерфейс не показывает юзеру
          слово "шаг" и не заставляет собирать цепочку руками, если хватает одного преобразования.

      - id: adapter-rows-picker-ui
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "Выбор набора записей (L3) — карточки-кандидаты, не путь руками"
        description: |
          Для схем, где нужный список лежит внутри обёртки (`/data/items`, `/result`, …) — экран
          ПЕРЕД таблицей сведения полей: кандидаты от `discoverRowSets` (`packages/io`) показаны
          кликабельными карточками с примером содержимого, юзер выбирает клик, не вписывает JSON
          Pointer руками. После выбора — `discoverRowPaths` даёт список полей ВНУТРИ записи,
          которым дальше наполняется правая колонка `adapter-mapping-ui-wizard`.

  - category: Перформанс переключения компонента на витрине
    items:
      - id: catalog-list-remounts-whole-preview-on-switch
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Переключение компонента/наряда даёт 3 подряд ре-монтирования всего превью, не точечное обновление"
        description: |
          Найдено architect'ом (2026-09-14) по жалобе user: "у нас проблемы при переключении
          компонента на ветрине, постоянные перезапросы, на одно и тоже плюс мерцает экран при
          переходе на компоненты которые принимают детей... компоненты мигают, не просто одевают
          скин, а уже одетые мигают раз по 4-5". Проверено чтением (Explore-агент + architect лично,
          не только гипотеза с прошлой недели про `packages/skin`'s `useKitLife` — та НЕ
          подтвердилась для этого приложения: сигнал `componentData`/`outfitData`
          (`packages/skin/src/solid/connection.ts:96-108`), который эта гипотеза называла причиной,
          сегодня в `apps/skin` не читает НИКТО (grep по `useComponentSkinData`/`useOutfitData` —
          ноль вхождений), и на повторном разборе architect'ом (с учётом того, что `createMemo`
          в Solid по умолчанию сравнивает СВОЙ результат и не оповещает подписчиков, если он не
          изменился) сама запись `connection.ts` тоже похожа на ложную тревогу, не только на
          "пока не подключено" — отдельно в `packages/skin/ROADMAP.yaml` пока НЕ заведено, решение
          по плану user: сначала чистая витрина, потом замер движка отдельным заходом, не гадать
          заранее).

          Реальная цепочка, целиком в этом приложении:
          1. `entities/component/model/store.ts:66-84` — `setComponent`/`setOutfit` синхронно
             меняют state И сразу (без ожидания) запускают `loadVariants()`/`loadAssemblies()`
             (`:42-64`, fire-and-forget). На одно нажатие "выбрать компонент" получается ТРИ
             обновления state подряд: сам `setState` в `setComponent`, потом резолв `loadVariants`,
             потом резолв `loadAssemblies`.
          2. `variantsByTag` селектор (`store.ts:89-93`) на каждое чтение зовёт `groupByTag(state.
             variants.data ?? [])` (`@web-core/skin/tags`) заново — тот строит НОВЫЕ объекты
             `{tag, variants}` каждый раз, даже если исходные данные не изменились между двумя из
             трёх обновлений.
          3. `widgets/catalogs/ui/list.tsx:12` — `<For each={props.items}>` (сюда приходит результат
             `variantsByTag`). У `solid-js`'s `<For>` НЕТ пропа `by`/ключа (проверено по
             `node_modules/.pnpm/solid-js@1.9.14/.../flow.d.ts:16-20` — только `each`/`fallback`/
             `children`) — сверка элементов идёт по ССЫЛКЕ объекта. Раз каждое из трёх обновлений
             даёт новый массив новых объектов — `<For>` на каждое из них считает ВСЕ строки
             удалёнными и вставленными заново, а не переиспользует DOM. Полностью размонтируется и
             монтируется заново всё поддерево `DemoStand → Preview → Carousel → Renderer` (реальные
             компоненты кита внутри) — 3 раза на один клик.

          Почему сильнее видно у компонентов с детьми (Accordion/Tabs) — это НЕ отдельный баг:
          `RenderTree` (`packages/assembly/src/render`) рекурсивно строит self-assembly, у составных
          компонентов в этом поддереве физически больше DOM-узлов/инстансов кита — тот же полный
          ремонт, просто крупнее видно и дольше выполняется.

          Направление (не готовое решение, дизайн — за owner'ом): (а) в `setComponent` дождаться
          `loadVariants`/`loadAssemblies` ПЕРЕД тем как давать `<For>` увидеть новые данные, чтобы
          было одно обновление, а не три подряд — или (б) сделать `variantsByTag`/`groupByTag`
          стабильными по ссылке (мемоизация по фактическому содержимому `variants.data`, не пересчёт
          на каждое чтение), чтобы неизменные строки переживали ре-рендер. Возможно нужны оба —
          (а) убирает лишние ДВЕ волны из трёх, (б) защищает от `<For>`-ремонта на оставшуюся.

          Объём правки небольшой и локальный: `store.ts` (95 строк, трогаются ~15: `loadVariants`/
          `loadAssemblies`/`setComponent`/`setOutfit`/`variantsByTag`), `list.tsx` не обязательно
          трогать вовсе, если (б) закрывает вопрос стабильностью входа. НЕ входит в объём: механика
          `packages/skin` (`connection.ts`, `useComponentSkin`) — по плану user это отдельная зона,
          отдельный заход ПОСЛЕ того, как здесь станет чисто: сначала замер на чистом приложении,
          потом (если замер покажет реальную проблему, не только код-смелл на бумаге) отдельное ТЗ
          owner'у `packages/skin`, не раньше.

          Проверка закрытия: живой клик "выбрать компонент" в chrome-devtools (`take_snapshot`
          до/после, `list_network_requests`) — превью НЕ размонтируется полностью (старые DOM-узлы
          компонентов, не относящихся к сменившимся данным, переживают клик), сеть не бьёт по
          вариантам/сборкам повторно на уже виденную пару.

          ТРЕБУЕТ ПЕРЕОЦЕНКИ, НЕ ЗАКРЫТ (сверка доки с кодом 2026-09-20): описанной здесь цепочки
          в дереве больше нет. `entities/component/model/store.ts:66-84` с `setComponent`/
          `loadVariants`/`loadAssemblies` и селектором `variantsByTag` не существует — данные
          компонента ведёт `ComponentProvider` через кэш запросов, а три обновления state подряд
          на один клик были свойством именно снесённого стора. Вторая половина той же жалобы
          закрыта отдельно (`component-store-loads-without-cache`: сеть на повторный заход не
          бьёт, проверено живьём).

          Что из этого следует: мигание показа могло уйти вместе с той цепочкой, а могло остаться
          по другой причине — сегодняшний диагноз не проверялся ни разу. Прежде чем чинить, нужен
          НОВЫЙ замер на нынешнем коде: тот же живой клик, `take_snapshot` до/после. Чинить по
          тексту, описывающему несуществующий код, нельзя.

      - id: component-store-loads-without-cache
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "loadVariants/loadAssemblies бьют по сети заново на каждое переключение, кэша нет вовсе"
        description: |
          Тот же триаж, что `catalog-list-remounts-whole-preview-on-switch` (тот же клик, вторая
          половина жалобы user: "постоянные перезапросы, на одно и тоже"). Отдельный пункт, потому
          что чинится отдельно от ремонта DOM — это про сеть, не про реактивность.

          `entities/component/api/presets.ts:16-20`'s `variantsOf` и `:11`'s `assembliesOf` — прямые
          вызовы `presetsClient.list`/`variantsOfOutfit` (`@web-core/skin/presets`), без единого
          кэша. Каждый `setComponent`/`setOutfit` (`store.ts:66-84`) — это заново `client.get(outfit)`
          + `client.list(form, {component})` внутри `variantsOf` (`packages/skin/src/presets/
          variants.ts:15-18`, у него самого кэша тоже нет — он и не должен, это дешёвая stateless-
          функция, дедуп не её ответственность) плюс `client.list(assembly, {component})` — целыми
          списками, даже если пара (наряд, компонент) уже грузилась в этой сессии секунду назад.

          Средство под рукой уже есть и не используется: `shared/api/clients/index.ts:5` заводит
          `export const queryClient = new QueryClient()` (`@web-core/query`), `QueryClientProvider`
          смонтирован в `app/index.tsx` — но живого потребителя `createQuery`/`.fetchQuery(`/
          `invalidateQueries` во всём приложении сегодня НЕТ (проверено grep'ом по `apps/skin/src`,
          ноль вхождений) — заведён впрок, не подключён. Роадмап раньше описывал похожую обвязку
          вокруг `content.ts` (`content-graphql-migration`, ниже в этом же файле, статус Done) —
          но файла `entities/component/model/content.ts` в репозитории сегодня нет (проверено —
          не найден), похоже приложение с тех пор рефакторили и этот путь уехал/исчез; ссылаться на
          него как на живой пример нельзя, статус того пункта разошёлся с кодом. Значит здесь —
          первый реальный живой потребитель `queryClient`, не повтор существующего приёма.

          Направление: обернуть `variantsOf`/`assembliesOf` (и, раз уж заход один, `palettesOf`/
          `outfitsOf`, они того же вида в том же файле) в `queryClient.fetchQuery({queryKey: [...],
          queryFn: ..., staleTime: Infinity})` — ключи по факту различающих параметров
          (`["variants", outfit, component]`, `["assemblies", component]`), протухание — по явной
          инвалидации, не по таймеру (тот же довод, что был у content-миграции: авто-протухание
          излишне, если событие смены наряда/компонента уже известно коду). Инвалидация имени наряда
          уже есть в жизненном цикле `SkinProvider`/`connection.ts` на смену наряда — owner решает
          сам, откуда его дёргать здесь (`setOutfit`, вероятно).

          Объём: `entities/component/api/presets.ts` (31 строка, все 4 экспорта). Возможна лёгкая
          правка `store.ts`, если инвалидация нужна оттуда. НЕ входит в объём: сам `presetsClient`/
          `variantsOf` в `packages/skin` не трогаются — дедуп на уровне HTTP/GraphQL им не нужен,
          кэш — забота вызывающего приложения, не механики.

          Проверка закрытия: `list_network_requests` в chrome-devtools — переключение компонента
          туда-обратно (A→B→A) на одном наряде не даёт повторного запроса на уже виденную пару
          (наряд, компонент).

          СДЕЛАНО (обнаружено при сверке доки с кодом 2026-09-20, не этим заходом — правка приехала
          раньше): `entities/component/api/presets.ts` целиком на `defineQuery(queryClient, ключ,
          запрос, {staleTime: Infinity})` — все четыре названных экспорта плюс `contentOf`, ключи
          по различающим параметрам (`["variants", component]`, `["assemblies", component]`).
          Текст пункта успел устареть и в другом: `entities/component/model/store.ts:66-84` с
          `loadVariants`/`loadAssemblies` больше не существует — данные компонента ведёт
          `ComponentProvider`, а кэш и есть их стор.

          Проверка закрытия прогнана ровно так, как требовал пункт (dev-сервер, chrome-devtools,
          `/showcase`): первый заход на `button` — 25 запросов к `/graphql`; клик на `checkbox` —
          +4 (новая пара, законно); возврат на `button` — +0. Повторного запроса на уже виденную
          пару нет.

  - category: Кормление компонента
    items:
      - id: feed-board-entity
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "entities/feed — доска кормления: поставщик и потребитель еды не знают друг о друге"
        description: |
          Означает: еда уехала из стора показа в собственную сущность. Поставщик кладёт порцию
          (`serve(by, data)`), потребители читают (`data()`), метка `by` говорит, чем накормлено
          сейчас, и по ней же интерфейс решает, чья панель настройки активна.

          Почему не осталась в показе: еда не его свойство, и потребитель у неё не один — кормить
          нужно и изолированный показ, и будущий редактор, и тестирование, а каждый завёл бы свою
          копию. Разбор — FAQ.md.

          Метка — открытая строка, не перечисление: сущность не знает списка поставщиков и не
          меняется от появления нового. Как поставщик выбрал эти данные (имя записи, черновик
          формы, адрес ручки) на доске НЕ лежит — это нужно только ему и живёт в его сторе.

          Доска плоская и одна на компонент. Прежний стор показа умел адресовать корм ячейкой, но
          ни один живой вызов ячейку не передавал — механика без потребителя, ячейки остались
          понятием показа.

          Еда клонируется на входе: приезжает из чужого стора, где может лежать реактивный прокси,
          а immer морозит положенное глубоко. Клонирование стоит на доске, а не у поставщиков —
          иначе первый забывший роняет того, у кого взял. Проверяется `test/feed-board.test.ts`
          (4 теста), включая прямую проверку, что исходный объект не заморожен.

          Своего провайдера у сущности нет: компонент уже назван `ComponentProvider`'ом, стор —
          семья по его имени. Второй контекст рядом дал бы то же самое и ещё одно место, где два
          имени расходятся.

      - id: feed-providers-as-features
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Поставщики еды — отдельные слайсы под features/feed, показ о них не знает"
        description: |
          Означает: `features/feed/preset` (выбор сохранённой записи) и `features/feed/manual`
          (правка формой по io-схеме). Показ читает только `useFeed().data()` — ни про записи, ни
          про формы, ни про будущие ручки он не знает.

          Общего barrel'а у группы НЕТ намеренно: импорт одного поставщика не должен тянуть
          остальных — `feed/manual` тащит `@web-core/feeder`. Ходят точечно, `#/features/feed/preset`.

          `preset` держит свой стор — выбранную запись. Еду кладёт эффект, а не обработчик: тело
          записи живёт в кэше запросов и может приехать позже выбора или смениться под ним, и
          подача из эффекта доносит такое обновление до доски.

          Чужую подачу поставщик не перебивает (человек поправил руками — возврат на компонент это
          не откатывает), но имён соседей при этом не знает: проверяется факт «положил не я»
          (`by !== undefined && by !== "preset"`), метка читается через `untrack` — иначе
          собственная подача будила бы тот же эффект по кругу. Явный выбор в списке кормит
          отдельно и сразу.

          Проверено живьём (dev-сервер, chrome-devtools, `/showcase/button`): запись доезжает до
          всех семи ячеек показа; форма ручного ввода показывает еду, положенную ПОСТАВЩИКОМ
          ЗАПИСЕЙ (они никак не связаны в коде — это и есть доказательство шва); правка руками
          доезжает до показа обратно; уход на соседний компонент и возврат ручную правку сохраняет.

  - category: Имена и раскладка
    items:
      - id: preview-feature-renamed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "features/component-manager → features/preview: имя называет механику, не приложение"
        description: |
          Означает: «менеджер компонентов» описывал всё приложение и не отличал фичу ни от чего —
          следующая (тестирование, валидаторы) была бы таким же «менеджером». Папка при этом уже
          сама себя называла иначе: внутри лежал `ui/demo-stand` со своим README, терминология
          модели была «стенд».

          Переехало в два шага, чтобы ревью отличало переименование от архитектурной правки:
          сперва `demo-stand` (плюс схлопнут дублирующий `ui/demo-stand` уровнем выше), затем
          `preview` — «стенд» называет мебель, а не механику. Префикс `component-` не взят: в этом
          приложении его можно дописать к чему угодно.

          `model/stand.ts` → `model/preview.ts`, `useStand` → `usePreview`, `demoStandStoreOf` →
          `previewStoreOf`, три теста следом. Проза приведена к тому же слову — иначе дока
          рассказывала бы про стенд, которого в коде нет.

      - id: widgets-name-place-not-owner
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Виджеты названы местом или темой: rail, preview, feed вместо *-manager"
        description: |
          Означает три правки одной природы.

          `widgets/rail` — поверхность бокового рейла, принимает детей. До этого была написана
          дважды под двумя именами: блок под фичу «API» в лаборатории и панель управления в
          витрине, причём вторая копия обходилась без прокрутки вовсе. `widgets/lab-manager` снят
          целиком — своей логики там не было, а переключение между фичами, которое он обещал
          завести у себя, давно живёт в `pages/lab` на `NavigationTabs`.

          `widgets/component-manager` распался по темам: `widgets/preview` (`PreviewArea` —
          рабочая область показа, `PreviewControls` — переключатели) и `widgets/feed` (`FeedPanel`
          — по секции на поставщика). Панель до этого смешивала две оси, и будущий поставщик из
          ручки полез бы в виджет чужой темы.

          Отступ содержимого переехал внутрь поверхности: снаружи он оставлял полосу прокрутки
          внутри отступа и был только у одной из двух копий — сведение обязано выбрать одно.

          Отсюда же критерий «общего» виджета: он общий, если не импортирует ни одной фичи и ни
          одной сущности приложения. По нему `catalogs`/`navigations`/`header`/`rail` готовы уехать
          в отдельный пакет, а `preview`/`feed` — нет и не будут.

      - id: dead-tests-removed
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Мёртвые тесты снесены — проверка зоны снова зелёная"
        description: |
          Означает: пять тестов держали typecheck и прогон красными, охраняя код, которого в дереве
          нет. Красный гейт обесценивал каденс «проверка перед коммитом»: он падал всегда и потому
          не ловил ничего.

          `openapi-skeleton` охранял `skeletonOf` из `entities/schema` — по всему репозиторию он
          существовал только внутри самого теста. `openapi-endpoints` и `openapi-import-swagger2`
          били в `entities/openapi`, уехавшую в `interfaces/feeder`, где у неё свой тест.
          `input-to-preview` и `select-in-slot-repro` били в `Slot`/`componentDataAtom`/
          `widgets/component/input`. Свойство, которое ловил последний, осталось под
          `select-incremental-growth` (голый движок), а сам дефект починен в `packages/assembly`.

          После правки: `tsc` 0, `eslint` 0, 13 файлов и 65 тестов зелёные.


  - category: Кормление из ручки API
    items:
      - id: feed-openapi-provider
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "features/feed/openapi — поставщик еды из живой ручки"
        description: |
          План (обсуждение user 2026-09-20). Третий поставщик рядом с `preset` и `manual`, по тому
          же контракту: человек ткнул — корм сменился, метка на доске `openapi`. Автовызова нет и
          не планируется: витрину открывают часто, а дёргать чужой API на каждый клик по дереву
          нельзя (решение user).

          Своего состояния почти не держит: что показывать и что вызывать, решает каталог со
          стороны `@web-core/feeder`, студия кладёт полученное на доску через `feed.serve`.
          Данные приходят УЖЕ собранными по форме компонента — разворачивать записи и угадывать,
          где у компонента список, студия не должна (решение user: структура живёт в адаптере).

          Зависит от заявки на сторону feeder (позиции 2–5 — поиск связанных ручек, каталог в
          режиме вызова, сборка результата в готовый объект, отдача готовых данных).

      - id: lab-adapter-mastering-screen
        type: feature
        status: Open
        priority: High
        milestone: null
        name: "/lab — экран сведения полей: компонент слева, ручка справа"
        description: |
          План (2026-09-20). В главной области лаборатории — `AdapterMastering` из
          `@web-core/feeder`: пара «выбранный компонент + выбранная ручка», создание и правка
          адаптера этой пары. Адаптер ищет и заводит сам мастеринг (`adapterFor` внутри него) —
          студия парой не управляет, только называет её.

          В райтбаре — `ExternalSchemaLoader` (загрузка документа схемы) и `ApiCatalog` (каталог
          ручек с настройкой в диалоге), оба уже стоят в `features/lab-manager`, но сегодня
          каталог никуда не отдаёт результат.

          Левая колонка мастеринга (`output`) — поля компонента, `describeSchema` по io-схеме из
          `useComponent().io()`. Правая (`input`) — поля ответа ручки, и вот здесь ограничение:
          схемы ОТВЕТА нет ни в `EndpointDescriptor`, ни в `OpenapiEndpoint` (там схема запроса,
          её использует `Config`), и `parseSchema` её не сохраняет. Значит правая колонка
          строится из ЖИВОГО ответа (`describeSample(result.body)`) — мастеринг пуст, пока ручку
          не дёрнули хотя бы раз. Принято осознанно (тот же приём у мастеров импорта CSV: сперва
          образец, потом сведение); альтернатива — feeder научится сохранять схему ответа при
          разборе документа, это позиция 6 заявки.

      - id: showcase-endpoint-feed-section
        type: feature
        status: Open
        priority: Medium
        milestone: null
        name: "/showcase — секция вызова ручки в панели кормления"
        description: |
          План (2026-09-20). Третья секция `FeedPanel` рядом с «Пресет» и «Ручной ввод»: список
          ручек, у которых есть адаптер с ЭТИМ компонентом, в урезанном виде — живой вызов плюс
          минимальный редактор (параметры, пагинация), без полного редактирования схемы. Нажатие
          дёргает ручку, ответ проходит через адаптер пары и ложится на доску.

          Отбор ручек по компоненту делает feeder, не студия: у него и пресеты, и фичи, и обход
          дерева `providers` (решение user — базовые механики на его стороне, поверх контракта не
          строим). Позиции 2–3 заявки.

          Место под секцию уже готово: `widgets/feed`'s `FeedPanel` собирает поставщиков секциями,
          добавление третьего не трогает ни доску, ни показ, ни соседние панели.


log:
  - id: feed-as-entity-and-widget-naming
    type: plan
    date: 2026-09-20
    summary: >
      Заход про архитектуру: как вносить обвес, не вплетая его в движок приложения. Разговор начат
      с того, что кормление компонента (пресеты, ручной ввод, завтра ручки API) — фича, а не
      несущая механика, и при нынешней раскладке каждая такая фича вплеталась бы в показ.

      Сверка с рынком (2026-09-20): Storybook — ядро не знает аддонов, аддон вкладывается в
      названные типы точек (PANEL/TAB/TOOL) плюс decorators и parameters; VS Code — та же идея, но
      декларация статическая, манифест читается на старте. Взято: именованные точки и сборка в
      одном месте. Не взято: рантайм-загрузка — одно приложение в монорепо, динамика платится
      типобезопасностью ни за что.

      Первое предложение овнера (реестр источников + провайдер со списком в `app/`) user заменил
      более точной моделью, и она лучше: точка расширения — СУЩНОСТЬ студии, которая держит стор,
      даёт контекст и механику, а фичи в неё пишут и читают. Так снимается «фича импортирует
      фичу» (сущность лежит ниже фич), исчезает реестр как задача (регистрировать некого) и
      появляется правило, по которому лягут будущие тестирование, валидаторы, сборки — каждое
      своей сущностью-доской, а не очередным реестром. У фичи при этом остаётся СВОЙ стор со
      своими рабочими моментами; на доску кладётся только то, что нужно другому участнику.

      Сделано по этому правилу: `entities/feed` (доска), `features/feed/preset` и
      `features/feed/manual` (поставщики), показ перестал хранить еду вовсе. Дальше тем же
      приёмом — поставщик из ручки OpenAPI, для которого место уже готово.

      Попутно закрыт долг по именам: `features/preview` вместо `component-manager` (двумя шагами
      — сперва переименование, потом вынос еды, чтобы ревью их различало), виджеты названы местом
      или темой (`rail`/`preview`/`feed`), `widgets/lab-manager` снят целиком. Снесены пять
      мёртвых тестов, после которых проверка зоны впервые за долгое время зелёная целиком.

      Дока зоны переписана ОТ КОДА, а не правкой старого текста: README врал почти везде (описывал
      снесённый фейк-генератор и маршруты, которых нет), FAQ наполовину состоял из ответов про
      `zocker` и «тестов пока нет». По ходу сверки нашлось, что открытый пункт
      `component-store-loads-without-cache` давно сделан кодом — закрыт его же проверкой, живым
      замером сети; а `catalog-list-remounts-whole-preview-on-switch` описывает уже не
      существующую цепочку и помечен как требующий нового замера, а не починки по старому тексту.

  - id: adapter-independent-entities-decomposition
    type: plan
    date: 2026-09-11
    summary: >
      Разбор ошибки декомпозиции в первой версии кода `entities/adapter` (детально — `DBP.md`,
      завёден по прямому требованию user): компонент настройки ручки (`EndpointForm`) был молча
      перенесён в зону мастеринга без запроса; отдельно — `model/` внутри `entities/adapter` был
      плоской кучей 8 файлов трёх разных доменов (Endpoint/Schema/Adapter) вместо группировки по
      домену. Обе поправлены на месте (форма вернулась в зону ручки под аккордеон, `model/`
      переразложен по поддоменам `adapter/`/`endpoint/`/`schema/`, каждый со своим `index.ts`).

      Дальше user проговорил флоу целиком, вскрылась более глубокая неточность модели — записана
      как исправление в `adapter-child-of-schema` выше. Коротко: Adapter/OpenAPI(ручка+схема)/
      Component — ТРИ независимые сущности, ни одна не ссылается на соседей напрямую. У `Adapter`
      вместо `schemaId`/`component` — необязательные `channels: {in: Ref, out: Ref}[]`
      (`Ref = {type: string, id: string}`) — подтверждённые UX-подсказки "с какими парами я
      работаю", не жёсткая связь: адаптер остаётся универсальным, встаёт в любую подходящую пару.
      `entities/adapter/ui/openapi` (список ручек+форма+сохранение схемы) выносится целиком в
      новую сущность `entities/openapi` — самостоятельный функционал, не только под адаптеры
      (`openapi-entity-extraction`). Связка "выбранный компонент + выбранная ручка → нужный
      адаптер" переезжает в новый слой `features/`, которого в приложении раньше не было
      (`features-layer-component-openapi-join`) — `entities/adapter` только показывает мастеринг
      уже готовой парой, сам ничего не резолвит.

      Договорено идти итерациями — маленькими шагами, обсуждая каждую перед кодом, не забегая
      вперёд и не делая лишнего.

  - id: adapter-lab-flow-and-ui-research
    type: plan
    date: 2026-09-10
    summary: >
      Продолжение `packages/io/ROADMAP.yaml`'s `adapter-flow-two-way-and-l3` — тот же разговор,
      здесь записана часть про `/lab` и интерфейс. Флоу от user: юзер добавляет на `/lab` ручку
      своего OpenAPI, приложение сохраняет только скелет её ответа (ключи+тип, без значений) —
      схема. Дальше юзер строит адаптер под конкретный компонент кита — связь поле-в-поле в обе
      стороны, руками, каждое направление отдельно (не разворотом одного в другое). Адаптер —
      ресурс СХЕМЫ, не компонента: живёт, пока жива схема, на одну схему — сколько угодно
      адаптеров. Компонент про адаптеры не знает — только свой `entity/io.ts`.

      По запросу user — ресёрч в сети, на что ориентироваться интерфейсом (прошлая попытка,
      конструктор адаптера `products/tables`, была непонятна даже на уровне переименования ключей).
      Нашли два полюса: конструкторы workflow (Zapier/Make — вставка через pill/токен, node-граф)
      рассчитаны на людей с workflow-мышлением; мастера импорта CSV (Flatfile/OneSchema/CSVBox)
      решают БУКВАЛЬНО нашу задачу — чужой источник с неизвестными именами → фиксированная целевая
      схема — и обкатаны именно на нетехническую аудиторию. Решение: ориентир — второй полюс.
      Источники: appmaster.io/blog/csv-import-column-mapping-ui, blog.csvbox.io/inside-csvbox-column-mapping,
      try.oneschema.co/flatfile-vs-oneschema, help.zapier.com (field mapping — для контраста, не
      взяли).

      Записаны пять пунктов категории "Lab — адаптеры" (все Open, работа не начата): схема и
      адаптер как ресурсы с разведённым жизненным циклом, сам мастер сведения полей (две колонки,
      дропдаун, авто-подсказка, живой пример «было → стало» по месту, не после), преобразование
      значения как МЕСТНЫЙ контрол у пары полей (не отдельный конструктор цепочки), выбор набора
      записей (L3) — кликабельные карточки-кандидаты, не путь руками. Хранение схемы/адаптера как
      персистентных ресурсов (CRUD, `backend/presets`) — явно ЗА границей `apps/skin`, отдельный
      трек после того, как движок `packages/io` и этот UI устаканятся.


# Дорожная карта @web-core/studio — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у web-core/store (categories → items, log → журнал решений); без milestones — у приложения
# нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Структура каталогов
    items:
      - id: index-as-public-api
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: index.ts/tsx — единственный публичный вход папки
        description: |
          Означает: файл вида `папка/папка.tsx` (дублирующее имя) переименован в `папка/index.tsx`
          везде, где встретился (header, tree, preview, input, renderer, slot, app). Агрегирующие
          папки без единственного файла (model, ui, верх слайса entities/component,
          entities/showcase, widgets/component) получили тонкий index.ts-barrel — снаружи ходят
          только в него, не глубже.

      - id: index-stays-thin
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: index держит только реэкспорт, не логику
        description: |
          Означает: entities/component/utils/fake-generator разнесён на index.ts (один реэкспорт),
          generate.ts (сама функция), text.ts (приватные хелперы текста), hints.ts (таблица
          подсказок, тоже не публичная). Разбор — FAQ.md.

  - category: Импорты
    items:
      - id: no-file-extensions
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Расширения убраны из всех импортов
        description: |
          Означает: ни настоящих (.ts/.tsx), ни поддельных под скомпилированный вывод (.js/.jsx) —
          бандлер (Vite, moduleResolution bundler) в них не нуждается.

      - id: hash-imports-need-tsconfig-paths
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "package.json#imports (алиас #/*) не резолвится без расширения даже под bundler"
        description: |
          Означает: TypeScript 7.0.2 даёт мягкое резолвление bundler-режима (без расширения, с
          авто-index папки) только относительным путям и tsconfig.paths — не package.json#imports,
          тот остаётся строгим по спецификации Node ESM независимо от moduleResolution. Починено
          зеркальным compilerOptions.paths в apps/skin/tsconfig.json, локально для этого
          приложения. Разбор — FAQ.md.

  - category: Фейк-генератор (удалён)
    items:
      - id: schema-only-generator
        type: feature
        status: Removed
        priority: Medium
        milestone: null
        name: generateFakeData принимает io-схему, не компонент целиком
        description: |
          Было сделано так (движок один и общий — zocker, читает зод-теги прямо из схемы; второй
          параметр component — только ключ таблицы подсказок). Выпилено целиком решением user —
          см. `zocker-removed` в категории "Наполнение данными показа": наполнение теперь только
          из presets, зодер как источник данных показа больше не существует в этом приложении.

      - id: hints-per-field
        type: feature
        status: Removed
        priority: Medium
        milestone: null
        name: Таблица подсказок длины текста (component → field → length)
        description: |
          Было сделано так (supply() по ссылке на схему конкретного поля, не override() по типу).
          Выпилено вместе со всем `fake-generator/` — см. `zocker-removed`.

      - id: array-count-hints
        type: feature
        status: Removed
        priority: Medium
        milestone: null
        name: Подсказки количества/контента для полей-массивов
        description: |
          ЗАКРЫТО (2026-09-09) БЕЗ РЕАЛИЗАЦИИ — весь приём, которым эта задача собиралась
          пользоваться, снесён раньше неё. Означало (текст ТЗ, каким он был): для компонентов со
          списками (меню, аккордеон) — не просто заменить N пунктов на аналоги, а сгенерить и
          разное количество, и разный контент, тем же приёмом (`supply()` по ссылке на
          `.element`-схему массива + подсказка на количество), каким `hints-per-field` подставлял
          длину текста. Это `zocker`'s API — `fake-generator/` (генерация случайных данных по
          io-схеме) выпилен целиком решением user (`zocker-removed`): наполнение теперь только из
          сохранённых `content`-пресетов, автогенерации не существует вовсе, класть подсказку
          некому и незачем.

          Смысл задачи ("контролировать количество элементов массива") не исчез — переехал в
          `input-nested-fields-engine` (категория "Embed-маршруты"), но другим способом: не
          подсказка для генератора, а прямое добавление/удаление элементов в форме редактирования
          (человек или агент решает количество явно, кладя в `content`, а не движок гадает).

  - category: Документация
    items:
      - id: readme-app-template
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README по общему шаблону — первый пилот genus "app"
        description: |
          Означает: Анатомия — таблица маршрутов (адрес = URL, не импорт-спецификатор, у
          приложения нет импортируемой поверхности); Использование — команды и адреса вместо
          кода-потребителя; Настройки — переменные окружения Vite и флаги dev-сервера; Состояния —
          статус componentInfoAtom (ResourceState); IO — параметры маршрута и адрес службы на
          входе, реальный рендер и фейковые данные на выходе; Рецепт — таблица подсказок
          фейк-генератора как съёмный слой снаружи io-схемы. genus "app" — новый, эталон для
          будущих apps/*.

      - id: faq-roadmap
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: FAQ.md и ROADMAP.yaml — первое заполнение
        description: |
          Означает: FAQ.md сгруппирован по темам (структура каталогов / импорты / фейк-генератор /
          тесты), каждый ответ со ссылкой на проверку. ROADMAP.yaml — по образцу web-core/store
          (Done-пункты сразу с описанием, log — датированный журнал решений).

  - category: Наполнение данными показа
    items:
      - id: zocker-removed
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Фейк-генератор (zocker) выпилен — единственный источник данных теперь presets"
        description: |
          Означает: `entities/component/utils/fake-generator/` (generate.ts/hints.ts/payload.ts/
          text.ts) и неиспользуемый враппер `shared/utils/zocker/` удалены целиком, `zocker` убран
          из `package.json` и лок-файла этого приложения (в `apps/skin/.mcp` остаётся — отдельный
          пакет, отдельная зависимость, не трогали). `componentHandle.generate()` и его вызовы
          (кнопка "GENERATE FAKE DATA" в `Input`, fallback в `pages/embed/index.tsx` без
          `?content=`) убраны — компонент без сохранённого content теперь остаётся без данных
          (`embed`) или получает мок-строку (витрина, см. `input-content-select` ниже), не
          выдуманный зодером объект. Решение user: наполнение — только из наших пресетов.

      - id: input-content-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Input — выбор сохранённого content, дефолт на пункт 0, реакция на смену компонента"
        description: |
          Означает: `widgets/component/input` — контролируемый `Select` (`value={selected()}`, не
          отдан на откуп внутреннему стейту Ark) поверх `listContentFor(component)`. Эффект на
          `items()` сам выставляет пункт `0` и грузит его `state.data` через `component.setData`
          при каждой смене списка — в т.ч. при переключении компонента в дереве (баг: раньше
          подпись на триггере оставалась от предыдущего компонента, Select не реагировал). Список
          пуст → выбор сброшен, данные — литерал `"-мок-"`, не пустота и не зодер.

      - id: repeat-items-empty-on-embed
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Компоненты с repeat/items (select, radio-group и другие) рендерят ПУСТО через /embed"
        description: |
          Найдено user живьём (2026-09-10): `select` с реальным сохранённым content'ом
          (`select-currencies`, 9 валют) открывает список — пустой, ноль пунктов. Сначала
          заподозрили сам `select`/движок сборки — проверено живьём через chrome-devtools (не
          снимок, реальный DOM+сеть), это НЕ ТО:

          1. НЕ select-специфично. `radio-group` с реальным content'ом (`radio-group-delivery`)
             через тот же `/embed`-путь — та же картина: контейнер есть, 0 радиокнопок внутри.
             Разные Zag-машины, один симптом.
          2. НЕ голый `createListCollection` без аксесоров (гипотеза, которую первой назвал
             овнер `web-core/ui`) — дефолтные аксесоры `@zag-js/collection` и так читают
             `.value`/`.label` (проверено чтением исходника vendor'а, `list-collection.mjs`),
             работали бы и без явных `itemToValue`/`itemToString`.
          3. НЕ общий движок разворота (`web-core/skin/engine/passport/assembly/expand.ts`). У
             `menu` есть тест на реальном DOM с реальным кликом (`menu.test.tsx`,
             `unified-item-collection-engine`) — тот же приём `repeat`/`bind`, зелёный.
          4. Данные долетают корректно — сетевой запрос (`kind:"content"`) в devtools содержит
             `select-currencies` с полными 9 записями, витрина корректно показывает `label`
             (`"Валюта счёта"`) и `placeholder` (`"Не выбрана"`) из ТОГО ЖЕ объекта данных — то
             есть `data` дошли до рендера, просто REPEAT по ним не сработал.

          Направление, не готовый диагноз: `entities/component/model/handle.ts:57`'s `ready()`
          смотрит ТОЛЬКО на `componentInfoAtom` (паспорт/форма), не на `componentDataAtom`
          (контент). `pages/embed/index.tsx`'s `<Show when={component.ready()}>` монтирует
          `Renderer` по этому флагу — значит `Renderer` может смонтироваться РАНЬШЕ, чем контент
          вообще приехал. Тот же класс дыры уже ловили и чинили один раз для `loading()`
          (`slot-loader-around-renderer`: "данные показа едут отдельно от info и этим флагом не
          покрыты") — но там правили спиннер в витрине, `ready()` в `embed` не трогали.

          НЕ доказано статическим чтением: должно ли это давать именно ПОСТОЯННЫЙ 0 (не временный
          на один кадр) — `Renderer`'s `createMemo` читает `props.data` реактивно, по теории
          обязан пересобраться, когда `componentDataAtom` обновится. Если пересборка реально не
          происходит — причина глубже, в реактивной цепочке между `EmbedPage`'s
          `component.setData(...)` и `Renderer`'s `createMemo(() => instanceOf(...))`, не
          обязательно в самом `ready()`. Проверять живым `console.log`/брейкпоинтом на пересборке
          дерева, не гадать дальше.

          ПРОВЕРЕНО (owner-skin-app, 2026-09-10): гипотеза `ready()` НЕ подтвердилась. Написан
          изолированный repro — голый `kitComponentRenderer()`+`RenderTree`, БЕЗ `apps/skin`
          вообще (`ready`/`EmbedPage`/`Renderer` не участвуют), `data` меняется через `createSignal`
          напрямую (`test/render-tree-repeat-reactivity.test.tsx`). Значит дело не в том, КОГДА
          `apps/skin` монтирует показ.

          Найдено фактическим наблюдением (не полным диагнозом — до конца механизм не вскрыт, см.
          файл теста): переход 0 items → N items ПОСЛЕ монтирования у `radio-group` (`item` —
          прямой потомок `root`) отрабатывает корректно. У `select` (`item` — потомок `content`,
          который сам внутри `positioner`, открытого сразу через `rootProps.open`) — НЕТ: `content`
          есть в DOM (портал в `document.body`, `data-state="open"` честный), но `item`-узлов внутри
          ноль, сколько `data` потом ни меняй. Рост УЖЕ НЕПУСТОГО списка (1→2) у `select` при этом
          работает — ломается конкретно переход 0→N, не repeat вообще (тест зафиксирован как
          `it.fails`, известный баг движка, а не `apps/skin`).

          Подозрение (НЕ доказано — читать/трогать `web-core/assembly` не в периметре этой роли):
          `RenderNode`'s `contentOf()` (`web-core/assembly/src/render/index.tsx`) — кэш детей узла
          строится один раз на инстанс компонента, и пустая ветка (`current.children.length === 0`
          на первом чтении) кладёт в кэш голый `null`, а не реактивный `<For>` — только `<For>` мог
          бы потом подхватить детей, добавленных `repeat`'ом. НЕ объясняет, почему `radio-group` не
          ломается тем же путём при том же переходе 0→N — открытый вопрос, отдельного взгляда
          заслуживает именно тот, кто владеет `web-core/assembly`.

          ПОЧИНЕНО (owner web-core/assembly, 2026-09-10, `4b5ce9a`+`d496e96`): подозрение
          подтвердилось, но точнее — критерий был не `children.length === 0` вообще, а СНИМОК
          `children.length` на момент первого чтения (кэш `contentCache.memo` ленивый синглтон,
          решение null-vs-`<For>` больше не пересчитывается). Почему `radio-group` не ломался тем
          же путём — оказалось случайностью момента монтирования (`root`, прямой родитель `item`,
          чаще успевает получить детей до первого чтения `props.children`, чем `select`'s `content`
          внутри `positioner`/`Portal`), не структурным отличием — старая проверка была уязвима к
          ЛЮБОМУ порядку монтирования. Критерий заменён на `takesContent(registry, type)` —
          структурное свойство адреса из реестра, не значение на момент первого чтения. Полный
          разбор — `web-core/assembly/ROADMAP.yaml`'s `content-of-null-vs-for-by-structure`,
          `web-core/assembly/FAQ.md`.
          Ревью architect (2026-09-10): `pnpm --filter @web-core/assembly test` — 20/20 зелёных
          (включая новый `test/contentof-null-vs-for.test.tsx`, голый реестр без кита, доказывает
          и починку, и то, что закрытые по реестру части — `trigger` и т.п. — как получали `null`,
          так и получают); `pnpm --filter @web-core/assembly build`+`lint` — сборка чистая, линт
          зелёный (один pre-existing `solid/reactivity` на строке 195 — сверен по `eslint` ДО
          этого фикса тем же правилом, эта правка его не касается и не вносит).
          ХВОСТ, НЕ ЗАКРЫТ: `apps/skin/test/render-tree-repeat-reactivity.test.tsx`'s select-кейс
          (строка 91) всё ещё обёрнут в `it.fails(...)` — сам файл предупреждал об этом («тест
          покраснеет, если баг вдруг пропадёт — сигнал обновить тест на `expect`»), и это ровно
          сейчас произошло: `pnpm --filter @web-core/skin-app exec vitest run
          test/render-tree-repeat-reactivity.test.tsx` красный (`Error: Expect test to fail`, тело
          теста реально проходит). Файл untracked, зона apps/skin — не трогаю сам, нужен один
          владелец на снятие `it.fails` → `it`/`expect`.

  - category: Слот показа
    items:
      - id: slot-loader-around-renderer
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Лоадер на время загрузки компонента — РОВНО вокруг Renderer, не вокруг слота"
        description: |
          Означает: `entities/showcase/ui/slot/loader.tsx` (`Loader`) подменяет ТОЛЬКО показываемое
          внутри `CarouselItem`; контрол сборок, тег, карусель со стрелками и индикаторами и её
          размер (`slotSizeOf`) остаются на экране — слот не схлопывается и не мигает. Признак
          ожидания слот сам не вычисляет: новый проп `loading?: boolean`, значение даёт вызывающий
          (`pages/showcase` — `componentHandle().loading()`), слот в стор не ходит.

          Источник признака — новый `loading()` в `ComponentHandle`
          (`entities/component/model/handle.ts`): `componentInfoAtom` в статусе `pending`. Это НЕ
          противоположность `ready()`: `createResourceAtom` держит последнее известное `data` и в
          `pending`, поэтому на смене компонента `ready()` остаётся true (info есть), но info это
          от ПРЕДЫДУЩЕГО компонента — показывать по нему нельзя. Отсюда отдельный флаг, а не
          `!ready()`.

          Своей графики у лоадера нет намеренно (решение user 2026-08-27, записано в `index.html`):
          витрина собрана из компонентов кита, одетых показываемым нарядом, а крутящегося спиннера
          в ките нет — ожидание сказано словом (`Typography` внутри `Flow`, центровка через
          `layoutGroup`/`layoutSelf` из `@web-core/skin`). Захочется вращающийся индикатор —
          это компонент КИТА (`web-core/ui`), то есть чужая зона и отдельная заявка, а не своя
          анимация в витрине.

          Проверено живьём (dev-сервер + MCP-браузер, троттлинг "Slow 3G"): переключение
          button → table — "Загрузка…" стоит в области показа, контрол/карусель/размер на месте;
          после приезда info лоадер уходит, показ рисуется как прежде.

          Не покрыто (осознанно): ПЕРВЫЙ заход на компонент — `pages/showcase` рисует слоты
          `<For each={tagGroups()}>`, до приезда info список тегов пуст, слотов нет вовсе и
          показывать лоадер негде; это ожидание уровня СТРАНИЦЫ, а лоадер по ТЗ — только вокруг
          `Renderer`. Данные показа (`componentDataAtom`, сохранённый content) едут отдельно от
          info и этим флагом не покрыты — компонент, чей content ещё не выбран, лоадера не
          показывает.

  - category: Чат
    items:
      - id: chat-ui-split
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "entities/chat/ui/chat — разбит на control/ и content/"
        description: |
          Означает: `control/index.tsx` — форма (инпут+кнопка отправки, весь стейт `text`/
          `onSubmit`); `content/item.tsx` — одно сообщение (аватар+бабл, свой/чужой); `content/
          container.tsx` — скролл-область и `For` по `messages()`. `chat/index.tsx` — тонкая
          сборка `ChatContent`+`ChatControl` внутри `Flow`, без своей логики. По ходу (решение
          user): имя автора и время сообщения убраны из `ChatItem` — остался только текст и
          аватар для выравнивания.

      - id: chat-real-backend
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Чат шлёт сообщения в реальную сессию агента, не в локальный мок"
        description: |
          Означает: новый `entities/chat/model/api.ts`'s `sendChatMessage(text)` —
          `POST {VITE_CHAT_URL}/sessions/{component}/messages` (дефолт URL —
          `https://150.251.145.87/api`), `Authorization: Bearer {VITE_CHAT_TOKEN}` (билд-тайм env,
          общий на всю витрину), `X-User-Login: {currentUser()}` (`entities/user`), тело
          `{text, context: {component}}`. Session id = имя ТЕКУЩЕГО компонента
          (`currentComponent`, `entities/component`) — по словам user, у агента чат хранится
          per-session, и сессия должна быть в рамках компонента; нет выбранного компонента → явный
          отказ, не запрос в никуда. Ответ — один синхронный JSON (`event: "run-finished"`), без
          стрима/поллинга.

          `store.ts`'s `sendMessage` пишет сообщение юзера в историю сразу (оптимистично), потом
          ждёт ответ и дописывает `reply` (или `refusal`, если он есть — тоже полноценный ответ
          агента, тем же путём). Сетевая ошибка/отказ службы тоже оседает в чат текстом, не
          проглатывается. Новый сигнал `pending` — `ChatControl` дизейблит форму на время запроса
          (сессия синхронная, второе сообщение до ответа на первое не имеет смысла). Моковая
          затравка (`MOCK_MESSAGES`, три сообщения "Ева"/"Архитектор") убрана — история теперь
          только из реальной переписки.

          Сознательно не сделано (не было источника во фронте на момент разговора): `variant`/
          `outfit` в `context` — их пока нигде не выбирают, context несёт только `component`;
          загрузка истории чата при заходе на компонент — эндпоинт на это не называли, `messages`
          стартует пустым; рендер `did` (списка вызовов MCP-тулов из ответа) — в UI сейчас виден
          только `reply`/`refusal`, `did` из ответа не читается вовсе.

          ЗАМЕНЕНО пунктом `chat-session-lifecycle` (ТЗ бокса, 2026-09-09): session id больше не имя
          компонента, а выданный боксом идентификатор, и ответ приходит не телом POST, а событием
          потока.

      - id: chat-session-lifecycle
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Сессия агента заводится на входе юзера и лежит в сторе рядом с логином"
        description: |
          Означает: сессию заводит НЕ чат и не первое сообщение, а вход юзера. `login()`
          (`entities/user/model/store.ts`) пишет логин и тут же зовёт `POST /sessions`
          (`{recipe, passport, agent, title}`, `title` — логин: компонента в этот момент ещё нет);
          выданный боксом id ложится рядом с логином — сигнал `currentSession` и localStorage-ключ
          `session` рядом с `user`. Оба живут одной жизнью: сессия видна только своему логину (чужая
          отвечает 404, как несуществующая), поэтому `logout()` чистит и то, и другое.

          Кому нужен id или логин — берёт их из стора юзера (`currentSession()`/`currentUser()`),
          из любого места. Чат ничего не хранит: подставляет их в каждый запрос и всё. Единственное
          исключение — бокс ответил 404 (сессии больше нет): чат просит стор завести новую
          (`renewSession()`) и повторяет ход ОДИН раз, чтобы обрыв на стороне бокса не съедал
          сообщение юзера.

          Транспорт к боксу переехал в `shared/api/box` — адрес, токен, заголовки, `createSession`.
          Он общий для двух сущностей (`entities/user` заводит сессию, `entities/chat` в неё пишет),
          и лежит в shared именно поэтому: иначе одна сущность импортировала бы другую ради адреса.

          `POST /sessions/{id}/messages` отдаёт 202 и КВИТАНЦИЮ (`run.id`), а не ответ агента —
          агент думает от 20 секунд до минут, столько соединение не живёт. Ответ забирается из
          `GET /sessions/{id}/events` (SSE с заголовками, поэтому браузерный `EventSource` не
          годится — обычный `fetch` с чтением тела потоком). Поток открывается ДО POST, чтобы не
          упустить конец быстрого прогона, и ждёт `run-finished` ИМЕННО своего `run` — чужие события
          сессии пропускаются. Оборвался поток — прогон от этого не останавливается: дочитывание
          идёт через `GET /runs` (состояние), `GET /messages` (реплика с `author: "agent"` и нашим
          `run_id`) и `GET /runs/{run}/steps` (наблюдённые вызовы ручек). Имя компонента едет в
          `context` сообщения — бокс его не разбирает и передаёт агенту как данные.

          Заголовки `Authorization: Bearer` и `X-User-Login` — на КАЖДОМ запросе, без любого из двух
          бокс отвечает 401; поэтому не залогинен → запроса нет вовсе, а не 401 от бокса. Логин
          кириллицей едет процентно закодированным: HTTP-заголовок — байты (ISO-8859-1), и такой
          логин роняет сам `fetch` ещё до сети (поймано тестом `test/chat-session.test.ts`).
          Потолок ожидания прогона — 10 минут: без него оборванный на той стороне прогон держал бы
          форму задизейбленной вечно. Бокс недоступен в момент входа — юзер всё равно вошёл (витрина
          живёт и без чата), ошибка видна тостом, сессия заведётся при первом сообщении.

          Имена рецепта/паспорта/агента — env (`VITE_CHAT_RECIPE`/`VITE_CHAT_PASSPORT`/
          `VITE_CHAT_AGENT`, дефолты `сборка-скинов`/`опус-5`/`claude-code`): бокс на неизвестное имя
          отвечает 400 с текстом, актуальные списки — `GET /api/catalog/recipes`,
          `/api/catalog/passports`, `/api/agents`.

  - category: Embed-маршруты
    items:
      - id: embed-routes-for-agent-playground
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Embed-маршруты — изолированный playground для агента, не живая витрина юзера"
        description: |
          Цепь: `apps/skin/.mcp` (MCP-сервер) уже даёт внешнему агенту headless-браузер со своей
          вкладкой на сессию (`browser_navigate`/`browser_snapshot`/`browser_click`/
          `browser_screenshot`) — изоляция ПРОЦЕССА/вкладки решена. Но `browser_navigate` ходил на
          живые маршруты витрины (`/showcase/...`), а там хедер/чат/сайдбар и прочий UI, не
          относящийся к делу. Кейс "агент работает со сборками" — по словам user, "не частый кейс,
          но не одноразовый" — этому шум прямо мешал.

          User дословно: "я не хочу чтобы агент читал саму витрину, в которой работает юзер, так
          как там много шума. поэтому нам для скина нужно поднять свой [плейграунд]. или как
          вариант сделать отдельные маршруты embed что бы агент мог брать изолированно".

          Решение (обсуждено и принято) — ВТОРОЙ вариант, не отдельное приложение:
          - Отдельный процесс/приложение дублировал бы рендер-механику, которая уже есть и работает
            в этой витрине (`Renderer`/`instanceOf`, подключение скина, `componentDataAtom`) — риск
            разъехаться с оригиналом, лишняя инфраструктура на поддержку.
          - Изоляция ПРОЦЕССА не нужна повторно — она уже дана MCP-браузером (своя вкладка на
            сессию, агент физически не пересекается с вкладкой живого юзера). Нужна изоляция
            DOM/визуального шума, не вторая инфраструктура — для этого достаточно маршрута БЕЗ
            хрома приложения в ТОМ ЖЕ бандле.
          - Тот же приём у Storybook (canvas в отдельном iframe того же приложения, не второй
            сервер) и Ladle/Histoire.

          Сделано: новый маршрут `/embed/$component/$assembly` (`routes/embed.$component.$assembly.tsx`
          + `pages/embed/index.tsx`) рендерит ТОЛЬКО `<Renderer>` — без `Header`/чата/сайдбара.
          Чтобы дать ему путь мимо хрома, хром (`WorkspaceLayout`) переехал из `__root.tsx` в
          отдельный pathless layout `_workspace.tsx` (`createFileRoute("/_workspace")`) — все
          прежние маршруты (`/`, `/lab`, `/playground`, `/showcase/...`) стали его детьми
          (файлы переименованы с префиксом `_workspace.`, URL не изменились), `/embed/...` остался
          сиротой прямо под корнем и хром не наследует. Источник данных — `?content=<name>` (новая
          `getContentByName` в `entities/component/model/content.ts`, читает ту же службу пресетов,
          что и `get_content` в `apps/skin/.mcp`), без параметра или если имя не найдено —
          существующий fallback (`generateFakeData`). Проверено вручную (dev-сервер + MCP-браузер):
          `/embed/button/base` — фейковые данные; `/embed/button/base?content=button-save` —
          сохранённый content; `/showcase/button` — хром не сломан.

          Дальше по цепи (не в этом файле): `apps/skin/.mcp`'s `browser_navigate`/доки (`docs/*.md`)
          должны научиться указывать на `/embed/...` для кейса сборок вместо `/showcase/...` — это
          отдельный, более мелкий заход со стороны MCP.
      - id: input-widget-real-ui
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Input — редактирование отдельных полей данных, не только выбор целого набора
        description: |
          Означает: выбор ГОТОВОГО набора данных (сохранённый content, дефолт на пункт 0) уже
          сделан — см. `input-content-select`. Не сделано было — редактирование ОТДЕЛЬНЫХ полей
          выбранного набора (форма по io-схеме компонента, поле за полем); единица изменения была
          весь набор целиком, точечная правка одного поля была невозможна без ухода в службу
          пресетов напрямую.

          ПЕРВЫЙ ЗАХОД (согласовано с user 2026-09-09 до кода): скаляры (string/number/boolean/
          enum строк) io-схемы — верхний уровень и ОДИН уровень вложенных объектов; массивы и
          более глубокая вложенность НЕ рендерятся вовсе (движок под них — отдельное ТЗ,
          `input-nested-fields-engine` ниже).

          Сделано: `widgets/component/input/schema.ts` — `fieldsOf(schema)` через `z.toJSONSchema`
          (официальный экспорт zod 4, не обход `_def`-внутренностей — та же форма, что библиотека
          поддерживает как контракт) с `unrepresentable: "any"` (схема компонента — внешняя
          граница, не всё представимо JSON Schema, например `z.unknown()`, это законный случай, не
          авария); `valueAt`/`withValue` — чтение/иммутабельная запись по пути глубиной 1–2 (свои,
          не `assign`/`lookup` из `@web-core/io` — та функция МУТИРУЕТ, для сигналов Solid нужна
          новая ссылка на каждом уровне). `widgets/component/input/fields.tsx` — `DataFields`,
          контрол на `kind` (`BooleanField`/`Checkbox`, `EnumField`/`Select`, `ScalarField`/
          `FieldInput` text-или-number) через `Switch`/`Match`, не if/early-return (Solid-компонент
          выполняется один раз — `solid/components-return-once` поймал первую версию на ревью
          линтом). `ComponentHandle` (`entities/component/model/handle.ts`) получил `data(): unknown`
          — геттер поверх `componentDataAtom` (`useAtom`, тот же приём, что `info`/`loading`) —
          раньше был только `setData`, а точечной правке нужно читать ТЕКУЩЕЕ значение, чтобы
          класть новое поверх него, не поверх записи из `records`.

          Проверено живьём (свой dev-сервер 5175, `PRESETS_URL` переопределён на локальный GraphQL-
          бэк — деталь окружения этой сессии, не постоянная правка): `/showcase/button` — под
          селектом наборов появились `label`/`data-variant` (текстовые), `payload: z.unknown()`
          корректно не отрисован. Boolean/enum-ветки и вложенный уровень — код проверен изолированно
          (`z.toJSONSchema` на тестовых схемах вручную, TypeScript+ESLint чисто), НЕ кликом в
          браузере: ни один компонент в ките сегодня не использует `z.boolean()`/`z.enum()` в
          io-схеме (`grep` по всем `entity/io.ts` — пусто), протестировать эти ветки живым
          компонентом не на чем.

          НАХОДКА ПО ХОДУ (инфраструктура, не код этой зоны): удалённый бэк по умолчанию
          (`PRESETS_URL=https://150.251.145.87:9787` в корневом `.env`) отвечает на `/graphql`
          404-ошибкой СТАРОГО REST-формата (`{"error":"not_found","message":"Такого пресета нет."}`)
          — это НЕ новый Go+GraphQL бэк из `backend/presets` (тот на 404 отвечает GraphQL-конвертом
          `{"errors":[...],"data":null}`, проверено на локальном инстансе). Разбор `/api/presets`
          на том же хосте отвечает как раньше (REST жив, 49 записей) — деплой на этом хосте не
          обновлён до переезда на GraphQL, хотя код в репозитории уже полностью на GraphQL
          (`shared-api-presets-single-endpoint` и раньше). Значит ЛЮБОЙ потребитель с адресом по
          умолчанию (не только apps/skin) сегодня не может читать пресеты вовсе. Не чинил (не моя
          зона — деплой/инфра), нужно решение user/architect.

      - id: input-nested-fields-engine
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Input — движок для вложенности: массивы и глубина >1 в io-схеме"
        description: |
          Заведено по ходу `input-widget-real-ui` (2026-09-09, ТЗ user): первый заход того пункта
          намеренно закрывает только скаляры верхнего уровня и одного уровня вложенных объектов —
          массивы и вложенность глубже одного уровня не рендерятся вовсе (`schema.ts`'s `fieldsOf`
          их пропускает молча).

          УТОЧНЕНИЕ (2026-09-09, после `unified-item-collection-engine` в `web-core/ui/ROADMAP.yaml`):
          пример был устаревшим уже в момент написания — `accordion`'s `sections[].items[]` больше
          не существует, весь кит переведён на ОДИН канонический рекурсивный `item`
          (`shared/data/fields.ts`, `{value, label, children?: item[]}`). Это меняет объём задачи в
          выгодную сторону: движок редактирования массива нужен НЕ по одной реализации на каждый
          компонент (`accordion`/`tabs`/`listbox`/`select`/`tree-view`/`menu`/`radio-group`), а ОДИН
          рекурсивный редактор `item[]` — плоские компоненты просто не показывают контрол
          "добавить вложенный элемент" для листовых узлов (или показывают, если `children`
          разрешён и там, где до сих пор не запрещался явно).

          Полноценный редактор массива — это не «ещё один `kind`» в существующем списке: нужно
          добавлять/убирать элементы, у каждого элемента — своя вложенная форма (та же `fieldsOf`,
          рекурсивно по `children`), значит другая архитектура компонента (список форм, не строка
          полей), не расширение `DataField`'а. Компоненты кита СВЕРХ канона (`tabs`'s `content`,
          `accordion`'s `activeValues`) — та же рекурсивная форма `fieldsOf` для полей ОДНОГО
          элемента массива, отдельная задача не нужна, это уже покрыто `input-widget-real-ui` на
          уровне одного элемента — новое здесь только сам список (add/remove) и рекурсия в
          `children`.

          ОБЪЁМ (согласовано с user 2026-09-09): реордер элементов — ОТДЕЛЬНЫЙ заход, в этот не
          входит. Первая версия — add/remove + рекурсия, порядок элементов фиксирован (как ввели/
          как пришли в data).

          Сделано: `schema.ts`'s `fieldsOf`/`fieldsOfNode` теперь узнают поле-массив ОБЪЕКТОВ
          (`prop.type === "array" && item.type === "object"`) как `kind: "list"` с `element:
          {root, node}` — узел элемента ПЛЮС корень JSON Schema документа, нужен для разрешения
          `$ref` (канонический `item` рекурсивен через `z.lazy`, `children` в JSON Schema — это
          `$ref` на тот же `$defs`-узел, не отдельная копия). Новый `resolve(root, prop)` — единая
          точка разыменования `$ref`, зовётся и на скалярах, и на `items`, и внутри `blankValue`.
          `fieldsOfElement(element)` — те же поля, что дал бы `fieldsOf`, только для узла ОДНОГО
          элемента (реэкспорт `fieldsOfNode` под именем для внешнего употребления, сырые JSON-
          Schema типы (`JsonProp`/`JsonRoot`) наружу схемы не текут). `blankElement(element)` —
          новый элемент по умолчанию (`""`/`0`/`false`/`[]`/первый вариант enum по типу поля,
          рекурсивно по вложенным объектам) — то, что кладёт кнопка "Добавить".

          `withValue`/`valueAt` НЕ трогал — путь в них никогда не проходит ЧЕРЕЗ индекс массива
          (см. обновлённый докблок `FieldPath`): `list`-поле меняется ЦЕЛИКОМ (весь массив разом),
          точечная правка ОДНОГО элемента списка бьётся из `ListField` вручную (`.map`/`.filter` по
          индексу из `<For>`), не путём `withValue`. Опасались было спреда `{...array}` (превратил
          бы массив в объект с числовыми ключами) — оказалось не нужно вовсе при таком разделении
          ответственности, ничего в существующей, уже протестированной логике менять не пришлось.

          `fields.tsx`'s новый `ListField` — рекурсивен С `DataFields` (не сам с собой): список
          карточек-элементов, каждая карточка — вложенная `DataFields` для полей ЭТОГО элемента
          (если у элемента есть свой `list`-field типа `children` — внутри окажется свой
          `ListField`, глубина реальных данных решает, не глубина схемы, та рекурсивна всегда).
          "Удалить" на каждой карточке, "Добавить" — снизу списка.

          Проверено живьём (свой dev-сервер 5175, боевой удалённый GraphQL-бэк без переопределений
          — `witrina-remote-graphql-live` уже подключил): `/showcase/tree-view`
          (`items: Item[]`, канонический `item`, реальный компонент кита, не тестовая заглушка) —
          "Добавить" породил карточку `value`/`label`/`children`, "Добавить" внутри `children`
          породил ВТОРОЙ уровень (свои `value`/`label`/`children`), "Удалить" на втором уровне
          корректно убрал только его, первый уровень и общий "Добавить" внизу остались на месте.
          Рекурсия неограниченной глубины подтверждена кликом, не только юнит-тестом.

          Плюс юнит-тест на чистую логику (`test/input-fields-schema.test.ts`, 7 тестов) —
          `fieldsOf` находит `list`-поле и не путает с примитивным массивом (`tags: string[]` не
          рендерится никак), `fieldsOfElement` даёт скаляры элемента И его `children` снова
          `list`, рекурсия не обрывается на втором уровне, `blankElement` даёт верные умолчания
          (включая пустой `children: []`), `withValue`/`valueAt` не задевают форму массива.

      - id: lab-page-purpose
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: "/lab — назначение решено, райтбар разведён по маршруту"
        description: |
          Было: маршрут жив ("Лаборатория (мок)"), что там будет показано — не решено.

          РЕШЕНО (user, 2026-09-09): разделение по смыслу двух экранов, не по техническому наполнению.

          `/showcase` остаётся ВИТРИНОЙ — выставочный интерактив по готовым сборкам/вариантам, без
          чата. Сайдбар — простые настройки: переключить готовый вариант, задать текст лейбла и
          подобное точечное. Ничего не создаётся, только переключается между уже существующим.

          `/lab` — страница СОЗДАНИЯ компонента: чат с агентом ЖИВЁТ здесь (не в витрине), гибкие
          настройки в ДВА уровня — быстрые (border/padding/размер и т.п., частые точечные правки) и
          глубокие (когда нужно "сильно поковыряться", полный охват). Интерфейс создания ДАННЫХ
          (не только вида) тоже сюда, но ОТДЕЛЬНЫМ заходом позже — сначала разобраться с самой
          витриной и отрисовкой данных (`input-widget-real-ui`/`input-nested-fields-engine`).

          Сделано (2026-09-10, ТЗ user): новый `widgets/rightbar` (`showcase.tsx`/`lab.tsx`,
          `RightbarShowcase`/`RightbarLab`) — `RightbarShowcase` несёт `Info`+`Input` (поля данных,
          без чата), `RightbarLab` несёт `Info`+`Chat` (чат, без полей). `WorkspaceRightbar` —
          позиционный слот `Workspace` (CSS grid-area самого компонента, не портал/контекст) —
          недостижим из `<Outlet/>` (`pages/showcase`/`pages/lab` рендерятся ВНУТРИ
          `WorkspaceMain`, соседний слот), значит выбор варианта решается в `WorkspaceLayout`
          (`pages/index.tsx`) через `useLocation().pathname.startsWith("/lab")`, не в самих
          страницах. Проверено живьём: `/showcase/button` — поля есть, чата нет; `/lab` — чат есть,
          полей нет.

          Не решено (следующий заход, не сейчас, заведено `lab-settings-levels`): точный список
          "быстрых" настроек и граница быстрые/глубокие внутри `/lab`.


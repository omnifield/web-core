  - id: content-graphql-migration-session-cache
    type: plan
    date: 2026-09-09
    summary: >
      Второй шаг GraphQL-цепочки (`content-graphql-migration`). Текст ТЗ описывал переезд
      `content.ts` с REST-клиента на прямой `graphqlRequest` — сверка с кодом ДО реализации
      показала, что транспорт уже GraphQL (`packages/skin`'s `createPresetsClient` мигрировал
      раньше, коммит `4f359e6`), реальный пробел — кэш на сессию, которого не было вовсе. Решение
      согласовано с user: обернуть существующие `presets.list`/`presets.get` в
      `queryClient.fetchQuery({staleTime: Infinity})`, не дублировать GraphQL-запрос/конверсию,
      уже готовые в `client.ts`.

      Заведён `#/shared/api/query-client` — единственный `QueryClient` на приложение, вынесенный
      из `app/index.tsx` наружу: нужен вне Solid-дерева (`content.ts` — обычные async-функции, не
      компонент; `useQueryClient()` там не работает), и понадобится тем же способом
      `chat-did-cache-invalidation`. `listContentFor` кэширован ключом `["content", "list"]`,
      `getContentByName` — отдельным `["content", "get", name]` (буквально по ТЗ — обёрнуты оба
      вызова, не только список).

      Найдено и почитано по ходу (не в тексте ТЗ, техническая необходимость библиотеки): query-core
      не принимает `undefined` из `queryFn` (зарезервировано под «данных ещё нет») — `getContentByName`
      кэширует `null` вместо `undefined` на случай ненайденного имени (законный исход, не ошибка) и
      разворачивает обратно перед возвратом вызывающему.


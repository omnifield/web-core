# harness.yaml — данные роль-модели продукта: КТО чем владеет и на какой модели работает.
#
# Живёт рядом с обвесом, который его читает (`.claude/hooks/harness-config.mjs`). Прежний дом
# снят вместе с baser: та папка принадлежала станку, которого больше не существует, и держать
# в ней живой файл значило бы поминать покойника при каждой правке.
#
# Здесь ТОЛЬКО две вещи: зоны (границы правки) и пины моделей. Ни адресов служб, ни ключей
# трекера — тем, чего нет, обвес больше не распоряжается.
apiVersion: web-core.dev/v1
kind: harness

product: web-core

# Число архитекторов (main-сессий).
architects: 1

# Пины моделей по роли. Берём АЛИАСЫ, а не снапшоты с датой: алиас едет за выпусками сам,
# снапшот замораживает сессии на конкретной сборке и требует ручной правки в каждом репозитории.
models:
  architect: claude-opus-5
  owner: claude-opus-5
  layer: claude-haiku-4-5

# ЗОНЫ: scope (leaf-имя) → paths[] + назначение. owner-<zone> правит только свои папки —
# границу держит машина (`.claude/hooks/governance.mjs`), а не договорённость.
#
# Пути РАЗНЫХ зон не пересекаются: одна папка — один владелец.
#
# ЧЕГО ЗДЕСЬ НЕТ — то ведёт архитектор сам: корневые конфиги, `apps/`, `tools/`, `.claude/`,
# `.devcontainer/`. Это не пробел, а правило: у оснастки и гейта цепочки нет отдельного
# владельца, и заводить его ради строчки в файле незачем. Раньше `apps/reference` стоял зоной
# без овнера — и на этом я один раз поставил задачу несуществующему адресату.
zones:
  style:
    paths: [web-core/style]
    description: "набор значений оформления — шкалы, размерности, роли. Здесь же стоял `web-core/style-tools` (инструменты стилизации, выделявшиеся из `style` разрезом): папки на диске нет, и путь снят 2026-09-18 — boundary на несуществующую папку не защищает ничего, но выглядит как защита. Разрез возобновится — путь вернуть вместе с папкой."
  ui:
    paths: [web-core/ui]
    description: примитивы на Ark/Zag — 1-to-1 DOM, ноль стилей по умолчанию, паспорт компонента
  router:
    paths: [web-core/router]
    description: "пакет для роутинга"
  assembly:
    paths: [web-core/assembly]
    description: "механика сборки — дерево узлов, реестр из паспортов, правки дерева, проверка вложенности, отрисовка по данным. Средство, а не решение: своего вида не приносит."
  store:
    paths: [web-core/store]
    description: оснастка сборки — подпути /vite, /tsconfig, /vitest
  build:
    paths: [web-core/build]
    description: оснастка сборки — подпути /vite, /tsconfig, /vitest
  lint:
    paths: [web-core/lint]
    description: "машинный контроль кода: Solid-канон (eslint-plugin-solid) сегодня, кодстиль/импорты (Biome) — в работе"
  mcp:
    paths: [web-core/mcp]
    description: "тонкий переиспользуемый MCP-сервер  — каркас, которым ЛЮБОЙ продукт на фреймворке подключает агента: фреймворк отдаёт готовые интроспекционные инструменты (паспорта кита, пресеты), продукт добавляет свои поверх одним вызовом. Не про одного конкретного агента  — про общий протокол подключения."
  generators:
    paths: [web-core/generators]
    description: ""
  query:
    paths: [web-core/query]
    description: "универсальны пакет для запросов для  rest и graphQl"
  io:
    paths: [web-core/io]
    description: "универсальный вход/выход данных — паспорт формы компонента (`entity/io.ts` читает отсюда `z`) и слоистый движок переходников (L0 тождество / L1 переименование ключей / L2 правила полей и мутация значений / L3 форма целиком с повторами, открыт). Средство, а не решение: не знает ни про скин, ни про конкретный компонент — `web-core/io` не импортирует `web-core/skin` и не будет (решено user, 2026-08-29)."
  form:
    paths: [web-core/form]
    description: "проекция дерево×io-схема→валидность (@web-core/assembly+@web-core/io) — вторая нога механики assembly (та — дерево→рендер, эта — дерево→валидатор), не форма из инпутов. Не рендерит, не владеет состоянием (@tanstack/solid-form отклонён и снесён). Ось валидации на useKitLife — cross-zone в web-core/ui, паспорт (web-core/skin) не тронут. Заведён 2026-09-12, роль пересмотрена тем же днём. См. web-core/form/ROADMAP.yaml."
  solid:
    paths: [web-core/solid, canons/solidJS]
    description: "движок связки с Solid (`@web-core/solid`, 🏷️ framework). Зона заведена 2026-09-18: папка с полной тройкой доков жила без владельца, то есть поднять owner-сессию в неё было нельзя вовсе. Рыночный канон по Solid (`canons/solidJS`) отдан сюда же — он про эту же тему."
  trace:
    paths: [web-core/trace]
    description: "движок perf-трейсов (`@web-core/trace`, 🏷️ diagnostics) — ядро без фреймворка плюс необязательный Solid-плагин. Зона заведена 2026-09-18: папка была без владельца."
  neurobox:
    paths: [web-core/neurobox]
    description: "клиент для бокса нейробокс (менеджер рантаймов агентов, протокол AG-UI — см. корневой NEUROBOX_CLIENT.md) поверх @tanstack/ai-client/@tanstack/ai-solid. Заведён 2026-09-13, детали user обсудил с владельцем напрямую. См. web-core/neurobox/ROADMAP.yaml."
  feeder:
    paths: [interfaces/feeder]
    description: "первая сущность нового корня interfaces/ (между web-core/ и apps/): сводит @web-core/generators+@web-core/io в переиспользуемый UI настройки/загрузки данных для больше чем одного приложения. Заведён 2026-09-14 (фундамент — architect напрямую, зоны без овнера ещё не было); три задуманных режима (зод-схема→дерево, ручки по шаблону версии, файл) не реализованы. См. interfaces/feeder/{README,FAQ}.md и ROADMAP.yaml."
  chat:
    paths: [interfaces/chat, canons/chat]
    description: "второй кейс корня interfaces/ — назначение не определено, разбирает user с owner-сессией напрямую. Заведён 2026-09-14 (фундамент по тому же приёму, что feeder — architect напрямую). См. interfaces/chat/{README,FAQ}.md и ROADMAP.yaml."
  # Зоны products/ стоят здесь ВРЕМЕННО и уедут отдельными продуктами. В web-core/ им нельзя:
  # там база.
  tables:
    paths: [canons/filter-tables-graphs]
    description: "таблицы, headless как и кит; фильтры — модуль внутри со своей границей. Кода ещё нет (`products/tables` не заведён, путь снят 2026-09-18) — зона держит пока только свой канон."
  studio:
    paths: [canons/studio]
    description: "витрина первой волны — что умеет производство. `products/studio` не заведён, путь снят 2026-09-18."
  presets:
    paths: [backend/presets]
    description: хранилище пресетов — кладёт и отдаёт JSON, формата фильтра НЕ понимает
  map:
    paths: [canons/map, canons/solid-map]
    description: "карта — 3D-рельеф и города на MapLibre, тайлы файлом без сервера. `products/map` не заведён, путь снят 2026-09-18; канон карты на Solid (`canons/solid-map`) отдан сюда же."
  studio-app:
    paths: [apps/studio]
    description: "приложение для просмотра и создания компонентов и композиций из них. Единственный владелец папки (решение user 2026-09-18: раньше `apps/studio` держали три зоны сразу — assembly, store, skin-app, — границы между ними не было). Вложенный `.mcp/` — чужая зона studio-mcp."
  studio-mcp:
    paths: [apps/studio/.mcp]
    description: "MCP-сервер студии — тулы для агента поверх @web-core/mcp (было skin-mcp). Папка вложена в зону studio-app, владелец у неё свой: более специфичный путь выигрывает. Канон оформления (`canons/ui-skin`) остался зоне skin — делить его напополам значило бы вернуть то пересечение, из-за которого зоны и разводили."
  skin:
    paths: [canons/ui-skin, web-core/skin]
    description: "производство оформлений для безголового кита — своя логика, кит остаётся голым. У продукта СВОЙ архитектор: заявки сюда приходят от него, а не ставятся ему."
  reference:
    paths: [apps/reference]
    description: "эталонное приложение — гейт сборки цепочки зон: его работа падать, когда сломан шов между зонами. Приватное, в реестр не едет. Зона заведена 2026-09-18: папка была без владельца."
  dashboard:
    paths: [apps/dashboard]
    description: "демо-дашборд: показывает, что собранное в студии живёт в чужом приложении — модули приезжают файлами, служба пресетов не участвует вовсе. Заведён 2026-09-22 в воркспейсе НАМЕРЕННО: пакеты берутся `workspace:*`, чтобы находки по дороге чинились без выпуска; переезд в отдельный репозиторий — следующий этап, и вместе с ним возвращается проверка установкой из реестра (в воркспейсе она невозможна по построению). Не публикуется."
  windshift:
    paths: [products/windshift]
    description: "self-hosted трекер работы, вендорится целиком отдельным Go-проектом. Тот самый трекер, которым продукт пользуется как источником истины по задачам — но это ЕГО КОД, а не служба: работа по задачам идёт через Windshift MCP. Зона заведена 2026-09-18: папка была без владельца."
  cli:
    paths: [web-core/cli]
    description: "ручки выпуска и проверок для машины: тонкий фасад поверх штатной механики pnpm (интенты → план → версии → публикация) плюс приёмка установкой вне репозитория. Заведена 2026-09-23 по решению user: девопс дёргает глагол с JSON-выходом и внятным кодом возврата, а не ковыряется в пакетах и не держит в голове, кто с кем синхронен по версии. Имя зоны шире выпуска НАМЕРЕННО — сюда же лягут другие машинные ручки, когда понадобятся. Теги и релизы здесь НЕ делаются: они на стороне рабочего репозитория."
  plugins:
    paths: [canons/plugins, canons/solid-plugins]
    description: "рыночный канон по механике плагинов — съёмный слой, который сущность не носит в себе (сбор 2026-08-15, 15 + 7 выписок). Кода под зоной пока нет, владельца у папок не было: зона заведена 2026-09-18, чтобы он появился. Какому механизму фреймворка этот канон принадлежит по существу — вопрос к user."

# Git-доступ по роли — РАМКА, выключить нельзя: architect=full; owner=commit-only (gate);
# layer=none. Право архитектора даёт маркер `.claude/.main-session-id`.
#
# `full` НЕ значит «без вопросов» (2026-08-31): чтение не гейтится ни у одной роли, но запись
# в shared `.git` (switch/checkout/merge/rebase/push/reset --hard/branch -D/worktree add/commit/
# add/gh pr write) у architect ставит форс-вопрос человеку («ask», `git-gate.mjs`), а не тихо
# проходит — маркер держит несколько параллельных/резюмнутых architect-сессий одновременно, и
# без вопроса они меняли ветки друг у друга не сговариваясь. Вопрос про смену HEAD
# (checkout/switch/merge/rebase) с 2026-09-23 несёт ЦИФРЫ: сколько коммитов уйдёт из дерева или
# приедет в него, сколько файлов сменится, сколько незакоммиченных правок лежит рядом — глагол
# без цены подтверждают не глядя, и так из дерева молча пропала работа шестнадцати коммитов. У owner та же запись — как и раньше,
# твёрдый отказ (deny), а не вопрос: owner работает в СВОЕЙ зоне, у него нет причины трогать это
# вообще, кроме коммита в своих path[].
git:
  architect: full
  owner: commit-only
  layer: none

# Воркспейс репозитория — связи между своими пакетами идут ССЫЛКОЙ, а не через реестр.
#
# Решение user 2026-08-18: пока всё живёт в одном репозитории, пакеты берут друг друга
# воркспейсом (`workspace:*`); на реестр переходим после переезда. Публикацию это не ломает —
# при `pnpm publish` протокол `workspace:*` подменяется реальной версией пакета.
#
# Почему не `file:`, которым репозиторий жил раньше. `file:` в pnpm — это СНИМОК, а не ссылка:
# пересобрал соседа, а потребитель продолжает видеть старое, пока не переустановит зависимости.
# Ловушка молчаливая (ни ошибки, ни предупреждения) и уже стоила двух заходов овнеру `skin`.
# `workspace:*` кладёт симлинк — свежесть соседа видна сразу.
#
# ⚠️ ВЛОЖЕННЫХ ВОРКСПЕЙСОВ pnpm НЕ ПОДДЕРЖИВАЕТ. До этой правки своими корнями были
# `packages/build`, `packages/lint` и `packages/ui`. Их члены и настройки собраны СЮДА —
# держать их рядом с пакетом больше нельзя, иначе они молча перестают читаться.
packages:
  - packages/*
  - products/*
  - apps/*
  - interfaces/*

  # Стенды зон `build` и `lint`. Это НЕ части своих пакетов, а отдельные проекты-потребители:
  # они подключают пакет как УСТАНОВЛЕННЫЙ (симлинк на корень), а не относительным путём в
  # исходники. Иначе тест проверял бы файлы на диске, а не то, ради чего он есть: что чужой
  # инструмент разрешает пакет по `exports` и поднимает `dist`. Смысл сохранён — сменился
  # только адрес объявления.
  - packages/build/test/fixture
  - packages/build/test/fixture-dep
  - packages/lint/test/consumer

  # MCP-сервер зоны skin (`apps/studio/.mcp`) — вложен глубже одного уровня, `apps/*`
  # его не видит. Ручки на уже готовую механику `packages/skin`, отдельный процесс, свой
  # package.json — тот же довод, что у стендов выше.
  - apps/studio/.mcp

# Выпуск пакетов — интентами (`pnpm change`), а не правкой `version` руками. Правка руками
# разъезжается молча: так `@web-core/skin` остался с требованием `style ^0.1.0`, когда стили
# уехали на `0.2.0`, — внутри репозитория это невидимо, а установка у потребителя падает.
#
# `fixed` держит ВСЕ пакеты поставки на одной версии: бампается один — бампаются все, значит
# разойтись они физически не могут. Цена принята сознательно: пакет без единой правки всё равно
# получает новый номер.
#
# Механика своя, пакетов не добавляли: `pnpm change` пишет интент в `.changeset/`, `pnpm version -r`
# собирает из них план и применяет. Формат — тот же, что у changesets. Сверено с pnpm 11.17.0,
# 2026-09-22.
#
# Группа перечислена ИМЕНАМИ, а не маской: маска `@web-core/*` проходит проверку конфига молча,
# но плана не меняет — поднимается только тот пакет, что назван интентом. Проверено прогоном
# `pnpm version -r --dry-run` 2026-09-22.
#
# Приложения и тестовые стенды в выпуске не участвуют вовсе (`ignore`): они не публикуются, версии
# у них нет по смыслу, а в плане выпуска иначе висят строками `0.0.0 → 0.0.0`. Перечислены путями
# поимённо, потому что маска каталога (`./apps/**`) молча не срабатывает — проверено прогоном
# 2026-09-22, как и маска имени в `fixed`. Завели приложение — добавили строку сюда.
versioning:
  fixed:
    - - '@web-core/assembly'
      - '@web-core/build'
      - '@web-core/chat'
      - '@web-core/feeder'
      - '@web-core/form'
      - '@web-core/generators'
      - '@web-core/io'
      - '@web-core/lint'
      - '@web-core/mcp'
      - '@web-core/neurobox'
      - '@web-core/query'
      - '@web-core/router'
      - '@web-core/skin'
      - '@web-core/solid'
      - '@web-core/store'
      - '@web-core/style'
      - '@web-core/trace'
      - '@web-core/ui'
  ignore:
    - './apps/reference'
    - './apps/studio'
    - './apps/studio/.mcp'
    - './packages/build/test/fixture'
    - './packages/build/test/fixture-dep'
    - './packages/lint/test/consumer'
  changelog:
    storage: repository

# Постинсталл-скрипты pnpm по умолчанию не пускает, а esbuild без своего бинаря не работает —
# на нём стоит сборка обеих веток поставки кита (`packages/ui/scripts/build.mjs`) и оснастка
# зоны `build`. Переехало из `packages/ui` и `packages/build`.
#
# Имя поля — действующее для pnpm 11 (`onlyBuiltDependencies` — прежнее, ещё читается; на
# `allowBuilds` указывает сам pnpm в тексте отказа). Сверено с поставленным pnpm 11.17.0,
# 2026-08-18.
allowBuilds:
  esbuild: true
  # Nx ставит свой платформенный бинарь постинсталлом — без него не запускается вовсе.
  nx: true

# Поставлено pnpm при установке в зоне `lint`: `eslint@10.8.1` вышел недавно, и политика
# minimum-release-age держала бы его в карантине. Версия нужна именно текущая — под ней
# проверяется пресет. Переехало из `packages/lint`.
minimumReleaseAgeExclude:
  - eslint@10.8.1
  - lucide-solid@1.34.0
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/query-devtools@5.102.8'
  - '@tanstack/query-persist-client-core@5.102.8'
  - '@tanstack/query-sync-storage-persister@5.102.8'
  - '@tanstack/solid-query-devtools@5.102.8'
  - '@tanstack/solid-query@5.102.8'

# Воркспейс репозитория — связи между своими пакетами идут ССЫЛКОЙ, а не через реестр.
#
# Решение user 2026-08-18: пока всё живёт в одном репозитории, пакеты берут друг друга
# воркспейсом (`workspace:*`); на реестр переходим после переезда. Публикацию это не ломает —
# при `pnpm publish` протокол `workspace:*` подменяется реальной версией пакета.
#
# Почему не `file:`, которым репозиторий жил раньше. `file:` в pnpm — это СНИМОК, а не ссылка:
# пересобрал соседа, а потребитель продолжает видеть старое, пока не переустановит зависимости.
# Ловушка молчаливая (ни ошибки, ни предупреждения) и уже стоила двух заходов овнеру `skin`.
# `workspace:*` кладёт симлинк — свежесть соседа видна сразу.
#
# ⚠️ ВЛОЖЕННЫХ ВОРКСПЕЙСОВ pnpm НЕ ПОДДЕРЖИВАЕТ. До этой правки своими корнями были
# `web-core/build`, `web-core/lint` и `web-core/ui`. Их члены и настройки собраны СЮДА —
# держать их рядом с пакетом больше нельзя, иначе они молча перестают читаться.
packages:
  - web-core/*
  - products/*
  - apps/*
  - interfaces/*

  # Стенды зон `build` и `lint`. Это НЕ части своих пакетов, а отдельные проекты-потребители:
  # они подключают пакет как УСТАНОВЛЕННЫЙ (симлинк на корень), а не относительным путём в
  # исходники. Иначе тест проверял бы файлы на диске, а не то, ради чего он есть: что чужой
  # инструмент разрешает пакет по `exports` и поднимает `dist`. Смысл сохранён — сменился
  # только адрес объявления.
  - web-core/build/test/fixture
  - web-core/build/test/fixture-dep
  - web-core/lint/test/consumer

  # Тулзы репозитория (`scripts/`) — синк во внешние репозитории и всё, что появится дальше.
  # Член воркспейса, потому что берут движок `workspace:*`; в поставку не едут.
  - scripts

  # Скрипты выпуска пакетов (`web-core/.release`) — рабочая папка скоупа, не пакет. Объявлена
  # строкой, потому что `web-core/*` скрытые папки не берёт; в поставку не едет (`private`), в
  # выпуске не участвует (`versioning.ignore` ниже).
  - web-core/.release

  # MCP-сервер зоны skin (`apps/studio/.mcp`) — вложен глубже одного уровня, `apps/*`
  # его не видит. Ручки на уже готовую механику `web-core/skin`, отдельный процесс, свой
  # package.json — тот же довод, что у стендов выше.
  - apps/studio/.mcp

  # Статборд (`statboard/`) — самостоятельный репозиторий, лежащий в корне рабочего дерева, а не
  # приложение каталога `apps/`. Строкой он здесь ровно затем, чтобы `@web-core/*` в нём
  # подставлялись живыми соседними папками, пока дерево рядом: запись в его манифесте — номер
  # версии, и у коллеги та же строка уходит в реестр, потому что этого воркспейса там нет.
  - statboard

# Соседа подставляем по ДИАПАЗОНУ версий, а не только по протоколу `workspace:`. Без этой
# настройки (дефолт pnpm — `false`) локальная папка берётся лишь там, где стоит `workspace:*`,
# а зависимость, записанная номером версии, всегда уходит в реестр.
#
# Зачем так. Каталоги этого дерева — самостоятельные репозитории, и приложение обязано собираться
# БЕЗ пакетов рядом: клонировал одно приложение — база встала из реестра. Протокол `workspace:*`
# этого не умеет в принципе: вне воркспейса он не разрешается вовсе. Номер версии умеет обе роли,
# и какая сработает — решает то, что оказалось рядом, а не запись в манифесте.
#
# ⚠️ Настройка НЕ переписывает уже зафиксированное: записи в `pnpm-lock.yaml` прилипают, и даже
# `--force` их не трогает. После её включения или после перевода манифеста на версии нужен ЧИСТЫЙ
# пересчёт (снести lockfile и поставить заново) — иначе выглядит как «не работает». Проверено
# 2026-09-23 на pnpm 11.17.0.
linkWorkspacePackages: true

# ВЫПУСК ЗДЕСЬ НЕ ОПИСАН — он принадлежит группе и живёт в её корне
# (`web-core/pnpm-workspace.yaml`, секция `versioning`), вместе с журналом интентов
# (`web-core/.changeset/`). Причина: выпускается репозиторий группы, а это дерево — рабочая
# обёртка, в которой рядом лежат приложения и стенды, к поставке отношения не имеющие.
# Второй список тех же пакетов здесь разошёлся бы с первым молча.
#
# Команды выпуска запускаются ИЗ КОРНЯ ГРУППЫ — в корневом манифесте для этого есть `release`.

# Постинсталл-скрипты pnpm по умолчанию не пускает, а esbuild без своего бинаря не работает —
# на нём стоит сборка обеих веток поставки кита (`web-core/ui/scripts/build.mjs`) и оснастка
# зоны `build`. Переехало из `web-core/ui` и `web-core/build`.
#
# Имя поля — действующее для pnpm 11 (`onlyBuiltDependencies` — прежнее, ещё читается; на
# `allowBuilds` указывает сам pnpm в тексте отказа). Сверено с поставленным pnpm 11.17.0,
# 2026-08-18.
allowBuilds:
  esbuild: true
  # Nx ставит свой платформенный бинарь постинсталлом — без него не запускается вовсе.
  nx: true

# Поставлено pnpm при установке в зоне `lint`: `eslint@10.8.1` вышел недавно, и политика
# minimum-release-age держала бы его в карантине. Версия нужна именно текущая — под ней
# проверяется пресет. Переехало из `web-core/lint`.
minimumReleaseAgeExclude:
  - eslint@10.8.1
  - lucide-solid@1.34.0
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/query-devtools@5.102.8'
  - '@tanstack/query-persist-client-core@5.102.8'
  - '@tanstack/query-sync-storage-persister@5.102.8'
  - '@tanstack/solid-query-devtools@5.102.8'
  - '@tanstack/solid-query@5.102.8'

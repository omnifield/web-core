# Корень воркспейса ЭТОЙ группы. В своём репозитории он корневой и единственный; в рабочем
# дереве разработчика, где группа лежит папкой рядом с приложениями, поверх него стоит ещё один —
# и это не конфликт: менеджер пакетов выбирает БЛИЖАЙШИЙ корень вверх от текущей папки. Команда
# из рабочего дерева видит всё дерево, команда изнутри группы — только группу. Проверено
# 2026-09-23 на pnpm 11.17.0.
#
# Состав задан МАСКОЙ, а не перечислением: второй файл с тем же списком разошёлся бы с этим молча.
packages:
  - "*"

  # Скрытые папки маска не берёт — рабочая папка выпуска объявляется строкой.
  - .release

  # Стенды зон сборки и линтера. Это НЕ части своих пакетов, а отдельные проекты-потребители:
  # они подключают пакет как УСТАНОВЛЕННЫЙ (через `exports`), а не относительным путём в
  # исходники. Иначе проба смотрела бы на файлы диска, а не на то, ради чего заведена: что чужой
  # инструмент разрешает пакет и поднимает его поставку.
  - build/test/fixture
  - build/test/fixture-dep
  - lint/test/consumer

# Выпуск — интентами (`pnpm change`), а не правкой `version` руками. Правка руками разъезжается
# молча: так скин однажды остался с требованием старой версии стилей, когда стили уже уехали
# вперёд, — внутри репозитория это невидимо, а установка у потребителя падает.
#
# `fixed` держит ВСЕ пакеты поставки на одной версии: бампается один — бампаются все, значит
# разойтись они физически не могут. Цена принята сознательно: пакет без единой правки всё равно
# получает новый номер.
#
# Группа перечислена ИМЕНАМИ, а не маской: маска проходит проверку конфига молча, но плана не
# меняет — поднимается только тот пакет, что назван интентом. Проверено прогоном 2026-09-22.
versioning:
  fixed:
    - - "@web-core/assembly"
      - "@web-core/build"
      - "@web-core/cli"
      - "@web-core/form"
      - "@web-core/generators"
      - "@web-core/io"
      - "@web-core/lint"
      - "@web-core/mcp"
      - "@web-core/neurobox"
      - "@web-core/query"
      - "@web-core/router"
      - "@web-core/skin"
      - "@web-core/solid"
      - "@web-core/store"
      - "@web-core/style"
      - "@web-core/trace"
      - "@web-core/ui"
  # Рабочая папка выпуска и тестовые стенды не публикуются: версии у них нет по смыслу, а в плане
  # они висели бы строками `0.0.0 → 0.0.0`. Маска каталога здесь молча не срабатывает — только
  # пути поимённо (проверено прогоном 2026-09-22).
  ignore:
    - "./.release"
    - "./build/test/fixture"
    - "./build/test/fixture-dep"
    - "./lint/test/consumer"
  changelog:
    storage: repository

# Постинсталл-скрипты менеджер пакетов по умолчанию не пускает, а esbuild без своего бинаря не
# работает — на нём стоит сборка обеих веток поставки кита и оснастка зоны сборки. Граф задач
# ставит свой платформенный бинарь тем же способом и без него не запускается вовсе.
allowBuilds:
  esbuild: true
  nx: true

# Версии, которым разрешено быть свежее карантина политики minimum-release-age: под ними
# проверяются пресеты и обвязка.
minimumReleaseAgeExclude:
  - eslint@10.8.1
  - lucide-solid@1.34.0
  - "@tanstack/query-core@5.102.8"
  - "@tanstack/query-devtools@5.102.8"
  - "@tanstack/query-persist-client-core@5.102.8"
  - "@tanstack/query-sync-storage-persister@5.102.8"
  - "@tanstack/solid-query-devtools@5.102.8"
  - "@tanstack/solid-query@5.102.8"

log:
  - id: family-facade-clock-fix
    type: plan
    date: 2026-09-22
    summary: >
      Заявка №3 владельца приложения-потребителя — дефект, не пожелание, и подан как дефект: с repro,
      с разбором механизма (двое часов у фасада) и с оговоркой, что виноват не новый active(),
      а сам фасад, то есть проблема старше всей нынешней работы. Проверено на своём дереве
      ПЕРЕД правкой: три пробы падают ровно тем кадром, который описан в заявке. Диагноз
      заявки принят целиком, механизм починки выбран свой, но ровно в ту сторону, куда она
      указывала ("подписка должна строиться вычислением над currentStore()"): createEffect →
      createComputed, то есть переезд ушёл в ту же фазу, в которой меняется сам ключ.
      Рассматривался и отвергнут вариант переписать чтение мимо useAtom (свой memo-мост
      внутри фасада): фасад обязан оставаться честным ReadonlyAtom — его subscribe зовёт и
      чужой код (useAtom/useSelector извне), значит чинить надо subscribe, а не обходить его
      своим путём чтения. К перф-числам из заявки (планировщик 44-92 мс, GC 30-66 мс на клик)
      не привязываюсь: снят один лишний пересчёт на читателя на переключение — что из этих
      миллисекунд отсюда, мерить не мне и не по этим замерам.

  - id: family-create-and-empty-value
    type: plan
    date: 2026-09-22
    summary: >
      Заявка №2 владельца приложения-потребителя, по следам первой поставки: два пункта, оба
      приняты без спора. Первый — рождение ячейки отдельной операцией: у потребителя появился
      порядок "сперва собрать, потом активировать", а выразить его было нечем, кроме обращения
      по ключу ради побочного эффекта. Второй — фабрика ключа не должна звать́ся на заглушку;
      это прямая правка собственного решения суточной давности, где заглушка собиралась той же
      фабрикой с undefined вместо ключа. Довод заявки принят как более точный, чем мой
      собственный: требовать от приложения назвать "ячейки нет" правильно, но требовать это
      ВНУТРИ фабрики, которая собирает срез по имени, — значит заставлять её отвечать на
      вопрос не из её области. Форму empty выбирал сам (заявка оставила на усмотрение):
      options.empty отдельной перегрузкой, обязательной при фабрике, — рядом с объявлением
      семьи, и проверяется компилятором, а не соглашением; вариант "необязательное поле с
      фолбэком" отклонён, потому что молчаливый undefined вместо состояния хуже отказа на
      месте объявления. Сверки с рынком по обоим пунктам не делалось: это доводка внутри уже
      принятой механики семьи, не развилка и не новая зависимость.

  - id: family-active-key-and-initial-by-key
    type: plan
    date: 2026-09-22
    summary: >
      Заявка владельца приложения-потребителя на два пункта: активный ключ у семьи и начальное значение
      функцией ключа. Второй пункт взят сразу — обойти его было нечем, и сверка 2026-09-22
      показала, что отклонением была наша фиксированная форма (у Jotai Family и Recoil
      atomFamily инициализатор и есть функция параметра). Первый пункт заявка честно подала
      как необязательный (достижим своим сигналом плюс аксессорный режим) — взят всё равно,
      но по другой причине, чем в заявке: аксессорный режим требует НАСТОЯЩИЙ Solid-аксессор,
      значит "свой сигнал" — это голый createSignal в модели приложения, мимо атомов пакета,
      то есть ровно дыра из create-bound-atom-scope. Сверка там же: встроенного указателя
      "активная ячейка" нет ни у Jotai, ни у Recoil — указатель держит приложение, а семья
      читается по нему производным чтением; в Solid производное чтение это и есть наш
      аксессорный режим, поэтому взята та же механика, а переехало только место хранения
      указателя. Цена названа заранее: активный указатель один на семью, два одновременных
      взгляда на разные ячейки через active() неадресуемы (для них остаётся аксессор).
      Форму дефолтной ячейки решал user, и решал дважды: первый предложенный вариант
      (undefined — обычный писуемый ключ Map, как было описано в EXAMPLES §6) отклонён —
      "пустая ячейка не может принимать записи, только дефолт"; вариант с падением отклонён
      тоже. Принято: одна структура на все случаи, как у запроса, с пометками key()/status()
      рядом со значением; дефолтная ячейка одна на семью, в Map не попадает, запись в неё
      глушится по известному ключу. EXAMPLES §6 поправлен (старый текст прямо обещал
      настоящий стор под undefined), рядом заведён 6b. Применение на стороне приложения — не эта
      зона, уходит владельцу.

  - id: solid-facade-and-rootless
    type: plan
    date: 2026-09-21
    summary: >
      Разбирая заявку владельца приложения-потребителя (реактивный ключ у createActionStoreFamily),
      сверились с каталогом solid-primitives — под саму заявку там ничего не подошло
      (createMemoCache кэширует значение по ключу, а нужна переезжающая подписка), зато сверка
      ткнула в собственный дефект: кэш параметризованных селекторов заводит реактивный корень на
      каждый набор аргументов и не гасит ни одного. Заявка архитектору на два примитива:
      rootless (createSingletonRoot под этот кэш) и memo (createLazyMemo под eager-подписку
      0-арных селекторов). Решение архитектора: rootless взят подпутём @web-core/solid/rootless,
      memo отклонён (тянет scheduled ради функций, помеченных вендором устаревшими, а нужная к
      нему не обращается) — возражений нет, повод был слабый и подавался как необязательный.
      Смежное решение оттуда же, шире самой заявки: пакет переходит на @web-core/solid целиком,
      а не тянет один примитив в обход фасада. Сделано первым, отдельным шагом — без ребра
      @web-core/solid/rootless строгим pnpm не резолвится, то есть всё остальное на него
      опирается. Порядок дальше: singleton-root в кэш селекторов → реактивный ключ семьи и §6
      EXAMPLES.md → заявка владельцу приложения на переход.

  - id: family-reactive-key-scope
    type: plan
    date: 2026-09-21
    summary: >
      Заявка владельца приложения-потребителя с готовым разбором, проверена чтением кода на
      факте: провайдер компонента в приложении сделан ровно по рецепту EXAMPLES.md §6 — ключ семьи реактивный, значит поддерево перемонтируется через
      <Show keyed>, — и вместе с поддеревом гибнет всё, что живёт в DOM и к ключу отношения не
      имеет: раскрытые секции правого рейла, скролл панели, позиция в матрице. Претензия принята
      не как неудобство, а как противоречие: семья заведена под ОДНОВРЕМЕННО живые сущности,
      значит переключение между ними — чтение другого инстанса, а §6 трактовал его как смену
      жизненного цикла. Сделан второй режим вызова (Accessor<K>), рецепт §6 переписан, ремаунт
      уехал в 6a частным случаем. Отдельно отмечено владельцу: его рейл от одной этой правки
      сбрасываться не перестанет — под тем же <Show keyed> у него name: string в ComponentFacts
      и componentDescriptorOf(name), перевод фактов на аксессоры это работа его зоны.

  - id: create-action-store-family-scope
    type: plan
    date: 2026-09-16
    summary: >
      user принёс заявку с готовым диагнозом и предложенной формой API: грид-стенд
      приложения путал feedData между компонентами (кнопка ↔ чекбокс) на повторном
      заходе, потому что один глобальный createActionStore обслуживал N разных сущностей —
      синхронизация "чей это слот сейчас" держалась на неявной реконсиляции, не на структурной
      изоляции. В заявке уже был проведён и подтверждён верный критерий выбора между
      createResourceAtom (один инстанс в моменте, ключей много) и недостающим примитивом
      "стор на ключ" (несколько сущностей одновременно живы и не должны видеть данные друг
      друга) — проверено чтением store.ts/feed-preset.tsx на факте, не на слово. Реализовано
      как createActionStoreFamily тем же приёмом, что уже есть в пакете для различения
      keyed/unkeyed по typeof (createResourceAtom, createActionStore + selectorsFactory) —
      не новая идея с нуля, комбинация двух существующих. Скоуп ограничен пакетом: применение
      в коде приложения (общий стор стенда → семья по ключу) — за пределами этой

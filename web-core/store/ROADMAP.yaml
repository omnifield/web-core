# Дорожная карта @web-core/store — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у web-core/build и web-core/ui/src/table (categories → items, log → журнал решений); без
# milestones — у пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Плоское хранилище
    items:
      - id: flat-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createStore/createAtom/createReducerAtom + солид-хуки
        description: |
          Означает: единая точка резолва @xstate/store + @xstate/store-solid — createStore,
          createAtom, createAtomConfig, createReducerAtom, useSelector, useStore, useAtom,
          useAtomState. Приложение не импортирует @xstate/store*/@xstate/solid напрямую.

      - id: create-action-store
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createActionStore — доменный стор (state + actions + selectors)
        description: |
          Означает: createActionStore(initialValue, ({setState, get}) => actions, options?) —
          createAtom под капотом, actionsFactory собирается одним вызовом вместо ручной сборки
          {get, actions}. Возвращает ReadonlyAtom<T> & {actions, use(selector?)} — .set() не
          публичный, actions единственный путь записи не только по конвенции, но структурно.
          Читается useAtom(store, selector)/useSelector (как обычный атом) или store.use(selector)
          — тот же вызов без отдельного импорта. Не сделан вызываемым напрямую (store(selector),
          зустанд-хук-стиль) — @xstate/store-solid отличает атом от конфига по typeof value ===
          "object", функция этой проверке не проходит и рвёт useAtom(store, selector) извне;
          проверено прогоном, не домыслом, разбор в FAQ.md. Закрывает разрыв с
          domain-store-recipe: тот был документацией ручной композиции, этот — сам примитив,
          синтаксис один в один с тем, что просил user (@tanstack/store's createStore(initial,
          actionsFactory)). 6 тестов в test/action-store.test.tsx.

      - id: action-store-selectors
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createActionStore — третий аргумент selectorsFactory (Pinia-getters)"
        description: |
          Означает: createActionStore(initial, actionsFactory, selectorsFactory?, options?) —
          selectorsFactory: () => TSelectors возвращает чистые (state) => R функции, каждая
          оборачивается в useAtom(atom, fn) один раз при создании (внутри своего createRoot, тот
          же приём, что у createResourceAtom/createBoundAtom для модульных синглтонов) и
          становится store.selectors.x() — готовым реактивным аксессором. Различение
          selectorsFactory/options по typeof === "function", тот же приём, что у
          createResourceAtom (keyed/unkeyed). Обратная совместимость: старый вызов без селекторов
          не изменился. Закрывает конкретную находку user: variantsByTag в модели компонента у
          приложения-потребителя жила отдельной экспортированной функцией, собиралась прямо в
          странице-витрине через componentStore.use(variantsByTag) — работало, но
          "выглядит как собрать стор в компоненте", по словам user, та же претензия, что раньше
          была к createSignal вне стора. 3 новых теста в test/action-store.test.tsx (в т.ч.
          реальный рендер), разбор — FAQ.md.

      - id: create-action-store-family
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createActionStoreFamily — стор-на-ключ (store family)
        description: |
          Означает: createActionStoreFamily(initialValue, actionsFactory, selectorsFactory?,
          options?) — та же сигнатура, что у createActionStore, но возвращает не стор, а
          (key: K) => ActionStore<T, TActions, TSelectors>. Ленивое создание + кэш Map<K,
          ActionStore> под капотом: actionsFactory/selectorsFactory вызываются один раз на
          первое обращение к ключу, дальше отдаётся тот же инстанс. Без политики вытеснения —
          рассчитан на конечный/известный набор ключей (каталог компонентов, вкладки), не на
          неограниченный поток; для последнего в пакете уже есть createResourceAtom (один атом,
          ключ подставляется, переключение смывает предыдущее значение через AbortController +
          runId-guard). Критерий выбора между ними — не размер N, а одновременная живость: один
          инстанс в моменте, ключей может быть много → createResourceAtom; несколько сущностей
          одновременно не должны видеть данные друг друга → createActionStoreFamily. Закрывает
          дыру, найденную на конкретном баге: грид-стенд приложения-потребителя держал feedData
          (несколько панелей стенда разом) в одном глобальном createActionStore без ключа —
          при переключении между компонентами (кнопка ↔ чекбокс) данные путались, баг
          проявлялся только на повторном заходе (contentQuery с staleTime: Infinity отдаёт
          данные без промежуточного pending, async-гэп первого захода сам смывал старое
          значение и маскировал архитектурную причину). Ключи-заплатки ("если component !==
          current — сбросить") лечили бы симптом, не причину — сама возможность коллизии
          оставалась бы. Применение (общий стор стенда → семья по ключу) — не эта
          зона: код приложения за её пределами. 4 теста в test/action-store.test.tsx,
          включая реальный рендер с переключением ключа между двумя render-проходами.

      - id: selectors-cache-singleton-root
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Кэш параметризованных селекторов копит реактивные корни и не гасит ни одного"
        description: |
          Означает: createActionStore на каждый уникальный набор аргументов заводил подписку в
          СВОЁМ createRoot и держал её вечно — корней столько, сколько разных наборов аргументов
          прошло через страницу, и каждый пересчитывал селектор на каждое изменение state, молча.
          В FAQ это называлось осознанным компромиссом; компромисс держался на дисциплине
          вызывающего. Стало: подписка живёт в createSingletonRoot из @web-core/solid/rootless
          (примитив взят по заявке этой зоны) — корень со счётчиком слушателей, гаснет по уходу
          последнего читающего владельца, с задержкой на микротаск (переключение между
          читателями в одном тике подписку не пересоздаёт). Владелец корня задан явным null:
          по умолчанию примитив цепляет корень к первому вызвавшему, а тот ничем не лучше
          остальных. Вызов селектора ВНЕ реактивного владельца (тест, роутер, обычная функция)
          подписки больше не заводит вовсе — отдаёт разовое значение из снапшота, как .get():
          считать там некого, а прежняя реализация именно на этом пути и оставляла бессмертный
          корень. Что НЕ изменилось: сама Map по-прежнему растёт по числу наборов аргументов —
          уходит живая подписка, не запись в кэше. 2 новые пробы в test/action-store.test.tsx
          (счётчик вызовов самой функции селектора; обе на прежней реализации падают — проверено
          прогоном на откаченном файле), всего 37 тестов, eslint и tsc зелёные.

      - id: action-store-family-reactive-key
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createActionStoreFamily — адресация стора аксессором ключа, не только значением"
        description: |
          Означает: семья принимает вторым режимом Accessor<K> вместо K и отдаёт тот же
          ActionStore (интерфейс ActionStoreFamily с двумя сигнатурами вызова, различение по
          typeof key === "function" — приём, уже трижды применённый в пакете). Внутри не кэш
          аксессоров на ключ, а ОДНА подписка, которая переезжает: первая ставится синхронно
          (иначе между subscribe и первым прогоном эффекта читатель пропустил бы изменения),
          дальше эффект следит за ключом, снимает прежнюю подписку, ставит новую и дёргает
          читателя. get/selectors адресуют стор текущего ключа, actions тоже, но через untrack
          — запись не подписывает вызывающий код на ключ. Состояние прежнего ключа переезд не
          трогает, оно остаётся в Map. Повод — заявка владельца приложения-потребителя: familyOf(key)
          синхронен, поэтому реактивный ключ лечился только ремаунтом поддерева, и вместе с
          поддеревом гибло всё, что живёт в DOM и к ключу отношения не имеет (раскрытие секций
          рейла, скролл, выделение); переключение между одновременно живыми сущностями при этом
          трактовалось как смена жизненного цикла — спор с самим критерием, по которому семья и
          заведена. Цена формы названа заранее: ключ-функция вторым режимом неадресуем.
          EXAMPLES.md §6 переписан — аксессор стал общим рецептом, ремаунт уехал в 6a как
          частный случай (сбросить поддерево и есть цель). 6 новых проб в
          test/action-store.test.tsx (переезд без ремаунта — счётчик тела компонента остаётся
          1; возврат к прежнему ключу; actions/selectors по текущему ключу; ключ значением
          рядом с сигналом не реагирует — как и раньше; снятие подписки при переезде и при
          размонтировании), всего 43 теста, eslint и tsc зелёные. Применение на стороне
          приложения — не эта зона, уходит заявкой владельцу.

      - id: action-store-family-active-key
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createActionStoreFamily — активный ключ у самой семьи (activate/active)"
        description: |
          Означает: семья держит активный ключ у себя — family.activate(key) объявляет ячейку
          активной (заранее создавать не нужно, getOrCreate ленивый), family.active() отдаёт тот
          же стор, привязанный к активному ключу реактивно, ровно как в аксессорном режиме
          (внутри — сигнал в замыкании семьи + уже существующий storeBoundToKey). Читателю имя
          ключа знать не нужно вовсе: произносится оно в одном месте — там, где появляется.
          Ключ undefined (не активировали либо сняли активацию через activate(undefined))
          адресует ОДНУ дефолтную ячейку: в Map она не попадает, читается как обычная, запись в
          неё заглушена — actions отрабатывают вхолостую. Вариант "бросать до активации"
          отклонён user прямым решением: чтение до активации штатно (первый кадр, маршрут без
          ключа в адресе), падать на нём нельзя; вариант "undefined — обычный писуемый ключ"
          отклонён там же — дефолтная ячейка несёт дефолт, и только его. Вместо развилки —
          одна структура на все случаи, как у запроса: стор всегда один и тот же, разницу несут
          пометки РЯДОМ со значением — key(): Accessor<K | undefined> и status(): "absent" |
          "initial" | "written" (писали ли в ячейку хоть раз). Пометки есть у любого стора от
          семьи, не только у active(). Граница честности названа в доке: заглушенная запись
          ничего не сообщает вызывающему, ловится только по status() === "absent" до вызова.
          Повод — заявка владельца приложения-потребителя: провайдер компонента снимается, имя
          приходит со сменой маршрута, потребители читают активную ячейку. Хелпер "активировать все семьи
          разом" НЕ делался — состав семей знает приложение, композиция остаётся у него
          (решение user). 9 новых проб в test/action-store.test.tsx.

      - id: action-store-family-initial-by-key
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createActionStoreFamily — начальное значение функцией ключа"
        description: |
          Означает: initialValue у семьи принимается и в форме (key: K | undefined) => T рядом с
          прежней формой-значением; функция зовётся один раз на рождение ячейки. Закрывает то,
          чего обойти было нечем: ячейка не могла при рождении нести посчитанное ИЗ своего ключа
          (потребителю нужен синхронный срез кита по имени компонента — паспорт, срез редактора,
          io-схема). Побочно снят общий объект начального значения по ссылке у всех ячеек.
          ВНИМАНИЕ, сигнатура этого пункта прожила сутки: первая версия была (key: K | undefined)
          => T — фабрика собирала и ячейку-заглушку, — и заменена на (key: K) => T плюс
          options.empty, см. action-store-family-empty-value. Различение форм по typeof === "function"
          новой цены не создаёт: createAtom у вендора и так трактует функцию в позиции значения
          как computed-геттер, состояние-функция было невыразимо и до правки. Сверка 2026-09-22
          показала, что отклонением была наша фиксированная форма: у Jotai Family и Recoil
          atomFamily инициализатор и есть функция параметра — разбор со ссылками в FAQ.md.
          4 новые пробы в test/action-store.test.tsx.

      - id: action-store-family-explicit-create
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createActionStoreFamily — явное рождение ячейки (create)"
        description: |
          Означает: family.create(key) — идемпотентная операция рождения ячейки (есть — отдаёт
          её же, ничего не пересобирая; нет — создаёт и наполняет фабрикой ключа), отдаёт саму
          ячейку, не void. Внутри это та же getOrCreate, что и у обращения по ключу, — смысл
          не в новом поведении, а в том, что порядок написан намерением. Повод (заявка №2
          владельца приложения-потребителя): на смене маршрута ячейку обязаны собрать ДО активации, иначе
          active() на кадр смотрит на несобранную; выразить это можно было только обращением по
          ключу ради побочного эффекта (family(name) с выброшенным результатом) — такой код
          читается как случайность и исчезает при первой уборке "лишнего вызова" вместе с
          порядком. Хелпера "создать/активировать все семьи разом" по-прежнему нет и не
          просили. 4 новые пробы в test/action-store.test.tsx.

      - id: action-store-family-empty-value
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Фабрика ключа звалась и на ячейку-заглушку, с undefined вместо ключа"
        description: |
          Означает: первая версия initial-by-key собирала заглушку той же фабрикой, передавая ей
          undefined, поэтому сигнатура была (key: K | undefined) => T. Обоснование было такое:
          пусть компилятор требует от приложения назвать, что такое "ячейки нет". Требование
          верное, место неверное — заявка №2 показала предметно: фабрика по смыслу собирает срез
          сущности ПО ЕЁ ИМЕНИ, а её заставляли уметь отвечать "имени нет", при том что у
          настоящей ячейки имя есть всегда. Стало: фабрика принимает (key: K) => T и зовётся
          ТОЛЬКО на настоящих ячейках, значение заглушки объявляется рядом — options.empty,
          обязательный ровно тогда, когда начальное значение задано фабрикой (отдельная
          перегрузка, не необязательное поле; вызов без него не собирается и падает на месте
          объявления, а не молча отдаёт undefined вместо состояния). Форма-значение не
          изменилась: одно значение на все ячейки, заглушке достаётся оно же, empty не нужен.
          Ломает то, что уехало предыдущей поставкой этого же дня (сигнатура фабрики), — версия
          ещё не публиковалась. 2 новые пробы в test/action-store.test.tsx.

      - id: family-facade-single-clock
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Фасад семьи переезжал на новый ключ двумя тактами — кадр «новый ключ, старые данные»"
        description: |
          Означает: storeBoundToKey переподключал подписку внутри createEffect, а key/get/
          selectors читают ключ синхронно, при каждом обращении. Эффекты идут ПОСЛЕ фазы
          вычислений, поэтому между сменой ключа и переездом подписки существовал проход, в
          котором читатель видел новый ключ и данные прежней ячейки (плюс лишний пересчёт на
          каждое переключение у каждого такого читателя). Касалось не только нового active():
          тот же фасад обслуживает обращение аксессором ключа, то есть дефект жил с самого
          появления реактивного ключа (action-store-family-reactive-key). Найдено владельцем
          приложения-потребителя, заявка с готовым repro; воспроизведено пробой на своём дереве — лишний
          проход "ключ=b get=b use=a", и только следующий use=b. Стало: переезд живёт в
          createComputed — подписка стала вычислением над key(), как и всё остальное у фасада,
          и успевает переключиться до того, как отработает хоть один читательский эффект.
          Первая подписка по-прежнему ставится синхронно, ДО вычисления. Ничего сверх не
          менялось: состояние прежнего ключа переезд не трогает, подписка на прежний снимается,
          activate/create/заглушка прежние — старые пробы прошли без правок. 3 новые пробы в
          test/action-store.test.tsx, все три на прежней реализации падают (проверено прогоном
          до починки), всего 64 теста.

  - category: Стейт-машины
    items:
      - id: machine-layer
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Подпуть ./machine — полноценный xstate
        description: |
          Означает: createMachine/setup/assign/fromPromise/guards/акторы + useMachine/useActor/
          useActorRef/fromActorRef. xstate и @xstate/solid — опциональные peer, не подмешаны в
          корневой `.`.

  - category: Аддоны
    items:
      - id: addons-subpaths
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: ./persist, ./undo, ./reset, ./validate
        description: |
          Означает: реэкспорт @xstate/store/{persist,undo,reset,validate} отдельными подпутями —
          @xstate/store НАША зависимость, без реэкспорта её подпути недостижимы строгим pnpm.

      - id: persist-atom
        type: feature
        status: Done
        priority: High
        milestone: null
        name: persistAtom — persist для createAtom (localStorage/sessionStorage)
        description: |
          Означает: @web-core/store/persist экспортирует persistAtom(atom, {name, storage?,
          serialize?, deserialize?}) — гидратация из storage при вызове + подписка на .set() для
          записи. Закрывает дыру: upstream persist() из @xstate/store — StoreExtension, вешается
          через .with() на createStore, у createAtom .with нет вовсе. До этого пункта потребители
          (стор выбранного эндпоинта в приложении) вручную писали
          localStorage.getItem/setItem + JSON.parse/stringify на каждый персистентный атом.
          Local/session переключаются готовым createJSONStorage(() => sessionStorage) из того же
          подпути — новой опции под них не заводили. 5 тестов в test/persist.test.tsx.

      - id: mutate-addon
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "./mutate — Immer-рецепт для setState/atom.set (ВРЕМЕННОЕ место)"
        description: |
          Означает: @web-core/store/mutate экспортирует mutate(recipe), castDraft, castImmutable,
          тип Draft. mutate(recipe) — обёртка над immer's produce(recipe), возвращает (state) =>
          state, годится и в createAtom.set, и в createActionStore's setState (обе сигнатуры
          (prev) => next). immer — ОБЫЧНАЯ dependency пакета (как @xstate/store), НЕ peer —
          первая версия сделала peer по аналогии с ./machine, ошибочно (разбор в FAQ.md);
          приложение immer не ставит и не импортирует, весь набор через ./mutate. 5 тестов в
          test/mutate.test.tsx, включая castDraft на readonly-массиве внутри поля. ВАЖНО: user
          попросил прямым текстом вынести отдельной утилитой, потому что "потом перенесём" — не
          обосновано доменной границей (в отличие от io-owns-zod), разовая просьба под этот кейс.
          Не переносить самостоятельно без нового явного запроса — см. log.

      - id: persist-atom-indexeddb
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: persistAtom — асинхронный storage (IndexedDB)
        description: |
          Означает: persist-atom сегодня читает storage.getItem синхронно — если он вернёт
          Promise (async-адаптер вроде IndexedDB), гидратация молча не происходит (typeof raw
          === "string" не пропускает Promise). Когда IndexedDB понадобится реально — либо
          persistAtom научится await'ить getItem и гидрировать асинхронно (сигнатура персиста
          при этом меняется — вызывающий код должен знать, что атом не готов сразу), либо рядом
          появится отдельный helper по образцу rehydrateStore у @xstate/store/persist.

  - category: Ресурс — синхронно и асинхронно
    items:

  - id: action-store-selectors-scope
    type: plan
    date: 2026-09-14
    summary: >
      user, разбирая codestyle страницы-витрины у потребителя, указал на конкретную несостыковку:
      componentStore живёт цельным флоу (state+actions внутри createActionStore), а
      variantsByTag — отдельно экспортированная функция, склеиваемая с componentStore.use(...)
      прямо в компоненте. Дословно: "выглядит как собрать стор в компоненте... в зустанд флоу
      так не делается... флоу селекторов уже давно не встречаю в современном коде, а если и
      встречаю то с пометкой на переход на хуки". Решено не спорить с этим (технически .use(fn)
      был рабочим use case, но именно как паттерн — устаревающий) и добавить third argument
      selectorsFactory, чтобы вычисляемые значения объявлялись там же, где actions, и читались
      как store.selectors.x() — готовый хук на сторе, не сборка на месте вызова. Реализовано
      тем же приёмом различения по typeof, что уже был в пакете (createResourceAtom), не новая
      идея с нуля.

  - id: mutate-addon-peer-to-dependency
    type: plan
    date: 2026-09-14
    summary: >
      user разбирал типовую ошибку в модели компонента приложения (as never на
      каждой замене поля) — по пути вскрылось, что готовый фикс требовал castDraft прямо из
      "immer", а в самом приложении immer вообще не стоял. user указал на асимметрию в лоб: "агент
      импортирует свой иммер. может ему тогда и Xstore тоже импортировать? почему половина
      иммера под капотом, половина снаружи". Справедливо — @xstate/store/@xstate/store-solid
      обычные dependencies (приложения их не видят вовсе), а immer был помечен
      peerDependenciesMeta.optional по аналогии с xstate/@xstate/solid у ./machine, не подумав:
      там peer оправдан размером и реальной опциональностью слоя, у immer причины нет. Решение —
      immer в dependencies, ./mutate реэкспортирует castDraft/castImmutable/Draft вместе с
      mutate, приложение immer больше не ставит и не импортирует. Отдельно подтверждено прогоном
      tsc --strict: без явного mutate<T> — draft: unknown; без castDraft на замене поля с
      readonly-массивом внутри — TS2322 (защита Immer, не баг обёртки).

  - id: mutate-addon-scope
    type: plan
    date: 2026-09-14
    summary: >
      user, работая напрямую в модели компонента приложения (setOutfit пишет
      {...state, outfit} руками), спросил про Immer-стиль мутации (state.outfit = outfit вместо
      спреда). Ответ: setState уже принимает (prev) => next, значит produce(recipe) из immer
      подходит без единой правки пакета — но user явно попросил "сделать на твоей стороне,
      запиши в роадмап и го, только вынеси у себя иммер отдельной утилитой, мы его потом
      перенесём". Сделано: mutate-addon, подпуть ./mutate по образцу persist/undo/reset/validate,
      immer опциональный peer. Блокер по пути: MCP-сервер соседней зоны ссылался манифестом на
      @web-core/mcp, а web-core/mcp/ был удалён с диска не закоммичено (чужая параллельная
      работа, не моя) — pnpm install падал по всему репозиторию, не только у меня; user сам
      поправил, дальше typecheck/lint/vitest прошли чисто (24 теста).

  - id: action-store-callable-rejected
    type: plan
    date: 2026-09-13
    summary: >
      user увидел createActionStore в деле (маршрут зовёт store.actions.setComponent, страница
      читает useAtom(store, selector)) и попросил "пушку" — стор сам как функция-
      селектор, зустанд-хук-стиль (const x = store(selector) вместо useAtom(store, selector)).
      Первая попытка (Object.assign(fn, {get, subscribe, actions})) сразу упала тестом:
      @xstate/store-solid's useAtom различает атом и AtomConfig проверкой isAtom = typeof value
      === "object" (dist/xstate-store-solid.js:9,76) — функция эту проверку не проходит, падает в
      definition.createAtom(...), которого нет, TypeError в реальном рендере. Проверено прогоном
      test/action-store.test.tsx, не домыслом. Технически невозможно совместить "вызываемый как
      функция" и "проходит isAtom чужого пакета" — взаимоисключающе на уровне typeof. Решение —
      store.use(selector): остаётся обычным объектом (useAtom(store, selector) извне продолжает
      работать), .use — тот же вызов без отдельного импорта. Ближайший безопасный аналог Zustand.

  - id: create-action-store-scope
    type: plan
    date: 2026-09-13
    summary: >
      Продолжение domain-store-vs-tanstack: user принёс ещё раз тот же @tanstack/store пример
      (createStore(initial, ({setState, get}) => actions)) и спросил прямо — "наш стор умеет так
      работать?" Честный ответ на тот момент был "нет, только руками" (README показывал ручную
      сборку {get: atom.get, actions: {...}} поверх createAtom) — расхождение между "можно
      добиться того же результата" и "есть такая ручка" запутало user, который отдельно тестировал
      реальным агентом на модели компонента приложения: тот попытался применить
      actions-рецепт к currentComponent/currentOutfit (которые на деле кейс createBoundAtom — их
      никто не "экшенит", они зеркалят проп маршрута) и в процессе притащил обратно голый
      createSignal, задублировав состояние в сигнале и в атоме. Решено закрыть разрыв кодом, не
      объяснением: создан createActionStore (src/engine/action-store.ts) — actionsFactory
      собирается одним вызовом, .set() не публичный (ReadonlyAtom<T> & {actions}), синтаксис
      один в один с примером user. README-рецепт (domain-store-recipe) заменён на реальный
      примитив.

  - id: domain-store-vs-tanstack
    type: plan
    date: 2026-09-13
    summary: >
      user принёс готовое ТЗ (от стороннего источника) на "доменный стор" в стиле Zustand/Pinia —
      state+actions+selectors на @tanstack/store, мотивация "с существующим неудобно работать".
      Прежде чем менять движок, сверено предметно: требования ТЗ (стор без Solid-примитивов,
      Solid только на границе, actions — единственный путь записи, точечные selector-подписки)
      уже достижимы createAtom + объект actions + useAtom(atom, selector) — без нового кода
      пакета. Проверены .d.ts уже лежащих в node_modules @tanstack/store и @tanstack/solid-store:
      тот же класс изоляции от Solid (свой граф зависимостей, alien-signals), тот же пробел
      "внешний аксессор → стор" (закрыт для @xstate/store в create-bound-atom, у TanStack не
      закрыт вообще). Решение: не переходить на TanStack Store — задокументировать существующую
      композицию как рецепт (domain-store-recipe), разбор — в FAQ.md.

  - id: create-bound-atom-scope
    type: plan
    date: 2026-09-13
    summary: >
      Запрошено user по конкретному кейсу: модель компонента в приложении синкает
      currentComponent/currentOutfit с пропом страницы-витрины и с текущим надетым нарядом через голый solid
      createSignal + createEffect(() => setCurrentComponent(props.component)) в самой странице —
      мимо атомов пакета, потому что ручки под "атом, ведомый внешним аксессором" не было.
      Первая мысль (одноразовая функция syncAtom(atom, source)) вызвала сомнение user — "выглядит
      как самопальная ручка внутри важного пакета, который вот-вот начнут активно юзать все".
      Сделан research по существующим атомным экосистемам (Jotai discussions#1487,
      useAtomEffect, atomWithObservable, TanStack Store, nanostores, сам Solid) — подтверждено,
      что "эффект пишет во внешний атом" это и есть устоявшийся в индустрии приём, не костыль;
      универсальной "магической" ручки в ядре ни у кого нет, каждый источник — своя маленькая
      обёртка. Решено оформить как createBoundAtom — конструктор той же фабричной формы, что уже
      есть в пакете (createResourceAtom), не отдельно стоящая утилита.

  - id: persist-atom-scope
    type: plan
    date: 2026-09-11
    summary: >
      Запрошено user по конкретному кейсу: стор выбранного эндпоинта в приложении
      вручную гидрирует и пишет атом в localStorage (STORAGE_KEY + JSON.parse/stringify руками)
      — потому что upstream persist() из @xstate/store работает только с createStore (.with()),
      у createAtom этого метода нет. Решено добавить persistAtom в тот же подпуть
      @web-core/store/persist (не новый подпуть — переиспользует StateStorage/createJSONStorage
      оттуда же, один словарь опций на persist store и persist atom). Скоуп явно ограничен по
      просьбе user: localStorage/sessionStorage сейчас (через уже существующий
      createJSONStorage), IndexedDB — Backlog (persist-atom-indexeddb), не строить асинхронную
      гидратацию заранее без реального потребителя.

  - id: create-async-atom-confirmed-broken
    type: plan
    date: 2026-09-04
    summary: >
      createAsyncAtom из @xstate/store отслеживает .get() других атомов только в синхронной
      части геттера (пока запрос pending). В момент резолва промиса updateAsyncAtom вызывает
      atom._update(readyValue) — готовым значением, не геттером, — и purgeDeps считает все ранее
      слинкованные атомы недостигнутыми в этом проходе, отвязывает их. Итог: атом, получивший
      значение хотя бы раз, теряет реакцию на дальнейшую смену входа. Проверено изолированным
      прогоном на dist/xstate-store.js без Solid: infoAtom.deps после резолва — undefined,
      idAtom.set() больше не помечает потребителя dirty. Решение — не чинить примитив апстрима
      (внешняя зависимость), а заменить его собственным createResourceAtom и заблокировать
      реэкспорт сломанного имени на уровне типов, а не только предупреждением в доке.

  - id: resource-atom-solid-effect-not-autotrack
    type: plan
    date: 2026-09-04
    summary: >
      createResourceAtom реагирует на смену ключа через Solid createEffect(() => source()), не
      через автотрекинг @xstate/store — ту же систему, что сломана у createAsyncAtom. Сам
      ресурс-атом — обычный писуемый createAtom, обновляется только .set() изнутри эффекта.
      Компромисс: source обязан быть настоящим Solid-сигналом (или производным), .get() другого
      атома @xstate/store сюда не протягивается — это две разные реактивные системы, моста между
      ними нет.

  - id: engine-folder-not-kernel
    type: plan
    date: 2026-09-04
    summary: >
      Реструктуризация src/ прошла в два захода. Первый — folder-per-subpath один в один с
      exports (включая `.` → src/flat/), отклонён user: шесть папок одного уровня без точки
      входа читались как россыпь функций, разложенная по директориям, не движок. Второй заход —
      по образцу web-core/assembly (kernel/ + тонкий index.ts), но не взят дословно: у assembly
      kernel/ — плоский мешок из 9 файлов без под-группировки (та же болезнь на уровень глубже),
      слово kernel там означает конкретно «без фреймворка» (./model — без Solid), а корневой
      слой store Solid-хуки как раз несёт — назвать его kernel было бы неточно. Названо engine/.
      machine/ остался независимым подпутём, не подмешан в корень (в отличие от assembly, где
      render всегда едет с kernel в `.`) — про это явно написано в src/index.ts.


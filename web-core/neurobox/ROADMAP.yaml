# Дорожная карта @web-core/neurobox — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у web-core/router/web-core/query/web-core/form (categories → items, log — журнал решений).
#
# Пакет заведён 2026-09-13 архитектором по прямой просьбе user — клиент для бокса нейробокс
# (менеджер рантаймов агентов, протокол AG-UI; полное описание — в документации самого бокса,
# здесь не пересказывается). Детали уже обсуждены user с владельцем этого пакета напрямую — этот
# файл только заводит шаблон (package.json/конфиги/голый реэкспорт), содержание — открытая работа
# владельца. Семь развилок ниже разобраны архитектором и user тем же днём (см. log,
# client-adapter-decisions-resolved) — решения приняты, код ещё не написан, поэтому статусы
# остаются Backlog: тот же принцип, что и везде в репо — Done ставится рядом с реализацией и
# проверкой, не рядом с решением.

categories:
  - category: Поверхность
    items:
      - id: full-vendor-reexport
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Полный реэкспорт @tanstack/ai-client (`.`) и @tanstack/ai-solid (`./solid`)"
        description: |
          `export * from "@tanstack/ai-client"` / `export * from "@tanstack/ai-solid"` —
          единственная точка резолва, тем же приёмом, что `@web-core/router`/`@web-core/query`/
          `@web-core/form`. Разбор, почему взят именно TanStack AI, а не свой клиент под AG-UI —
          FAQ.md. Отправная точка, не конечная форма — пакет растёт своей обвязкой поверх вендора
          по мере пунктов ниже, не остаётся голым реэкспортом.

  - category: "Решено архитектором и user — реализация за владельцем"
    items:
      - id: auth-headers-server-side-only
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "Authorization + X-User-Login — пока НЕ трогаем, токен статичный как сегодня"
        description: |
          Раздел «Доступ» в документации бокса: `X-User-Login` бокс не проверяет — «кто назвался,
          тот и владелец», подстановка из браузера в теории позволяет назваться чужим именем.
          РЕШЕНО (user, 2026-09-13): авторизацией сейчас не занимаемся — токен один на всех,
          заголовки ставятся там же, где и сегодня (на клиенте), серверный прокси-слой не заводим.
          Возврат к этому пункту — отдельным заходом, когда/если авторизация станет предметом
          работы, не блокер для остальной части пакета.

      - id: run-agent-input-shape
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Свой ConnectConnectionAdapter — штатный fetchServerSentEvents не собирает context бокса"
        description: |
          `forwardedProps`/`context` (раздел «Прогон» протокола бокса) — чем агент думает и
          что знает о месте (страница/компонент/вариант), два РАЗНЫХ поля конверта. РЕШЕНО (сверено
          чтением `dist/esm/connection-adapters.js` пакета `@tanstack/ai-client@0.31.1`, не по
          доке): `buildRunAgentInputBody()` внутри `fetchServerSentEvents()` шлёт `context: []`
          ЗАШИТО, `data`/`options.body` сливаются только в `forwardedProps`. Значит используем не
          `fetchServerSentEvents`, а пишем свой `ConnectConnectionAdapter` (`connect(messages, data,
          abortSignal, runContext)` → `AsyncIterable<StreamChunk>`, тип пакета уже экспортирует) —
          он и собирает `context` из `data`, и ставит `Authorization`/`X-User-Login`. Сборку
          `messages` в wire-формат переизобретать не нужно — `convertMessagesToModelMessages`/
          `normalizeToUIMessage`/`modelMessagesToUIMessages` уже публичный реэкспорт пакета.
          Открыто по-прежнему (не архитектура, а поверхность): типизированные обёртки над
          `GET /api/catalog/recipes`/`/passports` для имён `forwardedProps`, или сырые fetch —
          см. `catalog-endpoints-typed-or-raw`.

      - id: tool-call-result-reactivity
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Реакция на TOOL_CALL_RESULT — бесплатно через onChunk, ничего своего писать не надо"
        description: |
          Бокс прямо называет `TOOL_CALL_RESULT` «тем, ради чего стоит слушать
          поток» — по нему видно, что реально изменено, ДО конца прогона («агент сохранил данные —
          перезапроси и переключи показ»). РЕШЕНО (сверено чтением `types.d.ts`): `ChatClientOptions`
          несёт `onChunk?: (chunk: StreamChunk) => void`, зовётся на КАЖДЫЙ кадр, включая
          `ToolCallResultEvent` (`type: 'TOOL_CALL_RESULT'`, поля `toolCallId`/`content` — то же,
          что шлёт бокс). Не нужна своя обвязка поверх connection-адаптера — только фильтр по
          `chunk.type` в `onChunk`, который передаётся потребителем пакета как обычная опция
          `useChat`.

      - id: cancel-request-wired-into-connect
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "POST /cancel дожимается САМИМ connect() по abortSignal — не отдельная функция для потребителя"
        description: |
          `POST /api/agent/{threadId}/cancel` — отдельный запрос, не поле конверта, а `stop()` из
          `useChat` по умолчанию рвёт только локальный `fetch` через `AbortSignal`, бокс об этом не
          узнаёт. Бокс прямо предупреждает про свой известный баг: после голого обрыва
          соединения следующее сообщение может зависнуть до таймаута (`agent-silent`).
          РЕШЕНО (user, 2026-09-13, вариант А из двух предложенных): свой `connect()` подписывается
          на переданный ему `abortSignal` и САМ шлёт `POST /cancel` по его срабатыванию — потребитель
          пакета просто зовёт штатный `stop()`, не обязан помнить про вторую ручку бокса. Известный
          баг бокса (поток может замолчать и после нашей отмены) этим не чинится — не наша поломка,
          но раз он документирован, поверхность пакета (тип состояния потока/README) должна явно
          называть сценарий «после отмены — новый поток», не оставлять потребителя удивляться молча.

          ⚠️ **Ловушка при реализации** (найдена ревью со стороны бокса, не блокер решения выше, но
          обязательна к учёту в коде): `POST /cancel` НЕЛЬЗЯ слать с тем же `abortSignal`, который
          только что сработал — сработавший сигнал оборвёт и сам запрос отмены, не дав ему дойти до
          бокса. Нужен отдельный сигнал (свой `AbortController` на сам вызов `/cancel`, с разумным
          таймаутом) или вызов вовсе без сигнала — не переиспользовать входной `abortSignal` дважды.

      - id: spend-tracking-in-tokens
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "GET /spent — типизированный сырой снимок, дельты пакет не считает"
        description: |
          Раздел «Расход» в документации бокса: `cost_micros` — накопительный итог, вычислять
          цену хода вычитанием уже как-то «соврало почти втрое» по словам бокса — сам протокол
          рекомендует ориентироваться на токены (`cache_read_tokens` растёт быстрее всего, лучше
          показывает налог на длинный разговор). РЕШЕНО (user, 2026-09-13): пакет отдаёт снимок
          как есть — `{thread, runs, prompt_tokens, completion_tokens, cache_read_tokens,
          cost_micros}` — БЕЗ самостоятельного вычисления дельт; дизайн отображения расхода в UI
          (считать ли разницу токенов между вызовами) — дело потребителя, не пакета. Форма ТИПИЗИРУЕТСЯ
          (не сырой `unknown`) — узкая, явно названная боксом ручка, не растущий открытый протокол
          (тот же принцип, что у `catalog-endpoints-typed-or-raw`, только в обратную сторону).

      - id: feedback-both-kinds
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: "POST /feedback — типизированная ручка, praise наравне с friction"
        description: |
          Бокс прямо просит записывать хорошее наравне с плохим — «по одним жалобам
          не видно, что работает». Агент пишет сюда сам при затыке в боксе; от потребителя — то,
          что сказал человек. Не писать сюда про чужие зоны (у зон свои ручки обратной связи).
          РЕШЕНО (user, 2026-09-13): форма явно названа боксом (`kind: friction|praise`, `what`,
          `where`, `workaround`) — типизируем, тем же принципом, что `spend-tracking-in-tokens`.

      - id: catalog-endpoints-typed-or-raw
        type: decision
        status: Done
        priority: Low
        milestone: null
        name: "Каталожные ручки бокса — СЫРЫЕ, не типизированные: растущий протокол"
        description: |
          `GET /api/catalog/*`, `/api/agents`, `/api/mcp/servers`, `/api/health` — источник имён
          для `forwardedProps` и картины того, что бокс вообще умеет. РЕШЕНО (user, 2026-09-13):
          сырые fetch-обёртки, БЕЗ типизированной формы ответа — сам бокс называет себя протоколом,
          который «растёт», и молча пропускает незнакомые поля конверта; жёсткая типизация здесь
          рассинхронится с боксом при первом же его обновлении. Общий принцип, найденный этим же
          разговором: явно названные боксом СТАБИЛЬНЫЕ формы (`/spent`, `/feedback`) —
          типизируем; открытые РАСТУЩИЕ списки (каталоги) — сырые.

  - category: "MCP-клиент — перенос web-core/mcp/src/peer+browser (не удаляем оригинал, пока не перенесено)"
    items:
      - id: peer-replaced-by-ai-mcp-client
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "httpPeer/stdioPeer (web-core/mcp/src/peer) → createMCPClient (@tanstack/ai-mcp)"
        description: |
          Контекст: `web-core/mcp` НЕ удаляется целиком — `register-tool`/`transport` незаменимы
          (TanStack не строит MCP-серверы, только клиент), это отдельно решено и не пересматривается
          здесь. Но `/peer` (`httpPeer`/`stdioPeer`, наш рукописный MCP-КЛИЕНТ) — ровно то, что
          `@tanstack/ai-mcp` уже даёт лучше, обещано раньше в разговоре и до сих пор не сделано —
          этот пункт закрывает тот долг.

          Проверено по-настоящему (`npm view`+распакованный тарболл `@tanstack/ai-mcp@0.3.10`, не
          пересказ доки): API почти 1:1 совпадает с нашим `Peer`.

          | Наше (`web-core/mcp/src/peer`) | TanStack (`@tanstack/ai-mcp`) |
          |---|---|
          | `httpPeer(url, info?)` | `createMCPClient({ transport: { type: "http", url, headers? } })` |
          | `stdioPeer(command, args?, {env?})` | `createMCPClient({ transport: stdioTransport({ command, args?, env?, cwd? }) })` — `stdioTransport` из `@tanstack/ai-mcp/stdio`, Node-only подпуть (то же разделение, что у нас `stdioPeer`) |
          | `Peer.callTool(name, args)` | `MCPClient.callTool(name, args)` — ТА ЖЕ сигнатура, тот же тип ответа (`Awaited<ReturnType<Client['callTool']>>`, тот же `@modelcontextprotocol/sdk` — `ai-mcp@0.3.10` зависит от `@modelcontextprotocol/sdk@^1.29.0`, той же линии SDK, что и наш `web-core/mcp`) |
          | `Peer.close()` | `MCPClient.close()` (+ `[Symbol.asyncDispose]` — можно `await using`, апгрейд, которого у нас не было) |
          | `env` не задан — SDK сам даёт обрезанный безопасный набор | то же самое поведение — тот же `StdioClientTransport` под капотом, наш довод про supply-chain (chrome-devtools-mcp — чужой процесс) переносится без изменений |

          Значит перенос механический на уровне вызовов `callTool`/`close` — логика `browser.ts`
          (regex-парсинг `pageId` из текстового списка, `textOf(content)`) не меняется вообще, она
          про формат ответа chrome-devtools-mcp, не про то, чей клиент его вызвал.

          Открыто (решить при реализации, не архитектура): где живёт новый код — предложение:
          подпуть `@web-core/neurobox/mcp` (тот же зонтик "всё, что на @tanstack/ai-*", которым
          сейчас является этот пакет), но само имя подпути не зафиксировано, решает владелец/user.

      - id: browser-wrapper-ported
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "createBrowser (web-core/mcp/src/browser) переезжает на новый MCP-клиент"
        description: |
          `createBrowser` (newPage/navigate/screenshot/snapshot/click, обёртка над
          `chrome-devtools-mcp` через `stdioPeer`) — зависит от `peer-replaced-by-ai-mcp-client` выше,
          переносится тем же заходом: единственное, что меняется в теле функции — конструктор клиента
          (`stdioPeer("npx",[...])` → `createMCPClient({transport: stdioTransport({command:"npx",
          args:[...]})})`), сама логика вызовов тулов chrome-devtools-mcp не трогается.

      - id: mcp-migration-consumers
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Потребители /peer и /browser — на новый импорт, старые не трогать до переключения"
        description: |
          Два реальных места зовут сегодняшний `web-core/mcp/src/peer`/`/browser`, оба вне этого
          пакета — переключить оба, когда перенос выше готов:
          - движок браузера в MCP-сервере зоны скинов — тонкая обёртка над `createBrowser`
            (путь к Chrome приходит переменной окружения), меняется только импорт.
          - скрипт выкладки того же сервера — `stdioPeer("pnpm",["start"])` (спавнит СВОЙ
            локальный сервер, доверенный процесс — `env: process.env` передаётся явно, как и сегодня)
            + `httpPeer(<адрес боевого сервера>)` — оба зовутся напрямую, не через обёртку браузера.
          `web-core/mcp/src/peer`/`/browser` НЕ удалять, пока оба потребителя не переключены и не
          проверены живьём — не оставлять зону без рабочего пути посередине переноса.

      - id: mcp-remainder-after-peer-migration
        type: decision
        status: Superseded
        priority: null
        milestone: null
        name: "ОТМЕНЕНО — см. server-tools-relocated/transport-relocated/pagination-relocated/zone-feedback-relocated"
        description: |
          Была ошибка архитектора, не решение user: он спутал «TanStack не умеет строить
          MCP-сервер» (правда) с «значит register-tool/transport не могут переехать в
          web-core/neurobox» (не следует вообще). Технической причины держать их именно в
          web-core/mcp нет — это наш код на @modelcontextprotocol/sdk, ему всё равно, в каком
          пакете лежать. User поправил это прямым текстом 2026-09-13, третий раз за разговор.
          Правильный план — ниже, новая категория.

  - category: "Полный перенос остатка web-core/mcp → web-core/neurobox (после — удаление web-core/mcp целиком)"
    items:
      - id: server-tools-relocated
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "registerTool/ok/err (web-core/mcp корень) → @web-core/neurobox/server"
        description: |
          `registerTool` (обязательные `access`-annotations, input/output как настоящие Zod-схемы
          через `@modelcontextprotocol/sdk`), `ok()`/`err()` (конверт ответа по спеке MCP). Зависит
          только от `@modelcontextprotocol/sdk` и `@web-core/io` (`z`) — ни одной зависимости на
          `web-core/mcp` как пакет, переезд — перенос файлов + правка импортов внутри них, не
          переписывание логики. Новый подпуть `@web-core/neurobox/server` (имя обсуждаемо).
          Тесты `web-core/mcp/test/register-tool.test.ts` переезжают тем же приёмом, что
          `test/mcp.test.ts` (полное зеркало, не общий файл — так уже сделано для peer).

      - id: transport-relocated
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createServer (web-core/mcp/transport) → @web-core/neurobox/server (или свой подпуть)"
        description: |
          Бутстрап stdio/Streamable HTTP (`createServer`), сессии по `mcp-session-id`,
          `auth`/`host`/`allowedHosts`/`allowedOrigins` хуки. Зависит от `node:http`/`node:crypto`
          и `@modelcontextprotocol/sdk` — опять же ни одной зависимости на пакет `web-core/mcp`
          как таковой. Открыто (поверхность, не архитектура): один подпуть `/server` вместе с
          `register-tool`, или отдельный `/transport`, как было в оригинале — решает владелец.
          Тесты `web-core/mcp/test/transport.test.ts` переезжают тем же приёмом (реальный
          `StreamableHTTPClientTransport` на поднятый сервер, не мок).

      - id: pagination-relocated
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "paginate/limitSchema (web-core/mcp/pagination) → @web-core/neurobox/pagination"
        description: |
          Курсорная пагинация листингов + общий `limitSchema` (`max(100)`, не голый
          `z.number().positive()` — иначе в JSON Schema утекает предельное целое языка). Зависит
          только от `@web-core/io`. Самый маленький и самый чистый перенос из всех — ни MCP-протокол,
          ни TanStack тут вообще не при чём, чистая утилита.

      - id: zone-feedback-relocated
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "reportFeedback/listFeedback/resolveFeedback (web-core/mcp/feedback) → свой подпуть, НЕ смешивать с sendNeuroboxFeedback"
        description: |
          ⚠️ Не то же самое, что `@web-core/neurobox`'s уже существующий `sendNeuroboxFeedback` —
          та ручка про «как работал бокс» (`POST /api/feedback/{threadId}` бокса), эта — про «как
          сработал ОДИН MCP-тул зоны» (GraphQL к схеме службы хранения пресетов, зовётся
          из тулов `report_feedback`/`list_feedback`/`resolve_feedback` MCP-сервера зоны). Обе
          сущности реальны и обе нужны, имена/подпуть должны развести их явно (например
          `@web-core/neurobox/zone-feedback`, не `/feedback` — этот слот уже занят смыслом бокса) —
          решает владелец при реализации, здесь фиксируется только НЕЛЬЗЯ смешивать.

      - id: mcp-package-fully-retired
        type: decision
        status: Backlog
        priority: High
        milestone: null
        name: "web-core/mcp удаляется ЦЕЛИКОМ — после переноса выше И переключения потребителей"
        description: |
          Порядок (user, 2026-09-13): сначала `web-core/neurobox` становится полным — весь список
          выше плюс уже сделанные `peer`/`browser` — только ПОТОМ MCP-сервер зоны скинов переводится
          на новые импорты (`mcp-migration-consumers`, отдельное ТЗ, другая зона), и только когда оба
          реальных потребителя (движок браузера того сервера и скрипт его выкладки) переключены и
          проверены живьём — `web-core/mcp` удаляется целиком, без остатка. Не начинать правку той
          зоны до готовности `web-core/neurobox`.

  - category: "Механика тулов — @web-core/neurobox/tool (наследник дисциплины register-tool: access обязателен)"
    items:
      - id: tool-definition-mechanic
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "toolDefinition() — общая обёртка над @tanstack/ai, не про skin и не про какой-либо конкретный пакет"
        description: |
          Контекст (архитектор и user, 2026-09-13, живой разбор в чате): деление на три слоя —
          (1) МЕХА — как вообще устроен тул, живёт здесь, в `@web-core/neurobox`, не привязана ни
          к одному продуктовому пакету; (2) ПАКЕТ (`web-core/skin` и любой другой) — знает только
          свой вход-выход, экспортирует голую функцию + готовый `toolDefinition()` вокруг нЕё
          (схему своего контракта пакет знает лучше всех, это не решение потребителя); (3) ЗОНА
          АПП — решает, какой НАБОР тулов реально открыть агенту и с каким описанием, потому что
          только апп знает, что видит юзер («агент = юзер, 99% случаев» — user, дословно).
          Пакеты остаются абстрактными, не привязанными к конкретному апп — это НЕ пересматривается,
          апп-специфичный выбор живёт в апп-зоне, не здесь.

          Проверено по реальным тайпингам `@tanstack/ai@0.54.0`, не по памяти
          (`activities/chat/tools/tool-definition.d.ts`): `ToolDefinitionConfig` несёт
          `metadata?: Record<string, unknown>` — сюда наша обёртка кладёт обязательный `access`
          (`"read" | "write" | "destructive"`, та же дисциплина, что была у `registerTool` —
          находка изначального аудита MCP-сервера зоны скинов, где ни один тул её не нёс, не теряем её
          при переезде на новый фундамент). `.server(execute)` возвращает объект с `execute`
          внутри — `tool.execute(args)` для MCP-обёртки реально вызывает функцию напрямую, не
          выдуманный API.

          Набросок формы (обсуждено в чате, не финальный код):
          ```ts
          import { toolDefinition as tsToolDefinition } from "@tanstack/ai";

          export function toolDefinition<In, Out>(def: {
            name: string;
            description: string;
            access: "read" | "write" | "destructive"; // обязателен, не опционален
            inputSchema: In;
            outputSchema: Out;
          }) {
            return tsToolDefinition({ ...def, metadata: { access: def.access } });
          }
          ```
          Открыто при реализации: подпуть — предложение `/tool`, не зафиксировано; как читать
          `access` обратно из `metadata` типобезопасно на стороне MCP-обёртки (`registerTool` в
          `@web-core/neurobox/server` ждёт узкий union, `metadata` типизирован как
          `Record<string, unknown>` у вендора) — решает владелец.


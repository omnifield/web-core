  - category: "Правки после ревью бокса (2026-09-14) — connect() пропускает clientTools туда, откуда ответ нечем вернуть"
    items:
      - id: client-tools-passthrough-bug
        type: bug
        status: Done
        priority: Critical
        milestone: null
        name: "connection.ts:60 — tools: runContext?.clientTools ?? [] живьём ломает клиентские тулы бокса"
        description: |
          Найдено ревью бокса, дословно: «Вчера строка была безобидной: бокс `tools` игнорировал.
          Сегодня — нет. Всё, что TanStack положит в `clientTools`, бокс объявит агенту настоящей
          ручкой». Сценарий поломки — ровно тот, что архитектор и user разбирали в чате раньше (см.
          `tool-mechanic-design-agreed`/переписку про «свои ручки в браузере» из протокола
          бокса), но вывод тогда НЕ был записан пунктом роадмапа — эта строка осталась с самого
          первого коммита `connect()` (`run-agent-input-shape`), до того как стало известно про
          механизм клиентских тулов бокса вообще:

          1. Кто-то регистрирует `.client()`-тул штатно через `useChat({tools: [...]})`.
          2. `runContext.clientTools` уносит его в `tools[]` конверта — бокс объявляет агенту.
          3. Агент зовёт — ход замирает, ждёт `POST /agent/{threadId}/tool/{toolCallId}`.
          4. Но никто его не шлёт: `ChatClient` идёт СВОИМ путём —
             `addToolResult()`→`checkForContinuation()`→новый `streamResponse()`→новый `POST
             /api/agent` (та самая механика, разобранная раньше в этом же файле, `chat-client.js`).
          5. Бокс: `409` («поток ждёт результат ручки приложения») — новая, недавно добавленная
             защита с их стороны поймала то, что раньше тихо повисло бы до `tool-abandoned`.

          В пакете сегодня НЕТ НИ ОДНОГО `POST /tool/`-вызова вообще — обвязки для клиентских тулов
          бокса не существует, а канал для них уже открыт голым `clientTools`-проксированием.

          РЕШЕНИЕ (согласовано раньше в чате, не пересматривается): `tools[]` НЕ берётся из
          `runContext.clientTools`. `createNeuroboxConnection` получает свою опцию (например
          `clientTools`) — список `{name, description, inputSchema, execute}`, которые:
          - объявляются в `tools[]` САМИ (не через `runContext.clientTools`);
          - НЕ регистрируются в `useChat`'s штатном `tools`-механизме вообще — `ChatClient` не
            должен знать об их существовании как о «своих» тулах, иначе попробует штатный путь;
          - исполнение и доставка результата — целиком внутри `connect()`: поймать
            `TOOL_CALL_START`/`ARGS`/`END` по имени из СВОЕГО списка, исполнить, `POST
            /api/agent/{threadId}/tool/{toolCallId}`, дальше читать тот же ещё открытый поток —
            та же механика, что уже реализована для `/cancel` (`cancel-request-wired-into-connect`),
            тот же приём (свой `AbortController`, не переиспользовать чужой сигнал, там же
            актуально и для таймаута `client_tool_deadline_seconds`).

      - id: threadid-fail-loud
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "threadId: runContext?.threadId ?? generateId(\"thread\") — тихая подстановка прячет забытый threadId"
        description: |
          Найдено ревью бокса: `connection.ts:53`. Если `threadId` не пришёл — каждое сообщение
          заводит НОВЫЙ поток тихо, выглядит рабочим. По факту: процесс агента холодный на каждый
          ход, состояние MCP-зон (вкладка браузера) теряется каждый раз, расход не сходится по
          `threadId` (`/spent` считает по потоку). РЕШЕНИЕ: бросать, не подставлять — отсутствие
          `threadId` это ошибка конфигурации потребителя пакета, не штатный случай со своим
          поведением по умолчанию.

      - id: context-value-narrow-to-string
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "NeuroboxContextEntry.value: unknown — протокол несёт строку, не что угодно"
        description: |
          Найдено ревью бокса: реальный конверт бокса несёт `context: [{description, value}]` со
          `value` СТРОКОЙ (пример в его документации — `"value": "button"`). Тип пакета сегодня
          `value: unknown` — пропускает мимо TypeScript объект/число, которые бокс примет и
          отклонит `422` уже на проводе, не на компиляции. Сузить до `string`.

log:
  - id: box-review-bugs-fixed
    type: bug
    date: 2026-09-14
    summary: >
      Все три находки ревью бокса реализованы одним заходом. `client-tools-passthrough-bug`
      (Critical): `connection.ts`'s `tools[]` больше НЕ читает `runContext.clientTools` вообще —
      новая опция `createNeuroboxConnection({ clientTools: [{name, description, parameters,
      execute}] })`, объявляется в `tools[]` сама, `useChat`'s штатный `tools`-механизм про эти
      ручки не знает (не даём `ChatClient` пробовать свой путь доставки параллельно с нашим).
      Исполнение — новый `deliverClientToolResults()`, обёртка-генератор вокруг
      `parseNeuroboxEventStream`: кадры уходят наружу как есть (`yield` до разбора), при этом ловит
      `TOOL_CALL_START`/`ARGS`/`END` по имени из своего списка, копит `delta`, на `END` исполняет
      `execute()` и шлёт `POST /api/agent/{threadId}/tool/{toolCallId}` — та же механика и та же
      ловушка, что у `/cancel` (свой `AbortController`/таймаут — `toolResultTimeoutMs`, не
      переиспользует входной `abortSignal`), но в отличие от `sendCancel` ошибку доставки НЕ
      глотает (бросает из `connect()`) — недоставленный результат бокс ждёт до `tool-abandoned`,
      это достаточно серьёзно. Ошибка внутри `execute()` — другое дело, едет боксу как
      `{failed: true}`, не роняет `connect()`.
      `threadid-fail-loud` (Medium): `requireThreadId()` бросает вместо `?? generateId("thread")` —
      `runId` по-прежнему автогенерируется (свежий `runId` на ход безвреден, вредно повторение
      `threadId`).
      `context-value-narrow-to-string` (Medium): `NeuroboxContextEntry.value: unknown` → `string`.
      Оговорка в FAQ.md — `connect()`'s `data`-параметр типизирован вендором как
      `Record<string, any>`, так что сужение реально форсируется только там, где потребитель явно
      типизирует объект как `NeuroboxContextEntry` (включая внутренний cast в
      `buildNeuroboxRunInput`), не на каждом вызове `connect()` — честно зафиксировано, не выдано
      за большее, чем есть.
      Тесты — `test/connection.test.ts`: threadId бросает и НЕ шлёт fetch; `NeuroboxContextEntry`
      с `value: 42` — `@ts-expect-error`, тип действительно не пропускает; свои `clientTools` едут
      в `tools[]`, `runContext.clientTools` НЕ едет; полный живой сценарий доставки — `TOOL_CALL_
      START/ARGS/ARGS/END` → `execute()` с правильно собранными args → `POST /tool/{id}` с верным
      телом → продолжение того же потока (`TOOL_CALL_RESULT`/`RUN_FINISHED` после doPOST, кадры на
      выходе в правильном порядке); отдельно — `execute()` кидает → `{failed: true}` с текстом
      ошибки, не падение `connect()`. Итог: 76/76 (было 71), `pnpm typecheck`/`lint`/`build` —
      зелёные. Git по-прежнему только чтение.


  - id: tool-definition-mechanic-implemented
    type: feature
    date: 2026-09-14
    summary: >
      `tool-definition-mechanic` реализован (user: "супер! погнали!"). Оба открытых вопроса решены
      владельцем: подпуть — `@web-core/neurobox/tool` (предложенное имя подтверждено, не изменено);
      чтение `access` обратно из `metadata` — отдельная функция `accessOf()` в том же модуле,
      структурно типизированная (`{ metadata?: Record<string, unknown> }`), не завязанная на
      конкретное имя типа вендора (`ToolDefinitionInstance`/`ServerTool`/`ClientTool`/их `Any*`
      варианты — все несут `metadata` через общий `Tool`, сверено чтением `types.d.ts`, не по памяти).
      `src/tool/index.ts`: `toolDefinition(options)` — тонкая обёртка над `@tanstack/ai`'s
      `toolDefinition()`, требует `access` (не опционален — та же дисциплина, что была у
      `registerTool` до переезда на `@tanstack/ai`), кладёт в `metadata`. Approval-поля вендора
      (`needsApproval`/`approvalSchema`) сознательно НЕ проброшены — не было в запросе, решение
      зафиксировано в FAQ.md, не молчаливый пробел. `accessOf()` бросает на отсутствующем/неверном
      `access`, не отдаёт `undefined` — та же дисциплина, что у `registerTool`, не даём дыре
      сдвинуться на шаг дальше по цепочке. `@tanstack/ai` переведён из фантомной (была доступна
      только через `@tanstack/ai-client`/`@tanstack/ai-mcp`, использовалась структурно без прямого
      импорта — тот же приём, что раньше для `StreamChunk`/`MCPClient`) в прямую зависимость: здесь
      её типы (`ToolDefinition`/`ToolDefinitionConfig`/`SchemaInput`) именуются напрямую в публичной
      сигнатуре, структурный обход больше не годится.
      Тесты — `test/tool.test.ts`: `access` в `metadata` после `toolDefinition()`, сохраняется через
      `.server(execute)` (включая реальный вызов `execute` с проверкой результата) и `.client()`,
      `accessOf()` читает все три уровня access, бросает на пустом/неверном значении.
      Сознательно НЕ сделано (не входило в этот пункт, читается из описания трёхслойного деления):
      никакого моста между `toolDefinition()`-построенным тулом и `registerTool()` из
      `@web-core/neurobox/server` — это решение апп-зоны (`app-zone-tool-registry`, Low, не сейчас) о
      том, ЧЕРЕЗ ЧТО регистрировать тул агенту (MCP-сервер или клиентские тулы бокса), не задача
      меха-слоя. Итог: 71/71 (было 65), `pnpm typecheck`/`lint`/`build` — зелёные, `dist/tool.js`+
      `dist/tool.d.ts` собираются. Git — по-прежнему только чтение, ничего не закоммичено.


  - id: adapter-flow-two-way-and-l3
    type: plan
    date: 2026-09-10
    summary: >
      Обсуждение с user: флоу адаптеров из Lab. Схема — самостоятельный ресурс (скелет чужого
      ответа: ключи + тип, без значений, берётся из образца ответа ручки OpenAPI). Адаптер —
      дочерний ресурс СХЕМЫ, не компонента: жизненный цикл идёт за схемой (удалили схему —
      адаптер удалился, адаптировать больше нечего), на одну схему вешается сколько угодно
      адаптеров под разные компоненты. Компонент про адаптеры не знает — только свой
      `entity/io.ts`. Связь поле-в-поле в обе стороны (приём/отдача) человек пишет РУКАМИ
      отдельно на каждую сторону — второе направление НЕ выводится машиной разворотом первого.
      Это сняло вопрос «как развернуть `round()`/неоднозначный `dictionary`» — его в такой модели
      просто нет, `applyFieldRules` уже пригоден для обеих сторон, нужно только перестать считать
      `encode` производной `decode`. Записаны [[field-rules-two-way]] (L2, ближайшее) и уточнена
      конкретика [[l3-restructuring]] (следующий слой, после стабилизации L2) — три функции
      (`discoverRowSets`/`discoverRowPaths`/обёртка над `collectFieldRuleReport`) переносятся из
      `products/tables/src/adapter/paths.ts` (снят `ae8b4f1`) тем же приёмом, каким уже переехал
      `steps.ts`.

      ЗА ГРАНИЦЕЙ пакета (явно, чтобы не поймать смешение слоёв): хранение схемы/адаптера как
      персистентных ресурсов с жизненным циклом, Lab-страница, привязка к бэку пресетов
      (`backend/presets`, седьмой kind рядом с assembly/content/form/outfit/palette/tag,
      см. [[backend-presets-zone-direct-work]] в памяти architect) — отдельный трек ПОСЛЕ того как
      движок преобразований (`web-core/io`) стабилен. Решение user: фундамент прежде следующего
      слоя, слой прежде хранения.


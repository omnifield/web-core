log:
  - id: package-scaffolded
    type: plan
    date: 2026-09-12
    summary: >
      Заявка началась с конкретной боли user: форма правки данных компонента в
      `apps/skin/src/widgets/component/input` работает, но "выглядит крайне плохо", и это не
      разовый кейс — предстоит много правок JSON, нужен отдельный пакет-движок. Разобрали и
      отбросили react-jsonschema-form/JSONForms/Formily (React/Vue/Angular, не Solid), затем
      Formisch (Valibot-lock-in) и jsfe (не для продакшена) — см. `formisch-rejected`/
      `jsfe-rejected`. Остановились на `@tanstack/solid-form`: Solid уже есть в семье вендоров
      (router/query), schema-agnostic через Standard Schema. По прямой просьбе user пакет заведён
      без отдельной ветки/PR, заполнен по образцу `web-core/router`/`web-core/query`. Содержания
      не было — это стало открытой работой owner-сессии, см. категории выше.

  - id: role-pivot-tree-validator
    type: decision
    date: 2026-09-12
    summary: >
      Первый заход owner-сессии прочитал роль узко — «мост между `apps/skin/…/input/schema.ts` и
      `createForm`». User развернул рамку: `@web-core/form` — вторая нога механики assembly
      (дерево→рендер), только дерево→ВАЛИДАТОР. Разбор — чтение `web-core/assembly/src/engine/*`
      (tree.ts, self-assembly.ts, registry.ts, compose.ts, nesting.ts, coordinate.ts,
      render/props.ts) и `web-core/skin/src/engine/passport/form/passport.ts` +
      `web-core/ui/src/{accordion,field}/entity/passport.ts` +
      `web-core/ui/src/shared/utils/skin-life.ts`. Свёрено с user: базовый кейс tree→validator, не
      schema→tree; адресация путём, не nodeId; переиспользование правил — НЕ по типу узла
      (`selfAssembly`-параллель), это позже отклонено отдельно (см. следующую запись).

  - id: type-level-default-rejected-on-example
    type: decision
    date: 2026-09-12
    summary: >
      После закрытия массивов чужой инфрой (`array-paths-closed-by-assembly-infra`) architect
      предложил пример: `Field` с типом `email` на паспорте, дефолт растёт по типу узла (параллель
      `selfAssembly`). User отверг на месте: «филду вообще пофиг что в него пишут, емэйл или
      телефон... для этого я и хочу форм движок... какой смысл от форм движка, если компонент у
      себя в паспорте пишет тип валидатора?». Пример пересобран: правило живёт в io-схеме
      КОНКРЕТНОЙ сборки (Zod, разные схемы у «Регистрации» и «Отписки»), `Field` — один и тот же
      generic-компонент в обеих. Подтверждено: «да чётко, выглядит как надо». Следствие каскадом:
      `reusable-validation-fragments`/`explicit-override-precedence` отклонены,
      `no-tanstack-solid-form` решён тем же заходом (без array-ops вендор не нужен вовсе).
      Отдельно: user поправил размещение хука — «useValidation должен быть внутри useKitLife», не
      рядом отдельным вызовом (`kit-life-validation-fold-in`).

  - id: market-check-conditional-forms
    type: research
    date: 2026-09-12
    summary: >
      User указал на дыру: «пробросили валидаторы, инпут покраснеет — а кто скажет кнопке не
      нажиматься?» — открыл вопрос про производное состояние (disable/hide одного узла по значению
      другого), которое user описал как «валидатор валидаторов» и назвал главной причиной, зачем
      вообще смотрели на движок форм, а не просто на покраску текста. Сверка рынка перед новой
      механикой (канон): JSONForms `rule: {effect: HIDE|SHOW|ENABLE|DISABLE, condition: {scope,
      schema}}` — висит на UI-schema-элементе, condition переиспользует JSON Schema
      (jsonforms.io/docs/uischema/rules); SurveyJS `visibleIf`/`enableIf`/`requiredIf` — своя
      expression-грамматика, наследуется по дереву (surveyjs.io/.../conditional-logic); JsonLogic
      — JSON-язык условий, заявлен разработчиками под «делить правила фронт/бэк, хранить в БД»
      (jsonlogic.com, github.com/jwadhams/json-logic-js); JSON Schema 2020-12
      `if/then/else`/`dependentRequired`/`dependentSchemas` и Zod `.superRefine()` (с
      `ctx.addIssue({path})`) — межполевая ВАЛИДНОСТЬ уже несётся самой схемой, отдельного
      движка под неё не заводят нигде (learnjsonschema.com; медиум-разбор Zod refinements).
      Вывод, подтверждённый user: рынок разводит валидность (в схеме, бесплатно и здесь тоже —
      `single-schema-no-separate-layer`) и производное UI-состояние (отдельный слой на дереве
      композиции — `node-level-rule-for-derived-state`, JsonLogic предложен как язык условия).

      Отдельно: user спросил про владение — кто пишет саму схему с `.superRefine` и сами
      JsonLogic-правила, если ни assembly (не знает про пароли), ни skin, ни form не должны знать
      домен. Разобрано по аналогии с тем, как assembly уже разводит движок/контент (`registry`
      подаётся снаружи, дерево — JSON, редактируемый нетехническим человеком) —
      `engine-vs-content-ownership`: form владеет МЕХАНИКОЙ, схему/правила КОНКРЕТНОГО модуля
      пишет тот же автор, что уже пишет `bind`/`props`/дерево этого модуля, не один из трёх
      движков. При разборе куда кладётся `rule` нашлась находка: `AssemblyElement.meta` уже
      существует и уже доезжает до компонента пропом (`render-node.tsx`) — `web-core/assembly`
      можно вообще не трогать (`node-level-rule-for-derived-state`).

      Дальше user спросил про способ использования — нашли прямую параллель с
      `web-core/skin/src/solid/` (framework-agnostic ядро + `connection.ts` на `createSignal`/
      `createMemo` + `provider.tsx` с контекстом и хуками `useComponentSkin`/`useComponentSkinData`/
      `useOutfitData`) — `solid-adapter-mirrors-skin`: та же трёхслойная структура, с прямыми
      парами хуков. `useFormValid()`/`useTreeIssues()` (парой к `useOutfitData()`) заодно закрыл
      вопрос про кнопку — агрегат по всему дереву, не по одному пути.

      Итог сессии: файл переписан начисто (без слоёных правок поверх старых формулировок) для
      передачи user'у на обсуждение с architect.

  - id: architect-review-props-bind-hole
    type: decision
    date: 2026-09-13
    summary: >
      Architect прочитал `ROADMAP.yaml`+`TEST_EXAMPLE.md` целиком и проверил опорные факты чтением
      кода, не поверил на слово (`meta` на `AssemblyElement` и параллель с `web-core/skin/src/
      solid/` — подтвердил построчно). Нашёл реальную дыру: `useComponentValidation` в примере
      читал `props.bind?.value`, чтобы узнать свой путь — такого пропа не существует.
      `resolveBind` (`web-core/assembly/src/render/props.ts:14-25`) резолвит `bind` в готовое
      ЗНАЧЕНИЕ до рендера, путь потребляется и выбрасывается; `identityProps`
      (`render-node.tsx:33-37`) даёт только `"data-node"` (id узла дерева, не путь в данных).
      Компонент физически не мог узнать свой адрес — вся цепочка «покраснеть, если невалидно»
      останавливалась на этом месте. Architect предложил лечить дублированием пути в
      `meta.validationPath`, сам же назвал минус — два источника правды, тихий разъезд при правке
      одного без другого.

      Взято решение получше, без второго поля: `"data-node"` доезжает до компонента как обычный
      JS-проп (не только DOM-атрибут) — `useComponentValidation` берёт id узла оттуда, ищет его в
      `tree`, который `ValidationProvider` и так держит целиком, и читает путь `bind?.value` ИЗ
      ДЕРЕВА, не из пропов компонента (`component-identity-via-node-id`). `web-core/assembly`
      по-прежнему не трогаем — заявление в роадмапе не отменяется, просто механизм другой, чем в
      черновике.

      По мелочи architect также поймал: `evaluateRule(rule, {})` в примере — данных неоткуда
      взять, `ValidationContext` должен нести `data` рядом с `issuesByPath` (поправлено в
      `solid-connection-and-provider`); `ctx.addIssue` без `code: "custom"` не скомпилируется на
      zod@4.4.3 (поправлено в `TEST_EXAMPLE.md`); и главное по существу — JsonLogic под ОДИН
      показанный пример (простое равенство) признан забегом вперёд, взяли минимальный `{path,
      equals}` без новой зависимости, JsonLogic отложен до реального составного условия
      (`condition-language-narrowed`, `json-logic-dependency` переведён в Low/отложенный).

  - id: jsonlogic-reversal-and-mechanics-shipped
    type: plan
    date: 2026-09-13
    summary: >
      Две вещи одной сессией. Первое — `condition-language-narrowed` пересмотрен и отклонён
      ОБРАТНО: user указал, что «не строй свою механику без реального кейса» и «есть либа — бери
      её» — два разных правила одного канона (`.claude/agents/shared-policy.md`, «Сверка с
      рынком»), я их смешал, согласившись на architect-предложенное сужение. `{path, equals}` —
      само по себе изобретение маленького фрагмента JsonLogic вместо взятия готового — второе
      правило запрещает именно это. Плюс инфраструктурный довод: вся адресация дерева и так
      JSON/path-based, составное условие — не гипотетический, а типовой случай. JsonLogic возвращён
      в `node-level-rule-for-derived-state`/`node-rule-evaluation`, `json-logic-dependency` —
      обратно High, «брать сейчас».

      Второе — user дал добро («работаем все в дев ветки, комить свою зону») на реализацию всей
      категории «Механика» (не cross-zone часть). Сделано и подтверждено прогоном (не только
      написано): `src/engine/validate.ts`+`rules.ts` (framework-agnostic), `src/solid/
      connection.ts`+`provider.tsx` (Solid-обвязка), `@tanstack/solid-form` снесён,
      `json-logic-js`+`@web-core/assembly` добавлены в зависимости. Побочная находка при сборке —
      `tsc`-сборка (как у `router`/`query`/`store`) не годится для пакета с реальным `.tsx`
      (`provider.tsx` — первый такой файл здесь), переведено на `vite build` через `@web-core/
      build/vite` `defineLibraryConfig`, тем же приёмом, что уже используют `skin`/`assembly` —
      разбор в `drop-tanstack-vendor`. 10 тестов (`test/engine.test.tsx`, `test/solid.test.tsx`),
      `pnpm lint`/`typecheck`/`build`/`test` — все зелёные, README/FAQ обновлены под факт.

      НЕ сделано в этой сессии (осталось `Backlog`, cross-zone): `kit-life-validation-fold-in`
      (правка `web-core/ui`), `passport-validation-field-open-question` (сверка с владельцем
      `skin`), `json-logic-dependency` как формальное решение architect (в коде уже взят —
      предложение architect'у подтвердить, не откатывать), `field-invalid-errortext-wiring`,
      `consumer-migration`. Не коммичено — коммит следующим шагом этой же сессии.

  - id: checkbox-bind-key-bug
    type: decision
    date: 2026-09-13
    summary: >
      Architect прогнал реализацию реально (не на слово): `pnpm --filter @web-core/form test` —
      10/10, lint/typecheck чистые, build собирается, форма `issue.path`
      (`PropertyKey | {key: PropertyKey}`) у Standard Schema сверена с установленным `zod@4.4.3`
      построчно — совпадает. Но нашёл настоящий баг, не стилистику: `useComponentValidation`
      читал путь узла как `node.bind?.value` — жёстко предполагая, что путь всегда лежит под
      ключом `value`. Работает для `Field`, но `Checkbox` (`@ark-ui/solid`, `checked: boolean`, не
      `value`) бинжен как `{checked: path}` — ровно как в собственном `TEST_EXAMPLE.md` этого же
      пакета (`bind: { checked: "/subscribeNewsletter" }`). `node.bind?.value` для такого узла —
      всегда `undefined`, чекбокс НИКОГДА не получил бы свои issues, даже если для него объявлена
      валидация. Оба теста (`test/solid.test.tsx`, `test/engine.test.tsx`) проверяли только
      `value`-узлы — пробел был не виден собственным прогоном. Architect верно назвал причину:
      реализация молча выбрала ответ на ещё не решённый `passport-validation-field-open-question`
      (какой пропс компонент считает своим значением), хотя сама роадмап называет `Checkbox`
      среди первых кандидатов на эту ось.

      Исправлено БЕЗ хардкода конкретных имён пропсов (`value`/`checked`/...) и без ответа на
      cross-zone вопрос: `ownValuePathOf(node)` берёт ЕДИНСТВЕННЫЙ ключ `node.bind`, каким бы ни
      было его имя — один `bind` означает однозначно «та самая точка данных, которую узел
      показывает», несколько ключей — неоднозначно, какой из них считать значением, и без
      ответа от `passport-validation-field-open-question` не разрешить — код честно возвращает
      `undefined` (нет issues), не гадает. Добавлен regression-тест
      (`test/solid.test.tsx` — узел с `bind: {checked: path}`, до и после исправления значения).
      Подтверждено прогоном: 11/11 тестов, `pnpm lint`/`typecheck`/`build` зелёные.
      `TEST_EXAMPLE.md` поправлен тем же приёмом (был источником бага — свой же пример
      противоречил своему же коду).

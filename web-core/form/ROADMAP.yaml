# Дорожная карта @web-core/form — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у web-core/router/web-core/query/web-core/store (categories → items, log — журнал решений).
#
# Пакет заведён 2026-09-12 архитектором по прямой просьбе user, повод был узкий: форма правки
# данных компонента в `apps/skin/src/widgets/component/input` (`schema.ts`+`fields.tsx`) работает,
# но "выглядит крайне плохо". РОЛЬ ПАКЕТА С ТЕХ ПОР ПЕРЕСМОТРЕНА и обсуждена вживую с user —
# полный разбор в `log`. Этот файл — рамка ТЕКУЩЕГО понимания (не история споров, история — в
# `log`), с которой user идёт к architect на составление ADR/плана по зонам (`web-core/skin`,
# `web-core/ui`) — сам `@web-core/form` эти зоны не трогает и не решает за них, только называет,
# что ему от них нужно.

categories:
  - category: Роль и архитектура
    items:
      - id: role-tree-to-validator-projection
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Роль пакета — проекция дерево×схема→валидность, зеркало assembly (дерево→рендер)"
        description: |
          `@web-core/form` — не обёртка над состоянием инпутов (первый заход, отклонён), а вторая
          нога той же механики, что `@web-core/assembly`: assembly даёт дерево+байндинг+реестр и
          рисует чужой компонент (README `@web-core/assembly` — "средство, а не решение", не хранит
          своих правил); `@web-core/form` даёт дерево+байндинг+io-схему и производит чужую
          валидность/UI-состояние. Базовый кейс — `tree → validator`: готовая сборка (assembly) уже
          собрана, диспатч наружу и приём данных уже работают, это не трогаем. Не хватает именно
          того, что нельзя прописать в самом дереве рендера один раз — валидность и производные
          UI-состояния различаются от использования к использованию одного и того же дерева/узла.

      - id: single-schema-no-separate-layer
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Один источник валидности на сборку — io-схема целиком, отдельного 'layer'-артефакта нет"
        description: |
          Результат валидности индексируется путём в данных (JSON Pointer — та же форма, что
          `bind`/`value.path` у `AssemblyElement`/`AssemblyContent`, `web-core/assembly/src/engine/
          tree.ts`), НЕ `nodeId`: валидность — свойство данных, не конкретного узла, который их
          показывает. Но отдельно АВТОРИЗУЕМОЙ карты «путь → валидатор» не существует — источник
          один: Zod-схема КОНКРЕТНОЙ сборки (`@web-core/io`), та же, что описывает её данные.

          Схема валидируется ЦЕЛИКОМ, одним вызовом Standard Schema (`schema["~standard"]
          .validate(data)`), а не по листьям независимо — это отличие принципиально: межполевые
          правила (`z.object({password, confirm}).superRefine((data, ctx) => { if (...)
          ctx.addIssue({ path: ["confirm"], ... }) })`) живут ВНУТРИ схемы и приписывают issue
          любому пути, даже не совпадающему с тем, что проверялось. Проекция просто группирует
          вернувшиеся issues по `path`, оставляя только пути, реально забинженные в этой сборке.
          Межполевая валидность закрывается БЕСПЛАТНО — новый механизм под неё не нужен, схема
          и так это умеет (сверено рынком — Zod `.superRefine`, JSON Schema `if/then/else`/
          `dependentSchemas`, см. `market-check-conditional-forms` в `log`).

          Пример (свёренный с user): сборка «Регистрация» — `email` обязателен по умолчанию у Zod.
          Сборка «Отписка» — `email: z.string().email().optional()`. Один и тот же generic `Field`,
          один и тот же `bind: { value: "/email" }` в обеих — судьбу решает СХЕМА КОНКРЕТНОЙ сборки,
          не тип узла, не паспорт компонента.

      - id: reusable-validation-fragments
        type: decision
        status: Rejected
        priority: High
        milestone: null
        name: "Правило по типу узла (параллель selfAssembly) — отклонено, категориальная ошибка"
        description: |
          Рассматривалась параллель с `growSelfAssembly` (`web-core/assembly/src/engine/
          self-assembly.ts`) — правило валидности растёт по ссылке на `type` узла, объявленное раз
          на паспорте компонента. Отклонено user'ом на примере: «филду вообще пофиг что в него
          пишут, емэйл или телефон... для этого я и хочу форм движок» — иначе пришлось бы заводить
          `FieldEmail`/`FieldPhone` отдельными компонентами, что противоречит headless-киту.

          Категориальная ошибка: `selfAssembly` — факт о САМОМ КОМПОНЕНТЕ, не меняется между
          использованиями. Валидность — факт о ДАННЫХ конкретной сборки, один и тот же `Field` в
          разных сборках стоит на разных путях разных схем. Переиспользование остаётся — просто на
          другой оси (схема сборки, не тип узла), см. `single-schema-no-separate-layer`.

      - id: explicit-override-precedence
        type: decision
        status: Rejected
        priority: Medium
        milestone: null
        name: "Явное переопределение дефолта — вопрос снят вместе с самой идеей дефолта"
        description: |
          Существовал только как следствие `reusable-validation-fragments` (отклонён): без общего
          дефолта, растущего по типу узла между сборками, — нечего перебивать, у каждой сборки своя
          схема с самого начала, конфликта источников не возникает.

      - id: array-paths-closed-by-assembly-infra
        type: decision
        status: Rejected
        priority: High
        milestone: null
        name: "Пути внутри массивов — закрыты чужой инфрой (repeat/recur), своя техника не нужна"
        description: |
          Первая версия предполагала, что `AssemblyTree` статичен и массивы — отдельная забота этого
          пакета. Проверка была неполной. По факту `repeat`/`recur`
          (`web-core/assembly/src/engine/expand.ts:baseAssemblyOf`) — рабочий механизм: по реальным
          данным массива дерево разворачивается в узлы с уже АБСОЛЮТНЫМИ путями на каждый элемент
          (`/items/0/name`, `/items/1/name`, …) до того, как до них доходит проекция валидности.
          Реордер данных — забота того, кто редактирует сами данные (потребитель, не этот пакет).
          Отдельной адресации массивов в `@web-core/form` не нужно — обычный путь, обычный резолв.

      - id: node-level-rule-for-derived-state
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Производное UI-состояние (hide/disable) — отдельный механизм, правило на узле дерева"
        description: |
          Кейс «чекбокс выключен → поле задизейблено/блок скрыт» — НЕ валидность (Zod не умеет
          «спрячь ДРУГОЙ узел», issue — это только про значение по пути) и не одно и то же с
          `single-schema-no-separate-layer`. Рынок разводит эти два явления везде, где смотрели
          (сверка 2026-09-12, разбор — `market-check-conditional-forms` в `log`): JSON
          Schema/Zod несёt чистую валидность в самой схеме, а видимость/доступность — ВСЕГДА
          отдельный слой, привязанный к дереву композиции, не к схеме данных (JSONForms — `rule`
          на UI-schema-элементе; SurveyJS — `visibleIf`/`enableIf`/`requiredIf`).

          Решение: `rule` — поле УЗЛА assembly-дерева (`{ effect: HIDE|SHOW|ENABLE|DISABLE, vars:
          Record<name, path>, when: <JsonLogic> }`), тем же адресом, что `bind`/`props`/`on` у
          `AssemblyElement`. `vars` резолвится через `resolveDataBinding` (уже есть в assembly),
          `when` — предикат JsonLogic (см. `json-logic-dependency` ниже — предложение architect'у,
          брать сейчас, не откладывать: `condition-language-narrowed` рассмотрен и отклонён).

          Находка, снимающая лишний cross-zone шаг: `AssemblyElement` УЖЕ несёт свободный
          `meta?: Readonly<Record<string, unknown>>` (`web-core/assembly/src/engine/tree.ts`),
          переживающий правки (`edits.ts`) и доезжающий до рендерящегося компонента буквально
          пропом `meta` (`web-core/assembly/src/render/render-node.tsx:86,98,113` — `get meta()
          { return node()?.meta }`). `rule` кладётся в `node.meta.rule` — `web-core/assembly`
          трогать НЕ нужно вообще, он уже пронёс бы что угодно опознаваемое здесь. Cross-zone
          остаётся только `web-core/ui` (компонент читает `props.meta?.rule`) — не «ещё одна зона»
          вдобавок к skin/ui, ассembly в разговор не входит.

      - id: component-identity-via-node-id
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Компонент узнаёт СВОЙ путь не из своих пропов — bind туда не доезжает"
        description: |
          Дыра, найденная architect'ом при проверке черновика построчно (`props.ts`/
          `render-node.tsx`), не абстрактно: `resolveBind` (`web-core/assembly/src/render/
          props.ts:14-25`) резолвит `bind: {value: "/email"}` в ГОТОВОЕ значение
          (`{value: "test@test.com"}`) — путь потребляется и выбрасывается ДО того, как компонент
          что-либо увидит. `identityProps` (`render-node.tsx:33-37`) даёт только `"data-node"` →
          `node.id` (id УЗЛА дерева, например `"email"`) — это адрес дерева, не адрес данных, их
          нельзя перепутать. Значит `props.bind?.value` внутри компонента — проп, которого не
          существует; первая версия примера (`TEST_EXAMPLE.md`) на этом ломалась молча.

          Отклонённый вариант (предложен architect'ом как минимальный, но признан ЦЕНОЙ дублирования):
          класть путь ВТОРОЙ РАЗ в `meta.validationPath` рядом с `bind`. Минус, названный тут же:
          два источника правды на один путь — автор модуля меняет `bind`, забывает `meta`, ошибка
          валидации тихо перестаёт показываться, и никто не узнает почему.

          Взятое решение — БЕЗ второго поля и БЕЗ правки assembly: `"data-node"` — не только
          DOM-атрибут, это обычный JS-проп, мёрджится в пропы компонента ДО `dropAddress`
          (значит `useKitLife`/`useComponentValidation` его видят). `useComponentValidation` берёт
          `props["data-node"]` (id узла — это работает, проверено), идёт с ним в `tree`, который
          `ValidationProvider` и так держит целиком (см. `solid-connection-and-provider`), и читает
          путь ИЗ ДЕРЕВА: `tree.components.nodes[id].bind?.value`. Путь пишется один раз, там же,
          где и раньше (`bind` в дереве) — второй записи не требуется, `web-core/assembly` не
          трогаем (заявление «assembly в разговор не входит» остаётся верным, просто механизм не
          тот, что был в черновике).

      - id: engine-vs-content-ownership
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Пакет владеет МЕХАНИКОЙ, не контентом — схему/правила конкретного модуля пишет не он"
        description: |
          Прямая параллель с тем, как уже устроен сам assembly: `web-core/assembly/src/engine/*`
          не несёт ни байта домена — какие компоненты существуют, решает `registry`, переданный
          СНАРУЖИ (`createRegistry({ components: { button: kitOf("button"), ... } })`, README
          `@web-core/assembly`), а само дерево — JSON, который «сохраняется, редактируется
          нетехническим человеком, едет по сети» (там же). Домена в самом пакете `assembly` нет.

          Так же и здесь: `@web-core/form` умеет ПРОГНАТЬ схему и СЧИТАТЬ JsonLogic-правило — не
          знает, что такое email, пароль или чекбокс «согласие». Конкретная io-схема с
          `.superRefine` для password/confirm и конкретные `rule` на узлах КОНКРЕТНОГО модуля
          («Регистрация») — контент, который пишет тот же автор, что уже пишет `bind`/`props`/
          состав дерева ЭТОГО модуля (сегодня физически — код зоны, строящей конкретный модуль,
          по образцу `apps/skin/.../input/schema.ts`; после «хранятся в БД» — то же место, куда
          вообще едет JSON дерева модуля). Ни assembly, ни skin, ни form не пишут этот контент.

      - id: solid-adapter-mirrors-skin
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Solid-обвязка — 1:1 по структуре с web-core/skin/src/{wear,solid}"
        description: |
          Framework-agnostic ядро (`growValidatorLayer`, оценка одного `rule`) не видит Solid — как
          `makeSkinSwitch` (`web-core/skin/src/wear/switch.ts`) не видит его. Поверх — `solid/`
          подпуть, тем же приёмом, что `web-core/skin/src/solid/`:
          - `connection.ts` — `createValidationConnection`, реактивная обёртка (`createMemo`
            вместо `createSkinConnection`'s `createSignal` — тут вход не асинхронный, чистая
            проекция от `data`), параллель `SkinConnection`.
          - `provider.tsx` — `ValidationProvider` + хуки, парами с уже существующими:
            `useValidation()` ~ `useSkin()` (сырое соединение); `useComponentValidation(passport,
            props)` ~ `useComponentSkin(passport, props)` — НЕ отдельный вызов, сворачивается ВНУТРЬ
            `useKitLife` (см. `kit-life-validation-fold-in`); `useIssuesAt(path)` ~
            `useComponentSkinData(component)` — по ОДНОМУ пути; `useFormValid()`/`useTreeIssues()`
            ~ `useOutfitData()` — ОДНО значение на всё дерево, не по пути.

          Последний хук закрывает старый открытый вопрос «кто скажет кнопке не нажиматься»: кнопке
          не нужен свой `bind`-путь, ей нужен агрегат по всему дереву — ровно та роль, которую
          `useOutfitData()` уже играет для скина (наряд целиком, не по компоненту).

      - id: no-tanstack-solid-form
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "@tanstack/solid-form — не берём вообще, пакет не владеет состоянием"
        description: |
          Вендор заводился под headless-состояние формы (пути/dirty/touched/array-ops). Ни одно из
          этого пакету не принадлежит: валидность — стейтлес-проекция (снимок `data` на входе,
          пересчитывается заново, не копится); массивы уже разворачивает `repeat`/`recur`
          (`array-paths-closed-by-assembly-infra`) в абсолютные пути ДО проекции; данные и их
          мутацию (кто что вводит, диспатч) уже держит assembly+потребитель — это работает и без
          нас. Пакет никогда не зовёт `createForm` — тащить целый стейт-менеджер ради этого нельзя
          (канон — «ноль зависимостей это сила», лишнее не тянем). Снос — отдельный пункт работы,
          см. `drop-tanstack-vendor`.

  - category: Механика (пакет строит сам, без чужой зоны)
    items:
      - id: validator-layer-projection
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "growValidatorLayer(tree, schema, data) → Record<путь, issues[]>"
        description: |
          Обход `AssemblyTree` (тот же обход, что рендер — `bind` элементов и `value.path`
          content-узлов, `web-core/assembly/src/render/props.ts:resolveBind`) собирает пути,
          реально забинженные в этой сборке. Один вызов `schema["~standard"].validate(data)` на
          схему сборки целиком (не по листьям — см. `single-schema-no-separate-layer`), issues
          группируются по `path`, оставляются только забинженные в дереве. Результат — что с ним
          делать (подсветить, заблокировать) решает потребитель, не этот пакет.

          Сделано: `src/engine/validate.ts` — `growValidatorLayer`+`collectBoundPaths`+`pathOf`
          (JSON Pointer с экранированием `~0`/`~1`, `issue.path`-сегменты — `PropertyKey` либо
          `{key}`, по Standard Schema спеке). Async-схемы (`~standard.validate` вернул `Promise`) —
          явный `throw`, не молчаливое «нет issues». Подтверждено: `test/engine.test.tsx` (4 теста
          — невалидный путь, валидные данные, межполевой `superRefine` на чужой путь, путь вне
          дерева отсекается), `pnpm lint`/`typecheck`/`build` зелёные.

      - id: node-rule-evaluation
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "evaluateRule(rule, data) → { hidden?, disabled? } — по одному узлу, лениво"
        description: |
          В отличие от валидности (один вызов на всю схему сборки), правило — локальное: у узла
          есть СВОЙ `rule` (лежит в `node.meta.rule`, см. `node-level-rule-for-derived-state`),
          отдельного обхода всего дерева не нужно. `vars` резолвятся `resolveDataBinding` по путям
          из `rule.vars`, `when` считается JsonLogic (`jsonLogic.apply(rule.when, vars)`, см.
          `json-logic-dependency`). Эффект (`HIDE`/`SHOW`/`ENABLE`/`DISABLE`) превращается в
          `{hidden, disabled}`. Вызывается там же, где узел читает свою валидность — на
          компоненте, через `useComponentValidation`.

          Сделано: `src/engine/rules.ts` — `evaluateRule`, `NodeRule.when` типизирован
          `RulesLogic<AdditionalOperation>` из `@types/json-logic-js` (не `unknown` — реальный тип
          библиотеки). Подтверждено: `test/engine.test.tsx` (HIDE/SHOW/DISABLE), `pnpm lint`/
          `typecheck`/`build` зелёные.

      - id: condition-language-narrowed
        type: decision
        status: Rejected
        priority: Medium
        milestone: null
        name: "Условие правила — {path, equals} вместо JsonLogic — рассмотрено и отклонено обратно"
        description: |
          Промежуточный заход: architect указал, что JsonLogic под единственный показанный пример
          («если чекбокс снят») — целый язык условий ради одного равенства, и предложил сузить до
          `{path, equals}` без новой зависимости. Согласился, но ошибочно — user поправил: это
          смешение двух разных правил канона (`.claude/agents/shared-policy.md`, «Сверка с
          рынком»). Правило «не строй свою механику, пока нет реального кейса» — про НАШИ
          собственные механики (`reusable-validation-fragments`/`explicit-override-precedence`
          отклонены именно так, там реального кейса не было вообще). Правило «есть готовая
          библиотека — берём её, не изобретаем свою» — про случай, когда решение уже НАЙДЕНО
          рынком (JsonLogic и есть такой случай, сверка — `market-check-conditional-forms`).
          `{path, equals}` — это и есть «изобретаем своё», только маленький фрагмент готового
          JsonLogic, вместо того чтобы взять сам JsonLogic — ровно то, что второе правило запрещает.

          Довод по существу, не только по канону: вся инфра дерева уже JSON/path-адресована
          (`bind`, `DispatchAction.context`) — составное условие («И чекбокс, И роль») не
          гипотетический случай на потом, а типовая форма реального модуля. Ждать, пока он
          появится, нет смысла — решение отменено, `node-level-rule-for-derived-state`/
          `node-rule-evaluation` возвращены к JsonLogic, `json-logic-dependency` — предложение
          architect'у брать СЕЙЧАС, не откладывать.

      - id: solid-connection-and-provider
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "createValidationConnection + ValidationProvider + хуки"
        description: |
          Реализация `solid-adapter-mirrors-skin`: `connection.ts` держит РЕАКТИВНО от `data` —
          `issuesByPath` (`createMemo` вокруг `validator-layer-projection`) И сам `data` (акцессор
          прокидывается в контекст как есть, не только производный результат — без этого
          `node-rule-evaluation` внутри провайдера нечем вызывать, находка architect'а на примере
          `evaluateRule(rule, {})` в черновике `TEST_EXAMPLE.md`). `provider.tsx` — контекст на
          поддерево + `useValidation`/`useIssuesAt`/`useFormValid`.

          `useComponentValidation` (внутренний, для `kit-life-validation-fold-in`) СВОЙ путь узнаёт
          НЕ из пропов компонента (`component-identity-via-node-id` — `props.bind` туда не
          доезжает): читает `props["data-node"]` (id узла — доезжает, это обычный DOM-атрибут-проп),
          ищет этот id в `tree.components.nodes` (тот же `tree`, что провайдер и так держит целиком)
          и берёт путь ОТТУДА — `ownValuePathOf(node)`, единственный ключ `node.bind`, каким бы ни
          было его имя (не жёстко `.value` — см. правку от 2026-09-13 ниже, `checkbox-bind-key-bug`
          в `log`). `rule` — читается напрямую из `props.meta?.rule` (это поле в пропы доезжает,
          проверено чтением `render-node.tsx`, дублирующего лукапа не нужно). Вместе с
          `useIssuesAt(найденного пути)` — единый акцессор `{ invalid?, errorText?, disabled?,
          hidden? }`.

          Сделано: `src/solid/connection.ts`+`src/solid/provider.tsx`+`src/solid/index.ts`.
          `ValidationProvider` читает `tree`/`schema`/`data` через `untrack(() => props.x)` (тот же
          приём, что `SkinProvider` — `web-core/skin/src/solid/provider.tsx`, и требование
          eslint-plugin-solid `solid/reactivity`). Подтверждено: `test/solid.test.tsx` (4 теста —
          issues по `data-node` (value-узел), issues по `data-node` с НЕ-value ключом bind
          (checkbox), `rule`-hide реактивно на смену `data`, `useFormValid` агрегат),
          `pnpm lint`/`typecheck`/`build`/`test` зелёные.

      - id: drop-tanstack-vendor
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Снести @tanstack/solid-form из package.json и src/engine/index.ts"
        description: |
          Действие по итогам `no-tanstack-solid-form`: убрать зависимость из `dependencies`,
          заменить голый `export * from "@tanstack/solid-form"` в `src/engine/index.ts` реальным
          содержимым пакета (`validator-layer-projection`/`node-rule-evaluation`). Пакет перестаёт
          быть «обёрткой над TanStack Form» в любом смысле — имя `@web-core/form` остаётся (домен —
          валидация форм), родства с этим вендором не несёт.

          Сделано, плюс незапланированное следствие: `@tanstack/solid-form` снесён,
          `json-logic-js`+`@types/json-logic-js`+`@web-core/assembly` добавлены (реально нужны
          новому содержимому). Побочная находка — сборка (`tsc -p tsconfig.build.json`, как у
          `router`/`query`/`store`) не годится: `src/solid/provider.tsx` первый `.tsx`-файл пакета,
          `jsx: "preserve"` эмитит `provider.jsx`, а `solid/index.ts` импортирует `./provider.js` —
          путь не резолвится. `router`/`query`/`store` этой проблемы не имеют, потому что у них
          вообще нет `.tsx` в `src/`. Решение — тот же приём, что `@web-core/skin`/`@web-core/
          assembly` (у обоих есть `.tsx`): `vite build` через `@web-core/build/vite`
          `defineLibraryConfig` (`vite.config.ts`, entries `index`+`solid` с `solid: true`),
          `tsconfig.build.json` снесён (не используется, как и у `skin`). `package.json`
          `exports["./solid"]` — плоские `dist/solid.{js,d.ts,jsx}` (не `dist/solid/index.js`) —
          формат, который реально выдаёт `defineLibraryConfig` (проверено чтением `web-core/build/
          src/vite/library.ts`, не предположено). Подтверждено: `pnpm build` — `dist/index.js`,
          `dist/solid.js`+`.jsx`+`.d.ts` все на месте, предупреждения «treating as external» —
          сверены с `pnpm --filter @web-core/skin run build`, тот же паттерн, не поломка.

  - category: Cross-zone — ведёт architect (form только называет, не решает)
    items:
      - id: kit-life-validation-fold-in
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "useKitLife возвращает акцессор валидации — ТРЕТЬЕ, что он делает, одним вызовом"
        description: |
          Правка `web-core/ui/src/shared/utils/skin-life.ts`: `useKitLife` (сегодня `void`, 35
          вызывающих во всём `web-core/ui` — сверено `grep -rl "useKitLife(" web-core/ui/src`)
          перестаёт быть `void` — возвращает акцессор `useComponentValidation`
          (`solid-connection-and-provider`). Аддитивно для 34 из 35: они звали
          `useKitLife(passport, props);` как statement, TS не требует использовать возврат.
          Компоненты с объявленным `invalid`-состоянием (`Field`, вероятно `Select`/`Checkbox`/
          `RadioGroup` — сверить по `states` в паспортах) реально деструктурируют результат.

          НЕ отдельный хук рядом с `useKitLife` (первая версия) — user поправил прямо: «useValidation
          должен быть внутри useKitLife», один вызов на компонент, как и был всегда.

      - id: passport-validation-field-open-question
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Нужно ли вообще новое поле на ComponentPassport — открытый вопрос владельцу skin"
        description: |
          Ось валидации НЕ несёт домен-правило («это email, вот так валидно») — правило целиком в
          io-схеме и `rule` конкретной сборки (`engine-vs-content-ownership`), не на паспорте
          компонента. Что легитимно может остаться на `ComponentPassport`
          (`web-core/skin/src/engine/passport/form/passport.ts`) — черновая мысль, НЕ решение:
          СТРУКТУРНЫЙ факт «эта часть умеет показывать invalid/errorText», того же рода, что уже
          несут объявленные `states` (`web-core/ui/src/field/entity/passport.ts` — `invalid`/
          `required`/`readonly` с CSS-метками `data-invalid` и т.п.). Открытый вопрос: нужно ли
          вообще НОВОЕ поле паспорта, или `kit-life-validation-fold-in` обходится уже объявленными
          `states`/`parts`, не заводя третью структуру рядом. Называется architect'у на сверку с
          владельцем `skin`, не решается здесь.

      - id: json-logic-dependency
        type: feature
        status: Backlog
        priority: High
        milestone: null
        name: "json-logic-js как зависимость — предложение брать СЕЙЧАС, решение за architect"
        description: |
          Не откладываем (`condition-language-narrowed` — отклонённая попытка сузить до
          `{path, equals}`, признана изобретением своего вместо готового): предикат для
          `node-level-rule-for-derived-state` — JsonLogic, JSON-нативный, рассчитан на хранение
          в БД и обмен фронт/бэк (jsonlogic.com, сверка рынка 2026-09-12, `market-check-
          conditional-forms` в `log`), адресация `{"var": "путь"}` структурно та же, что уже
          резолвит `DispatchAction.context` в assembly (несколько путей в один объект перед
          вызовом) — переиспользование приёма, не новый язык с нуля. Вся инфра дерева и так
          JSON/path-адресована — составное условие не гипотетический кейс, типовая форма
          реального модуля. По канону зависимость в поставку — решение architect, этот пакет
          предлагает и обосновывает, сам не тянет.

      - id: field-invalid-errortext-wiring
        type: feature
        status: Backlog
        priority: Medium
        milestone: null
        name: "Первая нагрузка оси — реально выставить invalid/required/errorText у Field"
        description: |
          Крючок уже стоит пустой: `web-core/ui/src/field/entity/passport.ts` объявляет
          `invalid`/`required`/`errorText`/`requiredIndicator` с CSS-метками, но `<Field invalid
          required errorText>` — родные пропы `FieldRootProps` (Ark) — сегодня никто не
          выставляет по результату валидации. Как только `kit-life-validation-fold-in`+
          `validator-layer-projection` готовы — `Field` читает возврат `useKitLife(passport,
          props)` и передаёт `invalid`/`errorText` в `ArkRoot`: первый видимый эффект новой оси.

      - id: consumer-migration
        type: feature
        status: Backlog
        priority: Low
        milestone: null
        name: "apps/skin/…/input переезжает — последний шаг, не первый"
        description: |
          `apps/skin/src/widgets/component/input/{schema.ts,fields.tsx,index.tsx}` (зона
          `assembly`) — узкий повод, с которого пакет начался, остаётся последним шагом:
          переезжать не на что, пока ось и проекция не готовы. Отдельная заявка зоне `assembly`,
          этот пакет её сам не пишет.

  - category: Не сделано
    items:
      - id: render-was-never-ours
        type: decision
        status: Rejected
        priority: Low
        milestone: null
        name: "Свой рендер полей — не строим, это никогда не было нашей ролью"
        description: |
          Рендер дерева (в т.ч. дерева ввода) уже полностью умеет `@web-core/assembly`
          (`RenderTree`+`registry`) поверх компонентов `@web-core/ui`. `@web-core/form` не рисует
          ничего никогда — отдаёт `путь → issues` и `nodeId → {hidden, disabled}`, дальше решает

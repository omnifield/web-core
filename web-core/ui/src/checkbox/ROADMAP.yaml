# Дорожная карта чекбокса — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс сверен целиком (2026-09-04) — единственный настоящий пробел: чекбокс не умеет
# работать как часть группы (общее имя поля, общий список выбранных значений, ограничение
# максимума) — см. категорию «Не построено».

categories:
  - category: Основа
    items:
      - id: tri-state
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Три состояния (отмечен/не отмечен/отчасти)
        description: |
          Означает: обычная отметка плюс третье состояние для чекбокса, суммирующего частично
          отмеченных потомков — два независимых индикатора, каждый показывается только для
          своего состояния.
          Реализация: обычное поведение компонента, проверено тестом.

      - id: form-participation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Настоящее поле формы
        description: |
          Означает: `name`/`value` делают чекбокс родным `<input type="checkbox">` для `FormData`
          — отправка формы подхватывает его без дополнительной обвязки.
          Реализация: скрытый `<input>`, который кладёт сам корень — потребителю добавлять не
          нужно и нельзя, адреса не несёт, наружу не экспортируется.

  - category: Не построено
    items:
      - id: checkbox-group
        type: feature
        priority: High
        milestone: null
        size: M
        name: Группа чекбоксов
        description: |
          Означает: управление набором чекбоксов как ОДНИМ целым — общее имя поля для формы,
          общий управляемый/неуправляемый массив выбранных значений, ограничение на максимум
          выбранных сразу.
          Реализация: компонент этого не умеет вовсе — не отдельная настройка, которую забыли
          включить, а целиком отсутствующая возможность.

# Журнал решений.
log:
  - id: group-is-a-real-gap-not-scope-decision
    type: question
    date: 2026-09-04
    summary: >
      Групповой режим — реальный, честно named пробел, не тихо отложенное решение. Не решено,
      строить ли его сейчас или оставить открытым пунктом — оставляю вопросом, не строю без спроса.

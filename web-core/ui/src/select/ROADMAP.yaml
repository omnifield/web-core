# Дорожная карта селекта — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# НЕ полностью прямой проброс, как listbox — корень принимает плоский массив `items`, не готовую
# коллекцию, коллекция строится и мемоизируется внутри. Остальной пропс-серфейс проброшен
# насквозь, сверено 2026-09-04.

categories:
  - category: Основа
    items:
      - id: single-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Одиночный выбор
        description: |
          Означает: клик по пункту выбирает его, список закрывается сам.
          Реализация: готовое состояние компонента, обвязка своя, проверено тестом (включая
          регрессию — второй цикл открыть/выбрать подряд).

      - id: multiple-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Множественный выбор
        description: |
          Означает: `multiple` — клик добавляет пункт к выбору, не заменяет; список остаётся
          открытым; текст значения показывает выбранные через запятую.
          Реализация: готовый проп компонента, проверено тестом.

      - id: item-groups
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Группы пунктов
        description: |
          Означает: связанные пункты под одной подписью группы, отдельно от плоского списка.
          Реализация: готовые части компонента, обвязка своя.

  - category: Тонкая настройка
    items:
      - id: deselectable
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Снятие выбора повторным кликом
        description: |
          Означает: `deselectable` (только для одиночного выбора) позволяет снять выбор кликом по
          уже выбранному пункту — та же идея, что `deselectable` у toggle-group, но для селекта.
          Реализация: готовый проп компонента — технически проброшен, НЕ проверен отдельным
          тестом при аудите 2026-09-04.

      - id: close-on-select
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Не закрывать список после выбора
        description: |
          Означает: `closeOnSelect={false}` держит список открытым после выбора даже в одиночном
          режиме — обычно список закрывается сам сразу после клика.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

# Журнал решений.
log:
  - id: not-fully-direct-collection-transform
    type: plan
    date: 2026-09-04
    summary: >
      В отличие от accordion/avatar/toggle-семьи, здесь `SelectProps` НЕ равен пропсам компонента
      напрямую — `items` (плоский массив) заменяет `collection` (готовую структуру), которую
      компонент строит и мемоизирует сам внутри. Та же схема, что у `listbox`. Остальной
      пропс-серфейс — прямой проброс, сверен инструментом.

  - id: two-unverified-props-honestly-noted
    type: plan
    date: 2026-09-04
    summary: >
      Тот же довод, что у slider: `deselectable`/`closeOnSelect` технически доступны через прямой
      проброс типа, но не добавлены в README/тесты при этом аудите — эмпирическая проверка каждого
      не уложилась в проход. Честно отмечено как непроверенное, не выдуман пример без проверки.

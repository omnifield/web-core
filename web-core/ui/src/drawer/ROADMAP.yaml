# Дорожная карта шторки — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс почти полный — каждая из десяти частей принимает свои пропсы напрямую
# напрямую, сверено 2026-09-04. Единственный настоящий пробел —
# визуальная координация нескольких вложенных шторок, кит для неё вовсе не даёт компонентов (см.
# ниже, категория «Не построено»).

categories:
  - category: Основа
    items:
      - id: swipe-direction
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Выезд с любого края
        description: |
          Означает: `swipeDirection` — с какого края шторка выезжает и куда закрывается свайпом,
          `"start"`/`"end"` переводятся в физическую сторону по направлению письма.
          Реализация: готовый проп компонента. По умолчанию (`down`) проверено тестом, остальные
          три направления технически проброшены тем же пропом — отдельно не проверены при этом
          аудите.

      - id: multiple-triggers
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько триггеров на одну шторку
        description: |
          Означает: несколько `DrawerTrigger` с разными `value` делят одну шторку — клик по любому
          открывает её и помечает себя как `current` (`data-current`), какой из них её открыл.
          Реализация: готовый проп компонента, проверено тестом.

      - id: snap-points
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Точки привязки
        description: |
          Означает: `snapPoints`/`defaultSnapPoint`/`snapPoint` — промежуточные высоты, между
          которыми можно перетащить шторку за ручку, не просто открыть/закрыть полностью.
          Реализация: готовый проп компонента — технически проброшен, НЕ проверен отдельным
          тестом при аудите 2026-09-04 (требует симуляции реального жеста).

      - id: modal-toggle
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Немодальная шторка
        description: |
          Означает: `modal={false}` разрешает взаимодействовать с остальной страницей, пока шторка
          открыта — вместе со `swipeArea` даёт повторно открыть закрытую шторку свайпом с края.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

      - id: content-draggable-toggle
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Отключение перетаскивания за содержимое
        description: |
          Означает: `draggable={false}` на `DrawerContent` разрешает тащить шторку ТОЛЬКО за
          `grabber`, не за произвольное место внутри содержимого — не задокументирован в README на
          момент аудита.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: nested-drawer-stack-visuals
        type: feature
        priority: Medium
        milestone: null
        name: Визуальный стек вложенных шторок
        description: |
          Означает: когда одна шторка открывает другую поверх себя, нижняя должна визуально
          отступить и притемниться (тот же эффект, что у стопки карт).
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — паспорт УЖЕ объявляет состояния
          `nested-drawer-open`/`nested-drawer-swiping` и переменную `--nested-drawers` на
          `content` (появляются сами, как только шторки вложены), но кит не даёт ни одного
          компонента для координации этого визуала — без них у потребителя нет способа реально
          собрать сценарий с вложенными шторками, чтобы эти состояния вообще появились.

# Журнал решений.
log:
  - id: full-surface-with-one-named-gap
    type: plan
    date: 2026-09-04
    summary: >
      Десять частей — прямой проброс пропсов один в один, тот же паттерн, что у accordion/avatar/
      toggle-семьи. Но проверка пропс-серфейса вскрыла отсутствие компонентов для координации
      нескольких вложенных шторок — тот же класс находки, что unwrapped `CheckboxGroup` у
      чекбокса, только здесь пробел мешает реализовать состояния, которые паспорт УЖЕ заявляет
      (`nested-drawer-open`/`nested-drawer-swiping`). Честно вынесено отдельной категорией, не
      смешано с «Основой».

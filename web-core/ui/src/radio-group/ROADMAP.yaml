# Дорожная карта набора радио-кнопок — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный, каждая часть типизирована как свой проп напрямую, сверено целиком
# 2026-09-04. Тот же пропс-серфейс, что у `segment-group` — оба ведут себя идентично (см.
# `segment-group/README.md`'s `[!NOTE]`).

categories:
  - category: Основа
    items:
      - id: single-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Один выбранный пункт
        description: |
          Означает: клик по пункту выбирает его, скользящий указатель едет к нему, предыдущий
          выбранный снимается.
          Реализация: готовое состояние компонента, проверено тестом.

      - id: orientation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Столбец или строка
        description: |
          Означает: `orientation` — пункты выстроены в столбец или в ряд, от этого зависит, какими
          стрелками клавиатура двигает выбор.
          Реализация: настоящая настройка паспорта (`defineSettings`), адресована рецептом.

  - category: Тонкая настройка
    items:
      - id: per-item-disabled-invalid
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Отключение/невалидность одного пункта
        description: |
          Означает: `disabled`/`invalid` прямо на `RadioGroupItem` переопределяют это ДЛЯ ОДНОГО
          пункта, не для всего набора — набор остаётся кликабельным, недоступен только этот пункт.
          Реализация: готовый проп компонента — `disabled` проверено тестом, `invalid` тем же
          механизмом, отдельно не проверено при этом аудите.

      - id: external-form
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Привязка к стороннему `<form>`
        description: |
          Означает: `form` на корне связывает скрытые радио-инпуты пунктов с формой ВНЕ их
          собственного DOM-предка по её `id` — тот же нативный HTML-механизм, что у обычного
          `<input form="...">`.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

# Журнал решений.
log:
  - id: full-prop-surface
    type: plan
    date: 2026-09-04
    summary: >
      Каждая часть принимает свои пропсы один в один, включая `RadioGroupItem`. Проверка не
      вскрыла ни одного незавёрнутого соседнего компонента — весь публичный API уже покрыт картой
      кита. Тот же пропс-серфейс, что у `segment-group` (общее поведение) — находки этого аудита
      (per-item disabled/invalid, `form`) зеркальны находкам `segment-group/ROADMAP.yaml`, не
      переоткрыты заново вслепую.

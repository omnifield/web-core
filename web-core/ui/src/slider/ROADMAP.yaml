# Дорожная карта слайдера — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный, проверен на 2026-09-04. Фичового бэклога нет.

categories:
  - category: Основа
    items:
      - id: single-thumb
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Один бегунок (управляемый/неуправляемый)
        description: |
          Означает: обычный управляемый/неуправляемый паттерн (`value`/`defaultValue`/
          `onValueChange`), тот же принцип, что у остальных компонентов кита.
          Реализация: готовое состояние компонента, обвязка своя.

      - id: range-thumbs
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Диапазон — несколько бегунков сразу
        description: |
          Означает: несколько значений в одном массиве — по одному бегунку на каждое, каждый
          независимо двигается и фокусируется.
          Реализация: готовый механизм компонента, проверено тестом.

      - id: markers
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Деления шкалы со своим состоянием позиции
        description: |
          Означает: `marker` знает своё положение относительно текущего значения (ниже/на нём/
          выше) — честный факт о позиции, не о взаимодействии.
          Реализация: готовое состояние компонента, проверено тестом.

  - category: Тонкая настройка диапазона
    items:
      - id: min-steps-between-thumbs
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Минимальный зазор между бегунками
        description: |
          Означает: `minStepsBetweenThumbs` не даёт бегункам диапазона сойтись ближе заданного
          расстояния друг к другу.
          Реализация: готовый проп компонента — технически проброшен полным типом, НЕ проверен
          отдельным тестом при аудите 2026-09-04 (сложнее однозначно проверить, чем обычный булев
          проп — оставлено честно неверифицированным, не описано как испытанное).

      - id: thumb-collision-behavior
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Поведение бегунков при столкновении
        description: |
          Означает: `thumbCollisionBehavior` решает, что происходит, когда бегунки диапазона
          сталкиваются — не могут пройти друг сквозь друга (по умолчанию), толкают друг друга, или
          меняются местами.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

      - id: origin
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Откуда закрашивается дорожка
        description: |
          Означает: `origin` решает, от какого края закрашивается дорожка для одиночного значения
          — от начала (обычное абсолютное значение), от центра или от конца (относительное
          смещение).
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: live-value-context
        type: feature
        priority: Low
        milestone: null
        name: Чтение текущего значения изнутри без управляемого состояния
        description: |
          Означает: способ достать текущее значение слайдера прямо там, где стоит `SliderValueText`,
          не заводя собственное управляемое состояние (`value`/`onValueChange`) в приложении.
          Реализация: компонент этого не даёт — сейчас единственный путь получить живой текст
          значения — держать значение управляемым самостоятельно.

# Журнал решений.
log:
  - id: no-forward-roadmap-full-surface
    type: plan
    date: 2026-09-04
    summary: >
      Тот же довод, что у остальных компонентов кита на прямом прообе: весь пропс-серфейс
      проброшен 1:1. У слайдера заметно больше нетривиальных пропов, чем у соседей
      (`minStepsBetweenThumbs`, `thumbCollisionBehavior`, `origin`, `thumbAlignment`) — все
      технически доступны через прямой проброс типа, но три из них НЕ были добавлены в
      README/тесты при этом аудите: глубже проверять каждый эмпирически не позволило время,
      честнее оставить их отмеченными как неверифицированные, чем придумать пример без проверки.

  - id: readme-example-crossed-kit-boundary
    type: plan
    date: 2026-09-04
    summary: >
      Пример «живой текст значения» раньше показывал прямой доступ к внутреннему состоянию в обход
      кита — заменён на управляемый паттерн (`value`/`onValueChange`), который кит и так полностью
      поддерживает. Прямой доступ к внутреннему состоянию — честно вынесен как отсутствующая
      возможность выше, не задокументирован как обходной путь.

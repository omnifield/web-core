# Дорожная карта переключателя-сегментов — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный, каждая часть типизирована как свой проп напрямую, сверено целиком
# 2026-09-04.

categories:
  - category: Основа
    items:
      - id: single-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Один выбранный сегмент
        description: |
          Означает: клик по сегменту выбирает его, скользящая пилюля едет к нему, предыдущий
          выбранный снимается — та же машина, что у radio-group.
          Реализация: готовое состояние компонента, проверено тестом.

      - id: orientation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Строка или столбец
        description: |
          Означает: `orientation` — сегменты выстроены в ряд или в столбец, от этого зависит,
          какими стрелками клавиатура двигает выбор.
          Реализация: настоящая настройка паспорта (`defineSettings`), адресована рецептом.

  - category: Тонкая настройка
    items:
      - id: per-item-disabled-invalid
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Отключение/невалидность одного сегмента
        description: |
          Означает: `disabled`/`invalid` прямо на `SegmentGroupItem` переопределяют это ДЛЯ ОДНОГО
          сегмента, не для всего набора — набор остаётся кликабельным, недоступен только этот
          сегмент.
          Реализация: готовый проп компонента — `disabled` проверено тестом, `invalid` тем же
          механизмом, отдельно не проверено при этом аудите.

      - id: external-form
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Привязка к стороннему `<form>`
        description: |
          Означает: `form` на корне связывает скрытые радио-инпуты сегментов с формой ВНЕ их
          собственного DOM-предка по её `id` — тот же нативный HTML-механизм, что у обычного
          `<input form="...">`.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

# Журнал решений.
log:
  - id: full-prop-surface
    type: plan
    date: 2026-09-04
    summary: >
      Каждая часть принимает свои пропсы один в один, включая `SegmentGroupItem`. Проверка не
      вскрыла ни одного незавёрнутого соседнего компонента — весь публичный API уже покрыт картой
      кита.

  - id: shares-radio-group-behavior
    type: plan
    date: 2026-09-04
    summary: >
      Анатомия и вся логика ведут себя идентично `radio-group` (см. `[!NOTE]` в README). Метки
      состояний унаследованы дословно, не переоткрыты — расхождение между этим файлом и
      `radio-group/ROADMAP.yaml` означало бы фактическую ошибку в одном из них, не намеренное
      решение.

# Дорожная карта пикера даты — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Каждая ЧАСТЬ анатомии (25 штук) принимает свои пропсы напрямую один в один, сверено целиком
# 2026-09-04. Но программного доступа к состоянию машины и своего способа создать значение даты
# кит не даёт вовсе — см. категорию «Не построено» ниже.

categories:
  - category: Основа
    items:
      - id: single-range-multiple
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Одна дата, диапазон, несколько дат
        description: |
          Означает: `selectionMode` переключает пикер между одной датой, диапазоном «от — до» (два
          `DatePickerInput`) и набором отдельных дат (`maxSelectedDates` ограничивает количество).
          Реализация: готовое состояние компонента, базовый режим (`single`) проверен тестом;
          `range`/`multiple` документированы примерами, отдельно не проверены функциональным
          тестом при этом аудите.

      - id: value-text-placeholder-render
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Готовый текст значения — плейсхолдер, разделитель, своя разметка на дату
        description: |
          Означает: `DatePickerValueText` сам форматирует выбранные даты текстом (`placeholder`
          пока пусто, `separator` между несколькими), либо принимает `children` рендер-пропом — по
          одной дате за раз, с `remove()` для конкретно этой даты. Не был показан примером README
          до этого аудита.
          Реализация: готовый проп/паттерн компонента, `placeholder` проверен тестом; `separator`
          и рендер-проп с `remove()` — тем же механизмом, отдельно не проверены.

      - id: month-year-views
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Виды месяца и года
        description: |
          Означает: `viewTrigger` переключает сетку день → месяц → год и обратно, `minView`/
          `maxView` ограничивают, до какого вида можно углубиться/подняться.
          Реализация: готовое поведение компонента — технически проброшено, не проверено
          отдельным тестом при аудите 2026-09-04.

  - category: Тонкая настройка
    items:
      - id: min-max-unavailable
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Ограничение диапазона и точечная недоступность дат
        description: |
          Означает: `min`/`max` жёстко ограничивают выбираемый диапазон, `isDateUnavailable`
          исключает отдельные даты внутри него (например, выходные).
          Реализация: готовый проп компонента — технически проброшен, документирован примером,
          отдельно не проверен тестом при аудите 2026-09-04.

      - id: inline-mode
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Инлайн-режим без плавающей панели
        description: |
          Означает: `inline` полностью снимает поведение попапа — `positioner`/`content` остаются
          в потоке страницы всегда, вместо `open`/`closed` несут `data-inline`.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

      - id: week-numbers
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Номера недели
        description: |
          Означает: `showWeekNumbers` добавляет ведущий столбец, который рисуют два реальных,
          отдельно экспортированных компонента (`DatePickerWeekNumberCell`/`HeaderCell`), делящие
          адрес `tableCell` вместо собственного (см. `[!NOTE]` в README).
          Реализация: готовый проп/компоненты — технически проброшены, не проверены отдельным
          тестом при аудите 2026-09-04.

      - id: presets
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Именованные пресеты диапазона
        description: |
          Означает: `presetTrigger` прыгает сразу к именованному диапазону (например, «последние 7
          дней»), не требуя клика по каждой границе диапазона отдельно.
          Реализация: готовая часть компонента — технически проброшена, документирована примером,
          не проверена отдельным тестом при аудите 2026-09-04.

  - category: Не построено
    items:
      - id: imperative-state-access
        type: feature
        priority: Medium
        milestone: null
        name: Императивный доступ к состоянию пикера наружу
        description: |
          Означает: доступ к состоянию машины и методам вроде программного перехода к дате,
          управления фокусом внутри сетки, очистки значения и форматирования — тот же класс
          возможностей, что `carousel` теряет без своего канала состояния.
          Реализация: ЧЕСТНЫЙ пробел, не тихо забытый — компонент умеет всё это внутри себя, но
          кит не даёт наружу ни одного публичного способа до этого состояния достучаться.

      - id: no-own-date-value-constructor
        type: feature
        priority: Low
        milestone: null
        name: Свой способ создать и типизировать значение даты
        description: |
          Означает: `min`/`max`/`value`/`defaultValue` ждут не строку, а значение даты
          определённой формы — кит не даёт ни функции для его создания, ни собственного типа для
          него, README вынужден показывать создание такого значения обходным путём.
          Реализация: ЧЕСТНЫЙ пробел — единственный способ сегодня показан в README как есть, не
          скрыт.

# Журнал решений.
log:
  - id: full-surface-with-two-named-gaps
    type: plan
    date: 2026-09-04
    summary: >
      Каждая из 25 частей анатомии принимает свои пропсы один в один — проверка не вскрыла ни
      одного незавёрнутого соседнего КОМПОНЕНТА (сами `WeekNumberCell`/`WeekNumberHeaderCell` уже
      экспортированы и объяснены в README — реальные, но делят адрес `tableCell`, не отдельная
      часть). Отдельно от частей есть императивный канал состояния, которого кит не даёт вовсе —
      тот же класс находки, что у `carousel`. Отдельно — своего способа создать значение даты у
      кита тоже нет. Оба вынесены отдельной категорией «Не построено».

  - id: value-text-gap-closed
    type: plan
    date: 2026-09-04
    summary: >
      `DatePickerValueText`'s `placeholder`/`separator`/рендер-проп с `remove()` были доступны
      через прямой проброс типа, но не показаны ни одним примером README до этого аудита —
      добавлен пример и тест на `placeholder`.

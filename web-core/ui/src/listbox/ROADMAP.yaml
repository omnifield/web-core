# Дорожная карта листа — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# НЕ полностью прямой проброс — корень принимает плоский массив `items`, не готовую коллекцию:
# коллекция строится и мемоизируется внутри (та же схема, что у `select`). Остальной
# пропс-серфейс сверен целиком, 2026-09-04.

categories:
  - category: Основа
    items:
      - id: single-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Одиночный выбор
        description: |
          Означает: клик по пункту выбирает его, остальные снимаются.
          Реализация: готовое состояние компонента, проверено тестом.

      - id: multiple-extended-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Множественный и расширенный выбор
        description: |
          Означает: `selectionMode="multiple"` — клик переключает без модификатора;
          `"extended"` — выбор через `Cmd`/`Ctrl`, интерфейс в духе файлового менеджера.
          Реализация: готовый проп компонента, документирован примером README, не проверен
          отдельным тестом при аудите 2026-09-04.

      - id: filtering
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Фильтрация по вводу
        description: |
          Означает: `input` связывается с функцией фильтра, сужающей набор пунктов по мере ввода;
          `empty` монтируется, когда фильтр не оставил ни одного совпадения.
          Реализация: готовый паттерн компонента, документирован полным примером README, не
          проверен отдельным тестом при аудите 2026-09-04.

  - category: Тонкая настройка
    items:
      - id: highlight-on-hover
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Подсветка по наведению — на один пункт
        description: |
          Означает: `highlightOnHover` прямо на `ListboxItem` включает/выключает подсветку
          указателем для ЭТОГО пункта отдельно от остальных.
          Реализация: готовый проп компонента — технически проброшен, не задокументирован ни
          одним примером README и не проверен тестом при аудите 2026-09-04.

      - id: select-on-highlight
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Выбор пункта при подсветке, не только по клику
        description: |
          Означает: `selectOnHighlight` выбирает пункт сразу при переходе подсветки на него
          (клавиатурой или наведением), не дожидаясь отдельного клика/Enter.
          Реализация: готовый проп компонента — технически проброшен, не задокументирован и не
          проверен при аудите 2026-09-04.

      - id: auto-highlight-input
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Автоподсветка при вводе в поле фильтра
        description: |
          Означает: `autoHighlight` на `ListboxInput` подсвечивает подходящий пункт автоматически
          по мере набора текста, не дожидаясь стрелок.
          Реализация: готовый проп компонента — технически проброшен, не задокументирован и не
          проверен при аудите 2026-09-04.

      - id: deselectable
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Запрет пустого выбора
        description: |
          Означает: `deselectable` управляет тем, можно ли снять единственный выбранный пункт,
          оставшись совсем без выбора.
          Реализация: готовый проп компонента — ПОПЫТКА проверить эмпирически при этом аудите
          дала неоднозначный результат (клик по уже выбранному пункту не снял выбор ни с
          `deselectable={false}`, ни без пропа вовсе, в режиме `single`) — честно не
          охарактеризовано, не выдуман работающий пример без реальной проверки.

  - category: Не построено
    items:
      - id: no-own-filter-helper
        type: feature
        priority: Low
        milestone: null
        name: Свой способ построить и фильтровать коллекцию
        description: |
          Означает: пример фильтрации в README вынужден собирать коллекцию и функцию `filter`
          обходным путём — кит не даёт для этого своего готового хука.
          Реализация: ЧЕСТНЫЙ пробел — единственный способ сегодня показан в README как есть, не
          скрыт.

# Журнал решений.
log:
  - id: itemIndicator-real-icon-not-literal-glyph
    type: plan
    date: 2026-09-06
    summary: >
      Сборка `basic`'s `itemIndicator` раньше держала буквальный символ (`{ genus: "icon", value:
      "✓" }`). User попросил заменить голые символы на настоящий `Icon` из общего реестра во всех
      сборках кита, где они стоят, — заменено на `{ node: "icon", props: { name: "check" } }`.
      `parts.ts`'s `itemIndicator.accepts` получил `{ kind: "component" }` — раньше пускал внутрь
      только буквальный символ, реальный компонент был не допущен. Побочный эффект, найденный по
      пути: `RenderTree` заворачивает всё дерево в ОДИН `<Suspense>` — реальный асинхронный `Icon`
      внутри повторяемого пункта подвешивает всё дерево (включая `label`) до своего резолва, не
      только свой слот — тесты, проверявшие содержимое сразу после mount без ожидания, ловили
      пустой `host` (проверено эмпирически, `web-core/ui/src/icon/FAQ.md`).

  - id: not-fully-direct-collection-transform
    type: plan
    date: 2026-09-04
    summary: >
      Та же схема, что у `select`: `items` (плоский массив) заменяет готовую структуру, которую
      компонент строит и мемоизирует сам внутри. Остальной пропс-серфейс — прямой проброс, сверен
      инструментом.

  - id: four-unverified-props-honestly-noted
    type: plan
    date: 2026-09-04
    summary: >
      Тот же довод, что у `select`/`slider`: `highlightOnHover`/`selectOnHighlight`/
      `autoHighlight` технически доступны через прямой проброс типа, но не добавлены в README/тесты
      при этом аудите. `deselectable` дополнительно ПРОВЕРЯЛСЯ эмпирически (не просто пропущен) —
      результат оказался неоднозначным в режиме `single`, поэтому честно оставлен
      неохарактеризованным, а не описан наугад.

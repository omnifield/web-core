# Дорожная карта диалога — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Кит отдаёт наружу только МЕХАНИКУ (`control`+`content`), не готовую панель — `backdrop`/
# `closeTrigger` кладёт сама `content`, `positioner`/`title`/`description` не существуют вовсе.
# Решение user, 2026-09-06 — см. log.

categories:
  - category: Основа
    items:
      - id: open-close
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Открытие и закрытие
        description: |
          Означает: клик по `control` открывает диалог, `Esc`/крестик закрывают его — обычное
          поведение модальной панели.
          Реализация: готовое состояние Zag-машины, проверено тестом.

      - id: multiple-controls
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько control на один диалог
        description: |
          Означает: несколько `DialogControl` с разными `value` делят один диалог — клик по любому
          открывает его и помечает себя как `current` (`data-current`), какой из них его открыл.
          Тот же приём, что у `drawer`/`popover`.
          Реализация: готовый проп компонента, проверено тестом.

      - id: mechanics-only-content
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "content — чистая механика, не готовая панель"
        description: |
          Означает: `DialogContent` несёт `Portal`+`backdrop`+`closeTrigger`+реальный Ark-контент;
          `positioner`/`title`/`description` не существуют в паспорте вовсе (`.omit(...)`) —
          содержимое потребитель кладёт и стилизует сам.
          Реализация: `components/content/index.tsx` — `backdrop`/`closeTrigger` рендерятся
          НАПРЯМУЮ как реальные Ark-компоненты, без своих файлов-обёрток кита (см. лог — первая
          версия этой правки заводила отдельные файлы без единого независимого кейса использования).

      - id: control-renamed-from-trigger
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "trigger → control, тот же словарь, что у accordion/popover"
        description: |
          Означает: `entity/anatomy.ts` вырезает родное имя Zag (`trigger`) и добавляет кит-имя
          (`control`) — одинаковый смысл называется одинаково во всём ките. Без `controlIndicator`
          — у диалога нет родной части Zag под индикатор, и нет своей стрелки/шеврона; в ките нет
          ни одного `controlIndicator`, выдуманного без реальной части поставщика за ним.
          Реализация: `.omit("trigger", ...).extendWith("control")`, `components/control.tsx`.

      - id: context-through-portal
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Solid-контекст течёт сквозь Portal
        description: |
          Означает: `Context.Provider`, поставленный снаружи `<Dialog>`, доступен внутри
          содержимого `DialogContent` через `useContext`.
          Реализация: свойство `solid-js/web`'s `Portal` (сохраняет владельца, не заводит
          отдельный реактивный корень), ничего не написано китом специально под это; проверено
          тестом.

      - id: alertdialog-role
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Диалог-предупреждение
        description: |
          Означает: `role="alertdialog"` — фокус по умолчанию уходит на первый фокусируемый элемент
          внутри содержимого, клик снаружи диалог не закрывает.
          Реализация: готовый проп компонента, документирован примером README, не проверен
          отдельным тестом.

  - category: Тонкая настройка
    items:
      - id: focus-and-dismiss-tuning
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Тонкая настройка фокуса и закрытия
        description: |
          Означает: `closeOnEscape`/`closeOnInteractOutside`/`trapFocus`/`restoreFocus`/
          `initialFocusEl`/`finalFocusEl`/`persistentElements` — какие элементы не закрывают
          диалог кликом снаружи, куда уходит и возвращается фокус.
          Реализация: готовые пропы компонента — технически проброшены, не проверены отдельным
          тестом.

  - category: Не построено
    items:
      - id: imperative-state-access
        type: feature
        priority: Low
        milestone: null
        name: Программный доступ к состоянию диалога наружу
        description: |
          Означает: доступ к состоянию машины и методам управления диалогом программно — тот же
          класс возможностей, что `carousel`/`date-picker` теряют без своего канала состояния.
          Реализация: ЧЕСТНЫЙ пробел — кит не даёт наружу ни одного публичного способа до этого
          состояния достучаться. Системный пробел карты кита, не случайность одного компонента.

# Журнал решений.
log:
  - id: mechanics-only-redesign
    type: plan
    date: 2026-09-06
    summary: >
      User: "нам вообще это не нужно, нам нужна меха именно модалки, чтобы она открылась... части,
      которые юзеру не отдаём в паспорте тоже не указываем" — переделано с «готовая панель из 7
      частей» на «механика». Дальше user дал детальное ТЗ на диммер/кнопку закрытия (вернуть
      `backdrop`/`closeTrigger` в анатомию, отрендерить рядом с content) — сделано, НО с отдельными
      файлами `backdrop.tsx`/`close-trigger.tsx` и публичным экспортом `DialogCloseTrigger`.

  - id: no-file-without-a-use-case
    type: plan
    date: 2026-09-06
    summary: >
      User остановил и спросил напрямую: "назови мне кейс, когда юзеру нужно будет использовать
      [backdrop/closeTrigger] отдельно от content" — кейса нет ни у одной части. Оба свёрнуты в
      `components/content/index.tsx` как прямой вызов реальных Ark-компонентов, файлы-обёртки
      удалены, публичный экспорт `DialogCloseTrigger` убран. Урок: копировать форму accordion/
      popover (файл на часть) не проверив, есть ли у ЭТОЙ части независимый кейс — то же самое, что
      описано в `no-code-comments-not-recorded-in-docs` ниже про слепое копирование конвенции.

  - id: no-code-comments-not-recorded-in-docs
    type: plan
    date: 2026-09-06
    summary: >
      User остановил на многострочных объясняющих комментариях в коде (`entity/anatomy.ts`,
      `backdrop.tsx` и других файлах этой правки) — вся содержательная аргументация должна жить в
      `FAQ.md`/`README.md`, в коде — максимум одна строка на неочевидный WHY. Комментарии убраны
      при следующей же правке этих файлов, содержание перенесено в `FAQ.md`.

  - id: missing-provider-arg-found-live
    type: plan
    date: 2026-09-06
    summary: >
      Реальный баг, не связанный с порталом вовсе и существовавший до всей этой правки:
      `components/index.ts`'s `defineKitComponent(passport, {...})` не передавал `Dialog` третьим
      аргументом — живая витрина падала `useDialogContext returned undefined`, юнит-тест оставался
      зелёным, потому что сам подставлял `provider: Dialog` руками в свой тестовый `REGISTRY`, в
      обход настоящей карты кита. Найдено только живым прогоном в реальном браузере
      (`chrome-devtools`, `/showcase/dialog/basic`). Исправлено, тест переписан на
      `provider: dialogKit.provider` — подтверждено, что временный откат аргумента валит тест тем
      же способом, что и живую витрину.

  - id: stale-generator-templates-found-during-rebuild
    type: plan
    date: 2026-09-06
    summary: >
      Пересборка `dist` (`pnpm run build`) после этой правки поймала ДВА не связанных с диалогом
      застарелых бага в шаблонах генератора (`generators/templates/barrel/*.hbs`): `index.ts.hbs`
      ссылался на несуществующий `./shared/collection.js` (реально `./shared/utils/collection.js`);
      `passport.ts.hbs` реэкспортировал `PassportAssemblyExtra`/`isAssemblyExtra`, которых больше
      нет в `@web-core/skin/editor`. Оба исправлены прямо здесь — без них `pnpm run build` не
      проходил ни для одного компонента кита.

  - id: apps-skin-consumer-broke
    type: question
    date: 2026-09-06
    summary: >
      Приложение-потребитель держало старую форму API: мёртвый WIP-код за ранним `return`, но со
      статическим импортом `DialogTrigger`/`DialogTitle`/`DialogDescription`/`DialogCloseTrigger` —
      этого хватило, чтобы Vite падал на статическом резолве ESM. Файл вне зоны кита — не тронут,
      эскалировано user напрямую в чате, не через ADR.

  - id: full-surface-context-missing
    type: plan
    date: 2026-09-04
    summary: >
      Аудит до всех правок этой сессии (когда паспорт ещё нёс все семь родных частей Zag): все семь
      принимали свои пропсы один в один, проверка не вскрыла ни одного незавёрнутого соседнего
      КОМПОНЕНТА. Устарело формой, но программный канал состояния диалога наружу как был не дан,
      так и остался — см. категорию «Не построено».

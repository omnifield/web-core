# Дорожная карта переключателя — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный, проверен на 2026-09-04, полное совпадение, включая скрытый `<input>` и
# участие в форме. Фичового бэклога нет.

categories:
  - category: Основа
    items:
      - id: check-state
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Включено/выключено (управляемое/неуправляемое)
        description: |
          Означает: обычный управляемый/неуправляемый паттерн (`checked`/`defaultChecked`/
          `onCheckedChange`), тот же, что у чекбокса и остальных компонентов кита.
          Реализация: готовое состояние компонента, обвязка своя.

      - id: form-participation
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Настоящее поле формы
        description: |
          Означает: `name`/`value` делают переключатель родным `<input type="checkbox">` для
          `FormData` — отправка формы подхватывает его без дополнительной обвязки.
          Реализация: скрытый `<input>`, который кладёт сам корень — та же схема, что у чекбокса,
          потребителю добавлять не нужно и нельзя, проверено тестом.

# Журнал решений.
log:
  - id: no-forward-roadmap-full-surface
    type: plan
    date: 2026-09-04
    summary: >
      Тот же довод, что у accordion/avatar/button/toggle/toggle-group: весь пропс-серфейс
      проброшен 1:1, никаких незавёрнутых соседних возможностей (в отличие от checkbox's группы)
      не найдено — у переключателя своего группового режима нет вовсе. Новый пункт здесь появится,
      только если появится реальный запрос на функциональность, которой нет вовсе.

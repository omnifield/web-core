# Дорожная карта тумблера — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный, проверен на 2026-09-04, полное совпадение. Фичового бэклога нет.

categories:
  - category: Основа
    items:
      - id: press-state
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Нажатость (управляемая/неуправляемая)
        description: |
          Означает: обычный управляемый/неуправляемый паттерн (`pressed`/`defaultPressed`/
          `onPressedChange`), тот же, что у остальных компонентов кита.
          Реализация: готовое состояние компонента, обвязка своя.

      - id: fallback-glyph
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Разный глиф на каждое состояние
        description: |
          Означает: `fallback`-проп индикатора рисует контент для НЕнажатого состояния, дети — для
          нажатого, переключать `data-state` руками не нужно.
          Реализация: готовый проп компонента, проверено тестом.

# Журнал решений.
log:

# Дорожная карта поповера — формат тот же, что у остальных компонентов кита (см. table/ROADMAP.yaml,
# шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный — каждая часть типизирована как свой проп напрямую один в один, сверено
# целиком 2026-09-04. Ни одного незавёрнутого соседнего компонента не нашлось.

categories:
  - category: Основа
    items:
      - id: open-close
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Открытие и закрытие по клику
        description: |
          Означает: клик по `control` открывает плавающую панель, `closeTrigger`/`Escape`/клик
          снаружи закрывают её — обычное поведение плавающей панели.
          Реализация: готовое состояние компонента, проверено тестом.

      - id: multiple-controls
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько контролов на один поповер
        description: |
          Означает: несколько `PopoverControl` с разными `value` делят один поповер — клик по
          любому открывает его и помечает себя как `current` (`data-current`), какой из них его
          открыл. Тот же приём, что у `drawer`.
          Реализация: готовый проп компонента, проверено тестом.

      - id: anchor
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Точка отсчёта отдельно от контрола
        description: |
          Означает: `PopoverAnchor` позиционирует панель относительно другого элемента страницы, а
          не самого `control` — например, поповер над текстовым полем, кнопка открытия которого
          лежит рядом, а не над самим полем.
          Реализация: готовая часть компонента, отражена в анатомии и README.

      - id: modal
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Модальный поповер
        description: |
          Означает: `modal` включает захват фокуса, блокировку скролла, отключение взаимодействия
          со страницей вокруг и скрытие остального контента от скринридера — та же семантика, что
          у диалога, но на компоненте, который по умолчанию немодальный.
          Реализация: готовый проп компонента — технически проброшен, не проверен отдельным
          тестом при аудите 2026-09-04.

  - category: Тонкая настройка
    items:
      - id: viewport-clamp-variables
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Переменные размера якоря и доступного места
        description: |
          Означает: `--reference-width`/`--reference-height` (размер контрола/якоря) и
          `--available-width`/`--available-height` (место до края вьюпорта) на `positioner` — для
          подгонки размера панели под контрол или защиты от выхода за экран.
          Реализация: готовые переменные компонента, `--available-*` уже используются в базовом
          рецепте (`maxWidth`/`maxHeight`), `--reference-*` документированы в паспорте, но не были
          показаны примером README до этого аудита — исправлено.

      - id: focus-and-dismiss-tuning
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Тонкая настройка фокуса и закрытия
        description: |
          Означает: `autoFocus`/`closeOnEscape`/`closeOnInteractOutside`/`restoreFocus`/
          `initialFocusEl`/`finalFocusEl`/`persistentElements` — какие элементы не закрывают
          поповер кликом снаружи, куда уходит и возвращается фокус.
          Реализация: готовые пропы компонента — технически проброшены, не проверены отдельным
          тестом при аудите 2026-09-04.

# Журнал решений.
log:
  - id: full-prop-surface
    type: plan
    date: 2026-09-04
    summary: >
      Каждая часть принимает свои пропсы один в один. Проверка не вскрыла ни одного незавёрнутого
      соседнего компонента — весь публичный API уже покрыт картой кита.

  - id: reference-variables-were-undocumented
    type: plan
    date: 2026-09-04
    summary: >
      `--reference-width`/`--reference-height` уже были в паспорте и `playground/parts.ts`, но
      README не показывал их вовсе (только `--available-*` мельком в одном примере) — добавлена
      полная таблица переменных `positioner`, тот же формат, что у `drawer`.

# Дорожная карта плоскости — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# САМЫЙ ПРОСТОЙ компонент кита — один узел, без состояний, без IO. Весь вид приходит через ось
# вариаций (`data-variant`), не через собственную функциональность. Фичового бэклога нет —
# добавлять компоненту нечего, у неё нет поведения, которое можно было бы расширить.

categories:
  - category: Основа
    items:
      - id: polymorphic-tag
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Смена тега (as)
        description: |
          Означает: `<Surface as="section">` рисует `<section>` вместо `<div>`, сохраняя адрес и
          вид компонента — тег выбирает потребитель, кит не навязывает разметку.
          Реализация: полиморфный рендер, проверено тестом.

      - id: variant-axis
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Ось видов несёт весь вид целиком
        description: |
          Означает: `data-variant` — единственный способ дать плоскости вид (`plain`/`raised` в
          проверочном рецепте, реальные имена решает продукт), состояний у компонента нет вовсе.
          Реализация: обычная ось паспорта, без собственных имён вариаций в ките.

# Журнал решений.
log:
  - id: no-forward-roadmap-no-behavior
    type: plan
    date: 2026-09-04
    summary: >
      Бэклога нет не потому что всё проброшено 1:1, а потому что расширять нечего: у плоскости нет
      функциональности сверх «дать адрес и сменить тег».

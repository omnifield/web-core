# Дорожная карта набора-переключателей — формат тот же, что у остальных компонентов кита (см.
# table/ROADMAP.yaml, шапка). Единственный источник правды: статус проставляется рядом с работой.
#
# Пропс-серфейс полный, проверен на 2026-09-04. Фичового бэклога нет — единственная находка
# аудита была документационной (`deselectable`), не отсутствующей функциональностью.

categories:
  - category: Основа
    items:
      - id: single-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Один нажатый пункт (радио-режим)
        description: |
          Означает: по умолчанию нажатие одного пункта снимает предыдущий — тот же принцип, что
          у радио-группы, но со своей возможностью снять выбор совсем повторным кликом.
          Реализация: готовое состояние компонента, обвязка своя.

      - id: multiple-select
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: Несколько нажатых сразу
        description: |
          Означает: `multiple` снимает ограничение «только один пункт нажат» — набор ведёт себя
          как чекбоксы, а не радио.
          Реализация: готовый проп компонента, проверено тестом.

      - id: deselectable
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: Запрет снятия единственного выбора
        description: |
          Означает: `deselectable={false}` превращает набор в настоящую радио-группу — клик по
          уже нажатому пункту больше ничего не делает, всегда ровно один пункт остаётся нажатым.
          Реализация: готовый проп компонента; был технически проброшен уже давно (полный проброс
          типа), но не задокументирован и не проверен тестом — найдено и закрыто при аудите
          2026-09-04, не новая функциональность.

# Журнал решений.
log:
  - id: no-forward-roadmap-full-surface
    type: plan
    date: 2026-09-04
    summary: >
      Тот же довод, что у accordion/avatar/button/toggle: весь пропс-серфейс проброшен 1:1. Новый
      пункт здесь появится, только если появится реальный запрос на функциональность, которой у
      компонента нет вовсе.

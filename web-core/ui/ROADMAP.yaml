  - category: Данные списков и деревьев
    items:
      - id: unified-item-collection-engine
        type: feature
        status: Done
        priority: High
        name: "Единый канон элемента (value/label/children?) и один аксесорный слой — без обхода сбоку ни для одного компонента"
        description: |
          Решение user дословно: "давай все делать по канону, никаких поверх или сбоку. все в
          одном флоу и в одном каноне" — ни у одного компонента, включая accordion, не остаётся
          своя параллельная форма данных. Полный список компонентов кита, работающих с массивом/
          деревом элементов, сверен по факту (`entity/io.ts` каждого), не по памяти:

          - `accordion` — НЕ плоский `items`: `sections[].items`, у секции свои `id`/`title`/
            `activeValues`, у листового item — `{value, label}`.
          - `tabs` — плоский `items: {value, label, content}[]`.
          - `listbox`/`select` — плоский `items: {value, label}[]`.
          - `tree-view` — `items: TreeItem[]`, `TreeItem = {id, label, children?}` — узел зовётся
            `id`, не `value`, единственный такой во всём ките.
          - `menu` — `entity/io.ts` ещё не существует, компонент не реализован до конца. Строить
            сразу на каноне, миграции не будет.
          - `carousel` — massив НЕ использует вовсе (`{slide1, slide2, slide3}`, фиксированные
            слоты) — другая, более глубокая проблема (не список, а жёстко заданное число слотов).
            Осознанно ВНЕ этой заявки, не заворачивать сюда попутно.

          Почему один канон технически верен, а не просто "красивее": в самом Zag коллекция
          (`@zag-js/collection`, `ListCollection`/`TreeCollection`) — самостоятельный класс, не
          привязанный к конкретной машине. Сверено грепом по ВСЕМ установленным `@zag-js/*`
          пакетам на импорт `@zag-js/collection`: используют его только `select`/`combobox`/
          `cascade-select`/`listbox`/`tree-view` — машинам, которым НАДО самим обходить данные
          (клавиатурная навигация, поиск по вводу, виртуализация/async-подгрузка). `accordion`/
          `tabs`/`menu` коллекцию не подключают вовсе — их машина хранит только `value` открытых/
          выбранных элементов, перечисление уже даёт сам рендер (`.map()` по массиву в JSX). Но
          `ListCollection`/`TreeCollection` НИЧЕМ не мешают быть использованными и там — просто как
          нормализатор на стороне кита, не как проп машины. `tree-view/components/root.tsx` УЖЕ
          так делает: `createTreeCollection({nodeToValue: node => node.id, nodeToString: node =>
          node.label})` — ровно этот приём, просто самодельный и не общий. `@ark-ui/solid` (кит
          уже ходит за коллекцией через него, не мимо) реэкспортирует весь набор целиком —
          `createListCollection`/`createTreeCollection`/`CollectionItem`/`TreeCollection`/…

          Канон: `item = {value: string, label: string, children?: item[]}` — рекурсивный, глубина
          не ограничена сверху. "Секция" `accordion` — НЕ отдельная форма, а такой же `item` с
          `children` (группа — узел с детьми, не параллельная сущность); если после проверки
          реального использования группировка accordion'у не нужна вовсе — убрать её, не тащить
          пустую форму ради формы. Подменю `menu` — та же связь через `children`, не своя схема.

          Куда класть (место уже есть, не новая папка):
          1. `shared/data/fields.ts` — рекурсивный фрагмент `item` рядом с `fields.labeled`, тем
             же приёмом (spread в `entity/io.ts` каждого компонента, не копия текста).
          2. `shared/utils/collection.ts` — перестаёт быть голым реэкспортом
             `createListCollection`; добавляются `createItemListCollection(items)`/
             `createItemTreeCollection(root)` — тонкие обёртки над `createListCollection`/
             `createTreeCollection` (те же, что уже реэкспортированы, из `@ark-ui/solid`) с нашими
             аксесорами (`itemToValue`/`itemToString`, `nodeToValue`/`nodeToString`/`nodeToChildren:
             n => n.children ?? []`) зашитыми внутрь — компонент их не пишет каждый раз заново,
             как сегодня делает `tree-view`.

          По компонентам:
          - `accordion` — `sections`/`id`/`title`/`activeValues` уводятся целиком, io-схема
            переходит на плоский (или вложенный через `children`, если группировка реально нужна)
            канонический `item`. Это касается и рендер-кода (`components/`), не только `io.ts`.
          - `tabs`/`listbox`/`select` — форма уже `{value,label}`, переводятся на общий фрагмент
            `item` через spread вместо локального `z.object`; свои поля сверх канона (у `tabs` —
            `content`) остаются — канон это пол, не потолок.
          - `tree-view` — `id` → `value` (канон), `root.tsx`'s ручной `createTreeCollection`
            меняется на `createItemTreeCollection` из `shared/utils`. Проверено (2026-09-09,
            внешний стенд): живых `content`-записей на `tree-view` — 0, только рецепт/наряд
            (стиль), переименование поля контента ничего не ломает.
          - `menu` — реализуется на каноне с нуля, миграции нет.
          - `carousel` — не трогать в этой заявке (см. выше).

          Тесты — по образцу, что уже принят в остальных зонах: не верить, что `ListCollection`/
          `TreeCollection` со старыми/новыми полями работают "по факту одинаковых сигнатур" —
          прогнать реальный рендер каждого мигрированного компонента с данными нового канона,
          сверить, что value/label/children доходят до DOM/машины так же, как раньше.

          Сделано (2026-09-09): `fields.item`/`createItemListCollection`/`createItemTreeCollection`
          на месте, все пять компонентов переведены, реальный рендер прогнан (271 тест кита зелёные,
          нетронутые 2 падения `shipped-artifact.test.ts` — старые, про lucide dist, к этой заявке
          не относятся). `accordion` — group нужен по факту (5 живых content-записей и сборка
          `action-list` реально используют её), убирать не стали; `sections`/`id`/`title`/`items`
          переведены на канонические `items`/`value`/`label`/`children`, 5 живых content-записей
          (`accordion-*`) при этом сломаны намеренно — user подтвердил дословно "не будем из-за
          полумёртвого потребителя резать флоу", правка content — отдельная задача не в этой зоне.
          `menu` — реализован ТОЛЬКО плоский список (новая сборка `list`, `entity/io.ts` на каноне);
          чекбокс/радио/группы/разделители/подменю из данных осознанно вынесены за скобки (см.
          `menu-data-driven-rich-items` ниже), сборка `basic` (статичная, ручная) не тронута.

          Побочная находка, не мой инструмент чинить (web-core/skin, не web-core/ui): рекурсивный
          `item` в `Data` ломает `Paths<T>` (`web-core/skin/src/engine/passport/assembly/paths.ts`)
          — вместо union путей типизация схлопывается в один вырожденный тип
          (`"children/children/children/children/children/children"`), `tsc` валит сборку. У
          `tree-view` это было обойдено ещё раньше (родовой параметр `Data` у `PassportAssembly` не
          передаётся вовсе, путь проверяется как голый `string`) — тем же приёмом обошли `accordion`
          и `menu`. Строгая проверка путей `repeat`/`bind` для ЛЮБОГО компонента с рекурсивными
          `children` в данных сейчас не работает в принципе, не только у этих трёх — на заметку
          архитектору и владельцу пакета скина.

      - id: tree-view-root-collection-not-bound
        type: bug
        status: Done
        priority: High
        name: "tree-view — сборка base не привязывала items на корень, дерево жило без коллекции"
        description: |
          Найдено user живьём (2026-09-21) на витрине компонентов: дерево не получает данные,
          в консоли `[web-core-assembly] узел «item-2» (tree-view.item) упал при отрисовке:
          TypeError: Cannot read properties of undefined (reading 'isBranch')`, и вложенность
          обрезана до первого уровня — второй и глубже не рисуются вовсе.

          Причина: `playground/assemblies/base.ts` не объявлял `bind` на корневом узле, а
          `TreeRoot` строит `TreeCollection` ТОЛЬКО из пропа `items` (`components/root.tsx`,
          `createItemTreeCollection`). Через настоящий путь потребителя — `instanceOf(component,
          rootProps, assembly, data)` из `component-registry.ts`, которым ходит витрина, — этот
          проп не кладёт никто: `instanceOf` переносит на корень только `rootProps`, а данные
          показа доходят до узлов через `bind`. Корень получал `items: undefined`, коллекция
          выходила пустой, и `getNodeState` (`@zag-js/tree-view`'s `connect`) для узла, которого в
          коллекции нет, отдавал `undefined` — на нём и падал `nodeState().isBranch` в
          `components/item/index.tsx`. `repeat`/`recur` при этом отрабатывали правильно: узлы в
          дереве схемы были все, ронялся именно рендер.

          Почему не поймали тесты: `test/tree-view.test.tsx`'s `mount` подставлял коллекцию руками
          (`updateNode(..., { props: { items: data.items } })`) — проверялся путь, которым живой
          потребитель не ходит. Ровно поэтому ручная JSX-сборка работала, а витрина нет.

          Сделано (2026-09-21): `bind: { items: "/items" }` на корневом узле сборки `base` — тем же
          приёмом, каким это уже сделано у `listbox` (`bind: { items: "/items" }` на root).
          Ручная подстановка `items` из `mount` убрана — шесть существующих сценариев теперь идут
          настоящим путём; добавлен сценарий через `kitComponentRenderer().instanceOf` без единого
          пропа на корне (три уровня данных → три подписи и `data-depth` 1/2/1), то есть буквально
          тот вызов, который делает витрина. README дерева: у сборки `base` показан bind корня,
          заодно io-вход и примеры переведены со старого `id` на канонический `value`
          (расхождение с кодом осталось с `unified-item-collection-engine`).

          `typecheck && lint && test && build` — зелёные, 305/305 тестов кита (было 304, +1).

      - id: tree-item-branch-switch-not-reactive
        type: bug
        status: Done
        priority: High
        name: "tree-view — узел, ставший веткой, остаётся ArkItem навсегда: isBranch читается в callback-форме, без подписки"
        description: |
          Найдено владельцем зоны сборки (2026-09-22) при разборе Critical-пункта
          `composite-context-lost-for-label-control-positioner-recurrence`
          (`web-core/assembly/ROADMAP.yaml`) — тот пункт трижды искал причину у себя, и трижды
          гипотеза отклонялась; причина оказалась здесь. Диагноз перепроверен архитектором чтением
          этого кода и исходника вендора, не принят на слово.

          Симптом (воспроизводится на витрине за полминуты, и в dev, и в прод-сборке): узел,
          отрисованный ЛИСТОМ, получает своего первого ребёнка — в консоли
          `[web-core-assembly] узел «content» (tree-view.content) упал при отрисовке: ContextError:
          useCollapsibleContext returned "undefined"`, и узел остаётся листом НАВСЕГДА: ни
          раскрытия, ни детей. Соседняя ветка, приехавшая веткой сразу, работает нормально.

          Причина — асимметрия внутри одного компонента. `components/item/index.tsx:33` читает
          `nodeState().isBranch` внутри ФУНКЦИИ-РЕБЁНКА `<ArkNodeContext>`, и тернарник
          (`ArkBranch` против `ArkItem`) вычисляется РОВНО ОДИН РАЗ: вендор зовёт эту функцию прямо
          в теле своего компонента — `var TreeViewNodeContext = (props) =>
          props.children(useTreeViewNodeContext())` (`@ark-ui/solid@5.39.1`,
          `dist/chunk/E3GPVHEV.js`, сверено чтением дистрибутива). Тело компонента Solid
          выполняется однократно, подписки на сигнал не остаётся. Соседи по папке читают ТОТ ЖЕ
          флаг через `<Show when={node().isBranch}>` — `content.tsx:21`, `control.tsx:23`,
          `indicator.tsx:26` — и переключаются как положено.

          Отсюда симптом целиком: `content` честно становится `Collapsible.Content`, а `item`
          остаётся `ArkItem` — значит `Collapsible.Root` вокруг него не появляется, и
          `useCollapsibleContext()` у содержимого отдаёт `undefined`. Перерисовать узел в ветку
          после этого некому.

          Подтверждено живым наблюдением, не только чтением: у узла, которому добавили первого
          ребёнка, разметка осталась `treeitem` без раскрытия (то есть `ArkItem`), а шапка тут же
          стала `button` (то есть `ArkBranchControl`) — реактивные читатели переключились,
          нереактивный нет. Это же снимает давнюю гипотезу про гонку Zag-коллекции с деревом
          сборки: раз `control` переключился, машина про ветку знает.

          Что решить (эта зона): решение «ветка или лист» обязано пересчитываться реактивно — как у
          трёх соседей. Тонкость, которой у них нет: там переключается СОДЕРЖИМОЕ одного узла, а
          здесь — сам компонент-обёртка (`ArkBranch` несёт `Collapsible.Root`, `ArkItem` нет), то
          есть смена provider-несущей обёртки вокруг уже смонтированных детей. Со стороны движка
          этот случай поддержан (`web-core/assembly`, `content-of-context-invalidation-on-wrapper-
          swap`, Done — кэш детей перестраивается, когда меняется контекст вызывающего), но
          проверять переход надо живым рендером, а не только тем, что тернарник стал реактивным.

          Как проверять — тем же уроком, который уже стоил одного пропущенного бага в этой же
          категории (`tree-view-root-collection-not-bound`): путём НАСТОЯЩЕГО потребителя
          (`instanceOf` + `RenderTree` + смена данных), а не ручной подстановкой пропов в `mount`.
          Сценарий: узел без `children` отрисован, затем данные дают ему первого ребёнка — в
          разметке обязан появиться раскрывающийся узел с содержимым, в консоли пусто.

          Границы. В `web-core/assembly` чинить нечего — движок делает свою работу верно. На другие
          компоненты кита это не распространяется: читателей `isBranch` во всём `src` ровно четыре,
          три уже реактивные, и ни у одного другого компонента обёртка от данных не зависит — у
          `select`/`popover` рост «ноль детей → N» идёт БЕЗ смены обёртки, этот путь рабочий и
          покрыт тестами движка.

          Зачем сейчас: приложение с готовыми данными этого пути не проходит, а редактор композиции
          проходит его каждым действием — «положить узел внутрь пустого узла» и есть переход
          лист→ветка. Пункт закрывает Critical в `web-core/assembly`.

          Сделано (2026-09-22): `components/item/index.tsx` — тернарник заменён на `Show`
          (`when={nodeState().isBranch}`, ветка в детях, лист в `fallback`), то есть флаг читается
          ВНУТРИ реактивного узла, как у трёх соседей по папке. Callback-форма
          `<ArkNodeContext>` оставлена: она нужна не ради реактивности, а ради доступа к контексту
          в том же компоненте, который его и ставит (`TreeItem` сам рисует `ArkNodeProvider`,
          хуком из своего тела прочитать его нечем — в отличие от `control`/`content`/`indicator`).
          Диагноз ТЗ подтверждён чтением дистрибутива заново, не принят на слово: вендорская
          `props.children(useTreeViewNodeContext())` (`@ark-ui/solid@5.39.1`,
          `dist/chunk/E3GPVHEV.js:145`) зовётся один раз, а сам аргумент — нормальный `createMemo`
          из `TreeViewNodeProvider`, то есть терялось не значение, а место, где его читают.

          Проверка — настоящим путём потребителя, тем же уроком, что
          `tree-view-root-collection-not-bound`: новый сценарий в `test/tree-view.test.tsx` рисует
          дерево через `kitComponentRenderer().instanceOf` + `RenderTree` на сигнале данных, узел
          «a» приходит ЛИСТОМ (у листа нет `data-state`), затем данные дают ему первого ребёнка —
          узел реально становится веткой (`data-state="closed"`), клик её раскрывает
          (`"open"`), подпись ребёнка появляется в разметке, `console.error` за весь сценарий не
          вызван ни разу (то есть `ContextError` у `content` не случился). Ручной подстановки
          пропов в `mount` в сценарии нет вовсе.

          Отрицательный прогон сделан (без правки сценарий падает на «still a leaf» — узел
          остаётся листом), то есть тест ловит именно эту причину, а не проходит по совпадению.

          `generate && typecheck && lint && test && build` — зелёные, 321/321 тестов кита
          (было 320, +1; счётчик 305 из соседнего пункта выше устарел — с тех пор кит прирос
          другими заходами).
          README дерева несёт факт про переход лист↔ветка на живых данных, разбор «почему
          callback-форма не реактивна» — в `FAQ.md` зоны. Версия пакета: патч (правка поведения
          одного компонента, состав экспортов не менялся) — поднимает архитектор при публикации.


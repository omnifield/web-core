  - category: Документация
    items:
      - id: docs-canonical
        type: feature
        priority: Medium
        name: Перевод всех компонентов на эталон документации
        description: >
          Каждый компонент кита приведён к единому эталону документации (README/FAQ/ROADMAP в
          установленном формате). Сам факт унификации, без перечисления конкретных компонентов —
          список и так виден по дереву компонентов.

      - id: examples-for-every-component
        type: feature
        status: Done
        priority: High
        name: "EXAMPLES.md у каждого компонента — рабочий код для того, кто взял кит снаружи"
        description: |
          Просьба user (2026-09-24): фреймворком начали пользоваться коллеги, а примеров почти нигде
          не было — `EXAMPLES.md` лежал у четырёх компонентов из тридцати шести.

          Манера взята у этих четырёх (`carousel`/`navigation-menu`/`table`/`typography`), не
          изобретена заново: пронумерованные сценарии, у каждого рабочий tsx и строка «полезно
          проверить», ближе к концу — рендер через движок, последним — «посмотреть живьём».
          Содержание снято с кода и тестов компонента, а не пересказано по README: где README
          расходился с кодом, писал по коду (у `select` скрытый нативный `<select>` кладёт
          потребитель, а не корень, — README читался наоборот).

          Отдельное требование user того же дня: в КАЖДОМ примере стоит `data-variant` — это
          основной вход стилизации, и без него коллеги упирались в «почему компонент не
          стилизован» и «как одеть его так же, как на витрине». Имя вида в примерах — заглушка
          `xxx` (настоящие имена оставлены там, где их несёт проверочный рецепт), рядом блок про
          то, что имя придумывает форма скина, а не кит. Для пути через движок вид показан вторым
          аргументом `instanceOf`, то есть пропом корневого узла.

          Сделано (2026-09-24): 30 файлов. Не написаны примеры у пяти компонентов, где вход вида
          разъехался (см. `variant-entry-split-on-provider-rooted-components`) — ждут решения.
          У девяти компонентов без собственных `FAQ.md`/`ROADMAP.yaml` в примерах явно сказано, что
          разборы живут в доке зоны, иначе ссылка «см. FAQ» ведёт в пустоту. У `splitter` сказано,
          что готовых сборок нет вовсе и путь через движок отдал бы эскиз анатомии.

          Найденное по дороге вынесено отдельными пунктами, а не свалено сюда:
          `variant-entry-split-on-provider-rooted-components`, `icon-cannot-receive-variant`,
          `splitter-and-timer-never-ask-for-skin`, `no-kit-facade-for-list-filtering`,
          `diagram-barrel-lags-behind-its-code`. Хвост про `.md`-примеры с прямым импортом вендора
          уже назван в `vendors-stay-inside-the-kit`; отсутствие своего способа создать значение
          даты названо в доке самого `date-picker` — дублировать не стал.

      - id: docs-ship-as-subpath
        type: feature
        status: Open
        priority: High
        name: "Доки компонента едут в поставку отдельным подпутём, а не остаются файлами в репозитории"
        description: |
          ЗАДАЧА ОТ АРХИТЕКТОРА, 2026-09-24, по просьбе user: разработчик должен читать доку
          компонента там же, где смотрит сам компонент, — в витрине компонентов, — не открывая
          исходники пакета.

          Сегодня `files` — `dist` и корневой README. `README.md`/`FAQ.md`/`EXAMPLES.md`/
          `ROADMAP.yaml` каждого компонента лежат в `src` и потребителю не доезжают вовсе: пока
          пакет берут живой соседней папкой, их видно с диска, а из реестра — ни строки. Ошибка
          этого класса изнутри репозитория невидима целиком, симлинки её прячут.

          Подпутём, а не корневым входом: текст доки к рантайму компонента отношения не имеет, и
          продукт, который её не спрашивает, не должен платить за неё ни байтом. `sideEffects:
          false` тут не спасает — речь про то, чего в корневом входе не должно быть вовсе.

          Что означает результат:

          1. Подпуть `./docs` в `exports` И в `publishConfig.exports` отдаёт КАРТУ ленивых
             загрузчиков «имя компонента → его документы». Статический объект со всем текстом
             сразу не годится: это весь кит прозой одним куском, и платит за него каждый, кто
             открыл один компонент.
          2. Текст укладывается в модули шагом `generate` — он уже штампует паспорт и карту кита
             и уже обходит компоненты, второй обход заводить незачем. Со своими `outputs`: без
             них граф задач восстановит сборку из кеша без порождённого входа, и промах поймает
             не тот, кто его сделал (та же грабля, что записана в манифесте про `passport.ts`).
          3. `files` несёт собранные модули доки, а не сырые `.md` из `src`.
          4. `ROADMAP.yaml` компонента — не markdown. Отдавать его текстом как есть, разбор
             формата оставить потребителю: своей зависимости на разбор из-за одного файла зона
             не заводит.

          Проверка закрытия — не «зелёное у себя»: установка собранного пакета в чистый проект
          вне рабочего дерева и импорт подпути оттуда. Внутри дерева `exports`/`files` подменены
          симлинками и не проверяются вовсе.

          Рядом стоит уже записанный хвост, который эта работа делает заметным: шесть
          `.md`-примеров зоны учат импортировать вендора напрямую
          (`vendors-stay-inside-the-kit`). Пока доки лежали только в репозитории, это читали
          единицы; уехав в поставку, они станут тем, что видит каждый.

  - category: Компоненты кита
    items:
      - id: markdown-component
        type: feature
        status: Open
        priority: High
        name: "Компонент `markdown` — текст документа рисуется частями кита и одевается скином"
        description: |
          ЗАДАЧА ОТ АРХИТЕКТОРА, 2026-09-24. Идёт в паре с `docs-ship-as-subpath`: тот отдаёт
          текст, этот его показывает.

          Зачем компонент кита, а не разметка у потребителя. Документ показывают рядом с самим
          компонентом, и голая простыня рядом с одетым китом читается как чужая страница.
          Написанная у потребителя, типографика документа за нарядом не пойдёт: сменили наряд —
          компонент переоделся, а текст вокруг него остался прежним. Значит текст документа —
          такой же предмет скина, как остальные примитивы: свои части, свои состояния, свой
          рецепт.

          Вендор — `solid-markdown`. Сверка 2026-09-24 по реестру: версия 2.1.1, последняя
          публикация 2025-11-29, peer `solid-js ^1.6.0` (в дереве 1.9.14 — подходит), внутри
          unified/remark, сам пакет — порт `react-markdown`. Берётся готовое: разбор markdown —
          решённая задача, а подмена узлов документа на свои компоненты у него штатный вход,
          ровно то, ради чего он и нужен. Свой разбор не писать.

          Условие, без которого это разваливается, и его проверка. Вендор объявляет реактивный
          движок своим peer, а две физические копии движка в дереве ломают всё, что стоит на
          машинах состояний — ровно тот класс поломки, ради которого зона снимала свои
          peer-записи (`vendors-stay-inside-the-kit`). Резолв обязан сойтись в ту же копию,
          которую даёт фасад. Проверяется физически — одна папка движка в дереве, — а не тем, что
          сборка зелёная.

          Анатомия объявляется своим `createAnatomy`: машины у Zag под это нет, как у кнопки и
          диаграммы. Части — корень плюс то, что рецепт реально хочет адресовать по отдельности:
          заголовок, абзац, список, код, таблица, цитата, ссылка. Имена берутся из общего словаря
          (`shared/data/anatomy.ts`), а не придумываются заново: одинаковый смысл в разных
          компонентах называется одинаково, и заголовок здесь — тот же заголовок, что у соседей.

          Дальше обычный скелет компонента, без исключений: паспорт, доказательный рецепт,
          минимум одна сборка, тесты. Вход один — текст документа, значит `entity/io.ts` у него
          есть. Набивка и шрифт частей берутся видом части, как у всех (`part-kind-decides-
          padding`), а не подбираются на глаз.

          Отдельно назвать в доке зоны: компонент показывает ЧУЖОЙ текст, то есть произвольную
          разметку из источника, которым зона не управляет. Что с этим делает вендор по
          умолчанию и что остаётся на потребителе — проверить по его контракту и записать, а не
          предполагать.


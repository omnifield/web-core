      - id: popper-content-cannot-scroll
        type: bug
        status: Done
        priority: High
        name: "Доказательные рецепты: высота выпадашки ограничена у позиционера, а прокручиваться содержимому нечем"
        description: |
          ТЗ от архитектора (2026-09-22), по жалобе user живьём на витрине компонентов: селект с
          длинным списком раскрывается во всю длину списка, прокрутка появляется не внутри списка,
          а у ВСЕЙ страницы, и воркспейс уезжает вместе с ней.

          Механика. `positioner` уходит в портал в `document.body`
          (`select/components/positioner.tsx`), высота ограничена у НЕГО
          (`maxHeight: var(--available-height)`), а `content` лежит внутри обычным блоком: своей
          высоты не ограничивает и торчит за пределы позиционера, потому что `overflow` у того
          дефолтный. Торчащий узел растит документ — отсюда прокрутка у страницы.
          `WorkspaceLayout` витрины при этом стоит `height: 100vh` + `overflow: hidden`,
          сам он не прокручивается: его увозит документ.

          Почему правка здесь, а не в наряде. Наряд `omnifield-select` списан с
          `playground/recipe.ts` буквально, вместе с дефектом. Запись наряда на стенде уже
          починена архитектором (2026-09-22), но следующий наряд спишут с того же образца и унесут
          ту же поломку — образец обязан быть верным.

          Охват — сверено по ВСЕМ `playground/recipe.ts` кита (2026-09-22). Часть `positioner`
          есть у пяти компонентов:

          - `select` — у `content` есть `overflow: auto`, но нет права сжиматься: прокрутка
            объявлена и мертва;
          - `menu`, `popover`, `date-picker` — у `content` нет ни `overflow`, ни ограничения
            высоты: прокрутки нет вовсе;
          - `drawer` — другой случай (высота стоит на самом `content`), под эту заявку не
            попадает, не трогать.

          Правка — та же, которой починен наряд селекта: `positioner` становится флекс-колонкой
          (`display: flex`, `flexDirection: column`), `content` получает `minBlockSize: 0`. Без
          второго флекс-элемент не сжимается вовсе (`min-height: auto` по умолчанию) и прокрутка
          остаётся мёртвой. `menu`/`popover`/`date-picker` вдобавок нужен сам `overflow: auto` на
          `content` — сегодня его там нет.

          Почему НЕ `maxBlockSize: var(--available-height)` прямо на `content`, как советует канон
          Ark (сверено по Ark UI MCP, styling guide селекта, 2026-09-22): переменную объявляет
          паспорт на `positioner`, а проверка скина не берёт наследование браузера на веру — голая
          ссылка на чужую переменную ловится как `variable-elsewhere`
          (`web-core/skin/src/engine/rules/check-value.ts`, README этой зоны, раздел «Recipe»).
          Флекс снимает вопрос: ссылки на переменную у `content` не появляется вовсе.

          Проверка закрытия: `test/recipe.test.tsx` каждого из четырёх плюс живой рендер — открыть
          список заведомо длиннее вьюпорта и убедиться, что прокрутка идёт внутри `content`, а
          документ не вырос.

          НЕ входит в объём. Наряды на стенде — это данные, не код: селект уже починен, остальные
          три правит тот, кто ведёт наряды. И отдельно — вопрос «должен ли кит ВЕЗТИ несущие
          стили сам, а не только доказывать их»: прокрутка списка не вкус, без неё одинаково
          ломается любой наряд, но правило «ноль стилей по умолчанию» этого не предусматривает.
          Развилка шире этой заявки, в доках зоны ответа нет, решает user — чинить её попутно
          не нужно.

          Сделано (2026-09-22): все четыре `playground/recipe.ts` — `positioner` стал флекс-колонкой
          (`display: flex`, `flexDirection: column`), `content` получил `minBlockSize: "0"`;
          `menu`/`popover`/`date-picker` вдобавок свой `overflow: auto` (у `select` он уже был).
          `drawer` не тронут. README четырёх компонентов несут этот факт в разделе «Рецепт», разбор
          «почему предел на позиционере, а прокрутка на содержимом» — в `FAQ.md` зоны.

          Проверка — БЕЗ браузера, решение user: живого Chromium в контейнере нет вовсе
          (`chrome-devtools` MCP запускается с `--executablePath /usr/bin/chromium`, файла нет, как
          и любого другого браузера; витрина одевает наряд из службы, а не образец из кита — живьём
          user посмотрит сам). Вместо него — сценарий в `test/recipe.test.tsx` каждого из четырёх:
          рендерится настоящий компонент с раскрытой плавающей половиной (у селекта — клик по
          триггеру, список из 40 пунктов), из документа берутся НАСТОЯЩИЕ узлы `positioner`/
          `content`, проверяется, что они совпадают с селектором сгенерированного CSS и что правило
          на этот селектор несёт нужные объявления. Проверено на отрицательном прогоне: без правки
          рецепта сценарий падает. `getComputedStyle` не годится — скин печатает всё внутри
          `@layer`, а jsdom этот слой не разбирает (разбор в `FAQ.md` зоны); раскладки у jsdom нет
          вовсе, поэтому ЧТО прокрутка реально идёт внутри `content`, этот тест не доказывает — это
          остаётся за живой проверкой.

          Общий помощник сценариев — `test/skin-rules.ts` (`declarationsFor`), рядом с
          `test/setup-dom.ts`, чтобы четыре файла не держали четыре копии разбора правила.

      - id: variant-entry-split-on-provider-rooted-components
        type: bug
        status: Backlog
        priority: High
        name: "Вид у пяти компонентов надо ставить в двух местах: провайдер печатает, корневая часть адресует"
        description: |
          Найдено при написании примеров (2026-09-24, `examples-for-every-component`), по коду —
          живьём не проверялось.

          У большинства компонентов вид едет одним атрибутом на корне: там же стоит `useKitLife`
          (просит у скина CSS именно этого вида) и там же корневая часть паспорта, на которую
          скин вешает селектор. У пяти это разошлось: `dialog` (корень паспорта — `content`),
          `drawer`/`popover`/`menu` (`positioner`), `toast` (`group`).

          Две половины по факту:

          1. Селектор вида строится ОТ КОРНЕВОЙ ЧАСТИ ПАСПОРТА — правило вида приклеивается к ней,
             остальные части адресуются через предка (`web-core/skin`, обход рецепта). Значит
             атрибут обязан оказаться на DOM-узле `content`/`positioner`/`group`.
          2. Печать вида запрашивает `useKitLife`, а он стоит на компоненте-ПРОВАЙДЕРЕ
             (`Dialog`/`Drawer`/`Popover`/`Menu`), который DOM не рисует вовсе — проверено чтением
             дистрибутива вендора: корень возвращает только провайдеры и `children`.

          В схемной сборке это разведено так же: провайдер получает только `providerProps`, а
          `instanceOf(component, rootProps, …)` кладёт пропы в корневой УЗЕЛ (`web-core/assembly`,
          отрисовка дерева). То есть одним входом вид этим компонентам не задать ни руками, ни
          схемой.

          Что решить: оставляем как есть и пишем в доке «ставьте в двух местах», или сводим к
          одному входу (например, `useKitLife` переезжает к корневой части, либо провайдер
          прокидывает вид дальше). Примеры для этих пяти не написаны — они ждут этого решения,
          чтобы не учить коллег обходу.

      - id: icon-cannot-receive-variant
        type: bug
        status: Backlog
        priority: Medium
        name: "Icon — ось вида объявлена, а передать вид нечем: props принимают только имя"
        description: |
          Найдено при написании примеров (2026-09-24, `examples-for-every-component`).

          `IconProps` объявляет ровно один проп (`name`), а сам компонент печатает на `<svg>` только
          адрес части (`anatomyParts.root.attrs`) — ни один консьюмерский атрибут до разметки не
          доходит. Значит `data-variant` иконке не передать: в JSX это ошибка типов, а даже пройдя
          её, атрибут не оказался бы в DOM. `useKitLife` при этом получает те же пропы, то есть
          вид не запрашивается и не печатается.

          При этом паспорт иконки ось вида ОБЪЯВЛЯЕТ, а её README утверждает, что кит «пропускает
          имя вида насквозь» — дока расходится с кодом, прав код.

          Решить: либо принимать вид (расширить пропы и пропустить атрибут в разметку), либо снять
          ось из паспорта и поправить README — сегодня объявлено то, чего нет. В примерах написано
          по коду: вида у иконки нет, размер и цвет она берёт от окружения либо от правил формы,
          написанных на её адрес.

      - id: splitter-and-timer-never-ask-for-skin
        type: bug
        status: Backlog
        priority: High
        name: "splitter и timer не зовут useKitLife — печать их формы никто не запрашивает"
        description: |
          Найдено при написании примеров (2026-09-24, `examples-for-every-component`): обход всех
          корневых файлов компонентов (`grep -L "useKitLife"`) нашёл ровно два — `splitter` и
          `timer`. Оба зовут только `traceLife`.

          Это тот же класс, что уже чинили у тостера (`toast-address-and-skin-hook`): там к
          отсутствию вызова добавлялось отсутствие адресации, здесь адресация на месте (обе зоны
          рисуются вендором, который сам спредит `data-scope`/`data-part`), а вызова нет. Значит
          форма для них не печатается по требованию, как у остальных тридцати одного компонента.

          Живьём не проверял — вывод из кода. Проверять надо так же, как проверяли тостера: надеть
          настоящий наряд и посмотреть, доезжает ли до этих двух хоть одно правило.

          В примерах этих двух компонентов фраза «по нему же компонент просит у скина свой CSS»
          НЕ написана намеренно — в остальных двадцати восьми она есть.

  - category: Пространственная система
    items:
      - id: part-kind-decides-padding
        type: bug
        status: Done
        priority: High
        name: "Вид части задаёт набивку, высоту и шрифт — кит перестаёт выглядеть как несколько разных китов"
        description: |
          Найдено user живьём (2026-09-23) на витрине: «у инпутов падинг space-4, а у контрола
          аккордеона space-3... как будто это вообще компоненты из разных китов. сетка но как будто
          смысла от неё нет».

          Диагноз: шкала не кривая — криво надета. `SPACE_ROLES` (`web-core/style`) говорит, сколько
          стоит роль, но нигде не было записано, КАКАЯ часть какую роль носит. Отсюда разнобой,
          снятый машинным обходом всех рецептов кита и всех форм службы: `menu`/`listbox` держали
          строку списка на `space-3`/`space-2`, а `select`/`radio-group`/`navigation-menu` — на
          `space-2`/`space-1`; `accordion`'s `control` стоял на компактной ступени со шрифтом от
          крупной, `toggle-group`'s `item` и `date-picker`'s `viewTrigger` — так же; кнопка несла
          крупную ступень с мелким шрифтом, а поле рядом — ту же ступень с крупным. Отдельно:
          `scroll-area`'s `content` носил свою набивку, хотя это место потребителя (правило README
          зоны), а `date-picker`'s `content` — `space-3`, роли для которой у панели нет вовсе.

          Решение (подтверждено user, сверено с рынком 2026-09-23 — Carbon ведёт одну ось размера и
          равняет пункт меню на триггер, Primer меняет шрифт и набивку согласованно, EightShapes
          «Size in Design Systems» называет отсутствие общего соглашения причиной разнобоя): четыре
          вида частей, вид выводится из СВОЙСТВ части, не из имени — контрол `md`, контрол `sm`,
          строка списка, панель. Триплет контрола (высота + набивка + шрифт) едет одним решением.
          Таблица — в README зоны (раздел «Recipe»), разбор «почему строка списка не контрол» — в
          FAQ зоны.

          Сделано (2026-09-23), кит: `accordion`/`tree-view`'s `control` получили свою вертикальную
          набивку и стали строками списка; `toggle-group`'s `item` и `date-picker`'s `viewTrigger`
          перешли на шрифт своей ступени; `navigation-menu`'s `link`, `toc`'s `link`, `date-picker`'s
          `presetTrigger`, `file-upload`'s `clearTrigger` — на набивку строки; `listbox`/`select`'s
          `itemGroupLabel` выровнены с `menu`; `date-picker`'s `content` — `space-4` (панель со
          свободным содержимым), `toast`'s `root` — равномерный `space-4`, `scroll-area`'s `content`
          свою набивку потерял.

          Формы службы приведены тем же правилом — 12 записей, 20 правок (`button`, `select`,
          `dialog`, `toggle`, `toggle-group`, `accordion`, `tree-view`, `navigation-menu`,
          `radio-group`, `file-upload`, `date-picker`, `date-picker-outline`). Перед этим тем же
          заходом закрыт более ранний слой того же дефекта: 15 расхождений набивки со ступенью
          высоты в 14 формах — авторы форм компенсировали руками раздутое семя `space`, которое
          владелец `web-core/style` вернул к опоре.

          Гейт: `test/space-roles.test.ts` вместо одной пары «высота ↔ набивка» проверяет вид части
          целиком — триплет контрола и общую набивку строки списка. Отрицательный прогон сделан
          (возврат шрифта `toggle-group` на прежний роняет пробу именно на нём).

          Набивка строки списка уточнена тем же заходом по решению user: `space-2`/`space-1` вместо
          первоначальных `space-3`/`space-2` — на ступень мельче по каждой оси. Правило то же, один
          набор значений на все списки кита; поправлены и кит, и формы службы, и гейт.

          Осталось ВНЕ этой работы: мелкие детали мельче младшей ступени (`2px` у ячейки календаря и
          полосы прокрутки, `0.125rem` у хода переключателя, `calc(var(--space-1) * 0.5)` у
          сегмент-группы) — шкала их не описывает, нужна ступень ниже `space-1` либо явное правило;
          заявка владельцу `web-core/style`. И проверка форм службы этим же правилом живёт пока
          разовым прогоном, а не гейтом: кит видит только себя.

  - category: Валидация
    items:
      - id: kit-life-validation-fold-in
        type: feature
        status: Done
        priority: High
        name: "useKitLife возвращает акцессор валидации — третье, что он делает, одним вызовом"
        description: |
          ТЗ от архитектора (2026-09-13), по итогам ADR `@web-core/form` (`web-core/form/ROADMAP.yaml`,
          категория «Роль и архитектура» — Done, механика реализована и прошла ревью, 11/11
          тестов). Пакет `@web-core/form` не рендерит, не владеет состоянием формы — производит
          `путь → issues` (валидность, из io-схемы сборки) и `nodeId → {hidden, disabled}`
          (производное UI-состояние, JsonLogic-правило из `node.meta.rule`). Задача этой зоны —
          подключить готовую механику к киту, тем же приёмом, каким уже подключён скин.

          Тот же файл, третий вызов — `useKitLife` (`web-core/ui/src/shared/utils/skin-life.ts`,
          сегодня `traceLife`+`useComponentSkin`, `void`, `component-skin-wiring` выше в этом же
          роадмапе) добавляет `useComponentValidation(passport, props)` из `@web-core/form/solid`
          и ВОЗВРАЩАЕТ её результат — `Accessor<ComponentValidation | undefined>`
          (`{invalid?, errorText?, hidden?, disabled?}`). НЕ второй хук рядом (архитектурное
          решение зафиксировано в `@web-core/form/ROADMAP.yaml`'s `kit-life-validation-fold-in`
          дословно от user: «useValidation должен быть внутри useKitLife»).

          Блаcт-радиус, сверено `grep -rl "useKitLife(" web-core/ui/src` (35 файлов): смена
          сигнатуры с `void` на возврат — АДДИТИВНА для 34 из 35. Они зовут `useKitLife(passport,
          props);` выражением-стейтментом, TS не требует использовать возврат — ни один из них не
          трогается этим пунктом. Реально читает результат только `Field`
          (`field-invalid-errortext-wiring` ниже) в рамках ЭТОГО захода; остальные компоненты с
          объявленным `invalid`-состоянием (`Select`/`Checkbox`/`RadioGroup` — сверить по `states`
          паспортов) — отдельным пунктом ПОСЛЕ того, как проводка на `Field` обкатана живьём, не
          вместе с ним (объём одного захода не растягиваем на весь кит сразу).

          Новая реальная зависимость — `@web-core/form` в `dependencies` `package.json` этого
          пакета. ПРОВЕРЕНО ЭМПИРИЧЕСКИ архитектором ДО передачи этого ТЗ (не на словах): временно
          заведена `"@web-core/form": "workspace:*"`, прогнан `pnpm exec nx graph` (без предупреждения
          о цикле, в отличие от прецедента `assembly⇄skin`, `web-core/assembly/ROADMAP.yaml`'s
          `verified-real-cycle-with-skin`) и `pnpm --filter @web-core/ui... build` — прошёл
          целиком, `web-core/ui build: Done`. Правка отменена сразу после теста (`git status` —
          пусто). `@web-core/form` зависит от `@web-core/assembly`+`@web-core/io`, ни один из них
          не зависит от `@web-core/ui`/`@web-core/form` — цикл структурно невозможен, и это же
          подтверждено прогоном, не только по графу на бумаге.

          `passport-validation-field-open-question` (`@web-core/form/ROADMAP.yaml`) закрыт БЕЗ
          правки паспорта (`web-core/skin/ROADMAP.yaml`'s `no-validation-axis-on-passport`) —
          `useComponentValidation` не читает `ComponentPassport`, первый параметр `useKitLife`
          прокидывается в неё чисто по совместимости сигнатуры, не по необходимости.

          Сделано (2026-09-13): `@web-core/form` добавлен в `dependencies` `package.json` насовсем
          (не откачен, в отличие от пробного захода архитектора). `shared/utils/skin-life.ts` —
          `useKitLife` третьим вызовом зовёт `useComponentValidation(passport, props)` и возвращает
          её результат вместо `void`; сигнатура `Accessor<ComponentValidation | undefined>`.
          `generate && typecheck && lint && build && test` — все зелёные, 283/283 тестов кита (было
          281, +2 новых в `test/skin-life.test.tsx`: без `<ValidationProvider>` акцессор отдаёт
          `undefined` тем же no-op'ом, что и скин; с провайдером и реально невалидными данными
          акцессор реально отражает `invalid` для узла по `data-node`). Блaст-радиус подтверждён на
          деле, не только по графу — typecheck прошёл на всех 35 файлах, зовущих `useKitLife`, без
          единой правки вызывающей стороны.

      - id: field-invalid-errortext-wiring
        type: feature
        status: Done
        priority: High
        name: "Первая нагрузка оси — Field реально показывает invalid/errorText"
        description: |
          Заблокировано `kit-life-validation-fold-in` (делается тем же заходом, не отдельно —
          `useKitLife` без содержимого нечего читать). Крючок уже стоит пустой:
          `web-core/ui/src/field/entity/passport.ts` объявляет состояния `invalid`/`required`/
          `errorText`/`requiredIndicator` с CSS-метками (`data-invalid` и т.п.) — скин уже умеет
          красить невалидное поле, не хватает только того, кто выставит эти пропы по правде.

          Правка `web-core/ui/src/field/components/root.tsx`:
          ```tsx
          export function Field(props: FieldProps) {
            const validation = useKitLife(passport, props); // теперь не void — акцессор
            return <ArkRoot {...dropAddress(props)} invalid={validation()?.invalid} errorText={validation()?.errorText} />;
          }
          ```
          `invalid`/`errorText` — родные пропы `FieldRootProps` (Ark), передаются как есть, без
          новой CSS-механики. Живой прогон — обязателен (не только `recipe.test.tsx` на бумаге,
          тот же урок, что `toast-part-attrs-missing` выше в этом файле): реальный рендер `<Field>`
          внутри `<ValidationProvider>` с заведомо невалидными данными, проверка, что
          `[data-invalid]`/текст ошибки реально появляются в DOM, не только что функция вызвана.

          Найдено при реализации: посылка ТЗ была неполной — `errorText` НЕ родной проп
          `FieldRootProps`. Сверено по d.ts `@ark-ui/solid/field`: `UseFieldProps` несёт
          `invalid`/`required`/`disabled`/`readOnly`/`id`/`ids`/`target`, `errorText`-сообщения
          там нет вовсе; `tsc` валит сборку на месте. `FieldErrorText` — самостоятельная часть,
          рендерящая ровно то, что ей передали детьми (`{...dropAddress(props)}`, без своего
          текста) — сегодня содержимое ошибки задаёт только сам потребитель руками. `invalid` —
          настоящий проп, довёл до DOM без проблем.

          User (2026-09-13): тестировать сейчас нужно именно ось форм — что компонент реально
          валидируется через `ValidationProvider`, а не визуальную часть. Стилизация невалидного
          состояния (`errorText` и подобное, чего АРК не даёт) — отдельный контракт со скином
          (визуал не на Ark, на нашем скине), решается отдельно с архитектором. `errorText` в эту
          заявку сознательно не входит — не мой сейчас выбор архитектуры, не хакал обход.

          Сделано (2026-09-13): `Field` (`components/root.tsx`) забирает акцессор из `useKitLife`,
          прокидывает `invalid={validation()?.invalid}` в `ArkRoot`. Новый
          `src/field/test/field-validation.test.tsx` — реальный рендер `<Field data-node="email">`
          внутри `<ValidationProvider>`: невалидные данные реально ставят `data-invalid` на
          `[data-scope="field"][data-part="root"]`, валидные — реально снимают (сигнал
          пересчитывается реактивно); без `<ValidationProvider>` — no-op, `data-invalid` не
          появляется сам по себе. `generate && typecheck && lint && build && test` — зелёные,
          285/285 тестов кита (было 283, +2 новых).

      - id: error-text-fold-in
        type: feature
        status: Done
        priority: High
        name: "FieldErrorText сам зовёт useKitLife — юзеру не нужно вручную прокидывать errorText"
        description: |
          Разобрано с user (2026-09-13) по шагам, отдельно от предыдущего пункта не потому что
          другая механика, а потому что первый заход (`field-invalid-errortext-wiring`) сознательно
          не входил в него — «тестировать сейчас нужно именно ось форм, не визуальную часть»
          (see log там же).

          `web-core/ui/src/field/components/error-text.tsx` сегодня — только `traceLife` +
          `dropAddress`, `errorText` содержимое рисует не сам, ждёт детей от потребителя. Правка —
          тот же приём, что уже в `Field`:
          ```tsx
          export function FieldErrorText(props: FieldErrorTextProps) {
            const validation = useKitLife(passport, props); // тот же passport, что у Field
            return <ArkErrorText {...dropAddress(props)}>{validation()?.errorText}</ArkErrorText>;
          }
          ```
          Условие для юзера — то же, что уже требует `invalid` у `Field`: `FieldErrorText` в
          составе модуля обязан получить СВОЙ `data-node` (тот же узел дерева, что валидирует
          нужный путь — обычно тот же `bind`, что у соответствующего `Field`, если оба заведены
          отдельными узлами с одним и тем же путём; если `FieldErrorText` не адресован отдельным
          узлом — акцессор просто `undefined`, `errorText` пуст, ничего не падает).

          НЕ трогает self-assembly-выращенные части (`field/playground/assemblies/basic.ts`) — там
          `errorText` получает текст старым способом (`{genus:"text", value:{path}}`, литеральная
          привязка к данным демо-витрины, никак не связана с `growValidatorLayer`); это отдельный,
          более ранний механизм, менять его не нужно и не входит сюда.

          Сделано (2026-09-13): `error-text.tsx` — `useKitLife(passport, props)` (тот же passport,
          что у `Field`) вместо голого `traceLife`, `<ArkErrorText>{validation()?.errorText}</...>`.
          `mergeProps` (`@zag-js/solid`, реактивный геттер) сохраняет консьюмерские `children`, если
          `validation()?.errorText` — `undefined` (без `<ValidationProvider>` или без своего
          `data-node` у самого `FieldErrorText`) — тот же приём, что уже вынес `invalid` в `Field`.

          Живьём найдено при тесте: `@ark-ui/solid`'s `FieldErrorText` САМ оборачивает себя в
          `<Show when={field().invalid}>` (`field-error-text.tsx` в дисте Ark) — читает `invalid`
          из СВОЕГО контекста `Field`, который уже реактивно ставит `field-invalid-errortext-wiring`
          (`invalid={validation()?.invalid}` на `Field`-корне). Значит узел `error-text` не просто
          красится, а физически появляется/пропадает из DOM САМ, без единой строчки от этой заявки —
          `errorText` внутри него был последним недостающим кусочком, не первым.

          `src/field/test/field-validation.test.tsx` — 2 новых сценария (было 2, стало 4): реальный
          рендер `<Field data-node="email"><FieldErrorText data-node="email"/></Field>` внутри
          `<ValidationProvider>` — невалидные данные показывают сообщение issue в DOM, валидные
          убирают УЗЕЛ ЦЕЛИКОМ (не просто текст — это Ark's `<Show>`, не наша механика);
          `FieldErrorText` без своего `data-node` — акцессор `undefined`, консьюмерский текст
          (`children`) остаётся как есть. `generate && typecheck && lint && build && test` —
          зелёные, 287/287 тестов кита (было 285, +2 новых).

      - id: invalid-state-rollout-remaining-components
        type: feature
        status: Backlog
        priority: Medium
        name: "invalid из useKitLife — ещё 8 компонентов кита с объявленным состоянием invalid"
        description: |
          Тот же однострочный приём, что уже в `Field` (`validation()?.invalid` → `invalid`-проп
          собственного `ArkRoot`), распространяется на остальные компоненты, у которых `invalid`
          уже объявлен в паспорте (`grep -rl "invalid" web-core/ui/src/*/entity/passport.ts` —
          полный список, не «и другие»): `checkbox`, `date-picker`, `file-upload`, `select`,
          `slider`, `segment-group`, `radio-group`, `switch`. Все восемь уже зовут `useKitLife(
          passport, props)` bare statement'ом (сверено чтением каждого `root.tsx`) — правка КАЖДОГО
          файла: забрать акцессор в переменную вместо bare-вызова, прокинуть `invalid` в
          собственный корневой Ark-компонент. Не требует знания, под каким ключом лежит `bind`
          (`value`/`checked`/т.п.) — `ownValuePathOf` (`@web-core/form/solid`) уже общий по любому
          единственному ключу, спец-случаев на компонент нет.

          Один компонент — один тест по образцу `field-validation.test.tsx` (реальный рендер внутри
          `<ValidationProvider>`, проверка `data-invalid` на реальном DOM-узле, не только что
          функция вызвана — тот же урок, что `toast-part-attrs-missing`). Восемь файлов, восемь
          тестов — делать по одному, не одним махом без проверки каждого (тот же компонент может
          использовать `invalid` иначе — сверить точку, прежде чем чинить, не копипастом вслепую).

  - category: Реестр отрисовки
    items:
      - id: module-source-into-renderer
        type: feature
        status: Done
        priority: High
        name: "kitComponentRenderer принимает источник модулей — реестр отдаёт moduleOf, узел-ссылка рисуется"
        description: |
          Заявка владельцу зоны (2026-09-23) от потребителя кита, через архитектора: движок сборки
          завёл третий род узла — ссылку на другой модуль (`AssemblyReference`), дерево модуля он
          спрашивает у реестра (`registry.moduleOf(name)`), а реестр берёт его из входа
          `createRegistry({components, admits, modules})`. `kitComponentRenderer`
          (`src/component-registry.ts`) зовёт `createRegistry` без `modules` и передать источник
          снаружи нечем — у функции один параметр, поставщик компонентов. Значит `moduleOf` у
          любого потребителя всегда `undefined`, и любая ссылка рисуется заглушкой, при том что
          сам движок готов целиком.

          Посылка заявки «правило допуска кита наружу не отдаётся, поэтому реестр не собрать у
          себя» — неверна: `admits` не наш и не константа этого файла, он приходит из
          `@web-core/skin/editor` и уже реэкспортирован подпутём `./passport`. Настоящая причина,
          по которой реестр не собирают на стороне потребителя, другая и не слабее: наружу не
          отдаётся `readable()` — склейка паспорта, карты частей (`kitOf`) и `accepts` из среза
          редактора, — а ходить за фактами о компонентах в сырой `./passport` прямо против правила
          зоны (`FAQ.md`: за фактом идут в `component-info.ts`, сырые подпути остаются под
          инфраструктурную проводку).

          Форма — ВТОРОЙ необязательный параметр `kitComponentRenderer(provider?, { modules })`, не
          поле в `ComponentRendererProvider` (заявка называла оба варианта и оставляла выбор зоне).
          Причина: `ComponentRendererProvider` расширяет `ComponentProvider`, а тот едет в
          `mergeComponentProviders` — при слиянии двух китов у `modules` нет осмысленного
          победителя, столкновение там определено только для имён компонентов. Источник модулей —
          состояние приложения, а не второй кит: DI-ось поставщика остаётся про «откуда берутся
          компоненты», источники сверх кита — своя ось.

          Живость ничего сверх не требует: `ModuleSource` — функция, реестр зовёт её на каждый
          `moduleOf`, а отрисовка читает её внутри мемо. Значит источник обязан читать сигнал
          внутри себя, а не быть снимком — это контракт движка, назвать его в доке зоны.

          Проверка закрытия: узел-ссылка на известный модуль рисуется настоящим поддеревом; правка
          исходного модуля видна в месте вставки без перемонтирования; ссылка на неизвестное имя
          даёт штатную заглушку, не падение. Путь проверки — настоящий путь потребителя
          (`kitComponentRenderer().instanceOf` + `insertNode` + `RenderTree`), не ручная
          подстановка пропов (тот же урок, что `tree-view-root-collection-not-bound`).

          Версия пакета: минор — состав входа расширяется, старые вызовы работают как раньше;
          поднимает архитектор при публикации.

          Сделано (2026-09-23): `src/component-registry.ts` — `ComponentRendererSources`
          (`modules?: ModuleSource`) вторым необязательным параметром `kitComponentRenderer`,
          источник уходит в `createRegistry` третьим полем. Вызывающая сторона не тронута ни в
          одном месте: параметр необязателен, поставщик остался первым.

          Проверка — настоящим путём потребителя, новый `test/component-registry.test.tsx`
          (3 сценария): узел-ссылка кладётся в дерево через `insertNode` и рисуется `RenderTree`.
          Известный модуль — в разметке появляется НАСТОЯЩЕЕ поддерево кнопки с подписью из данных
          ссылки; правка модуля (источник за сигналом) меняет `aria-label` на ТОМ ЖЕ DOM-узле
          (сравнение по ссылке на элемент — то есть без перемонтирования); реестр без источника —
          `moduleOf` отдаёт `undefined`, поддерева нет, а дерево-хозяин рисуется, консоль чистая.
          Отрицательный прогон сделан: без правки (`modules` не уходит в `createRegistry`) падают
          все три — третий уже на вставке, `insertNode` отказывает по `module-unknown`.

          `generate && typecheck && lint && test && build` — зелёные, 324/324 тестов кита
          (было 321, +3), `dist/component-registry.d.ts` несёт новый тип.
          Обоснование формы и условие живости источника — в `FAQ.md` зоны.

  - category: Граница поставки
    items:
      - id: vendors-stay-inside-the-kit
        type: feature
        status: Done
        priority: High
        name: "Вендоры кита перестают требовать объявления у потребителя"
        description: |
          ЗАДАЧА ОТ АРХИТЕКТОРА, 2026-09-24. Основание — решение уровня базы
          `web-core/ROADMAP.yaml`, `id: vendors-do-not-cross-delivery-border`: приложение на этой
          базе объявляет у себя ТОЛЬКО пакеты базы. Сегодня кит требует от него три сторонних
          имени, и узнаёт он об этом отказом установки, а не докой.

          Делается ПОСЛЕ зон `solid` и `build` — они обе идут раньше по порядку, раньше начинать
          нечем.

          Что означает результат:

          1. Реактивный движок уходит из `peerDependencies` совсем — ни peer, ни обычная
             зависимость. Он приедет транзитивно, через `@web-core/solid`, который к тому моменту
             будет держать его своей зависимостью. Объявить его здесь своим — значит привести в
             дерево вторую физическую копию и положить реактивность у всех, не только у себя.
          2. Прямые импорты вендора переводятся на фасад. ЗАМЕР ПОПРАВЛЕН 2026-09-24: в коде
             зоны их НЕТ ВОВСЕ — кит уже целиком на фасаде (108 импортов). Шесть файлов из
             первого, неточного замера оказались `.md`-примерами доки: они учат потребителя
             импортировать вендора напрямую, что решению противоречит, и правятся отдельно —
             но это дока, а не код.
          3. Компонентные библиотеки, на которых стоит кит, переезжают из `peerDependencies` в
             обычные `dependencies` и остаются внутри пакета. Файлы, которые их зовут (их 237),
             не трогаются вовсе — меняется только манифест: потребитель этих имён не импортирует,
             значит и объявлять их не должен.

          Проверить обязательно: после правки в дереве ровно ОДНА физическая копия реактивного
          движка. Это не формальность и не «и так понятно» — именно этот класс поломки peer-запись
          и держала, и ловится он не сборкой, а тем, что реактивный контекст одной копии невидим
          для другой.

          Проверка результата — не «зелёное у себя»: установка приложения-потребителя из реестра
          в чистый проект ВНЕ рабочего дерева. Внутри дерева пакеты соединены симлинками, и
          ошибки этого класса не видны здесь вовсе.

          СДЕЛАНО 2026-09-24: `peerDependencies` у зоны больше нет вовсе. Реактивный движок снят
          совсем — приезжает через фасад, который зона и так держит зависимостью. Компонентные
          библиотеки переехали в `dependencies` точными версиями; 237 файлов, которые их зовут,
          не тронуты — менялся манифест, не код. Пресет проб зоны переведён на то же имя
          рантайм-модуля, что и сборка, иначе проба и поставка резолвили бы разное.

          Проверено: одна физическая копия реактивного движка в дереве, сборка и 324 пробы зоны
          зелёные, у потребителя ни одного требования объявить чужое имя.

          Осталось отдельно: шесть `.md`-примеров зоны показывают импорт вендора напрямую —
          правится как дока.

      - id: diagram-barrel-lags-behind-its-code
        type: bug
        status: Backlog
        priority: Medium
        name: "Барель diagram отстал: помощники шкалы и радиальная часть наружу не выходят"
        description: |
          Найдено при написании примеров (2026-09-24, `examples-for-every-component`).

          `components/index.ts` диаграммы отдаёт `isBandScale` (сужение типа шкалы), `place`,
          `ticksOf`, `DiagramArc` и тип фрейма, а барель самого компонента (`src/diagram/index.ts`)
          перечисляет только `Diagram*`-части. В собранных типах поставки (`dist/index.d.ts`) этих
          имён нет — проверено грепом по собранному, не по исходникам.

          Следствие: рукописный путь, который README компонента показывает через `isBandScale`,
          снаружи пакета не соберётся — сузить тип шкалы потребителю нечем. Внутри кита тот же код
          работает, поэтому промах и не заметили: барель здесь ведётся руками, а не порождается.

          Решить: дописать барель (и заодно свериться, не отстали ли барели других компонентов тем
          же способом) либо признать эти имена внутренними и убрать пример из README. В EXAMPLES
          диаграммы путь оставлен с явным предупреждением о том, что снаружи он сегодня недоступен.

  - category: Информация о компоненте
    items:
      - id: component-info-sync-descriptor
        type: feature
        status: Done
        priority: Medium
        name: Синхронный срез компонента (componentDescriptorOf/listComponents) — без службы раздачи
        description: |
          Найдено user при разборе приложения-витрины (2026-09-12): "неудобно, приходится
          дублировать и собирать" про рутовые хелперы кита — конкретно двумя фактами.

          1. Список каталога компонентов и дерево показа в витрине оба писали
             `Object.keys(KIT).sort()` ради одного и того же перечня имён компонентов — и оба ради
             этого тащили весь Solid-кит (39 настоящих компонентов всех частей), хотя нужны были
             только ключи, которые давно лежат в данных (`PASSPORTS`, без единой строчки Solid).
          2. MCP-инструменты кита (синхронный процесс, без
             `presets`) вручную стыковали `passportOf`/`editorInfoOf`/`IO.get` по каждому
             компоненту — ровно ту же склейку, что уже делает `createComponentInfo`, только без
             async и без службы раздачи, которой MCP не имеет и не просит.

          Решение: в `component-info.ts` — `ComponentDescriptor` (паспорт + срез редактора + io,
          без skin) и `componentDescriptorOf(component, provider?)` поверх уже существующего
          `kitComponentProvider()`; `listComponents(provider?)` — отсортированные имена из
          `provider.components`. Оба принимают поставщика вторым (необязательным) параметром — та
          же DI-форма, что у `createComponentInfo`, второй поставщик кита — тем же
          `mergeComponentProviders`. `createComponentInfo` переписан поверх `componentDescriptorOf`
          вместо своей копии той же склейки — одна реализация на двоих, не две синхронизируемые
          вручную.

          Новый подпуть НЕ заведён: обе функции живут в уже опубликованном `./component-info`,
          сборка (`vite.config.ts`/`package.json` exports) не тронута.

          Проверено: тесты (`test/component-info.test.ts`, 5/5 — два новых сценария на
          `componentDescriptorOf` включая неизвестный компонент, один на `listComponents`),
          `tsc --noEmit`, `eslint`, `vite build` — весь пакет: 279/279 тестов зелёные, сборка без
          ошибок, `dist/component-info.js` обновлён.

          НЕ сделано здесь (зона приложения-потребителя, не `web-core/ui` — user переносит сам):
          переключение списка каталога и дерева показа на `listComponents()`, а MCP-инструментов —
          на `componentDescriptorOf()` вместо ручной стыковки.

      - id: component-info-derived-group
        type: feature
        status: Done
        priority: Medium
        name: groupOf(component)/GROUPS в component-info.ts — производный факт готовым, не сырой editorInfo
        description: |
          Продолжение `component-info-sync-descriptor`. User перевёл дерево каталога компонентов
          в витрине на `listComponents()`, но заметил живьём: файл
          всё ещё импортировал `GROUPS`/`editorInfoOf`/`groupOf` из `@web-core/ui/passport`
          напрямую и сам считал `groupOf(editorInfo)` — та же болезнь, что чинил
          `component-info-sync-descriptor`, просто на один шаг глубже. Дословно: "я не хочу чтобы
          потребители лазили в паспорта или в ио или подобные данные напрямую — я хочу чтобы это
          было через отдельный хелпер... если потребителю нужно работать не просто с компонентами,
          а с их внутренностями, чтобы он это делал через одну точку, а не ковырялся напрямую".

          Решение: `component-info.ts` — `groupOf(component, provider?)` (группа компонента,
          `undefined` — компонента/среза редактора нет) поверх `provider.editorInfoOf` +
          `@web-core/skin/editor`'s `groupOf(editorInfo)` (тот же приём, что `componentDescriptorOf`
          поверх `passportOf`/`editorInfoOf`/`io.get`); `GROUPS` — реэкспорт каталога групп оттуда
          же, не второй перечень рядом. Потребителю каталога компонентов (дерево показа, список)
          теперь достаточно `@web-core/ui/component-info` целиком — `@web-core/ui/passport` не
          нужен вовсе.

          Прямые импорты `@web-core/ui/passport`/`@web-core/ui/io` НЕ запрещены как таковые —
          подпути остаются для инфраструктурной проводки, которой нужна именно сырая функция
          (провайдер скина в приложении зовёт `passportOf` как
          `lookup` движка скина — не "внутренности компонента для показа", а контракт конкретного
          API движка). Правило — про потребителя, который хочет ФАКТ о компоненте для витрины/
          каталога/показа: тот идёт через `component-info.ts`, не собирает факт сам из сырых
          паспорта/среза редактора/io.

          Проверено: `test/component-info.test.ts` — два новых сценария (`groupOf` известного
          компонента входит в `GROUPS`, `groupOf` неизвестного — `undefined`, не подставляет
          дефолтную группу), `tsc --noEmit`, `eslint`, `vite build` — весь пакет: 281/281 тестов
          зелёные.

          НЕ сделано здесь (зона приложения-потребителя): переключение дерева каталога на
          `groupOf`/`GROUPS` из
          `@web-core/ui/component-info` — user переносит сам.

      - id: component-info-multiple-forms-per-component
        type: bug
        status: Done
        priority: High
        name: "componentInfo() берёт ПЕРВУЮ форму компонента и молча теряет остальные"
        description: |
          Найдено user живьём (2026-09-10) на реальных данных, не выдумано: у `date-picker` на
          проде ДВЕ сохранённые формы — `omnifield-date-picker` (без вариантов/тегов) и
          `omnifield-date-picker-outline` (`recipe.variants.outline`, `variantTags:
          {"outline":["default"]}`). Запрос "что известно про date-picker" отдавал пустые
          `variants`/`tags` — вторая форма с реальными данными терялась незаметно для того, кто
          спрашивал.

          Причина — `component-info.ts:200`: `const form = forms.find((record) =>
          record.state.component === component)`. `.find()` берёт первое совпадение. Это НЕ баг
          "два — это много, один — правильно": у `Form` есть `name`, `Outfit` выбирает формы ПО
          ИМЕНИ (`forms: string[]`) — несколько именованных форм на один компонент такая же
          законная часть модели, как несколько нарядов. Реальная причина: `componentInfo(component)`
          зовётся ТОЛЬКО именем компонента (сверено — стор компонента в витрине, единственный
          вызывающий), без наряда/имени формы. "Какая форма относится к
          компоненту" осмысленно только В КОНТЕКСТЕ конкретного наряда, а наряда функция не
          получает — и приложение сегодня вообще не хранит понятие "текущий наряд" (проверено
          grep'ом по приложению — такого сигнала нет), выбрать "правильную" форму сейчас НЕЧЕМ.

          Решение (user, 2026-09-10): раз выбрать нечем — не выбирать. `componentInfo` отдаёт ВСЕ
          формы компонента, не одну — молчаливая потеря данных прекращается, решение "какую
          показать" уходит к вызывающему, у которого хотя бы есть шанс это решить осмысленно (или
          показать все сразу). Конкретно: `ComponentSkinInfo.form` (одна запись) →
          `ComponentSkinInfo.forms` (список) — `variants`/`outfits`/`tags` уже считаются НА ОДНУ
          форму (`outfits.filter(record => record.state.forms.includes(form.name))` — по имени
          конкретной формы), значит тот же расчёт просто переезжает внутрь `.map()` по всем
          найденным формам, а не по одной.

          Известный потребитель ВНЕ этой зоны, который сломается молча, если его не поправить
          следом: страница показа компонента в витрине —
          `component.info()?.skin?.tags ?? []` — строит группы вкладок карусели показа. С новой
          формой (`skin.forms[]`, у каждой свои `tags`) это единственное место, которое реально
          читает старую форму `ComponentSkinInfo` во всём приложении (проверено grep'ом — других
          нет). Не чинить здесь (другая зона), но назвать явно, не оставлять сюрпризом.

          Сделано (2026-09-10): `component-info.ts` — `ComponentSkinFormInfo` (новый тип, одна
          форма: `form`/`variants`/`outfits`/`tags`, тот же состав, что раньше был на
          `ComponentSkinInfo`), `ComponentSkinInfo.forms: readonly ComponentSkinFormInfo[]`
          вместо `.form`; `forms.find()` → `forms.filter()`, `variants`/`outfits`/`tags` считаются
          внутри `.map()` по каждой найденной форме. `skin` остаётся `undefined`, когда для
          компонента не сохранено ни одной формы (семантика не менялась, менялось только "одна vs
          несколько найдено"). Тест `test/component-info.test.ts` — два новых сценария: несколько
          форм на одном компоненте (date-picker, как в живом случае user) отдаются обе, со своими
          независимо посчитанными variants/outfits/tags; ни одной формы — `skin` всё ещё
          `undefined`. Страница показа компонента в витрине — известный слом вне зоны, не
          трогал, эскалация архитектору остаётся в силе. 275/275 тестов кита зелёные.

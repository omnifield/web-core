      - id: no-kit-facade-for-list-filtering
        type: feature
        status: Backlog
        priority: Medium
        name: "Фильтрация списка — готового помощника кит наружу не даёт, потребитель идёт к вендору"
        description: |
          Найдено при написании примеров (2026-09-24, `examples-for-every-component`). README
          `listbox` показывает фильтрацию через помощника коллекций ВЕНДОРА — то есть учит
          потребителя импортировать чужое имя, при том что решение уровня базы гласит обратное
          (`vendors-do-not-cross-delivery-border`, `web-core/ROADMAP.yaml`; хвост про такие примеры
          уже назван в `vendors-stay-inside-the-kit`).

          Причина не в примере, а в поверхности: `shared/utils/collection.ts` отдаёт наружу только
          построение коллекции (`createListCollection`, `createItemListCollection`,
          `createItemTreeCollection`). Помощника «коллекция плюс функция фильтра, сужающая её по
          мере ввода» у кита нет вовсе, а `input` листа — настоящая часть анатомии ровно под этот
          сценарий: часть под фильтр есть, механики фильтра нет.

          В самих примерах обошёлся без вендора: фильтрация сделана обычным мемо над массивом, лист
          получает уже суженный `items`. Это рабочий путь и он честен, но он не то, что показывает
          README, и не то, что даёт вендор (у него фильтр живёт внутри коллекции).

          Решить: заводить ли свой помощник рядом с `createItemListCollection` (тогда `listbox`'s
          README и его примеры переписываются на него), либо признать фильтрацию делом потребителя
          и убрать вендорский пример из README. Первое дороже, но снимает чужое имя из доки зоны.

  - category: Скин
    items:
      - id: component-skin-wiring
        type: feature
        status: Done
        priority: High
        name: "Каждый компонент кита сам себя одевает — useComponentSkin(passport, props) вместо RenderNode"
        description: |
          План владельца web-core/skin, обсуждён с user 2026-09-11, ждём отмашку архитектора —
          в коде ничего не менялось, только согласование.

          Правки только в двух местах — web-core/skin (владелец) и web-core/ui (эта зона, ~35
          файлов). Служба раздачи пресетов и web-core/assembly не трогаются вообще: бэк уже отдаёт
          presets(kind, component) — резать по значению variant/setting нужно ВНУТРИ одного JSON-
          рецепта (весь компонент приезжает одним небольшим объектом), это задача клиента, не
          сети. assembly не звонит assemble()/checkOutfit() ни разу (подтверждено владельцем) —
          вызов теперь на стороне кита, не через RenderNode.

          На стороне web-core/skin (не моя работа, для контекста цепи):
          1. Узкая печать в engine/rules/engine/generate — берёт провалидированный на wear()
             рецепт компонента и печатает (а) base+defaultVariant ОБЯЗАТЕЛЬНО вместе при первом
             обращении (иначе движок ложно решит, что дефолта нет), (б) одно значение variant по
             запросу, (в) одно значение одной настройки по запросу, (г) compoundVariants, полностью
             покрытые уже загруженными значениями — только по variant, у settings пересечений с
             variant в модели нет (CompoundVariant не знает про settings).
          2. ensureComponentSkin(component, axis, value) — кеш+оркестрация (сеть/печать/доклейка в
             лист), в wear/switch.ts либо новый модуль рядом.
          3. useComponentSkin(passport, props) в solid/ — реактивный хук: следит за
             props[passport.variantAxis.mark.name] и props[каждый settings[name].mark.name], на
             каждое НОВОЕ значение зовёт ensureComponentSkin. Без <SkinProvider> в дереве — не
             падает, просто ничего не делает (отличие от useSkin(), который кидает throw вне
             провайдера — осознанно: кит обязан жить и без скина вообще).

          На стороне web-core/ui (моя работа):
          - В каждый components/root.tsx (~35 компонентов) — новый импорт
            `import { passport } from "../entity/passport.js"` (значение, не только тип) и вызов
            `useKitLife(passport, props)` сразу после сигнатуры функции, до useSlot/useAddress.
          - Риск рантайм-цикла (root.tsx → entity/passport.ts → type ButtonProps из
            components/index.js) проверен и закрыт: tsconfig везде `verbatimModuleSyntax: true` +
            `isolatedModules: true`, и ВСЕ ~35 entity/passport.ts уже берут пропсы через
            `import type` (не просто договорённость — компилятор обязан стереть это на сборке).
            Направление components → entity уже существует (root.tsx и так тянет anatomy.js из
            entity/), новый импорт passport — тот же вектор, не новый паттерн.
          - Вместо двух строк на файл (traceLife("ui.<component>") + useComponentSkin(passport,
            props)) — одна утилита `useKitLife(passport, props)` в
            web-core/ui/src/shared/utils/skin-life.ts (рядом с trace.ts/slot-chain.ts), внутри
            зовёт обе. Метка трейса выводится как `ui.${passport.component}`, не хардкодится
            руками в каждом файле — passport.component берётся из data-scope, который сама
            анатомия задаёт через `.rename("segment-group")` и т.п. (engine/passport/form/
            passport.ts:40,78) — это ТА ЖЕ строка, что сейчас руками вбита в traceLife("ui.segment-
            group"), просто без риска расхождения при будущем переименовании компонента.
          - Button как образец: entity/passport.ts уже импортирует `type ButtonProps` из
            components/index.js, settings пустые (defineSettings<ButtonProps>()({})) — хук будет
            следить только за variantAxis, алгоритм не ломается на пустом списке настроек.

          Сделано (2026-09-11): владелец web-core/skin выкатил свою часть тем же днём
          (component-skin-on-demand, отдельная запись в его ROADMAP) — `useComponentSkin`
          реально экспортирован из `@web-core/skin/solid`, дист пересобран. На стороне web-core/ui
          — `useKitLife(passport, props)` в `shared/utils/skin-life.ts`, добавлен в 32 из 33
          root.tsx (импорт `passport` как значение + вызов сразу после сигнатуры функции). `toast`
          сознательно пропущен — известный архитектурный аутсайдер (`_props: Record<string,
          never>`, ни variant, ни settings передать некуда), трогать без отдельного решения не
          стал.

          Найден и закрыт реальный (не мой) баг на стыке: первая версия `useComponentSkin`
          требовала `props: Readonly<Record<string, unknown>>` — индексную сигнатуру, которой НЕТ
          у обычных интерфейсов пропсов (`AccordionRootProps`, `DialogRootProps` и т.п. от
          `@kobalte/core`/`@ark-ui/solid`), только у полиморфных (`PolymorphicProps<T, ...>`).
          typecheck падал на 24 из 32 файлов. Не обходил `as`-кастом на своей стороне (это чужая
          сигнатура, костыль спрятал бы реальный гап) — эскалировал владельцу web-core/skin;
          починка пришла как `props: object` в `useComponentSkin` (фактический каст внутри самой
          функции). `useKitLife` под это же поправлен.

          Проверено: `pnpm run generate && pnpm run typecheck && pnpm run build && pnpm run test
          && pnpm run lint` — всё зелёное, 275/275 тестов кита, build без новых ошибок (только
          штатные предупреждения rollup про внешние зависимости, не новые).

      - id: toast-address-and-skin-hook
        type: bug
        status: Done
        priority: High
        name: "toast — ни одна из 5 частей не адресована (нет data-scope/data-part), поэтому скин не мог лечь физически"
        description: |
          Найдено user живьём (2026-09-12) после [[component-skin-wiring]]: «сейчас по стилям все
          ок, и каждый запрашивает стили сам кроме тостера» — то есть у ВСЕХ остальных компонентов
          скин реально лёг, у toast — нет.

          Причина в ДВА слоя, не в одном:

          1. `Toast` не звал `useKitLife`/`useComponentSkin` — печать CSS для него не запрашивалась
             вообще (это и было названо при выкатке [[component-skin-wiring]] как «сознательный
             пропуск», но там это объяснялось только отсутствием variant/settings пропсов —
             объяснение оказалось НЕПОЛНЫМ, см. пункт 2).
          2. Даже если бы звал — стили физически не могли бы совпасть ни с одним узлом DOM.
             Проверено по исходнику `@zag-js/toast` (`toast.connect.mjs`): машина Zag НЕ ставит
             `data-scope`/`data-part` сама, только `id`/`aria-*`. Эти атрибуты — целиком
             ответственность кита, их даёт только `anatomyParts.<часть>.attrs`
             (`@zag-js/anatomy`'s `.build()`, `create-anatomy.mjs:14-19`: селектор буквально
             `&[data-scope="…"][data-part="…"]`). В `toast/components/root.tsx` этого не было НИ НА
             ОДНОМ из 5 узлов (`ArkToaster`/`ArkRoot`/`ArkTitle`/`ArkDescription`/
             `ArkCloseTrigger`) — они рисовались голыми пропсами. Для сравнения: `accordion`
             (тоже без `useAddress` на своём root.tsx) не задет тем же образом, потому что там
             ВЕСЬ реальный вид лежит на дочерних `item/control.tsx`/`content.tsx`/`indicator.tsx`,
             которые адресуются отдельными файлами (`{...dropAddress(props)}
             {...anatomyParts.control.attrs}`) — у toast ЖЕ вообще нет отдельных файлов на части,
             всё рисует один `root.tsx`, и адреса не было вообще ни на одной.

          Проверено, что `playground/recipe.ts` у toast полноценный и рабочий (доказан
          `test/recipe.test.tsx`) — паспорт и рецепт готовы давно, не хватало только подключения
          в живом компоненте. Проверено и то, что `ensureComponentSkin` печатает `base` ВСЕГДА,
          независимо от того, накоплен ли хоть один variant (`scopeRecipe` копирует `base`
          безусловно, `accumulatorFor` в `presets/lazy.ts` сеет `variants` дефолтным вариантом
          формы, если он объявлен, но `base` не зависит от этого множества вовсе) — значит просто
          вызов `useKitLife` уже дал бы печать, а вот совпадение в разметке без адреса — нет.

          Фикс (обе части, в `web-core/ui`, не трогая `web-core/skin`):
          - `useKitLife(passport, props)` в `Toast` (переименовать `_props` → `props`, тип
            `ToastProps` не меняется).
          - `{...anatomyParts.group.attrs}` на `ArkToaster`, `{...anatomyParts.root.attrs}` на
            `ArkRoot`, `{...anatomyParts.title.attrs}` на `ArkTitle`,
            `{...anatomyParts.description.attrs}` на `ArkDescription`,
            `{...anatomyParts.closeTrigger.attrs}` на `ArkCloseTrigger` — прямой спред литералом,
            как у `accordion/components/item/control.tsx`, без `dropAddress` (у `Toast` нет
            внешних consumer-пропсов, которые могли бы принести чужой адрес, — `ToastProps` пуст).
          - Проверено по типам Ark (`@ark-ui/solid/dist/components/toast/index.d.ts`): `Toaster`/
            `ToastRoot`/`ToastTitle`/`ToastDescription`/`ToastCloseTrigger` — все `PolymorphicProps`
            + `HTMLProps`, произвольные атрибуты долетают до DOM без проблем.

          Не архитектурная правка, не новая механика — обычное подключение уже существующей
          адресации, которого не было сделано при первой сборке toast. `control.ts`/`getToaster()`/
          портал не трогаются.

          Сделано (2026-09-12): `useKitLife(passport, props)` (переименован `_props` → `props`) +
          `{...anatomyParts.<часть>.attrs}` на всех пяти узлах в `toast/components/root.tsx`.
          Новый `test/toast.test.tsx` — реальный рендер `<Toast />` + живой `toast.create(...)`,
          проверка `[data-scope="toast"][data-part="…"]` на все пять частей (не только рецепт на
          бумаге, как раньше делал единственный `recipe.test.tsx`). README/FAQ поправлены — старое
          объяснение «нечем кормить useKitLife» было неполным, реальная причина была в отсутствии
          адресации (см. FAQ.md). `generate && typecheck && build && test && lint` — зелёные,
          276/276 тестов кита (было 275, +1 новый).

      - id: workspace-grid-columns-not-variant-scoped
        type: bug
        status: Done
        priority: High
        name: "Workspace — gridTemplateColumns/Rows в base, общие на все варианты — сборке stacked нечем ими не быть"
        description: |

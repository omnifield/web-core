  - id: browser-mechanic-moved-from-zone
    type: plan
    date: 2026-09-05
    summary: >
      User сформулировал прод-план первого MCP-сервера зоны (эталоны толкаются на VPS, заявки тянутся
      обратно) и сразу указал: "тебе надо настроить просто базовые мехи для общения между
      инстансами... я предлагаю это вынести в web-core/mcp, бери сразу на себя". httpPeer/stdioPeer
      написаны первыми (peer/index.ts, peer.test.ts — реальный round-trip: httpPeer против живого
      createServer({transport:"http"}), stdioPeer против настоящего спавненного процесса-фикстуры
      test/fixtures/stdio-ping-server.mjs, включая проверку "один процесс на весь peer, не на
      каждый вызов" через process.pid). Пока шла правка браузерного клиента той зоны под
      stdioPeer, user отдельным сообщением уточнил объём шире: "вот это [browser.ts] неси тоже в
      общак, браузер нужен всем" — то есть не только связь, но и весь браузер-прокси целиком.
      Добавлен browser/index.ts (createBrowser) и browser.test.ts (реальный headless Chromium,
      skipIf без бинарника). Браузерный клиент зоны стал тонкой обёрткой (одна
      строка вызова createBrowser со своим executablePath из SKIN_MCP_CHROME_EXECUTABLE) —
      проверено живьём после переноса тем же способом (browser_navigate+browser_screenshot против
      реального дев-сервера показа, настоящий PNG на выходе).

  - id: unknown-session-and-origin-review-fixes
    type: plan
    date: 2026-09-05
    summary: >
      Второй раунд того же ревью, после починки concurrent-clients-review-fixes, нашёл ещё три
      момента. 1) Живым прогоном (10 запросов с выдуманными mcp-session-id): каждый строил и тут
      же выбрасывал целый McpServer со всеми тулами (11 построенных серверов, в карте сессий
      ноль) — не утечка, но чужой запрос оплачивался полной регистрацией впустую; починка —
      проверка "заголовок есть, в карте нет" ДО постройки, отвечает 404 сразу, новая пара строится
      только при ПОЛНОМ отсутствии заголовка. 2) Проверялся только Host, не Origin — спека MCP
      рекомендует именно Origin; практический риск был ограничен (браузерный preflight без CORS
      всё равно не пропустил бы ответ странице), но добавлено allowedOrigins тем же приёмом
      (свой чек в обработчике, не deprecated-опция транспорта), раз чек на Host уже есть рядом.
      3) Внутренняя `let transport` в handle() затеняла внешний `transport` (режим stdio/http) —
      сегодня не пересекается (проверка режима живёт в listen(), не в handle()), но одно имя на
      две вещи в одной функции — заготовка под чужую ошибку; переименована в sessionTransport.

  - id: concurrent-clients-review-fixes
    type: plan
    date: 2026-09-05
    summary: >
      Заявка от агента, готовящегося подключать своих клиентов к серверу зоны, нашла реальный баг
      живым прогоном (два клиента, SDK 1.30.0): один StreamableHTTPServerTransport на процесс
      ведёт одну сессию, второй клиент отваливается -32600 "Server already initialized" даже с
      sessionIdGenerator из более раннего пункта лога. Починка — карта {server,transport} по
      mcp-session-id, новая пара на каждый неизвестный id (onsessioninitialized/onsessionclosed
      транспорта складывают/убирают её из карты). Следствие, которое заявка тоже назвала прямым
      текстом и предложила решить осознанно: registerTools стал функцией в опциях createServer
      (вызывается на каждую новую сессию), а не готовым McpServer наружу — ломающее изменение
      публичной сигнатуры. Заодно из той же заявки: host по умолчанию "127.0.0.1" (было — все
      интерфейсы без auth это открытая дыра), allowedHosts свой чек в обработчике (не deprecated
      опции транспорта SDK), instructions — новое поле (единственное бесплатное место объяснить
      агенту порядок тулов, ответ на initialize). Явно НЕ тронуто по прямому указанию заявки:
      SKIN_MCP_TRANSPORT-переключение, обязательный access с падением при регистрации,
      разделение отказа протокола и отрицательного результата проверки, свободная форма входов.

  - id: folders-not-flat-files-in-src
    type: plan
    date: 2026-09-05
    summary: >
      Предыдущая запись лога (single-file-not-subpaths) сама была неверно понята: user имел в
      виду не "весь код в одном файле", а правило репозитория "в корне src только index.ts-барель,
      всё остальное по каталогам" (web-core/store: engine/ → ., machine/+addons/ → свои подпути;
      web-core/build тут не образец — у него нет корневого барреля вовсе). Три подпути (`.`,
      `/transport`, `/pagination`) возвращены — они были верны с самого начала, ошибкой было
      собрать их в плоские файлы src/index.ts+transport.ts+pagination.ts вместо каталогов
      register-tool/, transport/, pagination/ с тонким корневым барелем, реэкспортирующим только
      register-tool/ (общее — через барель, тяжёлое/опциональное — своим подпутём+каталогом).

  - id: single-file-not-subpaths
    type: plan
    date: 2026-09-05
    summary: >
      User поправил структуру после первого прохода: код был раскидан по трём файлам
      (index.ts/transport.ts/pagination.ts) с тремя exports-подпутями — калька формы
      web-core/build, но без довода build (там подпути — правда разные цели потребления: конфиг
      Vite, JSON-профиль типов, бинарник). Здесь все три функции потребляются одним способом
      (импорт в TS-файл MCP-сервера зоны) — подпути были поверхностью ради поверхности. Собрано в
      один src/index.ts, один адрес поставки; заодно убраны все объясняющие абзацы из кода
      (правило репозитория "в коде — не проза") — обоснования только в FAQ.md.

  - id: z-via-io-not-raw-zod
    type: plan
    date: 2026-09-05
    summary: >
      Package.json нёс "zod" отдельной зависимостью (сперва dependencies, потом devDependencies
      для тестов) — user спросил, почему не через web-core/io, которая уже единственная точка
      входа к z в репозитории (web-core/io/src/engine/index.ts, прямым текстом "z через этот
      пакет, не напрямую из zod"), тем же приёмом, что и первый MCP-сервер зоны. "zod" снято из
      package.json целиком, тесты берут z из @web-core/io (devDependency) — src/index.ts саму
      zod не импортирует, только тип AnySchema из @modelcontextprotocol/sdk (стирается на
      компиляции).

  - id: sessionid-not-stateless-in-ts-sdk
    type: plan
    date: 2026-09-05
    summary: >
      Первая версия createServer({transport:"http"}) использовала sessionIdGenerator: undefined
      (честный stateless, по аналогии с Windshift Stateless: true) — живой тест показал, что
      ВТОРОЙ HTTP-запрос на тот же transport падает 500 без сообщения. Причина найдена в
      собственном эталонном примере SDK (examples/server/simpleStatelessStreamableHttp.js):
      честный stateless в этой версии @modelcontextprotocol/sdk требует новый McpServer+transport
      НА КАЖДЫЙ запрос — несовместимо с моделью "тулы регистрируются один раз в createServer".
      Починка — sessionIdGenerator: () => randomUUID() (stateful, сессия в заголовке
      mcp-session-id, SDK ведёт её сам) — проверено тем же способом, работает на много запросов
      подряд одним зарегистрированным сервером. Windshift использует другой (Go) SDK другого
      вендора — поведение между реализациями одного протокола не гарантированно совпадает.

  - id: zod-output-schema-was-unnecessary
    type: plan
    date: 2026-09-05
    summary: >
      Изначальный план нёс отдельную точку поверхности /schema (zodTool) — предполагалось, что
      outputSchema требует ручной конвертации Zod → JSON Schema, тем же приёмом (z.toJSONSchema),
      которым первый MCP-сервер зоны уже строит io-схему для get_passport. Чтение исходников
      SDK (@modelcontextprotocol/sdk/server/mcp.js, normalizeObjectSchema/toJsonSchemaCompat)
      перед написанием кода показало: registerTool уже принимает настоящую Zod-схему в
      input/outputSchema напрямую и сам делает и конвертацию, и safeParseAsync-валидацию —
      z.toJSONSchema там решает другую задачу (показать io-схему КАК ДАННЫЕ внутри ответа
      тула, не заявить outputSchema самого тула). Точка /schema снята, output стал просто полем
      ToolDefinition — меньше поверхности, тот же результат.

  - id: genus-tooling-decision
    type: plan
    date: 2026-09-05
    summary: >
      Пакет заведён user (web-core/mcp, пустой на момент старта) как ответ на аудит
      первого MCP-сервера зоны: MCP скоро едет на сервер отдельно и станет основным способом создания
      скинов, важнее ручного редактора — значит дыры аудита (annotations, outputSchema,
      isError-конвенция, транспорт/auth, дублирование между будущими MCP-серверами разных зон)
      стоит закрывать один раз в общем месте, а не по зоне. User classified genus как tooling
      ("он тоже тулинг" — по аналогии с web-core/build) — образцы доков взяты оттуда же, не из
      web-core/store (engine).

  - id: v1-scope-agreed
    type: plan
    date: 2026-09-05
    summary: >
      Объём v1 согласован после трёх источников: 1) построчный аудит первого MCP-сервера зоны
      (все его файлы, не выборка) — консолидированные тулы и
      actionable-флавы уже хороши, но annotations/outputSchema отсутствуют целиком, isError не
      используется никогда, list_presets без пагинации, транспорт только stdio; 2) внешний
      research — гайд Anthropic "Writing effective tools for AI agents" (консолидация тулов,
      семантические имена, actionable errors, response_format, eval-driven итерация) и спека MCP
      2025-06-18 (tools/annotations, outputSchema+structuredContent, isError, OAuth 2.1 для
      удалённых серверов); 3) внутренний образец — Windshift internal/aitools/registry.go
      (Access/Risk обязательны при регистрации, паника если не проставлены) и
      internal/mcp/server.go (Streamable HTTP + bearer-auth-мидлварь, уже едет на сервере). v1 —
      registerTool с обязательными annotations, ok/err с isError-конвенцией, zodTool для
      outputSchema, createServer (stdio/http + auth-хук), paginate. Сознательно вне v1 (см.
      категорию "Не в этом пакете"): сама проверка токена под конкретный бэк, response_format
      per-тула, eval-харнесс — все три обсуждались явно и отложены как задачи потребителя/зоны,
      не общего пакета.

# Дорожная карта @web-core/mcp — источник правды по фактически сделанной работе. Статус
# проставляется рядом с работой, в момент когда она сделана — не задним числом. Формат тот же,
# что у web-core/build/store (categories → items, log → журнал решений); без milestones — у
# пакета нет освоенной поставки с датами релиза, только сделанное и открытое.

categories:
  - category: Регистрация тула
    items:
      - id: register-tool-mandatory-annotations
        type: feature
        status: Done
        priority: High
        milestone: null
        name: registerTool() — обязательные annotations, input/output как настоящие Zod-схемы
        description: |
          Означает: тул нельзя зарегистрировать без явного access ("read"/"write"/"destructive")
          — регистрация бросает на старте, не молча принимает тул без разметки. access
          отображается в нативные annotations спеки MCP (readOnlyHint/destructiveHint),
          idempotent/openWorld — отдельные необязательные флаги поверх. input/output —
          настоящие Zod-схемы: SDK (@modelcontextprotocol/sdk) сам валидирует по ним аргументы и
          сам строит JSON Schema для протокола — отдельного шага конвертации нет вовсе (см. log,
          zod-output-schema-was-unnecessary).
          Причина: аудит первого MCP-сервера зоны показал, что там annotations нет вовсе — ни один из
          десяти тулов не размечен, save_preset (пишет) неотличим от list_components (читает), и
          outputSchema не объявлен ни разу. Образец обязательности — Windshift
          internal/aitools/registry.go (Access/Risk/Scopes обязательны, паника при регистрации
          без них).

      - id: response-envelope
        type: feature
        status: Done
        priority: High
        milestone: null
        name: ok()/err() — конверт ответа по спеке
        description: |
          Означает: успех и отказ хендлера всегда заворачиваются в форму, которую ждёт спека MCP
          (content, structuredContent если есть output, isError) — хендлеру не нужно знать про
          протокол вообще.
          Причина: в первом MCP-сервере зоны isError никогда не true, даже для настоящих отказов
          (unknown component) — расхождение со спекой, найденное аудитом, не осознанное решение.

  - category: Транспорт
    items:
      - id: transport-bootstrap
        type: feature
        status: Done
        priority: High
        milestone: null
        name: createServer() — stdio и Streamable HTTP одним конфигом
        description: |
          Означает: зона поднимает сервер локально (stdio, как сегодня первый MCP-сервер зоны)
          и на сервере (Streamable HTTP) без переписывания — выбор транспортом по конфигу/env, не
          отдельным кодом на каждую зону.
          Реализация: auth — точка расширения (хук-функция на каждый HTTP-запрос), сама проверка
          токена/scope — забота потребителя, не пакета. HTTP-транспорт держит сессию НА КЛИЕНТА —
          отдельная пара McpServer+StreamableHTTPServerTransport на каждый новый mcp-session-id,
          в карте по id (одна пара на процесс держала ровно одну сессию — второй одновременный
          клиент отваливался с -32600, найдено ревью, см. FAQ.md). registerTools теперь функция в
          опциях, а не готовый McpServer наружу — вызывается заново на каждую сессию (ломающее
          изменение публичной сигнатуры, принято осознанно). Неизвестный (не пустой) mcp-session-id
          отвечает 404 ДО постройки McpServer — до починки строился и выбрасывался целый сервер со
          всеми тулами на каждый чужой/протухший id (найдено тем же ревью: 10 выдуманных id → 11
          построенных серверов, в карте ноль). host по умолчанию "127.0.0.1" (раньше — все
          интерфейсы без предупреждения), allowedHosts/allowedOrigins — свои чеки по заголовкам
          Host/Origin в обработчике (не deprecated-опции самого транспорта SDK). instructions —
          новое поле, уходит в ответ initialize. Windshift internal/mcp/server.go — образец формы
          решения (HTTP + auth-мидлварь), не буквальной настройки транспорта (тот Stateless: true
          — другой SDK, другого вендора, не совпадает).

      - id: listen-error-handling
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "listen() ловит ошибку старта HTTP-сервера явно, не валит процесс сырым исключением"
        description: |
          Означает: `server.once("error", cause => reject(...))` рядом с `server.listen(port, host,
          resolve)` — без этого ошибка старта (порт занят) была необработанным событием
          `EventEmitter`, Node валил весь процесс сырым стектрейсом, а промис `listen()` не
          резолвился и не отклонялся, просто зависал. Теперь `await server.listen(port)` либо
          резолвится, либо отклоняется понятной причиной («MCP HTTP-транспорт не смог подняться на
          HOST:PORT — порт N уже занят другим процессом»).
          Причина: найдено живьём — первый MCP-сервер зоны в реальном dev-контейнере падал `EADDRINUSE`
          на каждом старте `pnpm run serve`, порт по умолчанию (`3000`) был занят сторонней
          инфраструктурой контейнера, не web-core.
          Проверено тестом: два `createServer({transport:"http"})` на один порт подряд — второй
          `listen()` отклоняется этим сообщением, не роняет тестовый процесс. 29/29 (было 28).

      - id: tool-handler-request-context
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "registerTool прокидывает ToolContext (заголовки, sessionId) — раньше терялся вторым аргументом"
        description: |
          Означает: хендлер тула теперь получает `ToolContext` (`{headers, sessionId?}`) — вторым
          параметром у тулов с `input`, единственным — у тулов без него (та же вилка, которой сама
          SDK зовёт хендлер: `server/mcp.js`'s `executeToolHandler`, `handler(args, extra)` при
          `inputSchema`, `handler(extra)` без неё). `headers` — реальные HTTP-заголовки запроса
          (`extra.requestInfo.headers` SDK, пусто на stdio), не весь `RequestHandlerExtra` SDK
          (там ещё `signal`/`sendNotification`/`taskStore` — служебное для транспорта, не для
          автора тула).
          Причина: НАШ баг, не ограничение MCP — `RawRegisterTool`'s хендлер был типизирован как
          `(args: unknown) => ...`, ОДИН параметр, `server.registerTool.bind(server) as unknown as
          RawRegisterTool` кастом прятал урезку: SDK реально зовёт хендлер с `extra` (несёт
          `requestInfo.headers` на КАЖДЫЙ вызов, не только `initialize`) — обёртка его отбрасывала.
          Найдено живой заявкой внешнего агента, которому нужен был способ доказать серверу, чей
          запрос — заголовком `X-User-Login`, не аргументом тула (аргумент агент печатает сам,
          заголовок — нет, транспортом управляет платформа перед ним). Реакция на реплику user
          «подцепить хедеры — самая тривиальная задача, что не так с архитектурой» — оказалось, не
          с архитектурой MCP, а с нашей же обёрткой; починено на месте, не обойдено сбоку.
          Проверено тестом на реальном HTTP (оба ветвления — тул с `input` и без): клиентский
          заголовок `X-User-Login` доходит до хендлера неизменным. 31/31 (было 29).

  - category: Листинги
    items:
      - id: cursor-pagination
        type: feature
        status: Done
        priority: Low
        milestone: null
        name: paginate() — курсорная пагинация list_x
        description: |
          Означает: любой list_x-тул (list_presets у первого потребителя, будущие list_x в других зонах)
          отдаёт страницу с nextCursor, а не весь список разом — сегодня list_presets в
          первом MCP-сервере зоны отдаёт всё по виду без лимита.

      - id: bounded-limit-schema
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "limitSchema — общий потолок поля limit, не language max в JSON Schema"
        description: |
          Означает: `z.number().int().positive()` без верхней границы печатает в JSON Schema
          предельное целое языка (`9007199254740991`) — не бизнес-правило, а утечка типа.
          `limitSchema` (`max(100)`) — общая экспортируемая схема рядом с `paginate()`, не
          переизобретается в каждой ручке каждой зоны. `@web-core/io` стала настоящей (не dev-)
          зависимостью пакета — `z` теперь используется в исходнике, не только в тестах.
          Причина: живая заявка на первый MCP-сервер зоны — то же число повторялось в описании ЧЕТЫРЁХ
          разных ручек (`list_components`/`list_presets`/`list_feedback`/`list_content`), каждая
          сама набирала себе схему `limit` с нуля.
          Проверено тестом: `z.toJSONSchema(limitSchema).maximum === 100`, не
          `Number.MAX_SAFE_INTEGER`; `safeParse(101)` отказывает, `safeParse(100)` проходит.

      - id: default-limit-lowered
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "paginate()'s DEFAULT_LIMIT 50 → 20 — потолок был выше любого реального набора"
        description: |
          Означает: `paginate(items)` без явного `limit` режет на 20, не на 50. Затрагивает КАЖДЫЙ
          list_x любой зоны, который не передаёт свой `limit`.
          Причина: живая заявка на первый MCP-сервер зоны — точечная правка одной ветки (`list_presets`
          без `kind`, свой `OVERVIEW_LIMIT`) оставила СОСЕДНИЕ вызовы того же общего `paginate()`
          дырявыми: `list_components()` (35 записей) и `list_presets(kind:"form")` (28 записей) оба
          отдавали всё целиком без `nextCursor`, потому что 50 не было пройдено НИ НА ОДНОМ реальном
          наборе во всей зоне — default был мёртвым правилом везде, не только там, где заметили
          первым. «Закрыть это правилом, а не точечно»: правка одна, в общем движке, не по ручке.
          20 — планка ниже обоих известных счётчиков (28, 35), проверяема прямо сейчас.
          Проверено тестом: набор из 25 элементов без `limit` — 20 в странице, `nextCursor` есть.
          34/34 (было 33).

      - id: transport-test-port-race
        type: bug
        status: Done
        priority: Medium
        milestone: null
        name: "transport.test.ts — гонка порта между соседними тестами, найдена не по этой правке"
        description: |
          Означает: два теста на заголовки (`ToolContext`) в конце `transport.test.ts` получили
          свои номера портов (`PORT+1`, `PORT+2`), не общий `PORT` с остальными десятью тестами
          файла — `server.close()` не гарантирует, что предыдущий сервер полностью освободил порт
          к моменту, когда следующий тест того же файла начинает `listen()` на ТОМ ЖЕ числе.
          Причина: обнаружено СЛУЧАЙНО при добавлении bounded-limit-schema — правка в СОСЕДНЕМ
          файле (`pagination.test.ts`) не должна была задеть `transport.test.ts`, но полный прогон
          пакета внезапно словил `SocketError: other side closed` именно там, стабильно. Изолировано
          проверкой: тест отдельно (`vitest run transport.test.ts -t "no input"`) — зелёный; весь
          файл целиком — падает на этом же тесте 3 раза подряд. Гонка была латентной с самого
          добавления этих двух тестов, просто раньше не всплывала на конкретном порядке выполнения.
          Проверено: 3 прогона всего пакета подряд после починки, без единого падения. 33/33 (было
          31, плюс 2 теста limitSchema).

  - category: Документация
    items:
      - id: readme-tooling-skeleton
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: README/FAQ/ROADMAP по шаблону tooling
        description: |
          Означает: тройка доки заведена по образцу web-core/build (genus: tooling, тот же
          порядок разделов). Начиналась как согласованный с user план до кода — теперь описывает
          настоящую реализацию (index.ts-барель + register-tool/transport/pagination каталогами,
          реальные тесты, реальный round-trip через MCP SDK), не план.

      - id: real-tests-not-mocks
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Тесты — настоящий round-trip через MCP SDK, не имитация
        description: |
          Означает: registerTool/ok/err проверены через InMemoryTransport.createLinkedPair() с
          настоящим Client (annotations на проводе, structuredContent, isError), createServer —
          через настоящий StreamableHTTPClientTransport на реально поднятый HTTP-порт (успех, 401
          от auth-хука, проход после верного заголовка), paginate — полный обход list по
          nextCursor. 15/15 зелёных (vitest run).

  - category: Обмен с другими инстансами
    items:
      - id: peer-connector
        type: feature
        status: Done
        priority: High
        milestone: null
        name: httpPeer()/stdioPeer() — клиент к чужому MCP-серверу, ленивое подключение
        description: |
          Означает: любая зона может дозвониться до другого MCP-сервера (HTTP-адрес или локальный
          процесс по stdio) и позвать его тул через один и тот же интерфейс ({callTool, close}) —
          не пишет клиентский код заново на каждую пару зон. Подключение — на первый callTool, не
          в момент вызова httpPeer/stdioPeer (объявить peer — не то же самое, что решить им
          воспользоваться; ранний коннект открыл бы соединение или процесс впустую).
          Причина: браузерный клиент первого MCP-сервера зоны был написан как разовый клиент к
          chrome-devtools-mcp прямо в зоне — задача "дозвониться до другого MCP и позвать тул"
          ничем не завязана на скин, её же назовёт прод-синк той же зоны (list_feedback с прод-
          инстанса, push эталонов на прод). Перенесено сюда до второго использования, не после.

      - id: stdio-peer-env-passthrough
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "stdioPeer(..., {env}) — явный проброс окружения дочернему процессу"
        description: |
          Означает: StdioPeerOptions получил третье поле env (Record<string,string|undefined>,
          undefined-значения отфильтровываются перед передачей в StdioClientTransport) — не задано,
          SDK по-прежнему даёт свой обрезанный безопасный набор (PATH/HOME/SHELL/USER/LOGNAME/TERM),
          не весь process.env. Умолчание НЕ поменяно (осознанно: stdioPeer порой спавнит СТОРОННИЙ
          процесс — chrome-devtools-mcp через npx в createBrowser — которому наши секреты видеть не
          нужно, supply-chain-риск при полном наследовании по умолчанию).
          Причина: живая финальная сверка первого MCP-сервера зоны перед первым деплоем на VPS прогнала
          stdioPeer("pnpm",["start"]) с SKIN_MCP_ADMIN_AUTHOR/TOKEN/CHROME_EXECUTABLE в оболочке
          теста — оба симптома (author-guard молча пропустил чужую перезапись, browser_screenshot
          не нашёл Chrome) оказались одной причиной: дочерний процесс их не увидел вовсе. Скрипт
          синка с продом той же зоны (спавнит СВОЙ ЖЕ локальный сервер тем же stdioPeer) чинится
          тем же полем — env: process.env, доверенный случай, не сторонний процесс.
          Проверено живьём и тестом: две новые строки в peer.test.ts (env не передан — фикстура не
          видит свою переменную; env: process.env передан — видит) плюс повторный прогон полной
          финальной сверки того же сервера (17 тулов, author-guard/content/feedback/browser — все
          зелёные после починки). 27/27 в web-core/mcp (было 25).

      - id: browser-proxy-factory
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: createBrowser() — обёртка над chrome-devtools-mcp (newPage/navigate/screenshot)
        description: |
          Означает: зона получает headless-браузер как три функции (newPage/navigate/screenshot)
          поверх stdioPeer к chrome-devtools-mcp, без своего рендера — не переписывает то, что
          внешний пакет уже поддерживает (--pageIdRouting, включён по умолчанию, "useful for
          concurrent agent sessions" по его собственной документации). pageId — число, разобранное
          регуляркой из текстового списка страниц ("`${N}: ... [selected]`") — реальный формат
          ответа new_page/navigate_page, не структурированное поле (проверено живым вызовом, не по
          документации). executablePath/chromeArgs — параметры фабрики, не хардкод: путь к
          бинарнику Chrome и обязательные для контейнера флаги (--no-sandbox,
          --disable-dev-shm-usage) отличаются между дев-контейнером и прод-VPS.
          Причина: первому MCP-серверу зоны понадобился браузер для визуальной обратной связи внешнему
          агенту — механика (процесс chrome-devtools-mcp, peer, парсинг pageId) не специфична
          скину, унесена сюда до того, как обросла бы второй копией в следующей зоне.

      - id: browser-click-and-snapshot
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Browser.snapshot()/.click() — настоящий клик мышью, не переход по URL"
        description: |
          Означает: Browser получил snapshot() (текстовое a11y-дерево, каждый узел с uid — источник
          адресации для click) и click(pageId, uid, {dblClick?}) — chrome-devtools-mcp's click
          адресует ТОЛЬКО по uid (не CSS-селектор), поэтому обе функции добавлены одной заявкой, не
          порознь: click без snapshot был бы нечем адресовать. Формат снимка ("uid=1_1 button ...")
          и то, что uid элемента может смениться после клика при обновлении DOM — проверено живым
          вызовом на реальной кнопке (uid=1_2 до клика → uid=2_0 после, та же логическая подпись).
          Причина: живая заявка от внешнего агента, работающего с первым MCP-сервером зоны — browser_navigate
          (жёсткий переход по URL) не воспроизводит клик по пункту дерева внутри SPA (переход
          роутером — другой код-путь), баг с миганием ловится именно на клике, через тогдашние тулы
          физически не воспроизводился. Трейсы производительности (второй вариант из той же заявки,
          для ловли переходного кадра) сознательно НЕ добавлены — заявка сама пометила это как
          опциональное, более дешёвый путь (серия screenshot без ожидания settle сразу после click)
          уже доступен существующими тулами без единой новой строки; трейсы — задача на будущее,
          если этого дешёвого пути не хватит на практике (см. FAQ.md).
          Проверено живьём: полный цикл navigate→snapshot→click→snapshot через реальный сервер зоны
          (не только сам пакет) — текст страницы после клика меняется ровно так, как задал
          обработчик. 28/28 в web-core/mcp (было 27).

  - category: Фидбэк
    items:
      - id: feedback-subpath
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "`@web-core/mcp/feedback` — тонкий GraphQL-клиент к фидбэку, product-agnostic"
        description: |
          Контекст: фидбэк-тулы первого MCP-сервера зоны сегодня зовут СВОЙ отдельный REST-клиент
          (`save`/`list`/`read`/`update` на `kind:"feedback"`) — мёртв против нового бэка (REST
          снят). Фидбэк решением user — сущность общая на все продукты, не вид пресета одной
          зоны: служба хранения завела под неё отдельный кусок схемы, НЕ `Preset`, своим
          решением на своей стороне. Этот пакет — общий тулинг
          для ЛЮБОГО будущего MCP-сервера зоны, значит транспорт живёт здесь, не в зоне-потребителе.

          Своя папка `src/feedback/`, свой подпуть `@web-core/mcp/feedback` — тот же приём, что у
          `/peer`/`/browser` (независимая тема, не через корневой барель). Реальная схема бэка
          (общая схема фидбэка службы хранения, уже реализована и принята):

          ```graphql
          type FeedbackEntry { id savedAt tool action expected actual sign status at resolvedAt note }
          input FeedbackInput { tool action expected actual sign }
          extend type Query { feedback(status: String, sign: String): [FeedbackEntry!]! }
          extend type Mutation {
            reportFeedback(input: FeedbackInput!): FeedbackEntry!
            resolveFeedback(id: ID!, note: String): FeedbackEntry!
          }
          ```

          Три функции — зеркало трёх операций, не больше: `reportFeedback(url, input)`,
          `listFeedback(url, {status?, sign?})`, `resolveFeedback(url, id, note?)`. Транспорт —
          `graphqlRequest`/`gql` из `@web-core/query/graphql` (пакет становится настоящей
          dependency, не только у `web-core/skin`) — тот же приём, каким `web-core/skin/src/
          presets/client.ts` уже обёрнут в `PresetsRefused`/`PresetsDown` (`client-graphql-
          transport`), здесь — свой минимальный аналог отказов, не общий с пресетами тип ошибки
          (фидбэк не пресет, делить контракт ошибок незачем).

          `url` — параметр вызова, не константа пакета: этот адрес совпадает с адресом службы
          пресетов ТОЛЬКО потому, что сегодня это один и тот же процесс — пакет
          об этом ничего не знает и не должен, вызывающий сам решает, какой
          адрес передать.

          Типы (`FeedbackEntry`/`FeedbackInput` на TS-стороне) — рукописные, тем же приёмом, что
          `web-core/skin/client.ts`'s `WirePreset` (кодоген из `web-core/query/ROADMAP.yaml`'s
          `graphql-codegen-types` по-прежнему Backlog, откладывать этот подпуть до него не нужно).

          НЕ входит в объём: тулы `report_feedback`/`list_feedback`/`get_feedback`/
          `resolve_feedback` в самой зоне-потребителе — это вайринг конкретной
          зоны поверх этих трёх функций, отдельное ТЗ, не этот файл. Поле "какой продукт/сервер"
          в форме записи — открытый вопрос со стороны службы хранения, этот пакет зеркалит схему
          как она есть, не добавляет полей, которых там нет.

  - category: Поставка наружу
    items:
      - id: dist-imports-directories
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Пакет не импортируется из реестра: `dist` ссылается на ДИРЕКТОРИЮ, а ESM так не умеет"
        description: |
          Найдено архитектором продукта 2026-09-23 на приёмке выпуска `0.4.0`: пакет поставлен из реестра в
          чистый проект вне репозитория и импортирован голым Node. Отказ:

              Error [ERR_UNSUPPORTED_DIR_IMPORT]: Directory import
              '.../node_modules/@web-core/mcp/dist/register-tool' is not supported resolving ES
              modules

          Механизм, сверенный по файлам, а не по догадке: `src/index.ts` — барель
          (`export * from "./register-tool"`), сборка идёт `tsc -p tsconfig.build.json`, и `tsc`
          переносит спецификатор В ТОМ ЖЕ виде — `dist/index.js` содержит буквально
          `export * from "./register-tool";`. Для бандлера это разрешается (он сам найдёт
          `index.js` внутри папки), для голого `node` — нет.

          Кого это ломает: любого потребителя, который импортирует пакет НЕ через бандлер — а это
          ровно его аудитория, MCP-серверы запускаются `node`. Внутри репозитория дефект невидим:
          условие `exports` `development` уводит в `src`, а потребители собираются бандлером.

          Прецедент с готовым разбором рядом: `web-core/cli` (`FAQ.md`, «Почему сборка идёт через
          `defineLibraryConfig`, а не `tsc` в `dist`») уже ловил тот же отказ и решил его сборкой
          через `@web-core/build` — относительные импорты бандлятся внутрь входа, пакеты остаются
          внешними, рядом кладутся плоские `.d.ts`. Форму выбирает владелец: перейти на ту же
          фабрику либо заставить `tsc` писать полные спецификаторы — важно, что проверяется это
          не сборкой, а установкой пакета снаружи.

          Условие закрытия: `@web-core/mcp` из реестра импортируется голым `node` по всем шести
          подпутям. Инструмент под рукой — проба поставки (`@web-core/cli/probe`), ей же найдено.

          Починено 2026-09-23 той же формой, что у `web-core/cli`: сборка переехала с
          `tsc -p tsconfig.build.json` на `vite build` с `defineLibraryConfig` из `@web-core/build`
          (шесть входов — по одному на подпуть), `tsconfig.build.json` удалён за ненадобностью.
          Относительные импорты бандлятся внутрь входа, пакеты остаются внешними, `.d.ts` кладутся
          плоскими — выход стал `dist/transport.js`/`dist/peer.js`/…, и `exports`/`publishConfig`
          переехали на эти имена с `dist/<часть>/index.js`. Дублирования между входами нет:
          `dist/browser.js` импортирует `./peer.js` полным спецификатором.
          Проверено так, как требовало условие закрытия, — не сборкой: `pnpm pack` → проба поставки
          на тарбол, все шесть подпутей `ok` (import в чистом проекте вне репозитория, `tsc --noEmit`
          там же зелёный), `broken`/`limited` пусты. Плюс штатный прогон пакета: lint+typecheck
          зелёные, 42/42.


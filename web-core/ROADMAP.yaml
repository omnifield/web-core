# Дорожная карта каталога `web-core/` — работа УРОВНЯ ГРУППЫ: общая поставка, общий гейт, общие
# правила. Пункт про один пакет живёт в роадмапе этого пакета и сюда не дублируется.
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога. Формат тот же, что у сущностей:
# categories → items, log — журнал решений.

categories:
  - category: Поставка группы
    items:
      - id: fixed-group-one-version
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Все пакеты группы держатся на одной версии — `versioning.fixed`"
        description: |
          Решение принято при заведении механики выпуска (2026-09-22) и проверено первой реальной
          поставкой `0.3.0`: восемнадцать пакетов подняты одним номером, `pnpm version -r` собрал
          план из накопленных интентов и породил CHANGELOG каждому.

          Цена названа заранее: пакет без единой правки всё равно получает новый номер. Взамен
          пропадает вопрос совместимости между своими же пакетами — разойтись они не могут.

          Следствие для новой сущности: завёл пакет — вписал его в `versioning.fixed`
          (`pnpm-workspace.yaml`), иначе он молча выпадет из общей поставки.

      - id: registry-doc-vs-npmrc-drift
        type: bug
        status: Open
        priority: Medium
        milestone: null
        name: "Корневой README называет реестром GitHub Packages, а `.npmrc` указывает на свой Verdaccio"
        description: |
          Найдено architect'ом 2026-09-23 при заведении доки каталога. Корневой `README.md`
          (раздел «Инструменты», подраздел «Реестр пакетов») утверждает: «GitHub Packages
          (`npm.pkg.github.com`) — `publishConfig.registry` объявлен во всех пакетах фреймворка».
          Фактически корневой `.npmrc` объявляет `@web-core:registry=https://150.251.145.87:9873/`
          (свой Verdaccio), и `PUBLISHING.md` описывает выпуск именно туда.

          Что проверить и починить: какой адрес реально стоит в `publishConfig` каждого пакета
          (сверить грепом по `web-core/*/package.json`, не по памяти), и привести доку к факту.
          Если `publishConfig` где-то ещё указывает на GitHub Packages — это не только
          расхождение доки, но и риск опубликовать пакет не туда.

          Правка доки — корень (architect); правка `publishConfig` — владелец каждого пакета,
          если расхождение подтвердится.

      - id: group-is-a-repository-not-a-folder
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Группа едет самостоятельным репозиторием — ей нужен свой корень, а не только свои папки"
        description: |
          Решение user 2026-09-23: рабочий репозиторий — не склад, а полноценный репозиторий, в
          котором работают люди. Значит туда едет не набор папок, а рабочее дерево: клонировал,
          поставил зависимости, собрал.

          Сегодня отправляется только содержимое группы. Корневые файлы остаются здесь намеренно —
          они описывают наше рабочее дерево, где рядом лежат приложения и стенды, которых на той
          стороне нет. В итоге на приёмной стороне не оказывается ни воркспейса, ни графа задач,
          ни пина менеджера пакетов: `workspace:*` между своими же пакетами не свяжется, и
          сделать с деревом нельзя ничего.

          Отдельно про сценарий выпуска, который уже лежит внутри группы и едет вместе с ней: он
          требует корня воркспейса ДВАЖДЫ — фильтром по имени пакета (без воркспейса пакета просто
          нет) и поиском корня вверх по `pnpm-workspace.yaml`. Не найдя файла, поиск возвращает
          собственную папку — то есть скатывается ровно в тот режим тихого вранья, который уже
          стоил ответа «публиковать было нечего» при реальном выпуске, когда семнадцать пакетов
          уже уехали в реестр. То есть без корня туда едет не просто неудобство, а инструмент,
          который молча отвечает неправду.

          ИЗМЕРЕНО, а не предположено (2026-09-23, pnpm 11.17.0). Группе временно выдан
          собственный корень воркспейса, и она разрешилась как самостоятельное дерево: 19
          проектов, свой lockfile на 284 КБ, все связи между своими пакетами на месте. Верхнее
          рабочее дерево при этом не пострадало вовсе — из корня те же 26 проектов, установка
          отвечает «уже актуально», прогон зоны зелёный, граф задач отрабатывает штатно. Опыт
          откатан, дерево проверено чистым.

          Поведение, которое надо знать: менеджер пакетов выбирает БЛИЖАЙШИЙ корень вверх от
          текущей папки. Поэтому команда из корня видит всё дерево, а команда, запущенная внутри
          группы, — только группу. Записанное у нас раньше «вложенный корень молча перестаёт
          читаться» оказалось неточным: читается, но другой.

          СДЕЛАНО 2026-09-23. Корневые файлы (воркспейс, манифест со скриптами графа задач,
          конфиг графа) лежат прямо в группе, а не шаблоном рядом: в своём репозитории это корень,
          в рабочем дереве разработчика — вложенный корень, который верхний не ломает. Состав в
          них задан маской, а не перечислением: второй список разошёлся бы с первым молча. Адрес
          реестра не кладётся вовсе — он приходит переменной, как и в сценарии выпуска.

          Отправка научена снимать префикс: содержимое группы ложится в КОРЕНЬ цели, а не
          подпапкой, и чистка цели идёт по тому же снятому списку.

          ПРОВЕРЕНО РАЗВЁРТЫВАНИЕМ, а не рассуждением: отправка в пустой репозиторий, клон в
          чистую папку, установка, сборка. Приехало 1526 файлов — 17 пакетов, рабочая папка
          выпуска и тройка доков в корне; ни одного файла харнесса, ни одной чужой папки.
          Установка прошла, сборка — 17 проектов из 17.

          Проба тем же заходом вскрыла три дефекта, которых изнутри не видно вовсе (все
          починены, разбор в своих пунктах): первая отправка в ПУСТУЮ цель везла всё наше дерево;
          чистая установка падала на оснастке сборки, которой нужны типы движка трейсов;
          сборка падала на шаге генерации у кита, звавшем генератор путём через два уровня вверх.
          Ровно ради такого проба и ставилась: внутри рабочего дерева все три невидимы, потому
          что нужное уже лежит собранным.

          НЕ ИЗМЕРЕНО и названо честно: полная установка изнутри группы в РАБОЧЕМ дереве. Она
          создала бы там отдельное дерево зависимостей и переписала связи пакетов — дерево
          разъехалось бы до переустановки из корня. Это следствие из наблюдаемого, а не
          наблюдение.

      - id: folder-named-after-the-repository
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Папка группы зовётся своим именем — `web-core`, а не `packages`"
        description: |
          Решение user 2026-09-23, прямое следствие того, что группа едет самостоятельным
          репозиторием: `web-core` — это и есть она, а `packages` было описанием роли внутри
          монолита, которого больше нет.

          Сделано архитектором одним заходом: папка переименована, 1297 упоминаний в 181 файле
          переписаны. Замена шла ПОИМЁННО по зонам, а не слепо по слову: в дереве есть чужие
          пути с тем же словом (ссылки на сторонние библиотеки и Go-зависимости стороннего
          продукта) — их трогать нельзя, и слепая замена испортила бы 88 таких мест.

          Задето всё, что адресует группу путём: члены воркспейса, зоны владельцев, конфиг
          отправки, пути выпуска, ссылки в доке каждой зоны. После переименования потребовалась
          переустановка — связи в `node_modules` указывали на прежнее имя и оборвались.

          Проверено: воркспейс видит те же 26 проектов, связи приложений на базу остались
          локальными (96 из 96, ни одной из реестра), симлинки перестроены на новое имя,
          валидатор ролевой модели принимает все зоны. Полный прогон дал ровно те же три
          падения, что и до переименования, — ни одного нового.

          ХВОСТ, оставленный намеренно: в роадмапе зоны данных одна строка с перечислением
          образцов разорвана переносом, и замена её не поймала — текст читается, но несогласован.
          Правка содержательная, а не механическая, поэтому она за владельцем зоны.

      - id: release-scenario-of-this-group
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "У группы свой сценарий выпуска — скриптами в `.release/`, на движке `@web-core/cli`"
        description: |
          Решение user (2026-09-23). Движок командных инструментов (`@web-core/cli`) даёт, из чего
          писать тулзы, и про эту группу не знает ничего. СЦЕНАРИЙ выпуска именно этой группы —
          наш, и живёт он рабочей папкой `.release/` в корне репозитория. Штатные шаги выпуска
          (`pnpm version -r`, `pnpm publish -r`) сценарий зовёт напрямую — обёртка над ними
          ничего не добавила бы. Оговорка, стоившая разбора текста: машиночитаемо отдаётся только
          сводка публикации; план выпуска приходит человеческим текстом, `--json` у `pnpm version`
          на него не действует (проверено на pnpm 11.17.0, 2026-09-23).

          Что в сценарии: порядок шагов (план → версии → публикация → проба поставки), условия
          перехода между ними и знание, специфичное для группы — что пакеты держатся одной
          версией (`versioning.fixed`), что приложения и стенды в выпуске не участвуют
          (`versioning.ignore`).

          Ключевое требование, из-за которого сценарий и вынесен в файлы, а не в чью-то голову
          или в пайплайн одной команды: **скрипты одинаковы в любом репозитории**. Те же файлы
          уезжают синком в рабочий репозиторий и работают там же; различаются только переменные —
          адрес реестра, токен, целевая ветка. Девопс берёт из `.release/` готовый сценарий, а
          если ему нужно что-то сверх — строит это у себя из тех же механик, не правя наши
          скрипты.

          Границы: тегов, релизов и мержа сценарий не делает — они на стороне рабочего
          репозитория (решение user, см. `web-core/cli/ROADMAP.yaml`'s `scenario-lives-outside`).

          СДЕЛАНО architect'ом 2026-09-23 (корень — его зона). `.release/` заведён членом
          воркспейса (`pnpm-workspace.yaml`, `versioning.ignore` — в выпуске не участвует),
          четыре команды на движке `@web-core/cli`: `plan` · `version` · `publish` · `verify`.
          Знание о группе осталось здесь, механика — в пакете; адрес реестра приходит
          переменной (`NPM_CONFIG_REGISTRY`/`--registry`), в коде его нет.

          Проверено живьём, не только линтером: `plan` на чистом дереве отвечает `nothing`
          (код 0), на временном интенте — `done` с разобранным планом (19 пакетов, `0.3.0 →
          0.3.1`, интент удалён тут же); `verify --only @web-core/io` против живого реестра
          прошёл три шага (`install` 9 с · `import` · `typecheck`), ответ `done`. `publish`
          живьём НЕ прогонялся: это настоящая запись в реестр, её делает выпуск, а не проверка.

          `@web-core/cli` вписан в `versioning.fixed` — группа поставки теперь из 19 пакетов.

  - category: Граница поставки
    items:
      - id: outside-install-is-the-only-proof
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Поверхность поставки проверяется установкой ВНЕ репозитория, а не сборкой внутри"
        description: |
          Внутри монорепо пакеты соединены симлинками, поэтому `exports`, `files`, типы из `dist`
          и диапазоны зависимостей не проверяются вовсе. Два реальных отказа первой публикации
          (2026-09-22) — ручной диапазон `@web-core/style@^0.1.0` в `peerDependencies` скина и
          условие `exports` `development`, ведущее в `src`, — изнутри были невидимы полностью.

          Принято как правило группы: приёмка выпуска — установка опубликованного пакета в чистый
          проект вне репозитория плюс его сборка.

      - id: development-condition-breaks-node-consumers
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Условие `exports` `development` ведёт в `src` — node-потребитель компилирует исходники чужих пакетов"
        description: |
          Найдено architect'ом 2026-09-23 на ревью работы овнеров: `pnpm --filter
          @web-core/studio-mcp typecheck` даёт 479 ошибок вида `Cannot find name 'Element'`,
          `Cannot find name 'document'`, `--jsx is not set` — все на ФАЙЛАХ `web-core/ui/src/**`
          и `web-core/skin/src/**`, не на своём коде.

          Механизм: `exports` каждого пакета группы несёт `"development": "./src/index.ts"`
          (раскатано коммитом `70587494`, 2026-09-12). Потребитель с node-типизацией
          (`@web-core/build/tsconfig-node`, без `DOM`) по этому условию уходит в ИСХОДНИКИ, где
          есть и JSX, и браузерные глобалы, которых у него нет по построению.

          Проверено: поломка предсуществующая, к правкам зон `skin`/`query` от 2026-09-23
          отношения не имеет — ни одна ошибка не упоминает `presets`/`listHeaders`.

          Что решить (не рецепт, решение за владельцами): нужно ли условие `development` всем
          пакетам группы, или оно уместно только там, где потребитель — браузерное приложение с
          бандлером. Побочный эффект того же условия известен и с другой стороны: в поставку оно
          уезжало ведущим в `src`, которых в тарболе нет.

          Затрагивает всю группу разом, поэтому пункт стоит здесь, а не в одном пакете: править
          придётся согласованно, а не по одному манифесту.

  - category: Документация группы
    items:
      - id: docs-must-not-name-our-workspace
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Дока и комментарии пакетов ссылаются на приложения нашего воркспейса — в чужом репозитории этих путей нет"
        description: |
          Найдено architect'ом 2026-09-23 при подготовке синка в рабочий репозиторий платформы:
          туда уезжает `web-core/` целиком, и вместе с пакетами едет дока. Решение user по
          разбору: `CLAUDE.md` не отправляется вовсе (файл нашего харнесса), ОСТАЛЬНАЯ дока едет
          целиком — а ссылка на внутреннее приложение в README пакета это дефект зоны, а не
          повод фильтровать файлы при отправке.

          Что именно ломается у читателя: ссылки на приложения, продукты и фонды знаний
          поставщика ведут в никуда — этих папок в его репозитории нет и не будет. Часть ссылок
          протухла и у самого поставщика: одиннадцать мест в коде указывали на приложение,
          переименованное задолго до того.

          Сводка по зонам на день находки (файлов с упоминаниями; `CLAUDE.md` не считается —
          он не уезжает):

          | зона | всего | где |
          |---|---|---|
          | `ui` | 48 | ROADMAP 26 · EXAMPLES 10 · код 7 · FAQ 3 · README 2 |
          | `skin` | 47 | ROADMAP 33 · FAQ 8 · код 5 · README 1 |
          | `store` | 42 | ROADMAP 29 · FAQ 9 · EXAMPLES 2 · код 2 |
          | `mcp` | 41 | ROADMAP 25 · FAQ 11 · CHECKPOINT 4 · код 1 |
          | `assembly` | 35 | ROADMAP 24 · FAQ 5 · код 5 · README 1 |
          | `neurobox` | 24 | ROADMAP 21 · код 1 · FAQ 1 · README 1 |
          | `lint` | 22 | ROADMAP 22 |
          | `build` | 19 | ROADMAP 7 · FAQ 7 · README 4 · код 1 |
          | `query` | 18 | ROADMAP 12 · EXAMPLES 3 · FAQ 2 · README 1 |
          | `generators` | 16 | ROADMAP 10 · README 4 · FAQ 2 |
          | `router` | 12 | ROADMAP 7 · FAQ 5 |
          | `io` | 11 | ROADMAP 7 · FAQ 2 · README 1 · код 1 |
          | `form` | 7 | ROADMAP 6 · TEST_EXAMPLE 1 |
          | `trace` | 5 | ROADMAP 4 · README 1 |
          | `solid` | 3 | ROADMAP 3 |
          | `cli` | 2 | ROADMAP 2 |
          | `style` | 1 | ROADMAP 1 |

          Порядок, а не «вычистить всё разом»:

          1. **Код и дока для потребителя** (`README.md`, `FAQ.md`, `EXAMPLES.md`, комментарии в
             `src/`) — вперёд: их читают, чтобы понять пакет. «Проверено в приложении-гейте»
             вместо имени приложения; ссылка в комментарии — на суть, а не на путь, которого у
             читателя нет.
          2. **`ROADMAP.yaml`** — журнал зоны, историю переписывать не нужно: но запись должна
             читаться без доступа к репозиторию поставщика. «Найдено на витрине компонентов»
             вместо имени витрины; ссылка на чужой файл — только если она поясняет суть.

          Правило, по которому это чинится, записано в `README.md` этого каталога («Дока
          объясняет себя без нашего воркспейса») — оно же не даст дефекту вернуться.

          РАСШИРЕНО 2026-09-23, по находке владельца `mcp` на первом же заходе: мало убрать пути.
          Снаружи одинаково непонятны и голые имена наших сущностей (`skin-mcp`, `push-to-prod.mjs`,
          `kit.ts`) — их не ловит греп, — и ссылки на службы, тулзы и корневые файлы поставщика, и
          адреса наших служб. Сводка мест выше считалась по путям, то есть занижена: реальная
          работа в каждой зоне чуть больше.

          Доку каталога и рабочую папку выпуска architect вычистил тем же заходом: в
          `web-core/README.md`, `web-core/ROADMAP.yaml`, `.release/README.md` и `.release/FLOW.md`
          ссылок на наши приложения и на корневые файлы репозитория больше нет.

      - id: no-prose-in-source-files
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Обоснования живут абзацами в `.ts`/`.tsx` — в коде им не место, и наружу они уезжают вместе с пакетом"
        description: |
          Найдено user'ом 2026-09-23 на ревью первых заходов чистки: владельцы зон, встречая в
          исходнике простыню «почему сделано так», ПЕРЕПИСЫВАЛИ её — убирали из неё пути нашего
          воркспейса и оставляли на месте. Это лечит симптом: правило репозитория говорит, что
          такого абзаца в коде быть не должно вовсе, независимо от того, чьи имена он называет.

          Замер на день находки (блоки комментариев от пяти строк подряд, `src/` плюс `test/`,
          `dist` и `node_modules` не в счёт): **232 блока, ~2200 строк** — `src` 185 блоков /
          1731 строка, тесты 47 / 472.

          | зона | блоков | строк |
          |---|---|---|
          | `ui` | 83 | 904 |
          | `skin` | 41 | 323 |
          | `assembly` | 37 | 393 |
          | `lint` | 18 | 129 |
          | `neurobox` | 18 | 115 |
          | `store` | 8 | 86 |
          | `generators` | 7 | 116 |
          | `build` | 6 | 37 |
          | `mcp` | 4 | 25 |
          | `form` | 3 | 30 |
          | `io` | 2 | 15 |
          | `query` | 2 | 12 |
          | `router` · `solid` · `trace` | по 1 | 5–7 |

          Образец, по которому видно оба дефекта разом — `web-core/assembly`'s
          `src/render/content-of.tsx`: тридцать пять строк разбора двух версий фикса прямо над
          функцией, и внутри них номера заявок (`PWEB-215` и подобные), которых нет ни в одном
          доступном читателю трекере.

          Как чинится (не «удалить и забыть»): содержательное переезжает в `FAQ.md` пакета —
          разбор там и должен был быть, — на месте остаётся короткая пометка со ссылкой на
          разобранное место. Голый снос абзаца теряет знание, и это не то, чего просили.

          Порядок работы — решение user 2026-09-23: **делается ТЕМ ЖЕ заходом, что чистка от
          путей воркспейса** (`docs-must-not-name-our-workspace`), у зоны одна задача на оба
          правила. Следствие: шесть зон, прошедших чистку до находки (`mcp`, `store`, `skin`,
          `ui`, `build`, `neurobox`), открываются вторым кругом — прозу в них не снимал никто, а
          на `ui` и `skin` приходится 1227 строк из 2200.

          Правило, которое не даст дефекту вернуться, записано в `README.md` этого каталога
          («В коде — не проза»); в корневых правилах репозитория оно было и раньше, но доку
          группы, уезжающую наружу, не называло.

      - id: catalog-doc-triple
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "У каталога своя тройка, корень на неё только ссылается"
        description: |
          Решение user (2026-09-23): каталоги монорепо — самостоятельные единицы со своими
          правилами, и смешивать их описание в корне нельзя. Корень оставляет за собой описание
          самого монорепозитория, состав каждой группы переезжает в её каталог.

          Форма доки каталога отличается от доки сущности (нет `genus`, паспорта, анатомии, IO) —
          шаблон записан в корневом `README.md`, раздел «Каталог — не сущность, и шаблон у него
          свой»: Главное → Критерий включения → Состав ссылками → Общие правила → Как завести
          новую.

log:
  - id: catalog-docs-started-with-packages
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку первым из шести — как пилот формы, по решению user навести
      порядок в доке репозитория. Попутно, при сверке доки с фактом, найдены два расхождения,
      которые до этого никому не принадлежали: адрес реестра в корневом README против реального
      `.npmrc` и условие `exports` `development`, ломающее node-потребителя. Оба записаны
      пунктами здесь, а не починены на ходу: первое — правка доки корня, второе — согласованное
      решение владельцев всех пакетов группы.

# Дорожная карта репозитория web-core — работа УРОВНЯ ВСЕЙ БАЗЫ: общая поставка, общий гейт,
# общие правила. Пункт про один пакет живёт в роадмапе этого пакета и сюда не дублируется.
#
# Формат тот же, что у пакетов: categories → items.

categories:
  - category: Поставка
    items:
      - id: fixed-group-one-version
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Все пакеты держатся на одной версии"
        description: |
          Пакеты связаны друг с другом `workspace:*` и ставятся потребителю группой. Независимые
          номера означали бы совместимость, которую кто-то обязан держать в голове при каждой
          установке.

          Цена названа заранее и принята: пакет без единой правки всё равно получает новый номер.
          Взамен пропадает вопрос совместимости между своими же пакетами — разойтись они не могут.

          Состав группы задан маской в конфиге выпуска (`nx.json`, секция `release`:
          `@web-core/*`), а не перечислением — новый пакет попадает в поставку сам, вписывать его
          отдельно никуда не нужно.

      - id: vendor-versions-pinned-exactly
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Версии сторонних зависимостей зафиксированы точно, а не диапазоном"
        description: |
          Найдено развёртыванием в чистой папке: там встала другая минорная версия схемного
          движка, поведение разбора схем с ней изменилось, и пробы зоны данных легли — ровно тот
          случай, когда «у себя зелёное» не значит ничего.

          Причина шире одной библиотеки: диапазон означает «любая совместимая», и в двух клонах он
          честно разрешается в РАЗНОЕ.

          Сделано: 200 записей в `dependencies` и `devDependencies` переписаны на точные версии;
          сверка манифестов с деревом расхождений не даёт.

          `peerDependencies` НЕ тронуты сознательно (24 записи). Точная версия там означала бы
          «поставь ровно это»: потребитель со своим реактивным или схемным движком другой версии
          просто не смог бы установить пакет. Там диапазон — часть контракта поставки.

      - id: solid-resolved-through-one-package
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Реактивный движок импортировался напрямую из 202 файлов — точка резолва должна быть одна"
        description: |
          Правило было записано давно — точка резолва `solid-js` и `solid-js/web` одна,
          пакет-обёртка, — но по факту напрямую импортировали 202 файла в двенадцати зонах. Через
          обёртку шли единицы.

          Чем это опасно, увидели живьём: пока физическая копия одна, прямой импорт безвреден и
          правило выглядит формальностью. Как только копий стало две, рухнуло всё, что стоит на
          машине состояний — реактивный контекст одной копии невидим для другой, и пробы легли
          тринадцатью падениями. Одна точка резолва — не стиль, а защита от этого класса поломок.

          Переход сделан скриптом, разом: раздавать такую правку по владельцам значило бы получить
          дерево, где половина зон перешла, а половина нет. Механика замены одинакова везде,
          решения в ней нет.

          Что изменилось: 200 файлов переписаны на пакет-обёртку, зависимость на неё добавлена
          восьми пакетам. Дописывать реэкспорты не пришлось — обёртка отдаёт оба подпути сквозным
          `export *`.

          Не тронуто намеренно: сам пакет-обёртка (его пробы обязаны брать вендора напрямую, иначе
          проверяли бы себя собой) и две строки-фикстуры в пробе сортировки импортов — там
          `solid-js` это текст, а не импорт.

      - id: repository-bootstrap
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "Клон репозитория не поднимался: не было файла блокировки, `.gitignore` и пина менеджера"
        description: |
          Найдено прогоном выпуска из чистого клона. Три отдельных отказа, каждый молчаливый до
          того, как в него упрёшься:

          1. **Файла блокировки не было в репозитории.** Установка с `--frozen-lockfile`
             отказывает (`ERR_PNPM_NO_LOCKFILE`), а pnpm держит этот режим включённым в CI по
             умолчанию — то есть установка не проходила вовсе. Файл положен в репозиторий;
             пересчитывается он без разворачивания дерева: `pnpm install --lockfile-only`.
          2. **Корневого `.gitignore` не было.** После первой же установки `node_modules` и
             результаты сборки лежали неотслеженными и попадали в первый же коммит. Заведён; планы
             версий (`.nx/version-plans/`) из-под игнора выведены намеренно — из них собирается
             CHANGELOG выпуска.
          3. **Версия менеджера пакетов и Node не были закреплены нигде.** `corepack enable` брал
             свою версию, а файл блокировки у репозитория `lockfileVersion 9.0`. Объявлены
             `packageManager` и `engines` в корневом манифесте.

          Проверено прогоном целиком: установка с `--frozen-lockfile`, сборка 17 из 17, выпуск
          версий с тегом, публикация 17 пакетов, приёмка — «поставка принята».

      - id: release-on-task-graph
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Выпуск — штатными средствами графа задач; своим остался только шаг приёмки"
        description: |
          Версии, CHANGELOG, коммит, тег и публикацию делает граф задач (`nx.json`, секция
          `release`): фиксированная группа, источник версий — планы версий, объявляемые файлом в
          ветке рядом с кодом. Обёртка над штатными шагами ничего бы не добавила.

          Своим остался один шаг — приёмка (`.release/`): установка опубликованного в чистый
          проект вне репозитория. Его в графе нет и быть не может, это взгляд со стороны
          потребителя, а не операция над репозиторием.

          Знание, специфичное для этой базы, живёт в `.release/`; сама механика пробы — в
          `@web-core/cli` (подпуть `/probe`). Адрес реестра приходит переменной, в коде его нет.

          Порядок шагов и что нужно подготовить — `.release/FLOW.md`.

      - id: pipeline-never-run-on-live-ci
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "`.gitlab-ci.yml` ни разу не прогонялся на живом сервере"
        description: |
          Пайплайн написан по докам и по фактически проверенным командам, но целиком на GitLab не
          запускался ни разу. Отдельно не проверена цепочка «тег ставит шаг выпуска → по тегу
          запускается отдельный прогон публикации»: сами команды прогнаны, связка тег-триггера —
          нет.

          Что проверить первым прогоном: что клон приходит с полной историей (иначе «затронутое»
          считать не из чего), что токен реестра виден шагу публикации, что тег, отправленный
          шагом выпуска, действительно запускает прогон публикации.

  - category: Граница поставки
    items:
      - id: outside-install-is-the-only-proof
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Поверхность поставки проверяется установкой ВНЕ репозитория, а не сборкой внутри"
        description: |
          Внутри репозитория пакеты соединены симлинками, поэтому `exports`, `files`, типы из
          `dist` и диапазоны зависимостей не проверяются вовсе. Два реальных отказа первой
          публикации — ручной диапазон на свой же пакет в `peerDependencies` и условие `exports`
          `development`, ведущее в `src`, — изнутри были невидимы полностью.

          Принято как правило: приёмка выпуска — установка опубликованного пакета в чистый проект
          вне репозитория плюс его сборка.

      - id: vendors-do-not-cross-delivery-border
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сторонний пакет не выходит за границу поставки — в манифесте приложения только `@web-core/*`"
        description: |
          Решение user'а 2026-09-24. Приложение на этой базе объявляет у себя ТОЛЬКО пакеты
          `@web-core/*`. Любая сторонняя вещь, которая ему нужна, приезжает через базу — своим
          подпутём, своим бинарником, своими типами. Ни `solid-js`, ни `vite`, ни `vitest` в его
          манифесте быть не должно.

          Почему это перестало быть вкусовщиной: пакет-фасад обещает «единственная точка резолва
          вместо вендора», а peer-запись означает ровно обратное — «вендор ТВОЙ, я только
          вклиниваюсь в твою копию». Потребитель вынужден объявлять у себя пакет, который нигде
          не импортирует, и узнаёт об этом отказом сборки, а не докой. Поймано установкой из
          реестра вне рабочего дерева (0.4.0, 2026-09-24): не поднялись ни сборка, ни типы, ни
          пробы.

          Замер, с которого начинали: 20 peer-записей в 12 пакетах. Наружу торчит не только
          реактивный движок — там же бандлер, тест-раннер, DOM-эмулятор, компонентные библиотеки
          кита, роутер, схемный движок запросов, машина состояний, постпроцессор CSS, оба
          линтера.

          ГЛАВНОЕ ОГРАНИЧЕНИЕ, из-за которого это нельзя делать поштучно: если каждый пакет
          объявит `solid-js` своей обычной зависимостью, копий станет столько же, сколько
          пакетов, — ровно та поломка реактивности, ради которой peer там и стоял. Совместить
          можно единственным раскладом: обычная зависимость на вендора есть у ОДНОГО пакета —
          того, который им владеет (`solid-js` — у фасада `@web-core/solid`), а остальные зоны
          берут его через фасад и вендора не называют вовсе. Поэтому переезд кита на фасад
          перестаёт быть постепенным «по мере повода» и становится условием работы.

          Порядок обязателен, зоны идут не параллельно:

          1. `solid` — вендор переезжает в его зависимости, появляются подпути `./jsx-runtime`
             и `./jsx-dev-runtime`. До этого шага остальные бессмысленны.
          2. `build` — бандлер, раннер и DOM-эмулятор уходят внутрь зоны и отдаются бинарниками;
             tsconfig перестаёт называть вендора и в `types`, и в `jsxImportSource`; JSX-трансформ
             уводится на фасад. Без этого шага вендор всплывает даже у зоны, которая на фасад
             уже переехала: трансформ вписывает его в файлы потребителя сам.
          3. Остальные зоны — прямые импорты вендора на фасад, свои peer-записи внутрь. Поимённо,
             чтобы «остальные» не означало «кто вспомнится»: `assembly`, `form`, `neurobox`,
             `query`, `router`, `store`, `style`, `trace`, `lint` — и `skin`, но туда идёт заявка
             его архитектору, а не задача. Задачи в эти зоны заводятся, когда шаги 1–2 закрыты:
             раньше их нельзя ни начать, ни даже верно сформулировать — состав правки зависит от
             того, что именно отдаст наружу зона оснастки.

          Рычаги сверены по первоисточникам 2026-09-24, из головы здесь ничего нет: опция
          `moduleName` у JSX-трансформа (дефолт — вендорский подпуть) объявлена в типах самого
          плагина; вендор отдаёт `./jsx-runtime` и `./jsx-dev-runtime` своими подпутями, значит
          фасаду есть что реэкспортировать; `types` принимает подпуть пакета — это видно по
          нынешней записи профиля. Дока Solid к версии 2.0 прямо требует, чтобы свой рендерер
          отдавал собственные JSX-подпути, — то есть расклад идёт по шерсти вендора, а не против.

          Цена названа заранее: база берёт на себя версии вендоров целиком. Раньше приложение
          могло разойтись с нами по минорной версии и жить; теперь такой возможности нет вовсе,
          и подъём версии вендора — выпуск базы. Это и есть предмет решения.

          Что теряет силу после переезда (правится ПО ФАКТУ кода, не вперёд него): ответ
          `FAQ.md` «Почему `solid-js` — peer-зависимость» в зоне фасада, оговорка про
          `peerDependencies` в `vendor-versions-pinned-exactly` этого файла и ответ
          «Почему версии сторонних зависимостей записаны точно» в `FAQ.md` рядом — в части, где
          peer назван осознанным исключением.

          Чего решение НЕ покрывает: линтер, граф задач и компилятор типов в манифесте
          приложения (`eslint`, `nx`, `typescript`) — тем же приёмом закрываются через
          `lint`/`build`, но это отдельный разговор, он не начат.

          СДЕЛАНО 2026-09-24, одним заходом по всей базе. Порядок из трёх шагов выше исполнен
          целиком, кроме названного абзацем выше:

          - шаг 1 — вендор переехал в зависимости фасада, у него появились подпути
            `./jsx-runtime` и `./jsx-dev-runtime`;
          - шаг 2 — бандлер, тест-раннер и DOM-эмулятор ушли внутрь зоны оснастки и отдаются
            бинарниками (`web-core-vite`, `web-core-vitest`); профиль типов перестал называть
            вендора и в `types` (свой подпуть `/client`), и в `jsxImportSource` (фасад);
            JSX-трансформ уведён на фасад во всех трёх местах, где зона его зовёт — конфиг
            приложения, конфиг библиотеки, пресет проб;
          - шаг 3 — peer-записи девяти зон ушли внутрь пакетов. Замер по дороге поправил посылку
            решения: прямых импортов вендора в коде базы НЕ осталось нигде, кроме самого фасада
            (переезд, числившийся открытым, по факту был уже сделан) — так что менять пришлось
            манифесты, а не код.

          Чем подтверждено, не «зелёное у себя»:

          - в дереве ровно ОДНА физическая копия реактивного движка — главный риск всего
            решения снят не рассуждением, а проверкой;
          - `pnpm peers check` не показывает ни одной незакрытой записи про вендоров решения;
            остались две давние, обе про линтер и компилятор типов, к этой работе не относятся;
          - сборка 20 из 20 пакетов и пробы 17 из 17 зелёные; красными остались ровно те цели,
            что уже числятся красными в `group-checks-red-blocks-release`;
          - главное: в трансформированных модулях реального приложения-потребителя не осталось
            НИ ОДНОГО прямого импорта вендора — только фасад, и приложение поднимается.

          Открыто отдельными пунктами в своих зонах: приложение-гейт зовёт из кита два имени,
          которых кит не экспортирует вовсе (`Label`, `SelectIcon`) — его сборка красная, и это
          не следствие этой работы; демка-потребитель держит свой корень менеджера пакетов и
          из-за этого берёт базу из реестра, а не живыми папками рядом.

      - id: development-condition-breaks-node-consumers
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Условие `exports` `development` ведёт в `src` — потребитель без DOM компилирует чужие исходники"
        description: |
          Найдено на потребителе с node-типизацией: проверка типов даёт сотни ошибок вида
          `Cannot find name 'Element'`, `Cannot find name 'document'`, `--jsx is not set` — все на
          ФАЙЛАХ `src/**` чужих пакетов, не на своём коде.

          Механизм: `exports` каждого пакета несёт `"development": "./src/index.ts"`. Потребитель
          с node-профилем типов (без `DOM`) по этому условию уходит в ИСХОДНИКИ, где есть и JSX, и
          браузерные глобалы, которых у него нет по построению.

          Побочный эффект того же условия известен и с другой стороны: в поставку оно уезжало
          ведущим в `src`, которых в тарболе нет.

          Что решить (не рецепт, решение за владельцами): нужно ли условие `development` всем
          пакетам, или оно уместно только там, где потребитель — браузерное приложение с
          бандлером. Затрагивает все пакеты разом, поэтому пункт стоит здесь, а не в одном из них:
          править придётся согласованно, а не по одному манифесту.

  - category: Проверки
    items:
      - id: group-checks-red-blocks-release
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Четыре цели красные, и они держат выпуск всей базы"
        description: |
          Проверка гоняется одной командой по всем пакетам сразу и стоит первым шагом выпуска.
          Пока красное хотя бы одно, выпустить нельзя ничего.

          Что красное на сегодня и где заведена работа:

          | цель | почему | где пункт |
          |---|---|---|
          | `trace:test` | проб у пакета нет вовсе, раннер выходит с ненулевым кодом | `trace/ROADMAP.yaml`, `write-test-suite` |
          | `build:test` | то же самое | `build/ROADMAP.yaml`, `rebuild-test-suite` |
          | `assembly:lint` | четыре `solid/reactivity` в пробах, оставленных расследованием | `assembly/ROADMAP.yaml`, `lint-red-on-recur-context-probes` |
          | `skin:lint` | правило не узнаёт примитивы, пришедшие через пакет-обёртку | `lint/ROADMAP.yaml`, `primitives-unseen-through-solid-wrapper` |

          Соблазн, от которого стоит удержаться: разрешить цели проб проходить при нулевом числе
          файлов. Это снимет отказ и у всех пакетов, где пробы есть, и первая же потерянная папка
          с пробами пройдёт молча.

  - category: Документация
    items:
      - id: docs-must-explain-themselves
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Дока и комментарии пакетов ссылаются на то, чего в этом репозитории нет"
        description: |
          Правило записано в `README.md` («Дока объясняет себя сама»), но по факту нарушается во
          многих пакетах: ссылки на приложения и справочники, которых здесь нет, голые имена
          сущностей, адреса служб, номера заявок во внешнем трекере. Читателю всё это не говорит
          ничего, а грепом имена не ловятся.

          Порядок, а не «вычистить всё разом»:

          1. **Код и дока для потребителя** (`README.md`, `FAQ.md`, `EXAMPLES.md`, комментарии в
             `src/`) — вперёд: их читают, чтобы понять пакет. Вместо имени приложения — суть:
             «проверено в приложении-гейте»; ссылка в комментарии — на предмет, а не на путь,
             которого у читателя нет.
          2. **`ROADMAP.yaml`** — журнал пакета, историю переписывать не нужно, но запись должна
             читаться без доступа к чему-либо снаружи.

          Замер по номерам заявок: 111 вхождений в 62 файлах, из них 57 файлов приходится на кит.

      - id: no-prose-in-source-files
        type: bug
        status: Open
        priority: High
        milestone: null
        name: "Обоснования живут абзацами в `.ts`/`.tsx` — в коде им не место"
        description: |
          Правило репозитория говорит, что абзаца «почему сделано так» в коде быть не должно
          вовсе. Встречая такой блок, его чинили неверно — переписывали на месте вместо того,
          чтобы вынести.

          Замер (подряд идущие строки комментария, блоками от пяти, только `.ts`/`.tsx` под
          `src/` и `test/`): **135 блоков, 1336 строк** — `src` 124 блока / 1180 строк, пробы
          11 / 156. Больше половины приходится на кит: 74 блока, 835 строк.

          Как чинится — не «удалить и забыть»: содержательное переезжает в `FAQ.md` пакета,
          разбор там и должен был быть; на месте остаётся короткая пометка со ссылкой. Голый снос
          абзаца теряет знание.

          Делается ТЕМ ЖЕ заходом, что чистка по `docs-must-explain-themselves`: у пакета одна
          задача на оба правила.

      - id: checkpoint-files-are-not-documentation
        type: bug
        status: Open
        priority: Medium
        milestone: null
        name: "В двух пакетах лежат файлы передачи между сессиями — это не дока пакета"
        description: |
          `ui/CHECKPOINT.md` и `mcp/CHECKPOINT.md` — записки о состоянии незавершённой работы:
          что не доделано, что лежит незакоммиченным, с чего продолжать. Тройка доков такого
          файла не предусматривает, и читателю пакета он не говорит ничего.

          Что с ними делать: содержательное (открытые вопросы, незакрытая работа) переносится
          пунктами в `ROADMAP.yaml` своего пакета, файл удаляется. Состояние прогона живёт не в
          репозитории.

      - id: non-canonical-docs-in-packages
        type: bug
        status: Open
        priority: Low
        milestone: null
        name: "Отдельные пакеты держат доки вне тройки — непонятно, что это и кто их ведёт"
        description: |
          `form/TEST_EXAMPLE.md` и `solid/PRIMITIVES/BACKLOG.md` не входят ни в один из трёх
          обязательных документов и не объявлены нигде. Читатель не знает, актуальны ли они,
          кем ведутся и обязательны ли к прочтению.

          Решение за владельцами пакетов: либо содержимое переезжает в свою часть тройки
          (пример — в `EXAMPLES.md`, открытая работа — в `ROADMAP.yaml`), либо файл получает
          объявленное место и назначение.

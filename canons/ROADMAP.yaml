# Дорожная карта каталога `canons/` — работа УРОВНЯ ГРУППЫ: границы фонда, общая форма выписки,
# состав. Сбор по конкретной теме живёт внутри своего канона (`INDEX.md`, `orders/`, `gaps/`).
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога.

categories:
  - category: Границы фонда
    items:
      - id: canon-holds-only-foreign-decisions
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Здесь только чужие решения — наш вывод живёт в `FAQ.md` своей зоны"
        description: |
          Выписка отвечает на один вопрос: что решил рынок. Наш вывод меняется с каждой новой
          задачей и замером, и вплетённый в цитату он делает невозможным пересмотр обоих.

          Правило держит гейт канона (`tools/lint.mjs`), а не обещание: выписка с нашим выводом
          или ссылкой на наш узел режется. История, из-за которой гейт появился: прошлый заход
          нарушил правило 67 раз, чинить пришлось второй копией всей папки, и копия разошлась с
          оригиналом за сутки.

      - id: knowledge-outlives-code
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Фонд стоит отдельным каталогом, потому что знание переживает код"
        description: |
          Спецификация или устоявшийся паттерн остаются правдой независимо от того, написан ли наш
          модуль, переписан ли он и уехал ли продукт своим репозиторием. Знание внутри папки
          продукта потерялось бы при первом же переезде — а собрать его заново дороже всего, что
          здесь лежит.

          Отсюда и законное состояние «зона с каноном, но без кода» (`tables`, `map`): знание
          собрано раньше реализации, и это не пробел.

  - category: Форма выписки
    items:
      - id: every-entry-carries-a-date
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "У каждой выписки адрес и ДАТА сверки"
        description: |
          Ссылка продолжает открываться, когда её содержимое уже изменилось: черновик становится
          рекомендацией, вендор переименовывает API, практика устаревает. Дата отвечает на вопрос
          «когда это было правдой» и показывает, что пора сверять заново.

          То же правило действует и вне каталога — любая сверка с рынком в репозитории обязана
          нести след «что смотрел · что нашёл · почему берём · дата».

      - id: gaps-are-results-too
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "`gaps/` — «рынок этого не нормировал» записывается так же, как найденный стандарт"
        description: |
          Без явной записи следующий заход либо ищет то же самое заново, либо принимает чей-то
          блог за стандарт. Названная дырка честно передаёт решение нам — и требует обосновывать
          его своими доводами, а не ссылкой на несуществующий канон.

  - category: Состав
    items:
      - id: canon-index-vs-zones
        type: feature
        status: Open
        priority: Low
        milestone: null
        name: "Сверить, какому владельцу принадлежит каждый канон"
        description: |
          В каталоге девять канонов (`ui-skin`, `solidJS`, `solid-plugins`, `solid-map`,
          `plugins`, `filter-tables-graphs`, `map`, `chat`, `studio`), а в
          `../.claude/harness.yaml` владельцы названы не у всех: часть привязана к зонам
          (`canons/ui-skin` — зона `skin`, `canons/map` и `canons/solid-map` — зона `map`),
          остальные в зонах не упомянуты вовсе.

          Что нужно: пройти список и назвать владельца каждому — либо зону, которая им
          пользуется, либо architect'а, если канон общий. Канон без владельца устаревает молча:
          сверять его заново некому, а дата в выписке говорит только о том, что она уже старая.

log:
  - id: canons-catalog-doc
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку по решению user навести порядок в доке. Правила, которые
      раньше жили только внутри `ui-skin` (переносимая часть, «здесь только чужое», дата сверки,
      явные дырки), подняты на уровень группы — они общие для всех канонов, а не частность
      первого. При сверке состава с `harness.yaml` видно, что владелец назван не у каждого
      канона; записано открытым пунктом.

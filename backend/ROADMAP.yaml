# Дорожная карта каталога `backend/` — работа УРОВНЯ ГРУППЫ: границы каталога, общие правила
# служб. Работа конкретной службы живёт в её роадмапе и сюда не дублируется.
#
# Заведён architect'ом 2026-09-23 вместе с докой каталога.

categories:
  - category: Границы каталога
    items:
      - id: service-surface-is-the-network
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Сущность попадает сюда, если её поверхность — сеть, а не импорт"
        description: |
          Свой процесс, свой порт, свой сетевой контракт, своё хранилище. Потребитель не собирает
          из службы механизм внутри себя (как с движком), а ходит к уже поднятой.

          Прямое следствие, записанное явно: рантайм службы не обязан совпадать с фронтом. Go с
          bbolt в `presets` — не исключение из правил монорепо, а то, что этими правилами
          разрешено: через провод не видно, на чём написана другая сторона.

      - id: mcp-servers-live-next-to-their-zone
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "MCP-серверы зон сюда не переезжают — живут рядом со своим доменом"
        description: |
          У MCP-сервера зоны (`apps/studio/.mcp`) тоже свой процесс и свой порт, но предмет у него
          — домен конкретной зоны, и ручки меняются вместе с её кодом. Переезд в общий каталог
          служб оторвал бы его от того, что он обслуживает.

          Общий тулинг MCP (транспорт, сессии, конверт ответа, пагинация) при этом живёт пакетом
          `@web-core/mcp` — механика общая, домен частный.

  - category: Правила группы
    items:
      - id: storage-stays-opaque
        type: decision
        status: Done
        priority: High
        milestone: null
        name: "Хранилище не толкует содержимое — типизация стоит снаружи, на границе API"
        description: |
          `internal/store` как принимал байты, так и принимает: смысл поля внутри знает владелец
          вида, а не служба. Проверено делом — второй владелец (движок кормления) завёл три своих
          вида тремя файлами, без правки существующих видов и резолверов.

          Правило группы, а не частность `presets`: как только служба начинает понимать чужое
          содержимое, каждый новый вид данных становится её правкой, и владелец вида перестаёт
          быть владельцем.

      - id: proof-on-real-layer
        type: decision
        status: Done
        priority: Medium
        milestone: null
        name: "Служба доказывается реальным транспортом и реальным хранилищем, не моками"
        description: |
          Пробы идут через настоящий сетевой стек и настоящую базу, включая гонки под `-race`, а
          батчинг измеряется счётчиком вызовов хранилища, а не выводится чтением кода. Для группы
          это обязательное правило: у службы нет компилятора, который поймает разъехавшийся
          контракт за неё.

log:
  - id: backend-catalog-doc
    type: plan
    date: 2026-09-23
    summary: >
      Каталог получил свою тройку по решению user: корень описывает монорепо, состав и правила
      группы живут в самой группе. Записан критерий включения (свой процесс, сетевая поверхность,
      своё хранилище) и явно названо то, что раньше нигде не было записано: MCP-серверы зон сюда
      не переезжают, а рантайм службы не обязан совпадать с фронтом.

# Дорожная карта службы пресетов. Формат тот же, что у apps/skin и компонентов кита: категории →
# пункты, статус проставляется рядом с работой в момент, когда она сделана.
#
# 2026-09-09: пункты категорий "Переход на GraphQL" и "Механизм типизации" — Done, вместе с
# профилями потребителей mcp-surgical-reads/showcase-page-batch (схема их удовлетворяет, см.
# README.md/FAQ.md и `log` ниже). `runtime-wear-once` и категория "Дальше по цепи" — по-прежнему
# Backlog: не эта зона, следующие заходы после переезда backend/presets на GraphQL.
#
# Откуда взялась заявка: /workspaces/web-core/ROADMAP.yaml (измерения задержки службы, категория
# "Замеры"/"Выводы по коду") зафиксировал СИМПТОМ — смена компонента в витрине стоит 47 запросов и
# ~2.2 сек, потому что индекс `?kind=` не отдаёт `state` (N+1 на каждую запись). Дальнейший разговор
# с user поменял диагноз: дело не в конкретном N+1, а в том, что у службы вообще нет языка запроса —
# только «список id» и «одна запись по id». Этот файл — про лечение причины, не про патч симптома.

categories:
  - category: Переход на GraphQL
    items:
      - id: graphql-endpoint
        type: feature
        status: Done
        priority: High
        milestone: null
        name: REST-ручки службы заменяются одним GraphQL-эндпоинтом (Go, gqlgen)
        description: |
          Решение user дословно: "любой нормальный базовый сервис умеет работать с параметрами и
          умеет строить ответы" — сегодняшняя служба этого не умеет, есть только `?kind=` (индекс
          без `state`) и `GET /:id` (одна запись). Каждый потребитель городит свой обход поверх
          этой примитивной пары вместо того, чтобы служба сама отвечала по форме запроса.

          Почему не «нормальный REST» с параметрами фильтрации/`?include=`, а сразу GraphQL: у
          компонента УЖЕ сегодня много связей (варианты, сборки, дока, примеры, моки данных, автор,
          внутренняя инфа), и user прямо называет, что список растёт — "завтра появятся пресеты для
          фильтров, у них тоже будут связи с автором, варианты"; "послезавтра появятся сборки
          композиции компонентов... они будут отсылаться на сами компоненты, из которых построены, у
          них будет своя дока". Каждая новая связь в REST — новый `?include=`-флаг или новая ручка;
          в GraphQL — просто новое поле схемы, клиент сам решает, что взять.

          Библиотека — gqlgen (schema-first, кодоген): по оценке user поднимается и настраивается
          "с либами за пару часов". Согласовано здесь: часы уходят на поднятие библиотеки, НЕ на
          продумывание схемы — схема моделируется по `component-graph-scope` ниже.

      - id: no-server-side-n-plus-one
        type: bug
        status: Done
        priority: High
        milestone: null
        name: Переезд на GraphQL сам по себе N+1 не лечит — резолверам нужен батчинг
        description: |
          Ловушка, которую нельзя пропустить: если резолвер, скажем, "варианты компонента" внутри
          дёргает чтение по id в цикле — это ТА ЖЕ болезнь, что и сегодня в
          `packages/skin/src/presets/client.ts` (см. `finding-n-plus-one` в корневом
          ROADMAP.yaml), просто спрятанная за схемой и переехавшая с клиента на сервер.

          Нужен dataloader/батч на уровне резолвера (для Go — например `vikstrous/dataloadgen` или
          `graph-gophers/dataloader`) — это отдельная, реальная инженерная работа, НЕ входит в
          «пару часов» настройки библиотеки, и нужна независимо от того, REST это или GraphQL.

      - id: component-graph-scope
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Схема — по сегодняшним видам записей, не по тому, чего ещё нет в коде
        description: |
          Схема GraphQL аддитивна: расширяется полями/типами позже без поломки существующих
          клиентов. Значит НЕ нужно ждать и заранее гадать форму сборок-композиций или
          пресетов-фильтров — их ещё нет как кода, только как направление ("завтра"/"послезавтра" в
          словах user). Первая версия схемы покрывает только то, что есть сегодня: пять видов
          записей (outfit, palette, form, content, tag) и их реальные поля/связи.

          Когда появятся фильтр-пресеты и сборки-композиции — новые типы/поля добавляются в схему
          отдельным заходом, без переписывания уже работающих резолверов. Механизм расширения —
          `kinds-registry`: новый файл в `internal/kinds/`, без правки остального.

      - id: gqlgen-schema-preset-interface
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "SDL: общий интерфейс Preset + шесть конкретных типов, резолверы поверх store"
        description: |
          Решено (2026-09-09, конкретизация `graphql-endpoint`): gqlgen поверх схемы вида —
          интерфейс `Preset` (общие поля: `id`/`label`/`name`/`description`/`kind`/`savedAt`) и
          шесть конкретных типов — по одному на каждую запись `kinds-registry` (outfit, palette,
          form, content, tag, assembly — см. `canon-drift-author-tags-assembly` про шестой вид),
          каждый со своими типизированными полями `state` вместо общего blob.

          Резолверы читают через существующий store (bbolt, см. `bbolt-byte-invariant`), не мимо
          него. Связи между типами резолвятся через dataloader — см. `no-server-side-n-plus-one`,
          этот пункт его не заменяет, а уточняет ГДЕ именно нужен батчинг: на резолверах полей-связей
          внутри пяти конкретных типов.

      - id: recipe-assembly-json-scalar-boundary
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Form.recipe / Form.keyframes / ComponentAssembly.assembly — JSON-скаляр, не декомпозиция до листьев"
        description: |
          Решено (2026-09-09): границу схемы проводим по связям, не по глубине вложенности. В
          типизированные поля идёт то, что либо ссылается на ДРУГУЮ запись (`outfit.palette` →
          `Palette` через dataloader, `outfit.forms` → список `Form`, tag-ссылки), либо плоский
          скаляр верхнего уровня (`name`/`author`/`description`/`overrides`,
          `variables.light/dark/scales/dimensions` как map строк). `Form.recipe`
          (`SlotRecipe<Part>`), `Form.keyframes`, `ComponentAssembly.assembly`
          (`PassportAssembly`) — именованное JSON-поле (gqlgen это умеет) без раскладки глубже.

          Почему: `SlotRecipe`/`PartStyles<Part>` — рекурсивная открытая структура (проверено
          чтением `packages/skin/src/engine/recipe/slot.ts` — `variants`/`settings` это вложенные
          `Record<string, PartStyles<Part>>`, сам `PartStyles` — произвольный CSS-in-JS по имени
          партии). Даже ПОЛНАЯ декомпозиция упёрлась бы в JSON-скаляр на самом нижнем уровне (CSS-
          декларации сами по себе открытый объект свойств) — типизированные листья получили бы
          только контейнеры, не реальную типизацию содержимого. `PassportAssembly` той же природы
          (`packages/skin/src/engine/passport/assembly/nodes.ts`, 91 строка под граф сборки).

          Три довода, почему не разбирать:
          1. Ни одному из профилей потребления (`mcp-surgical-reads`/`showcase-page-batch`/
             `runtime-wear-once`) это не нужно — все потребляют `recipe`/`assembly` целиком, отдают
             движку `packages/skin` (`generateSkinCss`/`assemble`), не выбирают поле внутри.
          2. Декомпозиция завела бы ТРЕТИЙ канон формы (TS в packages/skin + Go-структуры + GraphQL
             SDL) — тот же класс риска, что уже поймали на `canon-drift-author-tags-assembly`, но
             для целой рекурсивной модели вместо пары скалярных полей.
          3. N+1 не касается: у `recipe`/`assembly` нет ссылок на ДРУГИЕ записи (не связь, а
             внутреннее устройство одной записи) — согласуется с `bbolt-byte-invariant`: бэк
             типизирует границу API и связи, не переизобретает домен-внутреннее устройство записи,
             которое уже имеет единственный источник правды в `packages/skin`.

  - category: Механизм типизации (internal/kinds)
    items:
      - id: kinds-registry
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "internal/kinds/ — реестр видов, по файлу на вид, с первого дня рассчитан на нескольких владельцев"
        description: |
          Решено (2026-09-09): типизация — общий механизм, не разовая правка под пять видов skin.
          `kind` регистрирует свою JSON Schema/Go-структуру при сборке службы — по файлу на вид
          (`internal/kinds/outfit.go`, `palette.go`, `form.go`, `content.go`, `tag.go`,
          `assembly.go`), каждый файл — Go-структура своего `state` + запись в карте `kind → тип`.

          Видов ШЕСТЬ, не пять — см. `canon-drift-author-tags-assembly`: `assembly`
          (`ComponentAssembly`, сборка ОДНОГО компонента, `{component, assembly}`) уже написан и
          пишется в проде (`apps/skin/.mcp/src/tools/presets.ts`,
          `packages/skin/src/engine/look/types.ts`), просто на проде сегодня 0 записей этого вида,
          поэтому его не видно в замерах корневого ROADMAP. Это НЕ то же самое, что будущие
          "сборки-композиции" (композиция НЕСКОЛЬКИХ компонентов, ссылающаяся на сами компоненты,
          из которых собрана) — та вещь ещё не существует как код, `assembly` в этом реестре про
          неё не говорит ничего.

          Когда у tables появится `filter` — это НОВЫЙ файл в том же `internal/kinds/`, тем же
          способом, без правки остального реестра или резолверов других видов. Механизм с первого
          дня не привязан к одному владельцу видов (skin) — он общий для любого продукта, который
          заведёт свой вид пресетов.

      - id: canon-drift-author-tags-assembly
        type: bug
        status: Done
        priority: High
        milestone: null
        name: "ТС-канон разошёлся с тем, что реально пишет MCP — чинить канон, потом Go-структуры, не наоборот"
        description: |
          Найдено овнером ПЕРЕД тем, как писать Go-структуры (сверка плана с кодом/продом —
          повторно ловит тот же класс ошибки, что и раньше на пресетах, см.
          `skin-presets-canon-vs-code-gaps` в памяти): если сейчас завести строгие Go-структуры
          один-в-один по объявленным TS-интерфейсам, typed-валидация на запись начнёт
          отклонять/бить существующие живые записи — потому что интерфейсы уже не описывают то,
          что реально лежит в проде.

          Три расхождения:
          1. `assembly` как вид — см. `kinds-registry` выше.
          2. `author` — сквозной атрибут владения (см. `authorGuard`,
             `apps/skin/.mcp/src/tools/shared.ts`), MCP подмешивает его в `state` ЛЮБОГО вида при
             сохранении, но объявлен явно только в `ContentState` — `Palette`/`Outfit`/
             `ComponentAssembly`/`Form` в `packages/skin/src/engine/look/types.ts` о нём молчат,
             хотя реальные записи (проверено живьём: `tag/status`) несут `{name, label, author}`.
          3. `Outfit.tags` — MCP подмешивает `tags: string[]` в state наряда при сохранении
             (`resolveTags`, `shared.ts`), а интерфейс `Outfit` этого поля не объявляет вовсе.

          Решение user дословно: "давай ничего не обходить! все делаем нормально!" — значит НЕ
          заводим Go-структуры без этих полей (иначе валидация ломает прод) и НЕ обходим их
          отдельным нетипизированным путём. Порядок: СНАЧАЛА чинится ТС-канон
          (`packages/skin/src/engine/look/types.ts` — `author` явным полем у всех пяти
          объявленных интерфейсов, `tags` явным полем у `Outfit`), и только ПОСЛЕ этого
          Go-структуры `kinds-registry` пишутся зеркально к исправленному канону — не к
          сегодняшнему, который уже неверен.

          ТС-канон — другая зона (packages/skin), не эта заявка. Синхронизация между зонами —
          через architect, не самостоятельная догадка овнера backend по чужому файлу.

      - id: bbolt-byte-invariant
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "bbolt-хранилище остаётся байтовым — типизация только на границе API, не в сторе"
        description: |
          Решено (2026-09-09): само хранилище (bbolt) НЕ переписывается на типизированные записи —
          инвариант "byte in, byte out" там уместен и без типизации, миграция данных не нужна.
          Типизация встаёт на границе API: на запись конверт валидируется по зарегистрированной в
          `kinds-registry` структуре вида (вместо сегодняшнего "state обязателен, содержимое не
          смотрим"); на чтение GraphQL резолвит уже типизированные поля, а не отдаёт `state` как
          есть (см. `gqlgen-schema-preset-interface`). Сам bbolt между записью и чтением ничего не
          знает о типах — как и сегодня.

  - category: Профили потребителей, под которые считается схема
    items:
      - id: mcp-surgical-reads
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "MCP-агент: точечные запросы, не батч"
        description: |
          Слова user: "для мсипи свой флоу — агент лучше сделать много мелких запросов, только то
          что ему нужно в данный момент". Схема не должна ПРИНУЖДАТЬ агента тянуть смежные поля,
          которые он не просил, — точность важнее числа round-trip'ов.

      - id: showcase-page-batch
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Витрина: один запрос на страницу компонента, не N+1"
        description: |
          Слова user: "для витрины свой флоу — нам не надо делать миллион запросов, нам надо
          сделать несколько в рамках страницы". Один GraphQL-запрос должен закрывать всё, что
          сегодня набирает `componentInfo()` за 32 запроса (см. `finding-component-info` в корневом
          ROADMAP.yaml) — формы и наряды для компонента одним ответом.

      - id: runtime-wear-once
        type: feature
        status: Backlog
        priority: Low
        milestone: null
        name: "Рантайм-клиент: один аутфит, резолвнутый, один раз"
        description: |
          Слова user: клиент, который "просто юзает пресеты чтобы себя один раз стилизовать и
          забыть, максимум сменить аутфит". Самый лёгкий профиль — один запрос за одним
          полностью резолвленным нарядом, без сопутствующих полей витрины/агента.

      - id: presets-component-filter
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "presets(kind, component) — сузить выдачу до нужных компонентов, не всего аутфита"
        description: |
          Откуда взялась: симптом, который описал user, разбирая профиль `runtime-wear-once`
          (рантайм-клиент `packages/skin/src/presets/source.ts`, `createPresetsSkinSource`).
          Слова user дословно: "Представим ситуацию: у нас аутфит омнифилд, это базовый аутфит,
          в нём формы под все компоненты, под них куча вариантов. Приложение А юзает аутфит
          омнифилд, но не юзает и половины того, что в этом аутфите есть. Одному приложению не
          нужно сто вариантов таблицы, ему возможно вообще таблица не нужна. Или момент с
          перформансом — у меня на странице отрисовывается форма из пяти инпутов и кнопки, зачем
          мне на ней другие компоненты? Даже если в аутфите нет лишних компонентов, всё равно мне
          на странице формы надо загрузить только скины для инпута и кнопки."

          Сегодня `source.ts`'s `css()` зовёт `client.list(PRESET_KIND.form)` без фильтра —
          ВСЕ формы всех компонентов аутфита уезжают клиенту одним списком, дальше клиент режет
          сам (см. `client-graphql-transport` в `packages/skin/ROADMAP.yaml` — там уже назван
          этот же класс "два обращения там, где по смыслу одно", здесь та же болезнь на уровне
          не количества запросов, а объёма одного ответа). Движок генерации CSS
          (`generateSkinCss`/`assemble`, `packages/skin/src/engine/generate`) при этом сам
          ничего "всего" не требует — на вход идёт произвольный массив `forms`, правила CSS
          считаются только по тем формам, что в нём передали. Базовые вещи (переменные палитры,
          шрифт, кейфреймы) считаются от палитры/аутфита целиком и грузиться должны всегда — это
          НЕ по компонентам, сужать нужно только per-component формы/варианты. Значит упирается
          именно в источник данных — эту заявку — не в движок.

          Что уже проверено архитектором в схеме/сторе (чтением кода, не гадая):
          - `type Form implements Preset` несёт `component: String!` (`internal/graphql/
            schema.graphql`), так же `Assembly`/`Content` — три вида, у которых "компонент" есть
            как понятие. `Palette`/`Outfit`/`Tag` этого поля не несут вовсе.
          - `model.Meta` (`internal/model/model.go`) — то, что видит `store.List(kind)` —
            НЕ несёт `Component`. Поле `Component` живёт только внутри типизированного `state`
            (`internal/kinds.Form`/`ComponentAssembly`), декодируется резолвером через
            `convert.go` ПОСЛЕ `GetMany`, не на уровне `store.List`.
          - Значит фильтр по компоненту нельзя завести внутри `store.List` без нарушения
            `bbolt-byte-invariant`/PROBEWEB-8 ("ЧТО лежит внутри state — не дело стора", см.
            комментарий `store.go`) — стору пришлось бы начать заглядывать в содержимое, чтобы
            отобрать по компоненту. Естественное место — РЕЗОЛВЕР (`Presets` в
            `schema.resolvers.go`), ПОСЛЕ декодирования записей в типизированные
            `model.Preset` (тот же шаг, что уже делает `convert.go`): там `Component` уже
            доступен как поле Go-структуры для Form/Assembly/Content, отбор — обычный `if`,
            стор не тронут и не начинает понимать содержимое.

          Контракт (предлагается, не диктуется — овнер решает по факту реализации):
          `presets(kind: String, component: [String!]): [Preset!]!` — новый необязательный
          аргумент, список (не одна строка): user в примере просит сразу несколько компонентов
          одной страницы (инпут + кнопка). Совпадение — ЛЮБОЙ компонент из списка (OR, не AND).
          Смысл только для видов, у которых есть `component` (Form/Assembly/Content) — если
          `component` задан, а `kind` не Form/Assembly/Content (или не задан вовсе), записи
          видов без этого поля (Palette/Outfit/Tag) в фильтр не попадают, не ошибка. `kind` и
          `component` независимы — оба optional, оба можно комбинировать или задавать по
          отдельности, как сегодня работает один `kind`.

          В объём ЭТОЙ заявки НЕ входит: правка клиента (`packages/skin/src/presets/client.ts`)
          — она заведена отдельным пунктом в `packages/skin/ROADMAP.yaml`
          (`presets-client-component-filter`) и зависит от формы, которую здесь выберет овнер
          backend — контракт согласуется через architect, когда шаг здесь будет сделан, не
          раньше. Также не входит: прокидывание "какие компоненты нужны странице" из
          `source.ts`/`SkinSource.css()` выше по цепочке приложений — это либо продолжение
          `runtime-wear-once`, либо отдельная заявка, когда дойдёт очередь.

  - category: Фидбэк — отдельная сущность, не вид пресета
    items:
      - id: feedback-bucket-and-type
        type: feature
        status: Done
        priority: Medium
        milestone: null
        name: "Фидбэк — свой bbolt-бакет и свой GraphQL-тип, НЕ Preset/kinds-registry"
        description: |
          Решение user дословно: фидбэк "не про скин мсипи, а про любой фидбэк" — сущность
          общая на все продукты, не дизайн-пресет skin. При этом том/процесс не плодим второй раз:
          у backend/presets уже есть развёрнутый bbolt + смонтированный том, довод user — "логичнее
          хранить фидбэк на том же томе и бэке", раз инфраструктура уже решена здесь.

          Разделение — не по инфраструктуре (та общая), а по модели: третий bbolt-бакет (рядом с
          сегодняшними `bucketMeta`/`bucketState` в `internal/store/store.go`), СВОИ методы на
          `Store` (список/чтение/запись/пометка решённым) — без прохождения через
          `internal/kinds`/`validateState`. Фидбэку не нужна типизированная Go-структура канона —
          он "читается вручную" (слова user), не резолвится программно другим сервисом.

          В схеме — свой тип (например `FeedbackEntry`), свои `Query`/`Mutation`, СВОЙ резолвер —
          НЕ реализует интерфейс `Preset`, не смешивается с шестью видами `kinds-registry`. Форма
          записи сегодня (по живому коду потребителя, канона в TS нет — тем же приёмом, что раньше
          `Tag`): `{tool, action, expected?, actual, sign, at, status}`.

          Открытый вопрос, НЕ решается в этом файле: поле "какой продукт/сервер" в форме записи —
          сегодня есть только `tool` (имя ручки), не видно, чей это MCP. Раз сущность становится
          общей на несколько продуктов, различать источник может понадобиться — решать при
          проектировании точной формы, не здесь заранее.

          Сервис перестаёт быть только "про пресеты скина" — README.md стоит поправить, когда
          пункт будет сделан, назвать это честно (пресеты + фидбэк), не молчать про второй смысл.

  - category: Виды кормушки — заявка зоны interfaces/feeder
    items:
      - id: feeder-kinds
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Три новых вида: `api`, `adapter`, `menu` — записи движка кормления"
        description: |
          Заявка зоны `interfaces/feeder` (движок «откуда компонент берёт данные»), согласована с
          user 2026-09-20. Три вида заводятся тем же способом, что задуман в `kinds-registry`: по
          файлу в `internal/kinds/`, Go-структура `state` + регистрация, плюс свой тип в
          `schema.graphql`. Правок существующих видов и резолверов не требуется.

          **`api` — документ описания чужого API.** Хранится НЕ сырьё (свагер), а уже разобранный
          формат зоны: `{ endpoints, groups, defs }`, где ручка это
          `{ id, method, url, groupId?, params }`, группа — `{ id, name }`. Внутри `params[].schema`
          и `defs` лежит произвольная JSON Schema — это ровно случай
          `recipe-assembly-json-scalar-boundary`: именованное JSON-поле, без раскладки до листьев.
          Связей на другие записи у вида нет, отбирать по чему-либо кроме `kind` не требуется.
          Машинное имя виду НЕ нужно: эти записи выбирает глазами человек в списке, `name` у
          конверта и так необязателен, человеческое имя едет в `label`.

          Важное про область применения (решение user 2026-09-20): `api` — фича ВИТРИНЫ. Человек
          завёл ручки своего бэка и наполняет компонент витрины живыми данными; в обычные
          приложения этот вид не едет вовсе. Поэтому ни связей, ни фильтров, ни профиля рантайма у
          него нет и не планируется.

          **`adapter` — шов «поставщик → потребитель».** Состав:
          `{ root, rules, extra?, providers, consumers }`. `root` — где в ответе лежит набор
          записей; `rules` — список правил перекладки (каждое со своим выданным айди);
          `providers`/`consumers` — деревья вида `{ <вид участника>: { … } }` с произвольными
          ключами. Деревья — JSON-поле, служба в них не смотрит: это витринная отметка «на этих
          проверяли через студию», а не валидация и не связь (решение user 2026-09-20). Рантайм их
          не читает вовсе — перекладка работает от `root` и `rules`.

          У этого вида машинное `name` ОБЯЗАТЕЛЬНО по смыслу: на него ссылается разметка
          приложения. Задумано так же, как вариант одевает компонент (`data-variant`): автор пишет
          `adapter="users-list"`, и компонент кормится этой записью. Маска `name` службы
          (`^[a-z0-9][a-z0-9-]{0,31}$`) под такую ссылку подходит как есть; человеческое имя,
          которое видно в списке на витрине, едет в `label`.

          **`menu` — контейнер: какие адаптеры берёт одно приложение.** Состав:
          `{ name, adapters: []string }` — имена записей вида `adapter`. Строится ровно симметрично
          наряду: `Outfit.forms` это тоже имена, и резолвится `resolveManyByName` через dataloader.
          Значит один запрос отдаёт меню вместе со всеми его адаптерами, батчем.

          Зачем контейнер вообще: приложение ставит адаптеры руками, там, где они нужны, и по имени
          — а какие именно имена ему понадобятся, заранее знает только оно само. Без контейнера
          приложению пришлось бы тянуть ВСЕ адаптеры хранилища, включая чужие. Наряд решает ровно ту
          же задачу для скина, и разводить два разных приёма под одну задачу незачем (решение user
          2026-09-20).

          Пределы под этот вид (`api`): измерено 2026-09-20 прогоном настоящего разбора зоны —
          swagger 2.0 Kubernetes весит 3.0 МБ сырья и 1.21 МБ в нашем формате (866 ручек, 577
          общих типов), то есть сегодняшний `PRESETS_MAX_RECORD_BYTES` = 1 МиБ уже пробит первым
          же крупным настоящим API. Это НЕ работа по коду: оба предела — переменные окружения,
          поднимаются на стенде. Заявку на стенд user отдаёт сам; здесь названо, чтобы вид не
          завели под предел, в который он не помещается.

      - id: presets-by-name
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Отбор по имени в `Query.presets` — корневого доступа по имени у службы нет"
        description: |
          Найдено при разборе заявки кормушки 2026-09-20, решение user — добавить. Внутри себя
          служба по именам ходит давно (`resolveByName`/`resolveManyByName` — так резолвятся
          `Outfit.palette`/`forms`/`tags`), а снаружи корневого доступа по имени нет: есть
          `preset(id)` и `presets(kind, component)`. Значит «дай запись с именем X» сегодня
          выражается как «вытащи все записи вида и найди свою» — у кого угодно, включая скин: даже
          наряд по имени взять нечем, хотя рантайм оперирует именно именем (`wear("omnifield")`).

          Кому нужно: приложение грузит своё `menu` по имени, компонент ссылается на `adapter` по
          имени, а айди в сборке нет вовсе — записи туда едут файлом, как скин. Это же закрывает
          дыру профиля `runtime-wear-once` из этого файла.

          Контракт предлагается, не диктуется — овнер решает по факту: `name: [String!]` рядом с
          `component`, совпадение по ЛЮБОМУ из списка, `nil` (аргумент не задан) отличается от
          пустого списка ровно так же, как уже сделано в `presets-component-filter`. Список, а не
          одна строка, потому что приложению бывает нужно несколько записей разом. В отличие от
          `component`, имя живёт в `model.Meta` — то есть отбор возможен и до декодирования `state`;
          где его ставить (в сторе или в резолвере, как `component`), решает овнер, инвариант
          «byte in, byte out» при этом не задевается ни там, ни там.

      - id: client-supplied-id
        type: feature
        status: Done
        priority: High
        milestone: null
        name: "Служба принимает айди от клиента, а не перебивает своим"
        description: |
          Решение user 2026-09-20. Сегодня айди выдаёт только служба (`newID`,
          `internal/store/store.go`), в конверте `PresetInput` поля `id` нет. Для кормушки это
          создаёт второй источник правды: запись там рождается локально, ДО всякой сети, и на неё
          сразу ссылаются другие записи — дерево поставщиков адаптера адресует документ схемы его
          айди. Если на первом сохранении служба выдаст свой, на одну запись станет два айди, и
          ссылки начнут врать молча.

          Формат приводить не нужно — он уже общий: служба генерит UUID v4, клиент тоже
          (`crypto.randomUUID`).

          Форма — на усмотрение овнера, обе половины у службы уже есть:
          либо необязательный `id` в `PresetInput`, который `createPreset` уважает;
          либо `replacePreset(id, input)` получает семантику «создать, если такой записи нет» —
          тогда клиент всегда зовёт одно и то же со своим айди, не думая, первая это запись или
          десятая, а сохранение становится идемпотентным.

          Отдельное требование, которое приходит вместе с этим: раз айди приезжает снаружи, служба
          обязана его проверять — формат и занятость. Сегодня такой проверки нет, потому что айди
          рождался внутри и не мог быть кривым.

          Альтернативу «клиент подменяет локальный айди на бэковский после сохранения» разобрали и
          отвергли: подмена означает переписать в тот же момент все ссылки на запись (они лежат
          внутри других записей), а для того, что уже уехало в сборку файлом, — невозможна вовсе.

  - category: Дальше по цепи (другая зона, не эта заявка)
    items:
      - id: query-graphql-client-module
        type: feature

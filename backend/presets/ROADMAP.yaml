  - id: batching-measured-not-code-read
    type: plan
    date: 2026-09-09
    summary: >
      Реализация всех шести пунктов (graphql-endpoint, no-server-side-n-plus-one,
      component-graph-scope, kinds-registry, canon-drift-author-tags-assembly,
      recipe-assembly-json-scalar-boundary, gqlgen-schema-preset-interface, bbolt-byte-invariant)
      закончена и принята architect-ревью — с одной оговоркой: утверждение "N+1 не переехал на
      сервер" стояло на чтении кода dataloadgen (что он ДОЛЖЕН схлопывать конкурентные вызовы), не
      на измерении — тот же разрыв code-read vs measured, из-за которого весь этот разговор начался
      в корневом ROADMAP.yaml. Закрыто тем же заходом: `internal/graphql/batching_test.go` гоняет
      реальный GraphQL-запрос через httptest-сервер со считающей обёрткой хранилища
      (`countingStore`) и сверяет число вызовов `store.List`/`GetMany` при N=5 и N=50 нарядов —
      числа совпадают (3 List + 2 GetMany, не растёт с N). Для этого `internal/graphql` и
      `internal/graphql/loaders` перестали видеть хранилище как конкретный `*store.Store` и
      получили узкий интерфейс (`graphql.Store`, встраивающий `loaders.Store`) — минимальный рефактор
      ради тестируемости, `cmd/presets` не тронут (структурная типизация). README.md/FAQ.md
      обновлены под оба изменения. Сборка/тесты/`-race` зелёные (43 теста, 5 файлов). Дальше по
      ROADMAP.yaml — architect ведёт коммит/ветку/PR; следующий шаг всей цепи (не эта зона) —
      `packages/query` GraphQL-клиент.

  - id: recipe-assembly-scope-cut
    type: plan
    date: 2026-09-09
    summary: >
      Вторая находка овнера перед написанием Go-структур (первая — `canon-drift-found-before-
      structs` ниже) — на этот раз не расхождение канона, а вопрос глубины типизации. `Form.recipe`
      (`SlotRecipe`) и `ComponentAssembly.assembly` (`PassportAssembly`) — рекурсивные деревья с
      открытыми ключами (произвольный CSS-in-JS по партии/состоянию, граф сборки на 91 строку),
      разложить которые до листовых GraphQL-полей значило бы второй раз построить в Go всю модель
      `packages/skin/engine/recipe`+`engine/passport/assembly` — недели работы ради полей, которые
      сами не создают N+1 (не ссылаются на другие записи). Овнер предложил границу: типизировать
      связи и плоские скаляры верхнего уровня, оставить `recipe`/`keyframes`/`assembly`
      именованным JSON-скаляром внутри типа. Проверено architect чтением исходников
      (`recipe/slot.ts`, `PartStyles<Part>` действительно открытая структура — даже полная
      декомпозиция упёрлась бы в JSON-скаляр на нижнем уровне) и согласовано: см.
      `recipe-assembly-json-scalar-boundary` в категории "Переход на GraphQL".

  - id: canon-drift-found-before-structs

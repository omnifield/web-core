    date: 2026-09-09
    summary: >
      Овнер, прежде чем писать Go-структуры видов, сверил план с реальным кодом/продом (та же
      привычка, что уже раз ловила расхождение на пресетах) и нашёл три места разъезда: вид
      `assembly` (написан и живёт в проде, `apps/skin/.mcp` + `packages/skin`, просто 0 записей на
      проде сегодня — не то же самое, что будущие "сборки-композиции") не был назван в плане;
      `author` подмешивается MCP в state ЛЮБОГО вида при сохранении, но явно объявлен только в
      `ContentState`; `Outfit.tags` подмешивается MCP так же, а в интерфейсе `Outfit` не объявлен
      вовсе. Вопрос был — заводить строгие Go-структуры один-в-один по объявленным TS-интерфейсам
      (тогда typed-валидация начнёт бить существующие живые записи с этими полями) или обходить
      отдельным путём. Решение user дословно: "давай ничего не обходить! все делаем нормально!" —
      порядок зафиксирован в `canon-drift-author-tags-assembly` и `kinds-registry`: сначала
      правится TS-канон (`packages/skin/src/engine/look/types.ts`, другая зона), потом Go-структуры
      пишутся зеркально к исправленному канону.

  - id: kinds-registry-and-schema-shape
    type: plan
    date: 2026-09-09
    summary: >
      Уточнение к `graphql-decision` ниже: как именно типизация встаёт на границе службы.
      Типизация — общий механизм (`internal/kinds/`, по файлу на вид, карта `kind → тип`), заведён
      с первого дня под нескольких владельцев видов, не только skin — сегодня в него заводится
      первый набор (outfit/palette/form/content/tag), tables позже заведёт свой `filter` тем же
      способом, новым файлом, без правки остального. bbolt-хранилище остаётся байтовым
      сознательно ("byte in, byte out" уместен и без типизации, миграция данных не нужна) —
      типизация только на границе API: валидация конверта на запись по зарегистрированной
      структуре вида, типизированный резолв на чтение вместо голого `state`. Сверху —
      gqlgen-схема: общий интерфейс `Preset` (id/label/name/description/kind/savedAt) + пять
      конкретных типов по видам реестра, резолверы поверх существующего store, dataloader на
      связях между типами — чтобы N+1 не переехал внутрь резолвера (см. `no-server-side-n-plus-one`).

  - id: graphql-decision
    type: plan
    date: 2026-09-09
    summary: >
      Обсуждение началось с симптома (задержка смены компонента в витрине, см. корневой
      ROADMAP.yaml) и переросло в архитектурное решение: примитивная пара «список id / запись по
      id» не тянет растущий граф связей компонента (варианты, сборки, дока, примеры, моки, автор) и
      двух новых узлов на подходе (пресеты-фильтры, сборки-композиции), у каждого из которых будут
      свои связи с автором и вариантами. Решено: REST с параметрами как промежуточный шаг не
      делаем — клиентов всё равно переписывать, а схема GraphQL аддитивна и не требует ждать, пока
      появятся все узлы графа. Явно зафиксирована ловушка: N+1 не исчезает от смены протокола, без
      dataloader'а в резолверах он просто переезжает на сервер. Порядок работ (три отдельные зоны):
      этот файл (backend/presets) → packages/query (клиент) → точечный переезд потребителей
      (витрина, MCP, рантайм). Дальше по этому файлу работает овнер backend/presets, ход обсуждают
      с architect по мере продвижения.

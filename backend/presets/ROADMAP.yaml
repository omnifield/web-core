log:
  - id: feeder-kinds-done
    type: plan
    date: 2026-09-20
    summary: >
      Три вида заведены тем способом, под который реестр и задумывался: по файлу в
      `internal/kinds/` (`api.go`/`adapter.go`/`menu.go`) плюс свой тип в `schema.graphql` — ни одной
      правки в существующих видах и резолверах. Единственный код сверх этого — полевой резолвер
      `Menu.adapters`, и он появился не потому, что реестру чего-то не хватило, а потому, что у
      этого вида есть связь на другие записи.

      Формы сверены с живым кодом зоны, не с пересказом (та же привычка, что раньше поймала
      `canon-drift-author-tags-assembly`): `SchemaDocument` и `Adapter` прочитаны в
      `interfaces/feeder/src/entities/{openapi,adapter}/models/types.ts`, `FieldRule`/`ExtraPolicy`
      — в `packages/io`. У `menu` канона в TS сегодня нет вовсе — форма взята из описания пункта
      (`{name, adapters}`), тем же приёмом, что когда-то `Tag`.

      Граница типизации — по решению user 2026-09-20 из двух чтений заявки выбрано каноничное для
      зоны: типизируются связи и плоские скаляры верхнего уровня (`Adapter.root`/`extra`,
      `Menu.adapters`), вложенные структуры (`Api.endpoints`/`groups`/`defs`,
      `Adapter.rules`/`providers`/`consumers`) едут именованными JSON-полями. Довод сверх общего
      правила: раскладка на поля схемы сделала бы службу лоссовым звеном — поле, добавленное
      владельцем формата, переставало бы доезжать до его же потребителя, пока схему не поправят
      здесь (FAQ.md, «Виды движка кормления»).

      `name` у `adapter`/`menu` служба НЕ требует, хотя по смыслу оно обязательно: это правило
      владельца вида, не хранилища — `Outfit.forms` тоже резолвятся по имени, и служба его не
      требует. Kind-специфичной ветки в проверке конверта заводить не стал — она была бы первым
      местом, где служба знает смысл конкретного вида.

      7 новых проб: реестр (три вида зарегистрированы и разбираются по своим формам), резолвер
      (`Menu.adapters` резолвится по имени и тихо пропускает ссылку в никуда, документ `api`
      доезжает целиком, вместе с полем, о котором служба ничего не знает) и ИЗМЕРЕНИЕ батчинга новой связи
      (`TestMenuAdaptersBatchAcrossMenus`: 2 `List` + 2 `GetMany` и при 5, и при 50 меню). Живой
      прогон curl по всем трём видам. Сборка/`go vet`/тесты/`-race` зелёные.

      Пределы под `api` в работу не входили и не тронуты: `PRESETS_MAX_RECORD_BYTES` = 1 МиБ по
      умолчанию мал для настоящего крупного API (~1.2 МБ на swagger Kubernetes по замеру зоны
      кормушки) — это переменная окружения, поднимается на стенде тем, кто разворачивает. В
      README.md названо рядом с настройкой, чтобы не выглядело забытым.

  - id: presets-by-name-done
    type: plan
    date: 2026-09-20
    summary: >
      presets-by-name реализован по контракту, предложенному в описании пункта:
      `presets(kind: String, component: [String!], name: [String!]): [Preset!]!`, совпадение по
      ЛЮБОМУ имени из списка, `nil` отличается от пустого списка ровно так же, как у `component`.
      Отличие одно и названо в схеме: безымянная запись в отбор по имени не попадает — её нечем
      адресовать.

      Отбор встал в резолвере, но ДО чтения записей: имя живёт в `model.Meta`, значит видно уже в
      перечне `store.List`, и в батч `GetMany` едут только названные — экономится сама работа
      чтения, а не только объём ответа (у `component` так нельзя, он внутри `state`). Стор не
      тронут, byte-инвариант не задет. Общая часть обоих отборов вынесена в `wantedSet`
      (`wanted_set.go`) — прежний `componentSet` был ею же, дублировать его под имя незачем.

      3 новых пробы резолвера (OR по списку разных видов, `kind` сужает одно имя в двух видах,
      безымянная запись и пустой список). Живой прогон curl. Сборка/`go vet`/тесты/`-race`
      зелёные. README.md (Анатомия, IO выход, пример чтения по имени) и FAQ.md (новый раздел
      «Почему отбор по имени стоит ДО чтения записей») обновлены.

  - id: client-supplied-id-done
    type: plan
    date: 2026-09-20
    summary: >
      client-supplied-id закрыт первой из двух названных в пункте форм: необязательный `id` в
      `PresetInput`, который уважает `createPreset`. Upsert-семантику у `replacePreset` разобрал и
      не взял — она стирает разницу между «записи ещё нет» и «записи больше нет»: сегодняшний отказ
      замены на пропавший айди это единственный сигнал потребителю, что запись убрали, а upsert
      вернул бы «успешно» и завёл её заново молча (FAQ.md, «Почему служба принимает айди от
      клиента»).

      Форма айди проверяется в конверте (`normalizeInput`, `envelope.go` — канонический UUID
      строчными, 8-4-4-4-12), занятость — в `store.Create` ВНУТРИ той же транзакции `Update`, что и
      сама запись: проверка отдельным чтением пропустила бы две одновременные укладки одного айди.
      Новая ошибка `store.IDTakenError` — отдельно от `NameTakenError` (имя уникально в пределах
      вида, айди — ключ всего хранилища). `replacePreset` с чужим айди в конверте отказывает, со
      своим же — работает: клиент всегда шлёт запись целиком и не должен вырезать из неё айди.

      6 новых проб: store (айди клиента сохраняется, занятый отбивается не задев чужую запись, 20
      одновременных укладок одного айди оставляют ровно одну) + резолвер (айди клиента доживает до
      чтения, повторный отбивается, кривая форма отбивается до store, чужой айди в замене
      отбивается, свой проходит). Сборка/`go vet`/тесты/`-race` зелёные. README.md (Анатомия, IO
      вход, Состояния, пример укладки со своим айди) и FAQ.md (новый раздел) обновлены.

  - id: presets-component-filter-done
    type: plan
    date: 2026-09-11
    summary: >
      presets-component-filter реализован по контракту, предложенному в описании пункта:
      `presets(kind: String, component: [String!]): [Preset!]!` — SDL-аргумент добавлен, gqlgen
      перегенерирован (`go run github.com/99designs/gqlgen generate`). Фильтр встал в резолвере
      `Presets` (`schema.resolvers.go`), ПОСЛЕ декодирования записей в типизированные
      `model.Preset` (тем же шагом, что уже делает `convert.go`) — store не тронут, byte-инвариант
      не нарушен. `componentSet`/`matchesComponent`: `nil` срез аргумента отличается от пустого
      (`[]`) — nil значит "фильтр не задан" (все виды проходят), пустой список — осознанное
      "ничего не подошло" (пустая выдача). Совпадение — OR по списку. Виды без поля `component`
      (`Palette`/`Outfit`/`Tag`) при заданном фильтре молча исключаются — не ошибка, часть
      контракта, названная в описании пункта заранее. `kind`/`component` независимы и
